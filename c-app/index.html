.h>\n#include <stdio.h>\n\nvoid printb(uint8_t x) {\n    char buf[9];\n    for (size_t i = 0; i < 8; i++) {\n        uint8_t y = x & (1 << i);          // keep only bit i\n        buf[7 - i] = (y > 0) ? '1' : '0';  // bit 0 goes at the right end\n    }\n    buf[8] = '\\0';\n    printf(\"%s\\n\", buf);\n}\n\nint main(void) {\n    printb(18);\n    printb(255);\n    printb(128);\n    return 0;\n}","caption":"printb.c: the notebook's function, with comments"},{"type":"code","code":"$ gcc -std=c17 -Wall -o printb printb.c\n$ ./printb\n00010010\n11111111\n10000000"},{"type":"md","text":"How it works: for each bit number `i` from 0 to 7, `x & (1 << i)` keeps only bit `i`, so `y` is non-zero exactly when that bit is 1. Bit 0 is the **rightmost** bit, so it is written at the **end** of the string, `buf[7 - i]`. Finally `buf[8] = '\\0'` ends the string. Another way to get bit `i` as 0 or 1 is `(x >> i) & 1`."},{"type":"try","text":"Change `printb` to print 16 bits (`uint16_t`, a 17-element buffer, `buf[15 - i]`) and print 1000. You should see `0000001111101000`."},{"type":"md","text":"### Key points\n\n- `(1u << n) - 1` is a mask of `n` ones at the right end.\n- Extract: `(x >> pos) & mask`. Pack: `(a << 16) | (b << 8) | c`.\n- Replace a field: `x = (x & ~(mask << pos)) | (value << pos)`: clear first, then OR.\n- A leading `0` makes an octal constant (`0754`); `%o` prints octal; one octal digit = 3 bits, one hex digit = 4 bits.\n- `printb` tests bit `i` with `x & (1 << i)` and writes it at `buf[7 - i]`; `c ? a : b` picks `a` when `c` is true."}]},{"id":"c10-floats","title":"Floating point: precision, comparing, and printing","notebook":"c/floats.ipynb","priority":"high","examNote":"Past finals use floating point inside bigger questions: April 2022 Q4(a) stores a weight as a floating-point member of a struct, Q3(a)(ii) allocates an array of `float`, and Q5(c) asks for an `is_zero` test on a `double`. Know `float` vs `double`, why `==` is risky, and the `%f`/`%e`/`%g` conversions.","blocks":[{"type":"md","text":"### Three floating-point types\n\nC has `float`, `double` and `long double` (notebook). On our machines they use the IEEE 754 formats, like Java's `float` and `double`:\n\n| Type | Size here | Reliable decimal digits | Constant |\n|---|---|---|---|\n| `float` | 4 bytes | about 6 (`FLT_DIG`) | `0.1f` (suffix `f`) |\n| `double` | 8 bytes | about 15 (`DBL_DIG`) | `0.1` (no suffix) |\n| `long double` | 16 bytes on x86-64 | more | `0.1L` |\n\nThe limits are constants in `<float.h>`. **Use `double`** unless you have a reason not to: it is the type of plain constants like `0.1`, and the math functions (`sqrt`, `pow`, `fabs`) take and return it. A `float` passed to `printf` is converted to `double`, so `%f` prints both."},{"type":"code","code":"#include <float.h>\n#include <stdio.h>\n\nint main(void) {\n    printf(\"float:       %zu bytes, about %d digits\\n\", sizeof(float), FLT_DIG);\n    printf(\"double:      %zu bytes, about %d digits\\n\", sizeof(double), DBL_DIG);\n    printf(\"long double: %zu bytes\\n\", sizeof(long double));\n\n    float f = 1.0f / 3.0f;     // the f suffix makes a float constant\n    double d = 1.0 / 3.0;      // no suffix: a double constant\n    printf(\"%.20f\\n\", f);\n    printf(\"%.20f\\n\", d);\n    return 0;\n}","caption":"sizes.c: float versus double"},{"type":"code","code":"$ gcc -std=c17 -Wall -o sizes sizes.c\n$ ./sizes\nfloat:       4 bytes, about 6 digits\ndouble:      8 bytes, about 15 digits\nlong double: 16 bytes\n0.33333334326744079590\n0.33333333333333331483"},{"type":"md","text":"The `float` is wrong after 7 digits; the `double` after 16. A floating-point number stores a fixed number of **binary** digits (24 for `float`, 53 for `double`) plus an exponent, so every value is rounded to the nearest number it *can* store."},{"type":"md","text":"### Why 0.1 + 0.2 is not 0.3\n\nIn decimal, 1/3 = 0.3333... never ends, so any fixed number of digits is a little wrong. In **binary**, 1/10 never ends either (0.000110011001100...). So `0.1`, `0.2` and `0.3` are each stored as the *nearest* double, and the tiny errors do not cancel:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    double a = 0.1 + 0.2;\n    printf(\"%f\\n\", a);          // 6 digits: looks fine\n    printf(\"%.17f\\n\", a);       // 17 digits: the truth\n    printf(\"%.17f\\n\", 0.3);\n    if (a == 0.3) {\n        printf(\"equal\\n\");\n    } else {\n        printf(\"not equal\\n\");\n    }\n    return 0;\n}","caption":"point3.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o point3 point3.c\n$ ./point3\n0.300000\n0.30000000000000004\n0.29999999999999999\nnot equal"},{"type":"md","text":"`%f` rounds to 6 digits and hides the problem. The sum and the constant `0.3` are two *different* doubles, so `==` says no. Errors also build up in loops. Adding 0.1 ten times does not give exactly 1.0:"},{"type":"code","code":"#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double sum = 0.0;\n    for (int i = 0; i < 10; i++) {\n        sum += 0.1;\n    }\n    printf(\"sum = %.17f\\n\", sum);\n    printf(\"sum == 1.0 ? %d\\n\", sum == 1.0);\n    printf(\"close to 1.0 ? %d\\n\", fabs(sum - 1.0) < 1e-9);\n    return 0;\n}","caption":"tenths.c: compare with a tolerance"},{"type":"code","code":"$ gcc -std=c17 -Wall -o tenths tenths.c -lm\n$ ./tenths\nsum = 0.99999999999999989\nsum == 1.0 ? 0\nclose to 1.0 ? 1"},{"type":"md","text":"### Comparing with a tolerance\n\nDo not ask \"are they equal?\". Ask \"are they **close enough**?\": is the distance between them at most a small **tolerance** (also called *epsilon*)?\n\n```c\nif (fabs(a - b) <= 1e-9) { ... }   // fabs = absolute value of a double, <math.h>\n```\n\n`1e-9` is C's scientific notation for 1 × 10^−9. Choose the tolerance to suit your numbers: 1e-9 is fine for values near 1, but for values near a billion the rounding error alone is bigger than that. Then a **relative** test works better: `fabs(a - b) <= 1e-9 * fmax(fabs(a), fabs(b))`. You can put the test in a function:"},{"type":"code","code":"#include <math.h>\n#include <stdbool.h>\n#include <stdio.h>\n\n// true if a and b differ by at most tol\nbool close_enough(double a, double b, double tol) {\n    return fabs(a - b) <= tol;\n}\n\nint main(void) {\n    double a = 0.1 + 0.2;\n    printf(\"%d\\n\", a == 0.3);\n    printf(\"%d\\n\", close_enough(a, 0.3, 1e-9));\n    printf(\"%d\\n\", close_enough(1.0, 1.001, 1e-9));\n    return 0;\n}","caption":"close.c: a reusable test (bool comes from <stdbool.h>)"},{"type":"code","code":"$ gcc -std=c17 -Wall -o close close.c -lm\n$ ./close\n0\n1\n0"},{"type":"check","q":"`float f = 16777217;` (that is 2^24 + 1). What does `printf(\"%f\\n\", f);` print, and why?","a":"`16777216.000000`. A `float` has only 24 binary digits, and 2^24 + 1 needs 25, so it is rounded to the nearest float, 2^24. A `double` (53 binary digits) prints `16777217.000000`. Large whole numbers lose precision too, not only fractions."},{"type":"pitfall","text":"Never control a loop with `==` or `!=` on a double: `for (double x = 0.0; x != 1.0; x += 0.1)` never stops, because `x` jumps from 0.99999999999999989 to 1.09999999999999987. Count with an `int` and compute `x = i / 10.0`, or test `x < 1.0`."},{"type":"md","text":"### Printing: `%f`, `%e`, `%g`\n\n| Conversion | Style | 1234.5678 prints |\n|---|---|---|\n| `%f` | fixed point, 6 digits after the point | `1234.567800` |\n| `%e` | scientific: one digit, point, 6 digits, `e`, exponent | `1.234568e+03` |\n| `%g` | the shorter of the two styles, 6 **significant** digits, trailing zeros removed | `1234.57` |\n\nA precision `.n` means *n digits after the point* for `%f` and `%e`, but *n significant digits* for `%g`. `%g` switches to `e` style when the exponent is below −4 or at least the precision."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    double x = 1234.5678;\n    printf(\"%f | %e | %g\\n\", x, x, x);\n    printf(\"%.2f | %.2e | %.2g\\n\", x, x, x);\n    double y = 0.000012;\n    printf(\"%f | %e | %g\\n\", y, y, y);\n    double z = 2.5;\n    printf(\"%f | %e | %g\\n\", z, z, z);\n    return 0;\n}","caption":"formats.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o formats formats.c\n$ ./formats\n1234.567800 | 1.234568e+03 | 1234.57\n1234.57 | 1.23e+03 | 1.2e+03\n0.000012 | 1.200000e-05 | 1.2e-05\n2.500000 | 2.500000e+00 | 2.5"},{"type":"check","q":"What do `printf(\"%.1e\\n\", 0.00456);` and `printf(\"%g\\n\", 3.0);` print?","a":"`4.6e-03` (one digit after the point, rounded) and `3` (`%g` drops the trailing zeros and the point)."},{"type":"md","text":"### Infinity and not-a-number\n\nFloating-point division by zero does not crash. The notebook's `special_floats.c` shows the special values from `<math.h>`: `1.0 / 0.0` is `INFINITY` (printed `inf`), and `0.0 / 0.0` is **NaN**, *not a number* (printed `nan` or `-nan`). Test them with `isinf(x)` and `isnan(x)`. A NaN is not equal to anything, **not even itself**, so `d == NAN` is always false (message 3 is never printed):"},{"type":"code","code":"#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double d = 1.0 / 0.0;\n    if (d == INFINITY) {\n        puts(\"1. d is infinite\");\n    }\n    if (isinf(d)) {\n        puts(\"2. d is infinite\");\n    }\n    \n    d = 0.0 / 0.0;\n    if (d == NAN) {\n        // d == NAN is never true according to IEEE754\n        puts(\"3. d is not a number\");\n    }\n    if (isnan(d)) {\n        puts(\"4. d is not a number\");\n    }\n    printf(\"%f %f\\n\", 1.0 / 0.0, -1.0 / 0.0);\n    return 0;\n}","caption":"special_floats.c (notebook), plus one printf"},{"type":"code","code":"$ gcc -std=c17 -Wall -o special_floats special_floats.c -lm\n$ ./special_floats\n1. d is infinite\n2. d is infinite\n4. d is not a number\ninf -inf"},{"type":"pitfall","text":"This is only for floating point. Integer division by zero (`1 / 0` with `int`s) is **undefined behaviour**; on our machines it usually kills the program."},{"type":"md","text":"### Key points\n\n- `float` (4 bytes, ~6 digits, constant `0.1f`), `double` (8 bytes, ~15 digits, constant `0.1`), `long double`. Prefer `double`.\n- Most decimal fractions (0.1, 0.2, 0.3) cannot be stored exactly in binary, so `0.1 + 0.2 != 0.3`.\n- Compare with a tolerance: `fabs(a - b) <= tol` (relative: `tol * fmax(fabs(a), fabs(b))`). Never loop with `!=` on a double.\n- `%f` fixed, `%e` scientific, `%g` shorter of the two; `.n` is digits after the point (`f`, `e`) or significant digits (`g`).\n- `1.0/0.0` is `inf`, `0.0/0.0` is NaN; use `isinf`, `isnan` (`<math.h>`, compile with `-lm` last). `NAN == NAN` is false."}]}],"flashcards":[{"id":"c10-fc-01","topic":"c10-shifts","front":"For an unsigned `x`, what are `x << k` and `x >> k` as arithmetic?","back":"`x << k` is x × 2^k (bits that go past the left end are lost); `x >> k` is x / 2^k with the fraction dropped."},{"id":"c10-fc-02","topic":"c10-shifts","front":"`uint8_t x = 23;` What do `printf(\"%d\", x << 4)` and `uint8_t y = x << 4;` give?","back":"368, because `x` is promoted to `int` before the shift. `y` is 112: storing into 8 bits keeps only the low 8 bits (368 mod 256)."},{"id":"c10-fc-03","topic":"c10-shifts","front":"Logical vs arithmetic right shift?","back":"Logical fills the left with 0s. Arithmetic fills it with copies of the sign bit, so negative numbers stay negative."},{"id":"c10-fc-04","topic":"c10-shifts","front":"What does C say about `x >> k` when `x` is a negative `int`?","back":"The result is **implementation-defined** (gcc does an arithmetic shift). Not portable: use unsigned types for bit work."},{"id":"c10-fc-05","topic":"c10-shifts","front":"Which shifts are undefined behaviour?","back":"Shifting by a negative amount or by at least the number of bits in the (promoted) value, and a signed `<<` whose result overflows."},{"id":"c10-fc-06","topic":"c10-shifts","front":"Why are `-45 >> 2` (gcc) and `-45 / 4` different?","back":"The arithmetic shift rounds down: −12. C's `/` rounds towards zero: −11."},{"id":"c10-fc-07","topic":"c10-fields","front":"How do you make a mask of `n` ones at the right end?","back":"`(1u << n) - 1`. For n = 4: 16 − 1 = 15 = `1111`."},{"id":"c10-fc-08","topic":"c10-fields","front":"Extract the `len` bits of `x` starting at bit `pos`.","back":"`(x >> pos) & ((1u << len) - 1)`: shift the field down, then mask off everything above it."},{"id":"c10-fc-09","topic":"c10-fields","front":"Replace a field of `x` with `value`.","back":"Clear, then OR: `x = (x & ~(mask << pos)) | (value << pos);`"},{"id":"c10-fc-10","topic":"c10-fields","front":"What is `0754` in C? What does `%o` do?","back":"A leading 0 makes an **octal** constant: 7×64 + 5×8 + 4 = 492. `%o` prints a number in octal."},{"id":"c10-fc-11","topic":"c10-fields","front":"What does `cond ? a : b` evaluate to?","back":"`a` if `cond` is true (non-zero), otherwise `b`. Example: `(y > 0) ? '1' : '0'`."},{"id":"c10-fc-12","topic":"c10-floats","front":"`float` vs `double`: size and precision?","back":"`float`: 4 bytes, about 6–7 significant digits. `double`: 8 bytes, about 15–16. Plain constants like `0.1` are `double`; `0.1f` is `float`."},{"id":"c10-fc-13","topic":"c10-floats","front":"Why is `0.1 + 0.2 == 0.3` false?","back":"0.1, 0.2 and 0.3 have no exact binary form, so each is rounded to the nearest double. The rounded sum is 0.30000000000000004, a different double from 0.3's 0.29999999999999999."},{"id":"c10-fc-14","topic":"c10-floats","front":"How should you compare two doubles?","back":"With a tolerance: `fabs(a - b) <= 1e-9` (or a relative tolerance for large values). Not with `==`."},{"id":"c10-fc-15","topic":"c10-floats","front":"`%f`, `%e`, `%g` for 1234.5678?","back":"`1234.567800`, `1.234568e+03`, `1234.57`."},{"id":"c10-fc-16","topic":"c10-floats","front":"What are `1.0 / 0.0` and `0.0 / 0.0`, and how do you test for them?","back":"`inf` (`INFINITY`) and NaN (not a number). Use `isinf(x)` and `isnan(x)` from `<math.h>`. `x == NAN` is always false."}],"quiz":[{"id":"c10-q-01","topic":"c10-shifts","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    unsigned int x = 40;\n    printf(\"%u %u %u\\n\", x << 2, x >> 3, x >> 6);\n    return 0;\n}","answer":"160 5 0","explain":"40 × 4 = 160. 40 / 8 = 5. 40 / 64 = 0.625, fraction dropped: 0. (40 is `101000`, six bits, so a shift right by 6 drops them all.)"},{"id":"c10-q-02","topic":"c10-shifts","type":"output","q":"What does this program print?","code":"#include <stdint.h>\n#include <stdio.h>\n\nint main(void) {\n    uint8_t a = 200;\n    printf(\"%d\\n\", a << 1);\n    uint8_t b = a << 1;\n    printf(\"%d\\n\", b);\n    return 0;\n}","answer":"400\n144","explain":"`a` is promoted to `int`, so `a << 1` is 400. Stored in a `uint8_t`, only the low 8 bits remain: 400 − 256 = 144."},{"id":"c10-q-03","topic":"c10-shifts","type":"short","q":"With gcc, `-45 >> 2` is −12 but `-45 / 4` is −11. Explain the difference, and say why the course discourages right-shifting negative `int`s.","answer":"gcc does an arithmetic shift, which copies the sign bit in and rounds down (towards minus infinity): −11.25 becomes −12. C's integer division truncates (rounds towards zero): −11. The C standard leaves the right shift of a negative signed value implementation-defined, so another compiler may give a different answer; it is not portable.","explain":"Use unsigned types when you work with bits."},{"id":"c10-q-04","topic":"c10-shifts","type":"mcq","q":"Which of these has **undefined** behaviour if `x` is an `unsigned int` (32 bits)?","options":["`x << 32`","`x >> 31`","`x << 31`","`x >> 0`"],"answer":0,"explain":"A shift by at least the number of bits (32) is undefined. Shifts by 0 to 31 of an unsigned value are always defined (bits that fall off are simply lost)."},{"id":"c10-q-05","topic":"c10-fields","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    unsigned int x = 0xABCD;\n    printf(\"%x %x\\n\", (x >> 8) & 0xF, (x >> 4) & 0xFF);\n    return 0;\n}","answer":"b bc","explain":"`x >> 8` is `0xAB`; `& 0xF` keeps one hex digit, `b`. `x >> 4` is `0xABC`; `& 0xFF` keeps two hex digits, `bc`. `%x` prints lowercase hex."},{"id":"c10-q-06","topic":"c10-fields","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    unsigned int mode = 0640;\n    printf(\"%u %u %u\\n\", (mode >> 6) & 7, (mode >> 3) & 7, mode & 7);\n    mode = mode | 0004;\n    printf(\"%o\\n\", mode);\n    return 0;\n}","answer":"6 4 0\n644","explain":"`0640` is octal: the three 3-bit fields are 6, 4 and 0. OR-ing in `0004` turns on the other-read bit, and `%o` prints 644."},{"id":"c10-q-07","topic":"c10-fields","type":"mcq","q":"Which expression is a mask with exactly the low `n` bits set (for 1 ≤ n ≤ 31)?","options":["`(1u << n) - 1`","`1u << n`","`~(1u << n)`","`(1u << (n - 1))`"],"answer":0,"explain":"`1u << n` is a single 1 followed by n zeros; subtracting 1 gives n ones. `~(1u << n)` has every bit set except bit n."},{"id":"c10-q-08","topic":"c10-fields","type":"short","q":"Write one statement that sets bits 4 to 7 of `unsigned int x` to the 4-bit value `v` (0 to 15), leaving every other bit unchanged. Why can't you just write `x = x | (v << 4);`?","answer":"`x = (x & ~(0xFu << 4)) | (v << 4);` The OR alone can only turn bits on: any 1 bits already in positions 4 to 7 would stay 1. Clearing the field first makes it 0000, so after the OR it holds exactly `v`.","explain":"Clear with AND and the complemented mask, then set with OR."},{"id":"c10-q-09","topic":"c10-floats","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    double a = 0.1 + 0.2;\n    printf(\"%.1f %d\\n\", a, a == 0.3);\n    return 0;\n}","answer":"0.3 0","explain":"Rounded to 1 decimal place the sum prints as 0.3, but it is 0.30000000000000004, a different double from 0.3, so `==` gives 0 (false)."},{"id":"c10-q-10","topic":"c10-floats","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    double x = 0.00042;\n    double y = 5000000.0;\n    printf(\"%e\\n%g\\n%g\\n%.2e\\n\", x, x, y, y);\n    return 0;\n}","answer":"4.200000e-04\n0.00042\n5e+06\n5.00e+06","explain":"`%e` always uses 6 digits after the point. `%g` uses fixed style for 0.00042 (exponent −4 is not below −4) and drops zeros; for 5000000 the exponent 6 is at least the precision 6, so it uses `e` style. `%.2e` shows 2 digits after the point."},{"id":"c10-q-11","topic":"c10-floats","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    float f = 0.1f;\n    double d = 0.1;\n    printf(\"%d %d\\n\", f == d, f == 0.1f);\n    return 0;\n}","answer":"0 1","explain":"`0.1f` is 0.1 rounded to 24 binary digits; `0.1` is rounded to 53. They are different numbers, so `f == d` is 0. Comparing `f` with the same float constant gives 1."},{"id":"c10-q-12","topic":"c10-floats","type":"short","q":"Why can a `double` store 0.5 exactly but not 0.1?","answer":"A double stores a binary fraction with a fixed number of bits. 0.5 is 1/2 = 0.1 in binary, which fits exactly. 0.1 = 1/10 is the repeating binary fraction 0.000110011..., which never ends, so it must be rounded to the nearest value that fits.","explain":"Same reason 1/3 cannot be written exactly in decimal."},{"id":"c10-q-13","topic":"c10-floats","type":"output","q":"What does this program print? (It is compiled with `-lm`.)","code":"#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double big = 1.0 / 0.0;\n    double bad = 0.0 / 0.0;\n    printf(\"%f\\n\", big);\n    printf(\"%d %d %d\\n\", isinf(big) != 0, bad == bad, isnan(bad) != 0);\n    return 0;\n}","answer":"inf\n1 0 1","explain":"`1.0 / 0.0` is infinity, printed `inf`; `isinf` reports it (on infinity `isinf` may return 1 or −1, so the code tests `!= 0`). A NaN is not equal to anything, even itself, so `bad == bad` is 0; `isnan` detects it."},{"id":"c10-q-14","topic":"c10-floats","type":"short","q":"What is wrong with `for (double x = 0.0; x != 1.0; x += 0.1) { ... }`? Give a fix.","answer":"0.1 is not exact, so after ten additions `x` is 0.99999999999999989, not 1.0; the next value is about 1.1. `x` is never equal to 1.0 and the loop never ends. Fix: loop with an int, `for (int i = 0; i < 10; i++) { double x = i / 10.0; ... }`, or use `x < 0.95` style tests instead of `!=`.","explain":"Never use `==` or `!=` on doubles to stop a loop."}],"write":[{"id":"c10-w-01","topic":"c10-fields","stage":"worked","marks":4,"prompt":"Write a function `unsigned int setfield(unsigned int x, unsigned int pos, unsigned int len, unsigned int value)` that returns `x` with its `len` bits starting at bit `pos` (bit 0 is the rightmost) replaced by the low `len` bits of `value`. Assume 1 ≤ len and pos + len ≤ 31. Test it on `0754` (set the group field to 2) and on `0x3366CC` (set bits 8 to 15 to `0xFF`).","starter":"","solution":"#include <stdio.h>\n\n// returns x with its len bits starting at bit pos replaced by value\nunsigned int setfield(unsigned int x, unsigned int pos, unsigned int len, unsigned int value) {\n    unsigned int mask = (1u << len) - 1;      // len ones at the right\n    x = x & ~(mask << pos);                   // 1. clear the field\n    x = x | ((value & mask) << pos);          // 2. put the new value there\n    return x;\n}\n\nint main(void) {\n    printf(\"%o\\n\", setfield(0754, 3, 3, 2));          // group bits become w only\n    printf(\"%X\\n\", setfield(0x3366CC, 8, 8, 0xFF));   // green becomes FF\n    printf(\"%u\\n\", setfield(0, 0, 4, 9));             // 0 with 9 in the low 4 bits\n    return 0;\n}","explain":"Build a mask of `len` ones with `(1u << len) - 1`. `~(mask << pos)` has 0s exactly in the field and 1s everywhere else, so the AND clears the field and keeps the rest. Then `(value & mask) << pos` moves the new value into place (the `& mask` stops a too-big value from spilling into neighbouring bits), and the OR puts it in. `x` is a copy, so changing it inside the function is fine. Output:\n\n```\n$ ./setfield\n724\n33FFCC\n9\n```","rubric":[{"marks":1,"item":"mask of len ones: `(1u << len) - 1`"},{"marks":1,"item":"clears the field with `x & ~(mask << pos)`"},{"marks":1,"item":"ORs in `value << pos` (value masked to len bits)"},{"marks":1,"item":"returns the new value; unsigned types throughout"}],"pitfalls":["OR-ing without clearing first: old 1 bits in the field stay on.","Writing `~mask << pos` instead of `~(mask << pos)`: `~` binds tighter than `<<`, so the 1s below `pos` become 0s and the low bits of `x` are wiped."]},{"id":"c10-w-02","topic":"c10-floats","stage":"faded","marks":3,"prompt":"Complete `count_near`, which returns how many elements of `a` are within `tol` of `target` (the distance is at most `tol`). `main` shows that `==` finds only one value equal to 0.3, while `count_near` with tolerance 1e-9 finds three. Expected output: `== 0.3: 1` then `near 0.3: 3`. Compile with `-lm`.","starter":"#include <math.h>\n#include <stdio.h>\n\n// counts the elements of a that are within tol of target\nsize_t count_near(const double a[], size_t n, double target, double tol) {\n    size_t count = ____;\n    for (size_t i = 0; i < n; i++) {\n        if (____ <= tol) {\n            ____;\n        }\n    }\n    return count;\n}\n\nint main(void) {\n    double a[5] = {0.1 + 0.2, 0.3, 0.30001, 3 * 0.1, 1.0};\n    size_t exact = 0;\n    for (size_t i = 0; i < 5; i++) {\n        if (a[i] == 0.3) {\n            exact++;\n        }\n    }\n    printf(\"== 0.3: %zu\\n\", exact);\n    printf(\"near 0.3: %zu\\n\", count_near(a, 5, 0.3, 1e-9));\n    return 0;\n}","solution":"#include <math.h>\n#include <stdio.h>\n\n// counts the elements of a that are within tol of target\nsize_t count_near(const double a[], size_t n, double target, double tol) {\n    size_t count = 0;\n    for (size_t i = 0; i < n; i++) {\n        if (fabs(a[i] - target) <= tol) {\n            count++;\n        }\n    }\n    return count;\n}\n\nint main(void) {\n    double a[5] = {0.1 + 0.2, 0.3, 0.30001, 3 * 0.1, 1.0};\n    size_t exact = 0;\n    for (size_t i = 0; i < 5; i++) {\n        if (a[i] == 0.3) {\n            exact++;\n        }\n    }\n    printf(\"== 0.3: %zu\\n\", exact);\n    printf(\"near 0.3: %zu\\n\", count_near(a, 5, 0.3, 1e-9));\n    return 0;\n}","rubric":[{"marks":1,"item":"count starts at 0"},{"marks":1,"item":"distance computed as `fabs(a[i] - target)` (absolute value, either order)"},{"marks":1,"item":"`count++` inside the if"}],"pitfalls":["`abs` instead of `fabs`: `abs` is for `int` and would cut the difference to 0.","Forgetting the absolute value: every element below the target would count."]},{"id":"c10-w-03","topic":"c10-fields","stage":"blank","marks":5,"prompt":"Write a function `void print_perms(unsigned int mode)` that prints the 9 permission bits of `mode` the way `ls -l` shows them, followed by a newline: `print_perms(0754)` prints `rwxr-xr--`, `print_perms(0640)` prints `rw-r-----`. Bit 8 (`0400`) is user read and bit 0 (`0001`) is other execute. Use shifts and masks, not division. Include a short `main` that tests it.","starter":"","solution":"#include <stdio.h>\n\n// prints mode's 9 permission bits like ls -l, e.g. 0754 prints rwxr-xr--\nvoid print_perms(unsigned int mode) {\n    char letters[] = \"rwxrwxrwx\";\n    for (int i = 8; i >= 0; i--) {             // bit 8 (0400) down to bit 0 (0001)\n        if ((mode >> i) & 1u) {\n            printf(\"%c\", letters[8 - i]);\n        } else {\n            printf(\"-\");\n        }\n    }\n    printf(\"\\n\");\n}\n\nint main(void) {\n    print_perms(0754);\n    print_perms(0640);\n    print_perms(0);\n    return 0;\n}","rubric":[{"marks":1,"item":"loops over the 9 bits from bit 8 down to bit 0 (or uses 9 masks 0400 ... 0001)"},{"marks":1,"item":"tests one bit with a shift and `& 1` (or `mode & mask`)"},{"marks":1,"item":"prints the right letter r, w or x for the bit's position"},{"marks":1,"item":"prints `-` when the bit is 0"},{"marks":1,"item":"newline at the end; main calls it with octal constants such as `0754`"}],"pitfalls":["Writing `754` instead of `0754`: without the leading 0 it is decimal 754, a different bit pattern.","Looping from bit 0 upwards prints the letters backwards.","Testing `(mode & mask) == 1`: the AND gives the mask's value (e.g. 256), not 1; test for non-zero instead."]}]},{"day":11,"title":"Pointers, part 1","goal":"Understand addresses and pointer variables, read and write through a pointer with *, use NULL safely, and write functions like swap that change the caller's variables through pointer parameters.","topics":[{"id":"c11-address","title":"Addresses, & and pointer variables","notebook":"c/pointers.ipynb","priority":"high","examNote":"Exam traces (2016F Q3) start with `int *p, *q, *r;` and lines like `p = &a;`. You must know what `&a` gives and what a pointer variable holds, and be able to draw it.","blocks":[{"type":"md","text":"### Memory is a row of numbered boxes\n\nYour program's memory is a long row of **bytes**. Each byte has a number called its **address**, like a house number on a street.\n\nEvery variable you declare is an **object**: a piece of memory that holds a value. An `int` uses 4 bytes and a `double` uses 8. The **address of an object** is the address of its first byte.\n\nWe draw memory as a table. The addresses below are *pretend* addresses chosen to be easy to read. Real ones are long hexadecimal numbers like `0x7ffd6d831cac`.\n\n```c\nint a = 99;\nint b = 55;\n```\n\n| address | name | value |\n|---|---|---|\n| 1000 | `a` | 99 |\n| 1004 | `b` | 55 |\n\n`a` starts at 1000 and fills bytes 1000 to 1003, so `b` can start at 1004."},{"type":"md","text":"### `&` gives an address; a pointer stores one\n\nThe **address-of operator** `&` gives you the address of an object. With the table above, `&a` is 1000 and `&b` is 1004.\n\nA **pointer** is a value that is an address. A **pointer variable** is a variable that stores a pointer. The notebook says: if `T` is a type, then `T *` is the type of a pointer that can store the address of a `T` object.\n\n```c\nint a = 99;\nint *ptr = &a;     // ptr gets the address of a\n```\n\nRead `int *ptr` as \"`ptr` is a **pointer to int**\". It can hold the address of any `int`.\n\n| address | name | value |\n|---|---|---|\n| 1000 | `a` | 99 |\n| 1008 | `ptr` | 1000 |\n\nThe pointer is an object too. It has its own address (1008) and its own value (1000, the address of `a`). On our 64-bit machines every pointer takes 8 bytes. We also draw it with an arrow: \"`ptr` **points to** `a`\".\n\n```\n    ptr                 a\n  +------+          +------+\n  | 1000 | -------> |  99  |\n  +------+          +------+\n   @1008             @1000\n```"},{"type":"why","q":"Why does a pointer have a type (`int *`, `double *`) and not just \"address\"?","a":"An address only says where an object *starts*. The type says how many bytes the object uses and how to read them: 4 bytes as an `int`, or 8 bytes as a `double`. Tomorrow's arithmetic on pointers also needs the size."},{"type":"md","text":"### Pointing somewhere else\n\nA pointer variable can be changed like any variable. Giving it a new address makes it point at a different object. The objects themselves do not change.\n\n```c\nint a = 99;\nint *ptr = &a;   // ptr points at a\n\nint b = 55;\nptr = &b;        // now ptr points at b; a is still 99\n```\n\nThe types must match: `ptr` is an `int *`, so it should only get addresses of `int` objects. For a `double d`, you need a `double *`: `double *dp = &d;`."},{"type":"md","text":"### How to write the declaration\n\nThe notebook shows that the spaces do not matter. These three lines all declare a pointer to `int`:\n\n```c\nint *ptr1;\nint* ptr2;\nint * ptr3;\n```\n\nThe course writes `int *ptr`, with the `*` next to the name. There is a reason, shown in the next pitfall."},{"type":"pitfall","text":"The `*` belongs to **one** name. `int *p, q;` makes `p` an `int *` but `q` a plain `int`. To declare three pointers on one line write `int *p, *q, *r;` (as in the 2016 final). gcc catches the mistake when you store an address in `q`:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int a = 1;\n    int *p, q;            // p is an int *, but q is a plain int!\n    p = &a;\n    q = &a;\n    printf(\"%d %d\\n\", *p, q);\n    return 0;\n}","caption":"twodecl.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o twodecl twodecl.c\ntwodecl.c: In function 'main':\ntwodecl.c:7:7: warning: assignment to 'int' from 'int *' makes integer from pointer without a cast [-Wint-conversion]\n    7 |     q = &a;\n      |       ^","caption":"A warning means the program is almost certainly wrong. Fix it with int *p, *q; (and make q print *q)."},{"type":"md","text":"### Printing an address with `%p`\n\n`printf` prints a pointer with the conversion `%p`. `%p` expects the general pointer type `void *` (Day 12 explains it), so the habit is to **cast** the pointer: `(void *) ptr`. The output is the address in hexadecimal (base 16, starting `0x`).\n\nThis program also uses `*ptr`, which you learn in the next lesson: it means \"the `int` that `ptr` points to\"."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int a = 99;\n    int *ptr = &a;      // ptr holds the address of a\n\n    printf(\"a           = %d\\n\", a);\n    printf(\"&a          = %p\\n\", (void *) &a);\n    printf(\"ptr         = %p\\n\", (void *) ptr);\n    printf(\"*ptr        = %d\\n\", *ptr);\n    printf(\"&ptr        = %p\\n\", (void *) &ptr);\n    printf(\"sizeof(ptr) = %zu\\n\", sizeof(ptr));\n    return 0;\n}","caption":"addr.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o addr addr.c\n$ ./addr\na           = 99\n&a          = 0x7ffd6d831cac\nptr         = 0x7ffd6d831cac\n*ptr        = 99\n&ptr        = 0x7ffd6d831cb0\nsizeof(ptr) = 8\n$ ./addr\na           = 99\n&a          = 0x7ffd326785dc\nptr         = 0x7ffd326785dc\n*ptr        = 99\n&ptr        = 0x7ffd326785e0\nsizeof(ptr) = 8","caption":"Two runs. The addresses are different every time (Linux places memory at a random spot on each run, for security), so yours will differ too. What never changes: ptr always equals &a, and the pointer is 8 bytes."},{"type":"try","text":"Type in addr.c, compile it with gcc -std=c17 -Wall and run it three times. Check that the &a and ptr lines always match each other, even though they change from run to run. Then add a double d = 2.5; and a double *dp = &d; and print both with %p."},{"type":"check","q":"Pretend addresses: `double d = 2.5;` is at 2000 and `double *dp = &d;` is at 2008. What are the type and value of `&d`? What is the value of `dp`? What is `&dp`?","a":"`&d` has type `double *` and value 2000. `dp` holds 2000 (it points at `d`). `&dp` is 2008, the address of the pointer variable itself."},{"type":"md","text":"### Key points\n\n- Every object (variable) lives at an **address**; `&x` gives the address of `x`.\n- `T *p` declares `p` as a **pointer to T**: a variable that holds the address of a `T` object. It is an object too, with its own address (8 bytes on our machines).\n- Draw memory as a table (address, name, value) or as boxes with arrows.\n- A pointer can be changed to point at another object: `p = &b;`.\n- `int *p, q;` makes only `p` a pointer. Write `int *p, *q;`.\n- Print addresses with `%p` and `(void *) p`; the values change from run to run."}]},{"id":"c11-deref","title":"Dereferencing with *, and NULL","notebook":"c/pointers.ipynb","priority":"high","examNote":"2016F Q3 (10 marks) was a pure trace: three `int`s, three pointers, assignments like `p = q;`, `*p = *q;`, `*r = *q + 1;`, and printf lines to predict. Draw the memory table and update it line by line. The quiz has two traces in the same style.","blocks":[{"type":"md","text":"### `*` follows the pointer\n\nThe notebook quotes Wikipedia: a pointer is like a page number in a book's index. **Dereferencing** the pointer means turning to that page and reading what is there.\n\nIn C the **dereference operator** is `*` written in front of a pointer. If `ptr` points at `a`, then `*ptr` *is* `a`: you can read it and you can assign to it.\n\nReading through a pointer (the notebook's `ptr1.c`):"},{"type":"code","code":"// ptr1.c\n\n#include <stdio.h>\n\nint main(void) {\n    int a = 99;\n    int *ptr = &a;        // ptr refers to a\n    int b = *ptr + 1;     // b = a + 1\n\n    printf(\"a = %d\\n\", a);\n    printf(\"b = %d\\n\", b);\n\n    return 0;\n}","caption":"ptr1.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o ptr1 ptr1.c\n$ ./ptr1\na = 99\nb = 100"},{"type":"md","text":"Writing through a pointer (`ptr2.c`). The variable `a` changes even though the assignment never names `a`:"},{"type":"code","code":"// ptr2.c\n\n#include <stdio.h>\n\nint main(void) {\n    int a = 99;\n    int *ptr = &a;        // ptr refers to a\n    *ptr = -33;           // assigns -33 to a\n\n    printf(\"a = %d\\n\", a);\n\n    return 0;\n}","caption":"ptr2.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o ptr2 ptr2.c\n$ ./ptr2\na = -33"},{"type":"md","text":"Memory before and after `*ptr = -33;` (pretend addresses):\n\n| address | name | before | after |\n|---|---|---|---|\n| 1000 | `a` | 99 | **-33** |\n| 1008 | `ptr` | 1000 | 1000 |\n\n`ptr` itself did not change. Only the object it points to did."},{"type":"md","text":"### Three jobs for `*`, two for `&`\n\n| You see | Where | Meaning |\n|---|---|---|\n| `int *p;` | in a declaration | `p` is a pointer to `int` |\n| `*p` | in front of a pointer, in an expression | the object `p` points to |\n| `a * b` | between two values | multiplication |\n| `&a` | in front of an object | the address of `a` |\n| `a && b` | between two conditions | logical AND |\n\nSo `*p * *q` means \"the int `p` points to, times the int `q` points to\". And `*&a` is just `a`: take the address of `a`, then follow it back."},{"type":"md","text":"### `p = q` versus `*p = *q`\n\nThis is the difference that exam traces test.\n\n- `p = q;` copies the **address**. Now `p` points wherever `q` points. No `int` changes.\n- `*p = *q;` copies the **value**. The object `p` points at gets the value of the object `q` points at. No pointer changes.\n\nHere is a trace. Follow it with the tables underneath."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int x = 10;\n    int y = 20;\n    int *p = &x;\n    int *q = &y;\n\n    printf(\"1: %d %d\\n\", *p, *q);\n\n    p = q;            // copy the ADDRESS: p now points at y too\n    printf(\"2: %d %d\\n\", *p, *q);\n\n    *p = 7;           // writes 7 into y\n    printf(\"3: x = %d, y = %d\\n\", x, y);\n\n    q = &x;\n    *q = *p + 1;      // x = y + 1\n    printf(\"4: x = %d, y = %d\\n\", x, y);\n    return 0;\n}","caption":"trace.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o trace trace.c\n$ ./trace\n1: 10 20\n2: 20 20\n3: x = 10, y = 7\n4: x = 8, y = 7"},{"type":"md","text":"Memory after each step (`x` at 1000, `y` at 1004):\n\n| after line | `x` | `y` | `p` | `q` |\n|---|---|---|---|---|\n| `int *q = &y;` | 10 | 20 | 1000 (→x) | 1004 (→y) |\n| `p = q;` | 10 | 20 | 1004 (→y) | 1004 (→y) |\n| `*p = 7;` | 10 | **7** | 1004 (→y) | 1004 (→y) |\n| `q = &x;` | 10 | 7 | 1004 (→y) | 1000 (→x) |\n| `*q = *p + 1;` | **8** | 7 | 1004 (→y) | 1000 (→x) |\n\nMethod for any trace: keep one column per variable. For a pointer, write which object it points to. When you see `*p`, look up where `p` points and use (or change) **that** column."},{"type":"check","q":"In trace.c, suppose line `p = q;` were `*p = *q;` instead. What would lines 2 and 3 print?","a":"`*p = *q` copies 20 into `x` and `p` still points at `x`. Line 2 prints `2: 20 20`. Then `*p = 7` changes `x`, so line 3 prints `3: x = 7, y = 20`."},{"type":"md","text":"### `NULL`: a pointer to nothing\n\nThe name `NULL`, from the header `<stddef.h>` (also available through `<stdio.h>`), means \"no object\". A pointer that holds `NULL` is a **null pointer**.\n\n```c\n#include <stddef.h>\n\nint *ptr = NULL;\n```\n\nThe literal `0` also works, but `NULL` says what you mean. The **only safe thing** to do with a null pointer is to test it:\n\n| Test that `ptr` is null | Test that `ptr` is not null |\n|---|---|\n| `if (ptr == NULL)` | `if (ptr != NULL)` |\n| `if (!ptr)` | `if (ptr)` |\n\nA null pointer works like a signal: \"there is no object here\". It can mark the end of a list of pointers (much like `'\\0'` ends a string) or report an error. Later in the course, library functions such as `malloc` and `fopen` return `NULL` when they fail."},{"type":"code","code":"#include <stdio.h>\n#include <stddef.h>\n\nint main(void) {\n    int a = 5;\n    int *ptr = NULL;      // points at no object\n\n    if (ptr == NULL) {\n        puts(\"ptr is NULL: do not use *ptr\");\n    }\n\n    ptr = &a;\n    if (ptr != NULL) {\n        printf(\"*ptr = %d\\n\", *ptr);\n    }\n    return 0;\n}","caption":"nulltest.c"},{"type":"code","code":"$ gcc -std=c17 -Wall -o nulltest nulltest.c\n$ ./nulltest\nptr is NULL: do not use *ptr\n*ptr = 5"},{"type":"md","text":"### Dereferencing `NULL` is undefined behaviour\n\n`*ptr` when `ptr` is `NULL` asks for \"the object at no object\". The C standard calls this **undefined behaviour**: anything may happen. On our Linux machines the program is usually killed with a *segmentation fault* (an access to memory the program may not touch), but you must not rely on that."},{"type":"code","code":"// ptr3.c\n\n#include <stdio.h>\n\nint main(void) {\n    int *ptr = NULL;\n    *ptr = -33;           // oops, null pointer dereference\n\n    printf(\"a = %d\\n\", *ptr);\n\n    return 0;\n}","caption":"ptr3.c (from the notebook)"},{"type":"code","code":"$ gcc -std=c17 -Wall -o ptr3 ptr3.c\n$ ./ptr3\nSegmentation fault\n$ echo $?\n139","caption":"gcc gives no warning here. On one run on Ubuntu the shell reported the crash (some shells add \"(core dumped)\"); 139 = 128 + 11, signal 11 is the segmentation fault. The notebook shows the same crash as \"exited with code -11\"."},{"type":"pitfall","text":"An **uninitialized** pointer is worse than `NULL`: it holds a leftover value that may look like a real address. `int *ptr; *ptr = 5;` is undefined behaviour. With `-Wall` gcc usually warns: `warning: 'ptr' is used uninitialized [-Wuninitialized]`. Habit: give every pointer a value when you declare it, either the address of an object or `NULL`."},{"type":"pitfall","text":"Match the types. `double d = 2.5; int *p = &d;` gives `warning: initialization of 'int *' from incompatible pointer type 'double *'`. Reading `*p` would treat the bytes of a `double` as an `int`. Use `double *p = &d;`."},{"type":"md","text":"### Key points\n\n- `*p` is the object `p` points to: `x = *p;` reads it, `*p = 5;` writes it.\n- `p = q;` copies an address (now they point at the same object). `*p = *q;` copies a value (no pointer moves).\n- In a trace, keep one column per variable and record where each pointer points.\n- `NULL` (from `<stddef.h>`) means no object. Only test it: `p == NULL`, `!p`, `p != NULL`, `p`.\n- Dereferencing a null or uninitialized pointer is undefined behaviour (often \"Segmentation fault\"). Initialize every pointer."}]},{"id":"c11-swap","title":"Pointer parameters: changing the caller's variables","notebook":"c/pointers.ipynb","priority":"high","examNote":"Writing a function that changes its caller's variables through pointers (`swap`, putting values in order, rotating) is a standard handwritten-code task. Marks go for the `T *` parameters, `*` on every use inside, and `&` at the call.","blocks":[{"type":"md","text":"### Why `badswap` fails\n\nOn Day 2 you learned that C passes arguments **by value**: each parameter is a new variable that gets a **copy** of the argument. The notebook's first attempt at `swap` shows the problem:"},{"type":"code","code":"// badswap.c\n\n#include <stdio.h>\n\nvoid swap(double x, double y) {\n    double tmp = x;\n    x = y;\n    y = tmp;\n    printf(\"inside swap: x = %f, y = %f\\n\", x, y);\n}\n\nint main(void) {\n    double a = 1.5;\n    double b = 99.9;\n    \n    printf(\"before calling swap: a = %f, b = %f\\n\", a, b);\n    swap(a, b);\n    printf(\"after calling swap: a = %f, b = %f\\n\", a, b);\n\n    return 0;\n}","caption":"badswap.c (c/src/pointers)"},{"type":"code","code":"$ gcc -std=c17 -Wall -o badswap badswap.c\n$ ./badswap\nbefore calling swap: a = 1.500000, b = 99.900000\ninside swap: x = 99.900000, y = 1.500000\nafter calling swap: a = 1.500000, b = 99.900000"},{"type":"md","text":"`swap` did swap something: its own copies. A memory picture while `swap` is running:\n\n```\n main's variables            swap's variables\n +--------+------+           +--------+-----------------+\n | a 1000 | 1.5  |  copied   | x 2000 | 1.5  -> 99.9    |\n | b 1008 | 99.9 |  ------>  | y 2008 | 99.9 -> 1.5     |\n +--------+------+           | tmp    | 1.5             |\n                             +--------+-----------------+\n```\n\n`x` and `y` are different objects at different addresses. When `swap` returns, `x`, `y` and `tmp` disappear, and `a` and `b` were never touched. The values of the parameters are **not** copied back."},{"type":"md","text":"### The fix: pass the addresses\n\nFor `swap` to change `a` and `b`, it needs to know **where** they are. So the caller passes `&a` and `&b`, and the parameters become pointers (`swap.c`):"},{"type":"code","code":"// swap.c\n\n#include <stdio.h>\n\nvoid swap(double *x, double *y) {\n    double tmp = *x;    // tmp gets the value of the object pointed to by x\n    *x = *y;            // the object pointed to by x gets the value of the object pointed to by y\n    *y = tmp;           // the object pointed to by y gets the value of tmp\n    printf(\"inside swap: x = %f, y = %f\\n\", *x, *y);\n}\n\nint main(void) {\n    double a = 1.5;\n    double b = 99.9;\n    \n    printf(\"before calling swap: a = %f, b = %f\\n\", a, b);\n    swap(&a, &b);      // calls swap with the address of a and the address of b\n    printf(\"after calling swap: a = %f, b = %f\\n\", a, b);\n}","caption":"swap.c (c/src/pointers)"},{"type":"code","code":"$ gcc -std=c17 -Wall -o swap swap.c\n$ ./swap\nbefore calling swap: a = 1.500000, b = 99.900000\ninside swap: x = 99.900000, y = 1.500000\nafter calling swap: a = 99.900000, b = 1.500000"},{"type":"md","text":"Now the picture at the start of the call is:\n\n```\n main's variables                swap's variables\n +--------+------+              +--------+------+\n | a 1000 | 1.5  | <----------- | x      | 1000 |\n | b 1008 | 99.9 | <----------- | y      | 1008 |\n +--------+------+              | tmp    |  ?   |\n                                +--------+------+\n```\n\nThe three lines of `swap`, step by step:\n\n| statement | meaning | `a` | `b` | `tmp` |\n|---|---|---|---|---|\n| (start) | | 1.5 | 99.9 | ? |\n| `double tmp = *x;` | tmp = the object at 1000 | 1.5 | 99.9 | 1.5 |\n| `*x = *y;` | object at 1000 = object at 1008 | **99.9** | 99.9 | 1.5 |\n| `*y = tmp;` | object at 1008 = tmp | 99.9 | **1.5** | 1.5 |\n\nNote that `tmp` is a plain `double`, not a pointer: it holds a value."},{"type":"why","q":"C still passes by value. How can swap change a and b now?","a":"`x` gets a **copy** of the address 1000. But a copy of an address leads to the same house: `*x` is `main`'s `a`. Changing `x` itself (say `x = y;`) would still change nothing in `main`. Changing `*x` changes `a`."},{"type":"md","text":"### The recipe\n\nTo let a function change a caller's variable of type `T`:\n\n1. Make the parameter a pointer: `T *p`.\n2. Inside the function, write `*p` every time you mean the caller's variable.\n3. Call it with the address: `f(&var)`.\n\n| function header | call | can it change `n` in the caller? |\n|---|---|---|\n| `void inc(int n)` | `inc(n)` | no (changes a copy) |\n| `void inc(int *n)` | `inc(&n)` | yes, with `*n = *n + 1;` |\n\nThis also explains Day 5: an array argument decays to a pointer to its first element, which is why a function could change the caller's array."},{"type":"pitfall","text":"Mismatched calls. With `void swap(double *x, double *y)`, the call `swap(a, b)` is a compile **error**:\n\n```\ne1.c:12:10: error: incompatible type for argument 1 of 'swap'\ne1.c:3:19: note: expected 'double *' but argument is of type 'double'\n```\n\nThe other way round, writing `x = y;` instead of `*x = *y;` inside `swap` compiles but only moves the local pointers: the caller sees no change."},{"type":"pitfall","text":"To add 1 to the int `p` points to, write `*p = *p + 1;` or `(*p)++;`. Do **not** write `*p++;`: the `++` applies to the pointer `p` itself and moves it (pointer arithmetic, Day 12), and gcc -Wall warns that the value is not used."},{"type":"check","q":"Write the header and body of a function `inc` that adds one to its caller's `int`, and the call that adds one to `int count = 0;`.","a":"`void inc(int *n) { *n = *n + 1; }` and the call `inc(&count);`. After the call `count` is 1."},{"type":"try","text":"Copy c/src/pointers/badswap.c and swap.c into a folder, compile both with gcc -std=c17 -Wall, and run them. Then change swap.c so main calls swap(a, b) without the & and read gcc's error. Then put the & back and change *x = *y; to x = y; to see that it compiles but no longer swaps."},{"type":"md","text":"### Key points\n\n- C passes arguments by value: a function gets copies and cannot change the caller's variables through them.\n- To change a caller's variable, pass its address (`&a`) to a pointer parameter (`T *x`) and use `*x` inside.\n- `swap`: `T tmp = *x; *x = *y; *y = tmp;` with `tmp` a plain `T`.\n- The pointer itself is still a copy: assigning to `x` changes nothing for the caller; assigning to `*x` does.\n- Add one through a pointer with `*p = *p + 1;` or `(*p)++`, never `*p++`."}]}],"flashcards":[{"id":"c11-fc-01","topic":"c11-address","front":"What is a pointer?","back":"A value that is the address of an object. A pointer variable stores one; `T *p` can hold the address of a `T`."},{"id":"c11-fc-02","topic":"c11-address","front":"What does `&x` give?","back":"The address of the object `x`. Its type is `T *` when `x` has type `T`."},{"id":"c11-fc-03","topic":"c11-address","front":"Declare `p` as a pointer to `double` and make it point at `double d`.","back":"`double *p = &d;`"},{"id":"c11-fc-04","topic":"c11-address","front":"What does `int *p, q;` declare?","back":"`p` is a pointer to `int`; `q` is a plain `int`. For two pointers write `int *p, *q;`."},{"id":"c11-fc-05","topic":"c11-address","front":"How do you print a pointer `p` with printf?","back":"`printf(\"%p\\n\", (void *) p);` It prints a hexadecimal address that changes from run to run."},{"id":"c11-fc-06","topic":"c11-address","front":"How many bytes is a pointer on our 64-bit Linux machines?","back":"8 (any pointer type). `sizeof(ptr)` prints 8."},{"id":"c11-fc-07","topic":"c11-deref","front":"What does `*p` mean in an expression?","back":"Dereference: the object `p` points to. `x = *p;` reads it, `*p = 5;` writes it."},{"id":"c11-fc-08","topic":"c11-deref","front":"`p = q;` versus `*p = *q;`","back":"`p = q;` copies the address, so both point at the same object. `*p = *q;` copies the value from `q`'s object into `p`'s object."},{"id":"c11-fc-09","topic":"c11-deref","front":"What is `*&a`?","back":"Just `a`: the address of `a`, followed back."},{"id":"c11-fc-10","topic":"c11-deref","front":"What is `NULL` and which header defines it?","back":"A pointer value meaning \"no object\", from `<stddef.h>`. A pointer holding it is a null pointer."},{"id":"c11-fc-11","topic":"c11-deref","front":"What can you safely do with a null pointer?","back":"Only test it: `p == NULL`, `!p`, `p != NULL`, `if (p)`. Dereferencing it is undefined behaviour."},{"id":"c11-fc-12","topic":"c11-deref","front":"What happens if you dereference `NULL` or an uninitialized pointer?","back":"Undefined behaviour. On Linux it often crashes with \"Segmentation fault\" (exit status 139), but nothing is guaranteed."},{"id":"c11-fc-13","topic":"c11-swap","front":"Why can't `void swap(double x, double y)` swap the caller's variables?","back":"Pass by value: `x` and `y` are copies. Swapping them does nothing to the caller's `a` and `b`, and the copies vanish on return."},{"id":"c11-fc-14","topic":"c11-swap","front":"Write a `swap` for two ints.","back":"`void swap(int *x, int *y) { int tmp = *x; *x = *y; *y = tmp; }` called as `swap(&a, &b);`"},{"id":"c11-fc-15","topic":"c11-swap","front":"Three steps to let a function change a caller's `T` variable","back":"1. Parameter `T *p`. 2. Use `*p` inside. 3. Call with `&var`."},{"id":"c11-fc-16","topic":"c11-swap","front":"Inside `void f(int *p)`, what is the difference between `p = &local;` and `*p = 9;`?","back":"`p = &local;` only changes `f`'s copy of the pointer: the caller sees nothing. `*p = 9;` changes the caller's int."}],"quiz":[{"id":"c11-q-01","topic":"c11-deref","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int a = 4;\n    int b = 8;\n    int c = 15;\n    int *p, *q, *r;\n    p = &b;\n    q = &c;\n    r = &b;\n\n    printf(\"A: %d %d %d\\n\", *p, *q, *r);\n\n    q = p;\n    p = &a;\n\n    printf(\"B: %d %d %d\\n\", *p, *q, *r);\n\n    *q = *p * 2;\n    *r = *r + 1;\n    *p = 0;\n\n    printf(\"C: %d %d %d\\n\", *p, *q, *r);\n    printf(\"D: %d %d %d\\n\", a, b, c);\n    return 0;\n}","answer":"A: 8 15 8\nB: 4 8 8\nC: 0 9 9\nD: 0 9 15","explain":"Start: p→b, q→c, r→b, so A is `8 15 8`. `q = p` makes q→b; `p = &a` makes p→a: B is `4 8 8`. `*q = *p * 2` sets b = 8; `*r = *r + 1` sets b = 9 (r also points at b); `*p = 0` sets a = 0. C is `0 9 9`, D is `0 9 15` (nothing pointed at c after `q = p`). Same style as 2016F Q3."},{"id":"c11-q-02","topic":"c11-deref","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int m = 3;\n    int n = 5;\n    int *p = &m;\n    int *q = &n;\n    int prod = *p * *q;\n    *q = *q - *p;\n    p = q;\n    *p = *p * 10;\n    printf(\"%d %d %d\\n\", m, n, prod);\n    return 0;\n}","answer":"3 20 15","explain":"`prod = 3 * 5 = 15`. `*q = *q - *p` sets n = 2. `p = q` makes p point at n, so `*p = *p * 10` sets n = 20. m is never changed."},{"id":"c11-q-03","topic":"c11-swap","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nvoid f(int a, int *b) {\n    a = a + 1;\n    *b = *b + 1;\n}\n\nint main(void) {\n    int x = 1;\n    int y = 1;\n    f(x, &y);\n    f(x, &y);\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}","answer":"1 3","explain":"`a` is a copy of x, so x stays 1. `b` holds the address of y, so each call adds 1 to y: 1 → 2 → 3."},{"id":"c11-q-04","topic":"c11-swap","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nvoid g(int *p) {\n    int local = 50;\n    p = &local;\n    *p = 9;\n}\n\nint main(void) {\n    int x = 3;\n    g(&x);\n    printf(\"%d\\n\", x);\n    return 0;\n}","answer":"3","explain":"`p` is a copy of the address of x. `p = &local;` changes only that copy, so `*p = 9` writes into `local`, not x. (Note: pointing at `local` is fine here because it is used before g returns.)"},{"id":"c11-q-05","topic":"c11-swap","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nvoid swap(int *x, int *y) {\n    int tmp = *x;\n    *x = *y;\n    *y = tmp;\n}\n\nint main(void) {\n    int a = 1;\n    int b = 2;\n    int c = 3;\n    swap(&a, &b);\n    swap(&b, &c);\n    printf(\"%d %d %d\\n\", a, b, c);\n    return 0;\n}","answer":"2 3 1","explain":"After `swap(&a, &b)`: a = 2, b = 1, c = 3. After `swap(&b, &c)`: b = 3, c = 1."},{"id":"c11-q-06","topic":"c11-swap","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nvoid halve(double *d) {\n    *d = *d / 2;\n}\n\nint main(void) {\n    double v = 9.0;\n    double *p = &v;\n    halve(p);\n    halve(&v);\n    printf(\"%.2f\\n\", v);\n    return 0;\n}","answer":"2.25","explain":"`p` and `&v` are the same address, so both calls halve v: 9 → 4.5 → 2.25. `%.2f` prints two decimals."},{"id":"c11-q-07","topic":"c11-deref","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n#include <stddef.h>\n\nint main(void) {\n    int k = 0;\n    int *p = NULL;\n    if (!p) {\n        puts(\"one\");\n    }\n    p = &k;\n    if (p) {\n        puts(\"two\");\n    }\n    if (*p) {\n        puts(\"three\");\n    }\n    return 0;\n}","answer":"one\ntwo","explain":"`!p` is true when p is NULL, so `one` prints. Then p points at k, so `if (p)` is true: `two`. `*p` is k, which is 0 (false), so `three` is not printed. Note the difference: `if (p)` tests the pointer, `if (*p)` tests the int."},{"id":"c11-q-08","topic":"c11-address","type":"mcq","q":"After `int *p, q;`, what are the types of `p` and `q`?","options":["both `int *`","`p` is `int *`, `q` is `int`","both `int`","`p` is `int`, `q` is `int *`"],"answer":1,"explain":"The `*` belongs to the name next to it. Write `int *p, *q;` for two pointers."},{"id":"c11-q-09","topic":"c11-swap","type":"mcq","q":"Given `void swap(double *x, double *y)` and `double a = 1, b = 2;`, which call swaps `a` and `b`?","options":["`swap(a, b);`","`swap(*a, *b);`","`swap(&a, &b);`","`swap(&x, &y);`"],"answer":2,"explain":"The parameters need addresses of doubles: `&a` and `&b`. `swap(a, b)` is a compile error (incompatible type for argument), and `*a` is an error because `a` is not a pointer."},{"id":"c11-q-10","topic":"c11-address","type":"short","q":"Pretend addresses: `int x = 6;` is at 1000 and `int *p = &x;` is at 1008. Give the values of `x`, `&x`, `p`, `*p` and `&p`.","answer":"`x` = 6, `&x` = 1000, `p` = 1000, `*p` = 6, `&p` = 1008.","explain":"`p` holds the address of `x`. `*p` follows it to `x`. `&p` is where the pointer itself lives."},{"id":"c11-q-11","topic":"c11-swap","type":"short","q":"Explain in one or two sentences why the notebook's `badswap` prints swapped values inside the function but not after it returns.","answer":"C passes arguments by value: `x` and `y` are copies of `a` and `b`, so swapping them does not change `a` and `b`, and the copies disappear when `swap` returns.","explain":"The fix is to pass `&a` and `&b` to `double *` parameters and swap `*x` and `*y`."},{"id":"c11-q-12","topic":"c11-deref","type":"short","q":"What is wrong with `int *p; *p = 3;` and how do you fix it?","answer":"`p` is uninitialized, so it does not point at a valid `int`; writing `*p` is undefined behaviour. Make it point at an object first: `int n; int *p = &n; *p = 3;`.","explain":"gcc -Wall usually warns \"'p' is used uninitialized\". Giving a pointer `NULL` does not help either: dereferencing NULL is also undefined behaviour."},{"id":"c11-q-13","topic":"c11-deref","type":"short","q":"Given `int n = 4; int *p;`, write one statement that makes `p` point at `n`, then one statement that sets `n` to 0 without naming `n`.","answer":"`p = &n;` then `*p = 0;`","explain":"Not `*p = &n;` (that stores an address into an int) and not `p = 0;` (that makes p a null pointer)."}],"write":[{"id":"c11-w-01","topic":"c11-swap","stage":"worked","marks":4,"prompt":"Write a function `minfirst` that gets pointers to two `int` variables and rearranges them so that the first holds the smaller value and the second the larger. Write a `main` that calls it on `a = 9`, `b = 4` and prints both, twice.","starter":"","solution":"#include <stdio.h>\n\n// makes *x the smaller and *y the larger of the two values\nvoid minfirst(int *x, int *y) {\n    if (*x > *y) {\n        int tmp = *x;\n        *x = *y;\n        *y = tmp;\n    }\n}\n\nint main(void) {\n    int a = 9;\n    int b = 4;\n    minfirst(&a, &b);\n    printf(\"a = %d, b = %d\\n\", a, b);\n    minfirst(&a, &b);\n    printf(\"a = %d, b = %d\\n\", a, b);\n    return 0;\n}","explain":"The caller's variables must change, so the parameters are `int *x, int *y` and `main` passes `&a, &b`. Inside, every use of the caller's values is `*x` or `*y`. The swap only happens when they are out of order; `tmp` is a plain `int`. The second call finds them already in order and changes nothing.\n\n```\n$ ./minfirst\na = 4, b = 9\na = 4, b = 9\n```","rubric":[{"marks":1,"item":"header `void minfirst(int *x, int *y)`"},{"marks":1,"item":"compares `*x > *y` (values, not the pointers)"},{"marks":1,"item":"three-step swap through `*x` and `*y` with an `int tmp`"},{"marks":1,"item":"call `minfirst(&a, &b)` and print `a`, `b`"}],"pitfalls":["Comparing `x > y` compares addresses, not values.","Calling `minfirst(a, b)`: compile error, the function needs addresses."]},{"id":"c11-w-02","topic":"c11-swap","stage":"faded","marks":3,"prompt":"Complete `swap` so it exchanges the values of two `int` variables in its caller, and complete the call. The program must print `a = -2, b = 5`.","starter":"#include <stdio.h>\n\nvoid swap(____ x, ____ y) {\n    int tmp = ____;\n    ____ = ____;\n    ____ = tmp;\n}\n\nint main(void) {\n    int a = 5;\n    int b = -2;\n    swap(____, ____);\n    printf(\"a = %d, b = %d\\n\", a, b);\n    return 0;\n}","solution":"#include <stdio.h>\n\nvoid swap(int *x, int *y) {\n    int tmp = *x;\n    *x = *y;\n    *y = tmp;\n}\n\nint main(void) {\n    int a = 5;\n    int b = -2;\n    swap(&a, &b);\n    printf(\"a = %d, b = %d\\n\", a, b);\n    return 0;\n}","rubric":[{"marks":1,"item":"parameters are `int *x, int *y`"},{"marks":1,"item":"body `int tmp = *x; *x = *y; *y = tmp;`"},{"marks":1,"item":"call `swap(&a, &b)`"}],"pitfalls":["`int tmp = x;` stores an address in an int (gcc warns).","Writing `x = y;` swaps only the local pointers."]},{"id":"c11-w-03","topic":"c11-swap","stage":"blank","marks":5,"prompt":"Write a function `rotate` that gets pointers to three `int` variables and moves each value one place to the right, with the last value moving to the front: if the caller has `x = 1, y = 2, z = 3`, after `rotate(&x, &y, &z)` they are `x = 3, y = 1, z = 2`. Use no arrays. Write a `main` that rotates `1 2 3` twice, printing the three values after each call.","starter":"","solution":"#include <stdio.h>\n\n// moves each value one place to the right: a gets c's old value,\n// b gets a's old value, c gets b's old value\nvoid rotate(int *a, int *b, int *c) {\n    int tmp = *c;\n    *c = *b;\n    *b = *a;\n    *a = tmp;\n}\n\nint main(void) {\n    int x = 1;\n    int y = 2;\n    int z = 3;\n    rotate(&x, &y, &z);\n    printf(\"%d %d %d\\n\", x, y, z);\n    rotate(&x, &y, &z);\n    printf(\"%d %d %d\\n\", x, y, z);\n    return 0;\n}","rubric":[{"marks":1,"item":"header `void rotate(int *a, int *b, int *c)`"},{"marks":1,"item":"saves one value in a plain `int tmp` before it is overwritten"},{"marks":1,"item":"assignments in a safe order through `*a`, `*b`, `*c` (e.g. `*c = *b; *b = *a; *a = tmp;`)"},{"marks":1,"item":"calls `rotate(&x, &y, &z)`"},{"marks":1,"item":"prints `3 1 2` then `2 3 1`"}],"pitfalls":["Overwriting a value before saving it (e.g. `*b = *a;` first, then `*c = *b;` copies a's value twice).","Forgetting the `*`: `a = b;` only moves the local pointers."]}]},{"day":12,"title":"Pointers, part 2, and addressing","goal":"Picture memory as numbered bytes, move through arrays with pointer arithmetic (arr + i, *(arr + i)), and use pointers to give back results and to return a pointer into an array.","topics":[{"id":"c12-bytes","title":"Memory is a row of bytes (and void pointers)","notebook":"c/addressing.ipynb","priority":"medium","examNote":"Short-answer facts: modern computers are **byte addressable**; `sizeof(char)` is 1 by definition; `CHAR_BIT` (in `<limits.h>`) is the number of bits in a byte, at least 8. A `void *` cannot be dereferenced until it is cast.","blocks":[{"type":"md","text":"### Every byte has an address\n\nYesterday you learned that a pointer stores an **address**. Today: what exactly is an address?\n\nThink of memory as one very long array. The notebook describes three ways to number it:\n\n| Scheme | Each address names... | Used today? |\n|---|---|---|\n| **bit addressing** | one bit (a single 0 or 1) | only in some small embedded processors |\n| **word addressing** | one *word*, a fixed group of bits the processor works with (e.g. 6 bits on old machines) | historical |\n| **byte addressing** | one **byte** = a group of 8 bits | **yes**: all modern general purpose processors |\n\nSo on your computer, an address is the *index of a byte* in memory. A \"64-bit processor\" has a 64-bit *word length*: it works with 64 bits at a time, and its addresses are 64 bits (8 bytes) long."},{"type":"md","text":"### Bytes in C\n\nC defines a **byte** as the smallest addressable unit, big enough to hold one character. So `sizeof(char)` is **always 1**: `sizeof` counts in bytes. The number of bits in a byte is the constant `CHAR_BIT` from `<limits.h>`. C only promises it is **at least 8**; on our machines it is exactly 8.\n\nA bigger object takes several **consecutive** bytes. Its address is the address of its **first** byte. The program below prints some sizes and the address of each element of an `int` array (`%p` wants a `void *`, which is why each address is cast with `(void *)`: more on `void *` below)."},{"type":"code","code":"#include <limits.h>\n#include <stdio.h>\n\nint main(void) {\n    printf(\"1 byte = %d bits\\n\", CHAR_BIT);\n    printf(\"sizeof(char)   = %zu\\n\", sizeof(char));\n    printf(\"sizeof(int)    = %zu\\n\", sizeof(int));\n    printf(\"sizeof(double) = %zu\\n\", sizeof(double));\n\n    int a[3] = {10, 20, 30};\n    printf(\"&a[0] = %p\\n\", (void *) &a[0]);\n    printf(\"&a[1] = %p\\n\", (void *) &a[1]);\n    printf(\"&a[2] = %p\\n\", (void *) &a[2]);\n    return 0;\n}","caption":"bytes.c: bytes, sizes and addresses"},{"type":"code","code":"$ gcc -std=c17 -Wall -o bytes bytes.c\n$ ./bytes\n1 byte = 8 bits\nsizeof(char)   = 1\nsizeof(int)    = 4\nsizeof(double) = 8\n&a[0] = 0x7fff0be3f9fc\n&a[1] = 0x7fff0be3fa00\n&a[2] = 0x7fff0be3fa04","caption":"The addresses are different every time you run it (Linux places memory at a random spot), but the gaps never change: 0x...9fc + 4 = 0x...a00 (hex: c + 4 = 16 = 0x10), and 0x...a00 + 4 = 0x...a04."},{"type":"md","text":"### A memory diagram\n\nWe draw memory with small, made-up addresses so the arithmetic is easy. Here is `int a[3] = {10, 20, 30};` if `a[0]` started at address 1000. Each `int` uses 4 bytes, and the elements are **next to each other**, with no gaps:\n\n| Bytes (addresses) | 1000–1003 | 1004–1007 | 1008–1011 |\n|---|---|---|---|\n| Element | `a[0]` = 10 | `a[1]` = 20 | `a[2]` = 30 |\n| Its address | `&a[0]` = 1000 | `&a[1]` = 1004 | `&a[2]` = 1008 |\n\nThe address of element `i` is 1000 + 4 × `i`. Keep this picture in mind for the next lesson."},{"type":"check","q":"A `double` array `d` starts at (made-up) address 2000. What is the address of `d[3]`?","a":"Each `double` is 8 bytes, so `&d[3]` = 2000 + 8 × 3 = **2024**."},{"type":"md","text":"### `void *`: a pointer to \"anything\"\n\nA pointer of type `void *` can hold the address of an object of **any** type. But the compiler does not know what type is stored there, so it cannot dereference it: how many bytes should `*p` read, and as what? To use the object, first **cast** the pointer to the right type: `*((int *) p)` means \"treat `p` as a pointer to `int`, then dereference\".\n\nThis is the type Day 11 promised to explain: `%p` expects a `void *`, which is why we write `printf(\"%p\\n\", (void *) ptr);`."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int x = 7;\n    double y = 2.5;\n\n    void *p = &x;              // ok: p holds the address of an int\n    int n = *((int *) p);      // cast to int * first, then dereference\n    printf(\"n = %d\\n\", n);\n\n    p = &y;                    // ok: now p holds the address of a double\n    double d = *((double *) p);\n    printf(\"d = %f\\n\", d);\n    return 0;\n}","caption":"voidp.c: one void pointer, two types"},{"type":"code","code":"$ gcc -std=c17 -Wall -o voidp voidp.c\n$ ./voidp\nn = 7\nd = 2.500000"},{"type":"code","code":"$ gcc -std=c17 -Wall -o voidbad voidbad.c\nvoidbad.c: In function 'main':\nvoidbad.c:6:13: warning: dereferencing 'void *' pointer\n    6 |     int n = *p;      // error: what type is *p?\n      |             ^~\nvoidbad.c:6:13: error: void value not ignored as it ought to be\n    6 |     int n = *p;      // error: what type is *p?\n      |             ^","caption":"voidbad.c is voidp.c with `int n = *p;` (no cast): it does not compile."},{"type":"why","q":"Why would anyone want a pointer with no type?","a":"To write code that works for **any** type. Library functions such as `memcpy` take `void *` parameters, and later in the course you will build a *generic* stack that stores `void *` elements, so one stack can hold ints, doubles or strings."},{"type":"pitfall","text":"The cast must match what is really there. `*((double *) p)` when `p` holds the address of an `int` compiles fine but reads 8 bytes as a `double` from a 4-byte `int`: undefined behaviour."},{"type":"md","text":"### Key points\n\n- Modern processors are **byte addressable**: an address is the number of one byte.\n- `sizeof` counts bytes; `sizeof(char)` is 1; `CHAR_BIT` (in `<limits.h>`) is the bits per byte, at least 8 (8 on our machines).\n- An object uses consecutive bytes; its address is the address of its first byte. Array elements sit next to each other: `&a[i]` = start + `i` × `sizeof` element.\n- A `void *` can point at any type, but must be cast (e.g. `*((int *) p)`) before it is dereferenced."}]},{"id":"c12-arith","title":"Pointer arithmetic: arr + i and *(arr + i)","notebook":"c/pointers.ipynb","priority":"high","examNote":"Quiz 2 (2023) asked: *create a pointer `p` that points at the third element of `arr`* (answer: `int *p = arr + 2;` or `int *p = &arr[2];`). The Fall 2016 final (Q3) asked for the output of code using `*numbers` and `*(numbers+2)`. Know that `*(a + i)` is `a[i]`, and that `*a + 2` is something else.","blocks":[{"type":"md","text":"### The name of an array is a pointer to its first element\n\nThe pointers notebook says pointer arithmetic is \"useful when working with arrays\" and sends you to the arrays notebook for the details. Here they are.\n\nIn an expression, the name of an array, `arr`, acts as a pointer to `arr[0]`. So `arr == &arr[0]` is true, and `int *p = arr;` makes `p` point at the first element. (You saw this on Day 5: it is why an array argument is not copied.)"},{"type":"md","text":"### Adding an integer to a pointer\n\nIf `p` points at an element of an array, then:\n\n- `p + 1` points at the **next element**, `p - 1` at the previous one;\n- `p + i` points `i` **elements** further on, `p - i` points `i` elements back.\n\nThe step is one **element**, not one byte: the compiler multiplies `i` by the size of the element type for you. In the diagram from the last lesson (`int`s starting at 1000), `a + 1` is 1004 and `a + 2` is 1008.\n\n```\n            a        a + 1    a + 2    a + 3    a + 4    a + 5\n            |        |        |        |        |        |\n            v        v        v        v        v        v\n         +--------+--------+--------+--------+--------+\n  a:     |   10   |   20   |   30   |   40   |   50   |\n         +--------+--------+--------+--------+--------+\n  address  1000     1004     1008     1012     1016     1020\n```\n\n`a + 5` points just past the last element. It is the **too-far pointer**: C guarantees it exists and you may compare with it, but you must **never dereference** it."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int a[3] = {1, 2, 3};\n    double d[3] = {1.0, 2.0, 3.0};\n    int *pa = a;\n    double *pd = d;\n    printf(\"pa     = %p\\n\", (void *) pa);\n    printf(\"pa + 1 = %p\\n\", (void *) (pa + 1));\n    printf(\"pd     = %p\\n\", (void *) pd);\n    printf(\"pd + 1 = %p\\n\", (void *) (pd + 1));\n    return 0;\n}","caption":"step.c: + 1 moves one element"},{"type":"code","code":"$ gcc -std=c17 -Wall -o step step.c\n$ ./step\npa     = 0x7ffe7aaac0c4\npa + 1 = 0x7ffe7aaac0c8\npd     = 0x7ffe7aaac0d0\npd + 1 = 0x7ffe7aaac0d8","caption":"One run (addresses change every run). For the `int *`, + 1 added 4 bytes (c4 → c8). For the `double *`, + 1 added 8 bytes (d0 → d8)."},{"type":"md","text":"### `*(arr + i)` is `arr[i]`\n\nDereference the moved pointer and you get the element: `*(arr + i)` **is** `arr[i]`. In fact C *defines* `a[i]` to mean `*(a + i)`. That is why square brackets also work on any pointer: if `p` points into an array, `p[1]` means `*(p + 1)`.\n\nSo there are two ways to point at the third element (index 2) of `arr`:\n\n```c\nint *p = arr + 2;     // pointer arithmetic\nint *q = &arr[2];     // address of the element\n```"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int arr[5] = {10, 20, 30, 40, 50};\n\n    int *p = arr;           // same as &arr[0]\n    int *q = arr + 2;       // same as &arr[2]: points at the third element\n\n    printf(\"*p = %d\\n\", *p);\n    printf(\"*q = %d\\n\", *q);\n    printf(\"*(q + 1) = %d\\n\", *(q + 1));   // arr[3]\n    printf(\"*(q - 2) = %d\\n\", *(q - 2));   // arr[0]\n    printf(\"*(arr + 4) = %d\\n\", *(arr + 4)); // arr[4]\n\n    *(arr + 1) = -20;       // same as arr[1] = -20\n    printf(\"arr[1] = %d\\n\", arr[1]);\n\n    if (q == &arr[2]) {\n        puts(\"q equals &arr[2]\");\n    }\n    return 0;\n}","caption":"arith.c: pointers into an array"},{"type":"code","code":"$ gcc -std=c17 -Wall -o arith arith.c\n$ ./arith\n*p = 10\n*q = 30\n*(q + 1) = 40\n*(q - 2) = 10\n*(arr + 4) = 50\narr[1] = -20\nq equals &arr[2]"},{"type":"pitfall","text":"Brackets matter. `*(arr + 2)` is the element at index 2. `*arr + 2` is `(*arr) + 2`: the **value** of `arr[0]` plus 2. With `arr = {10, 20, 30}`, the first is 30 and the second is 12. The `*` binds tighter than `+`."},{"type":"check","q":"`int a[] = {5, 10, 15, 20};` What are `*(a + 3)`, `*a + 3`, and `*(a + 1) + *(a + 2)`?","a":"`*(a + 3)` = `a[3]` = 20. `*a + 3` = 5 + 3 = 8. `*(a + 1) + *(a + 2)` = 10 + 15 = 25."},{"type":"md","text":"### Comparing and subtracting pointers; walking with `p++`\n\nThe notebook's rules for comparing pointers:\n\n- `p == q` is true when both point at the **same object** (or both are `NULL`). Two different variables holding equal values are still different objects, so pointers to them are **not** equal.\n- For two pointers into the **same array**, `<`, `<=`, `>`, `>=` compare positions: `p < q` is true when `p` points at an earlier element.\n- `q - p` (same array) is the number of **elements** from `p` to `q`, not bytes. Its type is `ptrdiff_t` (a signed integer type from `<stddef.h>`), printed with `%td`.\n\n`p++`, `p--`, `p += n`, `p -= n` move a pointer. Together with `<` and the too-far pointer they give a loop with no square brackets:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int arr[5] = {10, 20, 30, 40, 50};\n\n    // forwards: stop at the too-far pointer arr + 5\n    for (int *p = arr; p < arr + 5; p++) {\n        printf(\"%d \", *p);\n    }\n    printf(\"\\n\");\n\n    // how far apart are two pointers? (in elements, not bytes)\n    int *first = &arr[1];\n    int *last = &arr[4];\n    printf(\"last - first = %td\\n\", last - first);\n    return 0;\n}","caption":"walk.c: a pointer loop and pointer subtraction"},{"type":"code","code":"$ gcc -std=c17 -Wall -o walk walk.c\n$ ./walk\n10 20 30 40 50 \nlast - first = 3"},{"type":"md","text":"Memory diagram of `walk.c`'s loop on its third pass:\n\n```\n          arr                         arr + 5 (too far: never *)\n           |                            |\n           v                            v\n        +------+------+------+------+------+\n  arr:  |  10  |  20  |  30  |  40  |  50  |\n        +------+------+------+------+------+\n                       ^\n                       |\n                       p        (*p is 30; then p++ moves it one element right)\n```\n\nThe loop stops when `p` reaches `arr + 5`, before it is ever dereferenced."},{"type":"pitfall","text":"No bounds checking: `*(arr + 7)` on a 5-element array compiles and is undefined behaviour, exactly like `arr[7]`. And only pointers into the same array may be compared with `<` or subtracted."},{"type":"why","q":"Why does `p + 1` add 4 (or 8) bytes instead of 1?","a":"Because `p` has a type. An `int *` points at 4-byte objects, so the next `int` starts 4 bytes later. Scaling by the element size is what makes `*(p + i)` equal `p[i]` for every type."},{"type":"md","text":"### Key points\n\n- An array name acts as a pointer to element 0: `arr == &arr[0]`.\n- `p + i` points `i` **elements** further (the compiler scales by the element size); `p - i` points back.\n- `*(arr + i)` is `arr[i]`; `p[i]` works on pointers too. `*arr + i` is a different thing.\n- Pointer to the third element: `int *p = arr + 2;` or `int *p = &arr[2];`.\n- `arr + n` is the too-far pointer: compare with it, never dereference it. Loop: `for (int *p = arr; p < arr + n; p++)`.\n- `q - p` = number of elements between them (`ptrdiff_t`, `%td`). `==` means same object."}]},{"id":"c12-results","title":"Pointers as results: max, bad calls, returning a pointer","notebook":"c/pointers.ipynb","priority":"high","examNote":"The April 2022 final (Q2) gave a function returning the **index** of the maximum and asked how to change only the `return` so it returns a **pointer** to the maximum (`return arr + index;` or `return &arr[index];`), then asked for a version with no square brackets at all. Quiz 2 (2023) asked the same about a minimum. Practise both forms. The blank writing item below is modeled on April 2022 Q2(b) (`ptr2max`), with new details.","blocks":[{"type":"md","text":"### Returning two results: one by `return`, one through a pointer\n\nA function returns only one value. Yesterday's `swap` showed the fix: pass the **address** of the caller's variable, and the function stores into it with `*`. The notebook's `max` uses this to give back two answers: the largest value (returned) and its index (stored through the pointer `index`)."},{"type":"code","code":"#include <stdio.h>\n\n// Returns the maximum value in the array a having count elements.\n// The index of the maximum element is stored in the object pointed at\n// by index.\nint max(int a[], size_t count, size_t *index) {\n    int hi = a[0];\n    size_t i_hi = 0;\n    for (size_t i = 1; i < count; i++) {\n        if (a[i] > hi) {\n            hi = a[i];\n            i_hi = i;\n        }\n    }\n    *index = i_hi;\n    return hi;\n}\n\nint main(void) {\n    int arr[] = { 6, 3, 1, 8, 7, 9, 4, 2, 5 };\n\n    // must declare a variable to store the index in\n    size_t i;\n    int big = max(arr, 9, &i);\n\n    printf(\"max = %d, index = %zu\\n\", big, i);\n    return 0;\n}","caption":"max.c (from c/src/pointers; printed with %zu, the course's conversion for size_t)"},{"type":"code","code":"$ gcc -std=c17 -Wall -o max max.c\n$ ./max\nmax = 9, index = 5"},{"type":"md","text":"Memory diagram just before `max` returns. The parameter `index` holds the address of `main`'s `i`, so `*index = i_hi;` writes 5 into `main`'s variable:\n\n```\n  main:   arr  [6][3][1][8][7][9][4][2][5]      i: [ 5 ]   <--+\n                ^                                             |\n                |                                             |\n  max:     a ---+    count: [9]   hi: [9]   i_hi: [5]   index: [ &i ]\n```\n\nNote that `a` points at `main`'s array (the array was not copied), and `index` points at `main`'s `i`."},{"type":"why","q":"Why must `main` declare `size_t i;` and pass `&i`?","a":"`max` writes to `*index`. That needs a real `size_t` object to write into. `main` creates it (`size_t i;`) and hands over its address. The function cannot create it for you: its own local variables disappear when it returns."},{"type":"md","text":"### The common mistake: a pointer that points at nothing\n\nThe notebook's `bad_call_to_max.c` declares a **pointer** instead of a `size_t`, and passes the pointer:\n\n```c\nsize_t *i;                   // oops: uninitialized, points nowhere valid\nint big = max(arr, 9, i);    // max does *index = ..., writing to a random address\n```\n\nIt looks like the call passes \"a place for the answer\", but `i` holds garbage, so `*index = i_hi;` writes to an unknown address. That is **undefined behaviour**: it may crash, may seem to work, may corrupt other data. `gcc -Wall` warns you:"},{"type":"code","code":"$ gcc -std=c17 -Wall -o badmax badmax.c\nbadmax.c: In function 'main':\nbadmax.c:21:15: warning: 'i' is used uninitialized [-Wuninitialized]\n   21 |     int big = max(arr, 9, i);\n      |               ^~~~~~~~~~~~~~\nbadmax.c:20:13: note: 'i' was declared here\n   20 |     size_t *i;\n      |             ^","caption":"badmax.c is the notebook's bad_call_to_max.c (comments shortened, index printed with `%zu`). Treat this warning as an error."},{"type":"pitfall","text":"When a function wants a pointer \"to store the answer in\", declare a normal variable (`size_t i;`) and pass `&i`. Declaring a pointer variable (`size_t *i;`) creates no place to store anything."},{"type":"md","text":"### Pointers and large objects\n\nC passes arguments **by value**: the parameter gets a copy. For a big object that copy costs time and memory. Passing a **pointer** copies only the address (8 bytes on our machines), however big the object is. Arrays get this for free: an array argument *decays* to a pointer to its first element (Day 5), so `max` never copies `arr`."},{"type":"md","text":"### Returning a pointer\n\nA function can also **return** a pointer, for example a pointer to the largest element, instead of its index. If you know the index, the pointer is `a + index` (or `&a[index]`). The caller can then read the element with `*p`, change it, or get the index back with `p - a`."},{"type":"code","code":"#include <stdio.h>\n\n// Returns a pointer to the larges
