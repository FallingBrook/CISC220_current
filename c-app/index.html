 n /= 2;\n        steps++;\n    }\n    printf(\"n = %d, steps = %d\\n\", n, steps);\n    return 0;\n}","answer":"n = 1, steps = 4","explain":"n goes 20, 10, 5, 2, 1 (5 / 2 is 2 and 2 / 2 is 1, integer division). That is 4 halvings; then `n > 1` is false."},{"id":"c2-q-11","topic":"c2-control","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int x = 4;\n    printf(\"%d %d %d\\n\", x > 3 && x < 10, x == 3 || x == 5, !(x % 2));\n    return 0;\n}","answer":"1 0 1","explain":"4 > 3 && 4 < 10 is true (1). 4 == 3 || 4 == 5 is false (0). 4 % 2 is 0 and !0 is 1."},{"id":"c2-q-12","topic":"c2-control","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int t = 25;\n    if (t > 10) {\n        puts(\"warm\");\n    } else if (t > 20) {\n        puts(\"hot\");\n    } else {\n        puts(\"cold\");\n    }\n    return 0;\n}","answer":"warm","explain":"The conditions are tested in order and only the first true branch runs. 25 > 10 is true, so it prints warm and never tests t > 20. (Put the stricter test first to get hot.)"},{"id":"c2-q-13","topic":"c2-control","type":"short","q":"This program is compiled and run, then the user types `echo $?`. What two things are printed (program output, then the exit status)?","code":"#include <stdio.h>\n\nint add3(int n) {\n    return n + 3;\n}\n\nint main(void) {\n    int a = 1;\n    a = add3(add3(a));\n    printf(\"%d\\n\", a);\n    return add3(-1);\n}","answer":"7 is printed by the program; echo $? prints 2.","explain":"add3(add3(1)) is add3(4) = 7. main returns add3(-1) = 2, which becomes the exit status."},{"id":"c2-q-14","topic":"c2-control","type":"short","q":"A program calls `int twice(int x)` inside `main`, but the definition of `twice` is written below `main`. Name two ways to fix the warning `implicit declaration of function 'twice'`.","answer":"Move the definition of twice above main, or put the prototype `int twice(int x);` above main.","explain":"The compiler reads top to bottom; it must have seen a declaration of twice before the call."}],"write":[{"id":"c2-w-01","topic":"c2-control","stage":"worked","marks":4,"prompt":"Write a function `average3` that takes three `int` parameters and returns their average as a `double` (for example, `average3(1, 2, 2)` returns 1.666...). Then write a `main` that prints `average3(1, 2, 2)` and `average3(70, 85, 90)`, each with 3 digits after the decimal point on its own line, and returns 0.","starter":"","solution":"#include <stdio.h>\n\n// returns the average of a, b and c as a double\ndouble average3(int a, int b, int c) {\n    return (a + b + c) / 3.0;\n}\n\nint main(void) {\n    printf(\"%.3f\\n\", average3(1, 2, 2));\n    printf(\"%.3f\\n\", average3(70, 85, 90));\n    return 0;\n}","explain":"The function goes above `main` so the compiler knows it before the call. `a + b + c` is an `int`; dividing by the `double` literal `3.0` makes it floating-point division (dividing by `3` would truncate: 5 / 3 is 1). The return type `double` matches. In `main`, `%.3f` prints 3 digits after the point. Output:\n\n```\n1.667\n81.667\n```","rubric":[{"marks":1,"item":"Correct header `double average3(int a, int b, int c)`, defined above main"},{"marks":1,"item":"Floating-point division (`3.0` or a cast), not int division"},{"marks":1,"item":"Returns the value with `return`"},{"marks":1,"item":"main calls it twice and prints with `%.3f\\n`; returns 0"}],"pitfalls":["`(a + b + c) / 3` truncates before the result becomes a double.","`(double) ((a + b + c) / 3)` casts too late.","Printing a double with `%d` is undefined behaviour."]},{"id":"c2-w-02","topic":"c2-printf","stage":"faded","marks":4,"prompt":"Fill in the blanks so the program prints a Celsius to Fahrenheit table for 0, 20, 40, ..., 100. The Celsius value is right-aligned in width 4, then a space, then Fahrenheit (F = C * 9 / 5 + 32) right-aligned in width 6 with 1 digit after the point. Expected output:\n\n```\n   C      F\n   0   32.0\n  20   68.0\n  40  104.0\n  60  140.0\n  80  176.0\n 100  212.0\n```","starter":"#include <stdio.h>\n\nint main(void) {\n    printf(\"   C      F\\n\");\n    for (____ c = 0; c <= 100; ____) {\n        double f = c * ____ / 5.0 + 32;\n        printf(\"____ ____\\n\", c, f);\n    }\n    return 0;\n}","solution":"#include <stdio.h>\n\nint main(void) {\n    printf(\"   C      F\\n\");\n    for (int c = 0; c <= 100; c += 20) {\n        double f = c * 9.0 / 5.0 + 32;\n        printf(\"%4d %6.1f\\n\", c, f);\n    }\n    return 0;\n}","rubric":[{"marks":1,"item":"Counter declared as `int` in the for"},{"marks":1,"item":"Step `c += 20`"},{"marks":1,"item":"`9.0` (or a cast) so the conversion is not integer division"},{"marks":1,"item":"Format `\"%4d %6.1f\\n\"`"}],"pitfalls":["Writing `9` instead of `9.0` makes `c * 9 / 5` integer arithmetic. It happens to be exact for multiples of 20, but for c = 1 it gives 33.0 instead of 33.8. Use `9.0`.","`c++` would print every degree, not every 20.","Width counts the point and the digit after it: 212.0 is 5 characters, so `%6.1f` adds one space."]},{"id":"c2-w-03","topic":"c2-control","stage":"blank","marks":5,"prompt":"A year is a leap year if it is divisible by 4, except that years divisible by 100 are not, except that years divisible by 400 are. Write a function `int is_leap(int year)` that returns 1 for a leap year and 0 otherwise, and a `main` (using `int main(void)`) that uses a `for` loop and `is_leap` to print every leap year from 1896 to 1912 inclusive, one per line. Expected output:\n\n```\n1896\n1904\n1908\n1912\n```","starter":"","solution":"#include <stdio.h>\n\n// returns 1 if year is a leap year, 0 otherwise\nint is_leap(int year) {\n    if (year % 400 == 0) {\n        return 1;\n    } else if (year % 100 == 0) {\n        return 0;\n    } else if (year % 4 == 0) {\n        return 1;\n    }\n    return 0;\n}\n\nint main(void) {\n    for (int y = 1896; y <= 1912; y++) {\n        if (is_leap(y)) {\n            printf(\"%d\\n\", y);\n        }\n    }\n    return 0;\n}","rubric":[{"marks":1,"item":"`is_leap` defined above main (or declared with a prototype) with the right header"},{"marks":2,"item":"Correct rule using `%` and if/else if or `&&`/`||` (1900 is not a leap year, 2000 is)"},{"marks":1,"item":"for loop from 1896 to 1912 inclusive (`<=`)"},{"marks":1,"item":"Prints only the leap years with `%d\\n`; returns 0"}],"pitfalls":["Testing `year % 4 == 0` first returns 1 for 1900. Test 400, then 100, then 4, or use `(year % 4 == 0 && year % 100 != 0) || year % 400 == 0`.","`y < 1912` misses 1912.","`if (is_leap(y) = 1)` is an assignment; write `if (is_leap(y))` or `== 1`."]}]},{"day":3,"title":"Arrays, strings and command-line arguments","goal":"Use arrays and C strings, read command-line arguments, and build a new string character by character: the skills for concat2.c.","topics":[{"id":"c3-arrays","title":"Arrays","notebook":"c/arrays.ipynb","priority":"high","examNote":"Exam questions often ask what a short loop over an array prints, or what is wrong with an index. Remember: the last element of an array of capacity n is at index n - 1.","blocks":[{"type":"md","text":"An **array** is a row of variables that all have the same type, stored side by side in memory. You pick one element with an **index** (its position) in square brackets.\n\n```c\nint a[5];\n```\n\ndeclares an array named `a` with **capacity** 5 (room for 5 `int`s). The elements are `a[0]`, `a[1]`, `a[2]`, `a[3]` and `a[4]`. Indexes **start at 0**, so the last index is 4, not 5. The capacity never changes while the array exists.\n\nLike a plain `int` variable, the elements of `int a[5];` start with **no particular value** (whatever was in that memory). Give them values before you read them. A `for` loop from `0` to `n - 1` visits every element:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int a[5];          // an array of 5 ints: a[0] to a[4]\n    for (int i = 0; i < 5; i++) {\n        a[i] = 10 * i;\n    }\n    for (int i = 0; i < 5; i++) {\n        printf(\"a[%d] = %d\\n\", i, a[i]);\n    }\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o array1 array1.c\n$ ./array1\na[0] = 0\na[1] = 10\na[2] = 20\na[3] = 30\na[4] = 40","caption":"Compiled and run"},{"type":"md","text":"### Initialiser lists\n\nAn **initialiser list** gives the elements their values at the point where the array is declared:\n\n- `int x[] = {4, 8, 15, 16, 23};` with empty brackets: the compiler counts the list, so the capacity is 5.\n- `int y[4] = {7, 9};` with fewer values than the capacity: the rest of the elements are set to 0.\n- `int z[3] = {1, 2, 3, 4};` with too many values: a compiler warning (*excess elements*), and the extra value is thrown away. Never do it."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int x[] = {4, 8, 15, 16, 23};   // capacity 5, counted from the list\n    int y[4] = {7, 9};              // y[2] and y[3] become 0\n\n    int sum = 0;\n    for (int i = 0; i < 5; i++) {\n        sum = sum + x[i];\n    }\n    printf(\"sum of x = %d\\n\", sum);\n\n    for (int i = 0; i < 4; i++) {\n        printf(\"%d \", y[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o init init.c\n$ ./init\nsum of x = 66\n7 9 0 0 "},{"type":"md","text":"You cannot assign a whole array with `=` (`x = y;` is a compile error). To copy an array, copy its elements one at a time with a loop."},{"type":"pitfall","text":"**C does not check indexes.** Java throws an exception for `a[5]` when `a` has 5 elements. C does not: it reads or writes whatever memory lies past the end of the array. That is **undefined behaviour**: the C standard says nothing about what happens. The program might print garbage, crash, change another variable, or seem to work today and fail tomorrow. There is no \"correct output\" for such a program. `gcc -Wall` catches only some of these mistakes, so check your loop bounds yourself: `i < n`, not `i <= n`."},{"type":"md","text":"### Variable-length arrays\n\nSo far the capacity was a constant like `5`. In C99 and later (including C17, which we use with gcc) the capacity of a local array may be any integer expression whose value is only known **when the program runs**. This is a **variable-length array** (VLA):"},{"type":"code","code":"#include <stdio.h>\n\nvoid squares(int n) {\n    int sq[n];         // variable-length array: n is known only when the program runs\n    for (int i = 0; i < n; i++) {\n        sq[i] = i * i;\n    }\n    for (int i = 0; i < n; i++) {\n        printf(\"%d \", sq[i]);\n    }\n    printf(\"\\n\");\n}\n\nint main(void) {\n    squares(3);\n    squares(6);\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o vla vla.c\n$ ./vla\n0 1 4 \n0 1 4 9 16 25 "},{"type":"md","text":"Each call to `squares` makes a fresh array of the size it needs. The course notebooks use VLAs the same way, for example `char dest1[len + 1];` where `len` was computed by `strlen`. Rules for a VLA:\n\n- it must be a local variable (declared inside a function);\n- it cannot have an initialiser list (`int sq[n] = {0};` is an error); fill it with a loop instead;\n- its size must be greater than 0 (a size of 0 or less is undefined behaviour), and should be small (it lives on the *stack*, which you will meet later)."},{"type":"check","q":"`double v[10];` What are the first and last valid indexes?","a":"`v[0]` and `v[9]`. Ten elements, numbered 0 to 9."},{"type":"check","q":"What does `int c[6] = {5};` put in `c[0]` and in `c[5]`?","a":"`c[0]` is 5. The other five elements, including `c[5]`, are 0 because the list is shorter than the capacity."},{"type":"why","q":"Why is `for (int i = 0; i <= 5; i++) a[i] = 0;` wrong for `int a[5];`?","a":"The last pass uses `a[5]`, one element past the end. C does not stop you; writing there is undefined behaviour. Use `i < 5`."},{"type":"md","text":"### Key points\n\n- `T a[n];` makes `n` elements of type `T`, indexed `0` to `n - 1`.\n- Elements are not set to anything unless you use an initialiser list; a short list fills the rest with 0.\n- No bounds checking: going out of bounds is undefined behaviour, not an error message.\n- Arrays cannot be assigned with `=`; copy element by element.\n- A variable-length array `char s[n];` gets its size at run time (C99/C17); no initialiser list, size must be > 0."}]},{"id":"c3-strings","title":"C strings: '\\0', strlen and building a new string","notebook":"c/strings.ipynb","priority":"high","examNote":"Expect to write code that builds a string in a `char` array. Markers look for the array size (length + 1) and the `'\\0'` at the end.","blocks":[{"type":"md","text":"C has no string type. A **string** in C is an array of `char` whose end is marked by the **null character** `'\\0'` (also called the *null terminator*). Its numeric value is 0. Do not confuse it with the digit `'0'`, whose value is 48:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    char zero = '0';\n    char terminator = '\\0';\n    printf(\"'0' has the value %d\\n\", zero);\n    printf(\"'\\\\0' has the value %d\\n\", terminator);\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o terminator terminator.c\n$ ./terminator\n'0' has the value 48\n'\\0' has the value 0"},{"type":"md","text":"### String literals\n\nA **string literal** is text in double quotes, such as `\"CISC220\"`. The compiler adds the `'\\0'` for you. So\n\n```c\nchar s[] = \"CISC220\";\n```\n\nmakes an array of **8** chars, not 7:\n\n| index | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n|---|---|---|---|---|---|---|---|---|\n| `s[i]` | `'C'` | `'I'` | `'S'` | `'C'` | `'2'` | `'2'` | `'0'` | `'\\0'` |\n\nNotice that `s[6]` is the digit `'0'` and `s[7]` is the terminator `'\\0'`. The array `s` is a copy of the literal, so you may change its elements, for example `s[0] = 'c';`.\n\n### strlen\n\n`strlen(s)`, declared in `<string.h>`, returns the **length** of the string: the number of characters *before* the first `'\\0'`. It returns a `size_t`, so print it with `%zu`. `strlen` walks along the array until it finds `'\\0'`; if there is no `'\\0'`, it runs off the end (undefined behaviour)."},{"type":"code","code":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char s[] = \"CISC220\";      // 7 characters + '\\0' = an array of 8 chars\n    size_t len = strlen(s);\n    printf(\"s = %s, length = %zu\\n\", s, len);\n    printf(\"s[0] = %c, s[6] = %c\\n\", s[0], s[6]);\n\n    char empty[] = \"\";         // holds only '\\0'\n    printf(\"empty has length %zu\\n\", strlen(empty));\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o length length.c\n$ ./length\ns = CISC220, length = 7\ns[0] = C, s[6] = 0\nempty has length 0"},{"type":"md","text":"**The +1 rule.** A string of length `n` needs an array of **`n + 1`** chars: `n` for the characters and 1 for the `'\\0'`. The empty string `\"\"` has length 0 but still uses 1 char."},{"type":"md","text":"### Building a NEW string, character by character\n\nTo make a string that did not exist before:\n\n1. work out its length `n`;\n2. declare a `char` array of size `n + 1` (a variable-length array if `n` is computed at run time);\n3. fill indexes `0` to `n - 1` with a loop;\n4. put `'\\0'` at index `n`.\n\nOnly then is it a string that `printf(\"%s\\n\", s)`, `puts(s)` and `strlen(s)` can use. Here `stars(n)` builds a string of `n` stars:"},{"type":"code","code":"#include <stdio.h>\n\nvoid stars(int n) {\n    char s[n + 1];             // n stars + 1 for '\\0'\n    for (int i = 0; i < n; i++) {\n        s[i] = '*';\n    }\n    s[n] = '\\0';               // end the string\n    printf(\"[%s]\\n\", s);\n}\n\nint main(void) {\n    stars(3);\n    stars(7);\n    stars(0);\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o stars stars.c\n$ ./stars\n[***]\n[*******]\n[]"},{"type":"md","text":"The same steps copy an existing string. The copy is a separate array, so changing it does not change the original:"},{"type":"code","code":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char src[] = \"hello\";\n    size_t n = strlen(src);    // 5\n    char dest[n + 1];          // 6 chars: room for '\\0'\n\n    for (size_t i = 0; i < n; i++) {\n        dest[i] = src[i];\n    }\n    dest[n] = '\\0';\n\n    dest[0] = 'J';             // dest is a separate copy\n    printf(\"%s\\n\", src);\n    puts(dest);\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o copy copy.c\n$ ./copy\nhello\nJello"},{"type":"md","text":"Two ways to print a string `s`:\n\n- `printf(\"%s\\n\", s);` where `%s` means \"print the chars up to `'\\0'`\". You write the `\\n`.\n- `puts(s);` prints the string **and adds a newline** itself.\n\n(`<string.h>` also has `strcpy` and `strcat`, which copy and join strings. Later days cover them. Today you write the loops yourself, which is what an exam or an assignment that forbids those functions expects.)"},{"type":"pitfall","text":"**Forgetting the `'\\0'`** (or leaving no room for it). `char t[5];` filled with `h e l l o` and no `'\\0'` is *not* a string. `printf(\"%s\", t)` keeps reading past the end of `t` until it happens to meet a 0 byte: undefined behaviour. You may see `hello` followed by junk, or nothing odd at all, which is worse because the bug hides."},{"type":"check","q":"How many chars does `char w[] = \"queens\";` have, and what is `strlen(w)`?","a":"7 chars (6 letters + `'\\0'`); `strlen(w)` is 6."},{"type":"check","q":"You want to store a string of length `len` (a `size_t`). Write the declaration of the array `buf`.","a":"`char buf[len + 1];`"},{"type":"why","q":"Why does `strlen` need `'\\0'` at all? Can't it just ask the array its size?","a":"A C array does not store its own length anywhere. The `'\\0'` is the only way a function like `strlen`, `printf` or `puts` can tell where the string stops."},{"type":"md","text":"### Key points\n\n- A C string is a `char` array ending in `'\\0'` (value 0, not the digit `'0'`).\n- A literal `\"abc\"` holds 4 chars; the compiler adds the `'\\0'`.\n- `strlen` (from `<string.h>`) counts chars before `'\\0'` and returns `size_t` (`%zu`).\n- A string of length `n` needs `n + 1` chars.\n- To build a string: size `n + 1`, fill `0..n-1`, then put `'\\0'` at index `n`. Then print with `printf(\"%s\\n\", s)` or `puts(s)`."}]},{"id":"c3-argv","title":"Command-line arguments: argc and argv","notebook":"c/strings.ipynb","priority":"high","examNote":"Know what `argc` and `argv[0]` are when a program is run with no arguments, and always check `argc` before using `argv[i]`.","blocks":[{"type":"md","text":"In Bash you used `$#`, `$0`, `$1`, `$2`... to read a script's arguments. C has the same idea. Write `main` as\n\n```c\nint main(int argc, char *argv[])\n```\n\n- `argc` (*argument count*) is the number of words on the command line, **including the program name**.\n- `argv` (*argument vector*) is an array of strings. `argv[0]` is the program name as you typed it, `argv[1]` is the first argument, and so on up to `argv[argc - 1]`.\n\nFor now, read `char *` as \"a string\"; the `*` (a *pointer*) is explained on a later day. The shell splits the words and removes quotes before your program sees them, exactly as for a Bash script:"},{"type":"code","code":"#include <stdio.h>\n\nint main(int argc, char *argv[]) {\n    printf(\"argc = %d\\n\", argc);\n    for (int i = 0; i < argc; i++) {\n        printf(\"argv[%d] = \\\"%s\\\"\\n\", i, argv[i]);\n    }\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o args args.c\n$ ./args\nargc = 1\nargv[0] = \"./args\"\n$ ./args hello \"two words\" ''\nargc = 4\nargv[0] = \"./args\"\nargv[1] = \"hello\"\nargv[2] = \"two words\"\nargv[3] = \"\"","caption":"Quotes keep \"two words\" together; '' is an empty argument"},{"type":"md","text":"So `argc` is always at least 1, and with no arguments `argc` is 1 (in Bash, `$#` would be 0).\n\n### Check argc first\n\nIf the user gave fewer arguments than you expect, `argv[1]` or `argv[2]` is not a string you may use. Reading it is undefined behaviour (often a crash). So test `argc` **before** using `argv[i]`.\n\nA good program prints a usage message to **standard error** and exits with a non-zero status, like a careful Bash script. `fprintf(stderr, ...)` works exactly like `printf`, but writes to standard error instead of standard output:\n\n```c\nif (argc != 2) {\n    fprintf(stderr, \"usage: %s word\\n\", argv[0]);\n    return 1;\n}\n```\n\n### argv[i][j] is a char\n\n`argv[i]` is a string, so `argv[i][j]` is its character at index `j`, a `char` (`%c`). Each `argv[i]` ends with `'\\0'`, so `strlen(argv[i])` works on it:"},{"type":"code","code":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    if (argc < 2) {\n        fprintf(stderr, \"usage: %s word\\n\", argv[0]);\n        return 1;\n    }\n    size_t n = strlen(argv[1]);\n    for (size_t j = 0; j < n; j++) {\n        printf(\"argv[1][%zu] = '%c'\\n\", j, argv[1][j]);\n    }\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o letters letters.c\n$ ./letters hey\nargv[1][0] = 'h'\nargv[1][1] = 'e'\nargv[1][2] = 'y'\n$ echo $?\n0\n$ ./letters\nusage: ./letters word\n$ echo $?\n1"},{"type":"md","text":"### Worked example: every character doubled\n\nGoal: `./doubled abc` prints `aabbcc`. The program must **build a new string** and then print it. Follow the steps from the strings lesson:\n\n1. Check `argc`.\n2. Measure: `n = strlen(argv[1])`.\n3. Size: the new string has `2 * n` characters, so the array needs `2 * n + 1`.\n4. Copy: character `i` of the input goes to positions `2 * i` and `2 * i + 1`.\n5. Terminate: the last character is at `2 * n - 1`, so `'\\0'` goes at `2 * n`.\n6. Print the new string."},{"type":"code","code":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    // 1. check argc before touching argv[1]\n    if (argc != 2) {\n        fprintf(stderr, \"usage: %s word\\n\", argv[0]);\n        return 1;\n    }\n    // 2. measure the input\n    size_t n = strlen(argv[1]);\n    // 3. make an array big enough: 2 copies of each char, plus '\\0'\n    char d[2 * n + 1];\n    // 4. copy characters into their new positions\n    for (size_t i = 0; i < n; i++) {\n        d[2 * i] = argv[1][i];\n        d[2 * i + 1] = argv[1][i];\n    }\n    // 5. terminate\n    d[2 * n] = '\\0';\n    // 6. print the NEW string\n    printf(\"%s\\n\", d);\n    return 0;\n}\n"},{"type":"code","code":"$ gcc -Wall -o doubled doubled.c\n$ ./doubled abc\naabbcc\n$ ./doubled \"a b\"\naa  bb\n$ ./doubled ''\n\n$ ./doubled\nusage: ./doubled word","caption":"An empty argument gives an empty string, so only a newline is printed"},{"type":"md","text":"Check the empty case by hand: with `n = 0` the array has size 1, the loop does nothing, and `d[0] = '\\0'` makes the empty string. That is why `2 * n + 1` is safe even for `\"\"`. Test with `\"\"` and with arguments that contain spaces every time you write a program like this."},{"type":"check","q":"`./prog one two` What are `argc`, `argv[0]` and `argv[2]`?","a":"`argc` is 3, `argv[0]` is `\"./prog\"`, `argv[2]` is `\"two\"`."},{"type":"check","q":"`./prog \"Kingston ON\"` What is `argv[1][8]`?","a":"`' '` (a space). `argv[1]` is `\"Kingston ON\"`: K=0, i=1, n=2, g=3, s=4, t=5, o=6, n=7, space=8."},{"type":"why","q":"Why must the `if (argc != 2)` test come before `strlen(argv[1])`?","a":"If there is no argument, `argv[1]` is not a real string; passing it to `strlen` is undefined behaviour (usually a crash). Checking `argc` first guarantees `argv[1]` exists."},{"type":"md","text":"### Key points\n\n- `int main(int argc, char *argv[])`: `argc` counts the program name too; `argv[0]` is the program name.\n- Arguments are `argv[1]` to `argv[argc - 1]`; each is a `'\\0'`-terminated string.\n- Check `argc` before using `argv[i]`; report problems with `fprintf(stderr, ...)` and a non-zero exit status.\n- `argv[i][j]` is one `char`.\n- Build new strings with the five steps: measure, size (+1), copy, terminate, print."}]},{"id":"c3-concat2","title":"Plan for concat2.c (Assignment 4)","notebook":"c/strings.ipynb","priority":"high","blocks":[{"type":"md","text":"Assignment 4 asks for `concat2.c`: a program that joins its two command-line arguments into one **new** string and prints it. This lesson is a plan in words; writing the code is your job (it is graded). Everything you need is in the three lessons above.\n\n### What the checker expects\n\nBuilt from the assignment's examples:\n\n| command | standard output |\n|---|---|\n| `./concat2` | nothing |\n| `./concat2 marsh` | `marsh` |\n| `./concat2 marsh mallow` | `marshmallow` |\n| `./concat2 \"a b\" c` | `a bc` |\n| `./concat2 \"\" xyz` | `xyz` |\n\nEvery case exits with status 0. Re-read the handout for the exact rules, including what to do with more than two arguments. **Note:** the handout's sample output shows `marshmallo`. That is a typo; the right answer (and what the checker expects) is `marshmallow`.\n\nThe assignment also limits which functions you may call: only `strlen`, `printf` and `puts`. So no `strcpy` or `strcat`; you copy characters with loops, as in today's examples."},{"type":"md","text":"### The steps, in words\n\n1. **Handle the `argc` cases first.** Decide what each value of `argc` means (no arguments, one argument, two). Never touch `argv[2]` unless `argc` says it exists.\n2. **Measure both arguments** with `strlen`, storing each length in a `size_t` variable.\n3. **Make an array of the right size.** How many characters does the joined string have? Add one for `'\\0'`. A variable-length array is fine.\n4. **Copy the first argument** into the start of the array with a loop.\n5. **Copy the second argument** right after it. Ask yourself: at which index does its first character go? (Not 0, or you overwrite the first argument.) Work it out on paper for `marsh` + `mallow` first: which index does the `m` of `mallow` land on?\n6. **Terminate**: put `'\\0'` right after the last copied character. Which index is that, in terms of the two lengths?\n7. **Print the new string** once, followed by a newline (`printf` with `%s\\n`, or `puts`)."},{"type":"md","text":"### Hints\n\n- Draw the array as a row of boxes with index numbers for `marsh` + `mallow` (5 + 6 characters). The indexes you need will be obvious.\n- Use `size_t` for lengths and loop counters that are compared with lengths; mixing `int` and `size_t` can give `-Wall` warnings.\n- Test the edge cases from the table: an empty first argument and an empty second argument should both work without special code if your indexes are right."},{"type":"pitfall","text":"**Common mistakes**\n\n- Forgetting the `'\\0'`: the output may look right on one run and show junk on another.\n- Off-by-one size: an array of exactly `len1 + len2` chars has no room for `'\\0'`.\n- Printing instead of building: `printf(\"%s%s\\n\", argv[1], argv[2])` prints the right text but does not make a new string, which is what the assignment asks for.\n- Starting the second copy at index 0, or one place too far (leaving a gap of junk).\n- Using `argv[2]` when only one argument was given."},{"type":"try","text":"Write `concat2.c` in `~/CISC220_A4` (for example `mkdir -p ~/CISC220_A4 && nano ~/CISC220_A4/concat2.c`). Compile it with `gcc -Wall -o concat2 concat2.c` and try the commands in the table. Then run the checker:\n\n```\n$ cd ~/CISC220_current/c-app/drills && ./cdrill.sh a4 ~/CISC220_A4 concat2.c\n```\n\nIt compiles your file, runs the cases above, and warns if you call a function other than `strlen`, `printf` or `puts`."},{"type":"md","text":"### Key points\n\n- Handle `argc` first; never read an argument that is not there.\n- Size = sum of the lengths + 1.\n- Two copy loops; the second starts where the first ended.\n- Terminate with `'\\0'`, then print the new string once.\n- Expected output for `marsh mallow` is `marshmallow` (the handout's `marshmallo` is a typo)."}]}],"flashcards":[{"id":"c3-fc-01","topic":"c3-arrays","front":"Valid indexes of `int a[n];`","back":"`0` to `n - 1`. `a[n]` is one past the end."},{"id":"c3-fc-02","topic":"c3-arrays","front":"What does C do if you use an index outside the array?","back":"Nothing checks it. Reading or writing out of bounds is **undefined behaviour**: no guaranteed result (garbage, crash, or seeming to work)."},{"id":"c3-fc-03","topic":"c3-arrays","front":"`int y[4] = {7, 9};` What are `y[2]` and `y[3]`?","back":"Both 0. A short initialiser list fills the remaining elements with 0."},{"id":"c3-fc-04","topic":"c3-arrays","front":"`int x[] = {1, 2, 3};` What is the capacity?","back":"3. With empty brackets the compiler counts the initialisers."},{"id":"c3-fc-05","topic":"c3-arrays","front":"Can you write `x = y;` for two arrays?","back":"No, arrays cannot be assigned (compile error). Copy element by element with a loop."},{"id":"c3-fc-06","topic":"c3-arrays","front":"What is a variable-length array (VLA)?","back":"A local array whose size is computed at run time, e.g. `char s[n + 1];`. Allowed in C99/C17; no initialiser list; size must be > 0."},{"id":"c3-fc-07","topic":"c3-strings","front":"What is a C string?","back":"An array of `char` ending with the null character `'\\0'`."},{"id":"c3-fc-08","topic":"c3-strings","front":"`'\\0'` versus `'0'`","back":"`'\\0'` is the null character, value 0, which ends a string. `'0'` is the digit zero, value 48."},{"id":"c3-fc-09","topic":"c3-strings","front":"How many chars in `char s[] = \"abc\";`?","back":"4: `'a' 'b' 'c' '\\0'`. The compiler adds the `'\\0'`."},{"id":"c3-fc-10","topic":"c3-strings","front":"What does `strlen(s)` return, and its type?","back":"The number of chars before the first `'\\0'`, as a `size_t` (print with `%zu`). Header: `<string.h>`."},{"id":"c3-fc-11","topic":"c3-strings","front":"Array size needed for a string of length n","back":"`n + 1` (one extra for `'\\0'`)."},{"id":"c3-fc-12","topic":"c3-strings","front":"Steps to build a new string","back":"1. find its length n; 2. `char t[n + 1];` 3. fill `t[0]`..`t[n-1]` with a loop; 4. `t[n] = '\\0';` 5. print."},{"id":"c3-fc-13","topic":"c3-strings","front":"`puts(s)` versus `printf(\"%s\", s)`","back":"`puts` adds a newline after the string; `printf` prints only what the format says."},{"id":"c3-fc-14","topic":"c3-argv","front":"What do `argc` and `argv` hold?","back":"`argc`: number of command-line words **including** the program name. `argv[0]`: program name; `argv[1]`..`argv[argc-1]`: the arguments, as strings."},{"id":"c3-fc-15","topic":"c3-argv","front":"`./prog` with no arguments: value of `argc`?","back":"1 (just the program name)."},{"id":"c3-fc-16","topic":"c3-argv","front":"Why check `argc` before using `argv[i]`?","back":"If the argument was not given, `argv[i]` is not a usable string; using it is undefined behaviour (often a crash)."},{"id":"c3-fc-17","topic":"c3-argv","front":"What is `argv[1][0]`?","back":"The first character (a `char`) of the first argument."},{"id":"c3-fc-18","topic":"c3-argv","front":"How to print a usage error in C","back":"`fprintf(stderr, \"usage: %s word\\n\", argv[0]);` then `return 1;` (non-zero exit status)."}],"quiz":[{"id":"c3-q-01","topic":"c3-arrays","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int a[] = {3, 1, 4, 1, 5};\n    for (int i = 4; i >= 0; i--) {\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n","answer":"51413","explain":"The loop goes from index 4 down to 0, printing the elements in reverse: 5, 1, 4, 1, 3."},{"id":"c3-q-02","topic":"c3-arrays","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int y[5] = {2, 4};\n    int sum = 0;\n    for (int i = 0; i < 5; i++) {\n        sum = sum + y[i];\n        printf(\"%d \", y[i]);\n    }\n    printf(\"sum=%d\\n\", sum);\n    return 0;\n}\n","answer":"2 4 0 0 0 sum=6","explain":"`y` has capacity 5 but only 2 initialisers, so `y[2]`, `y[3]`, `y[4]` are 0. The sum is 6."},{"id":"c3-q-03","topic":"c3-arrays","type":"mcq","q":"`int a[4];` Which use of `a` is out of bounds?","options":["`a[0] = 1;`","`a[3] = 1;`","`a[4] = 1;`","`a[1 + 2] = 1;`"],"answer":2,"explain":"The valid indexes are 0 to 3. `a[4]` is one past the end: undefined behaviour, and C does not report it."},{"id":"c3-q-04","topic":"c3-arrays","type":"short","q":"A student writes `int a[3] = {1, 2, 3};` and then `printf(\"%d\\n\", a[3]);`. What does it print?","answer":"There is no defined answer: `a[3]` is out of bounds, so the behaviour is undefined. It may print any number, crash, or appear to work.","explain":"C has no bounds checking. Never predict a specific output for an out-of-bounds access."},{"id":"c3-q-05","topic":"c3-strings","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char s[] = \"abc\";\n    printf(\"%zu %c\\n\", strlen(s), s[1]);\n    return 0;\n}\n","answer":"3 b","explain":"`strlen` counts the 3 characters before `'\\0'`; `s[1]` is the second character, `b`."},{"id":"c3-q-06","topic":"c3-strings","type":"mcq","q":"What is the smallest `char` array that can hold the string `\"assign\"`?","options":["5","6","7","8"],"answer":2,"explain":"6 characters plus 1 for `'\\0'` is 7."},{"id":"c3-q-07","topic":"c3-strings","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char s[] = \"cat\";\n    s[1] = '\\0';\n    printf(\"[%s] %zu\\n\", s, strlen(s));\n    return 0;\n}\n","answer":"[c] 1","explain":"Putting `'\\0'` at index 1 ends the string after `c`. `printf` and `strlen` both stop at the first `'\\0'`."},{"id":"c3-q-08","topic":"c3-strings","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    char s[] = \"abcd\";\n    char t[3];\n    t[0] = s[3];\n    t[1] = s[0];\n    t[2] = '\\0';\n    puts(t);\n    puts(s);\n    return 0;\n}\n","answer":"da\nabcd","explain":"`t` is built by hand: `t[0]` is `s[3]` (`d`), `t[1]` is `s[0]` (`a`), then `'\\0'`. `puts` adds a newline after each string. `s` is unchanged."},{"id":"c3-q-09","topic":"c3-strings","type":"short","q":"What is wrong with this code (`n` is `strlen(w)`)?\n\n```c\nchar t[n];\nfor (size_t i = 0; i < n; i++) {\n    t[i] = w[i];\n}\nprintf(\"%s\\n\", t);\n```","answer":"`t` has no room for `'\\0'` and no `'\\0'` is ever stored, so `t` is not a string; `printf(\"%s\")` reads past the end (undefined behaviour). Fix: `char t[n + 1];` and `t[n] = '\\0';` after the loop.","explain":"Two bugs in one: size n instead of n + 1, and a missing terminator. (Also, if `n` is 0, `char t[0]` is itself undefined.)"},{"id":"c3-q-10","topic":"c3-argv","type":"output","q":"The program is compiled as `p` and run as `./p one \"two three\"`. What does it print?","code":"#include <stdio.h>\n\nint main(int argc, char *argv[]) {\n    printf(\"%d\\n\", argc);\n    printf(\"%s\\n\", argv[argc - 1]);\n    return 0;\n}\n","answer":"3\ntwo three","explain":"`argc` is 3 (`./p`, `one`, `two three`). `argv[argc - 1]` is `argv[2]`, the quoted argument with its space."},{"id":"c3-q-11","topic":"c3-argv","type":"short","q":"A program is run as `./prog` with no arguments. What are `argc` and `argv[0]`? Is it safe to call `strlen(argv[1])`?","answer":"`argc` is 1 and `argv[0]` is `\"./prog\"`. No: there is no first argument, so `strlen(argv[1])` is undefined behaviour. Check `argc` first.","explain":"`argc` counts the program name, so it is never 0 for a normal run."},{"id":"c3-q-12","topic":"c3-argv","type":"output","q":"The program is compiled as `p` and run as `./p abcdefg`. What does it print?","code":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    if (argc < 2) {\n        return 1;\n    }\n    size_t n = strlen(argv[1]);\n    for (size_t j = 0; j < n; j = j + 2) {\n        printf(\"%c\", argv[1][j]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n","answer":"aceg","explain":"`j` takes the values 0, 2, 4, 6, so the characters at those indexes are printed: a, c, e, g."},{"id":"c3-q-13","topic":"c3-argv","type":"output","q":"The program is compiled as `p` and run as `./p \"ab c\"`. What does it print?","code":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        return 1;\n    }\n    size_t n = strlen(argv[1]);\n    char t[n + 1];\n    for (size_t i = 0; i < n; i++) {\n        t[i] = argv[1][n - 1 - i];\n    }\n    t[n] = '\\0';\n    printf(\"%s|%zu\\n\", t, strlen(t));\n    return 0;\n}\n","answer":"c ba|4","explain":"It builds the reverse of `ab c` (4 characters, including the space) in a new array of 5 chars, then prints it and its length."},{"id":"c3-q-14","topic":"c3-argv","type":"short","q":"Why does the assignment want `concat2` to build a new string instead of just `printf(\"%s%s\\n\", argv[1], argv[2])`?","answer":"The goal is to practise making a string yourself: sizing a `char` array (sum of lengths + 1), copying characters into it, and adding `'\\0'`. Printing the two arguments one after the other produces the same text without building anything, so it does not meet the requirement.","explain":"Same output, different program. Graders read the code."}],"write":[{"id":"c3-w-01","topic":"c3-argv","stage":"worked","marks":5,"prompt":"Write a complete program `mirror.c` that takes exactly one command-line argument and prints a NEW string made of the argument followed by the argument backwards. `./mirror abc` prints `abccba`; `./mirror \"\"` prints an empty line. With the wrong number of arguments, print a usage message to standard error and return 1. Build the string in a `char` array; do not just print characters one at a time.","starter":"","solution":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        fprintf(stderr, \"usage: %s word\\n\", argv[0]);\n        return 1;\n    }\n    size_t n = strlen(argv[1]);\n    char m[2 * n + 1];\n\n    for (size_t i = 0; i < n; i++) {\n        m[i] = argv[1][i];               // left half: forwards\n        m[2 * n - 1 - i] = argv[1][i];   // right half: backwards\n    }\n    m[2 * n] = '\\0';\n\n    printf(\"%s\\n\", m);\n    return 0;\n}\n","explain":"Follow the five steps.\n\n1. **Check argc**: exactly one argument means `argc == 2`.\n2. **Measure**: `n = strlen(argv[1])`.\n3. **Size**: the result has `2 * n` characters, so `char m[2 * n + 1];`.\n4. **Copy**: one loop fills both halves. Character `i` goes to `m[i]` (left half) and to `m[2 * n - 1 - i]` (right half, counted from the last index `2 * n - 1` backwards). Check with `abc`, n = 3: `a` goes to 0 and 5, `b` to 1 and 4, `c` to 2 and 3.\n5. **Terminate** at index `2 * n`, then print.\n\nFor `\"\"`, n = 0: the array has 1 element, the loop does nothing, and `m[0] = '\\0'`.","rubric":[{"marks":1,"item":"Checks `argc != 2`, prints usage to `stderr`, returns 1"},{"marks":1,"item":"Uses `strlen(argv[1])` (stored in a `size_t`)"},{"marks":1,"item":"Array size `2 * n + 1`"},{"marks":1,"item":"Correct indexes for both halves"},{"marks":1,"item":"Stores `'\\0'` at index `2 * n` and prints the new string with a newline"}],"pitfalls":["Using `2 * n - i` instead of `2 * n - 1 - i` (writes one past the right half and leaves index `n` unset).","Array of size `2 * n`: no room for `'\\0'`."]},{"id":"c3-w-02","topic":"c3-strings","stage":"faded","marks":4,"prompt":"Fill in the blanks. `dashes.c` builds a NEW string with a `-` between neighbouring characters of its argument: `./dashes abc` prints `a-b-c`, `./dashes x` prints `x`, `./dashes \"\"` prints an empty line. `k` is the next free index in `t`.","starter":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != ____) {\n        fprintf(stderr, \"usage: %s word\\n\", argv[0]);\n        return 1;\n    }\n    size_t n = ____;\n    char t[2 * n + 1];\n    size_t k = ____;               // next free index in t\n    for (size_t i = 0; i < n; i++) {\n        if (i > 0) {\n            t[k] = ____;\n            k++;\n        }\n        t[k] = ____;\n        k++;\n    }\n    ____;\n    printf(\"%s\\n\", t);\n    return 0;\n}\n","solution":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        fprintf(stderr, \"usage: %s word\\n\", argv[0]);\n        return 1;\n    }\n    size_t n = strlen(argv[1]);\n    char t[2 * n + 1];\n    size_t k = 0;                  // next free index in t\n    for (size_t i = 0; i < n; i++) {\n        if (i > 0) {\n            t[k] = '-';\n            k++;\n        }\n        t[k] = argv[1][i];\n        k++;\n    }\n    t[k] = '\\0';\n    printf(\"%s\\n\", t);\n    return 0;\n}\n","rubric":[{"marks":1,"item":"`argc != 2` and `n = strlen(argv[1])`"},{"marks":1,"item":"`k` starts at 0"},{"marks":1,"item":"`t[k] = '-'` then `t[k] = argv[1][i]`"},{"marks":1,"item":"`t[k] = '\\0'` after the loop (k, not n)"}],"pitfalls":["Writing `t[n] = '\\0'`: the new string's length is `k` (here `2 * n - 1`), not `n`.","Using `i` as the index into `t`: the positions in `t` move faster than the positions in the argument, which is why a separate `k` is needed."]},{"id":"c3-w-03","topic":"c3-argv","stage":"blank","marks":5,"prompt":"Write a complete program `under.c` that takes exactly one command-line argument and builds a NEW string that is a copy of it with every space replaced by an underscore `_`, then prints it with `puts`. `./under \"a b  c\"` prints `a_b__c`. With the wrong number of arguments, print a usage message to standard error and return 1.","starter":"","solution":"#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        fprintf(stderr, \"usage: %s text\\n\", argv[0]);\n        return 1;\n    }\n    size_t n = strlen(argv[1]);\n    char t[n + 1];\n    for (size_t i = 0; i < n; i++) {\n        if (argv[1][i] == ' ') {\n            t[i] = '_';\n        } else {\n            t[i] = argv[1][i];\n        }\n    }\n    t[n] = '\\0';\n    puts(t);\n    return 0;\n}\n","rubric":[{"marks":1,"item":"Checks `argc` and reports errors on `stderr` with status 1"},{"marks":1,"item":"Array of size `strlen(argv[1]) + 1`"},{"marks":1,"item":"Loop over every character with `if` comparing to `' '`"},{"marks":1,"item":"Terminates with `'\\0'` at index `n`"},{"marks":1,"item":"Prints the new string (not `argv[1]`) with `puts`"}],"pitfalls":["Comparing with `\" \"` (a string, double quotes) instead of `' '` (a char).","Changing `argv[1]` and printing it instead of building a new string."]}]},{"day":4,"title":"Functions, the math library, and errors","goal":"Write functions that compute with loops, use <math.h> and <stdlib.h> (linking with -lm last), report errors on standard error with exit status 1, and sum a series: everything Assignment 4's sin.c needs.","topics":[{"id":"c4-functions","title":"Functions in more depth","notebook":"c/declarations.ipynb","priority":"high","examNote":"Exam questions often say *write a function that...*: get the header (return type, name, parameter types) exactly right, and remember that a function must be **declared before it is used**.","blocks":[{"type":"md","text":"On Day 2 you wrote small functions. Today you will write functions that *compute* something with a loop, because that is what Assignment 4's `sin.c` needs.\n\n### Declaration (prototype) and definition\n\nC reads your file from top to bottom. A function must be **declared** before the line that calls it, so the compiler can check the call: the right number of arguments, and what type comes back.\n\n- A **prototype** (also called a *function declaration*) is the header followed by a semicolon: `double cube(double x);`. It says the function exists, what it returns, and what it takes.\n- A **definition** is the header followed by a body in `{ }`. It is the actual code.\n\nYou can either define the function above `main`, or put a prototype above `main` and the definition below it. Both are fine; the prototype style lets `main` come first so it is easy to find."},{"type":"code","code":"#include <stdio.h>\n\ndouble cube(double x);              // prototype: the function's name, return type and parameters\n\nint main(void) {\n    printf(\"%f\\n\", cube(1.5));\n    printf(\"%f\\n\", cube(2.0) + cube(-1.0));\n    return 0;\n}\n\ndouble cube(double x) {             // definition: the header again, plus the body\n    return x * x * x;\n}","caption":"proto.c: prototype above main, definition below"},{"type":"code","code":"$ gcc -Wall -o proto proto.c\n$ ./proto\n3.375000\n7.000000"},{"type":"md","text":"Notice `cube(2.0) + cube(-1.0)`: a function call that returns a value can be used anywhere a value of that type can go, such as inside a bigger expression or directly as a `printf` argument. Here it is 8.0 + (-1.0) = 7.0."},{"type":"pitfall","text":"If you delete the prototype and keep the definition *below* `main`, gcc does not know `cube` yet. It prints `warning: implicit declaration of function 'cube'` and then `error: conflicting types for 'cube'`, because it guessed that the unknown function returns `int`. Fix: add the prototype, or move the definition above `main`."},{"type":"md","text":"### Parameters are copies\n\nWhen you call `add_one(n)`, C copies the *value* of `n` into the parameter. The parameter is a **local variable** of the function: it exists only while the function runs, and changing it never changes the caller's variable. (Variables declared inside a function are local too; they are created on each call and must be given a starting value.)"},{"type":"code","code":"#include <stdio.h>\n\nvoid add_one(int n) {\n    n = n + 1;                      // changes the copy only\n    printf(\"inside add_one: n = %d\\n\", n);\n}\n\nint main(void) {\n    int n = 5;\n    add_one(n);\n    printf(\"in main: n = %d\\n\", n);\n    return 0;\n}","caption":"copies.c"},{"type":"code","code":"$ ./copies\ninside add_one: n = 6\nin main: n = 5"},{"type":"check","q":"In copies.c, why does main still print 5?","a":"`add_one` received a copy of the value 5 in its own parameter `n`. It changed the copy to 6. `main`'s `n` is a different variable and was never touched. To get a result *back* from a function, `return` it."},{"type":"md","text":"### Return types and a loop inside a function\n\nThe return type is written before the name. Use `unsigned int` for a count that is never negative, and `double` for anything with a fractional part. A very common pattern is the **running total**: start a local variable at 0 (or at 1 for a product), update it in a loop, and return it at the end."},{"type":"code","code":"#include <stdio.h>\n\nunsigned int sum_squares(unsigned int n);\ndouble harmonic(unsigned int n);\n\nint main(void) {\n    printf(\"%u\\n\", sum_squares(3));\n    printf(\"%u\\n\", sum_squares(3) + sum_squares(4));\n    printf(\"%.6f\\n\", harmonic(4));\n    printf(\"%.6f\\n\", 2.0 * harmonic(1));\n    return 0;\n}\n\n// returns 1*1 + 2*2 + ... + n*n\nunsigned int sum_squares(unsigned int n) {\n    unsigned int total = 0;         // running total starts at 0\n    for (unsigned int i = 1; i <= n; i++) {\n        total = total + i * i;\n    }\n    return total;\n}\n\n// returns 1/1 + 1/2 + ... + 1/n\ndouble harmonic(unsigned int n) {\n    double total = 0.0;\n    for (unsigned int k = 1; k <= n; k++) {\n        total = total + 1.0 / k;    // 1.0 makes this double division\n    }\n    return total;\n}","caption":"loops.c: two functions that compute a result with a loop"},{"type":"code","code":"$ ./loops\n14\n44\n2.083333\n2.000000"},{"type":"md","text":"Check the numbers: 1 + 4 + 9 = 14, and 14 + (1 + 4 + 9 + 16) = 44. `harmonic(4)` is 1 + 0.5 + 0.333... + 0.25 = 2.083333."},{"type":"pitfall","text":"`double total;` without `= 0.0` leaves `total` holding whatever garbage was in memory (the notebook's `sum_of.c` bug). Always initialize a running total. For a product, start at 1, not 0."},{"type":"pitfall","text":"Inside `harmonic`, `1 / k` would be **integer division** (Day 2): 1/2 is 0. Writing `1.0 / k` makes it double division."},{"type":"md","text":"### Key points\n\n- Prototype = header + `;`. Definition = header + body. Declare before you call.\n- Parameters and local variables are copies that live only during the call; use `return` to send a result back.\n- Return type comes first: `double f(...)`, `unsigned int g(...)`, `void h(...)` (returns nothing).\n- Running total: initialize (0 for sums, 1 for products), update in a loop, return.\n- A call that returns a value can be used inside any expression: `f(2) + f(3)`."}]},{"id":"c4-libs-errors","title":"<math.h>, <stdlib.h>, and error messages","notebook":"c/floats.ipynb","priority":"high","examNote":"Know the usage-message pattern by heart: check `argc`, `fprintf(stderr, ...)`, exit status 1. Also know that `atof` gives 0.0 for text that is not a number.","blocks":[{"type":"md","text":"### `<math.h>`: pow, sqrt, fabs\n\nThe math library has functions much like Java's `Math` class. All of these take and return `double`:\n\n| Function | Meaning | Example |\n|---|---|---|\n| `sqrt(x)` | square root | `sqrt(2.0)` is 1.414214 |\n| `pow(x, y)` | x to the power y | `pow(2.0, 10)` is 1024.0 |\n| `fabs(x)` | absolute value of a double | `fabs(-3.5)` is 3.5 |\n\nC has no overloading, so `fabs` is for doubles; there is a separate `abs` (in `<stdlib.h>`) for `int`."},{"type":"code","code":"#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double a = 2.0;\n    double b = -3.5;\n    printf(\"%f\\n\", sqrt(a));\n    printf(\"%f\\n\", pow(a, 10));\n    printf(\"%f\\n\", pow(a, 0.5));\n    printf(\"%f\\n\", fabs(b));\n    printf(\"%f\\n\", fabs(a));\n    return 0;\n}","caption":"mathdemo.c"},{"type":"md","text":"### Linking with `-lm`, and why it goes LAST\n\n`#include <math.h>` only gives the compiler the *prototypes*. The actual code of `pow` and `sqrt` is in a separate library file, the **math library**. You ask gcc to **link** it (join it into your program) with `-lm` (hyphen, lower-case L, m)."},{"type":"code","code":"$ gcc -Wall -o mathdemo mathdemo.c -lm\n$ ./mathdemo\n1.414214\n1024.000000\n1.414214\n3.500000\n2.000000"},{"type":"md","text":"The **order matters** on Ubuntu (the CASLab machines and your VM). The linker reads the command line left to right. When it reaches `-lm` it only takes the functions that the files it has *already* seen are missing. If `-lm` comes before your `.c` file, nothing is missing yet, so it takes nothing; then your file asks for `sqrt` and `pow` and it is too late:"},{"type":"code","code":"$ gcc -Wall -o mathdemo -lm mathdemo.c\n/usr/bin/ld: /tmp/ccshDxlJ.o: in function `main':\nmathdemo.c:(.text+0x30): undefined reference to `sqrt'\n/usr/bin/ld: mathdemo.c:(.text+0x68): undefined reference to `pow'\n/usr/bin/ld: mathdemo.c:(.text+0xa0): undefined reference to `pow'\ncollect2: error: ld returned 1 exit status"},{"type":"pitfall","text":"The Assignment 4 handout writes `gcc -o sin -lm sin.c`. On Ubuntu that gives exactly this ``undefined reference to `pow'`` error. Use **`gcc -Wall -o sin sin.c -lm`**: libraries after the source file. Forgetting `-lm` completely gives the same error."},{"type":"md","text":"### `<stdlib.h>`: atof and atoi\n\nCommand line arguments are always **strings** (Day 3): `argv[1]` for `./prog 2.5` is the text `\"2.5\"`, not a number. To do arithmetic you convert it:\n\n- `atof(s)` (*ASCII to float*) converts a string to a `double`.\n- `atoi(s)` (*ASCII to int*) converts a string to an `int`.\n\nThey read as much of the start of the string as looks like a number and ignore the rest. If the string does not start with a number they return **0** (0.0 for `atof`). They never print an error."},{"type":"code","code":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(void) {\n    printf(\"%f\\n\", atof(\"3.75\"));\n    printf(\"%f\\n\", atof(\"-0.5\"));\n    printf(\"%f\\n\", atof(\"abc\"));\n    printf(\"%f\\n\", atof(\"12xyz\"));\n    printf(\"%d\\n\", atoi(\"42\"));\n    printf(\"%d\\n\", atoi(\"7.9\"));\n    printf(\"%d\\n\", atoi(\"hello\"));\n    return 0;\n}","caption":"conv.c"},{"type":"code","code":"$ ./conv\n3.750000\n-0.500000\n0.000000\n12.000000\n42\n7\n0"},{"type":"check","q":"What does `atof(\"abc\")` return, and what does that mean for a program run as `./prog abc`?","a":"It returns 0.0. The program does not crash or complain; it simply computes with x = 0.0. (The Assignment 4 examples rely on this: `./sin abc` behaves like `./sin 0`.)"},{"type":"md","text":"### Errors: standard error and exit status\n\nEvery program has two output streams. **Standard output** (`stdout`) is for the program's normal results; `printf` and `puts` write there. **Standard error** (`stderr`) is for error messages. `fprintf` is `printf` with one extra first argument, the stream: `fprintf(stderr, \"Usage: circle radius\\n\");`.\n\nThis is the Bash idea you already know: `>` redirects stdout, `2>` redirects stderr, and `$?` is the exit status of the last command. Sending errors to stderr means `./prog > results.txt` still shows the error on the screen, and does not mix it into the results.\n\nThe usual pattern: if `argc` is wrong, print a **usage message** (how to run the program) to stderr and exit with status 1 (any non-zero status means *failure*; 0 means success)."},{"type":"code","code":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        fprintf(stderr, \"Usage: circle radius\\n\");\n        return 1;\n    }\n    double r = atof(argv[1]);\n    double pi = 3.141592653589793;\n    printf(\"%.4f\\n\", pi * r * r);\n    return 0;\n}","caption":"circle.c: area of a circle from a radius on the command line"},{"type":"code","code":"$ gcc -Wall -o circle circle.c\n$ ./circle 2\n12.5664\n$ echo $?\n0\n$ ./circle\nUsage: circle radius\n$ echo $?\n1\n$ ./circle 1 2 2> err.txt\n$ echo $?\n1\n$ cat err.txt\nUsage: circle radius"},{"type":"md","text":"`argc` counts the program name too, so *one* argument means `argc == 2`. In the `2> err.txt` run the message went into the file instead of the screen, which proves it was written to stderr.\n\n### `exit(1)` versus `return 1`\n\n`return 1;` ends the *current function*. Only in `main` does that also end the program with status 1. `exit(1);` (from `<stdlib.h>`) ends the **whole program** immediately with status 1, from *any* function. The course notebooks also write `exit(EXIT_FAILURE)`; `EXIT_FAILURE` is a name for a failure status (1 on Linux)."},{"type":"code","code":"#include <stdio.h>\n#include <stdlib.h>\n\nvoid usage(void) {\n    fprintf(stderr, \"Usage: exitdemo word\\n\");\n    exit(1);                        // ends the WHOLE program, status 1\n}\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        usage();\n    }\n    printf(\"you typed %s\\n\", argv[1]);\n    return 0;\n}","caption":"exitdemo.c: exit from a helper function"},{"type":"code","code":"$ gcc -Wall -o exitdemo exitdemo.c\n$ ./exitdemo hi\nyou typed hi\n$ ./exitdemo\nUsage: exitdemo word\n$ echo $?\n1"},{"type":"pitfall","text":"Writing the usage message with `printf` puts it on standard output. It looks the same on screen, but a checker (and the TAs) can tell: the message is in the wrong stream. Use `fprintf(stderr, ...)`."},{"type":"pitfall","text":"Printing the message but forgetting `return 1` / `exit(1)`: the program keeps going and uses `argv[1]`, which may not exist. Reading past the end of `argv` is undefined behaviour."},{"type":"md","text":"### Key points\n\n- `#include <math.h>` for `pow`, `sqrt`, `fabs`; compile with `-lm` **after** the `.c` file.\n- `#include <stdlib.h>` for `atof`, `atoi`, `exit`. `atof(\"abc\")` is 0.0, no error.\n- Errors go to stderr: `fprintf(stderr, \"Usage: prog x\\n\");`. Bash: `2>` redirects it, `$?` shows the status.\n- Wrong number of arguments: check `argc != 2` (for one argument), print usage, exit status 1.\n- `return 1` leaves the current function; `exit(1)` ends the program from anywhere."}]},{"id":"c4-series","title":"Summing a series (and a plan for sin.c)","notebook":"c/floats.ipynb","priority":"high","examNote":"Assignment 4 is graded: this lesson teaches the skills with e^x and ln 2 examples and gives a plan in words. Write `sin.c` yourself.","blocks":[{"type":"md","text":"A **series** is a sum of many terms that follow a pattern. Computers compute many math functions by adding up the first few terms of a series. In code that is just a running total in a loop.\n\n### Alternating signs\n\nSome series alternate: +, -, +, -, ... For example 1 - 1/2 + 1/3 - 1/4 + ... gets closer and closer to ln 2. The simplest way to get the signs is a `sign` variable that starts at +1.0 and is flipped with `sign = -sign` after each term."},{"type":"code","code":"#include <math.h>\n#include <stdio.h>\n\n// returns 1 - 1/2 + 1/3 - 1/4 + ... (n terms)\ndouble alt_harmonic(unsigned int n) {\n    double total = 0.0;\n    double sign = 1.0;              // +1.0 for the first term\n    for (unsigned int k = 1; k <= n; k++) {\n        total = total + sign / k;\n        sign = -sign;               // flip: +, -, +, -, ...\n    }\n    return total;\n}\n\nint main(void) {\n    printf(\"%24.17f\\n\", alt_harmonic(10));\n    printf(\"%24.17f\\n\", alt_harmonic(1000));\n    printf(\"%24.17f\\n\", log(2.0));  // the exact limit is ln 2\n    return 0;\n}","caption":"ln2.c: an alternating series compared with the library's log"},{"type":"code","code":"$ gcc -Wall -o ln2 ln2.c -lm\n$ ./ln2\n     0.64563492063492067\n     0.69264743055982225\n     0.69314718055994529"},{"type":"md","text":"`%24.17f` (Day 2) prints 17 digits after the point in a field 24 characters wide, so you can see tiny differences. More terms get closer to ln 2 = 0.69314718..., but a finite number of terms is never exactly equal to it."},{"type":"md","text":"### Worked example: e to the power x\n\nThe exponential function has the series\n\ne^x = 1 + x + x^2/2! + x^3/3! + x^4/4! + ...\n\nwhere n! (*n factorial*) is 1 × 2 × ... × n, and 0! = 1. Every term has the form x^n / n!.\n\nYou could compute each term from scratch with `pow` and a factorial. This example uses a different trick: **each term is the previous term times x / n**. For example, x^3/3! = (x^2/2!) × x / 3. So the loop keeps one running `term` and one running `total`."},{"type":"code","code":"#include <math.h>\n#include <stdio.h>\n#include <stdlib.h>\n\n// approximates e to the power x with the terms x^0/0! up to x^last/last!\ndouble my_exp(double x, int last) {\n    double term = 1.0;      // the n = 0 term: x^0 / 0! = 1\n    double total = term;\n    for (int n = 1; n <= last; n++) {\n        term = term * x / n;    // turns x^(n-1)/(n-1)! into x^n/n!\n        total = total + term;\n    }\n    return total;\n}\n\nint main(void) {\n    double x = 1.0;\n    printf(\"%24.17f  (4 terms)\\n\", my_exp(x, 3));\n    printf(\"%24.17f  (11 terms)\\n\", my_exp(x, 10));\n    printf(\"%24.17f  (21 terms)\\n\", my_exp(x, 20));\n    printf(\"%24.17f  (library exp)\\n\", exp(x));\n    return 0;\n}","caption":"exp.c: approximating e^x with the first terms of its series"},{"type":"code","code":"$ gcc -Wall -o exp exp.c -lm\n$ ./exp\n     2.66666666666666652  (4 terms)\n     2.71828180114638451  (11 terms)\n     2.71828182845904553  (21 terms)\n     2.71828182845904509  (library exp)"},{"type":"why","q":"Suppose you computed n! on its own in a loop, as an `int`. Why would that go wrong for the larger terms?","a":"Factorials grow very fast. 12! = 479001600 still fits in an `int`, but 13! = 6227020800 is larger than the biggest `int` (2147483647). Signed `int` overflow is undefined behaviour, so the result could be anything. Doing the product in a `double` avoids this: a `double` holds 13!, 20! and much larger values (approximately, but very accurately at these sizes)."},{"type":"why","q":"Why is the 21-term answer still not exactly equal to the library's `exp(1.0)`?","a":"Two reasons. **Truncation**: we stopped after a finite number of terms, so we left out a (tiny) remainder. **Rounding**: a `double` holds about 16 significant decimal digits, so every division and addition is rounded a little, and those roundings add up. The library uses a cleverer method, so the last digit or two differ. That is expected."},{"type":"md","text":"### Plan for Assignment 4's sin.c (in words; you write the code)\n\n`sin.c` approximates sin(x) with the series x - x^3/3! + x^5/5! - x^7/7! + ... using the terms from x^1/1! up to x^13/13!. Every skill is in today's lessons. Steps:\n\n1. Include the headers you need: `<stdio.h>` for printing, `<stdlib.h>` for `atof`, `<math.h>` for `pow`.\n2. In `main(int argc, char *argv[])`, check the argument count first. Exactly one argument means `argc` must be 2. Otherwise print a usage message to **stderr** and end with exit status 1.\n3. Convert `argv[1]` to a `double` with `atof`. (Non-numbers become 0.0; that is fine.)\n4. Write the factorial function the assignment asks for (`fact`): multiply 1 × 2 × ... × n in a loop, keeping the product in a `double` and returning it (see the *Why?* box above for the reason). Note that `exp.c` used a running term instead, so the assignment's `fact` is yours to write.\n5. Add up the terms in a loop with a running total. Think about two things: which powers appear (only the **odd** ones, 1, 3, 5, ..., 13; seven terms), and the **sign** of each term (+ for x^1, - for x^3, + for x^5, ...). Each term is the sign times `pow(x, n)` divided by `fact(n)`.\n6. Print the result with exactly the format the assignment gives, `%24.17f` followed by a newline.\n7. Compile with `-lm` **last**: `gcc -Wall -o sin sin.c -lm`.\n\nSelf-check by hand: the series at x = 0 is 0, and for small x the answer is very close to x (the assignment's example `./sin -0.01` prints `-0.00999983333416666`)."},{"type":"pitfall","text":"Common sin.c mistakes: (1) factorial in `int`, which overflows at 13!; (2) the wrong sign pattern, e.g. starting with minus, or flipping the sign at the wrong place; (3) one term too many or too few (stop at the x^13 term); (4) `%f` or `%.17f` instead of `%24.17f`, so the spacing does not match; (5) usage message on stdout or exit status 0; (6) `-lm` before `sin.c`."},{"type":"pitfall","text":"Your answer will differ slightly from the library's `sin(x)` in the last digits, for the truncation and rounding reasons above. That is correct. The checker compares with what the *series* gives, not with `sin()`, so do not call `sin` from `<math.h>`."},{"type":"try","text":"Make the folder and write the program: `mkdir -p ~/CISC220_A4 && cd ~/CISC220_A4 && nano sin.c`. Compile with `gcc -Wall -o sin sin.c -lm` and try `./sin 0.5`, `./sin`, `./sin 1 2; echo $?`. Then run the checker: `cd ~/CISC220_current/c-app/drills && ./cdrill.sh a4 ~/CISC220_A4 sin.c`."},{"type":"md","text":"### Key points\n\n- Series in code = running total in a loop; each pass adds one term.\n- Alternating signs: `sign` starts at 1.0, then `sign = -sign` after each term.\n- Factorials and powers get huge: use `double`, not `int`.\n- A truncated series plus rounding differs from the library function in the last digits; that is expected.\n- Print with `%24.17f` to see (and match) 17 decimal places."}]}],"flashcards":[{"id":"c4-fc-01","topic":"c4-functions","front":"What is a function prototype? Give one.","back":"The function's header followed by a semicolon, with no body. It declares the return type, name and parameter types so the function can be called before its definition. Example: `double cube(double x);`"},{"id":"c4-fc-02","topic":"c4-functions","front":"Prototype vs definition?","back":"Prototype (declaration): header + `;`. Definition: header + `{ body }`. A function must be declared (by either) before the line that calls it."},{"id":"c4-fc-03","topic":"c4-functions","front":"What happens to the caller's variable if a function changes its parameter?","back":"Nothing. Parameters are copies of the argument values (local variables of the function)."},{"id":"c4-fc-04","topic":"c4-functions","front":"How do you get a result out of a function?","back":"`return` it, and give the function a matching return type, e.g. `double f(...)` then `return total;`."},{"id":"c4-fc-05","topic":"c4-functions","front":"Running-total pattern for a sum and for a product?","back":"Sum: `double total = 0.0;` then `total = total + term;` in the loop. Product: start at `1.0` and multiply. Return at the end."},{"id":"c4-fc-06","topic":"c4-functions","front":"gcc says `implicit declaration of function 'f'`. Why?","back":"`f` is called before it is declared. Add a prototype above the call or move the definition above it."},{"id":"c4-fc-07","topic":"c4-libs-errors","front":"Which header and link flag for `pow`, `sqrt`, `fabs`?","back":"`#include <math.h>` and `-lm` at the END: `gcc -Wall -o prog prog.c -lm`."},{"id":"c4-fc-08","topic":"c4-libs-errors","front":"Why does `gcc -o sin -lm sin.c` fail on Ubuntu?","back":"The linker reads left to right; at `-lm` nothing needs `pow` yet, so it takes nothing. Then sin.c needs `pow`: ``undefined reference to `pow'``. Put `-lm` after the source file."},{"id":"c4-fc-09","topic":"c4-libs-errors","front":"`atof(\"abc\")`? `atof(\"2.5kg\")`? `atoi(\"7.9\")`?","back":"0.0, 2.5 and 7. They convert the number at the start of the string and ignore the rest; no number gives 0."},{"id":"c4-fc-10","topic":"c4-libs-errors","front":"How do you print an error message in C?","back":"`fprintf(stderr, \"Usage: prog x\\n\");` writes to standard error instead of standard output."},{"id":"c4-fc-11","topic":"c4-libs-errors","front":"Usage check for a program that needs exactly one argument?","back":"`if (argc != 2) { fprintf(stderr, \"Usage: prog x\\n\"); return 1; }` (argc counts the program name)."},{"id":"c4-fc-12","topic":"c4-libs-errors","front":"`exit(1)` vs `return 1`?","back":"`return 1` ends the current function (the program only if it is `main`). `exit(1)` (stdlib.h) ends the whole program from any function, status 1."},{"id":"c4-fc-13","topic":"c4-libs-errors","front":"Bash: hide a program's error messages; see its exit status.","back":"`./prog 2> /dev/null` redirects stderr. `echo $?` prints the last exit status."},{"id":"c4-fc-14","topic":"c4-series","front":"How do you make the signs alternate +, -, +, ... in a loop?","back":"`double sign = 1.0;` and after adding each term, `sign = -sign;`."},{"id":"c4-fc-15","topic":"c4-series","front":"Why must a factorial function return `double`?","back":"13! = 6227020800 is bigger than the largest `int` (2147483647); signed overflow is undefined behaviour. A `double` holds it."},{"id":"c4-fc-16","topic":"c4-series","front":"Two reasons a series answer differs from the library function.","back":"Truncation (only finitely many terms) and rounding (a double has about 16 significant digits; every operation rounds)."},{"id":"c4-fc-17","topic":"c4-series","front":"What does `%24.17f` print?","back":"A double with 17 digits after the decimal point, right-aligned in a field at least 24 characters wide."}],"quiz":[{"id":"c4-q-01","topic":"c4-functions","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\ndouble twice(double x) {\n    x = x * 2;\n    return x;\n}\n\nint main(void) {\n    double x = 1.5;\n    double y = twice(x);\n    printf(\"%.1f %.1f\\n\", x, y);\n    return 0;\n}","answer":"1.5 3.0","explain":"`twice` doubles its own copy of `x` and returns 3.0. `main`'s `x` is unchanged, so it is still 1.5."},{"id":"c4-q-02","topic":"c4-functions","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nunsigned int odd_product(unsigned int n) {\n    unsigned int p = 1;\n    for (unsigned int i = 1; i <= n; i += 2) {\n        p = p * i;\n    }\n    return p;\n}\n\nint main(void) {\n    printf(\"%u\\n\", odd_product(7));\n    printf(\"%u\\n\", odd_product(1) + odd_product(4));\n    return 0;\n}","answer":"105\n4","explain":"`odd_product(7)` multiplies 1 × 3 × 5 × 7 = 105. `odd_product(1)` is 1 and `odd_product(4)` is 1 × 3 = 3, so the sum is 4."},{"id":"c4-q-03","topic":"c4-functions","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\ndouble half(int n) {\n    return n / 2;\n}\n\nint main(void) {\n    printf(\"%.1f\\n\", half(7));\n    return 0;\n}","answer":"3.0","explain":"`n / 2` with `int n = 7` is integer division: 3. Only then is 3 converted to the return type `double`, giving 3.0. Write `n / 2.0` to get 3.5."},{"id":"c4-q-04","topic":"c4-functions","type":"mcq","q":"Which line is a function prototype?","options":["`double area(double r);`","`double area(double r) { return r * r; }`","`area(2.0);`","`double a = area(2.0);`"],"answer":0,"explain":"A prototype is the header followed by a semicolon. Option B is a definition; C and D are calls."},{"id":"c4-q-05","topic":"c4-functions","type":"short","q":"A function `void reset(int x) { x = 0; }` is called as `reset(count);`. Explain why `count` does not become 0.","answer":"C passes arguments by value: `x` is a new local variable holding a copy of `count`'s value. Setting `x` to 0 changes only the copy, which disappears when `reset` returns.","explain":"To change something for the caller, return a new value (`count = reset_value();`) or (later in the course) use a pointer."},{"id":"c4-q-06","topic":"c4-libs-errors","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(void) {\n    printf(\"%.2f %d\\n\", atof(\"2.5kg\"), atoi(\"2.5kg\"));\n    printf(\"%.2f\\n\", atof(\"kg2.5\"));\n    return 0;\n}","answer":"2.50 2\n0.00","explain":"`atof` reads the leading `2.5` and ignores `kg`; `atoi` reads the leading `2` and stops at the `.`. `\"kg2.5\"` does not start with a number, so `atof` returns 0.0."},{"id":"c4-q-07","topic":"c4-libs-errors","type":"output","q":"What does this program print?","code":"#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double a = -2.0;\n    double b = 16.0;\n    printf(\"%.1f\\n\", fabs(a) + sqrt(b));\n    printf(\"%.1f\\n\", pow(a, 3));\n    return 0;\n}","answer":"6.0\n-8.0","explain":"fabs(-2.0) + sqrt(16.0) = 2.0 + 4.0 = 6.0, and pow(-2.0, 3) = -8.0. (Compile with `-lm`.)"},{"id":"c4-q-08","topic":"c4-libs-errors","type":"output","q":"This program is compiled as `prog` and run as `./prog 2> /dev/null`. What appears on the terminal?","code":"#include <stdio.h>\n\nint main(void) {\n    puts(\"one\");\n    fprintf(stderr, \"two\\n\");\n    puts(\"three\");\n    return 0;\n}","answer":"one\nthree","explain":"`puts` writes to standard output, which still goes to the terminal. `fprintf(stderr, ...)` writes to standard error, which `2> /dev/null` throws away."},{"id":"c4-q-09","topic":"c4-libs-errors","type":"mcq","q":"On Ubuntu, which command builds `sin` from `sin.c`, which calls `pow`?","options":["`gcc -o sin -lm sin.c`","`gcc -o sin sin.c -lm`","`gcc -o sin sin.c`","`gcc -lm -o sin sin.c`"],"answer":1,"explain":"The math library must come after the source file, because the linker reads left to right and only takes from a library what earlier files are missing. The other three fail with ``undefined reference to `pow'``."},{"id":"c4-q-10","topic":"c4-libs-errors","type":"short","q":"Write the lines at the start of `main` for a program `temp` that needs exactly one command line argument: on a wrong count it prints `Usage: temp celsius` to standard error and ends with exit status 1.","answer":"if (argc != 2) {\n    fprintf(stderr, \"Usage: temp celsius\\n\");\n    return 1;\n}","explain":"`argc` includes the program name, so one argument means `argc == 2`. `exit(1);` instead of `return 1;` is also correct (include `<stdlib.h>`)."},{"id":"c4-q-11","topic":"c4-libs-errors","type":"short","q":"What is the difference between `exit(1)` and `return 1`?","answer":"`return 1` ends only the function it is in (it ends the program only when that function is `main`). `exit(1)` ends the whole program immediately with exit status 1, from any function.","explain":"That is why a helper like `usage()` calls `exit(1)`: a `return` there would just go back to `main`."},{"id":"c4-q-12","topic":"c4-series","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int total = 0;\n    int sign = 1;\n    for (int k = 1; k <= 5; k++) {\n        total = total + sign * k;\n        sign = -sign;\n    }\n    printf(\"%d\\n\", total);\n    return 0;\n}","answer":"3","explain":"The terms are +1 - 2 + 3 - 4 + 5 = 3. `sign` starts at 1 and flips after each term."},{"id":"c4-q-13","topic":"c4-series","type":"output","q":"What does this program print?","code":"#include <math.h>\n#include <stdio.h>\n\nint main(void) {\n    double r = sqrt(2.0);\n    printf(\"[%8.3f]\\n\", r);\n    printf(\"[%.0f]\\n\", r);\n    return 0;\n}","answer":"[   1.414]\n[1]","explain":"`%8.3f` gives 3 decimals right-aligned in 8 characters: three spaces then `1.414`. `%.0f` rounds to no decimals: 1."},{"id":"c4-q-14","topic":"c4-series","type":"short","q":"A student's factorial helper returns `int`. Their series program is fine for small terms but goes wrong at 13!. Why, and what is the fix?","answer":"13! = 6227020800 does not fit in an `int` (largest 2147483647). Signed integer overflow is undefined behaviour, so the value is garbage. Fix: do the product in a `double` and return `double`.","explain":"`unsigned int` does not help either: its largest value is 4294967295, still less than 13!."}],"write":[{"id":"c4-w-01","topic":"c4-libs-errors","stage":"worked","marks":5,"prompt":"Write a complete program `cube.c`. It takes exactly one command line argument x and prints x cubed with three decimal places, e.g. `./cube 1.5` prints `3.375`. Use a function `double cube(double x)` that is declared with a prototype above `main` and defined below it. If the number of arguments is wrong, print `Usage: cube x` to standard error and end with exit status 1.","starter":"","solution":"#include <stdio.h>\n#include <stdlib.h>\n\ndouble cube(double x);\n\nint main(int argc, char *argv[]) {\n    if (argc != 2) {\n        fprintf(stderr, \"Usage: cube x\\n\");\n        return 1;\n    }\n    double x = atof(argv[1]);\n    printf(\"%.3f\\n\", cube(x));\n    return 0;\n}\n\ndouble cube(double x) {\n    return x * x * x;\n}","explain":"The prototype `double cube(double x);` lets `main` call `cube` before its definition. `main` checks `argc != 2` first (the program name counts), prints the usage message with `fprintf(stderr, ...)` and returns 1. Then `atof` converts the string `argv[1]` to a double (it needs `<stdlib.h>`), and the result of `cube(x)` is used directly as a `printf` argument with `%.3f`. No `-lm` is needed because nothing from `<math.h>` is used.","rubric":[{"marks":1,"item":"prototype above main and matching definition `double cube(double x)` returning x * x * x"},{"marks":1,"item":"checks `argc != 2`"},{"marks":1,"item":"usage message with `fprintf(stderr, ...)` and exit status 1"},{"marks":1,"item":"converts `argv[1]` with `atof` and includes `<stdlib.h>`"},{"marks":1,"item":"prints with `%.3f\\n` and returns 0"}],"pitfalls":["Checking `argc != 1`: argc counts the program name.","Using `printf` for the usage message (wrong stream).","Using `argv[1]` directly in arithmetic: it is a string."]},{"id":"c4-w-02","topic":"c4-series","stage":"faded","marks":4,"prompt":"Complete the function `alt_squares`, which returns the sum of the first n terms of 1 - 1/4 + 1/9 - 1/16 + ... (term k is 1/(k*k), with signs +, -, +, ...). With the main below the program prints 1.000000, 0.750000, 0.861111.","starter":"#include <stdio.h>\n\n// returns 1 - 1/4 + 1/9 - 1/16 + ... (n terms)\ndouble alt_squares(unsigned int n) {\n    double total = ____;\n    double sign = ____;\n    for (unsigned int k = 1; k <= n; k++) {\n        total = ____;\n        ____;\n    }\n    return ____;\n}\n\nint main(void) {\n    printf(\"%.6f\\n\", alt_squares(1));\n    printf(\"%.6f\\n\", alt_squares(2));\n    printf(\"%.6f\\n\", alt_squares(3));\n    return 0;\n}","solution":"#include <stdio.h>\n\n// returns 1 - 1/4 + 1/9 - 1/16 + ... (n terms)\ndouble alt_squares(unsigned int n) {\n    double total = 0.0;\n    double sign = 1.0;\n    for (unsigned int k = 1; k <= n; k++) {\n        total = total + sign / ((double) k * k);\n        sign = -sign;\n    }\n    return total;\n}\n\nint main(void) {\n    printf(\"%.6f\\n\", alt_squares(1));\n    printf(\"%.6f\\n\", alt_squares(2));\n    printf(\"%.6f\\n\", alt_squares(3));\n    return 0;\n}","rubric":[{"marks":1,"item":"running total starts at 0.0 and is returned"},{"marks":1,"item":"sign starts at 1.0 (first term positive)"},{"marks":1,"item":"adds sign / (k * k) using double division"},{"marks":1,"item":"flips the sign after each term"}],"pitfalls":["`1 / (k * k)` is integer division: 0 for every k > 1.","Flipping the sign before adding the first term makes the series start with minus."]},{"id":"c4-w-03","topic":"c4-libs-errors","stage":"blank","marks":5,"prompt":"Write a complete program `biggest.c` that prints the largest of its command line arguments, each converted with `atof`, using `printf(\"%f\\n\", ...)`. Any number of arguments (one or more) is allowed: `./biggest 3 -7.5 12.25 4` prints `12.250000`. With no arguments, print a usage message to standard error and end with exit status 1.","starter":"","solution":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, char *argv[]) {\n    if (argc < 2) {\n        fprintf(stderr, \"Usage: biggest x1 x2 ...\\n\");\n        exit(1);\n    }\n    double best = atof(argv[1]);\n    for (int i = 2; i < argc; i++) {\n        double x = atof(argv[i]);\n        if (x > best) {\n            best = x;\n        }\n    }\n    printf(\"%f\\n\", best);\n    return 0;\n}","rubric":[{"marks":1,"item":"includes `<stdio.h>` and `<stdlib.h>`, uses `int main(int argc, char *argv[])`"},{"marks":1,"item":"no arguments (`argc < 2`): usage message on stderr and exit status 1"},{"marks":1,"item":"starts the maximum at the first argument (not at 0, which fails for all-negative input)"},{"marks":1,"item":"loops over the remaining arguments with `atof`, updating the maximum"},{"marks":1,"item":"prints with `%f\\n` and returns 0"}],"pitfalls":["Starting `best` at 0.0: `./biggest -2 -9` would wrongly print 0.000000.","Loop starting at `i = 0`: `argv[0]` is the program name."]}]},{"day":5,"title":"Arrays in functions, characters as numbers, and binary","goal":"Pass arrays to functions and fill output arrays, convert digit characters to numbers, and add binary numbers in ones' complement with long addition: the skills for Assignment 4's sumones.c.","topics":[{"id":"c5-array-params","title":"Arrays in functions, and characters are numbers","notebook":"c/arrays.ipynb","priority":"high","examNote":"Expect to write a function that takes an array and changes it, or fills an output array. Know that `int a[]`, `int *a` and `int a[static 8]` all mean a pointer parameter.","blocks":[{"type":"md","text":"### An array argument is not copied\n\nEarlier you saw that a function gets a **copy** of each `int` argument. If the function changes its parameter, the caller's variable does not change.\n\nArrays are different. The notebook says an array **decays** (turns into) a *pointer to its first element* when you pass it to a function. A **pointer** is a value that holds a memory address: here, the address of `arr[0]`. (Pointers get a full lesson later. For today, all you need is this: the function gets the *address* of the caller's array, not a copy of the elements.)\n\nSo when the function writes `arr[0] = 99`, it writes into the **caller's** array."},{"type":"code","code":"#include <stdio.h>\n\nvoid change(int n, int arr[]) {\n    n = 99;          // changes the copy only\n    arr[0] = 99;     // changes the cal
