<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>CISC220 C Sprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A day-by-day C course for CISC220: Assignment 4 support, lessons, flashcards, labs and past-exam practice for the final.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: fixed left rail (countdown + day list) beside a single reading column; rail folds to a top bar on phones. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #e9edf3;
  --fg: #17202c;
  --muted: #5a6677;
  --line: #d5dbe4;
  --accent: #b35c00;
  --accent-ink: #ffffff;
  --accent-soft: #fbead6;
  --code-bg: #1b2330;
  --code-fg: #e4e9f1;
  --code-dim: #8d99ab;
  --code-k: #f0a35e;
  --code-s: #9fd6a6;
  --code-v: #8cc7ff;
  --code-c: #7f8a9b;
  --good: #1f7a4d;
  --good-soft: #dcf1e5;
  --warn: #9a6a00;
  --warn-soft: #fbf0cf;
  --bad: #b3261e;
  --bad-soft: #f9dedc;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --surface-2: #232b36; --fg: #e6ebf2; --muted: #9aa6b8; --line: #2e3845;
    --accent: #f2a03d; --accent-ink: #1a1206; --accent-soft: #3a2a14;
    --code-bg: #0d1117; --code-fg: #e4e9f1;
    --good: #5cc98f; --good-soft: #173527; --warn: #e3b341; --warn-soft: #3a3116; --bad: #f2867d; --bad-soft: #3d1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --surface-2: #232b36; --fg: #e6ebf2; --muted: #9aa6b8; --line: #2e3845;
  --accent: #f2a03d; --accent-ink: #1a1206; --accent-soft: #3a2a14;
  --code-bg: #0d1117; --code-fg: #e4e9f1;
  --good: #5cc98f; --good-soft: #173527; --warn: #e3b341; --warn-soft: #3a3116; --bad: #f2867d; --bad-soft: #3d1d1b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.4rem; font-weight: 650; }
h3 { font-size: 1.15rem; font-weight: 650; }
h4 { font-size: 1rem; font-weight: 650; }
code, pre, kbd, .mono { font-family: var(--font-mono); }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-inline: 16px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--fg); }
.brand b { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: -0.01em; }
.brand span { font-size: 0.8rem; color: var(--muted); }
.countdown { background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius); padding: 12px 14px; font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.5; }
.countdown .pr { color: var(--code-k); }
.countdown big { display: block; font-size: 1.6rem; font-weight: 600; color: #fff; font-family: var(--font-display); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h6 { margin: 10px 8px 4px; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 0.92rem; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.nav a .sub { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 400; }
.nav a.today-day { box-shadow: inset 3px 0 0 var(--accent); }
.meter { width: 44px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.badge { font-size: 0.75rem; font-family: var(--font-mono); background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 0 7px; font-weight: 600; }
.badge.zero { background: var(--surface-2); color: var(--muted); }

.main { min-width: 0; padding-block: 32px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 65ch; margin: 0; }
.head { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; color: var(--fg); font-weight: 500; font-size: 0.95rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--fg); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--fg); }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--fg); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn kbd { font-size: 0.7rem; opacity: 0.7; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.chip.high, .chip.medium, .chip.low { white-space: nowrap; }
.chip.high { background: var(--bad-soft); color: var(--bad); }
.chip.medium { background: var(--warn-soft); color: var(--warn); }
.chip.low { background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

/* Steps on a day page */
.steps { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.step { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 14px; padding: 16px 18px; border-top: 1px solid var(--line); align-items: start; }
.step:first-child { border-top: 0; }
.step .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; margin-top: 2px; }
.step.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.step.done .tick::after { content: "✓"; font-size: 0.8rem; font-weight: 700; }
.step h3 { font-size: 1.02rem; }
.step p { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }
.step .mins { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.step .acts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.step.done h3 { color: var(--muted); }
.topiclist { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.topiclist a { display: flex; gap: 8px; align-items: center; text-decoration: none; color: var(--fg); padding: 6px 10px; border-radius: 6px; background: var(--surface-2); font-size: 0.92rem; }
.topiclist a.done { color: var(--muted); }
.topiclist a.done::before { content: "✓"; color: var(--good); font-weight: 700; }
.topiclist a .chip { margin-left: auto; }

/* Lesson text */
.prose { display: flex; flex-direction: column; gap: 12px; }
.prose p { margin: 0; max-width: 70ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; }
.prose h3, .prose h4 { margin-top: 6px; }
.prose code, .inline-code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; overflow-wrap: anywhere; }
.prose table { border-collapse: collapse; font-size: 0.92rem; }
.prose th, .prose td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 600; }
.tablewrap { overflow-x: auto; }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; font-size: 0.86rem; line-height: 1.55; tab-size: 4; }
pre.code code { background: none; padding: 0; font-size: inherit; }
.code .k { color: var(--code-k); }
.code .s { color: var(--code-s); }
.code .v { color: var(--code-v); }
.code .c { color: var(--code-c); font-style: italic; }
.code .pr { color: var(--code-k); user-select: none; }
.code .outp { color: var(--code-dim); }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figcaption { font-size: 0.82rem; color: var(--muted); }

.callout { border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--surface); }
.callout > .lab { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.callout.check { border-color: var(--accent); background: var(--accent-soft); }
.callout.check > .lab { color: var(--accent); }
.callout.why { border-style: dashed; }
.callout.why > .lab { color: var(--muted); }
.callout.pitfall { background: var(--bad-soft); border-color: transparent; }
.callout.pitfall > .lab { color: var(--bad); }
.callout.exam { background: var(--warn-soft); border-color: transparent; }
.callout.exam > .lab { color: var(--warn); }
.reveal[hidden] { display: none; }
.answer { border-top: 1px solid var(--line); padding-top: 10px; }

/* Flashcards */
.flash { min-height: 260px; justify-content: center; }
.flash .side { font-size: 1.08rem; }
.flash .back { border-top: 1px dashed var(--line); padding-top: 14px; }
.rates { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rates .btn { justify-content: center; flex-direction: column; gap: 0; padding: 8px 6px; }
.rates .btn small { font-size: 0.72rem; color: var(--muted); font-weight: 400; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

/* Quiz */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .key { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); padding-top: 2px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.opt p { margin: 0; }
textarea.ans { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface); font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.5; tab-size: 4; }
textarea.ans.tall { min-height: 260px; }
textarea.prose-ans { font-family: var(--font-body); font-size: 0.98rem; }
.verdict { font-weight: 600; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

.rubric { display: flex; flex-direction: column; gap: 6px; }
.rubric label { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); cursor: pointer; }
.rubric label .m { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.rubric input { margin-top: 5px; accent-color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.82rem; color: var(--muted); }

.plan { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.plan th, .plan td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.plan th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.plan td.d { font-family: var(--font-mono); white-space: nowrap; }
.plan tr.now td { background: var(--accent-soft); }

.timer { font-family: var(--font-mono); font-size: 1.4rem; font-variant-numeric: tabular-nums; background: var(--code-bg); color: var(--code-fg); padding: 6px 14px; border-radius: 6px; }
.timer.low { color: #ff8a80; }
.sticky-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); }
.q-part { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.q-part:first-of-type { border-top: 0; padding-top: 0; }
.marks { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.kbd-hint { font-size: 0.8rem; color: var(--muted); }
kbd { background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 0.78rem; }
.menu-btn { display: none; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 6px; font-size: 0.9rem; z-index: 20; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; }
  .rail .nav { display: none; }
  .rail.open .nav { display: flex; }
  .rail-top { display: flex; align-items: center; gap: 12px; }
  .menu-btn { display: inline-flex; margin-left: auto; }
  .countdown { padding: 8px 12px; }
  .countdown big { font-size: 1.2rem; display: inline; margin-right: 6px; }
  h1 { font-size: 1.6rem; }
  .step { grid-template-columns: 28px minmax(0, 1fr); }
  .step .acts { grid-column: 2; align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .rates { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.callout.try { border-color: var(--good); background: var(--good-soft); }
.callout.try > .lab { color: var(--good); }
.callout.try > .lab::before { content: "$ "; font-family: var(--font-mono); }
.btn.primary kbd { background: transparent; border-color: currentColor; color: inherit; opacity: 0.8; }
details > summary { cursor: pointer; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.92rem; }
.toggle input { accent-color: var(--accent); width: 18px; height: 18px; }
</style>

<script>window.STUDY_DATA = {"days":[{"day":1,"title":"Your first C program","goal":"Write, compile and run a small C program, read gcc's messages, and know what gcc does to turn hello.c into ./hello.","topics":[{"id":"c1-structure","title":"What a C program looks like","notebook":"c/a_simple_c_program.ipynb","priority":"high","examNote":"On the exam you write C by hand. Every program you write needs `#include <stdio.h>` (if it prints), `int main(void) { ... }`, a `;` after each statement, and usually `return 0;`. Losing marks for a missing `;` or brace is easy to avoid.","blocks":[{"type":"md","text":"### Bash script vs C program\n\nA Bash script is **interpreted**: when you run `bash script.sh`, the program `bash` reads your file one line at a time and carries out each line as it goes. There is no separate translation step, so an error on line 20 is only noticed when Bash reaches line 20.\n\nA C program is **compiled**. *Compiling* means transforming code written in one language into another language. A *compiler* (we use `gcc`) reads your whole C *source code file* (plain text, usually ending in `.c`) and turns it into **machine code**, the language the computer's processor runs directly. The result is a separate file, an *executable program*, that you then run. If your C code has a mistake the compiler can see, you find out *before* anything runs.\n\n| | Bash script | C program |\n|---|---|---|\n| you write | `greet.sh` | `hello.c` |\n| before running | nothing (maybe `chmod +x`) | compile: `gcc -Wall -o hello hello.c` |\n| you run | `bash greet.sh` or `./greet.sh` | `./hello` (the compiled file) |\n| after editing | just run again | **compile again**, then run |"},{"type":"md","text":"### The smallest useful program\n\nThis is the course's *Hello, world!* program, with every part labelled below."},{"type":"code","code":"#include <stdio.h>\n\n/* hello.c: my first C program */\n\nint main(void) {\n    printf(\"Hello, world!\\n\");\n    return 0;\n}","caption":"hello.c"},{"type":"md","text":"- `#include <stdio.h>` is a **preprocessor directive** (any line starting with `#`). It inserts the *header file* `stdio.h` into your program. That file *declares* `printf` and `puts`: it tells the compiler these functions exist and what they accept. Without it the compiler does not know them.\n- `/* ... */` is a **comment**. The compiler ignores it. It may span many lines. Since C99 you can also write `// comment` to the end of a line.\n- `int main(void)` starts the definition of the **`main` function**. Every C program needs exactly one `main`: the program starts running there. `int` means `main` gives back (returns) an integer. `(void)` means it takes no command line arguments. (The other form, `int main(int argc, char *argv[])`, accepts command line arguments; it comes on a later day.)\n- `{` and `}` (**braces**) surround the *body* of `main`: the statements that run, top to bottom.\n- `printf(\"Hello, world!\\n\");` is a **statement**: it *calls* the function `printf` with one argument, the *string* `\"Hello, world!\\n\"` (text in double quotes). **Every statement ends with a semicolon `;`.** In Bash a new line ends a command; in C the `;` does.\n- `return 0;` ends `main` and hands the integer `0` back to the operating system. You will see where it goes in the next lesson.\n\nSpaces, blank lines and indentation do not matter to the compiler. We indent the body by 4 spaces so people can read it."},{"type":"md","text":"### printf and puts\n\nBoth are declared in `stdio.h` and both write text to *standard output* (`stdout`, the terminal unless you redirect it, exactly as in Bash).\n\n- `printf(\"text\")` prints **exactly** the characters you give it. To end the line you must write `\\n` (backslash n, the *newline character*) yourself. Inside a string, `\\n` is one character, not two.\n- `puts(\"text\")` prints the string **and then adds a newline itself**. It takes exactly one string.\n\nSo these two lines print the same thing:"},{"type":"code","code":"printf(\"Hello, world!\\n\");\nputs(\"Hello, world!\");","caption":"two ways to print one full line"},{"type":"md","text":"Forgetting `\\n` with `printf` glues the next output onto the same line. Here is a complete program that shows it:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"one\");\n    printf(\"two\\n\");\n    puts(\"three\");\n    puts(\"\");\n    puts(\"four\");\n    return 0;\n}","caption":"lines.c"},{"type":"code","code":"$ gcc -Wall -o lines lines.c\n$ ./lines\nonetwo\nthree\n\nfour","caption":"real output: `puts(\"\")` prints an empty line"},{"type":"md","text":"`printf` can do much more: its first argument is a *formatting string* that may contain *conversion specifiers* starting with `%` (the notebook's `hello2.c` uses `printf(\"%s\\n\", \"Hello, world!\");`). You will learn those on a later day. For today, use `printf` only with plain text and `\\n`, and do not put a `%` in your strings."},{"type":"check","q":"Which line ends a statement in C, and which ends a command in Bash?","a":"In C a semicolon `;` ends a statement (the line break does not matter). In Bash the end of the line (or a `;`) ends a command."},{"type":"why","q":"Why do we need `#include <stdio.h>` at the top?","a":"`printf` and `puts` are not built into the C language; they live in the C standard library. `stdio.h` declares them, so the compiler knows they exist and what arguments they take. The preprocessor pastes that header into your file before compiling."},{"type":"pitfall","text":"Using single quotes for text: `puts('Hello');` is wrong in C. Text (a *string*) always goes in **double quotes**: `puts(\"Hello\");`. Single quotes mean something different in C (one character), unlike Bash where both kinds of quotes make strings."},{"type":"pitfall","text":"Writing `puts(\"Hello\\n\");` prints `Hello` **and then an empty line**, because `puts` adds its own newline after yours."},{"type":"md","text":"### Key points\n\n- Bash is interpreted line by line; C is **compiled** into machine code first, and you run the compiled file.\n- Shape of every program today: `#include <stdio.h>`, then `int main(void) { statements }` ending with `return 0;`.\n- Each statement ends with `;`. Braces `{ }` hold the body. Comments are `/* ... */` or `// ...`.\n- `printf` prints exactly what you give it, so add `\\n`. `puts` adds the newline for you.\n- Strings use double quotes."}]},{"id":"c1-cycle","title":"Compile, run, fix: the cycle","notebook":"c/a_simple_c_program.ipynb","priority":"high","examNote":"Know the exact command `gcc -Wall -o hello hello.c`, what `-o` and `-Wall` mean, that `./hello` runs it, and that `return n;` in `main` becomes the exit status shown by `echo $?`.","blocks":[{"type":"md","text":"### The cycle\n\n1. **Edit** the source file: `nano hello.c` (save with Ctrl+O, Enter; exit with Ctrl+X).\n2. **Compile** it: `gcc -Wall -o hello hello.c`\n3. If the compiler reports errors, go back to step 1.\n4. **Run** the program: `./hello`\n5. If the output is wrong, go back to step 1. **Every change needs a new compile**: `./hello` runs the old machine code until you compile again.\n\nWhat the parts of the compile command mean:\n\n- `gcc` is the GNU C compiler.\n- `-Wall` turns on (almost) **all warnings**: messages about code that compiles but is probably a mistake. Always use it.\n- `-o hello` names the **output** file `hello`. The argument right after `-o` is the name. Without `-o`, gcc calls the program `a.out`.\n- `hello.c` is the source file to compile.\n\nThe order of `-o hello` and `hello.c` does not matter (the notebook writes `gcc hello1.c -o hello1`). The lab checker also adds `-std=c17`, which tells gcc to follow the C17 standard, the version of C this course uses."},{"type":"try","text":"Make a folder and your first program: `mkdir -p ~/cisc220_c/day1 && cd ~/cisc220_c/day1`, then `nano hello.c` and type the hello.c program from the first lesson exactly. Save, exit, then run `gcc -Wall -o hello hello.c` and `./hello`. Use `ls -l` to see that `hello` is a new file with `x` (execute) permission, just like a script after `chmod +x`."},{"type":"code","code":"$ gcc -Wall -o hello hello.c\n$ ./hello\nHello, world!","caption":"no news is good news: gcc prints nothing when there are no errors or warnings"},{"type":"pitfall","text":"Why `./hello` and not `hello`? Same reason as for scripts: the shell only looks in the folders listed in `PATH` for commands, and your current folder is not one of them. `./` says \"the file in this folder\"."},{"type":"md","text":"### Reading a compiler error\n\nDelete the `;` after the `printf(...)` line, save, and compile again. gcc 13 (Ubuntu) prints:"},{"type":"code","code":"$ gcc -Wall -o hello hello.c\nhello.c: In function 'main':\nhello.c:6:30: error: expected ';' before 'return'\n    6 |     printf(\"Hello, world!\\n\")\n      |                              ^\n      |                              ;\n    7 |     return 0;\n      |     ~~~~~~","caption":"a missing semicolon"},{"type":"md","text":"Read it from the left: **file : line : column : kind : message**. `hello.c:6:30` means file `hello.c`, line 6, column 30 (the 30th character on the line). `error` means gcc could not make a program, so **no new `hello` file is written**. The `^` points at the spot, and gcc even suggests the fix (`;`).\n\nNotice the message mentions `return`, the next statement: gcc only noticed the problem when it reached the word after the missing `;`. So when an error makes no sense on its line, **look at the line before it**.\n\nFix the line (put the `;` back), save, compile again, run again. When there are several errors, fix the **first** one first: one mistake can cause a pile of follow-on messages."},{"type":"try","text":"Break hello.c on purpose, one mistake at a time, compile after each, read the line:column, then fix it: (1) remove the `;` after `printf(...)`; (2) delete the final `}`; (3) misspell `printf` as `prinft`. Compare what gcc says for each (the next lessons explain the third one)."},{"type":"md","text":"### Warnings vs errors\n\n- An **error** stops compiling. No program is produced (or the old one is left unchanged).\n- A **warning** still produces a program, but gcc thinks something is probably wrong. Treat warnings as bugs and fix them; the lab checker shows them to you.\n\nExample: this program declares an integer *variable* `x` (a named box holding an `int`, more on a later day) and never uses it."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int x = 5;\n    puts(\"Hello\");\n    return 0;\n}","caption":"warn.c"},{"type":"code","code":"$ gcc -Wall -o warn warn.c\nwarn.c: In function 'main':\nwarn.c:4:9: warning: unused variable 'x' [-Wunused-variable]\n    4 |     int x = 5;\n      |         ^\n$ ./warn\nHello","caption":"a warning: the program was still built and runs"},{"type":"md","text":"The `[-Wunused-variable]` at the end names the warning; it is one of the ones `-Wall` turns on. Without `-Wall`, gcc would have said nothing."},{"type":"md","text":"### return 0 is the exit status\n\nIn Bash, every command finishes with an **exit status**: `0` means success, anything else means failure, and `$?` holds the last one. A C program is a command too. **The value `main` returns becomes the program's exit status.** That is why a program that worked should `return 0;`."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    puts(\"about to exit with status 3\");\n    return 3;\n}","caption":"status.c"},{"type":"code","code":"$ gcc -Wall -o status status.c\n$ ./status\nabout to exit with status 3\n$ echo $?\n3\n$ ./status && echo ok || echo failed\nabout to exit with status 3\nfailed","caption":"Bash sees status 3 as failure, so `||` runs"},{"type":"md","text":"- If `main` reaches its closing `}` without a `return`, it returns `0` automatically (special rule for `main` only). Writing `return 0;` is still the course style.\n- On Linux only the lowest 8 bits are kept, so an exit status is always 0 to 255 (`return 300;` shows up as `44`). Use small numbers.\n- `echo $?` reports the **last** command. Run it straight after `./status`, or you will see the status of whatever ran in between."},{"type":"try","text":"Compile and run status.c, then `echo $?`. Change `return 3;` to `return 0;`, run `./status` **without recompiling** and check `echo $?` (still 3: you ran the old program). Now recompile and check again."},{"type":"check","q":"You compile, get one `warning:` and no `error:`. Does `./prog` exist and run?","a":"Yes. Warnings still produce the program. But read the warning: it usually points at a real bug."},{"type":"md","text":"### Key points\n\n- Cycle: `nano prog.c` → `gcc -Wall -o prog prog.c` → `./prog`. Recompile after every edit.\n- `-o name` names the output (default `a.out`); `-Wall` turns on warnings.\n- Error messages read `file:line:column: error: message`. If the line looks fine, check the line before. Fix the first error first.\n- Error: no program made. Warning: program made, but probably buggy.\n- `return n;` in `main` sets the exit status; see it with `echo $?`. `0` means success."}]},{"id":"c1-stages","title":"What gcc actually does","notebook":"c/compiling.ipynb","priority":"medium","examNote":"Be able to name the four stages in order (preprocessing, compiling, assembling, linking), say what each produces, and say which stage reports `undefined reference`.","blocks":[{"type":"md","text":"### Four stages\n\n`gcc hello.c -o hello` looks like one step, but gcc runs four in a row:\n\n1. **Preprocessing.** The *preprocessor* handles the lines starting with `#`. `#include <stdio.h>` is replaced by the whole text of `stdio.h`, and comments are removed. Your file plus the headers it includes is called a *translation unit*. Stop here with `gcc -E hello.c > hello.i`.\n2. **Compiling.** The translation unit is turned into **assembly language**, a human-readable language whose lines map closely to the processor's machine instructions. Stop here with `gcc -S hello.c` (writes `hello.s`).\n3. **Assembling.** The assembly is turned into **object code** (`hello.o`): machine code for *this one file only*. It contains a *call* to `printf`, but not `printf` itself. Stop here with `gcc -c hello.c`.\n4. **Linking.** The *linker* (`ld`) joins the object code with the code of the functions it calls, here from the **C standard library**, where the machine code for `printf` and `puts` lives. The result is the executable `hello`. The standard library is linked automatically."},{"type":"try","text":"In your day1 folder run `gcc -E hello.c > hello.i`, then `wc -l hello.i` (over 800 lines from a 7-line file: that is `stdio.h` pasted in) and `tail -5 hello.i` (your `main` is at the end, and your comment is gone). Then `gcc -S hello.c` and `cat hello.s`: look for a line `call` with `printf` or `puts` (gcc may swap a simple `printf` ending in `\\n` for `puts`). Finally `gcc -c hello.c` and `ls`."},{"type":"code","code":"$ gcc -E hello.c | tail -5\nint main(void) {\n    printf(\"Hello, world!\\n\");\n    return 0;\n}\n$ gcc -E hello.c | wc -l\n821","caption":"the end of the preprocessor output (the line count depends on your system)"},{"type":"md","text":"### Errors from different stages\n\nKnowing the stages tells you what kind of mistake you made. Here `printf` is misspelled as `prinft`:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    prinft(\"Hello\\n\");\n    return 0;\n}","caption":"typo.c"},{"type":"code","code":"$ gcc -Wall -o typo typo.c\ntypo.c: In function 'main':\ntypo.c:4:5: warning: implicit declaration of function 'prinft'; did you mean 'printf'? [-Wimplicit-function-declaration]\n    4 |     prinft(\"Hello\\n\");\n      |     ^~~~~~\n      |     printf\n/usr/bin/ld: /tmp/cc3XZNQe.o: in function `main':\ntypo.c:(.text+0x18): undefined reference to `prinft'\ncollect2: error: ld returned 1 exit status","caption":"a compiler warning, then a linker error (the /tmp name changes every time)"},{"type":"md","text":"- The **compiler** only warns: no header declares `prinft`, but it lets the call through, hoping it is defined somewhere else.\n- The **linker** (`ld`) then searches your object code and the standard library for a function named `prinft`, finds none, and fails: **`undefined reference to`** always means a *linking* problem. Note there is no line:column here, because the linker works on object code, not on your source text.\n\n(Forgetting `#include <stdio.h>` gives a similar `implicit declaration of function 'puts'` warning. On our gcc 13 the program still links, because `puts` really is in the library, but newer gcc versions make it an error. Always include the header.)"},{"type":"md","text":"### -lm goes after the source file\n\nMath functions such as `sin` and `pow` (declared in `math.h`) are in a separate *math library* that is **not** linked automatically. You ask for it with `-lm` (\"link library m\"). You will need this for Assignment 4's `sin.c`.\n\n**Where you put `-lm` matters.** The linker reads its inputs **left to right**. When it reaches a library, it only takes the functions that the files *before it* still need. If `-lm` comes first, nothing needs `pow` yet, so nothing is taken; then your file asks for `pow` and it is too late. On Ubuntu, with a file `m.c` that calls `pow` (the code itself does not matter today):"},{"type":"code","code":"$ gcc -o m -lm m.c\n/usr/bin/ld: /tmp/ccyj9svi.o: in function `main':\nm.c:(.text+0x3f): undefined reference to `pow'\ncollect2: error: ld returned 1 exit status\n$ gcc -o m m.c -lm\n$","caption":"same files, different order: the second one works"},{"type":"pitfall","text":"The Assignment 4 handout writes `gcc -o sin -lm sin.c`. On Ubuntu that fails with `undefined reference to 'pow'` even if your code is perfect. Use `gcc -Wall -o sin sin.c -lm`."},{"type":"pitfall","text":"Mixing up names after `-o` destroys files: `gcc -o first.c second.c` silently **replaces your source file `first.c`** with machine code. (gcc refuses only when the two names are identical.) Always write the program name, with no `.c`, right after `-o`."},{"type":"why","q":"Why does a typo in a function name give no line number in the final error?","a":"Because the final error comes from the linker. The linker works on object code, after your source text has been compiled, so it only knows which function was missing (`undefined reference to 'prinft'`), not the line in your file. The compiler's warning just above it does have the line:column."},{"type":"md","text":"### Key points\n\n- gcc's four stages: **preprocess** (`#include`, remove comments; `-E`), **compile** to assembly (`-S`, `.s`), **assemble** to object code (`-c`, `.o`), **link** with the library to make the executable.\n- Object code for your file contains calls to `printf`/`puts` but not their code; the linker brings that in from the C standard library.\n- `undefined reference to` = linker error: a misspelled function or a missing library.\n- The math library needs `-lm`, written **after** the `.c` file, because the linker reads left to right."}]}],"flashcards":[{"id":"c1-fc-01","topic":"c1-structure","front":"Compiled vs interpreted: which is C, which is Bash?","back":"C is compiled: gcc translates the whole file into machine code, then you run the result. Bash is interpreted: bash reads and runs the script line by line."},{"id":"c1-fc-02","topic":"c1-structure","front":"What does `#include <stdio.h>` do?","back":"A preprocessor directive that inserts the header file stdio.h, which declares `printf` and `puts` so the compiler knows them."},{"id":"c1-fc-03","topic":"c1-structure","front":"Where does a C program start running?","back":"At the `main` function. Every program needs exactly one."},{"id":"c1-fc-04","topic":"c1-structure","front":"What does `int main(void)` say?","back":"`main` returns an `int` (the exit status) and takes no command line arguments."},{"id":"c1-fc-05","topic":"c1-structure","front":"What ends a statement in C?","back":"A semicolon `;`. Line breaks and indentation do not matter to the compiler."},{"id":"c1-fc-06","topic":"c1-structure","front":"Two kinds of comments in C?","back":"`/* ... */` (can span lines) and `// ...` to the end of the line (since C99)."},{"id":"c1-fc-07","topic":"c1-structure","front":"`printf` vs `puts` and newlines?","back":"`printf(\"hi\")` prints exactly `hi`, no newline; you add `\\n`. `puts(\"hi\")` prints `hi` and adds a newline itself."},{"id":"c1-fc-08","topic":"c1-structure","front":"What does `puts(\"\");` print?","back":"An empty line (just a newline)."},{"id":"c1-fc-09","topic":"c1-cycle","front":"Command to compile hello.c into a program named hello, with warnings?","back":"`gcc -Wall -o hello hello.c` (then run it with `./hello`)."},{"id":"c1-fc-10","topic":"c1-cycle","front":"What does `-o` do? What if you leave it out?","back":"Names the output file (the next argument). Without it gcc writes `a.out`."},{"id":"c1-fc-11","topic":"c1-cycle","front":"What does `-Wall` do?","back":"Turns on (almost) all warnings: messages about code that compiles but is probably wrong."},{"id":"c1-fc-12","topic":"c1-cycle","front":"How to read `hello.c:6:30: error: expected ';' before 'return'`?","back":"File hello.c, line 6, column 30, an error (no program made). The `;` is missing at the end of line 6, just before `return`."},{"id":"c1-fc-13","topic":"c1-cycle","front":"Error vs warning?","back":"Error: compiling stops and no program is made. Warning: the program is made but is probably buggy; fix it anyway."},{"id":"c1-fc-14","topic":"c1-cycle","front":"Where does `return 3;` in `main` go?","back":"It becomes the program's exit status; `echo $?` right after running prints 3."},{"id":"c1-fc-15","topic":"c1-cycle","front":"You edited prog.c but `./prog` still behaves the old way. Why?","back":"You did not recompile. `./prog` runs the old machine code until you run gcc again."},{"id":"c1-fc-16","topic":"c1-stages","front":"gcc's four stages in order?","back":"Preprocessing, compiling (to assembly), assembling (to object code), linking (to the executable)."},{"id":"c1-fc-17","topic":"c1-stages","front":"What stage gives `undefined reference to 'xyz'`?","back":"Linking: no object code or library defines a function named xyz (typo, or missing library like `-lm`)."},{"id":"c1-fc-18","topic":"c1-stages","front":"Where does `-lm` go and why?","back":"After the source file: `gcc -o sin sin.c -lm`. The linker reads left to right and only takes from a library what earlier files need."}],"quiz":[{"id":"c1-q-01","topic":"c1-structure","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"ab\");\n    printf(\"cd\\n\");\n    puts(\"ef\");\n    return 0;\n}","answer":"abcd\nef","explain":"The first `printf` has no `\\n`, so `cd` continues the same line. `puts` adds its own newline after `ef`."},{"id":"c1-q-02","topic":"c1-structure","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    puts(\"top\");\n    puts(\"\");\n    printf(\"bottom\\n\");\n    return 0;\n}","answer":"top\n\nbottom","explain":"`puts(\"\")` prints only a newline, which shows as an empty line."},{"id":"c1-q-03","topic":"c1-structure","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    puts(\"x\\n\");\n    puts(\"y\");\n    return 0;\n}","answer":"x\n\ny","explain":"`puts` prints `x`, then your `\\n`, then its own newline: so there is an empty line between `x` and `y`."},{"id":"c1-q-04","topic":"c1-structure","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"1\\n2\\n\");\n    // puts(\"3\");\n    /* puts(\"4\"); */\n    printf(\"5\\n\");\n    return 0;\n}","answer":"1\n2\n5","explain":"One `printf` can print several lines: each `\\n` ends one. The two `puts` calls are inside comments, so they never run."},{"id":"c1-q-05","topic":"c1-structure","type":"mcq","q":"Which line correctly prints `Hi` followed by a newline?","options":["puts('Hi');","printf(\"Hi\");","puts(\"Hi\")","printf(\"Hi\\n\");"],"answer":3,"explain":"Strings need double quotes (not single), `printf` needs `\\n` for the newline, and every statement needs a `;`."},{"id":"c1-q-06","topic":"c1-structure","type":"short","q":"In one or two sentences: how is running a C program different from running a Bash script?","answer":"A Bash script is interpreted: bash reads and runs it line by line. A C program must first be compiled by gcc into a machine-code executable, and then you run that executable (e.g. `./hello`); after every edit you must compile again.","explain":"Compiled vs interpreted is the key difference. The compiler checks the whole file before anything runs."},{"id":"c1-q-07","topic":"c1-cycle","type":"short","q":"Write the command that compiles `pattern.c` into a program named `pattern` with all warnings on, and the command that runs it.","answer":"`gcc -Wall -o pattern pattern.c` then `./pattern`","explain":"`-o pattern` names the output; `-Wall` enables warnings; `./` runs a file in the current folder."},{"id":"c1-q-08","topic":"c1-cycle","type":"short","q":"gcc prints `prog.c:5:5: error: expected ';' before 'return'`. What do the two numbers mean, and where is the mistake most likely?","answer":"Line 5, column 5. The `;` is missing at the end of the statement before `return`, most likely on line 4.","explain":"gcc only notices a missing `;` when it reaches the next word, so look at the line before."},{"id":"c1-q-09","topic":"c1-cycle","type":"output","q":"You compile this as `prog`. What does `./prog; echo $?` print?","code":"#include <stdio.h>\n\nint main(void) {\n    puts(\"done\");\n    return 2;\n}","answer":"done\n2","explain":"The program prints `done`; `main` returns 2, which is the exit status that `echo $?` shows."},{"id":"c1-q-10","topic":"c1-cycle","type":"output","q":"You compile this as `prog`. What does `./prog && echo yes || echo no` print?","code":"#include <stdio.h>\n\nint main(void) {\n    puts(\"checking\");\n    return 1;\n}","answer":"checking\nno","explain":"Exit status 1 means failure in Bash, so `&&` skips `echo yes` and `||` runs `echo no`."},{"id":"c1-q-11","topic":"c1-cycle","type":"mcq","q":"gcc prints one `warning:` line and nothing else. What happened?","options":["No program was made","The program was made, but gcc thinks some code is probably wrong","The old program was deleted","The program will crash"],"answer":1,"explain":"Warnings do not stop compiling. Errors do. A warning is still worth fixing."},{"id":"c1-q-12","topic":"c1-stages","type":"mcq","q":"Which gcc stage replaces `#include <stdio.h>` with the contents of the header?","options":["Preprocessing","Compiling","Assembling","Linking"],"answer":0,"explain":"Lines starting with `#` are preprocessor directives, handled first. `gcc -E` shows the result."},{"id":"c1-q-13","topic":"c1-stages","type":"short","q":"`gcc -o area -lm area.c` fails with `undefined reference to 'sqrt'`, but the code is correct. Fix the command and explain why it works.","answer":"`gcc -o area area.c -lm`. The linker reads left to right and only takes functions from a library that earlier inputs still need; with `-lm` first nothing needed `sqrt` yet, so it was skipped.","explain":"`undefined reference` is a linker error. Put libraries after the source files."}],"write":[{"id":"c1-w-01","topic":"c1-structure","stage":"worked","marks":4,"prompt":"Write a complete C program `menu.c` that prints these three lines exactly, then ends successfully:\n\n```\nMenu\n1. Soup\n2. Salad\n```\n\nUse `puts` for the first line and a single `printf` for the other two.","starter":"","solution":"#include <stdio.h>\n\nint main(void) {\n    puts(\"Menu\");\n    printf(\"1. Soup\\n2. Salad\\n\");\n    return 0;\n}","explain":"`#include <stdio.h>` declares `puts` and `printf`. The program starts at `main`. `puts` adds the newline after `Menu` itself. One `printf` prints two lines because the string contains two `\\n`; the last `\\n` is needed so the output ends with a newline. `return 0;` gives exit status 0 (success).","rubric":[{"marks":1,"item":"`#include <stdio.h>` and `int main(void) { ... }`"},{"marks":1,"item":"`puts(\"Menu\");` with no extra `\\n`"},{"marks":1,"item":"one `printf` with both lines and both `\\n`"},{"marks":1,"item":"`return 0;` and every statement ends with `;`"}],"pitfalls":["`puts(\"Menu\\n\")` adds a blank line","forgetting the final `\\n` in printf","single quotes around strings"]},{"id":"c1-w-02","topic":"c1-cycle","stage":"faded","marks":4,"prompt":"Fill in the blanks so the program prints `not found` on its own line and exits with status 1. Then write the command that compiles it as `find1` with warnings, and the command that shows the exit status after running it.","starter":"#include ____\n\nint ____(void) {\n    printf(\"not found____\");\n    return ____;\n}","solution":"#include <stdio.h>\n\nint main(void) {\n    printf(\"not found\\n\");\n    return 1;\n}\n\n/* gcc -Wall -o find1 find1.c\n   ./find1\n   echo $? */","explain":"","rubric":[{"marks":1,"item":"`<stdio.h>` and `main`"},{"marks":1,"item":"`\\n` at the end of the printf string"},{"marks":1,"item":"`return 1;`"},{"marks":1,"item":"`gcc -Wall -o find1 find1.c`, then `./find1` and `echo $?`"}],"pitfalls":["writing `exit status` text instead of returning it","running `echo $?` after another command, which reports that command instead"]},{"id":"c1-w-03","topic":"c1-structure","stage":"blank","marks":4,"prompt":"Write a complete C program that prints this arrow exactly (no spaces at the ends of lines) and exits with status 0. Use any mix of `printf` and `puts`.\n\n```\n  ^\n /|\n  |\n  |\n```\n\nHint: the second line is a space, a slash and a bar.","starter":"","solution":"#include <stdio.h>\n\nint main(void) {\n    puts(\"  ^\");\n    puts(\" /|\");\n    puts(\"  |\");\n    puts(\"  |\");\n    return 0;\n}","rubric":[{"marks":1,"item":"correct program structure (`#include <stdio.h>`, `int main(void)`, braces)"},{"marks":2,"item":"four lines exactly right, including leading spaces, each ending in a newline"},{"marks":1,"item":"`return 0;` and semicolons"}],"pitfalls":["a `/` is a normal character in a string, but a backslash `\\` is not (it starts an escape like `\\n`), which is why this arrow avoids it","losing the leading spaces"]}]},{"day":2,"title":"Variables, types, printf and control flow","goal":"Declare and use int, unsigned int, double, char and size_t variables, predict integer versus floating-point arithmetic, print values with exact widths and precisions, and write if statements, loops and small functions.","topics":[{"id":"c2-vars","title":"Variables, types and arithmetic","notebook":"c/types.ipynb","priority":"high","examNote":"Exam questions love `7 / 2` (it is `3`), `-7 % 2` (it is `-1`) and `(double) a / b` versus `(double) (a / b)`. Trace them by hand.","blocks":[{"type":"md","text":"A **variable** is a named box in memory that holds one value. In C every variable has a **type**, and the type\ndecides what values the box can hold and what you can do with it.\n\nYou create a variable with a **declaration**: the type, then the name, then a semicolon.\n\n```c\nint count;\n```\n\nA name (formally an *identifier*) is made of letters, digits and underscores and cannot start with a digit:\n`total`, `max_value`, `x2` are fine; `2x` is not.\n\n### The five types you need today\n\n| Type | Holds | Example value |\n| :--- | :--- | :--- |\n| `int` | whole numbers, negative or not | `-5`, `0`, `42` |\n| `unsigned int` | whole numbers that are never negative | `0`, `40000` |\n| `double` | numbers with a fractional part (floating point) | `3.14`, `-0.5`, `2.0` |\n| `char` | one character, written in single quotes | `'A'`, `'z'`, `'7'` |\n| `size_t` | an unsigned whole number used for sizes, lengths and counts | `0`, `12` |\n\n`size_t` is not a new kind of number: it is a name for some unsigned integer type that is big enough to hold the size\nof anything in memory. It is defined in `<stdio.h>` (and `<stddef.h>`, `<stdlib.h>`, `<string.h>`). You will meet it again\nwhenever you work with string lengths."},{"type":"md","text":"### Initialising and assigning\n\nGiving a variable a value **in its declaration** is called **initialisation**. Giving an existing variable a new value\nlater is called **assignment**. Both use `=`, which means *store*, not *is equal to*."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int count = 3;              // a whole number; may be negative\n    unsigned int pages = 250;   // a whole number that is never negative\n    double price = 19.99;       // a number with a fractional part\n    char grade = 'A';           // one character, written in single quotes\n    size_t length = 12;         // an unsigned type for sizes and counts\n\n    count = count + 1;          // assignment: replace the old value\n\n    printf(\"count  = %d\\n\", count);\n    printf(\"pages  = %u\\n\", pages);\n    printf(\"price  = %f\\n\", price);\n    printf(\"grade  = %c\\n\", grade);\n    printf(\"length = %zu\\n\", length);\n    return 0;\n}","caption":"vars.c: one variable of each type. `%d`, `%u`, `%f`, `%c` and `%zu` tell `printf` how to print each type (next lesson)."},{"type":"code","code":"$ gcc -Wall -o vars vars.c\n$ ./vars\ncount  = 4\npages  = 250\nprice  = 19.990000\ngrade  = A\nlength = 12"},{"type":"pitfall","text":"A variable declared inside a function and **not** initialised holds an indeterminate (garbage) value. Reading it before you assign it is a bug and its output is not predictable. Always initialise: `int total = 0;`."},{"type":"md","text":"### `const`: a read-only variable\n\nPut `const` in front of the type and the variable cannot be assigned to after its initialisation (like `final` in Java).\nUse it for values that should never change, such as a limit. The compiler refuses to build code that tries to change it:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    const int max = 10;   // read-only from now on\n    max = 20;             // error: max is const\n    printf(\"%d\\n\", max);\n    return 0;\n}","caption":"const_bad.c (does not compile)"},{"type":"code","code":"$ gcc -Wall -o const_bad const_bad.c\nconst_bad.c:5:9: error: assignment of read-only variable ‘max’\n    5 |     max = 20;             // error: max is const\n      |         ^"},{"type":"md","text":"### Arithmetic\n\nThe operators are `+`, `-`, `*`, `/` and `%` (remainder, also called *mod*). `*`, `/` and `%` happen before `+` and `-`;\nuse parentheses to change the order: `n * (n + 1) / 2`.\n\nThe important rule: **the types of the two operands decide what kind of arithmetic is done.**\n\n- `int / int` is **integer division**: the fraction is thrown away (it rounds toward zero). `7 / 2` is `3`, `-7 / 2` is `-3`.\n- `%` gives the remainder and works only on integers. `7 % 2` is `1`. The remainder has the sign of the left operand: `-7 % 2` is `-1`.\n- If **either** operand is a `double`, the other is converted to `double` first and you get **floating-point division**: `7.0 / 2` is `3.5`."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int a = 7;\n    int b = 2;\n    printf(\"a / b   = %d\\n\", a / b);     // int / int: fraction thrown away\n    printf(\"a mod b = %d\\n\", a % b);     // remainder\n    printf(\"-7 / 2  = %d\\n\", -7 / 2);    // rounds toward zero\n    printf(\"-7 mod 2 = %d\\n\", -7 % 2);   // remainder has the sign of -7\n    printf(\"7.0 / 2 = %f\\n\", 7.0 / 2);   // one double: double division\n    return 0;\n}","caption":"division.c"},{"type":"code","code":"$ gcc -Wall -o division division.c\n$ ./division\na / b   = 3\na mod b = 1\n-7 / 2  = -3\n-7 mod 2 = -1\n7.0 / 2 = 3.500000"},{"type":"md","text":"### Mixing `int` and `double`, and casts\n\nStoring an `int` result into a `double` variable does **not** bring the fraction back: the division already happened\nwith integers. To get a real average you must make one operand a `double` *before* dividing. A **cast** does that:\n`(double) total` means \"the value of `total`, converted to `double`\".\n\nA cast applies only to the value right after it. `(double) total / n` converts `total` and then divides, but\n`(double) (total / n)` divides first (integer division) and converts the already-truncated result.\n\nGoing the other way, storing a `double` into an `int` drops the fraction (no rounding)."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int total = 9;\n    int n = 4;\n    double wrong = total / n;            // 9 / 4 is the int 2, then 2 becomes 2.0\n    double right = (double) total / n;   // 9.0 / 4 is 2.25\n    double late = (double) (total / n);  // cast happens after int division: 2.0\n    int whole = 3.99;                    // double to int: the fraction is dropped\n    printf(\"wrong = %f\\n\", wrong);\n    printf(\"right = %f\\n\", right);\n    printf(\"late  = %f\\n\", late);\n    printf(\"whole = %d\\n\", whole);\n    return 0;\n}","caption":"mixing.c"},{"type":"code","code":"$ gcc -Wall -o mixing mixing.c\n$ ./mixing\nwrong = 2.000000\nright = 2.250000\nlate  = 2.000000\nwhole = 3"},{"type":"why","q":"Why does C have two kinds of division at all?","a":"Integers and floating-point numbers are stored in completely different ways, and the processor has separate instructions for each. C exposes this directly: it picks the instruction from the operand types. Integer division is exact for whole-number work (counting, splitting into groups, digits), and `%` gives the leftover."},{"type":"pitfall","text":"Dividing an integer by zero (`x / 0` or `x % 0` with ints) is undefined behaviour: the program may crash or do anything. Check the divisor first."},{"type":"check","q":"What are `17 / 5`, `17 % 5` and `17 / 5.0`?","a":"`3`, `2` and `3.4`. The first two use integers; the last has a `double` operand so it is floating-point division."},{"type":"check","q":"`int a = 5, b = 2;` What is `(double) (a / b)`? What is `(double) a / b`?","a":"`2.0` (int division happens first, giving 2) and `2.5` (a becomes 5.0, then 5.0 / 2)."},{"type":"try","text":"Copy mixing.c into `~/cisc220_c/day2/`, compile it with `gcc -Wall -o mixing mixing.c` and run it. Then change `n` to `3` and predict all four lines before running it again."},{"type":"md","text":"### Key points\n\n- Declare before use: `type name;`. Initialise with `=` in the declaration; assign with `=` later.\n- `int`, `unsigned int`, `double`, `char` (`'A'`), `size_t` (unsigned, for sizes and counts).\n- `const` makes a variable read-only; assigning to it is a compile error.\n- `int / int` truncates toward zero; `%` is the remainder (sign of the left operand).\n- One `double` operand makes it floating-point division. Cast *before* dividing: `(double) total / n`.\n- `double` to `int` drops the fraction. Never read an uninitialised variable."}]},{"id":"c2-printf","title":"printf: conversions, width and precision","notebook":"c/floats.ipynb","priority":"high","examNote":"Assignment 4's sin.c prints its answer with `%24.17f`. Know what each number means: width 24 = at least 24 characters, padded on the left with spaces; precision 17 = 17 digits after the decimal point.","blocks":[{"type":"md","text":"`printf` prints its first argument, the **format string**, but each **conversion specification** (a `%` followed by a\nletter) is replaced by the next argument, converted to text. The letter must match the argument's type.\n\n| Conversion | Prints a ... | Example |\n| :--- | :--- | :--- |\n| `%d` | `int` (decimal) | `-5` |\n| `%u` | `unsigned int` | `40000` |\n| `%zu` | `size_t` | `8` |\n| `%f` | `double` (6 digits after the point by default) | `9.810000` |\n| `%c` | `char` (the character itself) | `z` |\n| `%s` | string (for now: a string literal in double quotes) | `hello` |\n| `%%` | a literal `%` sign (uses no argument) | `%` |\n\nArguments are used left to right, one per conversion."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int temp = -5;\n    unsigned int u = 40000;\n    size_t size = 8;\n    double g = 9.81;\n    char c = 'z';\n    printf(\"int      %d\\n\", temp);\n    printf(\"unsigned %u\\n\", u);\n    printf(\"size_t   %zu\\n\", size);\n    printf(\"double   %f\\n\", g);\n    printf(\"char     %c\\n\", c);\n    printf(\"string   %s\\n\", \"hello\");\n    printf(\"%d items at %f each, grade %c\\n\", 3, 2.5, 'B');\n    return 0;\n}","caption":"specifiers.c"},{"type":"code","code":"$ gcc -Wall -o specifiers specifiers.c\n$ ./specifiers\nint      -5\nunsigned 40000\nsize_t   8\ndouble   9.810000\nchar     z\nstring   hello\n3 items at 2.500000 each, grade B"},{"type":"pitfall","text":"A conversion that does not match its argument is undefined behaviour: the output is not predictable. `gcc -Wall` catches most of these, so always compile with `-Wall` and fix every warning:\n\n```\n$ gcc -Wall -o wrongspec wrongspec.c\nwrongspec.c:5:14: warning: format ‘%d’ expects argument of type ‘int’, but argument 2 has type ‘double’ [-Wformat=]\n    5 |     printf(\"%d\\n\", x);    // wrong: %d needs an int\n      |             ~^     ~\n      |              |     |\n      |              int   double\n      |             %f\n```"},{"type":"md","text":"### Field width and precision\n\nBetween the `%` and the letter you can put a **width** and a **precision**: `%` *width* `.` *precision* `f`.\n\n- **Width** is the *minimum* number of characters to print. If the value is shorter, it is padded with spaces on the\n  **left**, so numbers line up on the right (right-aligned). A `-` before the width pads on the right instead (left-aligned).\n  If the value is longer than the width, it is printed in full; the width never cuts anything off.\n- **Precision** (the number after the `.`) for `%f` is the number of **digits after the decimal point**. The value is\n  rounded to that many digits. `%.0f` prints no decimal point at all.\n\nThe width counts *every* character: the sign, the digits before the point, the point itself and the digits after it."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int n = 42;\n    double third = 1.0 / 3.0;\n    printf(\"[%d]\\n\", n);\n    printf(\"[%5d]\\n\", n);         // width 5: at least 5 characters\n    printf(\"[%-5d]\\n\", n);        // minus sign: left-aligned\n    printf(\"[%1d]\\n\", 12345);     // too narrow: never cut off\n    printf(\"[%.3f]\\n\", third);    // precision 3: 3 digits after the point\n    printf(\"[%8.2f]\\n\", third);   // width 8, precision 2\n    printf(\"[%24.17f]\\n\", third); // width 24, precision 17\n    printf(\"[%.2f]\\n\", 2.999);    // rounded, not chopped\n    printf(\"[%.0f]\\n\", 7.5);      // no digits after the point\n    return 0;\n}","caption":"width.c: the square brackets show exactly where the spaces are."},{"type":"code","code":"$ gcc -Wall -o width width.c\n$ ./width\n[42]\n[   42]\n[42   ]\n[12345]\n[0.333]\n[    0.33]\n[     0.33333333333333331]\n[3.00]\n[8]"},{"type":"md","text":"Read `%24.17f` with `1.0 / 3.0`: precision 17 gives `0.33333333333333331` (17 digits after the point). That is\n1 + 1 + 17 = 19 characters, so width 24 adds 24 - 19 = 5 spaces in front. Notice the last digits are `31`, not `33`:\na `double` holds about 16 significant decimal digits, so digits that far out show the tiny error in the stored value.\nThat is normal, not a bug."},{"type":"why","q":"Why is padding on the left the default?","a":"Tables of numbers are read by place value, so ones digits should line up under ones digits. Right-aligning in a fixed width does that automatically when every row uses the same conversion, for example `%6d` or `%8.2f`."},{"type":"md","text":"### Printing a literal `%`\n\nBecause `%` starts a conversion, write `%%` to print one percent sign:"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int score = 87;\n    printf(\"You scored %d%%\\n\", score);\n    printf(\"%%d prints an int\\n\");\n    return 0;\n}","caption":"percent.c"},{"type":"code","code":"$ gcc -Wall -o percent percent.c\n$ ./percent\nYou scored 87%\n%d prints an int"},{"type":"check","q":"How many characters does `printf(\"%8.3f\", 2.5)` print, and what are they?","a":"8 characters: `2.500` is 5 characters, so 3 spaces come first: `   2.500`."},{"type":"check","q":"Which format prints a `double` in at least 10 characters with 4 digits after the point?","a":"`%10.4f`."},{"type":"try","text":"Add the line `printf(\"[%-24.17f]\\n\", third);` to width.c, compile and run it, and see the 5 spaces move to the right side of the number."},{"type":"md","text":"### Key points\n\n- `%d` int, `%u` unsigned int, `%zu` size_t, `%f` double, `%c` char, `%s` string, `%%` a literal `%`.\n- The conversion must match the argument's type; a mismatch is undefined behaviour. `-Wall` warns you.\n- Width = minimum characters, padded with spaces on the left (right-aligned); `-` left-aligns. Never truncates.\n- Precision for `%f` = digits after the point, rounded. `%f` alone means `%.6f`.\n- `%24.17f`: 17 digits after the point, whole thing at least 24 characters wide."}]},{"id":"c2-control","title":"Control flow and simple functions","notebook":"c/statements.ipynb","priority":"high","examNote":"On the handwritten exam you will write loops and small functions from scratch. Practise `for (int i = 0; i < n; i++)` until you can write it without thinking, and always put a helper function above `main`.","blocks":[{"type":"md","text":"C's `if`, `while` and `for` statements look exactly like Java's.\n\n### Comparisons and true/false\n\nThe comparison operators are `==` (equal), `!=` (not equal), `<`, `<=`, `>`, `>=`. In C a comparison gives\nthe `int` **1** if it is true and **0** if it is false (a `bool` type exists in `<stdbool.h>`; you will meet it later). In a condition,\n**0 means false and any other value means true**.\n\nThe **logical operators** combine conditions:\n\n- `a && b` (and): true only if both are true.\n- `a || b` (or): true if at least one is true.\n- `!a` (not): true if `a` is false.\n\n`&&` and `||` stop early (*short-circuit*): in `a && b`, if `a` is false then `b` is not evaluated at all."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int age = 20;\n    int has_ticket = 0;        // 0 means false\n    printf(\"%d\\n\", age >= 18);                  // true is 1\n    printf(\"%d\\n\", age >= 18 && has_ticket);    // both must be true\n    printf(\"%d\\n\", age >= 18 || has_ticket);    // at least one true\n    printf(\"%d\\n\", !has_ticket);                // not\n    if (age >= 13 && age <= 19) {\n        puts(\"teenager\");\n    } else {\n        puts(\"not a teenager\");\n    }\n    return 0;\n}","caption":"logic.c"},{"type":"code","code":"$ gcc -Wall -o logic logic.c\n$ ./logic\n1\n0\n1\n1\nnot a teenager"},{"type":"md","text":"### `if` / `else if` / `else`\n\nThe conditions are tested from top to bottom and **only the first true branch runs**. The final `else` runs if none\nwere true. A **block** is a group of statements inside braces `{ }`; it acts as one statement."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int val = -7;\n    int rem = val % 2;\n    if (rem == 0) {\n        puts(\"even\");\n    } else if (rem < 0) {\n        puts(\"odd and negative\");\n    } else {\n        puts(\"odd and positive\");\n    }\n    return 0;\n}","caption":"ifelse.c (from the course notebook, with val = -7)"},{"type":"code","code":"$ gcc -Wall -o ifelse ifelse.c\n$ ./ifelse\nodd and negative"},{"type":"pitfall","text":"`if (x = 5)` *assigns* 5 to `x` and is always true. Comparison is `==`. `gcc -Wall` warns: `suggest parentheses around assignment used as truth value`."},{"type":"pitfall","text":"Without braces, only the **one** next statement belongs to the `if`. Indentation means nothing to the compiler:\n\n```c\nif (x > 10)\n    printf(\"big\\n\");\n    printf(\"done\\n\");    // always runs\n```\n\n`gcc -Wall` warns `this 'if' clause does not guard...` (`-Wmisleading-indentation`). Always use braces."},{"type":"md","text":"### Loops, `++`, `--` and compound assignment\n\n- `while (condition) { body }` repeats the body as long as the condition is true. It tests *before* each pass.\n- `for (start; condition; step) { body }` puts the three parts of a counting loop on one line. A counter declared in\n  the `for`, like `int i`, exists only inside the loop.\n- `i++` adds 1 to `i`; `i--` subtracts 1.\n- `x += 5` means `x = x + 5`. Likewise `-=`, `*=`, `/=`, `%=`."},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int left = 3;\n    while (left > 0) {\n        printf(\"left = %d\\n\", left);\n        left--;                       // same as left = left - 1\n    }\n\n    for (int i = 0; i < 3; i++) {\n        printf(\"i = %d\\n\", i);\n    }\n\n    int power = 1;\n    for (int k = 1; k <= 5; k++) {\n        power *= 2;                   // same as power = power * 2\n    }\n    printf(\"2 to the 5 = %d\\n\", power);\n    return 0;\n}","caption":"loops.c"},{"type":"code","code":"$ gcc -Wall -o loops loops.c\n$ ./loops\nleft = 3\nleft = 2\nleft = 1\ni = 0\ni = 1\ni = 2\n2 to the 5 = 32"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    int x = 10;\n    x += 5;     // 15\n    x -= 3;     // 12\n    x *= 2;     // 24\n    x /= 5;     // 4 (int division)\n    x %= 3;     // 1\n    x++;        // 2\n    printf(\"x = %d\\n\", x);\n    return 0;\n}","caption":"assignops.c: trace it line by line; the comments show each new value."},{"type":"code","code":"$ gcc -Wall -o assignops assignops.c\n$ ./assignops\nx = 2"},{"type":"check","q":"How many times does `for (int i = 0; i < 5; i++)` run its body, and what values does `i` take?","a":"5 times: `i` is 0, 1, 2, 3, 4. When `i` becomes 5 the condition `i < 5` is false and the loop stops."},{"type":"md","text":"### Writing your own functions\n\nA function definition has a **return type**, a **name**, a **parameter list** in parentheses, and a body:\n\n```c\nint square(int x) {\n    return x * x;\n}\n```\n\n- **Parameters** (`int x`) are local variables that receive copies of the values passed in a **call** such as `square(6)`.\n- `return value;` ends the function and hands the value back to the caller. The value should match the return type.\n- A function that returns nothing has return type `void` and uses `return;` or just reaches the closing brace.\n- A function that takes no parameters says so with `void`, like `int main(void)`."},{"type":"code","code":"#include <stdio.h>\n\n// returns the square of x\nint square(int x) {\n    return x * x;\n}\n\n// returns the area of a w-by-h rectangle\ndouble area(double w, double h) {\n    return w * h;\n}\n\n// prints n stars and a newline; returns nothing\nvoid stars(int n) {\n    for (int i = 0; i < n; i++) {\n        printf(\"*\");\n    }\n    printf(\"\\n\");\n}\n\nint main(void) {\n    int s = square(6);\n    printf(\"square(6) = %d\\n\", s);\n    printf(\"square(2 + 1) = %d\\n\", square(2 + 1));\n    printf(\"area = %.1f\\n\", area(2.5, 4.0));\n    stars(5);\n    return 0;\n}","caption":"functions.c"},{"type":"code","code":"$ gcc -Wall -o functions functions.c\n$ ./functions\nsquare(6) = 36\nsquare(2 + 1) = 9\narea = 10.0\n*****"},{"type":"md","text":"### Declare before use\n\nThe compiler reads your file from top to bottom. When it reaches a call, it must already know the function's name,\nreturn type and parameters. The simplest rule: **put your functions above `main`**. If you call a function before\nit appears, gcc 13 warns (and newer gcc versions refuse to compile):"},{"type":"code","code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"%d\\n\", twice(4));   // twice is not declared yet\n    return 0;\n}\n\nint twice(int x) {\n    return 2 * x;\n}","caption":"implicit.c: the call comes before the function."},{"type":"code","code":"$ gcc -Wall -o implicit implicit.c\nimplicit.c:4:20: warning: implicit declaration of function ‘twice’ [-Wimplicit-function-declaration]\n    4 |     printf(\"%d\\n\", twice(4));   // twice is not declared yet\n      |                    ^~~~~"},{"type":"md","text":"The other fix is a **declaration** (also called a *prototype*): the function's first line followed by `;`, placed\nabove the call. It promises the function exists; the full **definition** can then come later."},{"type":"code","code":"#include <stdio.h>\n\nint twice(int x);   // declaration (prototype): promises twice exists\n\nint main(void) {\n    printf(\"%d\\n\", twice(4));\n    return 0;\n}\n\nint twice(int x) {  // definition\n    return 2 * x;\n}","caption":"prototype.c: compiles with no warnings."},{"type":"md","text":"### Parameters are copies\n\nC passes arguments **by value**: the function gets a copy. Changing a parameter does not change the caller's variable,\neven if they have the same name."},{"type":"code","code":"#include <stdio.h>\n\nvoid reset(int n) {\n    n = 0;                       // changes only the copy\n    printf(\"in reset: n = %d\\n\", n);\n}\n\nint main(void) {\n    int n = 5;\n    reset(n);\n    printf(\"in main:  n = %d\\n\", n);\n    return 0;\n}","caption":"byvalue.c"},{"type":"code","code":"$ gcc -Wall -o byvalue byvalue.c\n$ ./byvalue\nin reset: n = 0\nin main:  n = 5"},{"type":"why","q":"Why does `main` return `int` if no one calls it in our program?","a":"The shell calls it, in effect. The value `main` returns becomes the program's exit status, which you see with `echo $?` (Day 1). Your own functions work the same way: the caller receives the returned value."},{"type":"check","q":"Write the first line (the header) of a function `celsius` that takes a `double` temperature in Fahrenheit and returns a `double`.","a":"`double celsius(double f)`  (any parameter name is fine)."},{"type":"try","text":"Run `./cdrill.sh start 2` in `~/CISC220_current/c-app/drills` and do the labs. Then try `./cdrill.sh check 2`. Each lab uses `int main(void)` only."},{"type":"md","text":"### Key points\n\n- Comparisons give `1` (true) or `0` (false); in a condition, 0 is false, anything else true. `&&`, `||`, `!`.\n- `if` / `else if` / `else`: the first true branch runs, only that one. Use `==` to compare, and always use braces.\n- `while` tests before each pass; `for (int i = 0; i < n; i++)` counts; `i++`, `i--`, `+=`, `-=`, `*=`, `/=`, `%=`.\n- A function: return type, name, parameters, body with `return`. `void` means returns nothing (or takes nothing).\n- Declare before use: define helpers above `main`, or write a prototype `int twice(int x);` above the call.\n- Arguments are copied (pass by value)."}]}],"flashcards":[{"id":"c2-fc-01","topic":"c2-vars","front":"What is the difference between initialisation and assignment?","back":"Initialisation gives a value in the declaration (`int x = 1;`). Assignment stores a new value in an existing variable later (`x = 2;`)."},{"id":"c2-fc-02","topic":"c2-vars","front":"What is `size_t`?","back":"An unsigned integer type big enough to hold the size of any object; used for sizes, lengths and counts. Print it with `%zu`."},{"id":"c2-fc-03","topic":"c2-vars","front":"What does `const int max = 10;` mean?","back":"`max` is read-only: it must get its value when declared, and any later assignment to it is a compile error."},{"id":"c2-fc-04","topic":"c2-vars","front":"`7 / 2` and `-7 / 2` in C?","back":"`3` and `-3`. Integer division throws away the fraction (rounds toward zero)."},{"id":"c2-fc-05","topic":"c2-vars","front":"`7 % 3`, `-7 % 3`?","back":"`1` and `-1`. `%` is the remainder; it has the sign of the left operand. It works only on integers."},{"id":"c2-fc-06","topic":"c2-vars","front":"When is `/` floating-point division?","back":"When at least one operand is a `double` (e.g. `7.0 / 2` or `7 / 2.0`, both `3.5`)."},{"id":"c2-fc-07","topic":"c2-vars","front":"`int t = 9, n = 4;` `(double) t / n` vs `(double) (t / n)`?","back":"`2.25` (cast first, then double division) vs `2.0` (int division gives 2, then the cast)."},{"id":"c2-fc-08","topic":"c2-vars","front":"What happens with `int k = 3.99;`?","back":"`k` is `3`: converting a `double` to an `int` drops the fraction (no rounding)."},{"id":"c2-fc-09","topic":"c2-printf","front":"printf conversions for int, unsigned int, size_t, double, char, string?","back":"`%d`, `%u`, `%zu`, `%f`, `%c`, `%s`."},{"id":"c2-fc-10","topic":"c2-printf","front":"How do you print a literal `%` with printf?","back":"`%%` in the format string."},{"id":"c2-fc-11","topic":"c2-printf","front":"In `%8.2f`, what are 8 and 2?","back":"8 is the field width: at least 8 characters, padded with spaces on the left. 2 is the precision: 2 digits after the decimal point."},{"id":"c2-fc-12","topic":"c2-printf","front":"What does `printf(\"[%5d]\", 42)` print? And `[%-5d]`?","back":"`[   42]` (right-aligned) and `[42   ]` (left-aligned)."},{"id":"c2-fc-13","topic":"c2-printf","front":"What does `%f` alone print for 9.81?","back":"`9.810000`: the default precision is 6."},{"id":"c2-fc-14","topic":"c2-control","front":"What value does `3 < 5` have in C?","back":"The `int` `1`. A false comparison gives `0`. In a condition, 0 is false and any non-zero value is true."},{"id":"c2-fc-15","topic":"c2-control","front":"What does short-circuit mean for `&&` and `||`?","back":"Evaluation stops as soon as the answer is known: in `a && b`, `b` is skipped if `a` is false; in `a || b`, `b` is skipped if `a` is true."},{"id":"c2-fc-16","topic":"c2-control","front":"Why does a function have to appear above `main` (or be declared there)?","back":"The compiler reads top to bottom and must know a function's return type and parameters at the point of the call. Otherwise gcc warns about an implicit declaration (newer gcc: error)."},{"id":"c2-fc-17","topic":"c2-control","front":"What is a function prototype?","back":"A declaration: the header followed by a semicolon, e.g. `int twice(int x);`. It lets you call the function before its full definition."},{"id":"c2-fc-18","topic":"c2-control","front":"If a function changes its parameter, does the caller's variable change?","back":"No. C passes arguments by value: the parameter is a copy."}],"quiz":[{"id":"c2-q-01","topic":"c2-vars","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int a = 17;\n    int b = 5;\n    printf(\"%d %d\\n\", a / b, a % b);\n    printf(\"%f\\n\", a / 2.0);\n    return 0;\n}","answer":"3 2\n8.500000","explain":"17 / 5 is integer division: 3 (the 0.4 is thrown away). 17 % 5 is the remainder 2. `a / 2.0` has a double operand, so it is 8.5, printed by `%f` with 6 digits."},{"id":"c2-q-02","topic":"c2-vars","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int sum = 7;\n    int n = 2;\n    double x = sum / n;\n    double y = (double) sum / n;\n    printf(\"%.1f %.1f\\n\", x, y);\n    return 0;\n}","answer":"3.0 3.5","explain":"`sum / n` is 7 / 2 with ints, which is 3; storing it in a double gives 3.0. In `(double) sum / n` the cast happens first, so it is 7.0 / 2 = 3.5."},{"id":"c2-q-03","topic":"c2-vars","type":"mcq","q":"Which expression has the value `2.5`?","options":["`5 / 2`","`(double) (5 / 2)`","`5 / 2.0`","`5 % 2`"],"answer":2,"explain":"Only `5 / 2.0` has a double operand. `5 / 2` is 2, `(double) (5 / 2)` is 2.0, and `5 % 2` is 1."},{"id":"c2-q-04","topic":"c2-vars","type":"short","q":"A student writes `const int limit = 5;` and later `limit = 6;`. What happens when they compile with `gcc -Wall`?","answer":"It does not compile: gcc reports an error, assignment of read-only variable 'limit'.","explain":"`const` makes the variable read-only after its initialisation. This is a compile error, not just a warning."},{"id":"c2-q-05","topic":"c2-printf","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"[%4d]\\n\", 7);\n    printf(\"[%-4d]\\n\", 7);\n    printf(\"[%6.2f]\\n\", 3.14159);\n    printf(\"[%.1f]\\n\", 0.06);\n    return 0;\n}","answer":"[   7]\n[7   ]\n[  3.14]\n[0.1]","explain":"`%4d` pads 7 to 4 characters on the left; `%-4d` pads on the right. `%6.2f` rounds to 3.14 (4 characters) and adds 2 spaces. `%.1f` rounds 0.06 to 0.1."},{"id":"c2-q-06","topic":"c2-printf","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    char c = 'A';\n    printf(\"%c%c %d%%\\n\", c, 'b', 50);\n    return 0;\n}","answer":"Ab 50%","explain":"`%c` prints the character itself (`A`, then `b`), there is no space between the first two conversions, and `%%` prints one `%`."},{"id":"c2-q-07","topic":"c2-printf","type":"short","q":"`double r = 2.0 / 3.0;` Write the printf call that prints `r` with exactly 5 digits after the decimal point, right-aligned in a field at least 12 characters wide, followed by a newline.","answer":"`printf(\"%12.5f\\n\", r);`","explain":"Width 12 (minimum characters, padded on the left), precision 5 (digits after the point). It prints `     0.66667`."},{"id":"c2-q-08","topic":"c2-printf","type":"mcq","q":"`printf(\"[%3d]\\n\", 12345);` prints:","options":["`[123]`","`[345]`","`[12345]`","nothing; it is an error"],"answer":2,"explain":"The width is a minimum. A value that needs more characters is printed in full."},{"id":"c2-q-09","topic":"c2-control","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int total = 0;\n    for (int i = 1; i <= 4; i++) {\n        total += i * i;\n    }\n    printf(\"%d\\n\", total);\n    return 0;\n}","answer":"30","explain":"total adds 1*1 + 2*2 + 3*3 + 4*4 = 1 + 4 + 9 + 16 = 30. The loop stops when i becomes 5."},{"id":"c2-q-10","topic":"c2-control","type":"output","q":"What does this program print?","code":"#include <stdio.h>\n\nint main(void) {\n    int n = 20;\n    int steps = 0;\n    while (n > 1) {\n
