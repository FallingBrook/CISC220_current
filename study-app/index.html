":"`cd ../../notes` (a trailing `/` is fine; an absolute path earns 0 because the question asks for relative)"}],"topics":["paths"]},{"id":"mockA-1d","label":"D","marks":1,"prompt":"Suppose that the current working directory is `user1`. What single command would you use to copy all of the files in `notes` whose names end in `.txt` into the `scripts` directory?","solution":"```bash\ncp notes/*.txt scripts\n```\n\nThe glob expands to `notes/lec01.txt notes/lec02.txt`; with several sources, the last argument of `cp` must be a directory.","rubric":[{"marks":1,"item":"`cp` with the glob `notes/*.txt` and destination `scripts` (`notes/*` is wrong: it would also copy `todo.md`)"}],"topics":["files","globs"]},{"id":"mockA-1e","label":"E","marks":1,"prompt":"Suppose that the current working directory is `photos`. What single command would you use to list all of the files whose names end in `.jpg`, where each of the letters `j`, `p`, `g` may be uppercase or lowercase?","solution":"```bash\nls *.[jJ][pP][gG]\n```\n\nAlso accepted for this tree: `ls *.jpg *.JPG` (but it would miss a name like `x.Jpg`).","rubric":[{"marks":1,"item":"Uses bracket expressions (or an equivalent list of globs) that match both `img1.jpg` and `img2.JPG` but not `logo.png`"}],"topics":["globs","commands"]},{"id":"mockA-1f","label":"F","marks":1,"prompt":"Suppose that the current working directory is `user1`. What single command would you use to remove the directory `photos` and everything inside it?","solution":"```bash\nrm -r photos\n```\n\n`rmdir photos` fails because the directory is not empty.","rubric":[{"marks":1,"item":"`rm -r photos` (`-rf` also fine); `rmdir` earns 0"}],"topics":["files"]}]},{"id":"mockA-2","title":"Question 2","marks":6,"prompt":"**1 mark each, 6 marks total.** Parts B and C use the `scripts` directory from Question 1. Your answer to each part should be very brief.","parts":[{"id":"mockA-2a","label":"A","marks":1,"prompt":"The long listing of a regular file shows `2` in the hard-link column. What does this tell you about the file?","solution":"Two filenames (directory entries) map to the same inode, i.e. the same file data has two names. Removing one name leaves the data reachable through the other.","rubric":[{"marks":1,"item":"Two names / directory entries refer to the same inode (file)"}],"topics":["files"]},{"id":"mockA-2b","label":"B","marks":1,"prompt":"The current working directory is `scripts`. Using an **octal** value, what command sets the permissions of `backup.sh` to `rwxr-x--x`?","solution":"```bash\nchmod 751 backup.sh\n```\n\n`rwx` = 4+2+1 = 7, `r-x` = 4+1 = 5, `--x` = 1.","rubric":[{"marks":1,"item":"`chmod 751 backup.sh` (all three digits correct)"}],"topics":["permissions"]},{"id":"mockA-2c","label":"C","marks":1,"prompt":"The current working directory is `scripts`. Using **symbolic** permissions in a single `chmod` command, remove write permission for the group and others and add execute permission for the owner on every file whose name ends in `.sh`, leaving all other permissions unchanged.","solution":"```bash\nchmod u+x,go-w *.sh\n```\n\nUse `+`/`-` (not `=`) so the other permissions are left as they were. An octal value cannot do this because the files start with different permissions.","rubric":[{"marks":1,"item":"`u+x,go-w` (comma, no spaces) applied to `*.sh`; `=` or an octal value earns 0"}],"topics":["permissions","globs"]},{"id":"mockA-2d","label":"D","marks":1,"prompt":"The current working directory is `user1`. Show how to run `ls notes missing` so that its normal output is saved in `out.txt` and its error messages are saved in `err.txt`.","solution":"```bash\nls notes missing > out.txt 2> err.txt\n```","rubric":[{"marks":1,"item":"`>` (or `1>`) for standard output **and** `2>` for standard error, each to the right file"}],"topics":["streams"]},{"id":"mockA-2e","label":"E","marks":1,"prompt":"What exactly does the following command print?\n\n```bash\necho '$HOME is \"home\"'\n```","solution":"```text\n$HOME is \"home\"\n```\n\nInside single quotes every character is literal: no parameter expansion, and the double quotes are printed.","rubric":[{"marks":1,"item":"Exactly `$HOME is \"home\"` (not the home directory path, and the double quotes are kept)"}],"topics":["quoting"]},{"id":"mockA-2f","label":"F","marks":1,"prompt":"Using a brace expansion, write one short command that creates the 12 directories `week01`, `week02`, ..., `week12` in the current directory.","solution":"```bash\nmkdir week{01..12}\n```\n\nThe leading zero in `01` makes Bash pad every number to two digits.","rubric":[{"marks":1,"item":"`mkdir` with the sequence expression `{01..12}` (`{1..12}` gives `week1`..., earns 0)"}],"topics":["expansions","files"]}]},{"id":"mockA-3","title":"Question 3","marks":4,"prompt":"**2 marks each, 4 marks total.**","parts":[{"id":"mockA-3a","label":"A","marks":2,"prompt":"Recall that `${s##pattern}` removes the **longest** leading match of `pattern` from the value of `s`, and `${s%pattern}` removes the **shortest** trailing match.\n\nA variable `path` holds a pathname that contains at least one `/`, for example `/home/user1/notes/lec01.txt`. Using parameter expansions (no other commands except `echo`), print the filename part (`lec01.txt`) on one line and the directory part (`/home/user1/notes`) on the next line.","solution":"```bash\necho \"${path##*/}\"     # lec01.txt\necho \"${path%/*}\"      # /home/user1/notes\n```","rubric":[{"marks":1,"item":"`${path##*/}` for the filename (`#` alone removes only up to the first `/`: 0)"},{"marks":1,"item":"`${path%/*}` for the directory (`%%` would remove everything after the first `/`: 0)"}],"topics":["strings"]},{"id":"mockA-3b","label":"B","marks":2,"prompt":"The file `grades.csv` contains one line per student: student number, last name, and grade separated by commas, for example:\n\n```text\n3100025,Cade,78\n2999999,day,85\n3001111,Friese,91\n```\n\nWrite a **single pipeline** that extracts the last names, converts them to uppercase using `tr`, sorts them alphabetically, saves the sorted names in a file named `names.txt`, and prints the first 5 sorted names.","solution":"```bash\ncut -d, -f2 grades.csv | tr 'a-z' 'A-Z' | sort | tee names.txt | head -n 5\n```\n\n`tr '[:lower:]' '[:upper:]'` and `head -5` are also fine. `tee` must come after `sort` so the file holds the sorted names.","rubric":[{"marks":1,"item":"`cut -d, -f2` (comma delimiter, field 2) then `tr` lower→upper then `sort`, in that order"},{"marks":1,"item":"`tee names.txt` after `sort` and `head -n 5` at the end"}],"topics":["streams","tr"]}]},{"id":"mockA-4","title":"Question 4","marks":4,"prompt":"**4 marks.**","parts":[{"id":"mockA-4","label":"A","marks":4,"prompt":"Write a script named `mkscript.sh` that creates a new, empty Bash script. The script takes one command line argument *NAME*.\n\n1. If the number of command line arguments is not exactly 1, print `Usage: mkscript.sh name` to standard error and exit with status 1.\n2. If a file named *NAME*`.sh` already exists, print `mkscript.sh: `*NAME*`.sh already exists` to standard error and exit with status 2.\n3. Otherwise, create the file *NAME*`.sh` whose only line is `#!/bin/bash`, and set its permissions so that the owner can read, write and execute it and no one else has any permission.\n\nExample: `./mkscript.sh hello` creates `hello.sh` with permissions `rwx------`.","solution":"```bash\n#!/bin/bash\n\n# mkscript.sh: create an empty, executable Bash script named NAME.sh\n\nif (( $# != 1 )); then\n    echo \"Usage: mkscript.sh name\" >&2\n    exit 1\nfi\n\nfile=\"$1.sh\"\nif [[ -e $file ]]; then\n    echo \"mkscript.sh: $file already exists\" >&2\n    exit 2\nfi\n\necho '#!/bin/bash' > \"$file\"\nchmod 700 \"$file\"\n```\n\n`chmod u=rwx,go= \"$file\"` is equivalent to `chmod 700`. Single quotes around `#!/bin/bash` keep the `!` literal.","rubric":[{"marks":1,"item":"Argument count test (`(( $# != 1 ))` or `[[ $# -ne 1 ]]`) with the message sent to standard error (`>&2`) and `exit 1`"},{"marks":1,"item":"Existence test `[[ -e ... ]]` (or `-f`) on *NAME*`.sh` with the message to standard error and `exit 2`"},{"marks":1,"item":"Writes `#!/bin/bash` into `\"$1.sh\"` with `>`; the filename expansion is quoted"},{"marks":1,"item":"`chmod 700` (or `u=rwx,go=`) on the quoted filename"}],"topics":["scripts","conditionals","permissions","streams","quoting"]}]},{"id":"mockA-5","title":"Question 5","marks":10,"prompt":"**10 marks.**","parts":[{"id":"mockA-5","label":"A","marks":10,"prompt":"Instead of deleting files, we want a command that tidies files away into a hidden stash directory sorted by extension. Write a script named `stash.sh` that accepts one or more pathnames of files as command line arguments and, **for each argument**:\n\n1. If the argument is not the name of a regular file, prints `stash.sh: `*PATH*` is not a regular file` to standard error (where *PATH* is the argument) and goes on to the next argument.\n2. Finds the name of the directory *DIR* that the file is in. If the pathname contains no `/`, *DIR* is `.`.\n3. Finds the extension *EXT* of the filename: the part after the **last** `.` in the filename. If the filename contains no `.`, *EXT* is `other`.\n4. Creates the directory *DIR*`/.stash/`*EXT* (including `.stash` if needed); no error may be printed if it already exists.\n5. Sets the permissions of *DIR*`/.stash` so that the owner has all permissions and everyone else has none.\n6. Prints `stashing `*PATH*` in `*DIR*`/.stash/`*EXT*.\n7. Moves the file into *DIR*`/.stash/`*EXT*.\n\nIf no arguments are given, print `Usage: stash.sh file...` to standard error and exit with status 1. The script exits with status 2 if any argument was not a regular file, and 0 otherwise. Arguments may contain spaces.\n\nExamples:\n\n```text\n$ ./stash.sh notes/lec01.txt data.tar.gz\nstashing notes/lec01.txt in notes/.stash/txt\nstashing data.tar.gz in ./.stash/gz\n$ ./stash.sh /home/user1/Makefile\nstashing /home/user1/Makefile in /home/user1/.stash/other\n```\n\nHint: `${str%pattern}` removes the shortest trailing match of `pattern`; `${str##pattern}` removes the longest leading match.","solution":"```bash\n#!/bin/bash\n\n# stash.sh: move each file into DIR/.stash/EXT where DIR is the directory\n# containing the file and EXT is the file's extension\n\nif (( $# == 0 )); then\n    echo \"Usage: stash.sh file...\" >&2\n    exit 1\nfi\n\nstatus=0\nfor path in \"$@\"; do\n    # skip anything that is not a regular file\n    if [[ ! -f $path ]]; then\n        echo \"stash.sh: $path is not a regular file\" >&2\n        status=2\n        continue\n    fi\n\n    # directory that the file is in\n    if [[ $path == */* ]]; then\n        dir=${path%/*}\n    else\n        dir=.\n    fi\n\n    # extension of the filename (other if there is no .)\n    name=${path##*/}\n    if [[ $name == *.* ]]; then\n        ext=${name##*.}\n    else\n        ext=other\n    fi\n\n    mkdir -p \"$dir/.stash/$ext\"\n    chmod 700 \"$dir/.stash\"\n    echo \"stashing $path in $dir/.stash/$ext\"\n    mv \"$path\" \"$dir/.stash/$ext\"\ndone\nexit \"$status\"\n```\n\nWhy `##*.` and not `#*.`: for `data.tar.gz`, `${name#*.}` is `tar.gz` but the extension is the part after the **last** dot, `gz`. `[[ $path == */* ]]` is a pattern test (is there a `/` anywhere?). Without it, `${path%/*}` on `data.tar.gz` would return the whole name.","rubric":[{"marks":1,"item":"No-argument check: usage message to standard error and `exit 1`"},{"marks":1,"item":"`for path in \"$@\"` (quoted) over all arguments"},{"marks":1,"item":"`[[ ! -f $path ]]` test, message to standard error, and `continue`"},{"marks":1,"item":"Remembers that an error happened and exits with 2, otherwise 0"},{"marks":1,"item":"Directory part with `${path%/*}`"},{"marks":1,"item":"Uses `.` when the pathname has no `/` (e.g. `[[ $path == */* ]]`)"},{"marks":1,"item":"Extension with `${name##*.}` on the filename, and `other` when there is no `.`"},{"marks":1,"item":"`mkdir -p \"$dir/.stash/$ext\"` (the `-p` avoids the error and creates `.stash` too)"},{"marks":1,"item":"`chmod 700` (or `u=rwx,go=`) on `\"$dir/.stash\"`"},{"marks":1,"item":"Prints the message and runs `mv \"$path\" \"$dir/.stash/$ext\"`; every expansion is double quoted"}],"topics":["scripts","strings","loops","conditionals","files","permissions","quoting"]}]}]},{"id":"mockB","title":"Mock midterm B","minutes":50,"instructions":"This mock is **50 minutes** long. There are **4 questions** worth a total of **30 marks**. No aids are allowed. It follows the format of Quiz 2 (Bash parts only).\n\n- Short answers should be very brief.\n- Write functions as `name() { ... }`, use `[[ ]]` for tests and `(( ))` for arithmetic, and double quote your expansions.\n- Afterwards, type your answers into the Day 8 drills (`./drill.sh start 8`) to test them.","questions":[{"id":"mockB-1","title":"Question 1","marks":12,"prompt":"**1 mark each, 12 marks total.** Your answer to each part should be very brief.","parts":[{"id":"mockB-1a","label":"A","marks":1,"prompt":"What does the metacharacter `+` mean in a regular expression?","solution":"The preceding atom (character, bracket expression or subexpression) must appear **one or more** times.","rubric":[{"marks":1,"item":"One or more of the preceding element (atom)"}],"topics":["regex"]},{"id":"mockB-1b","label":"B","marks":1,"prompt":"Provide a regular expression that matches exactly the strings made of four uppercase English letters followed by exactly three digits (for example `CISC220`, but not `CISC1240` or `cisc220`).","solution":"```bash\n^[A-Z]{4}[0-9]{3}$\n```\n\n`^[[:upper:]]{4}[[:digit:]]{3}$` is also correct.","rubric":[{"marks":1,"item":"Both anchors `^` and `$`, `[A-Z]{4}` and `[0-9]{3}` (writing the classes out four and three times is fine)"}],"topics":["regex"]},{"id":"mockB-1c","label":"C","marks":1,"prompt":"Show how to create a Bash array `fruits` that contains the three values `red apple`, `green pear`, and `plum`.","solution":"```bash\nfruits=(\"red apple\" \"green pear\" \"plum\")\n```","rubric":[{"marks":1,"item":"Parentheses, no spaces around `=`, and the two values with spaces quoted"}],"topics":["arrays","quoting"]},{"id":"mockB-1d","label":"D","marks":1,"prompt":"Show how to append the value `kiwi` to the end of the array `fruits`.","solution":"```bash\nfruits+=(\"kiwi\")\n```\n\n`fruits[${#fruits[@]}]=kiwi` also works when the indexes are 0, 1, 2, ... with no gaps.","rubric":[{"marks":1,"item":"`fruits+=(kiwi)` (quotes optional here); `fruits+=kiwi` earns 0 because it appends to the string in element 0"}],"topics":["arrays"]},{"id":"mockB-1e","label":"E","marks":1,"prompt":"What is the difference between `\"${arr[@]}\"` and `\"${arr[*]}\"`?","solution":"`\"${arr[@]}\"` expands to each element as a **separate word** (`\"${arr[0]}\" \"${arr[1]}\" ...`). `\"${arr[*]}\"` expands to **one single string** with all the elements joined by spaces.","rubric":[{"marks":1,"item":"`@` gives one word per element; `*` gives one combined word"}],"topics":["arrays","quoting"]},{"id":"mockB-1f","label":"F","marks":1,"prompt":"A variable `f` stores the name of a file. Write a Bash `if` statement that prints the message `missing` to **standard error** if the file whose name is stored in `f` does not exist.","solution":"```bash\nif [[ ! -e $f ]]; then echo \"missing\" >&2; fi\n```","rubric":[{"marks":1,"item":"`[[ ! -e $f ]]` (spaces inside the brackets), `then`/`fi`, and `>&2` (or `1>&2`)"}],"topics":["conditionals","streams"]},{"id":"mockB-1g","label":"G","marks":1,"prompt":"What is the exit status of the command `(( 5 - 5 ))`?","solution":"`1`. The expression's value is 0, and `(( ))` sets exit status 1 when the expression equals 0 (false).","rubric":[{"marks":1,"item":"1"}],"topics":["arithmetic"]},{"id":"mockB-1h","label":"H","marks":1,"prompt":"Write a C-style `for` loop that prints the even numbers 0, 2, 4, ..., 10, one per line.","solution":"```bash\nfor (( i = 0; i <= 10; i += 2 )); do\n    echo \"$i\"\ndone\n```","rubric":[{"marks":1,"item":"`for (( init; condition; update ))` with `<= 10` and step 2, plus `do ... done`"}],"topics":["loops","arithmetic"]},{"id":"mockB-1i","label":"I","marks":1,"prompt":"What does writing `local x=5` inside a Bash function do?","solution":"It creates a variable `x` that exists only while the function runs (it is visible in that function and any function it calls). The caller's variable `x`, if any, is not changed.","rubric":[{"marks":1,"item":"The variable is limited to the function (and functions it calls) so the caller's variable is not changed"}],"topics":["functions"]},{"id":"mockB-1j","label":"J","marks":1,"prompt":"A Bash function can only `return` an exit status between 0 and 255. How can a function give a string result to its caller?","solution":"Print the string to standard output in the function and capture it with command substitution, e.g. `result=$(myfunc arg)`. (Assigning the result to a non-local variable that the caller reads also works, because of dynamic scoping.)","rubric":[{"marks":1,"item":"`echo` the result and use `$( )` command substitution (or set a global variable)"}],"topics":["functions","expansions"]},{"id":"mockB-1k","label":"K","marks":1,"prompt":"Using `tr`, print the value of the variable `s` with every digit deleted.","solution":"```bash\nprintf %s \"$s\" | tr -d '0-9'\n```\n\n`echo \"$s\" | tr -d '[:digit:]'` is also fine.","rubric":[{"marks":1,"item":"Sends `$s` to `tr` through a pipe and uses `tr -d` with the digits"}],"topics":["tr","streams"]},{"id":"mockB-1l","label":"L","marks":1,"prompt":"What does the following print?\n\n```bash\ns=banana.tar.gz\necho \"${s%%.*} ${s#*.}\"\n```","solution":"```text\nbanana tar.gz\n```\n\n`%%.*` removes the longest trailing part that starts with a dot (`.tar.gz`); `#*.` removes the shortest leading part that ends with a dot (`banana.`).","rubric":[{"marks":1,"item":"Exactly `banana tar.gz`"}],"topics":["strings"]}]},{"id":"mockB-2","title":"Question 2","marks":4,"prompt":"**2 marks each, 4 marks total.**","parts":[{"id":"mockB-2a","label":"A","marks":2,"prompt":"A variable `s` holds a string. Write an `if` statement that prints `S is a number` to standard output if `s` is made up only of digits (at least one), and otherwise prints `S is not a number` to standard error, where *S* is the value of `s`. Use a regular expression.","solution":"```bash\nif [[ $s =~ ^[0-9]+$ ]]; then\n    echo \"$s is a number\"\nelse\n    echo \"$s is not a number\" >&2\nfi\n```","rubric":[{"marks":1,"item":"`[[ $s =~ ^[0-9]+$ ]]` with both anchors and the regex **not** quoted"},{"marks":1,"item":"Correct `if/else/fi` with the second message sent to standard error"}],"topics":["regex","conditionals","streams"]},{"id":"mockB-2b","label":"B","marks":2,"prompt":"Inside a script, use a `for` loop over the command line arguments to compute the sum of all of the arguments (assume they are integers) and print it. With no arguments the script prints `0`.","solution":"```bash\nsum=0\nfor n in \"$@\"; do\n    (( sum += n ))\ndone\necho \"$sum\"\n```","rubric":[{"marks":1,"item":"`for n in \"$@\"` and `sum` initialised to 0"},{"marks":1,"item":"Arithmetic update (`(( sum += n ))` or `sum=$(( sum + n ))`) and prints the sum after the loop"}],"topics":["loops","arithmetic","variables"]}]},{"id":"mockB-3","title":"Question 3","marks":4,"prompt":"**4 marks.**","parts":[{"id":"mockB-3","label":"A","marks":4,"prompt":"Write a Bash function `count_char` that is called as `count_char` *CH* *STR*. It prints the number of times the single character *CH* appears in the string *STR*, and it **returns** exit status 0 if *CH* appears at least once and 1 otherwise. The function must not change any variables of its caller.\n\n```text\n$ count_char a banana; echo $?\n3\n0\n$ count_char z banana; echo $?\n0\n1\n```","solution":"```bash\n# countchar.sh: defines the function count_char (sourced, no shebang needed)\n\n# count_char ch str\n# prints the number of times the character ch appears in str;\n# returns 0 if ch appears at least once, 1 otherwise\ncount_char() {\n    local ch=$1\n    local str=$2\n    local count=0\n    local i\n    for (( i = 0; i < ${#str}; i++ )); do\n        if [[ ${str:i:1} == \"$ch\" ]]; then\n            (( count++ ))\n        fi\n    done\n    echo \"$count\"\n    if (( count > 0 )); then\n        return 0\n    else\n        return 1\n    fi\n}\n```\n\nThe right-hand side of `==` is quoted so that a character such as `*` is compared literally instead of being used as a pattern.","rubric":[{"marks":1,"item":"Loop over the indexes 0 to `${#str}`-1 (C-style `for` with `${#str}`)"},{"marks":1,"item":"Extracts one character with `${str:i:1}` and compares it to *CH* (right side quoted)"},{"marks":1,"item":"Counts matches and prints the count; variables declared `local`"},{"marks":1,"item":"`return 0` if the count is positive, `return 1` otherwise"}],"topics":["functions","strings","loops","arithmetic"]}]},{"id":"mockB-4","title":"Question 4","marks":10,"prompt":"**10 marks.**","parts":[{"id":"mockB-4","label":"A","marks":10,"prompt":"Complete the script `uniqrev.sh` below. It prints its command line arguments on a single line in **reverse order** with **repeated values removed** (keep the first occurrence of each value, counting from the left of the original arguments). Arguments may contain spaces or wildcard characters such as `*`.\n\n```text\n$ ./uniqrev.sh 3 1 3 2 1\n2 1 3\n$ ./uniqrev.sh \"a b\" c \"a b\"\nc a b\n$ ./uniqrev.sh\nUsage: uniqrev.sh value...        (on standard error, exit status 1)\n```\n\n```bash\n#!/bin/bash\n\n# returns 0 if $1 is an element of the array out, 1 otherwise\ncontains() {\n}\n\n# copies the elements of arr into the array out, skipping values already in out\ndedup() {\n}\n\n# reverses the order of the elements of out (swap elements; do not use another array)\nreverse() {\n}\n\n# if there are no command line arguments print the usage message and exit\n\narr=(\"$@\")\ndedup\nreverse\n\n# print the elements of out on a single line\n```\n\nImplement the three functions, the argument check, and the final print. No other error checking is required.","solution":"```bash\n#!/bin/bash\n\n# uniqrev.sh: prints the command line arguments in reverse order\n# with duplicates removed\n\n# returns 0 if $1 is an element of the array out, 1 otherwise\ncontains() {\n    local elem\n    for elem in \"${out[@]}\"; do\n        if [[ $elem == \"$1\" ]]; then\n            return 0\n        fi\n    done\n    return 1\n}\n\n# copies the elements of arr into out, skipping repeated values\ndedup() {\n    out=()\n    local elem\n    for elem in \"${arr[@]}\"; do\n        if ! contains \"$elem\"; then\n            out+=(\"$elem\")\n        fi\n    done\n}\n\n# reverses the order of the elements of out\nreverse() {\n    local n=${#out[@]}\n    local i tmp\n    for (( i = 0; i < n / 2; i++ )); do\n        tmp=${out[i]}\n        out[i]=${out[n - 1 - i]}\n        out[n - 1 - i]=$tmp\n    done\n}\n\nif (( $# == 0 )); then\n    echo \"Usage: uniqrev.sh value...\" >&2\n    exit 1\nfi\n\narr=(\"$@\")\ndedup\nreverse\necho \"${out[@]}\"\n```\n\nWhy the quotes matter: `for elem in ${out[@]}` (unquoted) splits `a b` into two words, so the duplicate `a b` is never found. `[[ $elem == $1 ]]` without quotes treats `$1` as a pattern, so `a*` would wrongly match `ab`.","rubric":[{"marks":1,"item":"`contains`: loops over `\"${out[@]}\"` (quoted)"},{"marks":1,"item":"`contains`: compares each element with `\"$1\"` (right side quoted) and `return 0` when found"},{"marks":1,"item":"`contains`: `return 1` after the loop"},{"marks":1,"item":"`dedup`: starts `out` empty (`out=()`) and loops over `\"${arr[@]}\"`"},{"marks":1,"item":"`dedup`: calls `contains` as an `if` condition (with `!`) and appends with `out+=(\"$elem\")`"},{"marks":1,"item":"`reverse`: gets the size with `${#out[@]}`"},{"marks":1,"item":"`reverse`: loop runs for `i < n / 2` only (looping to `n` reverses twice)"},{"marks":1,"item":"`reverse`: correct swap of `out[i]` and `out[n - 1 - i]` using a temporary variable"},{"marks":1,"item":"No-argument check `(( $# == 0 ))` with message to standard error and `exit 1`"},{"marks":1,"item":"Prints with `echo \"${out[@]}\"`; loop variables declared `local`"}],"topics":["arrays","functions","loops","conditionals","quoting","arithmetic"]}]}]}]},"sheet":{"sections":[{"title":"1. Filesystem, paths and commands","md":"- **Inode**: stores a file's metadata (type, owner, size, times, where the data is) but **not its name**.\n- **Directory**: a file whose contents map **filenames to inode numbers**. A regular file is an ordinary data file; directories are not regular files.\n- **Hard link**: a directory entry (name → inode). Every file has at least one. The number after the permissions in `ls -l` is the hard-link count.\n- Root directory: `/`. **Absolute** path starts at `/` (`/home/user1/notes`); **relative** path starts at the current working directory (`notes`, `../user2`).\n\n| Symbol | Meaning |\n|---|---|\n| `.` | current directory |\n| `..` | parent directory |\n| `~` | your home directory (`~user2` = user2's home) |\n| `cd` | (no argument) go home |\n| `cd -` | go back to the previous directory (prints it) |\n| `pwd` | print the absolute path of the working directory |\n\n**Command form**: `command -options arguments`. Options combine: `ls -s -h` = `ls -sh`. Long form: `--all`.\n\n| `ls` option | Meaning |\n|---|---|\n| `-a` | all files, including hidden (`.name`) and `.` `..` |\n| `-A` | like `-a` but not `.` and `..` |\n| `-d` | list a directory itself, not its contents |\n| `-l` | long listing |\n| `-1` | one name per line |\n| `-r` | reverse order |\n| `-t` | sort by modification time (newest first) |\n| `-S` | sort by size (largest first) |\n| `-s` / `-h` | size in blocks / human readable |\n| `-F` | add a symbol showing the file type |\n\nKinds of commands: built-in (`cd`, `pwd`), executable program (`ls`), alias, shell function. `type cmd` says which; `which cmd` gives the program's path. Help: `man ls`, `ls --help`, `help cd` (built-ins).\n\n**Lists of commands**: `a; b` runs both in order. `a && b` runs `b` only if `a` succeeds (exit status 0). `a || b` runs `b` only if `a` fails. `cmd &` runs in the background."},{"title":"2. Filename expansion (globs)","md":"An **unquoted** word containing `*`, `?` or `[` is replaced by the **alphabetically sorted** list of matching filenames. Globs do not match hidden files (leading `.`) unless the pattern starts with `.`.\n\n| Wildcard | Matches |\n|---|---|\n| `*` | any string, including the empty string |\n| `?` | exactly one character |\n| `[abc]` | one character from the set |\n| `[a-z]` `[0-9]` | one character in the range |\n| `[!abc]` | one character **not** in the set |\n| `[[:upper:]]` | one character in a POSIX class |\n\nPOSIX classes (only inside `[ ]`): `[:alpha:]` `[:digit:]` `[:alnum:]` `[:upper:]` `[:lower:]` `[:space:]` `[:blank:]` `[:punct:]`.\n\n```bash\nls *.txt                 # names ending in .txt\nls ???                   # names exactly 3 characters long\nls *.[pP][dD][fF]        # .pdf in any mix of case\nls */A1answers.txt       # that file in every subdirectory\nls -d */                 # just the subdirectories\ncp * ../backup           # every (non-hidden) file here\n```\n\nIf nothing matches, the pattern is left **as is** (e.g. `*.pdf` stays the literal string `*.pdf`). In a `for` loop guard with `[[ -e $f ]] || continue`."},{"title":"3. Quoting","md":"| Form | Effect |\n|---|---|\n| `\\c` | escape: the next character is literal (`file\\ name`) |\n| `'...'` | everything literal; no expansions at all; cannot contain `'` |\n| `\"...\"` | literal **except** `$` (parameter, `$( )`, `$(( ))`), backquote and `\\` |\n\nDouble quotes stop **word splitting**, **filename expansion**, tilde and brace expansion, but still allow `$var`, `$(cmd)`, `$((expr))`.\n\n```bash\nx=\"a   b\"\necho $x          # a b        (split into 2 words, joined by one space)\necho \"$x\"        # a   b\necho '$x'        # $x\necho \"*\"         # *          (no globbing)\n```\n\n**Always write `\"$var\"`, `\"$1\"`, `\"$@\"`, `\"${arr[@]}\"`** in scripts: a filename with a space otherwise becomes several arguments. Inside `[[ ]]` the left side does not need quotes (no word splitting there), but quote the right side of `==`/`!=` to compare literally."},{"title":"4. Files: create, move, copy, remove, link","md":"Any character except `/` and the null character can be in a filename. Names are case sensitive; a leading `.` means hidden. Avoid spaces and a leading `-`.\n\n| Command | Effect |\n|---|---|\n| `touch f1 f2` | create empty files (or update the timestamp) |\n| `mkdir d1 d2` | create directories |\n| `mkdir -p a/b/c` | create missing parents too; no error if it exists |\n| `mv old new` | rename (overwrites `new` if it exists) |\n| `mv f1 f2 dir` | move files into an existing directory |\n| `cp src dst` | copy a file |\n| `cp f1 f2 dir` | copy several files into a directory |\n| `cp -r dir1 dir2` | copy a directory and its contents |\n| `rm f1 f2` | remove files (permanent!) |\n| `rm -r dir` | remove a directory and everything inside |\n| `rmdir dir` | remove an **empty** directory |\n| `ln target name` | hard link: a second name for the same inode |\n| `ln -s target name` | symbolic link: a file that points to a name |\n| `cat f` | print a file's contents |\n\n`-i` (`mv -i`, `rm -i`, `cp -i`) asks before overwriting/removing. Removing one hard link only decreases the link count; the data is gone when the count reaches 0. A symbolic link breaks (dangles) if its target is renamed or removed."},{"title":"5. Permissions","md":"`ls -l` shows: type+permissions, hard links, owner, group, size, time, name.\n\n`-rwxr-x---` = type `-` (regular file; `d` directory, `l` symbolic link) then **user** `rwx`, **group** `r-x`, **other** `---`.\n\n| | Regular file | Directory |\n|---|---|---|\n| `r` | read contents | list names (with `x`) |\n| `w` | change contents | create/delete/rename files in it (with `x`) |\n| `x` | run as a program | enter it (`cd`) |\n\n**Octal**: r=4, w=2, x=1, one digit each for user, group, other.\n\n| Octal | Meaning | Octal | Meaning |\n|---|---|---|---|\n| 7 | `rwx` | 3 | `-wx` |\n| 6 | `rw-` | 2 | `-w-` |\n| 5 | `r-x` | 1 | `--x` |\n| 4 | `r--` | 0 | `---` |\n\n```bash\nchmod 750 hello.sh        # rwxr-x---\nchmod 644 notes.txt       # rw-r--r--\nchmod 700 .trash          # rwx------\n```\n\n**Symbolic**: who `u g o a` + operator `+` add, `-` remove, `=` set exactly + perms `r w x`. Separate with commas, no spaces.\n\n```bash\nchmod u+x script.sh       # add execute for the owner\nchmod go-w *.txt          # remove write for group and other\nchmod u=rw,go=r f         # rw-r--r--\nchmod u=rwx,go= dir       # rwx------  (empty = none)\nstat -c %a f              # prints the octal permissions, e.g. 644\n```"},{"title":"6. Streams, redirection, pipes and tee","md":"File descriptors: **0** standard input, **1** standard output, **2** standard error.\n\n| Syntax | Effect |\n|---|---|\n| `cmd > f` | stdout to `f` (create/overwrite); same as `1>` |\n| `cmd >> f` | append stdout to `f` |\n| `cmd 2> f` | stderr to `f` |\n| `cmd > out 2> err` | stdout and stderr to separate files |\n| `cmd > f 2>&1` | both to `f` (order matters: left to right) |\n| `cmd 2> /dev/null` | throw error messages away |\n| `echo \"msg\" >&2` | print a message **to standard error** |\n| `cmd < f` | stdin from file `f` |\n\n**Pipe** `a | b` sends the stdout of `a` to the stdin of `b`. **`tee f`** copies its input to the file `f` and to stdout, so it can sit in the middle of a pipeline.\n\n| Tool | Use |\n|---|---|\n| `sort` | sort lines (`-n` numeric, `-r` reverse) |\n| `uniq` | remove **adjacent** duplicate lines (`-d` only duplicates); sort first |\n| `wc -l` | count lines |\n| `cut -d, -f2` | field 2 using `,` as the delimiter (default delimiter is tab) |\n| `head -n 3` | first 3 lines |\n| `grep -E 're' f` | lines matching an extended regex (`-n` line numbers, `-i` ignore case) |\n\n```bash\ncut -f3 classlist | sort | tee snum | head -n 3\nls /bin /usr/bin | sort | uniq -d | wc -l\n```"},{"title":"7. tr: translate, delete, squeeze characters","md":"`tr` reads **standard input only** and writes standard output. To use it on a variable, pipe the value in.\n\n```bash\ny=$(printf %s \"$x\" | tr 'a-z' 'A-Z')     # to uppercase\necho \"$x\" | tr '[:lower:]' '[:upper:]'   # same with POSIX classes\necho \"$x\" | tr '.' '/'                   # every . becomes /\necho \"$x\" | tr -d '0-9'                  # delete all digits\necho \"$x\" | tr -s ' '                    # squeeze runs of spaces into one\necho \"$x\" | tr '[:digit:]' '[X*]'        # every digit becomes X\n```\n\n- Character *i* of `seq1` is replaced by character *i* of `seq2`; other characters pass through.\n- If `seq2` is shorter, GNU `tr` repeats its last character (`[c*]` is the portable way).\n- Duplicated characters in `seq1` give undefined results."},{"title":"8. Expansions","md":"Order the shell performs them: **1** brace, **2** tilde, **3** parameter, **4** command substitution and **5** arithmetic (left to right), **6** word splitting, **7** filename expansion.\n\n| Expansion | Example | Result |\n|---|---|---|\n| brace list | `echo f{a,b,c}.txt` | `fa.txt fb.txt fc.txt` |\n| brace sequence | `echo {1..5}` | `1 2 3 4 5` |\n| with step | `echo {10..20..5}` | `10 15 20` |\n| zero padded | `echo {08..10}` | `08 09 10` |\n| letters | `echo {a..e}` | `a b c d e` |\n| tilde | `echo ~` | `/home/user1` |\n| parameter | `echo \"$x\"` / `\"${x}\"` | value of `x` |\n| command substitution | `d=$(pwd)` | output of the command (trailing newlines removed) |\n| arithmetic | `echo $(( 2 * 5 ))` | `10` |\n\n- `mkdir {2023..2024}-{01..12}` makes 24 directories.\n- **Word splitting** happens on unquoted results, at the characters in `IFS` (default space, tab, newline). Several separators in a row count as one.\n- Change `IFS` temporarily to split on something else: `IFS=\",\"` then `for f in $str`, then restore it.\n- In an **assignment** `v=...` there is **no** brace expansion, **no** filename expansion and no word splitting; tilde, parameter, command and arithmetic expansion do happen. `x=*.txt` stores the literal `*.txt`."},{"title":"9. Scripts, variables and command line arguments","md":"```bash\n#!/bin/bash\n# a comment (from # to end of line; a quoted # is not a comment)\necho \"Hello, $1!\"\n```\n\nRun it: `chmod u+x hello.sh` then `./hello.sh Sam` (or `bash hello.sh Sam` without execute permission).\n\n| Parameter | Meaning |\n|---|---|\n| `$#` | number of command line arguments |\n| `$0` | pathname used to run the script |\n| `$1` ... `$9`, `${10}` | the arguments (braces needed from 10 on) |\n| `\"$@\"` | all arguments, each as a separate word (use this to loop) |\n| `\"$*\"` | all arguments as one string |\n| `$?` | exit status of the last command (0 = success, 1-255 = failure) |\n\n- `exit n` ends the script with status *n*; without it the status is that of the last command.\n- `shift` drops `$1` and moves `$2` to `$1` and so on (`$#` decreases).\n- **Assignment**: `name=value` with **no spaces** around `=`. Use the value with `$name` or `${name}`.\n- Values are strings; unset variables expand to the empty string (no error).\n- Concatenate by writing values next to each other: `str3=$str1$str2`, `out=\"${in}_.bak\"` (braces needed because `$in_` would be the variable `in_`).\n- Command output into a variable: `perm=$(stat -c %a \"$src\")`.\n- Usage check pattern:\n\n```bash\nif (( $# != 1 )); then\n    echo \"Usage: script.sh name\" >&2\n    exit 1\nfi\n```"},{"title":"10. Strings: parameter expansion","md":"Example values: `s=abcdefghij`, `f=dir/file.txt.zip`.\n\n| Expansion | Meaning | Example → result |\n|---|---|---|\n| `${#s}` | length | `10` |\n| `${s:2}` | from index 2 to the end | `cdefghij` |\n| `${s:3:4}` | 4 characters from index 3 | `defg` |\n| `${s: -3}` | last 3 (space before `-`) | `hij` |\n| `${s:1:-2}` | from 1 up to (not incl.) 2nd last | `bcdefgh` |\n| `${f#*.}` | remove **shortest** leading match | `txt.zip` |\n| `${f##*.}` | remove **longest** leading match | `zip` (extension) |\n| `${f##*/}` | ... up to the last `/` | `file.txt.zip` (filename) |\n| `${f%.*}` | remove **shortest** trailing match | `dir/file.txt` |\n| `${f%%.*}` | remove **longest** trailing match | `dir/file` |\n| `${f%/*}` | ... from the last `/` | `dir` (directory) |\n| `${s/b/X}` | replace first match | `aXcdefghij` |\n| `${s//[aeiou]/}` | replace all matches (here: delete vowels) | `bcdfghj` |\n| `${s^}` / `${s^^}` | uppercase first / all characters | `Abcdefghij` / `ABCDEFGHIJ` |\n| `${s,}` / `${s,,}` | lowercase first / all | |\n\nMemory aid: `#` is on the left of `$` on the keyboard (removes from the **front**), `%` is on the right (removes from the **back**). Doubling the symbol makes the match **longest**. The variable itself is not changed.\n\nCharacter at index *i*: `${s:i:1}`. Loop over characters: `for (( i = 0; i < ${#s}; i++ ))`.\n\n| Expansion | `str` unset | `str` empty | `str` set |\n|---|---|---|---|\n| `${str:-word}` | `word` | `word` | `$str` |\n| `${str:=word}` | `word`, assigns it | `word`, assigns it | `$str` |\n| `${str:+word}` | nothing | nothing | `word` |\n| `${str:?word}` | error, exit | error, exit | `$str` |\n\nWithout the `:` (e.g. `${str-word}`) only *unset* is tested, not empty."},{"title":"11. Arithmetic","md":"Integers only (no floating point). Operators as in Java/C: `+ - * / %`, `**` (power), `++ --`, `+= -= *= /=`, comparisons `< <= > >= == !=`, logic `&& || !`. Division truncates: `$(( 7 / 2 ))` is `3`.\n\n| Form | Use |\n|---|---|\n| `(( expr ))` | command: do arithmetic or test; `$` optional on variable names |\n| `$(( expr ))` | expansion: substitutes the value |\n\n```bash\n(( x = 1 + 2 ))           # x is 3\n(( count++ ))\nn=$(( ${#s} / 2 ))\necho \"$(( 2 ** 10 ))\"     # 1024\nif (( val % 2 == 0 )); then echo even; fi\n```\n\n- **Exit status of `(( ))`**: 0 (true) if the value is **non-zero**, 1 (false) if the value is **0**. So `(( 5 - 5 ))` has status 1.\n- Non-numeric, empty or unset variables count as 0 inside `(( ))`.\n- `$RANDOM`: a random integer 0 to 32767; `$(( RANDOM % n ))` gives 0 to n-1."},{"title":"12. Regular expressions","md":"Bash uses POSIX **extended** regexes with `=~` inside `[[ ]]`. The match succeeds if the pattern matches **any part** of the string, so anchor with `^...$` to match the whole string. **Do not quote the regex** (quoted parts are matched literally); storing it in a variable `re='...'` then `[[ $s =~ $re ]]` is safe.\n\n| Metacharacter | Meaning |\n|---|---|\n| `^` / `$` | start / end of the string (line) |\n| `.` | any single character |\n| `[abc]` `[a-z]` `[[:digit:]]` | one character from the set |\n| `[^abc]` | one character **not** in the set |\n| `( )` | subexpression (group) |\n| `*` | preceding atom **0 or more** times |\n| `+` | preceding atom **1 or more** times |\n| `?` | preceding atom **0 or 1** time |\n| `{m,n}` `{m}` `{m,}` | between m and n / exactly m / at least m times |\n\n- **Choice** `a|b` matches either side: `^(cat|dog)$` matches `cat` or `dog`.\n- An **atom** is one character, a bracket expression or a subexpression.\n- Metacharacters are literal inside `[ ]`: `^a[.]c$` matches `a.c`.\n- `^(19|20)[0-9][0-9]$` matches the years 1900 to 2099.\n\n| Regex | Matches |\n|---|---|\n| `^[0-9]+$` | unsigned integer |\n| `^[-+]?[0-9]+$` | signed or unsigned integer |\n| `^[a-z]+$` | one or more lowercase letters only |\n| `^[A-Z]{4}[0-9]{3}$` | `CISC220` |\n| `[[:space:]]` | contains whitespace |\n\n```bash\nif [[ $pw =~ [[:digit:]] ]]; then echo \"has a digit\"; fi\ngrep -E '^zip' file      # grep -E uses the same syntax on each line\n```\n\nDo not confuse with globs: in a regex `*` means \"repeat the previous atom\", in a glob `*` means \"any string\"."},{"title":"13. Conditions: [[ ]], if and logical operators","md":"```bash\nif [[ -f $file ]]; then\n    echo \"regular file\"\nelif [[ -d $file ]]; then\n    echo \"directory\"\nelse\n    echo \"something else\" >&2\nfi\n```\n\nSpaces are required inside `[[ ` and ` ]]`. `if` runs any command and tests its **exit status** (0 = true): `if cd \"$dir\" 2> /dev/null; then ...`. One line: `if [[ ! -r $f ]]; then echo \"not readable\"; fi`.\n\n| File test | True if |\n|---|---|\n| `-e f` | exists (any kind) |\n| `-f f` | is a regular file |\n| `-d f` | is a directory |\n| `-r f` / `-w f` / `-x f` | readable / writable / executable |\n| `-s f` | exists and size > 0 |\n| `f1 -nt f2` / `-ot` | newer / older than |\n\n| String test | True if |\n|---|---|\n| `-z $s` | empty |\n| `-n $s` or just `$s` | not empty |\n| `$a == $b` (or `=`) | equal; **unquoted** right side is a glob pattern (`$s == a*`) |\n| `$a != $b` | not equal |\n| `$a < $b` / `$a > $b` | before / after in dictionary order (strings, not numbers!) |\n| `$s =~ regex` | regex match |\n| `-v name` | variable `name` is set (no `$`) |\n\n| Integer test (in `[[ ]]`) | Same with `(( ))` |\n|---|---|\n| `-eq` `-ne` | `==` `!=` |\n| `-lt` `-le` | `<` `<=` |\n| `-gt` `-ge` | `>` `>=` |\n\n**Combine** (highest precedence first): `( expr )`, `! expr`, `expr1 && expr2`, `expr1 || expr2`. Examples: `[[ -f $f && -r $f ]]`, `(( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) ))`.\n\nPitfall: `[[ 100 < 2 ]]` is **true** (string comparison). Use `(( 100 < 2 ))` or `-lt` for numbers."},{"title":"14. Loops","md":"```bash\nfor arg in \"$@\"; do              # each command line argument\n    echo \"$arg\"\ndone\n\nfor f in *.txt; do               # each matching file\n    [[ -e $f ]] || continue      # skip if the glob matched nothing\n    mv \"$f\" \"${f%.txt}.md\"\ndone\n\nfor i in {1..5}; do echo \"$i\"; done\n\nfor (( i = 0; i < n; i++ )); do  # C-style\n    echo \"$i\"\ndone\n\nwhile (( $# > 0 )); do           # process arguments with shift\n    echo \"$1\"\n    shift\ndone\n\ncount=10\nuntil (( count < 0 )); do        # runs until the test succeeds\n    echo \"$count\"\n    (( count-- ))\ndone\n\nwhile read -r line; do           # read a file line by line\n    echo \"$line\"\ndone < \"$file\"\n\nwhile IFS=\",\" read -r num last first; do   # split each line on commas\n    echo \"$first $last\"\ndone < students.txt\n```\n\n- `while` repeats while the test command succeeds (status 0); `until` repeats while it fails.\n- `break` leaves the loop; `continue` skips to the next iteration.\n- `for x in $str` (unquoted) loops over the words of `str`.\n- Unquoted `$@` splits arguments that contain spaces: always write `\"$@\"`."},{"title":"15. Arrays","md":"| Syntax | Meaning |\n|---|---|\n| `arr=(1 2 3)` | create (elements separated by spaces) |\n| `arr=(\"a b\" c)` | quote elements that contain spaces |\n| `arr=(\"$@\")` | array of the command line arguments |\n| `arr[5]=x` | set element 5 (indexes may have gaps) |\n| `${arr[i]}` | element *i* (braces required; `i` needs no `$`) |\n| `$arr` | element 0 only (common mistake) |\n| `${#arr[@]}` | number of elements |\n| `\"${arr[@]}\"` | all elements, **one word each** (use this) |\n| `\"${arr[*]}\"` | all elements as **one string** |\n| `${!arr[@]}` | the list of indexes |\n| `arr+=(\"$x\")` | append one element |\n| `a+=(\"${b[@]}\")` | append all of `b` |\n| `declare -a arr` | declare an (empty) array |\n| `mapfile -t arr < f` | each line of `f` becomes an element |\n| `read -a arr` | split one input line into an array |\n\n```bash\nn=${#arr[@]}\nfor (( i = 0; i < n; i++ )); do\n    echo \"$i: ${arr[i]}\"\ndone\n\nfor elem in \"${arr[@]}\"; do echo \"$elem\"; done\n\ntmp=${arr[i]}                  # swap elements i and j\narr[i]=${arr[j]}\narr[j]=$tmp\n\necho \"${arr[@]}\"               # print all on one line\n```"},{"title":"16. Functions","md":"```bash\nmax2() {                       # course style: name() { ... }\n    if (( $1 >= $2 )); then\n        echo \"$1\"              # \"return\" a value by printing it\n    else\n        echo \"$2\"\n    fi\n}\nhi=$(max2 4 9)                 # capture it with command substitution\n\nis_int() {\n    [[ $1 =~ ^[-+]?[0-9]+$ ]]  # status of the last command is the function's status\n}\nif is_int \"$x\"; then echo \"integer\"; fi\n```\n\n- Called like a command: `max2 4 9` (no parentheses, no commas). Define a function **before** calling it.\n- Inside, `$1 $2 ... $# \"$@\"` are the **function's** arguments; the script's arguments come back after it returns.\n- `return n` ends the function with exit status *n* (0-255; 0 = success/true). Without `return` the status is that of the last command.\n- **Dynamic scoping**: variables are global by default; a function can read and change the caller's variables (this is one way to hand back results, e.g. set `idx` and let the caller read it).\n- `local x=5` makes `x` belong to the function (and functions it calls) so the caller's `x` is untouched. Always make loop counters local.\n- Syntax: a space or newline after `{` and a newline (or `;`) before `}`.\n- Sourcing a file of functions: `. ./lib.sh` (or `source ./lib.sh`).\n\n```bash\n# typical script layout for a long exam question\n#!/bin/bash\nhelper() {\n    local i\n    ...\n}\nif (( $# == 0 )); then\n    echo \"Usage: prog.sh args...\" >&2\n    exit 1\nfi\nstatus=0\nfor arg in \"$@\"; do\n    ...\ndone\nexit \"$status\"\n```"}]},"practice":{"papers":[{"sourceId":"m24","source":"Midterm 2024","note":"closest to your exam"},{"sourceId":"q23a","source":"Quiz 1, 2023","note":"with posted solutions"},{"sourceId":"q23b","source":"Quiz 2, 2023","note":"Bash parts only"},{"sourceId":"f16","source":"Final exam 2016","note":""},{"sourceId":"f15","source":"Final exam 2015","note":""},{"sourceId":"f14","source":"Final exam 2014","note":""}],"questions":[{"id":"m24-1a","source":"Midterm 2024, Q1A","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nA) What would the command `pwd` print when run in the directory `CISC352`?","answer":"`/home/user2/courses/CISC352`","grading":"`pwd` prints the absolute path, so it must start with `/`. Printing just `CISC352` or a relative path loses the mark.","rubric":[{"marks":1,"item":"`/home/user2/courses/CISC352`"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-1a-v","source":"Variant of Midterm 2024, Q1A","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nA) Suppose that the current working directory is `courses` belonging to `user1`. What would the command `pwd` print after running `cd ../../user2`?","answer":"`/home/user2`","grading":"From /home/user1/courses, `..` is /home/user1 and `../..` is /home, so `../../user2` is /home/user2. Must be absolute.","rubric":[{"marks":1,"item":"`/home/user2`"}],"variantOf":"m24-1a","sourceId":"m24"},{"id":"m24-1b","source":"Midterm 2024, Q1B","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nB) Suppose that the current working directory is `user1`. What command would you use to remove the file named `A1.pdf` from the directory `CISC220`?","answer":"```bash\nrm courses/CISC220/A1.pdf\n```","grading":"Accept the absolute path `/home/user1/courses/CISC220/A1.pdf` or `./courses/CISC220/A1.pdf`. Missing `courses/` is wrong (CISC220 is not directly in user1). `rmdir` is wrong; `rm -f`/`rm -i` are fine.","rubric":[{"marks":1,"item":"`rm` with a correct path to CISC220/A1.pdf"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-1b-v","source":"Variant of Midterm 2024, Q1B","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nB) Suppose that the current working directory is `home`. What single command would you use to remove the directory `CISC352`, including everything inside it?","answer":"```bash\nrm -r user2/courses/CISC352\n```","grading":"Needs `-r` (or `-rf`/`-R`) because the directory may be non-empty. `rmdir` only removes empty directories (wrong). Path must go through user2/courses.","rubric":[{"marks":1,"item":"`rm -r user2/courses/CISC352` (or absolute path)"}],"variantOf":"m24-1b","sourceId":"m24"},{"id":"m24-1c","source":"Midterm 2024, Q1C","kind":"short","marks":1,"topics":["paths","commands","globs"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nC) Suppose that the current working directory is `user1`. What single command would you use to list the non-hidden files in all the directories in the `courses` directory belonging to `user1`?","answer":"```bash\nls courses/*\n```","grading":"`ls courses/*` or `ls courses/*/` both list the contents of every subdirectory (there are more directories not shown, so naming CISC204 and CISC220 explicitly is NOT enough). No `-a` (hidden files not wanted). `ls courses` lists only the directory names (wrong). `ls -R courses` is acceptable.","rubric":[{"marks":1,"item":"`ls courses/*` (glob over all subdirectories, no -a)"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-1c-v","source":"Variant of Midterm 2024, Q1C","kind":"short","marks":1,"topics":["paths","commands","globs"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nC) Suppose that the current working directory is `home`. What single command would you use to list the non-hidden files in every `CISC204` directory (the ones belonging to `user1` and to `user2`)?","answer":"```bash\nls */courses/CISC204\n```","grading":"Accept `ls user1/courses/CISC204 user2/courses/CISC204` or absolute paths. No `-a`.","rubric":[{"marks":1,"item":"`ls */courses/CISC204` or both paths listed"}],"variantOf":"m24-1c","sourceId":"m24"},{"id":"m24-1d","source":"Midterm 2024, Q1D","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nD) Suppose that the current working directory is `CISC220`. What single command would you use to change to the directory `CISC204` belonging to `user1` using a relative path?","answer":"```bash\ncd ../CISC204\n```","grading":"Must be relative (no leading `/` or `~`). `cd ../../courses/CISC204` also works. `cd CISC204` is wrong (it is a sibling, not a child).","rubric":[{"marks":1,"item":"`cd ../CISC204`"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-1d-v","source":"Variant of Midterm 2024, Q1D","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nD) Suppose that the current working directory is `CISC352`. What single command would you use to change to the directory `CISC220` belonging to `user1` using a relative path?","answer":"```bash\ncd ../../../user1/courses/CISC220\n```","grading":"Three `..`: CISC352 → courses → user2 → home. Must be relative.","rubric":[{"marks":1,"item":"`cd ../../../user1/courses/CISC220`"}],"variantOf":"m24-1d","sourceId":"m24"},{"id":"m24-1e","source":"Midterm 2024, Q1E","kind":"short","marks":1,"topics":["paths","commands","globs"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nE) Suppose that the current user is one of `user1` or `user2` (but for the purposes of the question, you don't know which) and that they are in their `CISC204` directory. What command could they use to copy all the files in their `CISC204` directory into their home directory?","answer":"```bash\ncp * ~\n```","grading":"Because the user is unknown, the destination must not name user1 or user2: `~`, `~/`, `\"$HOME\"`, or the relative `../..` are all correct. `cp * /home/user1` loses the mark. `cp * ..` copies into courses (wrong).","rubric":[{"marks":1,"item":"`cp *` to `~` (or `$HOME` or `../..`), not a hard-coded user"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-1e-v","source":"Variant of Midterm 2024, Q1E","kind":"short","marks":1,"topics":["paths","commands","globs"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n/\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    |       └── more directories not shown\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nE) Suppose that the current user is one of `user1` or `user2` (you don't know which) and that they are in one of their course directories. What command could they use to copy all the files whose names end in `.pdf` from their home directory into the current working directory?","answer":"```bash\ncp ~/*.pdf .\n```","grading":"Source `~/*.pdf` (or `\"$HOME\"/*.pdf` or `../../*.pdf`), destination `.`. Forgetting the `.` destination is a common error (then cp has no target).","rubric":[{"marks":1,"item":"`cp ~/*.pdf .`"}],"variantOf":"m24-1e","sourceId":"m24"},{"id":"m24-2a","source":"Midterm 2024, Q2A","kind":"short","marks":1,"topics":["globs"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nA) Explain what filenames are matched by the expansion `[abc]?.sh`","answer":"Filenames exactly 5 characters long: the first character is `a`, `b`, or `c`; the second is any single character; and the name ends in `.sh` (e.g. `ax.sh`, `b1.sh`, `cc.sh`).","grading":"Needs all three parts: first char one of a/b/c, exactly one more character of any kind, then `.sh`. Treating `?` as the regex \"optional\" (so `a.sh` would match) is wrong; so is saying `?` means any number of characters.","rubric":[{"marks":1,"item":"First char a/b/c, then exactly one arbitrary char, then `.sh`"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-2a-v","source":"Variant of Midterm 2024, Q2A","kind":"short","marks":1,"topics":["globs"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nA) Explain what filenames are matched by the expansion `?[0-9]*.txt`","answer":"Non-hidden filenames whose first character is any character, whose second character is a digit, followed by zero or more of any characters, ending in `.txt` (e.g. `x7.txt`, `77.txt`, `a1b.txt`).","grading":"Must capture: any first char, a digit second, anything (including nothing) after, ending `.txt`. Saying \"starts with a digit\" is wrong (the digit is the second char).","rubric":[{"marks":1,"item":"Any char, then a digit, then anything, ending in `.txt`"}],"variantOf":"m24-2a","sourceId":"m24"},{"id":"m24-2b","source":"Midterm 2024, Q2B","kind":"short","marks":1,"topics":["expansions"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nB) What kind of expansion is used when you want to store the output of a command in a variable? If you don't remember the name of the expansion, then provide an example instead.","answer":"Command substitution, e.g.\n\n```bash\nnow=$(date)\n```","grading":"Either the name \"command substitution\" or a correct example (`x=$(cmd)` or backticks) earns the mark. \"Arithmetic expansion\" or `x=cmd` is wrong.","rubric":[{"marks":1,"item":"Command substitution (or a correct `$( )` example)"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-2b-v","source":"Variant of Midterm 2024, Q2B","kind":"short","marks":1,"topics":["expansions","arithmetic"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nB) What kind of expansion is `$(( 3 + 4 ))`, and what does it expand to?","answer":"Arithmetic expansion; it expands to `7`.","grading":"Both the name (arithmetic expansion) and the value 7 are needed. Calling it command substitution is wrong.","rubric":[{"marks":1,"item":"Arithmetic expansion, value 7"}],"variantOf":"m24-2b","sourceId":"m24"},{"id":"m24-2c","source":"Midterm 2024, Q2C","kind":"short","marks":1,"topics":["streams","commands"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nC) What is a `tee` used for?","answer":"`tee` reads standard input and copies it both to standard output and to one or more files. It is used in a pipeline to save the intermediate data to a file while still passing it on to the next command.","grading":"Key idea: splits the stream: writes to a file AND to standard output. \"Writes to a file\" alone is incomplete (that is just `>`).","rubric":[{"marks":1,"item":"Copies stdin to stdout and to a file (saves output mid-pipeline)"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-2c-v","source":"Variant of Midterm 2024, Q2C","kind":"short","marks":1,"topics":["streams"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nC) What does the pipe operator `|` do in a command such as `cmd1 | cmd2`?","answer":"It connects the standard output of `cmd1` to the standard input of `cmd2`.","grading":"Must mention stdout of the left command becoming stdin of the right command. \"Runs cmd2 after cmd1\" is wrong; \"or\" is wrong.","rubric":[{"marks":1,"item":"stdout of cmd1 becomes stdin of cmd2"}],"variantOf":"m24-2c","sourceId":"m24"},{"id":"m24-2d","source":"Midterm 2024, Q2D","kind":"short","marks":1,"topics":["conditionals","files"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nD) Suppose that the variable `f` stores the name of a file. Complete the following `if` statement so that the string `\"directory\"` is printed if `f` is the name of a directory.\n\n```bash\nif __________________________________\n    echo \"directory\"\nfi\n```","answer":"```bash\nif [[ -d $f ]]; then\n    echo \"directory\"\nfi\n```","grading":"The blank must contain both the test and `then`, since the skeleton has no `then` line: `[[ -d $f ]]; then` (or `[ -d \"$f\" ]; then`). Missing `; then` loses the mark. `-f` (regular file) or `-e` (exists) is wrong.","rubric":[{"marks":1,"item":"`[[ -d $f ]]; then`"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-2d-v","source":"Variant of Midterm 2024, Q2D","kind":"short","marks":1,"topics":["conditionals","files"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nD) Suppose that the variable `f` stores the name of a file. Complete the following `if` statement so that the string `\"writable\"` is printed if `f` is the name of a regular file that the user can write to.\n\n```bash\nif __________________________________\n    echo \"writable\"\nfi\n```","answer":"```bash\nif [[ -f $f && -w $f ]]; then\n    echo \"writable\"\nfi\n```","grading":"Needs both `-f` and `-w` combined with `&&` inside `[[ ]]` (or `[[ -f $f ]] && [[ -w $f ]]`), plus `; then`. `-a` inside `[[ ]]` is not the AND operator.","rubric":[{"marks":1,"item":"`[[ -f $f && -w $f ]]; then`"}],"variantOf":"m24-2d","sourceId":"m24"},{"id":"m24-2e","source":"Midterm 2024, Q2E","kind":"short","marks":1,"topics":["arrays"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nE) Suppose that you have an array variable `a`. Show how to print the length of the array stored in `a`.","answer":"```bash\necho \"${#a[@]}\"\n```","grading":"`${#a[@]}` or `${#a[*]}` with echo. `${#a}` is the length of element 0 (wrong). Must actually print (echo).","rubric":[{"marks":1,"item":"`echo ${#a[@]}`"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-2e-v","source":"Variant of Midterm 2024, Q2E","kind":"short","marks":1,"topics":["arrays","quoting"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nE) Suppose that you have an array variable `a`. Show how to print all of the elements of the array stored in `a` on a single line.","answer":"```bash\necho \"${a[@]}\"\n```","grading":"`echo \"${a[@]}\"` or `echo \"${a[*]}\"`. `echo $a` prints only element 0 (wrong); `echo ${a}` likewise.","rubric":[{"marks":1,"item":"`echo \"${a[@]}\"`"}],"variantOf":"m24-2e","sourceId":"m24"},{"id":"m24-2f","source":"Midterm 2024, Q2F","kind":"short","marks":1,"topics":["regex"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nF) Provide a regular expression that matches all strings that start and end with an uppercase `A`.","answer":"```\n^A(.*A)?$\n```\n\nThis matches `A` itself as well as `AA`, `AbcA`, `A A`, and so on.","grading":"Fully correct: `^A(.*A)?$` or `^A$|^A.*A$`. `^A.*A$` misses the one-character string `A`; the 2023 quiz solution treated that version as sufficient, so give the mark but point out the edge case. Missing anchors (`A.*A`) loses the mark (it matches any string containing two A's). Glob syntax `A*A` is wrong.","rubric":[{"marks":1,"item":"Anchored regex starting and ending with A (`^A(.*A)?$` or `^A.*A$`)"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-2f-v","source":"Variant of Midterm 2024, Q2F","kind":"short","marks":1,"topics":["regex"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nF) Provide a regular expression that matches all strings that start and end with a lowercase `x`.","answer":"```\n^x(.*x)?$\n```","grading":"Same as the original: `^x(.*x)?$` is exact (includes `x`); `^x.*x$` misses `x`; mention it but accept. Anchors required.","rubric":[{"marks":1,"item":"Anchored regex starting and ending with x"}],"variantOf":"m24-2f","sourceId":"m24"},{"id":"m24-2g","source":"Midterm 2024, Q2G","kind":"short","marks":1,"topics":["loops"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nG) Complete the missing parts of the following Bash loop so it outputs the letters `a`, `b`, and `c` on separate lines:\n\n```bash\n____________________ a b c __________\n\n\n\nfi\n```","answer":"```bash\nfor ch in a b c; do\n    echo \"$ch\"\ndone\n```\n\nFirst blank: `for ch in`. Second blank: `; do`. Body (in the gap): `echo \"$ch\"`. The loop ends with `done`.","grading":"The printed skeleton ends in `fi`, which is almost certainly a typo for `done` (a `for` loop ends with `done`; `fi` closes an `if`). Students should write `done` (or correct the `fi`); do NOT penalise either way for the typo. Essential: `for <var> in` before the list, `; do` after it, and `echo \"$var\"` in the body. Missing `do` or the echo loses the mark. `for ch in {a..c}` does not fit the given skeleton.","rubric":[{"marks":1,"item":"`for ch in` ... `; do echo \"$ch\"` (closing with done)"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-2g-v","source":"Variant of Midterm 2024, Q2G","kind":"short","marks":1,"topics":["loops","arithmetic"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nG) Complete the missing parts of the following Bash loop so it outputs the even numbers `0`, `2`, `4`, `6`, and `8` on separate lines:\n\n```bash\nfor (( ______________________________ )); do\n    echo \"$i\"\n__________\n```","answer":"```bash\nfor (( i = 0; i < 10; i += 2 )); do\n    echo \"$i\"\ndone\n```","grading":"Header `i = 0; i < 10; i += 2` (or `i <= 8`, `i = i + 2`); closing `done`. `i++` prints 0..9 (wrong); `fi` is wrong.","rubric":[{"marks":1,"item":"`i = 0; i < 10; i += 2` and `done`"}],"variantOf":"m24-2g","sourceId":"m24"},{"id":"m24-3","source":"Midterm 2024, Q3","kind":"long","marks":2,"topics":["streams","commands"],"prompt":"Question 3 (2 marks).\n\nThe `tabdate` command outputs the current time in the following format:\n\n```\nWed\tOct\t23\t12:54:59\tEDT\t2024\n```\n\nwhere each field of the output is separated from the next using a tab character.\n\nWrite a single pipeline that:\n\n- saves the month, day, and current time (2nd, 3rd, and 4th fields) to a file named `now.txt`, and\n- prints the current time to standard output","answer":"```bash\ntabdate | cut -f2-4 | tee now.txt | cut -f3\n```\n\nAfter the first `cut`, the time is the 3rd field of each line, so the second `cut` uses `-f3`.","grading":"`cut -f2-4` or `cut -f2,3,4` (tab is the default delimiter). The tee must come after the first cut so now.txt holds only fields 2-4. The final cut must be `-f3` (the time's position AFTER the first cut); `cut -f4` at the end is a common mistake (it prints an empty line because only 3 fields are left). `cut -d ' '` is wrong (tabs).","rubric":[{"marks":1,"item":"`tabdate | cut -f2-4 | tee now.txt`"},{"marks":1,"item":"Then `cut -f3` (time is now field 3) to print the time"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-3-v","source":"Variant of Midterm 2024, Q3","kind":"long","marks":2,"topics":["streams","commands"],"prompt":"Question 3 (2 marks).\n\nThe `tabdate` command outputs the current time in the following format:\n\n```\nWed\tOct\t23\t12:54:59\tEDT\t2024\n```\n\nwhere each field of the output is separated from the next using a tab character.\n\nWrite a single pipeline that:\n\n- saves the day of the week and the year (1st and 6th fields) to a file named `stamp.txt`, and\n- prints the year to standard output","answer":"```bash\ntabdate | cut -f1,6 | tee stamp.txt | cut -f2\n```","grading":"`cut -f1,6` (comma, not a range: `-f1-6` would keep everything). After that the year is field 2, so the final cut is `-f2`; `-f6` at the end is a common mistake.","rubric":[{"marks":1,"item":"`tabdate | cut -f1,6 | tee stamp.txt`"},{"marks":1,"item":"Then `cut -f2` to print the year"}],"variantOf":"m24-3","sourceId":"m24"},{"id":"m24-4","source":"Midterm 2024, Q4","kind":"long","marks":4,"topics":["scripts","permissions","commands","quoting","variables"],"prompt":"Question 4 (4 marks).\n\nWrite a complete Bash script that requires two input arguments where the first argument is a new\ndirectory name `d`, and the second argument is the name of an existing, readable, regular file `f`\nlocated in the same directory as the script.\n\nThe script creates the new directory `d` in the same directory as the script and moves the file `f`\ninto the newly created directory. It then changes the permissions of the file `f` by removing all\npermissions for all users who are not the owner of the file (you can assume that the owner is the\ncurrent user).\n\nNo error checking is required in this question. You can assume that two input arguments are\nalways given and that all required permissions are given.","answer":"```bash\n#!/bin/bash\n\nd=$1\nf=$2\n\n# directory that contains the script\nscriptdir=$(dirname \"$0\")\n\nmkdir \"$scriptdir/$d\"\nmv \"$scriptdir/$f\" \"$scriptdir/$d\"\nchmod go= \"$scriptdir/$d/$f\"        # or: chmod go-rwx ...\n```\n\nIf you assume the script is run from its own directory (the usual reading on the test), the simpler version is also full marks:\n\n```bash\n#!/bin/bash\n\nd=$1\nf=$2\n\nmkdir \"$d\"\nmv \"$f\" \"$d\"\nchmod go-rwx \"$d/$f\"\n```","grading":"Accept either version above; the simple one (assuming the current directory is the script's directory) is what most students write and should get full marks. `${0%/*}` for the script's directory is also fine. Essential: `mkdir \"$d\"`, `mv \"$f\" \"$d\"`, and chmod on the file at its NEW location `\"$d/$f\"`: `chmod go-rwx \"$f\"` after the move fails (file no longer there) and loses that mark. `go-rwx`, `go=`, or `g-rwx,o-rwx` are correct; `chmod 600`/`700` also change the owner's bits, which the question did not ask for: point this out, and deduct only if it clearly changes the owner's permissions in a wrong way. Variables holding file names should be quoted; unquoted expansions lose a mark. `cp` instead of `mv` loses the move mark.","rubric":[{"marks":1,"item":"`#!/bin/bash` and uses `$1` as d and `$2` as f"},{"marks":1,"item":"`mkdir \"$d\"` (in the script's directory)"},{"marks":1,"item":"`mv \"$f\" \"$d\"` moves the file into the new directory"},{"marks":1,"item":"`chmod go-rwx \"$d/$f\"` on the moved file, variables quoted"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-4-v","source":"Variant of Midterm 2024, Q4","kind":"long","marks":4,"topics":["scripts","permissions","commands","quoting","variables"],"prompt":"Question 4 (4 marks).\n\nWrite a complete Bash script that requires two input arguments where the first argument is the name of an\nexisting, readable, regular file `f` in the current working directory, and the second argument is a new\ndirectory name `d`.\n\nThe script creates the new directory `d` in the current working directory and copies the file `f` into the\nnewly created directory. It then changes the permissions of the copy so that the owner can read and write it,\nthe group can only read it, and other users have no permissions.\n\nNo error checking is required in this question. You can assume that two input arguments are always given and\nthat all required permissions are given.","answer":"```bash\n#!/bin/bash\n\nf=$1\nd=$2\n\nmkdir \"$d\"\ncp \"$f\" \"$d\"\nchmod u=rw,g=r,o= \"$d/$f\"           # or: chmod 640 \"$d/$f\"\n```","grading":"Note the argument order: file first, then directory. Copy (not move). chmod applies to the copy `\"$d/$f\"`, not the original. `640` or `u=rw,g=r,o=` both fine. Quote the variables.","rubric":[{"marks":1,"item":"`#!/bin/bash`, `$1` as f and `$2` as d"},{"marks":1,"item":"`mkdir \"$d\"`"},{"marks":1,"item":"`cp \"$f\" \"$d\"`"},{"marks":1,"item":"`chmod 640 \"$d/$f\"` on the copy, quoted"}],"variantOf":"m24-4","sourceId":"m24"},{"id":"m24-5","source":"Midterm 2024, Q5","kind":"long","marks":12,"topics":["scripts","functions","strings","arrays","loops","streams","conditionals"],"prompt":"Question 5 (12 marks).\n\nConsider a plain text file containing the names of students in a course, one name per line in no\nparticular order. An example of the contents of such a file is:\n\n```\nSimpson, Bart\nSimpson, Lisa\nWiggum, Ralph\n```\n\nNote that the names are always formatted as `lastname, firstname`.\n\nThe Bash command will read each line of a file named `fname` into an array `arr`:\n\n```bash\nreadarray -t arr < fname\n```\n\nFor example, if the sample file above is named `students.txt` then\n\n```bash\nreadarray -t arr < students.txt\n```\n\ncreates an array of size 3 where the elements are `\"Simpson, Bart\"`, `\"Simpson, Lisa\"`, and\n`\"Wiggum, Ralph\"`.\n\nWrite a script that performs the following steps:\n\n1. If the number of command line arguments is less than 1, then the script outputs an error\n   message to *standard error* and exits with a status of 1.\n\n2. If one or more command line arguments are given, then the first argument is interpreted\n   as the name of a file containing a list of student names as described above (and any\n   remaining arguments are ignored). Your script outputs the name of each student using\n   their first name, followed by a space, followed by their last name. For example, for the\n   file shown above your script should output (there is no space before the first name):\n\n```\nBart Simpson\nLisa Simpson\nRalph Wiggum\n```\n\nYou may assume that if a filename is provided to the script as an argument, then the file exists\nand is readable. Furthermore, every student has exactly one first name and one last name.\n\nYour script must implement and use the functions shown below. It is up to you to\ndecide how your functions receive their arguments and return their values.\n\nRecall that if `s` is a variable then `${s:offset:len}` expands to the substring of `s` starting at\nindex `offset` and having length `len`.\n\n```bash\nfunction index_of_comma {\n    # finds the index of the first comma in a specified string\n\n}\n\nfunction get_firstname {\n    # gets the first name of a student given their full name\n    #   e.g., \"Simpson, Bart\" has the first name \"Bart\"\n\n}\n\nfunction get_lastname {\n    # gets the last name of a student given their full name\n    #   e.g., \"Simpson, Bart\" has the last name \"Simpson\"\n\n}\n# the rest of your script starts here\n```","answer":"```bash\n#!/bin/bash\n\nindex_of_comma() {\n    # finds the index of the first comma in a specified string\n    # usage: index_of_comma str     prints the index (-1 if there is no comma)\n    local s=$1\n    local i\n    for (( i = 0; i < ${#s}; i++ )); do\n        if [[ ${s:i:1} == \",\" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}\n\nget_firstname() {\n    # gets the first name of a student given their full name\n    #   e.g., \"Simpson, Bart\" has the first name \"Bart\"\n    local name=$1\n    local idx\n    idx=$(index_of_comma \"$name\")\n    echo \"${name:idx+2}\"            # skip the comma and the space after it\n}\n\nget_lastname() {\n    # gets the last name of a student given their full name\n    #   e.g., \"Simpson, Bart\" has the last name \"Simpson\"\n    local name=$1\n    local idx\n    idx=$(index_of_comma \"$name\")\n    echo \"${name:0:idx}\"\n}\n\n# the rest of your script starts here\nif (( $# < 1 )); then\n    echo \"usage: $0 filename\" >&2\n    exit 1\nfi\n\nreadarray -t arr < \"$1\"\n\nfor student in \"${arr[@]}\"; do\n    first=$(get_firstname \"$student\")\n    last=$(get_lastname \"$student\")\n    echo \"$first $last\"\ndone\n```\n\nTested on the sample file: prints `Bart Simpson`, `Lisa Simpson`, `Ralph Wiggum`; extra arguments are ignored; with no arguments it prints the usage message to stderr and exits with status 1.","grading":"All three functions must be implemented AND used: get_firstname and get_lastname should call index_of_comma and use `${s:offset:len}`. Writing get_firstname as `${name#*, }` without using index_of_comma works but ignores the required design: deduct the index_of_comma 'used' marks. Keeping the printed `function name {` header style is fine. Returning values: echo + command substitution `x=$(f \"$arg\")` or global variables are both fine; `return <index>` is not acceptable for a value (exit status 0-255 only, and it is meant for success/failure). index_of_comma alternatives: a loop over `${s:i:1}`, or `local before=${s%%,*}; echo \"${#before}\"`. First name starts at index+2 (comma and space); `idx+1` leaves a leading space (the question says there must be no space before the first name) - deduct 1. Last name is `${name:0:idx}`. Error check: `(( $# < 1 ))` or `[[ $# -lt 1 ]]`; message must go to stderr (`>&2`) and `exit 1`: printing to stdout or exiting 0 loses those marks. Must read the file named by `$1` (not a hard-coded students.txt), e.g. `readarray -t arr < \"$1\"`, and loop with `\"${arr[@]}\"` (quoted, because each element contains a space; unquoted splits \"Simpson,\" and \"Bart\" into separate elements - deduct). Output format exactly `first last`.","rubric":[{"marks":1,"item":"Checks `$# < 1` and prints an error message to standard error (`>&2`)"},{"marks":1,"item":"Exits with status 1 in that case"},{"marks":3,"item":"index_of_comma correctly finds and returns (echo/global) the index of the first comma"},{"marks":2,"item":"get_firstname uses index_of_comma and `${name:idx+2}` (no leading space)"},{"marks":2,"item":"get_lastname uses index_of_comma and `${name:0:idx}`"},{"marks":1,"item":"Reads the file named by `$1` into an array with `readarray -t arr < \"$1\"`"},{"marks":1,"item":"Loops over every element with `\"${arr[@]}\"` (quoted)"},{"marks":1,"item":"Calls the functions and prints `first last` for each student"}],"variantOf":null,"sourceId":"m24"},{"id":"m24-5-v","source":"Variant of Midterm 2024, Q5","kind":"long","marks":12,"topics":["scripts","functions","strings","arrays","loops","streams","conditionals"],"prompt":"Question 5 (12 marks).\n\nConsider a plain text file containing the names of students in a course, one name per line in no\nparticular order. An example of the contents of such a file is:\n\n```\nBart Simpson\nLisa Simpson\nRalph Wiggum\n```\n\nNote that the names are always formatted as `firstname lastname` (separated by a single space).\n\nThe Bash command `readarray -t arr < fname` reads each line of a file named `fname` into an array `arr`.\n\nWrite a script that performs the following steps:\n\n1. If the number of command line arguments is not exactly 1, then the script outputs an error\n   message to *standard error* and exits with a status of 2.\n\n2. Otherwise the argument is the name of a file containing a list of student names as described above.\n   Your script outputs each student as their last name, a comma, a space, and the first letter of their\n   first name followed by a period. For the file shown above your script should output:\n\n```\nSimpson, B.\nSimpson, L.\nWiggum, R.\n```\n\nYou may assume that the file exists and is readable, and that every student has exactly one first name and\none last name.\n\nYour script must implement and use the functions shown below. It is up to you to decide how your functions\nreceive their arguments and return their values.\n\nRecall that if `s` is a variable then `${s:offset:len}` expands to th
