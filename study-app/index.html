; j=3 and j=4 change nothing. Output `0 1 2 3 4`.","rubric":[{"marks":1,"item":"`n` is set to `${#arr[@]}` before it is used"},{"marks":2,"item":"`sort` loops `j` from 0 to n-1 (C-style `for (( ))` or equivalent)"},{"marks":1,"item":"`sort` calls `minidx` with `j` and obtains the index (global variable or `$( )`)"},{"marks":2,"item":"Correct swap of `arr[j]` and `arr[idx]` using a temporary variable"},{"marks":2,"item":"`minidx` starts at its argument and loops to the end comparing `arr[i]` with the current minimum"},{"marks":1,"item":"`minidx` makes the minimum index available to the caller (sets a global or echoes it; not `return`)"},{"marks":1,"item":"Prints the sorted array on one line with `echo \"${arr[@]}\"`"}],"pitfalls":["Using `return $idx` to hand back the index: it is an exit status, limited to 0-255, and a non-zero status means failure.","Using the same global loop variable `i` in both functions, so `minidx` breaks `sort`'s loop. Declare loop variables `local`.","Writing `$arr[i]` instead of `${arr[i]}` outside `(( ))`.","Swapping without a temporary variable (`arr[j]=${arr[idx]}; arr[idx]=${arr[j]}` copies the same value twice)."]},{"id":"d6-w-02","topic":"d6-loops","stage":"faded","marks":6,"prompt":"*(Assignment 3 Q2.)* Write `chext.sh`.\n\n- `./chext.sh EXT` renames every file in the current directory whose name ends in `.EXT` so that the `.EXT` is removed (`report.txt` becomes `report`).\n- `./chext.sh SRC DST` changes the extension `.SRC` to `.DST` (`report.txt` becomes `report.md` for `./chext.sh txt md`).\n\nUse `mv` to rename. If no file has the extension, the script must print nothing and exit with status 0. Filenames may contain spaces. Fill in the blanks.","starter":"#!/bin/bash\n\nfor f in ____; do\n    # skip the literal pattern when nothing matches\n    [[ ____ ]] || continue\n    base=____\n    if (( ____ == 1 )); then\n        mv ____\n    else\n        mv \"$f\" ____\n    fi\ndone\nexit 0","solution":"#!/bin/bash\n\n# chext.sh EXT        removes the extension .EXT from every file in the cwd ending in .EXT\n# chext.sh SRC DST    changes the extension .SRC to .DST\n\nfor f in *.\"$1\"; do\n    # if nothing matches, the glob stays as the literal text *.EXT: skip it\n    [[ -e $f ]] || continue\n    base=${f%.*}\n    if (( $# == 1 )); then\n        mv \"$f\" \"$base\"\n    else\n        mv \"$f\" \"$base.$2\"\n    fi\ndone\nexit 0","explain":"`*.\"$1\"` is a glob for names ending in `.` plus the first argument (quoting `$1` keeps any special characters literal; the `*` stays unquoted so it still matches). If nothing matches, `f` is the literal pattern, which does not exist, so `[[ -e $f ]] || continue` skips it and the script ends with status 0 without an error from `mv`. `${f%.*}` removes the shortest trailing `.something` (Day 4), giving the name without its extension; `${f%.\"$1\"}` also works. `$#` tells us whether a second argument was given. Every `$f` and `$base` is quoted because filenames can contain spaces.","rubric":[{"marks":1,"item":"`for f in *.\"$1\"` (glob built from the argument)"},{"marks":1,"item":"Handles the no-match case (`[[ -e $f ]] || continue` or `shopt -s nullglob`)"},{"marks":1,"item":"Removes the extension with `${f%.*}` or `${f%.\"$1\"}`"},{"marks":1,"item":"Chooses the behaviour with `$#` (or tests whether `$2` is empty)"},{"marks":1,"item":"Correct `mv` for both cases (`\"$base\"` and `\"$base.$2\"`)"},{"marks":1,"item":"All filenames quoted (works with spaces)"}],"pitfalls":["Forgetting the no-match case: `mv: cannot stat '*.pdf'` and a non-zero exit status.","`mv $f $base` unquoted: breaks on `my notes.txt`.","Using `${f%%.*}`, which removes everything after the **first** dot (`a.b.txt` would become `a`)."]},{"id":"d6-w-03","topic":"d6-functions","stage":"faded","marks":8,"prompt":"*(Assignment 3 Q4.)* Write a file `funcs.sh` (no shebang; it is used with `source ./funcs.sh`) containing two functions.\n\n**`hasdups STR`**: find the first index `i` whose character appears again later in `STR`, and the first such later index `j`. Print `c:i = c:j` (where `c` is the character) and return 0. If no character repeats, print nothing and return 1. Examples: `hasdups abca` prints `a:0 = a:3`; `hasdups \"1 2 3\"` prints ` :1 =  :3` (the space repeats).\n\n**`indexof CH STR`**: print the index of the first `CH` in `STR` and return 0; if `CH` does not occur, print `-1` and return 1. Example: `indexof c abcabc` prints `2`.\n\nFill in the blanks.","starter":"hasdups() {\n    local s=$1\n    local n=____\n    local i j\n    for (( i = 0; i < n; i++ )); do\n        for (( j = ____; j < n; j++ )); do\n            if [[ ${s:i:1} == ____ ]]; then\n                echo \"____\"\n                return ____\n            fi\n        done\n    done\n    return ____\n}\n\nindexof() {\n    local ch=$1\n    local str=$2\n    local i\n    for (( i = 0; ____; i++ )); do\n        if [[ ____ == \"$ch\" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}","solution":"# funcs.sh -- a file of functions; use it with:  source ./funcs.sh\n\n# hasdups STR\n# prints \"c:i = c:j\" for the first character of STR that is repeated\n# (i is its first index, j the index of its next copy) and returns 0;\n# prints nothing and returns 1 if STR has no repeated characters\nhasdups() {\n    local s=$1\n    local n=${#s}\n    local i j\n    for (( i = 0; i < n; i++ )); do\n        for (( j = i + 1; j < n; j++ )); do\n            if [[ ${s:i:1} == \"${s:j:1}\" ]]; then\n                echo \"${s:i:1}:$i = ${s:j:1}:$j\"\n                return 0\n            fi\n        done\n    done\n    return 1\n}\n\n# indexof CH STR\n# prints the index of the first CH in STR and returns 0;\n# prints -1 and returns 1 if CH is not in STR\nindexof() {\n    local ch=$1\n    local str=$2\n    local i\n    for (( i = 0; i < ${#str}; i++ )); do\n        if [[ ${str:i:1} == \"$ch\" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}","explain":"`${#s}` is the string length and `${s:i:1}` is the single character at index `i`. For `hasdups`, the inner loop starts at `j = i + 1`, so each character is compared only with the characters **after** it; the first match found is exactly the required (first `i`, then first `j`). `return 0` inside the loops stops the function immediately (so only the first duplicate is printed); if the loops finish, there was no duplicate and the function returns 1.\n\nThe right-hand side of `==` inside `[[ ]]` is **quoted**: unquoted, it is a glob pattern, so a `*` character in the string would match anything. Quoted, it is compared literally.\n\nThe functions both **print** a result and **set** an exit status, so a caller can write `if hasdups \"$seq\"; then ...` or `i=$(indexof \"$c\" \"$seq\")`. All variables are `local` so the functions do not disturb the caller.","rubric":[{"marks":1,"item":"hasdups: outer loop over every index of the string using `${#s}`"},{"marks":1,"item":"hasdups: inner loop from `i + 1` to the end"},{"marks":1,"item":"Characters compared with `${s:i:1}` and `${s:j:1}` (right side quoted)"},{"marks":1,"item":"Prints `c:i = c:j` in the exact format"},{"marks":1,"item":"Returns 0 at the first duplicate, 1 when there is none"},{"marks":1,"item":"indexof: loop over the characters of `STR` comparing with `CH`"},{"marks":1,"item":"indexof: prints the index and returns 0 when found"},{"marks":1,"item":"indexof: prints -1 and returns 1 when not found; helper variables are local"}],"pitfalls":["Starting the inner loop at 0 (every character then matches itself).","Unquoted `${s:j:1}` on the right of `==`: a `*` in the string matches everything.","Using `exit` instead of `return`: the sourcing shell (or script) would end.","Printing every duplicate pair instead of returning after the first."]},{"id":"d6-w-04","topic":"d6-loops","stage":"faded","marks":5,"prompt":"Write `average.sh FILE`. Each line of `FILE` has the form `name,mark` (the mark is an integer), except comment lines that start with `#`. The script prints `average: N` where N is the integer average of the marks (use integer division). If the file has no marks, print `no marks`. The filename may contain spaces. Example: for the file\n\n```\n# name,mark\nAda,90\nBob,75\nCy,81\n```\n\nit prints `average: 82`. Fill in the blanks.","starter":"#!/bin/bash\n\ntotal=0\ncount=0\nwhile IFS=____ read -r ____; do\n    if [[ $name =~ ____ ]]; then\n        ____\n    fi\n    (( total += mark ))\n    (( count++ ))\ndone < ____\nif (( count == 0 )); then\n    echo \"no marks\"\nelse\n    echo \"average: ____\"\nfi","solution":"#!/bin/bash\n\n# average.sh FILE\ntotal=0\ncount=0\nwhile IFS=\",\" read -r name mark; do\n    if [[ $name =~ ^# ]]; then\n        continue\n    fi\n    (( total += mark ))\n    (( count++ ))\ndone < \"$1\"\nif (( count == 0 )); then\n    echo \"no marks\"\nelse\n    echo \"average: $(( total / count ))\"\nfi","explain":"`while IFS=\",\" read -r name mark` reads one line per pass and splits it at the comma into `name` and `mark`. Comment lines are recognized with the regex `^#` and skipped with `continue`. The redirection `< \"$1\"` after `done` feeds the file to the loop (quoted, because the name may contain spaces). `$(( total / count ))` is integer division: 246 / 3 = 82. Checking `count == 0` first avoids a division by zero.","rubric":[{"marks":1,"item":"`while IFS=\",\" read -r name mark` (or equivalent splitting)"},{"marks":1,"item":"Skips lines starting with `#` (`=~ ^#` and `continue`)"},{"marks":1,"item":"Accumulates the total and the count with arithmetic"},{"marks":1,"item":"Redirects the quoted filename into the loop: `done < \"$1\"`"},{"marks":1,"item":"Prints `average: N` with integer division, or `no marks`"}],"pitfalls":["`done < $1` unquoted: fails for `my marks.txt`.","Putting `< \"$1\"` after `read` instead of after `done` (reads the first line forever).","Dividing before checking for zero marks."]},{"id":"d6-w-05","topic":"d6-loops","stage":"blank","marks":8,"prompt":"*(Assignment 3 Q3.)* Write `checksubs.sh`. Its command line arguments are the names of files that every student directory should contain. For each immediate subdirectory of the current directory, if **any** of the expected files is missing from it or is not a regular file, print the subdirectory's name followed by `/` (for example `stu 3/`) to **standard error**, once per subdirectory. The script exits with status 1 if any subdirectory was reported, otherwise 0. With no arguments it prints nothing and exits with 0. Subdirectory names may contain spaces.\n\nExample: with subdirectories `stu1` (has `A1.sh`, `README`), `stu2` (has only `A1.sh`) and `stu 3` (has `README`, and `A1.sh` is a directory), `./checksubs.sh A1.sh README` prints `stu 3/` and `stu2/` to standard error and exits with 1.","starter":"","solution":"#!/bin/bash\n\n# checksubs.sh FILE...\n# prints (to stderr) the name of each subdirectory of the cwd that is missing\n# one of the FILEs as a regular file; exit status 1 if any were missing, else 0\n\nstatus=0\nfor d in */; do\n    [[ -d $d ]] || continue          # no subdirectories: */ did not match\n    for f in \"$@\"; do\n        if [[ ! -f $d$f ]]; then\n            echo \"$d\" >&2\n            status=1\n            break                    # report each directory only once\n        fi\n    done\ndone\nexit \"$status\"","explain":"The outer loop `for d in */` visits each subdirectory; the names already end with `/`, which is exactly what must be printed, and `$d$f` is the path of the expected file. The guard `[[ -d $d ]] || continue` handles a directory with no subdirectories (the literal `*/`). The inner loop `for f in \"$@\"` visits each expected file; with no arguments it runs zero times, so nothing is printed and the status stays 0. `-f` is true only for regular files, so a directory named `A1.sh` counts as missing. `break` stops checking that directory after its first problem so it is printed once. `>&2` sends the name to standard error. The variable `status` remembers whether anything was reported.","rubric":[{"marks":2,"item":"Outer loop over immediate subdirectories (`for d in */`)"},{"marks":1,"item":"Inner loop over `\"$@\"` (quoted)"},{"marks":1,"item":"Tests `-f` on `\"$d$f\"` (or `$d/$f`) correctly"},{"marks":1,"item":"Prints the directory name to standard error (`>&2`)"},{"marks":1,"item":"Prints each directory at most once (`break` or a flag)"},{"marks":2,"item":"Exit status 1 if any directory was reported, else 0 (including no arguments)"}],"pitfalls":["Testing `-e` instead of `-f` (a directory named like the file would pass).","Printing to standard output instead of standard error.","`for f in $@` unquoted, or unquoted `$d` in other commands: breaks on `stu 3`.","Calling `exit 1` at the first missing file, so later directories are never checked."]},{"id":"d6-w-06","topic":"d6-functions","stage":"blank","marks":6,"prompt":"Write `largest.sh INT...`, which prints `largest: N` where N is the largest of its (integer) command line arguments. The script must define a function `max` that **prints** the largest of the arguments it is given; the main script calls `max` with all of the script's arguments, captures its output with command substitution, and prints the message. With no arguments, print `Usage: largest.sh int...` to standard error and exit with status 1. No other error checking is needed.\n\nExample: `./largest.sh 3 9 -2 7` prints `largest: 9`.","starter":"","solution":"#!/bin/bash\n\n# largest.sh INT...   prints the largest integer argument\n\n# max INT... : prints the largest of its arguments\nmax() {\n    local hi=$1\n    local x\n    for x in \"$@\"; do\n        if (( x > hi )); then\n            hi=$x\n        fi\n    done\n    echo \"$hi\"\n}\n\nif (( $# == 0 )); then\n    echo \"Usage: largest.sh int...\" >&2\n    exit 1\nfi\nresult=$(max \"$@\")\necho \"largest: $result\"","explain":"`max` keeps the largest value seen so far in a local variable `hi`, starting with its first argument, and loops over all its arguments with `for x in \"$@\"`, comparing numerically with `(( ))`. It **prints** the result; the caller captures it with `result=$(max \"$@\")`. Passing `\"$@\"` is necessary: inside `max`, `$1`, `$@` are `max`'s own arguments, not the script's. The usage check comes first, using `$#` and `>&2`.","rubric":[{"marks":1,"item":"Usage message to standard error and `exit 1` when `$# == 0`"},{"marks":1,"item":"Function `max` defined with correct syntax before it is called"},{"marks":2,"item":"`max` loops over its arguments and keeps the largest (numeric comparison with `(( ))`)"},{"marks":1,"item":"`max` prints the result"},{"marks":1,"item":"Main script calls `max \"$@\"` with command substitution and prints `largest: N`"}],"pitfalls":["Calling `max` with no arguments and expecting it to see the script's `$1`.","Comparing with `[[ $x > $hi ]]`, which compares strings, not numbers (`9 > 10` would be true).","`return $hi` instead of `echo`: statuses are limited to 0-255 and negative numbers fail."]},{"id":"d6-w-07","topic":"d6-arrays","stage":"blank","marks":5,"prompt":"Write `rev.sh`, which stores its command line arguments in an array and then prints them in reverse order, one per line. An argument that contains spaces must be printed on one line. With no arguments it prints nothing.\n\nExample: `./rev.sh a \"b c\" d` prints `d`, `b c`, `a` on three lines.","starter":"","solution":"#!/bin/bash\n\n# rev.sh ARG...   prints the arguments in reverse order, one per line\n\narr=(\"$@\")\nfor (( i = ${#arr[@]} - 1; i >= 0; i-- )); do\n    echo \"${arr[i]}\"\ndone","explain":"`arr=(\"$@\")` copies the arguments, one element each, keeping `b c` whole. The last index is `${#arr[@]} - 1` (the array is not sparse, so the indexes are 0 to n-1). The C-style loop counts down to 0, and `echo \"${arr[i]}\"` prints each element. With no arguments, `i` starts at -1, the test `i >= 0` fails immediately and nothing is printed.","rubric":[{"marks":1,"item":"`arr=(\"$@\")`"},{"marks":1,"item":"Starts at the last index `${#arr[@]} - 1`"},{"marks":1,"item":"Loop counts down to index 0 inclusive"},{"marks":1,"item":"Prints `\"${arr[i]}\"` quoted, one per line"},{"marks":1,"item":"Works with no arguments (prints nothing, no error)"}],"pitfalls":["`arr=($@)` unquoted: `b c` becomes two elements.","Starting at `${#arr[@]}` (one past the end) or stopping at `i > 0` (misses index 0)."]},{"id":"d6-w-08","topic":"d6-loops","stage":"blank","marks":6,"prompt":"Write `extcount.sh EXT...`. For each command line argument `EXT`, in order, the script prints a line `EXT: N` where N is the number of names in the current directory that end in `.EXT`. Print `EXT: 0` when nothing matches. With no arguments the script prints nothing.\n\nExample: in a directory containing `a.txt`, `my notes.txt` and `b.md`, `./extcount.sh txt md pdf` prints\n\n```\ntxt: 2\nmd: 1\npdf: 0\n```","starter":"","solution":"#!/bin/bash\n\n# extcount.sh EXT...   for each EXT prints \"EXT: N\", N = number of names in the cwd ending in .EXT\n\nfor ext in \"$@\"; do\n    count=0\n    for f in *.\"$ext\"; do\n        if [[ -e $f ]]; then\n            (( count++ ))\n        fi\n    done\n    echo \"$ext: $count\"\ndone","explain":"The outer loop visits each argument with `\"$@\"`. For each one the counter is reset to 0, then the inner loop goes over the glob `*.\"$ext\"`. A glob that matches nothing stays as the literal pattern, so the body checks `[[ -e $f ]]` before counting; otherwise `pdf` would be counted as 1. `(( count++ ))` adds one. `my notes.txt` is counted once because glob results are never word-split.","rubric":[{"marks":1,"item":"Outer loop `for ext in \"$@\"`"},{"marks":1,"item":"Counter reset to 0 for each extension"},{"marks":1,"item":"Inner loop over the glob `*.\"$ext\"`"},{"marks":2,"item":"No-match case gives 0 (existence test or `nullglob`)"},{"marks":1,"item":"Prints `EXT: N` in the exact format"}],"pitfalls":["Forgetting to reset the counter, so counts accumulate across extensions.","Counting the literal pattern when nothing matches (prints `pdf: 1`).","Using `ls *.$ext | wc -l`: prints an error to standard error when nothing matches."]}]}],"mocks":{"exams":[{"id":"mockA","title":"Mock midterm A","minutes":50,"instructions":"This mock is **50 minutes** long. There are **5 questions** worth a total of **30 marks**. No aids are allowed. Write every answer by hand on paper first, then mark it with the rubric.\n\n- Short answers should be very brief (usually one command).\n- In scripts, double quote your variable expansions (`\"$var\"`): markers take marks off for missing quotes.\n- Error checking is required only where the question asks for it.\n- Afterwards, type your answers into the Day 7 drills (`./drill.sh start 7`) to test them.","questions":[{"id":"mockA-1","title":"Question 1","marks":6,"prompt":"**1 mark each, 6 marks total.** Consider a filesystem with the directory structure shown below (`trip` is a directory; `.draft` is a hidden file). Your answer to each part should be very brief.\n\n```text\n/\n└── home\n    └── user1\n        ├── grades.csv\n        ├── notes\n        │   ├── .draft\n        │   ├── lec01.txt\n        │   ├── lec02.txt\n        │   └── todo.md\n        ├── photos\n        │   ├── img1.jpg\n        │   ├── img2.JPG\n        │   ├── logo.png\n        │   └── trip\n        └── scripts\n            ├── backup.sh\n            ├── run.sh\n            └── tidy.sh\n```","parts":[{"id":"mockA-1a","label":"A","marks":1,"prompt":"What is the absolute pathname of the file `backup.sh`?","solution":"`/home/user1/scripts/backup.sh`","rubric":[{"marks":1,"item":"Starts at the root `/` and names every directory in order; no `.` or `..`"}],"topics":["paths"]},{"id":"mockA-1b","label":"B","marks":1,"prompt":"Suppose that the current working directory is `photos`. What is the relative pathname of the file `lec02.txt`?","solution":"`../notes/lec02.txt`","rubric":[{"marks":1,"item":"Goes up with `..` to `user1` and then down into `notes`; must not start with `/`"}],"topics":["paths"]},{"id":"mockA-1c","label":"C","marks":1,"prompt":"Suppose that the current working directory is `trip`. What single command would you use to change the current working directory to `notes` using a **relative** pathname?","solution":"```bash\ncd ../../notes\n```\n\n`trip` → `..` is `photos` → `../..` is `user1` → then into `notes`.","rubric":[{"marks":1,"item":"`cd ../../notes` (a trailing `/` is fine; an absolute path earns 0 because the question asks for relative)"}],"topics":["paths"]},{"id":"mockA-1d","label":"D","marks":1,"prompt":"Suppose that the current working directory is `user1`. What single command would you use to copy all of the files in `notes` whose names end in `.txt` into the `scripts` directory?","solution":"```bash\ncp notes/*.txt scripts\n```\n\nThe glob expands to `notes/lec01.txt notes/lec02.txt`; with several sources, the last argument of `cp` must be a directory.","rubric":[{"marks":1,"item":"`cp` with the glob `notes/*.txt` and destination `scripts` (`notes/*` is wrong: it would also copy `todo.md`)"}],"topics":["files","globs"]},{"id":"mockA-1e","label":"E","marks":1,"prompt":"Suppose that the current working directory is `photos`. What single command would you use to list all of the files whose names end in `.jpg`, where each of the letters `j`, `p`, `g` may be uppercase or lowercase?","solution":"```bash\nls *.[jJ][pP][gG]\n```\n\nAlso accepted for this tree: `ls *.jpg *.JPG` (but it would miss a name like `x.Jpg`).","rubric":[{"marks":1,"item":"Uses bracket expressions (or an equivalent list of globs) that match both `img1.jpg` and `img2.JPG` but not `logo.png`"}],"topics":["globs","commands"]},{"id":"mockA-1f","label":"F","marks":1,"prompt":"Suppose that the current working directory is `user1`. What single command would you use to remove the directory `photos` and everything inside it?","solution":"```bash\nrm -r photos\n```\n\n`rmdir photos` fails because the directory is not empty.","rubric":[{"marks":1,"item":"`rm -r photos` (`-rf` also fine); `rmdir` earns 0"}],"topics":["files"]}]},{"id":"mockA-2","title":"Question 2","marks":6,"prompt":"**1 mark each, 6 marks total.** Parts B and C use the `scripts` directory from Question 1. Your answer to each part should be very brief.","parts":[{"id":"mockA-2a","label":"A","marks":1,"prompt":"The long listing of a regular file shows `2` in the hard-link column. What does this tell you about the file?","solution":"Two filenames (directory entries) map to the same inode, i.e. the same file data has two names. Removing one name leaves the data reachable through the other.","rubric":[{"marks":1,"item":"Two names / directory entries refer to the same inode (file)"}],"topics":["files"]},{"id":"mockA-2b","label":"B","marks":1,"prompt":"The current working directory is `scripts`. Using an **octal** value, what command sets the permissions of `backup.sh` to `rwxr-x--x`?","solution":"```bash\nchmod 751 backup.sh\n```\n\n`rwx` = 4+2+1 = 7, `r-x` = 4+1 = 5, `--x` = 1.","rubric":[{"marks":1,"item":"`chmod 751 backup.sh` (all three digits correct)"}],"topics":["permissions"]},{"id":"mockA-2c","label":"C","marks":1,"prompt":"The current working directory is `scripts`. Using **symbolic** permissions in a single `chmod` command, remove write permission for the group and others and add execute permission for the owner on every file whose name ends in `.sh`, leaving all other permissions unchanged.","solution":"```bash\nchmod u+x,go-w *.sh\n```\n\nUse `+`/`-` (not `=`) so the other permissions are left as they were. An octal value cannot do this because the files start with different permissions.","rubric":[{"marks":1,"item":"`u+x,go-w` (comma, no spaces) applied to `*.sh`; `=` or an octal value earns 0"}],"topics":["permissions","globs"]},{"id":"mockA-2d","label":"D","marks":1,"prompt":"The current working directory is `user1`. Show how to run `ls notes missing` so that its normal output is saved in `out.txt` and its error messages are saved in `err.txt`.","solution":"```bash\nls notes missing > out.txt 2> err.txt\n```","rubric":[{"marks":1,"item":"`>` (or `1>`) for standard output **and** `2>` for standard error, each to the right file"}],"topics":["streams"]},{"id":"mockA-2e","label":"E","marks":1,"prompt":"What exactly does the following command print?\n\n```bash\necho '$HOME is \"home\"'\n```","solution":"```text\n$HOME is \"home\"\n```\n\nInside single quotes every character is literal: no parameter expansion, and the double quotes are printed.","rubric":[{"marks":1,"item":"Exactly `$HOME is \"home\"` (not the home directory path, and the double quotes are kept)"}],"topics":["quoting"]},{"id":"mockA-2f","label":"F","marks":1,"prompt":"Using a brace expansion, write one short command that creates the 12 directories `week01`, `week02`, ..., `week12` in the current directory.","solution":"```bash\nmkdir week{01..12}\n```\n\nThe leading zero in `01` makes Bash pad every number to two digits.","rubric":[{"marks":1,"item":"`mkdir` with the sequence expression `{01..12}` (`{1..12}` gives `week1`..., earns 0)"}],"topics":["expansions","files"]}]},{"id":"mockA-3","title":"Question 3","marks":4,"prompt":"**2 marks each, 4 marks total.**","parts":[{"id":"mockA-3a","label":"A","marks":2,"prompt":"Recall that `${s##pattern}` removes the **longest** leading match of `pattern` from the value of `s`, and `${s%pattern}` removes the **shortest** trailing match.\n\nA variable `path` holds a pathname that contains at least one `/`, for example `/home/user1/notes/lec01.txt`. Using parameter expansions (no other commands except `echo`), print the filename part (`lec01.txt`) on one line and the directory part (`/home/user1/notes`) on the next line.","solution":"```bash\necho \"${path##*/}\"     # lec01.txt\necho \"${path%/*}\"      # /home/user1/notes\n```","rubric":[{"marks":1,"item":"`${path##*/}` for the filename (`#` alone removes only up to the first `/`: 0)"},{"marks":1,"item":"`${path%/*}` for the directory (`%%` would remove everything after the first `/`: 0)"}],"topics":["strings"]},{"id":"mockA-3b","label":"B","marks":2,"prompt":"The file `grades.csv` contains one line per student: student number, last name, and grade separated by commas, for example:\n\n```text\n3100025,Cade,78\n2999999,day,85\n3001111,Friese,91\n```\n\nWrite a **single pipeline** that extracts the last names, converts them to uppercase using `tr`, sorts them alphabetically, saves the sorted names in a file named `names.txt`, and prints the first 5 sorted names.","solution":"```bash\ncut -d, -f2 grades.csv | tr 'a-z' 'A-Z' | sort | tee names.txt | head -n 5\n```\n\n`tr '[:lower:]' '[:upper:]'` and `head -5` are also fine. `tee` must come after `sort` so the file holds the sorted names.","rubric":[{"marks":1,"item":"`cut -d, -f2` (comma delimiter, field 2) then `tr` lower→upper then `sort`, in that order"},{"marks":1,"item":"`tee names.txt` after `sort` and `head -n 5` at the end"}],"topics":["streams","tr"]}]},{"id":"mockA-4","title":"Question 4","marks":4,"prompt":"**4 marks.**","parts":[{"id":"mockA-4","label":"A","marks":4,"prompt":"Write a script named `mkscript.sh` that creates a new, empty Bash script. The script takes one command line argument *NAME*.\n\n1. If the number of command line arguments is not exactly 1, print `Usage: mkscript.sh name` to standard error and exit with status 1.\n2. If a file named *NAME*`.sh` already exists, print `mkscript.sh: `*NAME*`.sh already exists` to standard error and exit with status 2.\n3. Otherwise, create the file *NAME*`.sh` whose only line is `#!/bin/bash`, and set its permissions so that the owner can read, write and execute it and no one else has any permission.\n\nExample: `./mkscript.sh hello` creates `hello.sh` with permissions `rwx------`.","solution":"```bash\n#!/bin/bash\n\n# mkscript.sh: create an empty, executable Bash script named NAME.sh\n\nif (( $# != 1 )); then\n    echo \"Usage: mkscript.sh name\" >&2\n    exit 1\nfi\n\nfile=\"$1.sh\"\nif [[ -e $file ]]; then\n    echo \"mkscript.sh: $file already exists\" >&2\n    exit 2\nfi\n\necho '#!/bin/bash' > \"$file\"\nchmod 700 \"$file\"\n```\n\n`chmod u=rwx,go= \"$file\"` is equivalent to `chmod 700`. Single quotes around `#!/bin/bash` keep the `!` literal.","rubric":[{"marks":1,"item":"Argument count test (`(( $# != 1 ))` or `[[ $# -ne 1 ]]`) with the message sent to standard error (`>&2`) and `exit 1`"},{"marks":1,"item":"Existence test `[[ -e ... ]]` (or `-f`) on *NAME*`.sh` with the message to standard error and `exit 2`"},{"marks":1,"item":"Writes `#!/bin/bash` into `\"$1.sh\"` with `>`; the filename expansion is quoted"},{"marks":1,"item":"`chmod 700` (or `u=rwx,go=`) on the quoted filename"}],"topics":["scripts","conditionals","permissions","streams","quoting"]}]},{"id":"mockA-5","title":"Question 5","marks":10,"prompt":"**10 marks.**","parts":[{"id":"mockA-5","label":"A","marks":10,"prompt":"Instead of deleting files, we want a command that tidies files away into a hidden stash directory sorted by extension. Write a script named `stash.sh` that accepts one or more pathnames of files as command line arguments and, **for each argument**:\n\n1. If the argument is not the name of a regular file, prints `stash.sh: `*PATH*` is not a regular file` to standard error (where *PATH* is the argument) and goes on to the next argument.\n2. Finds the name of the directory *DIR* that the file is in. If the pathname contains no `/`, *DIR* is `.`.\n3. Finds the extension *EXT* of the filename: the part after the **last** `.` in the filename. If the filename contains no `.`, *EXT* is `other`.\n4. Creates the directory *DIR*`/.stash/`*EXT* (including `.stash` if needed); no error may be printed if it already exists.\n5. Sets the permissions of *DIR*`/.stash` so that the owner has all permissions and everyone else has none.\n6. Prints `stashing `*PATH*` in `*DIR*`/.stash/`*EXT*.\n7. Moves the file into *DIR*`/.stash/`*EXT*.\n\nIf no arguments are given, print `Usage: stash.sh file...` to standard error and exit with status 1. The script exits with status 2 if any argument was not a regular file, and 0 otherwise. Arguments may contain spaces.\n\nExamples:\n\n```text\n$ ./stash.sh notes/lec01.txt data.tar.gz\nstashing notes/lec01.txt in notes/.stash/txt\nstashing data.tar.gz in ./.stash/gz\n$ ./stash.sh /home/user1/Makefile\nstashing /home/user1/Makefile in /home/user1/.stash/other\n```\n\nHint: `${str%pattern}` removes the shortest trailing match of `pattern`; `${str##pattern}` removes the longest leading match.","solution":"```bash\n#!/bin/bash\n\n# stash.sh: move each file into DIR/.stash/EXT where DIR is the directory\n# containing the file and EXT is the file's extension\n\nif (( $# == 0 )); then\n    echo \"Usage: stash.sh file...\" >&2\n    exit 1\nfi\n\nstatus=0\nfor path in \"$@\"; do\n    # skip anything that is not a regular file\n    if [[ ! -f $path ]]; then\n        echo \"stash.sh: $path is not a regular file\" >&2\n        status=2\n        continue\n    fi\n\n    # directory that the file is in\n    if [[ $path == */* ]]; then\n        dir=${path%/*}\n    else\n        dir=.\n    fi\n\n    # extension of the filename (other if there is no .)\n    name=${path##*/}\n    if [[ $name == *.* ]]; then\n        ext=${name##*.}\n    else\n        ext=other\n    fi\n\n    mkdir -p \"$dir/.stash/$ext\"\n    chmod 700 \"$dir/.stash\"\n    echo \"stashing $path in $dir/.stash/$ext\"\n    mv \"$path\" \"$dir/.stash/$ext\"\ndone\nexit \"$status\"\n```\n\nWhy `##*.` and not `#*.`: for `data.tar.gz`, `${name#*.}` is `tar.gz` but the extension is the part after the **last** dot, `gz`. `[[ $path == */* ]]` is a pattern test (is there a `/` anywhere?). Without it, `${path%/*}` on `data.tar.gz` would return the whole name.","rubric":[{"marks":1,"item":"No-argument check: usage message to standard error and `exit 1`"},{"marks":1,"item":"`for path in \"$@\"` (quoted) over all arguments"},{"marks":1,"item":"`[[ ! -f $path ]]` test, message to standard error, and `continue`"},{"marks":1,"item":"Remembers that an error happened and exits with 2, otherwise 0"},{"marks":1,"item":"Directory part with `${path%/*}`"},{"marks":1,"item":"Uses `.` when the pathname has no `/` (e.g. `[[ $path == */* ]]`)"},{"marks":1,"item":"Extension with `${name##*.}` on the filename, and `other` when there is no `.`"},{"marks":1,"item":"`mkdir -p \"$dir/.stash/$ext\"` (the `-p` avoids the error and creates `.stash` too)"},{"marks":1,"item":"`chmod 700` (or `u=rwx,go=`) on `\"$dir/.stash\"`"},{"marks":1,"item":"Prints the message and runs `mv \"$path\" \"$dir/.stash/$ext\"`; every expansion is double quoted"}],"topics":["scripts","strings","loops","conditionals","files","permissions","quoting"]}]}]},{"id":"mockB","title":"Mock midterm B","minutes":50,"instructions":"This mock is **50 minutes** long. There are **4 questions** worth a total of **30 marks**. No aids are allowed. It follows the format of Quiz 2 (Bash parts only).\n\n- Short answers should be very brief.\n- Write functions as `name() { ... }`, use `[[ ]]` for tests and `(( ))` for arithmetic, and double quote your expansions.\n- Afterwards, type your answers into the Day 8 drills (`./drill.sh start 8`) to test them.","questions":[{"id":"mockB-1","title":"Question 1","marks":12,"prompt":"**1 mark each, 12 marks total.** Your answer to each part should be very brief.","parts":[{"id":"mockB-1a","label":"A","marks":1,"prompt":"What does the metacharacter `+` mean in a regular expression?","solution":"The preceding atom (character, bracket expression or subexpression) must appear **one or more** times.","rubric":[{"marks":1,"item":"One or more of the preceding element (atom)"}],"topics":["regex"]},{"id":"mockB-1b","label":"B","marks":1,"prompt":"Provide a regular expression that matches exactly the strings made of four uppercase English letters followed by exactly three digits (for example `CISC220`, but not `CISC1240` or `cisc220`).","solution":"```bash\n^[A-Z]{4}[0-9]{3}$\n```\n\n`^[[:upper:]]{4}[[:digit:]]{3}$` is also correct.","rubric":[{"marks":1,"item":"Both anchors `^` and `$`, `[A-Z]{4}` and `[0-9]{3}` (writing the classes out four and three times is fine)"}],"topics":["regex"]},{"id":"mockB-1c","label":"C","marks":1,"prompt":"Show how to create a Bash array `fruits` that contains the three values `red apple`, `green pear`, and `plum`.","solution":"```bash\nfruits=(\"red apple\" \"green pear\" \"plum\")\n```","rubric":[{"marks":1,"item":"Parentheses, no spaces around `=`, and the two values with spaces quoted"}],"topics":["arrays","quoting"]},{"id":"mockB-1d","label":"D","marks":1,"prompt":"Show how to append the value `kiwi` to the end of the array `fruits`.","solution":"```bash\nfruits+=(\"kiwi\")\n```\n\n`fruits[${#fruits[@]}]=kiwi` also works when the indexes are 0, 1, 2, ... with no gaps.","rubric":[{"marks":1,"item":"`fruits+=(kiwi)` (quotes optional here); `fruits+=kiwi` earns 0 because it appends to the string in element 0"}],"topics":["arrays"]},{"id":"mockB-1e","label":"E","marks":1,"prompt":"What is the difference between `\"${arr[@]}\"` and `\"${arr[*]}\"`?","solution":"`\"${arr[@]}\"` expands to each element as a **separate word** (`\"${arr[0]}\" \"${arr[1]}\" ...`). `\"${arr[*]}\"` expands to **one single string** with all the elements joined by spaces.","rubric":[{"marks":1,"item":"`@` gives one word per element; `*` gives one combined word"}],"topics":["arrays","quoting"]},{"id":"mockB-1f","label":"F","marks":1,"prompt":"A variable `f` stores the name of a file. Write a Bash `if` statement that prints the message `missing` to **standard error** if the file whose name is stored in `f` does not exist.","solution":"```bash\nif [[ ! -e $f ]]; then echo \"missing\" >&2; fi\n```","rubric":[{"marks":1,"item":"`[[ ! -e $f ]]` (spaces inside the brackets), `then`/`fi`, and `>&2` (or `1>&2`)"}],"topics":["conditionals","streams"]},{"id":"mockB-1g","label":"G","marks":1,"prompt":"What is the exit status of the command `(( 5 - 5 ))`?","solution":"`1`. The expression's value is 0, and `(( ))` sets exit status 1 when the expression equals 0 (false).","rubric":[{"marks":1,"item":"1"}],"topics":["arithmetic"]},{"id":"mockB-1h","label":"H","marks":1,"prompt":"Write a C-style `for` loop that prints the even numbers 0, 2, 4, ..., 10, one per line.","solution":"```bash\nfor (( i = 0; i <= 10; i += 2 )); do\n    echo \"$i\"\ndone\n```","rubric":[{"marks":1,"item":"`for (( init; condition; update ))` with `<= 10` and step 2, plus `do ... done`"}],"topics":["loops","arithmetic"]},{"id":"mockB-1i","label":"I","marks":1,"prompt":"What does writing `local x=5` inside a Bash function do?","solution":"It creates a variable `x` that exists only while the function runs (it is visible in that function and any function it calls). The caller's variable `x`, if any, is not changed.","rubric":[{"marks":1,"item":"The variable is limited to the function (and functions it calls) so the caller's variable is not changed"}],"topics":["functions"]},{"id":"mockB-1j","label":"J","marks":1,"prompt":"A Bash function can only `return` an exit status between 0 and 255. How can a function give a string result to its caller?","solution":"Print the string to standard output in the function and capture it with command substitution, e.g. `result=$(myfunc arg)`. (Assigning the result to a non-local variable that the caller reads also works, because of dynamic scoping.)","rubric":[{"marks":1,"item":"`echo` the result and use `$( )` command substitution (or set a global variable)"}],"topics":["functions","expansions"]},{"id":"mockB-1k","label":"K","marks":1,"prompt":"Using `tr`, print the value of the variable `s` with every digit deleted.","solution":"```bash\nprintf %s \"$s\" | tr -d '0-9'\n```\n\n`echo \"$s\" | tr -d '[:digit:]'` is also fine.","rubric":[{"marks":1,"item":"Sends `$s` to `tr` through a pipe and uses `tr -d` with the digits"}],"topics":["tr","streams"]},{"id":"mockB-1l","label":"L","marks":1,"prompt":"What does the following print?\n\n```bash\ns=banana.tar.gz\necho \"${s%%.*} ${s#*.}\"\n```","solution":"```text\nbanana tar.gz\n```\n\n`%%.*` removes the longest trailing part that starts with a dot (`.tar.gz`); `#*.` removes the shortest leading part that ends with a dot (`banana.`).","rubric":[{"marks":1,"item":"Exactly `banana tar.gz`"}],"topics":["strings"]}]},{"id":"mockB-2","title":"Question 2","marks":4,"prompt":"**2 marks each, 4 marks total.**","parts":[{"id":"mockB-2a","label":"A","marks":2,"prompt":"A variable `s` holds a string. Write an `if` statement that prints `S is a number` to standard output if `s` is made up only of digits (at least one), and otherwise prints `S is not a number` to standard error, where *S* is the value of `s`. Use a regular expression.","solution":"```bash\nif [[ $s =~ ^[0-9]+$ ]]; then\n    echo \"$s is a number\"\nelse\n    echo \"$s is not a number\" >&2\nfi\n```","rubric":[{"marks":1,"item":"`[[ $s =~ ^[0-9]+$ ]]` with both anchors and the regex **not** quoted"},{"marks":1,"item":"Correct `if/else/fi` with the second message sent to standard error"}],"topics":["regex","conditionals","streams"]},{"id":"mockB-2b","label":"B","marks":2,"prompt":"Inside a script, use a `for` loop over the command line arguments to compute the sum of all of the arguments (assume they are integers) and print it. With no arguments the script prints `0`.","solution":"```bash\nsum=0\nfor n in \"$@\"; do\n    (( sum += n ))\ndone\necho \"$sum\"\n```","rubric":[{"marks":1,"item":"`for n in \"$@\"` and `sum` initialised to 0"},{"marks":1,"item":"Arithmetic update (`(( sum += n ))` or `sum=$(( sum + n ))`) and prints the sum after the loop"}],"topics":["loops","arithmetic","variables"]}]},{"id":"mockB-3","title":"Question 3","marks":4,"prompt":"**4 marks.**","parts":[{"id":"mockB-3","label":"A","marks":4,"prompt":"Write a Bash function `count_char` that is called as `count_char` *CH* *STR*. It prints the number of times the single character *CH* appears in the string *STR*, and it **returns** exit status 0 if *CH* appears at least once and 1 otherwise. The function must not change any variables of its caller.\n\n```text\n$ count_char a banana; echo $?\n3\n0\n$ count_char z banana; echo $?\n0\n1\n```","solution":"```bash\n# countchar.sh: defines the function count_char (sourced, no shebang needed)\n\n# count_char ch str\n# prints the number of times the character ch appears in str;\n# returns 0 if ch appears at least once, 1 otherwise\ncount_char() {\n    local ch=$1\n    local str=$2\n    local count=0\n    local i\n    for (( i = 0; i < ${#str}; i++ )); do\n        if [[ ${str:i:1} == \"$ch\" ]]; then\n            (( count++ ))\n        fi\n    done\n    echo \"$count\"\n    if (( count > 0 )); then\n        return 0\n    else\n        return 1\n    fi\n}\n```\n\nThe right-hand side of `==` is quoted so that a character such as `*` is compared literally instead of being used as a pattern.","rubric":[{"marks":1,"item":"Loop over the indexes 0 to `${#str}`-1 (C-style `for` with `${#str}`)"},{"marks":1,"item":"Extracts one character with `${str:i:1}` and compares it to *CH* (right side quoted)"},{"marks":1,"item":"Counts matches and prints the count; variables declared `local`"},{"marks":1,"item":"`return 0` if the count is positive, `return 1` otherwise"}],"topics":["functions","strings","loops","arithmetic"]}]},{"id":"mockB-4","title":"Question 4","marks":10,"prompt":"**10 marks.**","parts":[{"id":"mockB-4","label":"A","marks":10,"prompt":"Complete the script `uniqrev.sh` below. It prints its command line arguments on a single line in **reverse order** with **repeated values removed** (keep the first occurrence of each value, counting from the left of the original arguments). Arguments may contain spaces or wildcard characters such as `*`.\n\n```text\n$ ./uniqrev.sh 3 1 3 2 1\n2 1 3\n$ ./uniqrev.sh \"a b\" c \"a b\"\nc a b\n$ ./uniqrev.sh\nUsage: uniqrev.sh value...        (on standard error, exit status 1)\n```\n\n```bash\n#!/bin/bash\n\n# returns 0 if $1 is an element of the array out, 1 otherwise\ncontains() {\n}\n\n# copies the elements of arr into the array out, skipping values already in out\ndedup() {\n}\n\n# reverses the order of the elements of out (swap elements; do not use another array)\nreverse() {\n}\n\n# if there are no command line arguments print the usage message and exit\n\narr=(\"$@\")\ndedup\nreverse\n\n# print the elements of out on a single line\n```\n\nImplement the three functions, the argument check, and the final print. No other error checking is required.","solution":"```bash\n#!/bin/bash\n\n# uniqrev.sh: prints the command line arguments in reverse order\n# with duplicates removed\n\n# returns 0 if $1 is an element of the array out, 1 otherwise\ncontains() {\n    local elem\n    for elem in \"${out[@]}\"; do\n        if [[ $elem == \"$1\" ]]; then\n            return 0\n        fi\n    done\n    return 1\n}\n\n# copies the elements of arr into out, skipping repeated values\ndedup() {\n    out=()\n    local elem\n    for elem in \"${arr[@]}\"; do\n        if ! contains \"$elem\"; then\n            out+=(\"$elem\")\n        fi\n    done\n}\n\n# reverses the order of the elements of out\nreverse() {\n    local n=${#out[@]}\n    local i tmp\n    for (( i = 0; i < n / 2; i++ )); do\n        tmp=${out[i]}\n        out[i]=${out[n - 1 - i]}\n        out[n - 1 - i]=$tmp\n    done\n}\n\nif (( $# == 0 )); then\n    echo \"Usage: uniqrev.sh value...\" >&2\n    exit 1\nfi\n\narr=(\"$@\")\ndedup\nreverse\necho \"${out[@]}\"\n```\n\nWhy the quotes matter: `for elem in ${out[@]}` (unquoted) splits `a b` into two words, so the duplicate `a b` is never found. `[[ $elem == $1 ]]` without quotes treats `$1` as a pattern, so `a*` would wrongly match `ab`.","rubric":[{"marks":1,"item":"`contains`: loops over `\"${out[@]}\"` (quoted)"},{"marks":1,"item":"`contains`: compares each element with `\"$1\"` (right side quoted) and `return 0` when found"},{"marks":1,"item":"`contains`: `return 1` after the loop"},{"marks":1,"item":"`dedup`: starts `out` empty (`out=()`) and loops over `\"${arr[@]}\"`"},{"marks":1,"item":"`dedup`: calls `contains` as an `if` condition (with `!`) and appends with `out+=(\"$elem\")`"},{"marks":1,"item":"`reverse`: gets the size with `${#out[@]}`"},{"marks":1,"item":"`reverse`: loop runs for `i < n / 2` only (looping to `n` reverses twice)"},{"marks":1,"item":"`reverse`: correct swap of `out[i]` and `out[n - 1 - i]` using a temporary variable"},{"marks":1,"item":"No-argument check `(( $# == 0 ))` with message to standard error and `exit 1`"},{"marks":1,"item":"Prints with `echo \"${out[@]}\"`; loop variables declared `local`"}],"topics":["arrays","functions","loops","conditionals","quoting","arithmetic"]}]}]}]},"sheet":{"sections":[{"title":"1. Filesystem, paths and commands","md":"- **Inode**: stores a file's metadata (type, owner, size, times, where the data is) but **not its name**.\n- **Directory**: a file whose contents map **filenames to inode numbers**. A regular file is an ordinary data file; directories are not regular files.\n- **Hard link**: a directory entry (name → inode). Every file has at least one. The number after the permissions in `ls -l` is the hard-link count.\n- Root directory: `/`. **Absolute** path starts at `/` (`/home/user1/notes`); **relative** path starts at the current working directory (`notes`, `../user2`).\n\n| Symbol | Meaning |\n|---|---|\n| `.` | current directory |\n| `..` | parent directory |\n| `~` | your home directory (`~user2` = user2's home) |\n| `cd` | (no argument) go home |\n| `cd -` | go back to the previous directory (prints it) |\n| `pwd` | print the absolute path of the working directory |\n\n**Command form**: `command -options arguments`. Options combine: `ls -s -h` = `ls -sh`. Long form: `--all`.\n\n| `ls` option | Meaning |\n|---|---|\n| `-a` | all files, including hidden (`.name`) and `.` `..` |\n| `-A` | like `-a` but not `.` and `..` |\n| `-d` | list a directory itself, not its contents |\n| `-l` | long listing |\n| `-1` | one name per line |\n| `-r` | reverse order |\n| `-t` | sort by modification time (newest first) |\n| `-S` | sort by size (largest first) |\n| `-s` / `-h` | size in blocks / human readable |\n| `-F` | add a symbol showing the file type |\n\nKinds of commands: built-in (`cd`, `pwd`), executable program (`ls`), alias, shell function. `type cmd` says which; `which cmd` gives the program's path. Help: `man ls`, `ls --help`, `help cd` (built-ins).\n\n**Lists of commands**: `a; b` runs both in order. `a && b` runs `b` only if `a` succeeds (exit status 0). `a || b` runs `b` only if `a` fails. `cmd &` runs in the background."},{"title":"2. Filename expansion (globs)","md":"An **unquoted** word containing `*`, `?` or `[` is replaced by the **alphabetically sorted** list of matching filenames. Globs do not match hidden files (leading `.`) unless the pattern starts with `.`.\n\n| Wildcard | Matches |\n|---|---|\n| `*` | any string, including the empty string |\n| `?` | exactly one character |\n| `[abc]` | one character from the set |\n| `[a-z]` `[0-9]` | one character in the range |\n| `[!abc]` | one character **not** in the set |\n| `[[:upper:]]` | one character in a POSIX class |\n\nPOSIX classes (only inside `[ ]`): `[:alpha:]` `[:digit:]` `[:alnum:]` `[:upper:]` `[:lower:]` `[:space:]` `[:blank:]` `[:punct:]`.\n\n```bash\nls *.txt                 # names ending in .txt\nls ???                   # names exactly 3 characters long\nls *.[pP][dD][fF]        # .pdf in any mix of case\nls */A1answers.txt       # that file in every subdirectory\nls -d */                 # just the subdirectories\ncp * ../backup           # every (non-hidden) file here\n```\n\nIf nothing matches, the pattern is left **as is** (e.g. `*.pdf` stays the literal string `*.pdf`). In a `for` loop guard with `[[ -e $f ]] || continue`."},{"title":"3. Quoting","md":"| Form | Effect |\n|---|---|\n| `\\c` | escape: the next character is literal (`file\\ name`) |\n| `'...'` | everything literal; no expansions at all; cannot contain `'` |\n| `\"...\"` | literal **except** `$` (parameter, `$( )`, `$(( ))`), backquote and `\\` |\n\nDouble quotes stop **word splitting**, **filename expansion**, tilde and brace expansion, but still allow `$var`, `$(cmd)`, `$((expr))`.\n\n```bash\nx=\"a   b\"\necho $x          # a b        (split into 2 words, joined by one space)\necho \"$x\"        # a   b\necho '$x'        # $x\necho \"*\"         # *          (no globbing)\n```\n\n**Always write `\"$var\"`, `\"$1\"`, `\"$@\"`, `\"${arr[@]}\"`** in scripts: a filename with a space otherwise becomes several arguments. Inside `[[ ]]` the left side does not need quotes (no word splitting there), but quote the right side of `==`/`!=` to compare literally."},{"title":"4. Files: create, move, copy, remove, link","md":"Any character except `/` and the null character can be in a filename. Names are case sensitive; a leading `.` means hidden. Avoid spaces and a leading `-`.\n\n| Command | Effect |\n|---|---|\n| `touch f1 f2` | create empty files (or update the timestamp) |\n| `mkdir d1 d2` | create directories |\n| `mkdir -p a/b/c` | create missing parents too; no error if it exists |\n| `mv old new` | rename (overwrites `new` if it exists) |\n| `mv f1 f2 dir` | move files into an existing directory |\n| `cp src dst` | copy a file |\n| `cp f1 f2 dir` | copy several files into a directory |\n| `cp -r dir1 dir2` | copy a directory and its contents |\n| `rm f1 f2` | remove files (permanent!) |\n| `rm -r dir` | remove a directory and everything inside |\n| `rmdir dir` | remove an **empty** directory |\n| `ln target name` | hard link: a second name for the same inode |\n| `ln -s target name` | symbolic link: a file that points to a name |\n| `cat f` | print a file's contents |\n\n`-i` (`mv -i`, `rm -i`, `cp -i`) asks before overwriting/removing. Removing one hard link only decreases the link count; the data is gone when the count reaches 0. A symbolic link breaks (dangles) if its target is renamed or removed."},{"title":"5. Permissions","md":"`ls -l` shows: type+permissions, hard links, owner, group, size, time, name.\n\n`-rwxr-x---` = type `-` (regular file; `d` directory, `l` symbolic link) then **user** `rwx`, **group** `r-x`, **other** `---`.\n\n| | Regular file | Directory |\n|---|---|---|\n| `r` | read contents | list names (with `x`) |\n| `w` | change contents | create/delete/rename files in it (with `x`) |\n| `x` | run as a program | enter it (`cd`) |\n\n**Octal**: r=4, w=2, x=1, one digit each for user, group, other.\n\n| Octal | Meaning | Octal | Meaning |\n|---|---|---|---|\n| 7 | `rwx` | 3 | `-wx` |\n| 6 | `rw-` | 2 | `-w-` |\n| 5 | `r-x` | 1 | `--x` |\n| 4 | `r--` | 0 | `---` |\n\n```bash\nchmod 750 hello.sh        # rwxr-x---\nchmod 644 notes.txt       # rw-r--r--\nchmod 700 .trash          # rwx------\n```\n\n**Symbolic**: who `u g o a` + operator `+` add, `-` remove, `=` set exactly + perms `r w x`. Separate with commas, no spaces.\n\n```bash\nchmod u+x script.sh       # add execute for the owner\nchmod go-w *.txt          # remove write for group and other\nchmod u=rw,go=r f         # rw-r--r--\nchmod u=rwx,go= dir       # rwx------  (empty = none)\nstat -c %a f              # prints the octal permissions, e.g. 644\n```"},{"title":"6. Streams, redirection, pipes and tee","md":"File descriptors: **0** standard input, **1** standard output, **2** standard error.\n\n| Syntax | Effect |\n|---|---|\n| `cmd > f` | stdout to `f` (create/overwrite); same as `1>` |\n| `cmd >> f` | append stdout to `f` |\n| `cmd 2> f` | stderr to `f` |\n| `cmd > out 2> err` | stdout and stderr to separate files |\n| `cmd > f 2>&1` | both to `f` (order matters: left to right) |\n| `cmd 2> /dev/null` | throw error messages away |\n| `echo \"msg\" >&2` | print a message **to standard error** |\n| `cmd < f` | stdin from file `f` |\n\n**Pipe** `a | b` sends the stdout of `a` to the stdin of `b`. **`tee f`** copies its input to the file `f` and to stdout, so it can sit in the middle of a pipeline.\n\n| Tool | Use |\n|---|---|\n| `sort` | sort lines (`-n` numeric, `-r` reverse) |\n| `uniq` | remove **adjacent** duplicate lines (`-d` only duplicates); sort first |\n| `wc -l` | count lines |\n| `cut -d, -f2` | field 2 using `,` as the delimiter (default delimiter is tab) |\n| `head -n 3` | first 3 lines |\n| `grep -E 're' f` | lines matching an extended regex (`-n` line numbers, `-i` ignore case) |\n\n```bash\ncut -f3 classlist | sort | tee snum | head -n 3\nls /bin /usr/bin | sort | uniq -d | wc -l\n```"},{"title":"7. tr: translate, delete, squeeze characters","md":"`tr` reads **standard input only** and writes standard output. To use it on a variable, pipe the value in.\n\n```bash\ny=$(printf %s \"$x\" | tr 'a-z' 'A-Z')     # to uppercase\necho \"$x\" | tr '[:lower:]' '[:upper:]'   # same with POSIX classes\necho \"$x\" | tr '.' '/'                   # every . becomes /\necho \"$x\" | tr -d '0-9'                  # delete all digits\necho \"$x\" | tr -s ' '                    # squeeze runs of spaces into one\necho \"$x\" | tr '[:digit:]' '[X*]'        # every digit becomes X\n```\n\n- Character *i* of `seq1` is replaced by character *i* of `seq2`; other characters pass through.\n- If `seq2` is shorter, GNU `tr` repeats its last character (`[c*]` is the portable way).\n- Duplicated characters in `seq1` give undefined results."},{"title":"8. Expansions","md":"Order the shell performs them: **1** brace, **2** tilde, **3** parameter, **4** command substitution and **5** arithmetic (left to right), **6** word splitting, **7** filename expansion.\n\n| Expansion | Example | Result |\n|---|---|---|\n| brace list | `echo f{a,b,c}.txt` | `fa.txt fb.txt fc.txt` |\n| brace sequence | `echo {1..5}` | `1 2 3 4 5` |\n| with step | `echo {10..20..5}` | `10 15 20` |\n| zero padded | `echo {08..10}` | `08 09 10` |\n| letters | `echo {a..e}` | `a b c d e` |\n| tilde | `echo ~` | `/home/user1` |\n| parameter | `echo \"$x\"` / `\"${x}\"` | value of `x` |\n| command substitution | `d=$(pwd)` | output of the command (trailing newlines removed) |\n| arithmetic | `echo $(( 2 * 5 ))` | `10` |\n\n- `mkdir {2023..2024}-{01..12}` makes 24 directories.\n- **Word splitting** happens on unquoted results, at the characters in `IFS` (default space, tab, newline). Several separators in a row count as one.\n- Change `IFS` temporarily to split on something else: `IFS=\",\"` then `for f in $str`, then restore it.\n- In an **assignment** `v=...` there is **no** brace expansion, **no** filename expansion and no word splitting; tilde, parameter, command and arithmetic expansion do happen. `x=*.txt` stores the literal `*.txt`."},{"title":"9. Scripts, variables and command line arguments","md":"```bash\n#!/bin/bash\n# a comment (from # to end of line; a quoted # is not a comment)\necho \"Hello, $1!\"\n```\n\nRun it: `chmod u+x hello.sh` then `./hello.sh Sam` (or `bash hello.sh Sam` without execute permission).\n\n| Parameter | Meaning |\n|---|---|\n| `$#` | number of command line arguments |\n| `$0` | pathname used to run the script |\n| `$1` ... `$9`, `${10}` | the arguments (braces needed from 10 on) |\n| `\"$@\"` | all arguments, each as a separate word (use this to loop) |\n| `\"$*\"` | all arguments as one string |\n| `$?` | exit status of the last command (0 = success, 1-255 = failure) |\n\n- `exit n` ends the script with status *n*; without it the status is that of the last command.\n- `shift` drops `$1` and moves `$2` to `$1` and so on (`$#` decreases).\n- **Assignment**: `name=value` with **no spaces** around `=`. Use the value with `$name` or `${name}`.\n- Values are strings; unset variables expand to the empty string (no error).\n- Concatenate by writing values next to each other: `str3=$str1$str2`, `out=\"${in}_.bak\"` (braces needed because `$in_` would be the variable `in_`).\n- Command output into a variable: `perm=$(stat -c %a \"$src\")`.\n- Usage check pattern:\n\n```bash\nif (( $# != 1 )); then\n    echo \"Usage: script.sh name\" >&2\n    exit 1\nfi\n```"},{"title":"10. Strings: parameter expansion","md":"Example values: `s=abcdefghij`, `f=dir/file.txt.zip`.\n\n| Expansion | Meaning | Example → result |\n|---|---|---|\n| `${#s}` | length | `10` |\n| `${s:2}` | from index 2 to the end | `cdefghij` |\n| `${s:3:4}` | 4 characters from index 3 | `defg` |\n| `${s: -3}` | last 3 (space before `-`) | `hij` |\n| `${s:1:-2}` | from 1 up to (not incl.) 2nd last | `bcdefgh` |\n| `${f#*.}` | remove **shortest** leading match | `txt.zip` |\n| `${f##*.}` | remove **longest** leading match | `zip` (extension) |\n| `${f##*/}` | ... up to the last `/` | `file.txt.zip` (filename) |\n| `${f%.*}` | remove **shortest** trailing match | `dir/file.txt` |\n| `${f%%.*}` | remove **longest** trailing match | `dir/file` |\n| `${f%/*}` | ... from the last `/` | `dir` (directory) |\n| `${s/b/X}` | replace first match | `aXcdefghij` |\n| `${s//[aeiou]/}` | replace all matches (here: delete vowels) | `bcdfghj` |\n| `${s^}` / `${s^^}` | uppercase first / all characters | `Abcdefghij` / `ABCDEFGHIJ` |\n| `${s,}` / `${s,,}` | lowercase first / all | |\n\nMemory aid: `#` is on the left of `$` on the keyboard (removes from the **front**), `%` is on the right (removes from the **back**). Doubling the symbol makes the match **longest**. The variable itself is not changed.\n\nCharacter at index *i*: `${s:i:1}`. Loop over characters: `for (( i = 0; i < ${#s}; i++ ))`.\n\n| Expansion | `str` unset | `str` empty | `str` set |\n|---|---|---|---|\n| `${str:-word}` | `word` | `word` | `$str` |\n| `${str:=word}` | `word`, assigns it | `word`, assigns it | `$str` |\n| `${str:+word}` | nothing | nothing | `word` |\n| `${str:?word}` | error, exit | error, exit | `$str` |\n\nWithout the `:` (e.g. `${str-word}`) only *unset* is tested, not empty."},{"title":"11. Arithmetic","md":"Integers only (no floating point). Operators as in Java/C: `+ - * / %`, `**` (power), `++ --`, `+= -= *= /=`, comparisons `< <= > >= == !=`, logic `&& || !`. Division truncates: `$(( 7 / 2 ))` is `3`.\n\n| Form | Use |\n|---|---|\n| `(( expr ))` | command: do arithmetic or test; `$` optional on variable names |\n| `$(( expr ))` | expansion: substitutes the value |\n\n```bash\n(( x = 1 + 2 ))           # x is 3\n(( count++ ))\nn=$(( ${#s} / 2 ))\necho \"$(( 2 ** 10 ))\"     # 1024\nif (( val % 2 == 0 )); then echo even; fi\n```\n\n- **Exit status of `(( ))`**: 0 (true) if the value is **non-zero**, 1 (false) if the value is **0**. So `(( 5 - 5 ))` has status 1.\n- Non-numeric, empty or unset variables count as 0 inside `(( ))`.\n- `$RANDOM`: a random integer 0 to 32767; `$(( RANDOM % n ))` gives 0 to n-1."},{"title":"12. Regular expressions","md":"Bash uses POSIX **extended** regexes with `=~` inside `[[ ]]`. The match succeeds if the pattern matches **any part** of the string, so anchor with `^...$` to match the whole string. **Do not quote the regex** (quoted parts are matched literally); storing it in a variable `re='...'` then `[[ $s =~ $re ]]` is safe.\n\n| Metacharacter | Meaning |\n|---|---|\n| `^` / `$` | start / end of the string (line) |\n| `.` | any single character |\n| `[abc]` `[a-z]` `[[:digit:]]` | one character from the set |\n| `[^abc]` | one character **not** in the set |\n| `( )` | subexpression (group) |\n| `*` | preceding atom **0 or more** times |\n| `+` | preceding atom **1 or more** times |\n| `?` | preceding atom **0 or 1** time |\n| `{m,n}` `{m}` `{m,}` | between m and n / exactly m / at least m times |\n\n- **Choice** `a|b` matches either side: `^(cat|dog)$` matches `cat` or `dog`.\n- An **atom** is one character, a bracket expression or a subexpression.\n- Metacharacters are literal inside `[ ]`: `^a[.]c$` matches `a.c`.\n- `^(19|20)[0-9][0-9]$` matches the years 1900 to 2099.\n\n| Regex | Matches |\n|---|---|\n| `^[0-9]+$` | unsigned integer |\n| `^[-+]?[0-9]+$` | signed or unsigned integer |\n| `^[a-z]+$` | one or more lowercase letters only |\n| `^[A-Z]{4}[0-9]{3}$` | `CISC220` |\n| `[[:space:]]` | contains whitespace |\n\n```bash\nif [[ $pw =~ [[:digit:]] ]]; then echo \"has a digit\"; fi\ngrep -E '^zip' file      # grep -E uses the same syntax on each line\n```\n\nDo not confuse with globs: in a regex `*` means \"repeat the previous atom\", in a glob `*` means \"any string\"."},{"title":"13. Conditions: [[ ]], if and logical operators","md":"```bash\nif [[ -f $file ]]; then\n    echo \"regular file\"\nelif [[ -d $file ]]; then\n    echo \"directory\"\nelse\n    echo \"something else\" >&2\nfi\n```\n\nSpaces are required inside `[[ ` and ` ]]`. `if` runs any command and tests its **exit status** (0 = true): `if cd \"$dir\" 2> /dev/null; then ...`. One line: `if [[ ! -r $f ]]; then echo \"not readable\"; fi`.\n\n| File test | True if |\n|---|---|\n| `-e f` | exists (any kind) |\n| `-f f` | is a regular file |\n| `-d f` | is a directory |\n| `-r f` / `-w f` / `-x f` | readable / writable / executable |\n| `-s f` | exists and size > 0 |\n| `f1 -nt f2` / `-ot` | newer / older than |\n\n| String test | True if |\n|---|---|\n| `-z $s` | empty |\n| `-n $s` or just `$s` | not empty |\n| `$a == $b` (or `=`) | equal; **unquoted** right side is a glob pattern (`$s == a*`) |\n| `$a != $b` | not equal |\n| `$a < $b` / `$a > $b` | before / after in dictionary order (strings, not numbers!) |\n| `$s =~ regex` | regex match |\n| `-v name` | variable `name` is set (no `$`) |\n\n| Integer test (in `[[ ]]`) | Same with `(( ))` |\n|---|---|\n| `-eq` `-ne` | `==` `!=` |\n| `-lt` `-le` | `<` `<=` |\n| `-gt` `-ge` | `>` `>=` |\n\n**Combine** (highest precedence first): `( expr )`, `! expr`, `expr1 && expr2`, `expr1 || expr2`. Examples: `[[ -f $f && -r $f ]]`, `(( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) ))`.\n\nPitfall: `[[ 100 < 2 ]]` is **true** (string comparison). Use `(( 100 < 2 ))` or `-lt` for numbers."},{"title":"14. Loops","md":"```bash\nfor arg in \"$@\"; do              # each command line argument\n    echo \"$arg\"\ndone\n\nfor f in *.txt; do               # each matching file\n    [[ -e $f ]] || continue      # skip if the glob matched nothing\n    mv \"$f\" \"${f%.txt}.md\"\ndone\n\nfor i in {1..5}; do echo \"$i\"; done\n\nfor (( i = 0; i < n; i++ )); do  # C-style\n    echo \"$i\"\ndone\n\nwhile (( $# > 0 )); do           # process arguments with shift\n    echo \"$1\"\n    shift\ndone\n\ncount=10\nuntil (( count < 0 )); do        # runs until the test succeeds\n    echo \"$count\"\n    (( count-- ))\ndone\n\nwhile read -r line; do           # read a file line by line\n    echo \"$line\"\ndone < \"$file\"\n\nwhile IFS=\",\" read -r num last first; do   # split each line on commas\n    echo \"$first $last\"\ndone < students.txt\n```\n\n- `while` repeats while the test command succeeds (status 0); `until` repeats while it fails.\n- `break` leaves the loop; `continue` skips to the next iteration.\n- `for x in $str` (unquoted) loops over the words of `str`.\n- Unquoted `$@` splits arguments that contain spaces: always write `\"$@\"`."},{"title":"15. Arrays","md":"| Syntax | Meaning |\n|---|---|\n| `arr=(1 2 3)` | create (elements separated by spaces) |\n| `arr=(\"a b\" c)` | quote elements that contain spaces |\n| `arr=(\"$@\")` | array of the command line arguments |\n| `arr[5]=x` | set element 5 (indexes may have gaps) |\n| `${arr[i]}` | element *i* (braces required; `i` needs no `$`) |\n| `$arr` | element 0 only (common mistake) |\n| `${#arr[@]}` | number of elements |\n| `\"${arr[@]}\"` | all elements, **one word each** (use this) |\n| `\"${arr[*]}\"` | all elements as **one string** |\n| `${!arr[@]}` | the list of indexes |\n| `arr+=(\"$x\")` | append one element |\n| `a+=(\"${b[@]}\")` | append all of `b` |\n| `declare -a arr` | declare an (empty) array |\n| `mapfile -t arr < f` | each line of `f` becomes an element |\n| `read -a arr` | split one input line into an array |\n\n```bash\nn=${#arr[@]}\nfor (( i = 0; i < n; i++ )); do\n    echo \"$i: ${arr[i]}\"\ndone\n\nfor elem in \"${arr[@]}\"; do echo \"$elem\"; done\n\ntmp=${arr[i]}                  # swap elements i and j\narr[i]=${arr[j]}\narr[j]=$tmp\n\necho \"${arr[@]}\"               # print all on one line\n```"},{"title":"16. Functions","md":"```bash\nmax2() {                       # course style: name() { ... }\n    if (( $1 >= $2 )); then\n        echo \"$1\"              # \"return\" a value by printing it\n    else\n        echo \"$2\"\n    fi\n}\nhi=$(max2 4 9)                 # capture it with command substitution\n\nis_int() {\n    [[ $1 =~ ^[-+]?[0-9]+$ ]]  # status of the last command is the function's status\n}\nif is_int \"$x\"; then echo \"integer\"; fi\n```\n\n- Called like a command: `max2 4 9` (no parentheses, no commas). Define a function **before** calling it.\n- Inside, `$1 $2 ... $# \"$@\"` are the **function's** arguments; the script's arguments come back after it returns.\n- `return n` ends the function with exit status *n* (0-255; 0 = success/true). Without `return` the status is that of the last command.\n- **Dynamic scoping**: variables are global by default; a function can read and change the caller's variables (this is one way to hand back results, e.g. set `idx` and let the caller read it).\n- `local x=5` makes `x` belong to the function (and functions it calls) so the caller's `x` is untouched. Always make loop counters local.\n- Syntax: a space or newline after `{` and a newline (or `;`) before `}`.\n- Sourcing a file of functions: `. ./lib.sh` (or `source ./lib.sh`).\n\n```bash\n# typical script layout for a long exam question\n#!/bin/bash\nhelper() {\n    local i\n    ...\n}\nif (( $# == 0 )); then\n    echo \"Usage: prog.sh args...\" >&2\n    exit 1\nfi\nstatus=0\nfor arg in \"$@\"; do\n    ...\ndone\nexit \"$status\"\n```"}]}};</script>
<script>
/* CISC220 Bash Sprint: an 8-day study planner built on retrieval practice and spaced repetition.
   All course content is in window.STUDY_DATA (inlined at build time from study-app/content/*.json). */
(function () {
  "use strict";

  const DATA = window.STUDY_DATA || { days: [], mocks: { exams: [] }, sheet: { sections: [] } };
  const EXAM_DATE = "2026-10-27";
  const DAY1_DATE = "2026-10-19";
  const REPO = "https://github.com/FallingBrook/CISC220_current/blob/main/";
  const BRANCH = "claude/cisc220-bash-study-app-1w7tyo";
  const STORE_KEY = "cisc220-bash-sprint-v1";
  const INTERVALS = [0, 1, 2, 4, 7]; // days until next review, by box

  // ---------------------------------------------------------------- state
  const blank = () => ({
    v: 1, srs: {}, steps: {}, topicsDone: {}, quizRuns: {}, write: {}, drills: {}, dumps: {}, mocks: {},
    topicStats: {}, reviewDone: {}, drafts: {}, dayOverride: null, theme: null,
  });
  let S = blank();
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) S = Object.assign(blank(), JSON.parse(raw));
  } catch (e) { /* storage unavailable: work in memory */ }
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
    }, 150);
  }

  // ---------------------------------------------------------------- dates
  function localISO(d) {
    const z = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function addDays(iso, n) {
    const [y, m, d] = iso.split("-").map(Number);
    return localISO(new Date(y, m - 1, d + n));
  }
  function diffDays(a, b) {
    const [y1, m1, d1] = a.split("-").map(Number);
    const [y2, m2, d2] = b.split("-").map(Number);
    return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
  }
  const today = () => localISO(new Date());
  function fmtDate(iso, opts) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, opts || { weekday: "short", month: "short", day: "numeric" });
  }
  // Which plan day is today (1..8); 0 = before the plan starts, 9 = exam day or later.
  function calendarDay() {
    const n = diffDays(DAY1_DATE, today()) + 1;
    if (n < 1) return 0;
    return Math.min(n, 9);
  }
  function currentDay() {
    if (S.dayOverride) return S.dayOverride;
    const c = calendarDay();
    return c === 0 ? 1 : Math.min(c, 8);
  }

  // ---------------------------------------------------------------- content index
  const dayData = {};
  const topics = {};
  const items = {}; // every flashcard and quiz item by id, with .kind and .day
  const writes = {};
  (DATA.days || []).forEach((d) => {
    dayData[d.day] = d;
    (d.topics || []).forEach((t) => { topics[t.id] = Object.assign({ day: d.day }, t); });
    (d.flashcards || []).forEach((c) => { items[c.id] = Object.assign({ kind: "card", day: d.day }, c); });
    (d.quiz || []).forEach((q) => { items[q.id] = Object.assign({ kind: "quiz", day: d.day }, q); });
    (d.write || []).forEach((w) => { writes[w.id] = Object.assign({ day: d.day }, w); });
  });
  const mocks = {};
  ((DATA.mocks && DATA.mocks.exams) || []).forEach((m) => { mocks[m.id] = m; });

  const TAG_NOTEBOOK = {
    paths: "filesystem", commands: "commands", globs: "filename_expansion", quoting: "quoting", files: "files",
    permissions: "permissions", streams: "streams", expansions: "expansions", tr: "tr",
    scripts: "introduction_to_bash_scripting", variables: "variables", strings: "strings", arithmetic: "arithmetic",
    regex: "regex", conditionals: "conditional_statements", loops: "loops", arrays: "arrays", functions: "functions",
  };
  function topicForTag(tag) {
    const nb = TAG_NOTEBOOK[tag];
    return Object.values(topics).find((t) => (t.notebook || "").indexOf("/" + nb + ".ipynb") >= 0);
  }

  // ---------------------------------------------------------------- the plan
  const DAY_META = {
    1: { mins: 150 }, 2: { mins: 150 }, 3: { mins: 150 }, 4: { mins: 165 }, 5: { mins: 160 }, 6: { mins: 165 },
    7: { mins: 170, title: "Mock exam A and fixing weak spots", goal: "Sit a full 50-minute mock under exam conditions, mark it honestly, then repair the topics it exposed." },
    8: { mins: 150, title: "Mock exam B, summary sheet, early night", goal: "Sit the second mock, write your own one-page summary from memory, and go to bed on time." },
  };
  function dayTitle(n) { return (dayData[n] && dayData[n].title) || (DAY_META[n] && DAY_META[n].title) || "Day " + n; }
  function dayGoal(n) { return (dayData[n] && dayData[n].goal) || (DAY_META[n] && DAY_META[n].goal) || ""; }

  function stepsFor(n) {
    const steps = [];
    if (n === 1) steps.push({ key: "setup", title: "Set up your terminal drills", mins: 10, href: "drills-0",
      desc: "Get the drill tool onto your Ubuntu laptop and do the 4-task warm-up (Day 0). You'll use it every day." });
    if (n >= 2) steps.push({ key: "review", title: "Warm-up: spaced review", mins: 25, href: "review",
      desc: "Answer the cards and questions that are due from earlier days before learning anything new. Recalling before the new material arrives is what makes yesterday's work stick." });
    if (n <= 6) {
      const d = dayData[n];
      const nt = d ? d.topics.length : 0;
      steps.push({ key: "learn", title: "Learn: " + nt + " topic" + (nt === 1 ? "" : "s"), mins: n >= 4 ? 70 : 60, href: null, topics: true,
        desc: "Read each lesson actively. At every orange Check box, say or write your answer before you reveal it." });
      steps.push({ key: "cards", title: "Flashcards: lock in today's facts", mins: 15, href: "cards-" + n,
        desc: "Go through today's new cards once. Rate yourself honestly; cards you miss come back sooner." });
      steps.push({ key: "quiz", title: "Practice quiz" + (n >= 3 ? ", mixed with earlier days" : ""), mins: 20, href: "quiz-" + n,
        desc: n >= 3 ? "Today's questions shuffled together with due questions from earlier days, the way the exam mixes topics." : "Exam-style questions on today's topics with instant feedback." });
      steps.push({ key: "write", title: "Write it by hand", mins: n >= 4 ? 35 : 25, href: "write-" + n,
        desc: "Study the worked example, fill in the faded one, then write the last one from a blank page, ideally on paper first. Half the midterm is handwritten code." });
      steps.push({ key: "drills", title: "Terminal drills", mins: 25, href: "drills-" + n,
        desc: "Run your answers in a real shell. The checker compares them with the reference, so any correct command passes." });
      steps.push({ key: "dump", title: "Brain dump: everything you remember", mins: 10, href: "dump-" + n,
        desc: "No notes. Write down everything from today, then compare it with the key points. Gaps you find here go to the top of tomorrow." });
    } else if (n === 7) {
      steps.push({ key: "mock", title: "Mock exam A (50 min, timed, on paper)", mins: 60, href: "mock-mockA",
        desc: "Phone away, no notes. Write your answers on paper, then mark them against the rubric." });
      steps.push({ key: "drills", title: "Type in and test your mock scripts", mins: 25, href: "drills-7",
        desc: "Type your handwritten scripts exactly as written and run the checker. Every bug it finds is a bug you would have handed in." });
      steps.push({ key: "weak", title: "Fix your weak spots", mins: 45, href: "weak",
        desc: "Re-read the lessons for your lowest-scoring topics, then redo their write exercises from a blank page." });
      steps.push({ key: "dump", title: "Brain dump", mins: 10, href: "dump-7", desc: "Write what you would tell a friend who has the same exam tomorrow." });
    } else if (n === 8) {
      steps.push({ key: "mock", title: "Mock exam B (50 min, timed, on paper)", mins: 60, href: "mock-mockB",
        desc: "Same conditions as yesterday. Compare your topic scores with mock A." });
      steps.push({ key: "drills", title: "Type in and test your mock scripts", mins: 20, href: "drills-8", desc: "Same as yesterday, for mock B." });
      steps.push({ key: "sheet", title: "Write your one-page summary from memory", mins: 30, href: "sheet",
        desc: "Write a full page of syntax from memory first, then compare it with the reference sheet and fill the gaps in a different colour." });
      steps.push({ key: "missed", title: "Last pass: every card you ever missed", mins: 15, href: "review-missed",
        desc: "Only the cards you have got wrong at least once. Stop when you're done; don't start new material tonight." });
      steps.push({ key: "sleep", title: "Stop by 10 pm and sleep", mins: 0, href: null,
        desc: "Sleep consolidates what you've practised. An all-nighter costs more marks than it gains." });
    }
    return steps;
  }

  function autoDone(n, key) {
    const d = dayData[n];
    switch (key) {
      case "learn": return !!d && d.topics.every((t) => S.topicsDone[t.id]);
      case "cards": return !!d && d.flashcards.length > 0 && d.flashcards.every((c) => S.srs[c.id]);
      case "quiz": return !!S.quizRuns["d" + n];
      case "write": return !!d && d.write.length > 0 && d.write.every((w) => S.write[w.id]);
      case "drills": return !!S.drills[n];
      case "dump": return !!(S.dumps[n] && S.dumps[n].trim());
      case "mock": return !!(S.mocks[n === 7 ? "mockA" : "mockB"] && S.mocks[n === 7 ? "mockA" : "mockB"].score != null);
      case "setup": return !!S.drills[0];
      case "review": return !!S.reviewDone[n === currentDay() ? today() : dateOfDay(n)];
      default: return false;
    }
  }
  function stepDone(n, key) {
    const m = S.steps[n + ":" + key];
    if (m === true) return true;
    if (m === false) return false;
    return autoDone(n, key);
  }
  function dayProgress(n) {
    const st = stepsFor(n);
    const done = st.filter((s) => stepDone(n, s.key)).length;
    return st.length ? done / st.length : 0;
  }
  const dateOfDay = (n) => addDays(DAY1_DATE, n - 1);

  // ---------------------------------------------------------------- spaced repetition
  function rate(id, grade) { // grade 0 again, 1 hard, 2 good, 3 easy
    const it = items[id];
    const s = S.srs[id] || { box: 0, due: today(), lapses: 0, reps: 0 };
    s.reps++;
    if (grade === 0) { s.box = 0; s.lapses++; s.due = today(); }
    else if (grade === 1) { s.box = Math.max(1, s.box); s.due = addDays(today(), 1); }
    else {
      s.box = Math.min(INTERVALS.length - 1, s.box + (grade === 3 ? 2 : 1));
      s.due = addDays(today(), INTERVALS[s.box]);
    }
    s.last = today();
    S.srs[id] = s;
    if (it && it.topic) {
      const ts = S.topicStats[it.topic] || { right: 0, wrong: 0 };
      if (grade >= 2) ts.right++; else ts.wrong++;
      S.topicStats[it.topic] = ts;
    }
    save();
  }
  function dueItems(kind) {
    const t = today();
    return Object.keys(S.srs).filter((id) => items[id] && (!kind || items[id].kind === kind) && S.srs[id].due <= t);
  }
  function missedItems() { return Object.keys(S.srs).filter((id) => items[id] && S.srs[id].lapses > 0); }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  // Interleave: no two consecutive items from the same topic when avoidable.
  function interleave(ids) {
    const pool = shuffle(ids.slice());
    const out = [];
    while (pool.length) {
      const prev = out.length ? items[out[out.length - 1]].topic : null;
      let k = pool.findIndex((id) => items[id].topic !== prev);
      if (k < 0) k = 0;
      out.push(pool.splice(k, 1)[0]);
    }
    return out;
  }

  // ---------------------------------------------------------------- markdown
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function inline(s) {
    // Code spans become placeholders first so emphasis can wrap them (**`/`**) and never reaches inside them.
    const codes = [];
    const text = String(s).replace(/(`+)([\s\S]*?)\1/g, (_, ticks, inner) => {
      codes.push("<code>" + esc(inner.replace(/^ (.*\S.*) $/, "$1")) + "</code>");
      return "\u0000" + (codes.length - 1) + "\u0000";
    });
    let h = esc(text);
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/\*\*(?=\S)([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/(^|[\s(>])\*([^*\s][^*]*?)\*(?=[\s).,;:!?<]|$)/g, "$1<em>$2</em>");
    return h.replace(/\u0000(\d+)\u0000/g, (_, k) => codes[+k]);
  }
  const BASH_KW = new Set(["if", "then", "else", "elif", "fi", "for", "while", "until", "do", "done", "case", "esac", "in", "function", "return", "local", "exit", "break", "continue", "shift", "source", "declare", "unset", "readonly", "export"]);
  function hlLine(s) {
    let out = "", i = 0;
    const span = (c, t) => '<span class="' + c + '">' + esc(t) + "</span>";
    while (i < s.length) {
      const c = s[i];
      const rest = s.slice(i);
      if (c === "#" && (i === 0 || /\s/.test(s[i - 1]))) { out += span("c", rest); break; }
      if (c === "\\" && i + 1 < s.length) { out += esc(s.substr(i, 2)); i += 2; continue; }
      if (c === "'") {
        let j = s.indexOf("'", i + 1); if (j < 0) j = s.length - 1;
        out += span("s", s.slice(i, j + 1)); i = j + 1; continue;
      }
      if (c === '"') {
        let j = i + 1;
        while (j < s.length && s[j] !== '"') { if (s[j] === "\\") j++; j++; }
        out += span("s", s.slice(i, j + 1)); i = j + 1; continue;
      }
      if (c === "$") {
        const m = rest.match(/^\$(\{[^}]*\}|\(\([^)]*\)\)|[A-Za-z_][A-Za-z0-9_]*|[0-9#@*?$!-])/);
        if (m) { out += span("v", m[0]); i += m[0].length; continue; }
      }
      const w = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
