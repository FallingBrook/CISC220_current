Value of an unset, empty, or non-numeric variable inside `(( ))`?","back":"0"},{"id":"d4-fc-50","topic":"d4-arithmetic","front":"Exit status of `(( expr ))`?","back":"0 if `expr` is non-zero (true); 1 if `expr` is 0 (false)."},{"id":"d4-fc-51","topic":"d4-arithmetic","front":"Check that a script got exactly 2 arguments.","back":"`if (( $# != 2 )); then echo \"Usage: s.sh a b\" >&2; exit 1; fi`"},{"id":"d4-fc-52","topic":"d4-arithmetic","front":"`$RANDOM`","back":"A random integer 0 to 32767 each time it is used. `$(( RANDOM % n ))` is 0 to n-1."},{"id":"d4-fc-53","topic":"d4-arithmetic","front":"What does `x=5; x=$x+1; echo $x` print?","back":"`5+1`. Assignment does no arithmetic; use `x=$(( x + 1 ))` or `(( x++ ))`."}],"quiz":[{"id":"d4-q-01","topic":"d4-scripts","type":"mcq","q":"You just saved `hello.sh` (permissions `rw-r--r--`) in the current directory. Which command runs it **without** changing its permissions?","options":["`./hello.sh`","`hello.sh`","`bash hello.sh`","`run hello.sh`"],"answer":2,"explain":"`bash hello.sh` only needs read permission. `./hello.sh` fails with `Permission denied` until you `chmod u+x hello.sh`. Plain `hello.sh` is searched for on the path (not the current directory). `run` is not a command."},{"id":"d4-q-02","topic":"d4-scripts","type":"output","q":"`args.sh` contains:\n\n```bash\n#!/bin/bash\necho \"$#: $1 | $2\"\n```\n\nWhat does `./args.sh \"a b\" c` print?","code":"./args.sh \"a b\" c","answer":"2: a b | c","explain":"The quotes make `a b` a single argument, so there are 2 arguments, `$1` is `a b`, and `$2` is `c`."},{"id":"d4-q-03","topic":"d4-scripts","type":"output","q":"`ten.sh` contains:\n\n```bash\n#!/bin/bash\necho \"$10 ${10}\"\n```\n\nWhat does this print?","code":"./ten.sh a b c d e f g h i j","answer":"a0 j","explain":"`$10` is `$1` (`a`) followed by the character `0`. Only `${10}` gives the tenth argument, `j`."},{"id":"d4-q-04","topic":"d4-strings","type":"output","q":"`hi.sh` is in the directory `scripts` and contains:\n\n```bash\n#!/bin/bash\necho \"$0\"\necho \"${0##*/}\"\n```\n\nWhat is printed?","code":"./scripts/hi.sh","answer":"./scripts/hi.sh\nhi.sh","explain":"`$0` is exactly the path used to run the script. `${0##*/}` removes the longest front part ending in `/`, leaving the script name."},{"id":"d4-q-05","topic":"d4-scripts","type":"mcq","q":"Which line in a script prints `error` to **standard error**?","options":["`echo error 2>&1`","`echo error >&2`","`echo error > 2`","`echo >&2 error > /dev/null`"],"answer":1,"explain":"`>&2` sends stdout into stderr. `2>&1` does the opposite (stderr into stdout). `> 2` writes to a file named `2`. The last one redirects stdout again to `/dev/null` after `>&2`, so the message is lost (the later redirection wins)."},{"id":"d4-q-06","topic":"d4-scripts","type":"short","q":"From inside a script, how do you print the number of command line arguments? (Quiz 1)","answer":"`echo $#`","explain":"Accept `echo \"$#\"` or `echo ${#}`."},{"id":"d4-q-07","topic":"d4-scripts","type":"short","q":"Write the two lines a script uses to print `Usage: go.sh file` to standard error and stop with exit status 1.","answer":"```bash\necho \"Usage: go.sh file\" >&2\nexit 1\n```","explain":"The `>&2` can also come first: `>&2 echo ...`. Any non-zero status signals failure, but use the one the question asks for."},{"id":"d4-q-08","topic":"d4-variables","type":"mcq","q":"Which line stores the value 5 in variable `x`?","options":["`x = 5`","`x=5`","`$x=5`","`x =5`"],"answer":1,"explain":"No spaces around `=`, and no `$` on the left. `x = 5` and `x =5` run a command named `x`; `$x=5` expands `x` first and tries to run the result as a command."},{"id":"d4-q-09","topic":"d4-variables","type":"output","q":"What does this print?","code":"a=2\nb=\"some string\"\nc=$a$b\necho \"$c\"","answer":"2some string","explain":"Writing two expansions side by side concatenates them."},{"id":"d4-q-10","topic":"d4-variables","type":"output","q":"What does this print? (The variable `in_` has never been assigned.)","code":"in=\"my file\"\nout=\"$in_.bak\"\necho \"[$out]\"\nout=\"${in}_.bak\"\necho \"[$out]\"","answer":"[.bak]\n[my file_.bak]","explain":"`$in_` is the unset variable `in_`, which expands to empty. Braces end the name: `${in}_.bak`. This is the notebook's `bad_backup.sh` bug."},{"id":"d4-q-11","topic":"d4-variables","type":"output","q":"What does this print?","code":"yrs={2020..2029..3}\necho \"$yrs\"\nsum=$(( 5 + 3 ))\necho \"$sum\"","answer":"{2020..2029..3}\n8","explain":"Brace expansion does not happen in an assignment, so `yrs` holds the literal text. Arithmetic expansion does happen."},{"id":"d4-q-12","topic":"d4-variables","type":"output","q":"What does this print?","code":"name=Sam\necho \"Hello, ${name}!\"\necho 'Hello, ${name}!'","answer":"Hello, Sam!\nHello, ${name}!","explain":"Double quotes allow parameter expansion; single quotes turn all expansion off."},{"id":"d4-q-13","topic":"d4-variables","type":"mcq","q":"A script runs `cp $1 $2` and is called as `./c.sh \"my notes\" backup`. What happens?","options":["It copies `my notes` to `backup`","`cp` receives three arguments `my`, `notes`, `backup`, so it tries to copy two files named `my` and `notes` into a directory `backup`","Bash reports a syntax error","It copies `my notes` to a file named `$2`"],"answer":1,"explain":"Unquoted `$1` is split at the space. Write `cp \"$1\" \"$2\"`."},{"id":"d4-q-14","topic":"d4-variables","type":"short","q":"How can you concatenate two strings stored in `str1` and `str2` and store the result in `str3`? (Quiz 1)","answer":"`str3=$str1$str2`","explain":"Also correct: `str3=\"$str1$str2\"` or `str3=${str1}${str2}`."},{"id":"d4-q-15","topic":"d4-variables","type":"short","q":"Write one line that stores the octal permissions of the file whose name is in `src` in a variable `perm` (use `stat -c %a`).","answer":"`perm=$(stat -c %a \"$src\")`","explain":"Command substitution `$( )` captures the output. The quotes around `$src` are required in case the name has spaces."},{"id":"d4-q-16","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=\"abcdefghij\"\necho \"${s:2:3}\"\necho \"${s: -3}\"\necho \"${s:1:-2}\"","answer":"cde\nhij\nbcdefgh","explain":"Indexes start at 0. `${s:2:3}` is 3 characters from index 2. `${s: -3}` is the last 3. A negative length stops that many characters before the end."},{"id":"d4-q-17","topic":"d4-strings","type":"output","q":"What does this print? (Notice there is no space after the colon.)","code":"s=\"abcdefghij\"\necho \"${s:-3}\"","answer":"abcdefghij","explain":"`:-` is the default-value expansion: `s` is set and non-empty, so its value is used. For the last 3 characters you need `${s: -3}`."},{"id":"d4-q-18","topic":"d4-strings","type":"output","q":"What does this print?","code":"f=\"file.txt.zip\"\necho \"${f#*.}\"\necho \"${f##*.}\"\necho \"${f%.*}\"\necho \"${f%%.*}\"","answer":"txt.zip\nzip\nfile.txt\nfile","explain":"`#` removes from the front, `%` from the end; one symbol = shortest match, two = longest."},{"id":"d4-q-19","topic":"d4-strings","type":"output","q":"What does this print?","code":"p=\"/home/user1/somedir/myfile\"\necho \"${p%/*}\"\necho \"${p##*/}\"","answer":"/home/user1/somedir\nmyfile","explain":"`${p%/*}` removes the shortest end part matching `/*` (`/myfile`). `${p##*/}` removes the longest front part matching `*/`."},{"id":"d4-q-20","topic":"d4-strings","type":"output","q":"What does this print?","code":"p=\"./myfile\"\ndir=${p%/*}\necho \"$dir/.trash\"\np=\"myfile\"\necho \"${p%/*}\"","answer":"./.trash\nmyfile","explain":"With `./myfile`, the directory is `.`. With no `/` at all, the pattern does not match and nothing is removed."},{"id":"d4-q-21","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=\"sparring with a purple porpoise\"\necho \"${s/p/t}\"\necho \"${s//p/}\"\necho \"$s\"","answer":"starring with a purple porpoise\nsarring with a urle oroise\nsparring with a purple porpoise","explain":"One slash replaces the first `p`; two slashes with an empty replacement delete every `p`. The variable itself is never changed."},{"id":"d4-q-22","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=abcdef\nn=$(( ${#s} / 2 ))\necho \"${s:0:n}\" \"${s:n}\"","answer":"abc def","explain":"`${#s}` is 6, so `n` is 3. `${s:0:n}` is the first 3 characters and `${s:n}` the rest. (Quiz 1 Q3A.)"},{"id":"d4-q-23","topic":"d4-strings","type":"output","q":"What does this print?","code":"unset v\necho \"[${v-none}] [${v:-none}]\"\nv=\"\"\necho \"[${v-none}] [${v:-none}]\"","answer":"[none] [none]\n[] [none]","explain":"Without a colon only *unset* triggers the default; with a colon, *empty* does too."},{"id":"d4-q-24","topic":"d4-strings","type":"output","q":"What does this print?","code":"unset v\necho \"${v:=hello}\"\necho \"$v\"\nw=abc\necho \"[${w:+set}]\"","answer":"hello\nhello\n[set]","explain":"`:=` substitutes and also assigns the default, so `v` keeps `hello`. `:+` gives the alternate word because `w` is non-empty."},{"id":"d4-q-25","topic":"d4-strings","type":"mcq","q":"`f=\"photo.backup.jpg\"`. Which expansion gives `photo.backup.png`?","options":["`${f%%.*}.png`","`${f%.*}.png`","`${f#*.}.png`","`${f/jpg/.png}`"],"answer":1,"explain":"`${f%.*}` removes only the last extension (`photo.backup`). `%%` removes `.backup.jpg` (gives `photo.png`). `#*.` removes the front (`backup.jpg.png`). The last gives `photo.backup..png`."},{"id":"d4-q-26","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=7; y=2\necho $(( x / y )) $(( x % y )) $(( x ** y ))","answer":"3 1 49","explain":"Integer division drops the fraction; `%` is the remainder; `**` is power."},{"id":"d4-q-27","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=5\nx=$x+1\necho $x\nx=5\nx=$(( x + 1 ))\necho $x","answer":"5+1\n6","explain":"A plain assignment just builds a string. Only `$(( ))` (or `(( ))`) does arithmetic."},{"id":"d4-q-28","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=abc; y=5\n(( z = x + y ))\necho $z\n(( z++ ))\n(( z *= 2 ))\necho $z","answer":"5\n12","explain":"A non-numeric value counts as 0, so `z` is 5; then 6; then 12."},{"id":"d4-q-29","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"(( 0 + 0 ))\necho $?\n(( 2 - 1 ))\necho $?","answer":"1\n0","explain":"`(( ))` succeeds (status 0) when the value is non-zero and fails (status 1) when it is 0."},{"id":"d4-q-30","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"echo $(( 2 + 3 * 4 )) $(( (2 + 3) * 4 ))\necho $(( 10 / 3 * 3 )) $(( 10 * 3 / 3 ))","answer":"14 20\n9 10","explain":"Normal precedence (`*` before `+`). `10 / 3` is 3, so `10 / 3 * 3` is 9: the fraction is lost before multiplying."},{"id":"d4-q-31","topic":"d4-arithmetic","type":"mcq","q":"Which line prints a random integer from 1 to 10 inclusive?","options":["`echo $(( RANDOM % 10 ))`","`echo $(( RANDOM % 10 + 1 ))`","`echo $(( RANDOM % 11 ))`","`echo $RANDOM % 10 + 1`"],"answer":1,"explain":"`RANDOM % 10` is 0 to 9, plus 1 gives 1 to 10. `% 11` gives 0 to 10. The last has no arithmetic expansion, so it prints a number followed by the literal text `% 10 + 1`."},{"id":"d4-q-32","topic":"d4-arithmetic","type":"short","q":"Write the start of a script that requires **at least** 2 arguments: if fewer are given it prints `need 2 args` to standard error and exits with status 1.","answer":"```bash\n#!/bin/bash\n\nif (( $# < 2 )); then\n    echo \"need 2 args\" >&2\n    exit 1\nfi\n```","explain":"Also correct: `[[ $# -lt 2 ]]` (conditionals, next day). `(( $# < 2 ))` compares numbers."}],"write":[{"id":"d4-w-01","topic":"d4-variables","stage":"worked","marks":4,"prompt":"**Quiz 1, Question 4 (4 marks).** Write a script that accepts two command line arguments that are both file names. The first argument is the name of the source file, and the second is the name of the destination file.\n\nThe script sets the permissions of the destination file to be equal to the permissions of the source file (it copies the permissions from the source to the destination).\n\nNo error checking is required: two arguments are always given and both files exist. Recall that `stat -c %a filename` prints the three-digit octal permissions of `filename`.","starter":"","solution":"#!/bin/bash\n\n# copyperm.sh: copy the permissions of file $1 to file $2\n\nsrc=$1\ndest=$2\n\n# permissions of src, e.g. 640\nperm=$(stat -c %a \"$src\")\n\nchmod \"$perm\" \"$dest\"","explain":"1. `#!/bin/bash` makes it a Bash script.\n2. `src=$1` and `dest=$2` give the arguments readable names. (Quoting the right side of a plain assignment is optional.)\n3. `$(stat -c %a \"$src\")` runs `stat` and is replaced by its output, e.g. `640`. Storing it in `perm` is **command substitution into a variable**.\n4. `chmod` accepts an octal mode (Day 2), so `chmod \"$perm\" \"$dest\"` sets exactly the same permissions.\n\nThe posted solution marks the quotes around `\"$src\"` and `\"$dest\"` as **required**: without them a filename such as `my notes.txt` is split into two arguments. Quoting `\"$perm\"` is harmless and a good habit.\n\nA one-line version is also correct: `chmod \"$(stat -c %a \"$1\")\" \"$2\"`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and using `$1` / `$2` for source and destination"},{"marks":1,"item":"Gets the source permissions with command substitution `$(stat -c %a ...)`"},{"marks":1,"item":"Applies them with `chmod PERM dest`"},{"marks":1,"item":"Filename expansions quoted: `\"$src\"` and `\"$dest\"`"}],"pitfalls":["Forgetting `$( )`: `perm=stat -c %a $src` is not command substitution.","Unquoted `$src` / `$dest` break on filenames with spaces.","Using `ls -l` and trying to parse the output instead of `stat -c %a`."]},{"id":"d4-w-02","topic":"d4-strings","stage":"worked","marks":10,"prompt":"**Quiz 1, Question 5 (10 marks).** Create a script `trash.sh` that moves a single file into a hidden trashcan directory by performing these steps:\n\n1. finds the name of the directory `dir` that the file is located in\n2. creates a directory named `.trash` in `dir`\n3. changes the permissions of `.trash` so that the owner has all permissions and all other users have none\n4. prints the message `moving filename to the trashcan` where `filename` is the first command line argument\n5. moves the file into the `.trash` directory created in Step 2\n\nNo error checking is required: one argument is always given, it is the pathname of a file you own, and the pathname always includes the directory (for example `./myfile` or `/home/user1/somedir/myfile`). Ignore the error from Step 2 if `.trash` already exists.\n\nHint: `${str%pattern}` removes the shortest trailing part of `str` that matches `pattern`.","starter":"","solution":"#!/bin/bash\n\n# trash.sh: move a file into a hidden .trash directory next to it\n\npathname=$1\n\n# Step 1: the directory part of the pathname\ndir=${pathname%/*}\n\n# Step 2\ntrashdir=$dir/.trash\nmkdir \"$trashdir\"\n\n# Step 3\nchmod 700 \"$trashdir\"        # or: chmod u=rwx,go= \"$trashdir\"\n\n# Step 4\necho \"moving $pathname to the trashcan\"\n\n# Step 5\nmv \"$pathname\" \"$trashdir\"","explain":"- **Step 1.** `${pathname%/*}` removes the shortest end part matching `/*`, that is, the last `/` and the filename. `./myfile` gives `.` and `/home/user1/somedir/myfile` gives `/home/user1/somedir`. This is why the question guarantees the pathname contains a `/`.\n- **Step 2.** Building `trashdir=$dir/.trash` once avoids typing it three times. `mkdir \"$trashdir\"` creates it.\n- **Step 3.** Owner `rwx`, group and others nothing is `700` in octal, or symbolically `u=rwx,go=`.\n- **Step 4.** Double quotes let `$pathname` expand inside the message.\n- **Step 5.** `mv FILE DIR` moves the file into the directory.\n\n**Watch out for the typo in the posted solution:** it ends with `mv \"$pathname $trashdir\"`. Those quotes make the two expansions **one** argument (`./myfile ./.trash`), so `mv` complains about a missing destination. The correct line quotes each expansion separately: `mv \"$pathname\" \"$trashdir\"`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and uses `$1` as the pathname"},{"marks":2,"item":"Step 1: `dir=${pathname%/*}` (or equivalent)"},{"marks":1,"item":"Step 2: `mkdir \"$dir/.trash\"`"},{"marks":2,"item":"Step 3: `chmod 700` or `chmod u=rwx,go=` on `.trash`"},{"marks":1,"item":"Step 4: `echo \"moving $pathname to the trashcan\"` with the exact message"},{"marks":2,"item":"Step 5: `mv \"$pathname\" \"$dir/.trash\"`"},{"marks":1,"item":"All pathnames quoted as separate arguments"}],"pitfalls":["`mv \"$pathname $trashdir\"` (one quoted string) is wrong: quote each argument on its own.","`${pathname#*/}` or `${pathname%%/*}` remove the wrong part. Test your expansion on `/home/user1/somedir/myfile`.","`chmod 600` is not \"all permissions\" for the owner: a directory needs `x` to be entered.","Single quotes around the message would print `$pathname` literally."]},{"id":"d4-w-03","topic":"d4-strings","stage":"faded","marks":4,"prompt":"Write `newext.sh FILE EXT` that renames `FILE` so that its **last** extension is replaced by `EXT`. For example `./newext.sh report.txt md` renames `report.txt` to `report.md`, and `./newext.sh archive.tar.gz zip` renames `archive.tar.gz` to `archive.tar.zip`. Filenames may contain spaces. No error checking is required. Fill in the blanks.","starter":"#!/bin/bash\n\n# newext.sh: replace the last extension of $1 with $2\n\nf=____\next=____\n\nbase=${f____}\nmv ____ ____","solution":"#!/bin/bash\n\n# newext.sh: replace the last extension of $1 with $2\n\nf=$1\next=$2\n\nbase=${f%.*}\nmv \"$f\" \"$base.$ext\"","explain":"`${f%.*}` removes the **shortest** end part matching `.*`, which is only the last extension. `${f%%.*}` would remove `.tar.gz` and give `archive.zip`. In the `mv` destination, `\"$base.$ext\"` is safe without braces because `.` cannot be part of a variable name.","rubric":[{"marks":1,"item":"Arguments stored from `$1` and `$2`"},{"marks":1,"item":"`${f%.*}` (shortest match from the end)"},{"marks":1,"item":"New name built as base, `.`, extension"},{"marks":1,"item":"`mv` with both names quoted"}],"pitfalls":["Using `%%` removes every extension, not just the last.","Forgetting the `.` between base and extension gives `reportmd`."]},{"id":"d4-w-04","topic":"d4-strings","stage":"faded","marks":3,"prompt":"Write `swap.sh STRING` that prints the second half of `STRING` followed immediately by the first half, on one line. The first half has `${#s} / 2` characters (integer division). Examples: `./swap.sh abcdef` prints `defabc`; `./swap.sh abcde` prints `cdeab`. Fill in the blanks.","starter":"#!/bin/bash\n\n# swap.sh: print the second half of $1 then the first half\n\ns=$1\nn=____\nfirst=${s:____}\nsecond=${s:____}\necho \"____\"","solution":"#!/bin/bash\n\n# swap.sh: print the second half of $1 then the first half\n\ns=$1\nn=$(( ${#s} / 2 ))\nfirst=${s:0:n}\nsecond=${s:n}\necho \"$second$first\"","explain":"Same idea as Quiz 1 Q3A. `${s:0:n}` is the first `n` characters, `${s:n}` is everything from index `n` to the end. Concatenation is just writing `$second$first` side by side.","rubric":[{"marks":1,"item":"`n=$(( ${#s} / 2 ))`"},{"marks":1,"item":"`${s:0:n}` and `${s:n}` for the two halves"},{"marks":1,"item":"Prints them concatenated in the right order, quoted"}],"pitfalls":["`n=${#s} / 2` is not arithmetic; you need `$(( ))`.","`${s:n:n}` drops the last character when the length is odd."]},{"id":"d4-w-05","topic":"d4-arithmetic","stage":"faded","marks":5,"prompt":"Write `avg.sh A B` for two integers. If the script does not get **exactly** two arguments, it prints `Usage: avg.sh a b` to **standard error** and exits with status 1. Otherwise it prints one line, `average: Q remainder: R`, where `Q` and `R` are the quotient and remainder of `(A + B)` divided by 2. Example: `./avg.sh 7 4` prints `average: 5 remainder: 1`. Fill in the blanks.","starter":"#!/bin/bash\n\n# avg.sh: integer average of two numbers\n\nif (( ____ )); then\n    echo \"Usage: avg.sh a b\" ____\n    exit ____\nfi\n\nsum=____\necho \"average: ____ remainder: ____\"","solution":"#!/bin/bash\n\n# avg.sh: integer average of two numbers\n\nif (( $# != 2 )); then\n    echo \"Usage: avg.sh a b\" >&2\n    exit 1\nfi\n\nsum=$(( $1 + $2 ))\necho \"average: $(( sum / 2 )) remainder: $(( sum % 2 ))\"","explain":"`$#` is the number of arguments, and `(( $# != 2 ))` is true when it is not 2. `>&2` sends the usage message to standard error and `exit 1` stops the script. Arithmetic expansions can go straight inside the double-quoted message.","rubric":[{"marks":1,"item":"Tests `$#` against 2 with `(( $# != 2 ))` (or equivalent)"},{"marks":1,"item":"Usage message to standard error with `>&2`"},{"marks":1,"item":"`exit 1` on error"},{"marks":1,"item":"Sum computed with arithmetic expansion"},{"marks":1,"item":"Quotient with `/` and remainder with `%` printed in the exact format"}],"pitfalls":["`echo \"Usage...\"` without `>&2` goes to standard output.","`(( $# < 2 ))` lets 3 arguments through; the question says exactly two."]},{"id":"d4-w-06","topic":"d4-strings","stage":"blank","marks":8,"prompt":"Write a script `mkbackup.sh` that takes one command line argument, the pathname of a file. The pathname always includes the directory the file is in (for example `./notes.txt` or `/home/user1/docs/my notes.txt`).\n\n1. If the script does not get exactly one argument, print `Usage: mkbackup.sh pathname` to standard error and exit with status 1.\n2. Find the directory `dir` that the file is in, and the file's name `name` (without the directory).\n3. Create a directory named `backup` inside `dir`.\n4. Copy the file into `backup`, naming the copy `name.bak` (so `my notes.txt` is copied to `my notes.txt.bak`).\n5. Make the copy read-only for the owner and give no permissions to anyone else.\n6. Print `backed up NAME to DIR/backup` where `NAME` is the file's name and `DIR` is the directory.\n\nIgnore the error if `backup` already exists.","starter":"","solution":"#!/bin/bash\n\n# mkbackup.sh: copy a file into a backup directory next to it\n\nif (( $# != 1 )); then\n    echo \"Usage: mkbackup.sh pathname\" >&2\n    exit 1\nfi\n\npathname=$1\ndir=${pathname%/*}\nname=${pathname##*/}\n\nbackupdir=$dir/backup\nmkdir \"$backupdir\"\ncp \"$pathname\" \"$backupdir/$name.bak\"\nchmod 400 \"$backupdir/$name.bak\"\necho \"backed up $name to $backupdir\"","explain":"Running `./mkbackup.sh \"pics/old stuff/cat 1.jpg\"` prints `backed up cat 1.jpg to pics/old stuff/backup` and creates `pics/old stuff/backup/cat 1.jpg.bak` with permissions `r--------`.","rubric":[{"marks":1,"item":"Checks `$#` is exactly 1"},{"marks":1,"item":"Usage message to stderr and `exit 1`"},{"marks":1,"item":"`dir=${pathname%/*}`"},{"marks":1,"item":"`name=${pathname##*/}`"},{"marks":1,"item":"`mkdir` of `dir/backup`"},{"marks":1,"item":"`cp` to `backup/name.bak`"},{"marks":1,"item":"`chmod 400` (or `u=r,go=`) on the copy"},{"marks":1,"item":"Correct message, and all pathnames quoted"}],"pitfalls":["Swapping `%` and `##`: test them on `/home/user1/docs/a.txt` before you hand in.","Forgetting the quotes: the example name has spaces in both the directory and the file.","`chmod 400` must be applied to the copy, not the original or the directory."]},{"id":"d4-w-07","topic":"d4-strings","stage":"blank","marks":5,"prompt":"Write `userid.sh FIRST LAST` that prints a user id made of the **first letter of FIRST** followed by **at most the first 7 characters of LAST**, all in lowercase. If it does not get exactly 2 arguments, it prints `Usage: userid.sh first last` to standard error and exits with status 1.\n\nExamples: `./userid.sh Barry Cade` prints `bcade`; `./userid.sh Holly Fitzgerald` prints `hfitzger`.","starter":"","solution":"#!/bin/bash\n\n# userid.sh: make a user id from a first and last name\n\nif (( $# != 2 )); then\n    echo \"Usage: userid.sh first last\" >&2\n    exit 1\nfi\n\nfirst=$1\nlast=$2\nid=${first:0:1}${last:0:7}\necho \"${id,,}\"","explain":"`${last:0:7}` is safe for short names: asking for more characters than exist just gives the whole string (`Cade`). `${id,,}` converts every character to lowercase.","rubric":[{"marks":1,"item":"Argument count check with `$#`"},{"marks":1,"item":"Usage to stderr and `exit 1`"},{"marks":1,"item":"`${first:0:1}` for the first letter"},{"marks":1,"item":"`${last:0:7}` for at most 7 characters"},{"marks":1,"item":"Concatenates and lowercases with `${id,,}`"}],"pitfalls":["`${last:1:7}` starts at the second character: indexes start at 0.","`${id^^}` is uppercase; lowercase is `,,`."]},{"id":"d4-w-08","topic":"d4-arithmetic","stage":"blank","marks":5,"prompt":"Write `hms.sh SECONDS` that converts a number of seconds into hours, minutes and seconds and prints them in the form `1h 2m 5s` (for `./hms.sh 3725`). If it does not get exactly one argument it prints `Usage: hms.sh seconds` to standard error and exits with status 1. Use integer arithmetic only.","starter":"","solution":"#!/bin/bash\n\n# hms.sh: convert a number of seconds to hours, minutes and seconds\n\nif (( $# != 1 )); then\n    echo \"Usage: hms.sh seconds\" >&2\n    exit 1\nfi\n\ntotal=$1\nh=$(( total / 3600 ))\nm=$(( total % 3600 / 60 ))\ns=$(( total % 60 ))\necho \"${h}h ${m}m ${s}s\"","explain":"`3725 / 3600` is 1 hour. The leftover `3725 % 3600` is 125 seconds, and `125 / 60` is 2 minutes. `3725 % 60` is 5 seconds. The braces in `${h}h` are **required**: `$hh` would be the unset variable `hh`.","rubric":[{"marks":1,"item":"Argument count check, usage to stderr, `exit 1`"},{"marks":1,"item":"Hours with `/ 3600`"},{"marks":1,"item":"Minutes with `% 3600 / 60` (or equivalent)"},{"marks":1,"item":"Seconds with `% 60`"},{"marks":1,"item":"Output in the exact format, using `${h}h` style braces"}],"pitfalls":["`echo \"$hh $mm $ss\"` prints three empty values: braces are needed before the letters.","`total / 60` alone gives total minutes (62), not the minutes part (2)."]}]},{"day":5,"title":"Regular expressions and making decisions","goal":"Write if statements with file, string and integer tests, combine them with ! && ||, and use regular expressions with =~ and grep to validate input, as in Assignment 3's testpw.sh.","topics":[{"id":"d5-if","title":"Conditional statements: if, [[ ]] and tests","notebook":"bash/conditional_statements.ipynb","priority":"high","examNote":"Quiz 2 Q1E: *write an `if` statement that prints `not readable` if the file named in `f` is not readable* (`if [[ ! -r $f ]]; then echo \"not readable\"; fi`). Every long exam script starts with an argument check that prints a usage message to stderr and exits with a non-zero status (Assignment 3: `testpw.sh`, `tr220.sh`).","blocks":[{"type":"md","text":"Until now your scripts ran every line, top to bottom. Today they start to **make decisions**: do one thing if a file exists, something else if it does not; print a usage message if the user forgot an argument.\n\n### The shape of an `if` statement\n\n```bash\nif test-commands; then\n    commands\nelif test-commands; then\n    commands\nelse\n    commands\nfi\n```\n\n- `if`, `then`, `elif`, `else` and `fi` are **keywords**. `fi` is `if` backwards and ends the statement.\n- `elif` (\"else if\") and `else` are optional. You can have many `elif` parts.\n- The `;` before `then` is required **when `then` is on the same line** as the condition. The `;` separates commands, just like a new line does. So this is the same statement:\n\n```bash\nif test-commands\nthen\n    commands\nfi\n```"},{"type":"pitfall","text":"Forgetting `fi`, or writing `if ... then` with no `;` on one line (`if [[ -e $f ]] then`), is a syntax error. On paper, write `if ...; then` and immediately write the matching `fi` underneath before filling in the middle."},{"type":"check","q":"Write a one-line `if` statement that prints `hi` if the condition `true` succeeds. Where does the `;` go?","a":"`if true; then echo \"hi\"; fi`. A `;` goes before `then` (because it is on the same line) and before `fi` (to end the `echo` command)."},{"type":"md","text":"### The condition is a command: its exit status decides\n\nThis is the unusual part of Bash. The condition of an `if` is not a \"boolean expression\" like in Java. It is **a command**. Bash runs it and looks at its **exit status** (Day 1):\n\n- exit status `0` (success) means **true**, so the `then` part runs;\n- any non-zero exit status (failure) means **false**, so the `elif`/`else` part runs.\n\nThe command `true` does nothing and exits with `0`; `false` does nothing and exits with `1`:"},{"type":"code","code":"$ if true; then echo \"true\"; fi\ntrue\n$ if false; then echo \"false\"; fi\n$","caption":"if false prints nothing: the condition failed and there is no else."},{"type":"md","text":"Any command works as a condition. The course script `cdls2.sh` tries to `cd` into a directory, and uses the exit status of `cd` to decide what to do:"},{"type":"code","code":"#!/bin/bash\n\n# cdls2.sh\n\nif cd \"$1\" 2> /dev/null      # discard standard error output of cd command\nthen\n    # cd successful\n    ls\nelse\n    # cd unsuccessful\n    echo \"error changing to directory $1\" >&2\n    exit 1\nfi"},{"type":"code","code":"$ ./cdls2.sh /bad_dirname\nerror changing to directory /bad_dirname\n$ echo $?\n1"},{"type":"md","text":"Two details:\n\n- `2> /dev/null` throws away `cd`'s own error message. `/dev/null` is the **null device**: a file that discards everything written to it. We only want `cd`'s exit status, not its complaint.\n- `echo \"...\" >&2` sends **our** error message to standard error (Day 3), and `exit 1` ends the script with a failure status. This \"message to stderr, then exit non-zero\" pattern appears in almost every exam script."},{"type":"check","q":"In `if cd \"$1\" 2> /dev/null`, what decides whether the `then` part runs, and what does `2> /dev/null` do?","a":"The exit status of `cd`: 0 (it worked) runs `then`, non-zero runs `else`. `2> /dev/null` discards `cd`'s error message (standard error) so the user only sees the script's own message."},{"type":"why","q":"Why can `if` use `grep` or `cd` as a condition, but `if 5 > 3` does not compare numbers?","a":"Because `if` only ever runs a command and checks its exit status. `if 5 > 3` runs a command named `5` with its output redirected into a file named `3`. To evaluate a comparison you need a command whose job is to evaluate it and set the exit status: `[[ ]]` or `(( ))`."},{"type":"md","text":"### `[[ ]]`: a command that evaluates a logical expression\n\nTo test things like \"does this file exist?\" or \"are these strings equal?\" we need a command that evaluates the expression and sets its exit status to `0` (true) or `1` (false).\n\n- The standard UNIX command for this is `test`, usually written with single brackets: `[ expr ]`. Learn it only if you need scripts that run on many kinds of UNIX shells.\n- Bash (and zsh) also provide **double brackets** `[[ expr ]]`. It has fewer surprises and is what this course uses.\n\n`[[ expr ]]` has exit status `0` if *expr* is true and `1` if it is false."},{"type":"code","code":"$ [[ 5 -lt 7 ]]\n$ echo $?\n0\n$ [[ 5 -gt 7 ]]\n$ echo $?\n1"},{"type":"md","text":"**Spaces are required** after `[[` and before `]]`. `[[` is a word to Bash, like a command name. Without the space, `[[$x` is read as one strange word:"},{"type":"code","code":"$ x=5\n$ if [[$x == 5]]; then echo hi; fi\nbash: [[5: command not found"},{"type":"md","text":"**No word splitting or filename expansion happens inside `[[ ]]`.** So inside `[[ ]]` you usually do not need to double quote variable expansions: `[[ -e $file ]]` works even if `$file` contains spaces. (The course still wants `\"$var\"` everywhere else: in `echo`, `cp`, `mv`, `cd` and so on.) The single-bracket `[ ]` *does* split words, which is one of its surprises:"},{"type":"code","code":"$ s=\"hello world\"\n$ if [ $s == \"hello world\" ]; then echo eq; fi\nbash: [: too many arguments\n$ if [[ $s == \"hello world\" ]]; then echo eq; fi\neq"},{"type":"check","q":"What is wrong with `if [[$name == bob]]; then echo hi; fi`?","a":"There must be a space after `[[` and before `]]`: `if [[ $name == bob ]]; then echo hi; fi`."},{"type":"md","text":"### File tests\n\nFiles are central in UNIX, so there are many tests for them. The ones to memorise:\n\n| Expression | True if ... |\n|---|---|\n| `-e file` | file **e**xists (any kind of file) |\n| `-f file` | file exists and is a regular **f**ile |\n| `-d file` | file exists and is a **d**irectory |\n| `-r file` | file exists and is **r**eadable |\n| `-w file` | file exists and is **w**ritable |\n| `-x file` | file exists and is e**x**ecutable |\n| `-s file` | file exists and has **s**ize greater than zero |\n| `f1 -nt f2` | f1 is newer (modification time) than f2 |\n| `f1 -ot f2` | f1 is older than f2 |\n\nThe course script `test_file.sh` uses several of them (it is a nice model of **nested** `if` statements):"},{"type":"code","code":"#!/bin/bash\n#\n# test_file.sh: Evaluate the status of a file\n\nfile=$1\nif [[ -e $file ]]; then                # no need to double quote $file\n                                       # because word splitting is suppressed\n  if [[ -f $file ]]; then\n    echo \"$file is a regular file\"\n  fi\n  if [[ -d $file ]]; then\n    echo \"$file is a directory\"\n  fi\n  if [[ -r $file ]]; then\n    echo \"$file is readable\"\n  fi\n  if [[ -w $file ]]; then\n    echo \"$file is writable\"\n  fi\n  if [[ -x $file ]]; then\n    echo \"$file is executable\"\n  fi\nelse\n  echo \"$file does not exist\"\n  exit 1\nfi"},{"type":"code","code":"$ ./test_file.sh scripts\nscripts is a directory\nscripts is readable\nscripts is writable\nscripts is executable\n$ ./test_file.sh notes.txt\nnotes.txt is a regular file\nnotes.txt is readable\nnotes.txt is writable\n$ ./test_file.sh no_such_file\nno_such_file does not exist","caption":"scripts is a directory and notes.txt is a file with rw-r--r-- permissions. A directory with x permission counts as \"executable\" (you can cd into it)."},{"type":"md","text":"To test the **opposite**, put `!` in front (more on `!` in the next topic). This is exactly Quiz 2 Q1E:\n\n```bash\nif [[ ! -r $f ]]; then echo \"not readable\"; fi\n```"},{"type":"check","q":"Write an `if` statement that prints `not readable` if the file whose name is stored in `f` is not readable.","a":"`if [[ ! -r $f ]]; then echo \"not readable\"; fi`"},{"type":"check","q":"`notes` is a directory. Which of `[[ -e notes ]]`, `[[ -f notes ]]`, `[[ -d notes ]]` are true?","a":"`-e` (it exists) and `-d` (it is a directory). `-f` is false: a directory is not a regular file."},{"type":"md","text":"### String tests\n\n| Expression | True if ... |\n|---|---|\n| `string` | the string is not empty |\n| `-n string` | the length of string is greater than zero |\n| `-z string` | the length of string is zero (empty) |\n| `s1 == s2` (or `s1 = s2`) | the strings are equal |\n| `s1 != s2` | the strings are not equal |\n| `s1 < s2` | s1 comes before s2 lexicographically (dictionary order) |\n| `s1 > s2` | s1 comes after s2 lexicographically |\n| `s1 =~ regex` | s1 matches the regular expression (topic 3) |\n\nThe course script `compstr.sh` does a Java-like `compareTo` of two strings using `if`/`elif`/`else`:"},{"type":"code","code":"#!/bin/bash\n\n# compstr.sh : Java-like compareTo comparison of strings\n\ns1=$1\ns2=$2\nif [[ $s1 == $s2 ]]; then\n    echo 0\nelif [[ $s1 < $s2 ]]; then\n    echo -1\nelse\n    echo 1\nfi"},{"type":"code","code":"$ ./compstr.sh cat cat\n0\n$ ./compstr.sh antelope zebra\n-1\n$ ./compstr.sh tiger poodle\n1\n$ ./compstr.sh 100 2\n-1"},{"type":"pitfall","text":"Inside `[[ ]]`, `==`, `<` and `>` compare **strings**, character by character, even if they look like numbers. `[[ 100 < 2 ]]` is **true** because the character `1` comes before `2`. To compare numbers use `-lt`, `-gt`, ... or `(( ))`."},{"type":"check","q":"What does `[[ 100 < 2 ]]; echo $?` print, and why?","a":"`0` (true). `<` inside `[[ ]]` compares strings lexicographically, and \"100\" comes before \"2\" because `1` comes before `2`."},{"type":"md","text":"#### Pattern matching with `==` and `!=`\n\nIf the right side of `==` or `!=` is **not quoted**, it is treated as a **pattern** (the same glob patterns as filename expansion on Day 2): `*` matches any sequence of characters (even none), `?` matches exactly one character, `[ ]` matches one character from a set."},{"type":"code","code":"$ str=\"avocado\"\n$ if [[ $str == a* ]]; then echo \"starts with a\"; else echo \"does not start with a\"; fi\nstarts with a\n$ if [[ $str == \"a*\" ]]; then echo \"equal\"; else echo \"not equal\"; fi\nnot equal\n$ str=\"K7L3N6\"\n$ if [[ $str == [A-Z][0-9][A-Z][0-9][A-Z][0-9] ]]; then echo \"might be a postal code\"; fi\nmight be a postal code","caption":"Quoting the right side turns the pattern into a plain string: \"a*\" only equals the two characters a and *."},{"type":"md","text":"A pattern like `a?a` matches any three-character string that starts and ends with `a` (`ada`, `aaa`, `a7a`). (The notebook's text writes `a*a` here, but `*` would also match `aa`, `abba`, ... ; `?` is the one-character wildcard.)\n\n`-z` and `-n` test for empty strings:"},{"type":"code","code":"$ s=\"\"\n$ if [[ -z $s ]]; then echo \"empty\"; else echo \"not empty\"; fi\nempty\n$ if [[ $s ]]; then echo \"not empty\"; else echo \"empty\"; fi\nempty"},{"type":"md","text":"#### `-v`: has a variable been assigned?\n\n`[[ -v varname ]]` is true if the variable has been assigned a value (even the empty string). Write the variable's **name**, not `$name`:"},{"type":"code","code":"$ unset x\n$ if [[ -v x ]]; then echo \"x assigned\"; else echo \"x not assigned\"; fi\nx not assigned\n$ x=\n$ if [[ -v x ]]; then echo \"x assigned\"; else echo \"x not assigned\"; fi\nx assigned"},{"type":"check","q":"What is the difference between `[[ $s == a* ]]` and `[[ $s == \"a*\" ]]`?","a":"Unquoted `a*` is a pattern: true for any string starting with `a`. Quoted `\"a*\"` is a plain string: true only if `s` is exactly the two characters `a*`."},{"type":"md","text":"### Integer tests\n\nTo compare integers inside `[[ ]]`, use these operators (think of the letters: **eq**ual, **n**ot **e**qual, **l**ess **t**han, ...):\n\n| Expression | True if ... |\n|---|---|\n| `a -eq b` | a == b |\n| `a -ne b` | a != b |\n| `a -lt b` | a < b |\n| `a -le b` | a <= b |\n| `a -gt b` | a > b |\n| `a -ge b` | a >= b |\n\nOr use **arithmetic** `(( ))` from Day 4, where `<`, `>`, `==`, `!=`, `<=`, `>=` *do* mean numeric comparison. `(( expr ))` has exit status `0` when *expr* is non-zero (true) and `1` when it is `0` (false), so it works as an `if` condition. Both styles are fine on the exam:"},{"type":"code","code":"$ if [[ 10 -lt 9 ]]; then echo \"less\"; else echo \"not less\"; fi\nnot less\n$ if (( 10 < 9 )); then echo \"less\"; else echo \"not less\"; fi\nnot less\n$ if [[ 10 < 9 ]]; then echo \"less\"; else echo \"not less\"; fi\nless","caption":"The last one is the string trap again: \"10\" < \"9\" as strings."},{"type":"md","text":"The course script `compint.sh` compares integers with a nested `if`:"},{"type":"code","code":"#!/bin/bash\n\n# compint.sh : Java-like compareTo comparison of integers\n\ni1=$1\ni2=$2\nif [[ $i1 -ne $i2 ]]; then           # not equal\n    if [[ $i1 -lt $i2 ]]; then           # less than\n        echo -1\n    else\n        echo 1\n    fi\nelse\n    echo 0\nfi"},{"type":"code","code":"$ ./compint.sh 5 5\n0\n$ ./compint.sh -3 12\n-1\n$ ./compint.sh 22 21\n1\n$ ./compint.sh hello goodbye\n0\n$ ./compint.sh abc 3\n-1\n$ ./compint.sh 2#101 1\n1"},{"type":"md","text":"Surprise: a non-integer such as `hello` used in an integer test is usually **treated as 0**, with no error (so `hello` and `goodbye` are \"equal\"). And `2#101` means 101 in base 2, which is 5. That is why real scripts check the input with a regular expression first (topic 3)."},{"type":"check","q":"Write a condition that is true when the integer in `n` is at least 10, in two ways.","a":"`[[ $n -ge 10 ]]` or `(( n >= 10 ))`."},{"type":"md","text":"### Checking the command line arguments (the usage message)\n\nBash does not complain if a script uses `$1` and the user gave no arguments: `$1` is just empty. So a script that needs arguments must check `$#` itself, print a **usage message to standard error**, and **exit with a non-zero status**. This is the first thing in almost every exam script:"},{"type":"code","code":"#!/bin/bash\n\n# namedsh.sh\n\nif [[ $# -ne 1 ]]; then\n    # oops, no filename specified\n    echo \"namedsh.sh: output filename required\" >&2\n    exit 2\nfi\n\nif [[ -e $1 ]]; then\n    # oops, specified file already exists\n    echo \"namedsh.sh: $1 already exists\" >&2\n    exit 1\nfi\n\n# specified does not exist, go ahead and create it\necho '#!/bin/bash' > \"$1\"\nchmod u+x \"$1\"","caption":"The course's namedsh.sh (with \"$1\" quoted, as the course requires in commands)."},{"type":"md","text":"The same check written with `(( ))`, as in the Arithmetic notebook and the course's `test_regex.sh`:\n\n```bash\nif (( $# != 1 )); then\n    echo \"Usage: myscript.sh filename\" >&2\n    exit 1\nfi\n```\n\nBecause `exit` ends the script, no `else` is needed: the rest of the script only runs when the arguments are fine. This \"guard clause\" style keeps scripts flat and readable."},{"type":"why","q":"Why does the usage message go to standard error (`>&2`) and why exit with a non-zero status?","a":"Standard error is for messages about problems, so they are not mixed into the script's real output (which may be piped or redirected to a file). A non-zero exit status tells whoever ran the script (a person, `if`, or a grading script) that it failed."},{"type":"md","text":"### Also seen in Bash: `case` (not in the course notebooks)\n\nYou may meet `case` elsewhere. It compares one word against several glob patterns:\n\n```bash\ncase $answer in\n    y|yes) echo \"OK\" ;;\n    n|no)  echo \"cancelled\" ;;\n    *)     echo \"please answer yes or no\" ;;\nesac\n```\n\nThe course notebooks never use it, so you do not need it for the midterm; an `if`/`elif` chain with `[[ $answer == ... ]]` does the same job."},{"type":"md","text":"### Key points\n\n- `if cmd; then ...; elif cmd; then ...; else ...; fi`: the condition is a **command**; exit status `0` means true.\n- `[[ expr ]]` evaluates file, string and integer tests. Spaces after `[[` and before `]]` are required.\n- File tests: `-e -f -d -r -w -x -s`. Strings: `== != < > -z -n`. Integers: `-eq -ne -lt -le -gt -ge` or `(( ))`.\n- Inside `[[ ]]`, `<` and `>` compare **strings**; an unquoted right side of `==`/`!=` is a **glob pattern**.\n- Usage check: `if (( $# != 1 )); then echo \"Usage: ...\" >&2; exit 1; fi`."}]},{"id":"d5-operators","title":"Conditional operators: ! && ||","notebook":"bash/conditional_operators.ipynb","priority":"medium","examNote":"Not asked on its own in past tests, but `!` appears in Quiz 2 Q1E (`[[ ! -r $f ]]`) and you need `&&`/`||` to combine tests in written scripts (e.g. a mark that must be a number *and* at most 100).","blocks":[{"type":"md","text":"Conditions can be **negated**, **combined** and **grouped** with these operators, listed from highest to lowest precedence (precedence = which operator is applied first, like `*` before `+` in math):\n\n1. `( expr )`: the value of *expr* (grouping)\n2. `! expr`: true if *expr* is false, false if *expr* is true\n3. `expr1 && expr2`: true if **both** are true; *expr2* is **not evaluated** if *expr1* is false\n4. `expr1 || expr2`: true if **either** is true; *expr2* is **not evaluated** if *expr1* is true\n\nThey work inside `[[ ]]` and, with the same meaning, inside `(( ))`."},{"type":"md","text":"### `!` (not)\n\nThe course example creates a file only if it does not already exist:"},{"type":"code","code":"file=./newfile\n\nif [[ ! -e $file ]]; then\n    echo \"Creating $file ...\"\n    touch \"$file\"\nelse\n    echo \"$file already exists\"\nfi"},{"type":"code","code":"$ ./create.sh\nCreating ./newfile ...\n$ ./create.sh\n./newfile already exists","caption":"Running the code above (saved as create.sh) twice."},{"type":"check","q":"Write a condition that is true when the file named in `f` is NOT a directory.","a":"`[[ ! -d $f ]]`"},{"type":"md","text":"### `&&` (and)\n\n\"Is the file a regular file **and** readable?\"\n\n```bash\nif [[ -f $file && -r $file ]]; then\n    echo \"$file is a regular file and readable by $USER\"\nelse\n    echo \"$file is not a regular file and/or not readable by $USER\"\nfi\n```\n\n**Short-circuit evaluation**: if the left side of `&&` is false, the whole thing is already false, so Bash does not even evaluate the right side. Likewise, if the left side of `||` is true, the right side is skipped."},{"type":"code","code":"$ f=nosuch\n$ if [[ -e $f && -r $f ]]; then echo \"ok\"; else echo \"not ok\"; fi\nnot ok","caption":"-e fails, so -r is never tested."},{"type":"md","text":"### `||` (or) and grouping with `( )`\n\nThe course's leap-year example: a year is a leap year if it is divisible by 400, **or** if it is divisible by 4 **and not** divisible by 100. This is arithmetic, so it goes in `(( ))`, where `%` is the remainder:"},{"type":"code","code":"yr=2000\nif (( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) )); then\n    echo \"$yr is a leap year\"\nelse\n    echo \"$yr is not a leap year\"\nfi"},{"type":"code","code":"2000 is a leap year","caption":"With yr=1900 it prints 1900 is not a leap year (divisible by 100 but not 400); with yr=2024, 2024 is a leap year."},{"type":"md","text":"The parentheses make the meaning clear. Because `&&` has higher precedence than `||`, they happen to be optional here, but writing them is clearer and costs nothing on an exam.\n\nInside `[[ ]]` the same operators combine tests:"},{"type":"code","code":"$ s=\"\"\n$ if [[ ! -z $s || -n $s ]]; then echo yes; else echo no; fi\nno","caption":"! -z \"\" is false, -n \"\" is false; false || false is false."},{"type":"check","q":"What does `x=15; if (( x > 3 && x < 10 )); then echo in; else echo out; fi` print?","a":"`out`. 15 > 3 is true but 15 < 10 is false, and `&&` needs both."},{"type":"why","q":"Why is `[[ -e $f && -r $f ]]` safe even when `f` names a file that does not exist?","a":"Short-circuiting: when `-e $f` is false, `&&` already knows the answer is false and never evaluates `-r $f`. (Here `-r` would also just be false, but in general short-circuiting lets the left test protect the right one.)"},{"type":"pitfall","text":"`&&` and `||` go **inside** one `[[ ]]`: `[[ -f $f && -r $f ]]`. One pair of brackets holds the whole combined condition."},{"type":"md","text":"### Key points\n\n- `!` negates, `&&` needs both, `||` needs either; `( )` groups. Precedence: `( )`, then `!`, then `&&`, then `||`.\n- Short-circuit: `&&` skips the right side if the left is false; `||` skips it if the left is true.\n- Use them inside `[[ ]]` for file/string tests and inside `(( ))` for arithmetic, e.g. the leap-year test.\n- Add parentheses when mixing `&&` and `||`: clearer for you and the marker."}]},{"id":"d5-regex","title":"Regular expressions, =~ and grep","notebook":"bash/regex.ipynb","priority":"high","examNote":"Quiz 2 Q1A: *what does `?` mean in a regex?* (zero or one instances of the preceding atom). Quiz 2 Q1B: *a regex matching strings that start and end with a lowercase letter*. Assignment 3 Q1 (`testpw.sh`) checks a password with `=~` and `[:space:]`, `[:alpha:]`, `[:digit:]`, `[:punct:]`, the model for a long written question.","blocks":[{"type":"md","text":"A **regular expression** (regex) is a string that describes a search **pattern** for text. You use one when you need to ask \"does this text look like X?\": an integer, a phone number, a password with at least one digit.\n\nBash uses the **POSIX extended regular expression** syntax. Warning: regexes use some of the same symbols as Bash's glob patterns (`*`, `?`, `[ ]`) but with **different meanings**. Keep them apart:\n\n| Symbol | Glob pattern (Day 2, `==`) | Regular expression |\n|---|---|---|\n| `*` | any sequence of characters | **zero or more of the preceding atom** |\n| `?` | exactly one character | **zero or one of the preceding atom** |\n| `.` | a literal dot | **any single character** |"},{"type":"md","text":"### The `=~` operator\n\nInside `[[ ]]`, `=~` does regex matching:\n\n```bash\nif [[ $str =~ $re ]]; then\n    echo \"$str matches $re\"\nfi\n```\n\nIt is true if **any part** of `$str` matches the pattern (the match does not have to cover the whole string unless you use anchors, see below). The course's `test_regex.sh` script is handy for experimenting:"},{"type":"code","code":"#!/bin/bash\n\n# test_regex.sh\n\nif (( $# != 2 )); then\n    echo \"Usage: test_regex string regex\" >&2\n    exit 1\nfi\nstr=$1\nre=$2\nif [[ $str =~ $re ]]; then\n    echo \"The string $str is matched by the regex $re\"\nelse\n    echo \"The string $str is not matched by the regex $re\"\nfi"},{"type":"md","text":"Ordinary characters match themselves:"},{"type":"code","code":"$ ./test_regex.sh hello a\nThe string hello is not matched by the regex a\n$ ./test_regex.sh walrus a\nThe string walrus is matched by the regex a\n$ ./test_regex.sh sandman and\nThe string sandman is matched by the regex and"},{"type":"pitfall","text":"**Do not quote the regex** on the right of `=~`. `[[ $str =~ \"$re\" ]]` matches `$re` as a plain string, character for character, not as a regex. Quoting only part (`^a\".\"c$`) makes that part literal. Store tricky regexes in a variable (`re='...'`) and write `[[ $str =~ $re ]]`."},{"type":"code","code":"$ re=\"a.c\"\n$ if [[ abc =~ $re ]]; then echo \"match\"; else echo \"no match\"; fi\nmatch\n$ if [[ abc =~ \"$re\" ]]; then echo \"match\"; else echo \"no match\"; fi\nno match"},{"type":"check","q":"Does `[[ sandman =~ and ]]` succeed? Why?","a":"Yes. Without anchors, `=~` succeeds if the pattern appears **anywhere** in the string, and `sandman` contains `and`."},{"type":"md","text":"### Metacharacters\n\nA regex is made of ordinary characters, which match themselves, and **metacharacters**, which have special meaning. Learn this table exactly as the course states it:\n\n| Metacharacter | Meaning |\n|---|---|\n| `^` | **anchor**: matches the beginning of the line (when first in the expression) |\n| `$` | **anchor**: matches the end of the line (when last in the expression) |\n| `.` | matches **any single character** |\n| `[ ]` | **bracket expression**: matches any single character inside the brackets |\n| `[^ ]` | matches any single character **not** inside the brackets |\n| `( )` | a **subexpression** (group) |\n| `*` | the preceding element **zero or more** times |\n| `?` | the preceding element **zero or one** time |\n| `+` | the preceding element **one or more** times |\n| `{m,n}` | the preceding element at least m and at most n times |\n| vertical bar (see below) | **choice**: matches the expression before or after it |\n\nMetacharacters **lose their special meaning inside square brackets**, so `[.]` matches a literal dot and `[(]` a literal parenthesis."},{"type":"md","text":"Examples (all from the notebook):\n\n| Regex | Matches |\n|---|---|\n| `hello` | any string containing the substring `hello` |\n| `^hello$` | exactly `hello` |\n| `^.ello$` | `1ello`, `Aello`, `jello`, ... (any one character, then `ello`) |\n| `^h..lo$` | `h11lo`, `hAylo`, `h@Mlo`, ... |\n| `^s[aei]t$` | `sat`, `set`, `sit` |\n| `^s[a-z]t$` | `sat`, `sbt`, ..., `szt` |\n| `^s[-a-z]t$` | `s-t`, `sat`, ..., `szt` (a `-` first in brackets is literal) |\n| `^file[0-9]$` | `file0`, ..., `file9` |\n| `^a[.]c$` | only `a.c` |\n\nAnchors matter: `hello` matches `Say hello`, but `^hello$` matches only the exact string `hello`. When a question says \"strings that **are** ...\" you almost always need both `^` and `$`."},{"type":"check","q":"Which strings does `^s[aei]t$` match? Does it match `seat`?","a":"Exactly `sat`, `set`, `sit`. Not `seat`: a bracket expression matches **one** character, and `^...$` forces the whole string to be three characters."},{"type":"md","text":"### Atoms and quantifiers\n\nAn **atom** is a single (ordinary) character, a bracket expression, or a subexpression `( )`. A **quantifier** (`*`, `?`, `+`, `{m,n}`) says how many times **the atom just before it** must match. That is the exam answer for Quiz 2 Q1A: *`?` means zero or one instances of the preceding atom.*\n\n| Regex | Matches |\n|---|---|\n| `^.*$` | all strings, including the empty string |\n| `^.+$` | all non-empty strings |\n| `^.?$` | the empty string and all strings of length one |\n| `[0-9]` | any string containing at least one digit |\n| `^[0-9]+$` | any unsigned integer (only digits, at least one) |\n| `^-[0-9]+$` | any negative integer |\n| `^[-+]?[0-9]+$` | any signed or unsigned integer |\n| `^[-+]?[[:digit:]]+$` | the same, using a POSIX class |\n| `^xa{1}$` | `xa` |\n| `^xa{1,}$` | `x` followed by one or more `a`s |\n| `^xa{1,3}$` | `xa`, `xaa`, or `xaaa` |\n| `^(abc)+$` | `abc`, `abcabc`, `abcabcabc`, ... |"},{"type":"code","code":"$ ./test_regex.sh color '^colou?r$'\nThe string color is matched by the regex ^colou?r$\n$ ./test_regex.sh colouur '^colou?r$'\nThe string colouur is not matched by the regex ^colou?r$","caption":"u? means: zero or one u. Single quotes stop Bash from touching $ and ? before the script sees them."},{"type":"pitfall","text":"A quantifier applies only to the **one atom** right before it. `^ab+$` matches `ab`, `abb`, `abbb` (more b's), not `abab`. To repeat several characters, group them: `^(ab)+$`."},{"type":"check","q":"What does the metacharacter `?` mean in a regular expression? (Quiz 2 Q1A)","a":"Zero or one instances (occurrences) of the preceding atom."},{"type":"md","text":"### POSIX character classes\n\nInside a bracket expression you can name a whole **class** of characters. Note the **double** brackets: the outer `[ ]` is the bracket expression, the inner `[: :]` is the class name.\n\n| Class | Matches one ... |\n|---|---|\n| `[[:digit:]]` | digit, same as `[0-9]` |\n| `[[:alpha:]]` | letter |\n| `[[:upper:]]` / `[[:lower:]]` | uppercase / lowercase letter |\n| `[[:alnum:]]` | letter or digit |\n| `[[:space:]]` | whitespace character (space, tab, newline, ...) |\n| `[[:blank:]]` | space or tab |\n| `[[:punct:]]` | punctuation/symbol character, such as `! @ # . , -` |\n\nThese are what Assignment 3's `testpw.sh` uses: `[[ $pw =~ [[:digit:]] ]]` is true if the password contains a digit anywhere.\n\nA note on ranges like `[a-z]`: in some locales (language settings) ranges can behave unexpectedly. The course examples (and this app) assume the standard `C` locale, where `[a-z]` is exactly the 26 lowercase letters. `[[:lower:]]` always means lowercase letters."},{"type":"check","q":"Write a test that is true if the string in `pw` contains at least one whitespace character.","a":"`[[ $pw =~ [[:space:]] ]]` (no anchors, so it matches anywhere in the string)."},{"type":"md","text":"### Choice `|` and subexpressions `( )`\n\nThe vertical bar `|` is the **choice** operator: `a|b` matches anything matching `a` **or** `b`. It has the **lowest** precedence: it splits the *whole* regex into two alternatives unless parentheses limit it.\n\n- `a|b` (alternatives `a` and `b`): any string containing an `a` or a `b`\n- `^b|cat$` (alternatives `^b` and `cat$`): any string starting with `b` **or** ending with `cat`\n- `^b|(^c)at$` (alternatives `^b` and `(^c)at$`): any string starting with `b`, or the string `cat`\n- `(^b|^c)at$` (alternatives `^b` and `^c`, inside the group): exactly `bat` or `cat`\n\nSo `^(19|20)[0-9][0-9]$` matches years 1900 to 2099, and `^(0[1-9]|1[0-2])$` matches months `01` to `12`."},{"type":"code","code":"$ ./test_regex.sh java \"a|b\"\nThe string java is matched by the regex a|b"},{"type":"check","q":"Does `^b|cat$` match `bobcat`? Does `(^b|^c)at$` match it?","a":"`^b|cat$`: yes (it starts with `b`; it also ends with `cat`). `(^b|^c)at$`: no, that only matches exactly `bat` or `cat`."},{"type":"md","text":"### Writing a regex: start and end with a lowercase letter (Quiz 2 Q1B)\n\n*Provide a regular expression that matches all strings that start and end with a lowercase English letter.* Build it piece by piece:\n\n1. Start with a lowercase letter: `^[a-z]`\n2. End with a lowercase letter: `[a-z]$`\n3. Anything in between: `.*`\n\nThat gives `^[a-z].*[a-z]$`. But it needs **at least two** characters, so the one-letter string `a` (which starts and ends with a lowercase letter) is not matched. Fix: make \"anything, then a final letter\" optional with `( )?`:\n\n```\n^[a-z](.*[a-z])?$\n```\n\nCheck it against test strings (assume the C locale):\n\n| String | `^[a-z]+$` | `^[a-z].*[a-z]$` | `^[a-z](.*[a-z])?$` |\n|---|---|---|---|\n| `a` | match | **no** | match |\n| `abc` | match | match | match |\n| `x-ray` | **no** | match | match |\n| `a1b` | **no** | match | match |\n| `aB` | no | no | no |\n| `Ab` | no | no | no |\n\nThe posted answer key accepted `^[a-z]+$` and `^[a-z]*[a-z]$` (these are the same pattern) as correct and `^[a-z].*[a-z]$` as sufficient. Notice that `^[a-z]+$` really means \"**only** lowercase letters\", so it rejects `x-ray`. Write `^[a-z](.*[a-z])?$` (or `^[a-z]$|^[a-z].*[a-z]$`): it is correct under any reading of the question."},{"type":"why","q":"Why does `^[a-z].*[a-z]$` fail to match the string `a`?","a":"It contains two separate `[a-z]` atoms, each of which must match one character, so the string needs at least two characters. With one character, the first `[a-z]` uses the `a` and nothing is left for the last `[a-z]`."},{"type":"md","text":"### `grep`: search files for lines that match a regex\n\n`grep` (\"global regular expression print\") prints the **lines** of files (or of standard input) that match a regex. Use `-E` for the extended syntax described above (without it, `grep` uses an older \"basic\" syntax in which `+ ? | { } ( )` are not special):\n\n```\ngrep -E [options] regex [file...]\n```\n\nUseful options taught in the course: `-n` (print line numbers), `-i` (ignore upper/lower case). If no file is given, `grep` reads standard input, so it works at the end of a pipe. Quote the regex (single quotes are safest) so the shell does not expand `*`, `?`, `$`, `|`, `[ ]` first."},{"type":"code","code":"$ cat bin.txt\nzip\ngzip\nzipinfo\nbunzip2\nfunzip\nunzip\n$ grep -E zip bin.txt\nzip\ngzip\nzipinfo\nbunzip2\nfunzip\nunzip\n$ grep -E '^zip' bin.txt\nzip\nzipinfo\n$ grep -E 'zip$' bin.txt\nzip\ngzip\nfunzip\nunzip","caption":"In the notebook the input is ls /usr/bin | grep -E zip; here a small file stands in for /usr/bin."},{"type":"code","code":"$ cat pets.txt\ncat\ndog\ncatalog\nCat\nbobcat\n$ grep -En 'o' pets.txt\n2:dog\n3:catalog\n5:bobcat\n$ grep -Ei 'cat$' pets.txt\ncat\nCat\nbobcat"},{"type":"md","text":"The notebook also finds `for` loops in a Java file with `grep -En \"for[[:blank:]]*[(]\" AllWordsLookup.java`: `for`, then zero or more blanks, then a literal `(` (the `(` is a metacharacter, so it is put inside `[ ]`). And a crossword helper: `grep -Ei \"^.ak.s$\" /usr/share/dict/words` finds five-letter words like `makes` and `takes`.\n\n`grep` also sets its exit status: `0` if some line matched, `1` if none did. So it can be an `if` condition:\n\n```bash\nif grep -E '^dog$' pets.txt > /dev/null; then\n    echo \"found\"\nfi\n```"},{"type":"check","q":"Write a command that prints, with line numbers, the lines of `log.txt` that start with `ERROR`.","a":"`grep -En '^ERROR' log.txt`"},{"type":"md","text":"### Putting it together: a validator script (Assignment 3 Q1 style)\n\nChecking that input \"looks right\" combines everything today: a usage check, `=~` with classes, `${#s}` for length (Day 4), `!`, and stderr messages. The trick for \"print a message for **every** failing rule\" is to **not exit early**: remember failure in a variable and exit at the end."},{"type":"code","code":"#!/bin/bash\n\n# isint.sh: is the argument an integer?\n\nif (( $# != 1 )); then\n    echo \"Usage: isint.sh value\" >&2\n    exit 1\nfi\n\nif [[ $1 =~ ^[-+]?[0-9]+$ ]]; then\n    echo \"$1 is an integer\"\nelse\n    echo \"$1 is not an integer\"\n    exit 2\nfi"},{"type":"code","code":"$ ./isint.sh -7\n-7 is an integer\n$ ./isint.sh 4x2\n4x2 is not an integer\n$ echo $?\n2\n$ ./isint.sh\nUsage: isint.sh value"},{"type":"md","text":"### Key points\n\n- `[[ $str =~ $re ]]` is true if **any part** of `str` matches; use `^` and `$` to match the whole string. Never quote the regex.\n- `.` any char, `[ ]` one char from a set, `[^ ]` one char not in the set, `*` 0+, `+` 1+, `?` 0 or 1, `{m,n}` m to n, `|` or, `( )` group.\n- A quantifier applies to the preceding **atom** (character, bracket expression, or group).\n- POSIX classes go inside brackets: `[[:digit:]]`, `[[:alpha:]]`, `[[:space:]]`, `[[:punct:]]`.\n- `grep -E regex file` prints matching lines; `-n` line numbers, `-i` ignore case."}]}],"flashcards":[{"id":"d5-fc-01","topic":"d5-if","front":"Write the full form of an `if` statement with `elif` and `else` (then on the same line).","back":"```bash\nif test-commands; then\n    commands\nelif test-commands; then\n    commands\nelse\n    commands\nfi\n```"},{"id":"d5-fc-02","topic":"d5-if","front":"When is the `;` before `then` required?","back":"When `then` is on the same line as the condition. `;` separates commands just like a newline does."},{"id":"d5-fc-03","topic":"d5-if","front":"How does `if` decide whether its condition is true?","back":"It runs the condition **command** and checks its exit status: `0` means true, non-zero means false."},{"id":"d5-fc-04","topic":"d5-if","front":"Exit status of `true` and of `false`?","back":"`true` exits with `0`; `false` exits with `1`."},{"id":"d5-fc-05","topic":"d5-if","front":"What is `/dev/null` and why write `cd \"$1\" 2> /dev/null`?","back":"The null device: it discards everything written to it. `2> /dev/null` throws away `cd`'s error message when we only want its exit status."},{"id":"d5-fc-06","topic":"d5-if","front":"Exit status of `[[ expr ]]`?","back":"`0` if *expr* is true, `1` if it is false."},{"id":"d5-fc-07","topic":"d5-if","front":"`[[ ]]` vs `test` / `[ ]`?","back":"`test` (written `[ ]`) is the standard UNIX command, portable to other shells. `[[ ]]` is Bash's version with fewer surprises (e.g. no word splitting inside). The course uses `[[ ]]`."},{"id":"d5-fc-08","topic":"d5-if","front":"Why must you write spaces in `[[ $x == 5 ]]`?","back":"`[[` and `]]` must be separate words. `[[$x` becomes one word, e.g. `[[5: command not found`."},{"id":"d5-fc-09","topic":"d5-if","front":"Which expansions do NOT happen inside `[[ ]]`?","back":"Word splitting and filename expansion. So `[[ -e $file ]]` works even if the name has spaces."},{"id":"d5-fc-10","topic":"d5-if","front":"`-e file`","back":"True if the file exists (any kind of file)."},{"id":"d5-fc-11","topic":"d5-if","front":"`-f file`","back":"True if the file exists and is a regular file."},{"id":"d5-fc-12","topic":"d5-if","front":"`-d file`","back":"True if the file exists and is a directory."},{"id":"d5-fc-13","topic":"d5-if","front":"`-r`, `-w`, `-x file`","back":"True if the file exists and is readable / writable / executable (by you)."},{"id":"d5-fc-14","topic":"d5-if","front":"`-s file`","back":"True if the file exists and has a size greater than zero."},{"id":"d5-fc-15","topic":"d5-if","front":"`f1 -nt f2` and `f1 -ot f2`","back":"f1 is newer than f2 (or f1 exists and f2 does not) / f1 is older than f2 (or f2 exists and f1 does not), by modification time."},{"id":"d5-fc-16","topic":"d5-if","front":"`-z str` vs `-n str`","back":"`-z`: true if the string is empty (length zero). `-n`: true if its length is greater than zero."},{"id":"d5-fc-17","topic":"d5-if","front":"What does `[[ $s ]]` (just a string) test?","back":"True if the string is not empty."},{"id":"d5-fc-18","topic":"d5-if","front":"String operators inside `[[ ]]`","back":"`==` (or `=`) equal, `!=` not equal, `<` before (lexicographically), `>` after, `=~` regex match."},{"id":"d5-fc-19","topic":"d5-if","front":"Is `[[ 100 < 2 ]]` true or false?","back":"True. `<` compares **strings**; `\"1\"` comes before `\"2\"`."},{"id":"d5-fc-20","topic":"d5-if","front":"What makes the right side of `==` a glob pattern?","back":"Not quoting it. `[[ $s == a* ]]` = starts with a; `[[ $s == \"a*\" ]]` = exactly the string `a*`."},{"id":"d5-fc-21","topic":"d5-if","front":"Integer test operators inside `[[ ]]`","back":"`-eq -ne -lt -le -gt -ge` (equal, not equal, less than, less or equal, greater than, greater or equal)."},{"id":"d5-fc-22","topic":"d5-if","front":"Two ways to test that `n` is less than 10","back":"`[[ $n -lt 10 ]]` or `(( n < 10 ))`."},{"id":"d5-fc-23","topic":"d5-if","front":"What happens to a non-integer like `hello` in `[[ $x -eq 0 ]]`?","back":"It is usually treated as `0`, with no error (so `[[ hello -eq 0 ]]` is true)."},{"id":"d5-fc-24","topic":"d5-if","front":"`[[ -v x ]]`","back":"True if the variable `x` has been assigned a value (even empty). Write the name, not `$x`."},{"id":"d5-fc-25","topic":"d5-if","front":"Standard usage-message check for a script that needs exactly one argument","back":"```bash\nif (( $# != 1 )); then\n    echo \"Usage: script.sh arg\" >&2\n    exit 1\nfi\n```"},{"id":"d5-fc-26","topic":"d5-if","front":"Quiz 2 Q1E: print `not readable` if the file named in `f` is not readable","back":"`if [[ ! -r $f ]]; then echo \"not readable\"; fi`"},{"id":"d5-fc-27","topic":"d5-operators","front":"Conditional operators from highest to lowest precedence","back":"`( expr )`, `! expr`, `expr1 && expr2`, `expr1 || expr2`."},{"id":"d5-fc-28","topic":"d5-operators","front":"When is the right side of `&&` not evaluated? Of `||`?","back":"`&&`: when the left side is false. `||`: when the left side is true (short-circuit evaluation)."},{"id":"d5-fc-29","topic":"d5-operators","front":"Test: file in `f` is a regular file AND readable","back":"`[[ -f $f && -r $f ]]`"},{"id":"d5-fc-30","topic":"d5-operators","front":"Leap-year test for `yr`","back":"`(( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) ))`"},{"id":"d5-fc-31","topic":"d5-regex","front":"What is a regular expression?","back":"A string that specifies a search pattern. Bash uses the POSIX extended regex syntax."},{"id":"d5-fc-32","topic":"d5-regex","front":"When is `[[ $str =~ $re ]]` true?","back":"When **any part** of `str` matches the regex `re` (use `^`/`$` to match the whole string)."},{"id":"d5-fc-33","topic":"d5-regex","front":"What happens if you quote the regex: `[[ $s =~ \"$re\" ]]`?","back":"The regex is matched as a plain string (no metacharacters). Quoting part of a regex makes that part literal."},{"id":"d5-fc-34","topic":"d5-regex","front":"`^` and `$` in a regex","back":"Anchors: `^` matches the beginning of the line (when first), `$` the end of the line (when last)."},{"id":"d5-fc-35","topic":"d5-regex","front":"`.` in a regex","back":"Matches any single character."},{"id":"d5-fc-36","topic":"d5-regex","front":"`[ ]` and `[^ ]` in a regex","back":"`[abc]`: any one character inside the brackets. `[^abc]`: any one character NOT inside."},{"id":"d5-fc-37","topic":"d5-regex","front":"`*`, `+`, `?` in a regex","back":"Preceding element zero or more times / one or more times / zero or one time."},{"id":"d5-fc-38","topic":"d5-regex","front":"`{m,n}`, `{m,}`, `{m}`","back":"Preceding element at least m and at most n times / m or more times / exactly m times."},{"id":"d5-fc-39","topic":"d5-regex","front":"`|` and `( )` in a regex","back":"`|` is the choice operator (before OR after). `( )` is a subexpression (group), e.g. `^(abc)+$`."},{"id":"d5-fc-40","topic":"d5-regex","front":"What is an atom?","back":"A single ordinary character, a bracket expression, or a subexpression `( )`. Quantifiers apply to the preceding atom."},{"id":"d5-fc-41","topic":"d5-regex","front":"How do you match a literal `.` or `(`?","back":"Put it in square brackets: `[.]`, `[(]`. Metacharacters lose their meaning inside brackets."},{"id":"d5-fc-42","topic":"d5-regex","front":"Regex for any signed or unsigned integer","back":"`^[-+]?[0-9]+$` (or `^[-+]?[[:digit:]]+$`)"},{"id":"d5-fc-43","topic":"d5-regex","front":"Regex: strings that start and end with a lowercase letter (including one-letter strings)","back":"`^[a-z](.*[a-z])?$`. (`^[a-z].*[a-z]$` misses `a`; `^[a-z]+$` only allows letters.)"},{"id":"d5-fc-44","topic":"d5-regex","front":"POSIX classes for digit, letter, whitespace, punctuation","back":"`[[:digit:]]`, `[[:alpha:]]`, `[[:space:]]`, `[[:punct:]]` (also `[[:upper:]]`, `[[:lower:]]`, `[[:alnum:]]`, `[[:blank:]]`)."},{"id":"d5-fc-45","topic":"d5-regex","front":"Regex meaning of `*` vs glob meaning of `*`","back":"Regex: zero or more of the preceding atom. Glob: any sequence of characters. (Regex `.*` = glob `*`.)"},{"id":"d5-fc-46","topic":"d5-regex","front":"`grep -E`, `-n`, `-i`","back":"`-E`: use extended regexes. `-n`: print line numbers. `-i`: ignore case."},{"id":"d5-fc-47","topic":"d5-regex","front":"Exit status of `grep`","back":"`0` if at least one line matched, `1` if none matched; so `if grep ... > /dev/null; then` works."},{"id":"d5-fc-48","topic":"d5-regex","front":"Which years does `^(19|20)[0-9][0-9]$` match?","back":"1900 to 2099 (four-digit strings starting 19 or 20)."}],"quiz":[{"id":"d5-q-01","topic":"d5-if","type":"output","q":"What does this print?","code":"if true; then echo \"true\"; fi\nif false; then echo \"false\"; fi\necho done","answer":"true\ndone","explain":"The condition is a command. `true` exits with 0 (true) so its `echo` runs. `false` exits with 1, the condition fails, and there is no `else`, so nothing is printed."},{"id":"d5-q-02","topic":"d5-if","type":"mcq","q":"What is wrong with `if [[$x == 5]]; then echo hi; fi`?","options":["Nothing; it prints hi if x is 5","`==` must be `-eq` for numbers","There must be a space after `[[` and before `]]`","`$x` must be double quoted"],"answer":2,"explain":"`[[` and `]]` must be separate words. With x=5 Bash tries to run a command named `[[5` (`[[5: command not found`). `==` compares strings, which works for `5`; quoting is optional inside `[[ ]]`."},{"id":"d5-q-03","topic":"d5-if","type":"output","q":"What does this print?","code":"if [[ 100 < 2 ]]; then echo \"100 comes first\"; else echo \"2 comes first\"; fi","answer":"100 comes first","explain":"Inside `[[ ]]`, `<` compares strings lexicographically: `1` comes before `2`, so \"100\" < \"2\" is true. Use `-lt` or `(( ))` for numbers."},{"id":"d5-q-04","topic":"d5-if","type":"output","q":"What does this print?","code":"x=hello\nif [[ $x -eq 0 ]]; then echo zero; else echo \"not zero\"; fi","answer":"zero","explain":"In an integer test, a non-integer word like `hello` is treated as 0 (no error), so `0 -eq 0` is true."},{"id":"d5-q-05","topic":"d5-if","type":"output","q":"What does this print?","code":"str=\"avocado\"\nif [[ $str == a* ]]; then echo \"pattern match\"; else echo \"no pattern match\"; fi\nif [[ $str == \"a*\" ]]; then echo \"equal to a*\"; else echo \"not equal to a*\"; fi","answer":"pattern match\nnot equal to a*","explain":"Unquoted `a*` on the right of `==` is a glob pattern (starts with a). Quoted `\"a*\"` is the literal two-character string, which `avocado` is not."},{"id":"d5-q-06","topic":"d5-if","type":"output","q":"What does this print?","code":"str=\"K7L 3N6\"\nif [[ $str == [A-Z][0-9][A-Z][0-9][A-Z][0-9] ]]; then\n    echo \"might be a postal code\"\nelse\n    echo \"not a postal code\"\nfi","answer":"not a postal code","explain":"The pattern describes exactly six characters. The space makes the string seven characters, and the 4th character is a space, not a digit."},{"id":"d5-q-07","topic":"d5-if","type":"output","q":"What does this print?","code":"x=7\nif (( x > 10 )); then\n    echo big\nelif (( x > 5 )); then\n    echo medium\nelse\n    echo small\nfi","answer":"medium","explain":"`7 > 10` is false, so Bash tries the `elif`: `7 > 5` is true, so it prints `medium` and skips the `else`. Inside `(( ))`, `>` is a numeric comparison."},{"id":"d5-q-08","topic":"d5-if","type":"mcq","q":"`notes` is a directory and `empty.txt` is an empty regular file. Which test is **false**?","options":["`[[ -e notes ]]`","`[[ -d notes ]]`","`[[ -e empty.txt ]]`","`[[ -s empty.txt ]]`"],"answer":3,"explain":"`-s` needs size greater than zero, and `empty.txt` is empty. `-e` is true for any existing file (including directories); `-d` is true for the directory."},{"id":"d5-q-09","topic":"d5-if","type":"short","q":"Suppose the variable `f` stores the name of a file. Write an `if` statement that prints `not writable` to standard output if the file is not writable.","answer":"`if [[ ! -w $f ]]; then echo \"not writable\"; fi`","explain":"Same shape as Quiz 2 Q1E with `-w` instead of `-r`. Also accepted: the multi-line form, or `[[ ! -w \"$f\" ]]`. Common mistakes: no spaces inside `[[ ]]`, no `;` before `then`, forgetting `fi`."},{"id":"d5-q-10","topic":"d5-if","type":"mcq","q":"In `cdls2.sh`, why is the condition written `if cd \"$1\" 2> /dev/null`?","options":["To run `cd` in the background","To use `cd`'s exit status as the condition while discarding its error message","To send the directory listing to /dev/null","Because `if` needs a redirection to read an exit status"],"answer":1,"explain":"`if` uses the exit status of `cd` (0 if it worked). `2> /dev/null` redirects standard error to the null device so only the script's own error message appears."},{"id":"d5-q-11","topic":"d5-if","type":"mcq","q":"Which `if` statement correctly tests whether the variable `x` has been assigned a value?","options":["`if [[ -v $x ]]; then`","`if [[ -v x ]]; then`","`if [[ -z x ]]; then`","`if [[ $x ]]; then`"],"answer":1,"explain":"`-v` takes the variable's **name**. `-v $x` would test a variable named by x's value. `-z x` tests the literal string \"x\" (never empty). `[[ $x ]]` is false for a variable assigned the empty string."},{"id":"d5-q-12","topic":"d5-if","type":"short","q":"Write the lines at the start of a script that print `Usage: count.sh file` to standard error and exit with status 1 when the number of command line arguments is not exactly 1.","answer":"```bash\nif (( $# != 1 )); then\n    echo \"Usage: count.sh file\" >&2\n    exit 1\nfi\n```","explain":"`[[ $# -ne 1 ]]` is equally good. Both `>&2` (stderr) and `exit 1` are needed; without `exit` the script would carry on."},{"id":"d5-q-13","topic":"d5-if","type":"output","q":"`compstr.sh` is the course script below. What does `./compstr.sh tiger poodle` print?","code":"#!/bin/bash\n\ns1=$1\ns2=$2\nif [[ $s1 == $s2 ]]; then\n    echo 0\nelif [[ $s1 < $s2 ]]; then\n    echo -1\nelse\n    echo 1\nfi","answer":"1","explain":"The strings are not equal, and `tiger` does not come before `poodle` (`t` comes after `p`), so the `else` branch prints `1`."},{"id":"d5-q-14","topic":"d5-operators","type":"output","q":"What does this print?","code":"yr=1900\nif (( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) )); then\n    echo \"$yr is a leap year\"\nelse\n    echo \"$yr is not a leap year\"\nfi","answer":"1900 is not a leap year","explain":"1900 % 400 is 300, so the left side is false. 1900 is divisible by 4 but also by 100, so the parenthesised part is false too."},{"id":"d5-q-15","topic":"d5-operators","type":"mcq","q":"The file `nosuch` does not exist. In `[[ -e nosuch && -r nosuch ]]`, what happens?","options":["Both tests run and the result is false","Only `-e` runs; the result is false (short-circuit)","Bash prints an error because the file is missing","Only `-r` runs because `&&` is evaluated right to left"],"answer":1,"explain":"`&&` stops as soon as the left side is false: the whole expression must be false, so `-r` is never evaluated. No error is printed; file tests on missing files are simply false."},{"id":"d5-q-16","topic":"d5-operators","type":"output","q":"What does this print?","code":"s=\"\"\nif [[ ! -z $s || -n $s ]]; then echo yes; else echo no; fi","answer":"no","explain":"`s` is empty, so `-z $s` is true and `! -z $s` is false; `-n $s` is false. false || false is false."},{"id":"d5-q-17","topic":"d5-operators","type":"mcq","q":"Which condition is true exactly when the integer `x` is between 3 and 10 (exclusive)?","options":["`[[ $x > 3 && $x < 10 ]]`","`(( x > 3 || x < 10 ))`","`[[ $x -gt 3 && $x -lt 10 ]]`","`[[ $x -gt 3 ]] || [[ $x -lt 10 ]]`"],"answer":2,"explain":"Both comparisons must hold, so `&&`, with integer operators. Option A compares strings (`\"5\" < \"10\"` is false). Options B and D use `||`, true for every integer."},{"id":"d5-q-18","topic":"d5-regex","type":"mcq","q":"What does the metacharacter `?` mean in a regular expression?","options":["Any single character","Zero or one instances of the preceding atom","One or more instances of the preceding atom","Exactly one character, as in a glob pattern"],"answer":1,"explain":"Quiz 2 Q1A. `.` is any single character, `+` is one or more. Option D is the glob (filename expansion) meaning of `?`, a common mix-up."},{"id":"d5-q-19","topic":"d5-regex","type":"mcq","q":"Which regex matches **all and only** strings that start and end with a lowercase letter, including one-letter strings like `a` (assume the C locale)?","options":["`^[a-z]+$`","`^[a-z].*[a-z]$`","`^[a-z](.*[a-z])?$`","`[a-z].*[a-z]`"],"answer":2,"explain":"`^[a-z]+$` rejects `x-ray` (it allows only letters). `^[a-z].*[a-z]$` rejects `a` (it needs two characters). `[a-z].*[a-z]` has no anchors, so it matches `1ab2`. `^[a-z](.*[a-z])?$` handles all cases. (The Quiz 2 key also accepted A and B.)"},{"id":"d5-q-20","topic":"d5-regex","type":"mcq","q":"Which strings does `^s[aei]t$` match?","options":["`sat`, `set`, `sit` only","`sat`, `set`, `sit`, `seat`, `saeit`","any string containing `sat`, `set` or `sit`","`s`, then any characters, then `t`"],"answer":0,"explain":"`[aei]` matches exactly one character from the set, and the anchors force the whole string to be three characters."},{"id":"d5-q-21","topic":"d5-regex","type":"mcq","q":"Which string is matched by `^xa{1,3}$`?","options":["`x`","`xaaaa`","`xaa`","`axa`"],"answer":2,"explain":"`a{1,3}` means one to three `a`s after the `x`, and nothing else. `x` has zero `a`s, `xaaaa` has four, `axa` does not start with `x`."},{"id":"d5-q-22","topic":"d5-regex","type":"mcq","q":"Which of these strings is matched by `^b|cat$`?","options":["`at`","`abc`","`scat`","`cab`"],"answer":2,"explain":"`|` splits the whole regex: \"starts with b\" OR \"ends with cat\". `scat` ends with `cat`. `abc` and `cab` neither start with b nor end with cat."},{"id":"d5-q-23","topic":"d5-regex","type":"output","q":"What does this print?","code":"re=\"a.c\"\nif [[ abc =~ $re ]]; then echo \"match 1\"; else echo \"no match 1\"; fi\nif [[ abc =~ \"$re\" ]]; then echo \"match 2\"; else echo \"no match 2\"; fi","answer":"match 1\nno match 2","explain":"Unquoted, `.` is a metacharacter (any character), so `abc` matches. Quoted, the regex is matched as the literal string `a.c`, which `abc` does not contain."},{"id":"d5-q-24","topic":"d5-regex","type":"output","q":"What does this print?","code":"re=\"^(19|20)[0-9][0-9]$\"\nif [[ 1999 =~ $re ]]; then echo \"1999 yes\"; else echo \"1999 no\"; fi\nif [[ 1899 =~ $re ]]; then echo \"1899 yes\"; else echo \"1899 no\"; fi\nif [[ 20245 =~ $re ]]; then echo \"20245 yes\"; else echo \"20245 no\"; fi","answer":"1999 yes\n1899 no\n20245 no","explain":"The regex matches exactly four characters: `19` or `20`, then two digits. `1899` starts with 18; `20245` has five characters, and `$` forbids the extra one."},{"id":"d5-q-25","topic":"d5-regex","type":"output","q":"What does this print?","code":"s=hello\nif [[ $s =~ ^h.*o$ ]]; then echo A; fi\nif [[ $s =~ l{2} ]]; then echo B; fi\nif [[ $s =~ ^l ]]; then echo C; fi","answer":"A\nB","ex
