e substring of `s` starting at\nindex `offset` and having length `len`.\n\n```bash\nindex_of_space() {\n    # finds the index of the first space in a specified string\n}\n\nget_firstname() {\n    # e.g., \"Bart Simpson\" has the first name \"Bart\"\n}\n\nget_lastname() {\n    # e.g., \"Bart Simpson\" has the last name \"Simpson\"\n}\n# the rest of your script starts here\n```","answer":"```bash\n#!/bin/bash\n\nindex_of_space() {\n    # finds the index of the first space in a specified string\n    local s=$1\n    local i\n    for (( i = 0; i < ${#s}; i++ )); do\n        if [[ ${s:i:1} == \" \" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}\n\nget_firstname() {\n    # e.g., \"Bart Simpson\" has the first name \"Bart\"\n    local name=$1\n    local idx\n    idx=$(index_of_space \"$name\")\n    echo \"${name:0:idx}\"\n}\n\nget_lastname() {\n    # e.g., \"Bart Simpson\" has the last name \"Simpson\"\n    local name=$1\n    local idx\n    idx=$(index_of_space \"$name\")\n    echo \"${name:idx+1}\"\n}\n\nif (( $# != 1 )); then\n    echo \"usage: $0 filename\" >&2\n    exit 2\nfi\n\nreadarray -t arr < \"$1\"\n\nfor student in \"${arr[@]}\"; do\n    first=$(get_firstname \"$student\")\n    last=$(get_lastname \"$student\")\n    echo \"$last, ${first:0:1}.\"\ndone\n```","grading":"Same marking scheme as the original. Differences to check: the argument test is `!= 1` (not `< 1`), exit status 2, the last name starts at idx+1 (only a space to skip), and the initial is `${first:0:1}` followed by a period. Comparing a character to a space needs quotes: `[[ ${s:i:1} == \" \" ]]`. Functions must be used; `\"${arr[@]}\"` must be quoted.","rubric":[{"marks":1,"item":"Checks `$# != 1` and prints an error to standard error"},{"marks":1,"item":"Exits with status 2"},{"marks":3,"item":"index_of_space correctly finds and returns the index of the first space"},{"marks":2,"item":"get_firstname uses index_of_space and `${name:0:idx}`"},{"marks":2,"item":"get_lastname uses index_of_space and `${name:idx+1}`"},{"marks":1,"item":"`readarray -t arr < \"$1\"`"},{"marks":1,"item":"Loops over `\"${arr[@]}\"` (quoted)"},{"marks":1,"item":"Prints `last, F.` using the functions and `${first:0:1}`"}],"variantOf":"m24-5","sourceId":"m24"},{"id":"q23a-1a","source":"Quiz 1, 2023, Q1A","kind":"short","marks":1,"topics":["paths"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nA) The directory indicated by `???` is the root directory of the filesystem. What symbol is used for the name of the root directory?","answer":"`/`","grading":"Only `/` (forward slash) is correct. A backslash `\\` is wrong (that is Windows).","rubric":[{"marks":1,"item":"States the root directory is named `/`"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-1a-v","source":"Variant of Quiz 1, 2023, Q1A","kind":"short","marks":1,"topics":["paths"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nA) What single character can be used at the start of a pathname as shorthand for the home directory of the current user (for example, `/home/user1` when user1 is logged in)?","answer":"`~` (tilde)","grading":"Only `~` earns the mark. `$HOME` is a variable expansion, not a single character: give the mark only if the student also names `~`. `/` (root) and `.` (current directory) are wrong.","rubric":[{"marks":1,"item":"Names `~` as the home-directory shorthand"}],"variantOf":"q23a-1a","sourceId":"q23a"},{"id":"q23a-1b","source":"Quiz 1, 2023, Q1B","kind":"short","marks":1,"topics":["paths"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nB) What is the absolute pathname of the directory `CISC352`?","answer":"`/home/user2/courses/CISC352`","grading":"Must start with `/` (absolute). A trailing slash is fine. `home/user2/courses/CISC352` (no leading `/`) is relative and loses the mark. Case matters.","rubric":[{"marks":1,"item":"Gives `/home/user2/courses/CISC352` starting from `/`"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-1b-v","source":"Variant of Quiz 1, 2023, Q1B","kind":"short","marks":1,"topics":["paths"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nB) What is the absolute pathname of the directory `CISC220`?","answer":"`/home/user1/courses/CISC220`","grading":"Must start with `/`. Trailing slash fine. Using user2 is wrong (only user1 has CISC220).","rubric":[{"marks":1,"item":"Gives `/home/user1/courses/CISC220` starting from `/`"}],"variantOf":"q23a-1b","sourceId":"q23a"},{"id":"q23a-1c","source":"Quiz 1, 2023, Q1C","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nC) Suppose that the current working directory is `home`. What single command would you use to list the files in the directories named `CISC220` and `CISC352`?","answer":"```bash\nls user1/courses/CISC220 user2/courses/CISC352\n```","grading":"Any single `ls` command naming both directories works: relative paths (as above) or absolute paths (`ls /home/user1/courses/CISC220 /home/user2/courses/CISC352`). A glob like `ls */courses/CISC2*` is wrong because it also matches user1's and user2's CISC204. Two separate commands do not satisfy \"single command\".","rubric":[{"marks":1,"item":"One `ls` command with correct paths to both CISC220 (user1) and CISC352 (user2)"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-1c-v","source":"Variant of Quiz 1, 2023, Q1C","kind":"short","marks":1,"topics":["paths","commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nC) Suppose that the current working directory is the `courses` directory belonging to `user1`. What single command would you use to list the files in the directory `CISC204` belonging to `user1` and the directory `CISC204` belonging to `user2`?","answer":"```bash\nls CISC204 ../../user2/courses/CISC204\n```","grading":"Any single `ls` with correct paths to both directories: relative (as above) or absolute (`/home/user2/courses/CISC204`). `../user2/...` is wrong (one `..` from courses only reaches user1). `ls ../../*/courses/CISC204` is also correct.","rubric":[{"marks":1,"item":"One `ls` command with correct paths to both CISC204 directories"}],"variantOf":"q23a-1c","sourceId":"q23a"},{"id":"q23a-1d","source":"Quiz 1, 2023, Q1D","kind":"short","marks":1,"topics":["paths","commands","globs"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nD) Suppose that the current working directory is `CISC204` belonging to `user1`. What single command would you use to copy all the files from the current working directory to the `CISC204` directory belonging to `user2`?","answer":"```bash\ncp * /home/user2/courses/CISC204\n```","grading":"Accept `cp * ../../../user2/courses/CISC204` (relative) or the absolute path. Needs `*` (or `./*`) for \"all the files\" (hidden files not required). Common mistakes: wrong number of `..`, `cp CISC204 ...` (copies nothing useful), or `cp -r . ...`.","rubric":[{"marks":1,"item":"`cp *` with a correct path to user2's CISC204"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-1d-v","source":"Variant of Quiz 1, 2023, Q1D","kind":"short","marks":1,"topics":["paths","commands","globs"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nD) Suppose that the current working directory is `CISC204` belonging to `user1`. What single command would you use to copy all the files whose names end in `.txt` from the current working directory to the `CISC352` directory belonging to `user2`?","answer":"```bash\ncp *.txt /home/user2/courses/CISC352\n```","grading":"Accept the relative destination `../../../user2/courses/CISC352`. The glob must be `*.txt`; `*txt` is acceptable but slightly looser. A plain `*` loses the mark.","rubric":[{"marks":1,"item":"`cp *.txt` with a correct path to user2's CISC352"}],"variantOf":"q23a-1d","sourceId":"q23a"},{"id":"q23a-1e","source":"Quiz 1, 2023, Q1E","kind":"short","marks":1,"topics":["commands"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nE) Suppose that the current working directory is `courses` belonging to `user1`. What single command would you use to rename the directory `CISC220` to `cisc220`?","answer":"```bash\nmv CISC220 cisc220\n```","grading":"Renaming is done with `mv`. `rename`, `cp -r` + `rm`, or `mkdir` do not earn the mark.","rubric":[{"marks":1,"item":"`mv CISC220 cisc220`"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-1e-v","source":"Variant of Quiz 1, 2023, Q1E","kind":"short","marks":1,"topics":["commands","paths"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nE) Suppose that the current working directory is `user2`. What single command would you use to rename the directory `CISC352` to `cisc352`?","answer":"```bash\nmv courses/CISC352 courses/cisc352\n```","grading":"Both source and destination need the `courses/` prefix. `mv courses/CISC352 cisc352` would move the directory up into user2 (wrong). Absolute paths are fine.","rubric":[{"marks":1,"item":"`mv` with correct paths for both old and new names"}],"variantOf":"q23a-1e","sourceId":"q23a"},{"id":"q23a-1f","source":"Quiz 1, 2023, Q1F","kind":"short","marks":1,"topics":["commands","globs"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nF) Suppose that the current working directory is `courses` belonging to `user2`. What single command would you use to list all the files including the hidden files found in the subdirectories of `courses`?","answer":"```bash\nls -a */\n```","grading":"Needs `-a` (or `-A`) and must list the contents of the subdirectories: `ls -a *`, `ls -a */`, or `ls -a CISC204 CISC352` are all fine. `ls -a` alone lists only courses itself; `ls -a .*` is wrong.","rubric":[{"marks":1,"item":"`ls -a` (or `-A`) applied to the subdirectories"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-1f-v","source":"Variant of Quiz 1, 2023, Q1F","kind":"short","marks":1,"topics":["commands","globs","paths"],"prompt":"Question 1 (1 mark each). Consider a filesystem having the directory structure shown below:\n\n```\n???\n└── home\n    ├── user1\n    |   └── courses\n    |       ├── CISC204\n    |       └── CISC220\n    └── user2\n        └── courses\n            ├── CISC204\n            └── CISC352\n```\n\nYour answer for each of the following parts should be very brief.\n\nF) Suppose that the current working directory is `home`. What single command would you use to list all the files including the hidden files found in the subdirectories of the `courses` directory belonging to `user1`?","answer":"```bash\nls -a user1/courses/*/\n```","grading":"Accept `ls -a user1/courses/*`, `ls -A ...`, or naming both directories explicitly. Missing `-a`/`-A` loses the mark, as does a path to user2.","rubric":[{"marks":1,"item":"`ls -a` on the subdirectories of user1/courses with a correct path"}],"variantOf":"q23a-1f","sourceId":"q23a"},{"id":"q23a-2a","source":"Quiz 1, 2023, Q2A","kind":"short","marks":1,"topics":["files"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nA) In Linux, a directory is a file that contains what information?","answer":"A table that maps filenames to inode numbers (the names of the files in the directory and the inode each one refers to).","grading":"Key idea: filenames → inodes (the directory entries / hard links). \"A list of the files it contains\" is weak but usually earns the mark only if it mentions names mapped to inodes; \"the files' contents\" or \"permissions\" is wrong.","rubric":[{"marks":1,"item":"Says a directory maps filenames to inodes (inode numbers)"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-2a-v","source":"Variant of Quiz 1, 2023, Q2A","kind":"short","marks":1,"topics":["files"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nA) In Linux, an inode stores information about a file. Name one important piece of information about a file that is NOT stored in its inode, and say where it is stored instead.","answer":"The filename. Filenames are stored in directories (a directory maps filenames to inode numbers).","grading":"Both parts needed: the filename, and that it lives in the directory. Inodes do store type, owner, size, permissions, timestamps and where the data is.","rubric":[{"marks":1,"item":"Filename, stored in the directory"}],"variantOf":"q23a-2a","sourceId":"q23a"},{"id":"q23a-2b","source":"Quiz 1, 2023, Q2B","kind":"short","marks":1,"topics":["scripts"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nB) Every command produces an exit status. If a command completes without encountering any errors, what is the expected value of its exit status?","answer":"`0`","grading":"Only 0. \"1\" or \"true\" is wrong.","rubric":[{"marks":1,"item":"0"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-2b-v","source":"Variant of Quiz 1, 2023, Q2B","kind":"short","marks":1,"topics":["scripts","variables"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nB) Every command produces an exit status. What special variable holds the exit status of the most recently executed command (show how to print it)?","answer":"```bash\necho $?\n```","grading":"Must be `$?`. `$#` (number of arguments) and `$$` (process id) are common wrong answers.","rubric":[{"marks":1,"item":"`$?`"}],"variantOf":"q23a-2b","sourceId":"q23a"},{"id":"q23a-2c","source":"Quiz 1, 2023, Q2C","kind":"short","marks":1,"topics":["globs"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nC) Suppose that the current working directory has no subdirectories but it does have one or more non-hidden files. What can you conclude about the filenames in the directory if\n\n```bash\nls *\n```\n\nproduces the exact same output as\n\n```bash\nls ?\n```\n\nBe as specific as possible in your answer.","answer":"All of the (non-hidden) filenames are exactly one character long.","grading":"Must say every non-hidden filename is a single character. \"Some files are one character\" is not specific enough (then `ls *` would list more).","rubric":[{"marks":1,"item":"Every non-hidden filename is exactly one character long"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-2c-v","source":"Variant of Quiz 1, 2023, Q2C","kind":"short","marks":1,"topics":["globs"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nC) Suppose that the current working directory has no subdirectories but it does have one or more non-hidden files. What can you conclude about the filenames in the directory if\n\n```bash\nls *\n```\n\nproduces the exact same output as\n\n```bash\nls ??\n```\n\nBe as specific as possible in your answer.","answer":"All of the (non-hidden) filenames are exactly two characters long.","grading":"`??` matches exactly two characters, so every non-hidden name must be exactly two characters. \"At most two\" or \"at least two\" is wrong.","rubric":[{"marks":1,"item":"Every non-hidden filename is exactly two characters long"}],"variantOf":"q23a-2c","sourceId":"q23a"},{"id":"q23a-2d","source":"Quiz 1, 2023, Q2D","kind":"short","marks":1,"topics":["streams"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nD) What command could you use to overwrite the contents of a file name `myfile` with the string `OOPS`? Hint: Consider using a redirection.","answer":"```bash\necho OOPS > myfile\n```","grading":"Needs `>` (truncate/overwrite). `>>` appends and loses the mark. `printf OOPS > myfile` is fine.","rubric":[{"marks":1,"item":"`echo OOPS > myfile` using `>`"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-2d-v","source":"Variant of Quiz 1, 2023, Q2D","kind":"short","marks":1,"topics":["streams"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nD) What command could you use to add the string `DONE` as a new line at the end of a file named `log` without destroying its existing contents? Hint: Consider using a redirection.","answer":"```bash\necho DONE >> log\n```","grading":"Needs `>>` (append). `>` would overwrite the file and loses the mark.","rubric":[{"marks":1,"item":"`echo DONE >> log` using `>>`"}],"variantOf":"q23a-2d","sourceId":"q23a"},{"id":"q23a-2e","source":"Quiz 1, 2023, Q2E","kind":"short","marks":1,"topics":["scripts","variables"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nE) From inside a script, how can you print the number of command line arguments provided to the script?","answer":"```bash\necho $#\n```","grading":"Must use `$#`. `$@`/`$*` print the arguments themselves, not their count; `$0` is the script name.","rubric":[{"marks":1,"item":"`echo $#`"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-2e-v","source":"Variant of Quiz 1, 2023, Q2E","kind":"short","marks":1,"topics":["scripts","variables","quoting"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nE) From inside a script, how can you print all of the command line arguments provided to the script on a single line?","answer":"```bash\necho \"$@\"\n```","grading":"`echo \"$@\"`, `echo \"$*\"`, or unquoted `echo $@` all print them on one line. `$#` (count) and `$0` (script name) are wrong.","rubric":[{"marks":1,"item":"`echo \"$@\"` or `echo \"$*\"`"}],"variantOf":"q23a-2e","sourceId":"q23a"},{"id":"q23a-2f","source":"Quiz 1, 2023, Q2F","kind":"short","marks":1,"topics":["variables","strings"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nF) How can you concatenate two strings stored in variables named `str1` and `str2` and store the resulting string in a variable named `str3`?","answer":"```bash\nstr3=\"$str1$str2\"\n```","grading":"`str3=$str1$str2` (unquoted) is also correct: no word splitting happens in an assignment. Spaces around `=` (`str3 = ...`) lose the mark. `str3=str1+str2` or `$str3=...` are wrong.","rubric":[{"marks":1,"item":"`str3=$str1$str2` with no spaces around `=`"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-2f-v","source":"Variant of Quiz 1, 2023, Q2F","kind":"short","marks":1,"topics":["variables","strings"],"prompt":"Question 2 (1 mark each). Your answer for each of the following parts should be very brief.\n\nF) Suppose that the variables `first` and `last` store a person's first and last names. How can you store the full name, the first name followed by a single space followed by the last name, in a variable named `full`?","answer":"```bash\nfull=\"$first $last\"\n```","grading":"Quotes are REQUIRED here because of the space: `full=$first $last` would try to run `$last` as a command with `full` set in its environment. No spaces around `=`.","rubric":[{"marks":1,"item":"`full=\"$first $last\"` with quotes and no spaces around `=`"}],"variantOf":"q23a-2f","sourceId":"q23a"},{"id":"q23a-3a","source":"Quiz 1, 2023, Q3A","kind":"long","marks":2,"topics":["strings","arithmetic"],"prompt":"Question 3A (2 marks). Recall that if `s` is a variable then `${s:offset:len}` expands to the substring of `s` starting at index `offset` and having length `len`.\n\nUsing one or two lines of Bash, how could you print the first half of a string stored in a variable `s`? Assume that the string has even length.","answer":"```bash\nn=$(( ${#s} / 2 ))\necho \"${s:0:n}\"\n```","grading":"`${#s}` gives the length; integer division by 2; then `${s:0:n}` (`$n` inside is also fine). One-liner `echo \"${s:0:${#s}/2}\"` is correct too. Common mistakes: `$s.length`, `${s:0:${#s/2}}`, or using `expr` incorrectly.","rubric":[{"marks":1,"item":"Computes half the length with `${#s}` and arithmetic `/ 2`"},{"marks":1,"item":"Prints `${s:0:n}` (substring from index 0 of length n)"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-3a-v","source":"Variant of Quiz 1, 2023, Q3A","kind":"long","marks":2,"topics":["strings","arithmetic"],"prompt":"Question 3A (2 marks). Recall that if `s` is a variable then `${s:offset:len}` expands to the substring of `s` starting at index `offset` and having length `len`.\n\nUsing one or two lines of Bash, how could you print the second half of a string stored in a variable `s`? Assume that the string has even length.","answer":"```bash\nn=$(( ${#s} / 2 ))\necho \"${s:n}\"\n```","grading":"Offset must be half the length; the length part can be omitted (`${s:n}` goes to the end) or written `${s:n:n}`. `${s: -n}` with a space also works. Using offset 0 prints the first half (wrong).","rubric":[{"marks":1,"item":"Computes half the length with `${#s}` and `/ 2`"},{"marks":1,"item":"Prints the substring starting at offset n (to the end)"}],"variantOf":"q23a-3a","sourceId":"q23a"},{"id":"q23a-3b","source":"Quiz 1, 2023, Q3B","kind":"long","marks":2,"topics":["streams","commands"],"prompt":"Question 3B (2 marks). Suppose that you have a file named `classlist` that contains the last name, first name, and\nstudent number of each student in a course. A tab character separates the last name from the first\nname and the first name from the student number. For example:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWrite a single pipeline that extracts the student numbers from the file `classlist`, sorts the student numbers in ascending order, saves all the student numbers to a file named `snum` (in sorted order), and prints the first three student numbers (in sorted order). Hint: You need a `tee` somewhere in the pipeline.","answer":"```bash\ncut -f3 classlist | sort | tee snum | head -n 3\n```","grading":"`cut -f3` (tab is cut's default delimiter; `-d $'\\t'` is fine). `sort` or `sort -n` both fine (all numbers have 7 digits). `tee snum` must come AFTER sort and BEFORE head, otherwise snum is unsorted or only has 3 lines. `head -3` is accepted. `cut -d ' '` is wrong (fields are tab-separated).","rubric":[{"marks":1,"item":"`cut -f3 classlist | sort` extracts and sorts the student numbers"},{"marks":1,"item":"`tee snum` placed after sort and before `head -n 3`"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-3b-v","source":"Variant of Quiz 1, 2023, Q3B","kind":"long","marks":2,"topics":["streams","commands"],"prompt":"Question 3B (2 marks). Suppose that you have a file named `classlist` that contains the last name, first name, and\nstudent number of each student in a course. A tab character separates the last name from the first\nname and the first name from the student number. For example:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWrite a single pipeline that extracts the last names from the file `classlist`, sorts them in reverse (descending) alphabetical order, saves all the sorted last names to a file named `lastnames`, and prints the first two last names (in that sorted order). Hint: You need a `tee` somewhere in the pipeline.","answer":"```bash\ncut -f1 classlist | sort -r | tee lastnames | head -n 2\n```","grading":"Needs field 1, `sort -r`, `tee lastnames` between sort and head, and `head -n 2` (or `head -2`). For the sample file the output is `Yu` then `Friese`. Putting tee before sort, or after head, loses the second mark.","rubric":[{"marks":1,"item":"`cut -f1 classlist | sort -r`"},{"marks":1,"item":"`tee lastnames` between sort and `head -n 2`"}],"variantOf":"q23a-3b","sourceId":"q23a"},{"id":"q23a-4","source":"Quiz 1, 2023, Q4","kind":"long","marks":4,"topics":["scripts","permissions","expansions","quoting"],"prompt":"Question 4 (4 marks).\n\nWrite a script that accepts two command line arguments that are both file names. The first\nargument is the name of the source file, and the second argument is the name of the destination\nfile.\n\nThe script sets the permissions of the destination file to be equal to the permissions of the source\nfile (i.e., it copies the permissions from the source file to the destination file).\n\nNo error checking is required in this question. You can assume that two command line\narguments are always given, and that the source and destination files exist.\n\nFrom Assignment 2 recall that the `stat` command can print the permissions of a file:\n\n```bash\nstat -c %a filename\n```\n\nprints the three-digit octal permissions of the file named `filename`.","answer":"```bash\n#!/bin/bash\n\nsrc=$1\ndest=$2\n\n# permissions of src\nperm=$(stat -c %a \"$src\")\n\nchmod \"$perm\" \"$dest\"\n```","grading":"Essential: command substitution `$(stat -c %a \"$src\")` and `chmod` with that value on the destination. The posted solution says the quotes around `\"$src\"` and `\"$dest\"` are REQUIRED (file names may contain spaces): unquoted filename expansions lose a mark. Quoting `$perm` is optional. A one-liner `chmod \"$(stat -c %a \"$1\")\" \"$2\"` is full marks. `chmod --reference=\"$1\" \"$2\"` works on Linux but ignores the hint; accept it. Backticks instead of `$( )` are fine. Getting source/destination backwards loses 1 mark.","rubric":[{"marks":1,"item":"`#!/bin/bash` and uses `$1` as source, `$2` as destination"},{"marks":1,"item":"Captures permissions with command substitution `$(stat -c %a ...)`"},{"marks":1,"item":"`chmod` applies those permissions to the destination"},{"marks":1,"item":"Filename variables quoted (`\"$src\"`, `\"$dest\"`)"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-4-v","source":"Variant of Quiz 1, 2023, Q4","kind":"long","marks":4,"topics":["scripts","permissions","expansions","quoting"],"prompt":"Question 4 (4 marks).\n\nWrite a script that accepts two command line arguments that are both file names. The first\nargument is the name of the destination file, and the second argument is the name of the source\n(reference) file.\n\nThe script prints the message `setting permissions of DEST to PERM` (where DEST is the destination\nfile name and PERM is the three-digit octal permissions of the source file), and then sets the permissions\nof the destination file to be equal to the permissions of the source file.\n\nNo error checking is required in this question. You can assume that two command line\narguments are always given, and that the source and destination files exist.\n\nFrom Assignment 2 recall that the `stat` command can print the permissions of a file:\n\n```bash\nstat -c %a filename\n```\n\nprints the three-digit octal permissions of the file named `filename`.","answer":"```bash\n#!/bin/bash\n\ndest=$1\nsrc=$2\n\nperm=$(stat -c %a \"$src\")\necho \"setting permissions of $dest to $perm\"\nchmod \"$perm\" \"$dest\"\n```","grading":"Note the argument ORDER is reversed from the usual: `$1` is the destination. Must stat the source (`$2`). Quotes on filename variables required. The message must use the destination name and the octal permissions.","rubric":[{"marks":1,"item":"`#!/bin/bash`, `$1` used as destination and `$2` as source"},{"marks":1,"item":"`perm=$(stat -c %a \"$src\")`"},{"marks":1,"item":"Prints the required message and runs `chmod \"$perm\" \"$dest\"`"},{"marks":1,"item":"Filename variables quoted"}],"variantOf":"q23a-4","sourceId":"q23a"},{"id":"q23a-5","source":"Quiz 1, 2023, Q5","kind":"long","marks":10,"topics":["scripts","strings","permissions","quoting","commands"],"prompt":"Question 5 (10 marks).\n\nThe fact that file removal in Linux is permanent can be inconvenient. Instead of removing a file,\nwe can create a command that moves the file into a hidden trashcan directory.\n\nCreate a script named `trash.sh` that moves a single file into a hidden trashcan directory by\nperforming the following steps:\n\n1. finds the name of the directory `dir` that the file is located in\n2. creates a directory named `.trash` in `dir`\n3. changes the permissions of the `.trash` directory so that the owner has all permissions\n   and all other users have no permissions\n4. prints the message `\"moving filename to the trashcan\"` where `filename` is the\n   first command line argument provided to the script (see below)\n5. moves the file into the `.trash` directory created in Step 2\n\nObviously, the script requires one command line argument (the pathname of the file to move into\nthe trash).\n\nNo error checking is required. Assume that one command line argument is always provided to\nthe script, and that the argument is the pathname to a file that is owned by the user of the script.\nAlso, assume that the pathname always includes the directory that the file is located in.\n\nStep 2 will cause an error message to be printed if the directory `.trash` already exists in `dir`.\nYou should ignore the fact that this error can occur.\n\nHint: If `str` is a variable then `${str%pattern}` expands to the string formed by removing the\nshortest trailing part of `str` that matches `pattern`.\n\nExample 1:\n```\ntrash.sh ./myfile\n```\nmoves `./myfile` into the `.trash` directory created in the current working directory\n\nExample 2:\n```\ntrash.sh /home/user1/somedir/myfile\n```\nmoves `/home/user1/somedir/myfile` into the `.trash` directory created in the directory\n`/home/user1/somedir/`","answer":"```bash\n#!/bin/bash\n\npathname=$1\n\n# Step 1\ndir=${pathname%/*}\n\n# Step 2\ntrashdir=$dir/.trash\nmkdir \"$trashdir\"\n\n# Step 3\nchmod u=rwx,go= \"$trashdir\"     # or: chmod 700 \"$trashdir\"\n\n# Step 4\necho \"moving $pathname to the trashcan\"\n\n# Step 5\nmv \"$pathname\" \"$trashdir\"\n```","grading":"Step 1: `${pathname%/*}` removes the shortest trailing `/name`, leaving the directory (`dirname \"$1\"` is also accepted). Step 3: `chmod 700` or `chmod u=rwx,go=` (`chmod go-rwx` alone is not enough unless u=rwx is also set). Quotes are required around pathname variables in `mkdir`, `chmod` and `mv`; missing quotes lose marks. NOTE: the posted 2023 solution writes `mv \"$pathname $trashdir\"`, which is a typo (it makes one argument); the correct form is `mv \"$pathname\" \"$trashdir\"`. Using `rm` or `cp` instead of `mv` in step 5 loses that step. Using `##` instead of `%` in step 1 gives the filename, not the directory (wrong).","rubric":[{"marks":1,"item":"`#!/bin/bash` and uses `$1` as the pathname"},{"marks":2,"item":"Step 1: directory found with `${pathname%/*}` (or dirname)"},{"marks":2,"item":"Step 2: `mkdir \"$dir/.trash\"` in the file's directory"},{"marks":2,"item":"Step 3: `chmod 700` (owner all, others none) on .trash"},{"marks":1,"item":"Step 4: prints `moving <pathname> to the trashcan`"},{"marks":2,"item":"Step 5: `mv \"$pathname\" \"$trashdir\"` with separate quoted arguments"}],"variantOf":null,"sourceId":"q23a"},{"id":"q23a-5-v","source":"Variant of Quiz 1, 2023, Q5","kind":"long","marks":10,"topics":["scripts","strings","permissions","quoting","commands"],"prompt":"Question 5 (10 marks).\n\nBefore editing a file it can be useful to keep a backup copy. Create a script named `backup.sh` that copies a\nsingle file into a hidden backup directory by performing the following steps:\n\n1. finds the name of the directory `dir` that the file is located in, and the name `name` of the file itself\n   (the pathname without its directory part)\n2. creates a directory named `.backup` in `dir`\n3. changes the permissions of the `.backup` directory so that the owner has all permissions, the group has\n   read and execute permissions, and all other users have no permissions\n4. prints the message `\"backing up filename\"` where `filename` is the first command line argument provided to\n   the script\n5. copies the file into the `.backup` directory created in Step 2, naming the copy `name.bak` (e.g., a file\n   `notes.txt` is copied to `.backup/notes.txt.bak`)\n\nThe script requires one command line argument (the pathname of the file to back up).\n\nNo error checking is required. Assume that one command line argument is always provided, that it is the\npathname of a file owned by the user, and that the pathname always includes the directory that the file is\nlocated in. Step 2 prints an error if `.backup` already exists; ignore this.\n\nHint: If `str` is a variable then `${str%pattern}` removes the shortest trailing part of `str` matching\n`pattern`, and `${str##pattern}` removes the longest leading part of `str` matching `pattern`.\n\nExample:\n```\nbackup.sh /home/user1/somedir/notes.txt\n```\ncreates `/home/user1/somedir/.backup` and copies the file to `/home/user1/somedir/.backup/notes.txt.bak`","answer":"```bash\n#!/bin/bash\n\npathname=$1\n\n# Step 1\ndir=${pathname%/*}\nname=${pathname##*/}\n\n# Step 2\nbackupdir=$dir/.backup\nmkdir \"$backupdir\"\n\n# Step 3\nchmod u=rwx,g=rx,o= \"$backupdir\"     # or: chmod 750 \"$backupdir\"\n\n# Step 4\necho \"backing up $pathname\"\n\n# Step 5\ncp \"$pathname\" \"$backupdir/$name.bak\"\n```","grading":"`${pathname##*/}` gives the file name (longest leading `*/` removed); `basename \"$1\"` accepted. Permissions must be 750 (`u=rwx,g=rx,o=`). Copy, not move. All pathname variables must be quoted (names may contain spaces). The `.bak` suffix must be appended to the name: `\"$backupdir/$name.bak\"`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and uses `$1`"},{"marks":2,"item":"Step 1: dir via `${pathname%/*}` and name via `${pathname##*/}`"},{"marks":2,"item":"Step 2: `mkdir \"$dir/.backup\"`"},{"marks":2,"item":"Step 3: `chmod 750` (or symbolic equivalent)"},{"marks":1,"item":"Step 4: correct message"},{"marks":2,"item":"Step 5: `cp \"$pathname\" \"$backupdir/$name.bak\"` quoted"}],"variantOf":"q23a-5","sourceId":"q23a"},{"id":"q23b-1a","source":"Quiz 2, 2023, Q1A","kind":"short","marks":1,"topics":["regex"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nA) What does the metacharacter `?` mean in a regular expression?","answer":"Zero or one occurrence of the preceding atom (the preceding character, bracket expression or group is optional).","grading":"Must say zero-or-one AND that it applies to the preceding item. \"Any single character\" is the GLOB meaning of `?` (that is `.` in a regex) and is wrong.","rubric":[{"marks":1,"item":"Zero or one instance of the preceding atom"}],"variantOf":null,"sourceId":"q23b"},{"id":"q23b-1a-v","source":"Variant of Quiz 2, 2023, Q1A","kind":"short","marks":1,"topics":["regex"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nA) What does the metacharacter `+` mean in a regular expression?","answer":"One or more occurrences of the preceding atom.","grading":"Must be one-or-more of the preceding item. \"Zero or more\" is `*` (wrong).","rubric":[{"marks":1,"item":"One or more instances of the preceding atom"}],"variantOf":"q23b-1a","sourceId":"q23b"},{"id":"q23b-1b","source":"Quiz 2, 2023, Q1B","kind":"short","marks":1,"topics":["regex"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nB) Provide a regular expression that matches all strings that start and end with a lowercase English letter.","answer":"```\n^[a-z](.*[a-z])?$\n```\n\nThis matches a single lowercase letter (e.g. `a`) as well as longer strings such as `a1b`.","grading":"Exactly correct: `^[a-z](.*[a-z])?$` or `^[a-z]$|^[a-z].*[a-z]$`. The posted solution also lists `^[a-z]+$` and `^[a-z]*[a-z]$` as \"correct\" (those only match strings made entirely of lowercase letters, e.g. not `a1b`, so they read the question as \"lowercase-letter strings\"), and says `^[a-z].*[a-z]$` was \"sufficient for the quiz\" even though it misses one-letter strings. Give the mark for any of these, but mention the single-letter edge case if it is missed. Missing anchors (`[a-z].*[a-z]`) loses the mark, as does a glob such as `[a-z]*[a-z]`.","rubric":[{"marks":1,"item":"Anchored regex requiring a lowercase letter at both the start and the end"}],"variantOf":null,"sourceId":"q23b"},{"id":"q23b-1b-v","source":"Variant of Quiz 2, 2023, Q1B","kind":"short","marks":1,"topics":["regex"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nB) Provide a regular expression that matches all strings that start with a digit and end with an uppercase English letter.","answer":"```\n^[0-9].*[A-Z]$\n```\n\n(A single character cannot be both a digit and an uppercase letter, so every match has at least two characters and `.*` in the middle is exactly right.)","grading":"Needs both anchors, `[0-9]` at the start, `[A-Z]` at the end and `.*` between. `^[0-9]+[A-Z]+$` is too narrow (rejects `1xQ`). `[[:digit:]]`/`[[:upper:]]` are fine.","rubric":[{"marks":1,"item":"`^[0-9].*[A-Z]$` or equivalent"}],"variantOf":"q23b-1b","sourceId":"q23b"},{"id":"q23b-1c","source":"Quiz 2, 2023, Q1C","kind":"short","marks":1,"topics":["arrays"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nC) Show how to create a Bash array `arr` that contains the values 1, 2, and 3.","answer":"```bash\narr=(1 2 3)\n```","grading":"No spaces around `=`, no commas. `arr=(1, 2, 3)` or `arr=[1 2 3]` is wrong. `declare -a arr=(1 2 3)` and assigning each `arr[0]=1` etc. are fine.","rubric":[{"marks":1,"item":"`arr=(1 2 3)`"}],"variantOf":null,"sourceId":"q23b"},{"id":"q23b-1c-v","source":"Variant of Quiz 2, 2023, Q1C","kind":"short","marks":1,"topics":["arrays","quoting"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nC) Show how to create a Bash array `names` that contains the two values `Ann Lee` and `Bo Li` (each value contains a space).","answer":"```bash\nnames=(\"Ann Lee\" \"Bo Li\")\n```","grading":"Each element must be quoted, otherwise word splitting makes four elements. No commas, no spaces around `=`.","rubric":[{"marks":1,"item":"`names=(\"Ann Lee\" \"Bo Li\")` with each element quoted"}],"variantOf":"q23b-1c","sourceId":"q23b"},{"id":"q23b-1d","source":"Quiz 2, 2023, Q1D","kind":"short","marks":1,"topics":["arrays"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nD) Given a Bash array `arr`, show how to get the number of elements in `arr`.","answer":"```bash\n${#arr[@]}\n```","grading":"`${#arr[@]}` or `${#arr[*]}`. `${#arr}` is the length of element 0 (wrong); `$#` is the argument count (wrong).","rubric":[{"marks":1,"item":"`${#arr[@]}` or `${#arr[*]}`"}],"variantOf":null,"sourceId":"q23b"},{"id":"q23b-1d-v","source":"Variant of Quiz 2, 2023, Q1D","kind":"short","marks":1,"topics":["arrays"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nD) Given a Bash array `arr`, show how to append the value `4` to the end of `arr`.","answer":"```bash\narr+=(4)\n```","grading":"`arr+=(4)` (or `arr[${#arr[@]}]=4`, fine for a contiguous array). `arr+=4` is wrong: it appends the text 4 to element 0.","rubric":[{"marks":1,"item":"`arr+=(4)` with the parentheses"}],"variantOf":"q23b-1d","sourceId":"q23b"},{"id":"q23b-1e","source":"Quiz 2, 2023, Q1E","kind":"short","marks":1,"topics":["conditionals","files"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nE) Suppose that you have a variable `f` that stores the name of a file. Write a Bash `if` statement that prints the message `not readable` to standard output if the file whose name is stored in `f` is not a readable file.","answer":"```bash\nif [[ ! -r $f ]]; then echo \"not readable\"; fi\n```","grading":"Needs `!` and `-r` inside `[[ ]]` (`[ ! -r \"$f\" ]` fine), plus `then` and `fi`. Inside `[[ ]]` quoting `$f` is optional. Missing `; then` (when on one line) or `fi` loses the mark. `-e`/`-f` test something else.","rubric":[{"marks":1,"item":"Complete `if [[ ! -r $f ]]; then echo \"not readable\"; fi`"}],"variantOf":null,"sourceId":"q23b"},{"id":"q23b-1e-v","source":"Variant of Quiz 2, 2023, Q1E","kind":"short","marks":1,"topics":["conditionals","files"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nE) Suppose that you have a variable `d` that stores a name. Write a Bash `if` statement that prints the message `no such directory` to standard output if `d` is not the name of an existing directory.","answer":"```bash\nif [[ ! -d $d ]]; then echo \"no such directory\"; fi\n```","grading":"Needs `! -d`, `then`, `fi`. `-e` is not enough (a regular file exists but is not a directory).","rubric":[{"marks":1,"item":"Complete `if [[ ! -d $d ]]; then ...; fi`"}],"variantOf":"q23b-1e","sourceId":"q23b"},{"id":"q23b-1f","source":"Quiz 2, 2023, Q1F","kind":"short","marks":1,"topics":["loops","quoting"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nF) Fill in the blank in the following Bash `for` loop so that the loop processes each command line argument given to a script:\n\n```bash\nfor ____________________; do\n    # loop body not shown\ndone\n```","answer":"```bash\nfor arg in \"$@\"; do\n    echo \"$arg\"    # loop body\ndone\n```\n\nThe blank is `arg in \"$@\"`.","grading":"`arg in \"$@\"` (any variable name). Quotes around `$@` are needed so arguments with spaces stay whole; unquoted `$@` or `$*` loses the mark under course conventions. `for arg; do` (no `in` list) is also correct. `for (( i = 1; i <= $#; i++ ))` gives indexes, not arguments, unless the body is shown to use them.","rubric":[{"marks":1,"item":"`arg in \"$@\"` with quotes"}],"variantOf":null,"sourceId":"q23b"},{"id":"q23b-1f-v","source":"Variant of Quiz 2, 2023, Q1F","kind":"short","marks":1,"topics":["loops","arrays","quoting"],"prompt":"Question 1 (1 mark each). Your answer for each of the following parts should be very brief.\n\nF) Fill in the blank in the following Bash `for` loop so that the loop processes each element of an array `arr` (elements may contain spaces):\n\n```bash\nfor ____________________; do\n    # loop body not shown\ndone\n```","answer":"```bash\nfor elem in \"${arr[@]}\"; do\n    echo \"$elem\"    # loop body\ndone\n```\n\nThe blank is `elem in \"${arr[@]}\"`.","grading":"Must be `\"${arr[@]}\"` quoted. `${arr[@]}` unquoted splits elements with spaces; `\"${arr[*]}\"` gives one single string; `$arr` gives only element 0.","rubric":[{"marks":1,"item":"`elem in \"${arr[@]}\"` quoted"}],"variantOf":"q23b-1f","sourceId":"q23b"},{"id":"q23b-4","source":"Quiz 2, 2023, Q4","kind":"long","marks":10,"topics":["functions","arrays","loops","arithmetic","scripts"],"prompt":"Question 4 (10 marks).\n\nThe selection sort algorithm for sorting an array `arr` of `n` integers can be described as follows:\n\n```\nfor j=0, 1, 2, ..., n-1\n   idx = minidx(j)\n   swap arr[j] and arr[idx]\n```\n\nThe function call `minidx(j)` finds the index of the minimum element in `arr` starting at index `j`\nand going to the end of `arr`. For example, if `arr` is the array\n\n```\n[0, 3, 1, 4, 2]\n```\n\nthen\n\n```\nminidx(0) returns 0\nminidx(1) returns 2\nminidx(2) returns 2\nminidx(3) returns 4\nminidx(4) returns 4\n```\n\nComplete the following Bash script so that it implements the selection sort algorithm to sort the\ncommand line arguments provided to the script. The functions `sort` and `minidx` are the\nselection sort algorithm and minimum index algorithm described above.\n\n```bash\n#!/bin/bash\n\nfunction sort {\n}\n\nfunction minidx {\n}\n\n# places the command line arguments into arr and calls sort\narr=(\"$@\")\nsort\n\n# print the sorted elements of arr on a single line after this comment\n```\n\nYou may answer this question by providing implementations of the `sort` and `minidx` functions\nand by showing how to print the elements of the sorted array on a single line.\n\nNo error checking is required. You may assume that the command line arguments provided to the\nscript are always integers.\n\nYou may choose how to call `minidx` and how to return a value from `minidx`.","answer":"```bash\n#!/bin/bash\n\nsort() {\n    local n=${#arr[@]}\n    local j tmp\n    for (( j = 0; j < n; j++ )); do\n        minidx \"$j\"                 # sets the global variable idx\n        tmp=${arr[j]}\n        arr[j]=${arr[idx]}\n        arr[idx]=$tmp\n    done\n}\n\nminidx() {\n    local start=$1\n    local n=${#arr[@]}\n    local i\n    idx=$start                      # result returned in the global idx\n    for (( i = start + 1; i < n; i++ )); do\n        if (( arr[i] < arr[idx] )); then\n            idx=$i\n        fi\n    done\n}\n\n# places the command line arguments into arr and calls sort\narr=(\"$@\")\nsort\n\n# print the sorted elements of arr on a single line after this comment\necho \"${arr[@]}\"\n```\n\nTested: `./sort.sh 0 3 1 4 2` prints `0 1 2 3 4`; `./sort.sh 5 -3 10 -3 0 7` prints `-3 -3 0 5 7 10`.","grading":"Any correct way to return the index is fine: a global variable (dynamic scoping, as above) or printing it and capturing with `idx=$(minidx \"$j\")`. `return idx` is NOT acceptable as a general solution (exit status is 0-255) - deduct 1 mark. Comparison must be numeric: `(( ... < ... ))` or `[[ $a -lt $b ]]`; `[[ $a < $b ]]` is a STRING comparison (wrong for e.g. 10 vs 9) - deduct. The swap needs a temporary variable. `n` must be known before `sort` runs: the posted solution sets `n=${#arr[@]}` but only after the call to `sort` in its layout, so compute `n` inside the functions or before `sort` is called. Keeping the printed `function sort {` style is fine. Watch for `minidx` clobbering the caller's loop variable when both use the same global name (e.g. both use `i` without `local`). Print with `echo \"${arr[@]}\"` (or `${arr[*]}`).","rubric":[{"marks":2,"item":"minidx loops i from start+1 to n-1 over arr"},{"marks":2,"item":"minidx uses a numeric comparison and tracks the index of the smallest value"},{"marks":1,"item":"minidx returns the index via a global variable or echo + command substitution (not `return`)"},{"marks":2,"item":"sort loops j from 0 to n-1 and calls minidx with j"},{"marks":2,"item":"sort swaps arr[j] and arr[idx] correctly using a temporary"},{"marks":1,"item":"Prints the sorted array on one line with `echo \"${arr[@]}\"`"}],"variantOf":null,"sourceId":"q23b"},{"id":"q23b-4-v","source":"Variant of Quiz 2, 2023, Q4","kind":"long","marks":10,"topics":["functions","arrays","loops","arithmetic","scripts"],"prompt":"Question 4 (10 marks).\n\nThe selection sort algorithm for sorting an array `arr` of `n` integers into DESCENDING order (largest first) can be described as follows:\n\n```\nfor j=0, 1, 2, ..., n-1\n   idx = maxidx(j)\n   swap arr[j] and arr[idx]\n```\n\nThe function call `maxidx(j)` finds the index of the maximum element in `arr` starting at index `j`\nand going to the end of `arr`. For example, if `arr` is the array\n\n```\n[0, 3, 1, 4, 2]\n```\n\nthen\n\n```\nmaxidx(0) returns 3\nmaxidx(1) returns 3\nmaxidx(2) returns 3\nmaxidx(3) returns 3\nmaxidx(4) returns 4\n```\n\nComplete the following Bash script so that it implements the selection sort algorithm to sort the\ncommand line arguments provided to the script into descending order. The functions `sort_desc` and `maxidx`\nare the selection sort algorithm and maximum index algorithm described above.\n\n```bash\n#!/bin/bash\n\nfunction sort_desc {\n}\n\nfunction maxidx {\n}\n\n# places the command line arguments into arr and calls sort_desc\narr=(\"$@\")\nsort_desc\n\n# print the sorted elements of arr on a single line after this comment\n```\n\nYou may answer this question by providing implementations of the `sort_desc` and `maxidx` functions\nand by showing how to print the elements of the sorted array on a single line.\n\nNo error checking is required. You may assume that the command line arguments provided to the\nscript are always integers.\n\nYou may choose how to call `maxidx` and how to return a value from `maxidx`.","answer":"```bash\n#!/bin/bash\n\nsort_desc() {\n    local n=${#arr[@]}\n    local j tmp idx\n    for (( j = 0; j < n; j++ )); do\n        idx=$(maxidx \"$j\")          # maxidx prints its result\n        tmp=${arr[j]}\n        arr[j]=${arr[idx]}\n        arr[idx]=$tmp\n    done\n}\n\nmaxidx() {\n    local start=$1\n    local n=${#arr[@]}\n    local i\n    local hi=$start\n    for (( i = start + 1; i < n; i++ )); do\n        if (( arr[i] > arr[hi] )); then\n            hi=$i\n        fi\n    done\n    echo \"$hi\"\n}\n\n# places the command line arguments into arr and calls sort_desc\narr=(\"$@\")\nsort_desc\n\n# print the sorted elements of arr on a single line after this comment\necho \"${arr[@]}\"\n```\n\nTested: `./sort.sh 0 3 1 4 2` prints `4 3 2 1 0`; `./sort.sh 12 9 100 1` prints `100 12 9 1`.","grading":"Same marking as the original. The comparison must be `>` (numeric). Returning the index with echo + `$( )` works because the subshell can still read `arr`; a global variable is also fine. `return` for the index is not acceptable. Swap needs a temporary.","rubric":[{"marks":2,"item":"maxidx loops i from start+1 to n-1"},{"marks":2,"item":"maxidx uses a numeric `>` comparison and tracks the index of the largest value"},{"marks":1,"item":"maxidx returns the index via echo + command substitution or a global"},{"marks":2,"item":"sort_desc loops j from 0 to n-1 calling maxidx j"},{"marks":2,"item":"Correct swap of arr[j] and arr[idx] with a temporary"},{"marks":1,"item":"Prints `\"${arr[@]}\"` on one line"}],"variantOf":"q23b-4","sourceId":"q23b"},{"id":"f16-1","source":"Final exam 2016, Q1","kind":"long","marks":10,"topics":["scripts","loops","globs","expansions","arithmetic","conditionals"],"prompt":"**Question 1 (10 points): Shell Scripting**\n\nSuppose there is a program on your path called `score`, which takes the name of a file as a parameter and prints an integer score for that file, which will always be between 0 and 100.\n\nWrite a script called `maxScore` that takes the name of a directory as its only parameter and prints the highest score reported by the `score` program for any file in that directory.\n\nYour script may assume that there is at least one file in the directory. If there is a tie for the highest score it's not a problem; your script should just print that highest score.\n\nPlease note that I am *not* asking you to write the `score` program. Just assume that it exists, so that whenever you type\n\n```\nscore filename\n```\n\nand *filename* is the name of an existing file, the command will print an integer between 0 and 100 to the standard output. Your job is just to write a `maxScore` script.\n\nFor example, suppose my current directory has a sub-directory called `myfiles` which contains four files, called `fileA`, `fileB`, `fileC` and `fileD`. Here is what happens when I invoke the `score` program with each of these four files:\n\n```\n-------$ score myfiles/fileA\n34\n-------$ score myfiles/fileB\n57\n-------$ score myfiles/fileC\n44\n-------$ score myfiles/fileD\n56\n```\n\nThe command `score myfiles` should print 57, since that is the largest score of any of the files in the `myfiles` directory.","answer":"```bash\n#!/bin/bash\nmax=0\nfor f in \"$1\"/*; do\n    if [[ -f \"$f\" ]]; then\n        s=$(score \"$f\")\n        if (( s > max )); then\n            max=$s\n        fi\n    fi\ndone\necho \"$max\"\n```\n\nStarting `max` at 0 is safe because every score is between 0 and 100. With the example directory, `maxScore myfiles` prints `57`.","grading":"The paper's last line says \"The command `score myfiles` should print 57\"; that is a typo for `maxScore myfiles`. Don't penalise a student who points this out.\n\nEssential:\n- Loop over the files in the directory named by `$1`, e.g. `for f in \"$1\"/*`. Looping over `$(ls \"$1\")` loses the directory part (then `score` gets `fileA` instead of `myfiles/fileA`) and breaks on names with spaces. Take marks off unless the student puts the directory back (`\"$1/$f\"`).\n- Capture each score with command substitution: `s=$(score \"$f\")`.\n- Compare numerically with `(( s > max ))` or `[[ $s -gt $max ]]`. `[[ $s > $max ]]` compares strings, so \"9\" > \"57\"; that is a real bug and loses the comparison mark.\n- Keep a running maximum, initialised to 0 (or -1, or the first file's score), and print it once after the loop.\n\nAccepted alternatives:\n- A pipeline: `for f in \"$1\"/*; do score \"$f\"; done | sort -n | tail -n 1` (or `sort -rn | head -n 1`) gets full marks. Plain `sort` without `-n` is wrong (it sorts as text).\n- Skipping the `[[ -f \"$f\" ]]` test is fine; the question says the directory holds files.\n- Using `$1` without quotes loses at most a fraction of a mark under course conventions (quote `\"$1\"` and `\"$f\"`). Not handling a missing argument is fine; the question doesn't ask for it.\n\nCommon wrong answers: printing inside the loop (prints several lines); `max=s` without `$` outside `(( ))`; resetting `max` inside the loop; forgetting `#!/bin/bash` (minor).","rubric":[{"marks":1,"item":"#!/bin/bash and uses $1 as the directory"},{"marks":2,"item":"Loops over every file in the directory with the path kept (\"$1\"/*), quoted"},{"marks":2,"item":"Runs score on each file and captures its output with $( )"},{"marks":2,"item":"Correct numeric comparison ((( )) or -gt), not a string comparison"},{"marks":2,"item":"Running maximum initialised sensibly and updated correctly"},{"marks":1,"item":"Prints the maximum exactly once, after the loop"}],"variantOf":null,"sourceId":"f16"},{"id":"f16-1-v","source":"Variant of Final exam 2016, Q1","kind":"long","marks":10,"topics":["scripts","loops","globs","expansions","arithmetic","conditionals","quoting"],"prompt":"**Shell Scripting**\n\nSuppose there is a program on your path called `rating`, which takes the name of a file as a parameter and prints an integer rating for that file, which will always be between 1 and 10.\n\nWrite a script called `lowestFile` that takes the name of a directory as its only parameter and prints the **name** (without the directory part) of the file in that directory with the lowest rating reported by the `rating` program.\n\nYour script may assume that there is at least one file in the directory. If several files tie for the lowest rating, your script may print the name of any one of them. File names may contain spaces.\n\nPlease note that I am *not* asking you to write the `rating` program. Just assume that it exists, so that whenever you type\n\n```\nrating filename\n```\n\nand *filename* is the name of an existing file, the command will print an integer between 1 and 10 to the standard output.\n\nFor example, suppose my current directory has a sub-directory called `reviews` which contains the files `alpha`, `beta file` and `gamma`:\n\n```\n-------$ rating reviews/alpha\n7\n-------$ rating \"reviews/beta file\"\n3\n-------$ rating reviews/gamma\n9\n-------$ lowestFile reviews\nbeta file\n```","answer":"```bash\n#!/bin/bash\nmin=11\nfor f in \"$1\"/*; do\n    if [[ -f \"$f\" ]]; then\n        r=$(rating \"$f\")\n        if (( r < min )); then\n            min=$r\n            lowest=$f\n        fi\n    fi\ndone\nbasename \"$lowest\"\n```\n\nStarting `min` at 11 (above any possible rating) means the first file always replaces it. `\"${lowest##*/}\"` instead of `basename` is also fine.","grading":"Essential:\n- Loop over `\"$1\"/*` (or loop over the names and build `\"$1/$f\"`). The quotes matter here because the question says names may contain spaces: `for f in $(ls \"$1\")` splits `beta file` into two words and should lose marks.\n- Capture `rating \"$f\"` with `$( )`, and quote `\"$f\"` in the call.\n- Numeric comparison `(( r < min ))` or `[[ $r -lt $min ]]`; `[[ $r < $min ]]` is a string comparison and is a bug (\"10\" < \"3\").\n- Track both the minimum value and the file that holds it, and update both together.\n- Print only the file name, without the directory: `basename \"$lowest\"`, `${lowest##*/}`, or loop with `cd \"$1\"` first. Printing `reviews/beta file` loses the output mark.\n\nAccepted: initialising `min` from the first file, or to any value > 10; a `sort -n | head -n 1` pipeline that keeps the names (e.g. printing \"rating name\" pairs then cutting) if it handles spaces correctly. Using `<=` instead of `<` (printing the last of the tied files) is fine.","rubric":[{"marks":1,"item":"#!/bin/bash and uses $1 as the directory"},{"marks":2,"item":"Loops over every file in the directory, quoted so names with spaces work"},{"marks":2,"item":"Runs rating on each file and captures its output with $( )"},{"marks":2,"item":"Correct numeric comparison ((( )) or -lt) with a sensible starting minimum"},{"marks":2,"item":"Remembers the file name along with the minimum and updates both together"},{"marks":1,"item":"Prints only the file name (no directory part), once, after the loop"}],"variantOf":"f16-1","sourceId":"f16"},{"id":"f15-1","source":"Final exam 2015, Q1","kind":"long","marks":5,"topics":["scripts","loops","conditionals","commands"],"prompt":"**Question 1 (5 points): Linux Scripting**\n\nSuppose that on your Linux system there is a command called `legal`, which takes the name of a file as an argument and checks whether the file is \"legal\" according to some set of conditions. The command never prints any output, either to the standard output or the standard error stream. It finishes with exit status zero if the file is \"legal\"; otherwise it finishes with a non-zero status.\n\nThere is another command called `rating`, which takes the name of a file as an argument and prints a rating (a number between 1 and 4) on the standard output. It never prints anything besides this number, either on the standard output or the standard error.\n\nWrite a Linux script that takes the name of a directory as its only argument. It must print the number of files in the directory that are \"legal\" and get a rating of 4 from the `rating` command. Your script should print nothing but a number. It should be looking at files in the directory named by the argument, but not in sub-directories.\n\nFor example, suppose there are 19 files in the current directory. Ten of them are legal and nine are not. Of the ten legal files, six get a rating of 4. Your script should print 6 and nothing else. It's possible that some of the illegal files also get a rating of 4, but that should not increase the count.\n\nIf there are no legal files in the directory that get a rating of 4, your script should print 0.\n\nYour script doesn't have to do any error checking. You may assume that it will be called with exactly one argument, and that this argument will be the name of an existing, readable directory.","answer":"```bash\n#!/bin/bash\ncount=0\nfor f in \"$1\"/*; do\n    if [[ -f \"$f\" ]] && legal \"$f\" && (( $(rating \"$f\") == 4 )); then\n        count=$((count + 1))\n    fi\ndone\necho \"$count\"\n```","grading":"Essentials: loop over the entries of the directory `\"$1\"/*` (not a recursive search); use `legal`'s **exit status** directly as the condition (`if legal \"$f\"` or `legal \"$f\"; if (( $? == 0 ))`), NOT its output (it prints nothing, so `[[ $(legal \"$f\") ]]` is wrong); capture `rating`'s **output** with command substitution `$(rating \"$f\")` and compare to 4 (`(( ... == 4 ))`, `[[ $(rating \"$f\") -eq 4 ]]` or `[[ $(rating \"$f\") == 4 ]]` all fine); increment only when both hold; print only the count, and print 0 when nothing matches (so initialise the counter to 0).\n\nAccepted alternatives: `for f in \"$1\"/*` with or without the `[[ -f \"$f\" ]]` test (the question says files; skipping sub-directories is good practice but should not lose marks); `cd \"$1\"` then `for f in *`; calling `rating` only after `legal` succeeds or the other way round; counting with `((count++))`, `count=$((count+1))`, or echoing names and piping to `wc -l` (as long as only a number is printed). Ignoring dot-files is fine.\n\nLoses marks: unquoted `$f`/`$1` (breaks on names with spaces; the course requires quotes); using `ls \"$1\"` output in a loop without prefixing the directory (calls `legal name` instead of `legal dir/name`); testing `legal`'s output instead of its exit status; printing extra text such as \"Count: 6\"; searching sub-directories; comparing with `=` inside `(( ))` (that is assignment).","rubric":[{"marks":1,"item":"Loops over each entry in the directory given by \"$1\" (e.g. for f in \"$1\"/*), correctly quoted, not recursive"},{"marks":1,"item":"Uses legal's exit status (not its output) as the test"},{"marks":1,"item":"Captures rating's output with $(rating \"$f\") and compares it numerically/string-wise to 4"},{"marks":1,"item":"Increments a counter only when the file is legal AND rated 4"},{"marks":1,"item":"Prints only the final number, which is 0 when there are no matches (counter initialised)"}],"variantOf":null,"sourceId":"f15"},{"id":"f15-1-v","source":"Variant of Final exam 2015, Q1","kind":"long","marks":5,"topics":["scripts","loops","conditionals","commands","strings"],"prompt":"**Linux Scripting**\n\nSuppose that on your Linux system there is a command called `approved`, which takes the name of a file as an argument and checks whether the file is \"approved\". The command never prints any output, either to the standard output or the standard error stream. It finishes with exit status zero if the file is approved; otherwise it finishes with a non-zero status.\n\nThere is another command called `sizeclass`, which takes the name of a file as an argument and prints one of the words `small`, `medium` or `large` on the standard output. It never prints anything besides this word, either on the standard output or the standard error.\n\nWrite a Linux script that takes the name of a directory as its only argument. It must print the number of files in the directory that are **not** approved and that get the class `large` from the `sizeclass` command. Your script should print nothing but a number. It should be looking at files in the directory named by the argument, but not in sub-directories.\n\nFor example, suppose there are 12 files in the directory. Five of them are not approved, and of those five, two are classed `large`. Your script should print 2 and nothing else. Approved files that are classed `large` must not increase the count.\n\nIf there are no such files, your script should print 0.\n\nYour script doesn't have to do any error checking. You may assume that it will be called with exactly one argument, and that this argument will be the name of an existing, readable directory.","answer":"```bash\n#!/bin/bash\ncount=0\nfor f in \"$1\"/*; do\n    if [[ -f \"$f\" ]] && ! approved \"$f\" && [[ \"$(sizeclass \"$f\")\" == \"large\" ]]; then\n        count=$((count + 1))\n    fi\ndone\necho \"$count\"\n```","grading":"Essentials: loop over `\"$1\"/*` (not recursive); use `approved`'s **exit status**, negated (`! approved \"$f\"`, or `approved \"$f\"` then `(( $? != 0 ))`, or put the count in the `else` branch); capture `sizeclass`'s **output** with `$(sizeclass \"$f\")` and compare as a **string** with `[[ ... == large ]]` (not `-eq`, and not inside `(( ))`); print only the number, 0 if none.\n\nAccepted alternatives: with or without `[[ -f \"$f\" ]]`; `cd \"$1\"` then `for f in *`; `((count++))`; piping matching names to `wc -l`. Ignoring dot-files is fine.\n\nLoses marks: forgetting the negation (counting approved files); using `-eq` or `(( ))` for the word comparison; unquoted variables; using `approved`'s output instead of its status; extra output; recursing into sub-directories.","rubric":[{"marks":1,"item":"Loops over each entry in the directory \"$1\" (quoted, not recursive)"},{"marks":1,"item":"Uses approved's exit status, correctly negated, as the test"},{"marks":1,"item":"Captures sizeclass output with $(...) and compares it as a string to large"},{"marks":1,"item":"Increments a counter only when both conditions hold"},{"marks":1,"item":"Prints only the final number, 0 when there are no matches"}],"variantOf":"f15-1","sourceId":"f15"},{"id":"f15-3","source":"Final exam 2015, Q3","kind":"long","marks":5,"topics":["loops","functions","regex"],"prompt":"**Question 3 (5 points): Linux Text Tools**\n\nYou have a directory called `ChristmasFiles`. That directory contains many sub directories and sub-sub directories and so on. There are many files in these directories. You believe that at some time you created a file in that directory tree that had information about Rudolph the Red Nosed Reindeer, but you don't remember where it is. All you're sure about is that its extension was `.txt`.\n\nWrite a command or series of commands that will help you locate this information. It must look through all of the files in that directory tree with extension `.txt`. For each `.txt` file, it must print each line inside that file that contains the string \"Rudolph\". \"Rudolph\" can appear anywhere in a line and doesn't have to be a separate word; a line containing a word like \"Rudolphs\" or \"SirRudolph\" should show up in the output. Print the whole line for each match, not just the word \"Rudolph\".","answer":"```bash\n#!/bin/bash\n# search DIR: print every line containing Rudolph in the .txt files under DIR, at any depth\nsearch() {\n    local f\n    for f in \"$1\"/*; do\n        if [[ -d $f ]]; then\n            search \"$f\"\n        elif [[ -f $f && $f == *.txt ]]; then\n            grep Rudolph \"$f\"\n        fi\n    done\n}\n\nsearch ChristmasFiles\n```\n\nA one-line alternative that the course notebooks don't teach, but that works: `grep -r --include='*.txt' Rudolph ChristmasFiles`","grading":"Any approach that finds every .txt file at ANY depth under ChristmasFiles and prints each whole line containing `Rudolph` earns full marks: a recursive function (as in the model answer), `grep -r --include='*.txt' Rudolph ChristmasFiles`, `find ChristmasFiles -name '*.txt' -exec grep Rudolph {} +`, or `shopt -s globstar; grep Rudolph ChristmasFiles/**/*.txt`. Printing the file name before each line (as `grep -r` does) is fine. `Rudolph` must match as a substring (plain `grep Rudolph`, not `grep -w`). Lose the depth mark for searching only the top level (`grep Rudolph ChristmasFiles/*.txt`) or a fixed number of levels. Lose the file-type mark for searching every file rather than only .txt files. In a recursive function, `local f` matters: without it, the loop variable is shared with the caller and the search can go wrong after returning from a subdirectory.","rubric":[{"marks":2,"item":"Visits files at every depth of the tree (recursion, `grep -r`, `find`, or `**`), not just the top level"},{"marks":1,"item":"Only searches files whose names end in `.txt`"},{"marks":2,"item":"Prints each whole line that contains `Rudolph` anywhere (substring match, e.g. plain `grep Rudolph`)"}],"variantOf":null,"sourceId":"f15"},{"id":"f15-3-v","source":"Variant of Final exam 2015, Q3","kind":"long","marks":5,"topics":["loops","functions","regex"],"prompt":"You have a directory called `projects`. It contains sub directories, sub-sub directories and so on, holding many files. Somewhere in that tree you left notes to yourself in Bash scripts: lines that contain the string `TODO`. All the scripts have the extension `.sh`.\n\nWrite a command or series of commands that looks through **all** of the files with extension `.sh` in that directory tree, at any depth, and prints each line that contains the string `TODO`. `TODO` can appear anywhere in a line (for example `# TODO: fix this` or `TODOs`). Print the whole line for each match. Files with other extensions must not be searched.","answer":"```bash\n#!/bin/bash\n# search DIR: print every line containing TODO in the .sh files under DIR, at any depth\nsearch() {\n    local f\n    for f in \"$1\"/*; do\n        if [[ -d $f ]]; then\n            search \"$f\"\n        elif [[ -f $f && $f == *.sh ]]; then\n            grep TODO \"$f\"\n        fi\n    done\n}\n\nsearch projects\n```\n\nA one-line alternative that the course notebooks don't teach, but that works: `grep -r --include='*.sh' TODO projects`","grading":"Any approach that finds every .sh file at ANY depth under projects and prints each whole line containing `TODO` earns full marks: a recursive function (as in the model answer), `grep -r --include='*.sh' TODO projects`, `find projects -name '*.sh' -exec grep TODO {} +`, or `shopt -s globstar; grep TODO projects/**/*.sh`. Printing the file name before each line (as `grep -r` does) is fine. `TODO` must match as a substring (plain `grep TODO`, not `grep -w`). Lose the depth mark for searching only the top level (`grep TODO projects/*.sh`) or a fixed number of levels. Lose the file-type mark for searching every file rather than only .sh files. In a recursive function, `local f` matters: without it, the loop variable is shared with the caller and the search can go wrong after returning from a subdirectory.","rubric":[{"marks":2,"item":"Visits files at every depth of the tree (recursion, `grep -r`, `find`, or `**`), not just the top level"},{"marks":1,"item":"Only searches files whose names end in `.sh`"},{"marks":2,"item":"Prints each whole line that contains `TODO` anywhere (substring match, e.g. plain `grep TODO`)"}],"variantOf":"f15-3","sourceId":"f15"},{"id":"f14-1a","source":"Final exam 2014, Q1A","kind":"long","marks":5,"topics":["scripts","loops","strings","conditionals"],"prompt":"**Question 1 (10 points): Linux & Bash**\n\n**A (5 points):** Write a bash script that prints the third character of each of its arguments, all in one line with no spaces between. If any of the arguments has fewer than three characters, print nothing for it. If there are no arguments or if none of the arguments have three or more characters, your script may either print nothing or print a blank line.\n\nExample (if your script is called `thirdChars`):\n```\n-------$ thirdChars apple xx orange y \"\" banana\npan\n```","answer":"```bash\n#!/bin/bash\nresult=\"\"\nfor arg in \"$@\"; do\n    if (( ${#arg} >= 3 )); then\n        result+=\"${arg:2:1}\"\n    fi\ndone\necho \"$result\"\n```\n\nAn equivalent approach prints each character with `echo -n \"${arg:2:1}\"` inside the loop and a final `echo` after it.","grading":"Essential: loop over all arguments with `for arg in \"$@\"` (or `for arg` / shifting through `$1`); extract the third character with `${arg:2:1}` (index 2, length 1); skip arguments shorter than 3 characters (`(( ${#arg} >= 3 ))` or `[[ ${#arg} -ge 3 ]]`); output all on one line with no spaces.\n- Accept accumulating into a string and echoing once, or `echo -n`/`printf '%s'` per character followed by one trailing newline (or none).\n- Note: `${arg:2:1}` on a short string already expands to empty, so a solution that omits the length test still prints the correct output; accept it for full marks if the output is correct, but the grader may note the explicit test is clearer.\n- Lose marks for: `${arg:3:1}` or `${arg:2}` (off-by-one / whole remainder); `echo \"${arg:2:1}\"` per argument (prints on separate lines); using `$*` unquoted or `$@` unquoted (breaks on the `\"\"` argument only in loop counts, but missing quotes is against course conventions; deduct at most 1 mark); spaces between characters (e.g. `echo $result` built from a list joined with spaces).\n- Using `cut -c3` per argument is acceptable if output is on one line.","rubric":[{"marks":1,"item":"Loops over every command-line argument (\"$@\")"},{"marks":1,"item":"Tests the argument's length (${#arg}) and skips arguments shorter than 3 characters (or equivalent correct behaviour)"},{"marks":2,"item":"Extracts exactly the third character, e.g. ${arg:2:1}"},{"marks":1,"item":"Prints all characters on a single line with no spaces between them"}],"variantOf":null,"sourceId":"f14"},{"id":"f14-1a-v","source":"Variant of Final exam 2014, Q1A","kind":"long","marks":5,"topics":["scripts","loops","strings","conditionals"],"prompt":"**A (5 points):** Write a bash script that prints the second-to-last character of each of its arguments, all in one line with no spaces between. If any of the arguments has fewer than two characters, print nothing for it. If there are no arguments or if none of the arguments have two or more characters, your script may either print nothing or print a blank line.\n\nExample (if your script is called `lastChars`):\n```\n-------$ lastChars apple xx orange y \"\" banana\nlxgn\n```","answer":"```bash\n#!/bin/bash\nresult=\"\"\nfor arg in \"$@\"; do\n    if (( ${#arg} >= 2 )); then\n        result+=\"${arg: -2:1}\"\n    fi\ndone\necho \"$result\"\n```\n\nThe space before `-2` is required: `${arg:-2:1}` would be parsed as the `:-` default-value expansion. `${arg:${#arg}-2:1}` also works.","grading":"Essential: loop over `\"$@\"`; skip arguments with fewer than 2 characters (`(( ${#arg} >= 2 ))`); extract the second-to-last character with `${arg: -2:1}` (note the space, or `${arg:(-2):1}`, or `${arg:${#arg}-2:1}`); print all on one line with no spaces.\n- The length test matters here: for a 1-character argument, `${arg: -2:1}` expands to empty in bash, but `${arg:${#arg}-2:1}` gives offset -1 and prints the last (only) character, so a solution without the test must still produce the right output to get that mark.\n- Lose marks for: `${arg:-2:1}` with no space (this is the default-value expansion and prints the whole argument) - deduct the 2 extraction marks; `${arg: -1}` (last character, wrong); printing each character on its own line; spaces between characters.\n- Accept `echo -n`/`printf '%s'` per character plus a final `echo`.","rubric":[{"marks":1,"item":"Loops over every command-line argument (\"$@\")"},{"marks":1,"item":"Skips arguments shorter than 2 characters (length test with ${#arg} or equivalent correct behaviour)"},{"marks":2,"item":"Extracts exactly the second-to-last character, e.g. ${arg: -2:1} (with the space) or ${arg:${#arg}-2:1}"},{"marks":1,"item":"Prints all characters on a single line with no spaces between them"}],"variantOf":"f14-1a","sourceId":"f14"},{"id":"f14-1b","source":"Final exam 2014, Q1B","kind":"long","marks":5,"topics":["scripts","loops","expansions","arithmetic","conditionals","streams"],"prompt":"**B. (5 points):** Suppose there is a program or script called `compute` which takes a file name as a parameter and prints an integer on the standard output, based on the contents of the file. In some cases, `compute` will encounter an error and fail. You don't have to write a `compute` script; just assume it exists.\n\nYour job is to write a bash script that assumes each of its arguments is the name of a file and calls `compute` with each of the files. Your script must print two lines stating the sum of all of the values printed by successful calls to `compute` as well as the number of files for which `compute` failed. These two lines should be the only output from your script. If a call to the compute script prints a number and then fails, that number should not be included in the sum.\n\nExample: Suppose that your script is called `totals` and that `compute file1` would print 11, `compute file2` would print 5, and `compute file3` would print 99 and then fail. Then `totals` should behave like this:\n```\n-------$ totals file1 file2 file3\nsum of all compute values: 16\nnumber of failures: 1\n-------$ totals file1 file2\nsum of all compute values: 16\nnumber of failures: 0\n-------$ totals file3\nsum of all compute values: 0\nnumber of failures: 1\n-------$ totals\nsum of all compute values: 0\nnumber of failures: 0\n```","answer":"```bash\n#!/bin/bash\nsum=0\nfailures=0\nfor f in \"$@\"; do\n    if value=$(compute \"$f\"); then\n        (( sum += value ))\n    else\n        (( failures++ ))\n    fi\ndone\necho \"sum of all compute values: $sum\"\necho \"number of failures: $failures\"\n```\n\nEquivalent form using `$?`:\n```bash\nvalue=$(compute \"$f\")\nif (( $? == 0 )); then ...\n```","grading":"Essential: initialise sum and failure count to 0; loop over `\"$@\"`; capture compute's output with command substitution `$(compute \"$f\")` (which also keeps it off the script's own output); check compute's exit status (`if value=$(compute \"$f\"); then`, or `$?` checked IMMEDIATELY after the assignment); add the value only on success; count failures otherwise; print exactly the two lines.\n- \"Fail\" means non-zero exit status. A solution that decides failure from whether output is empty is wrong (file3 prints 99 and then fails).\n- Lose marks for: checking `$?` after another command (e.g. after an `echo`) so it no longer refers to compute; letting compute's output reach the terminal (e.g. cal
