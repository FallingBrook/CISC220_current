them ascending, save all of them to a file `snum` (in sorted order), and print the first three.* Translate each phrase into one command, in order:\n\n1. extract the student numbers: `cut -f3 classlist`\n2. sort ascending: `sort`\n3. save all of them (sorted) and keep going: `tee snum`\n4. print only the first three: `head -n3`"},{"type":"code","code":"$ cut -f3 classlist | sort | tee snum | head -n3\n1990000\n2999999\n3001111\n$ cat snum\n1990000\n2999999\n3001111\n3100025","caption":"The tee must come AFTER sort (the file must be sorted) and BEFORE head (the file must contain all the numbers)."},{"type":"why","q":"Why would `cut -f3 classlist | sort | head -n3 | tee snum` lose marks?","a":"`tee` would only see the three lines that `head` let through, so `snum` would contain three numbers instead of all of them."},{"type":"check","q":"Write a pipeline that prints how many lines in `words.txt` are different (count of distinct lines).","a":"`sort words.txt | uniq | wc -l`"},{"type":"md","text":"### Key points\n\n- fd **0** = stdin, **1** = stdout, **2** = stderr.\n- `>` overwrites, `>>` appends, `<` reads stdin from a file, `2>` redirects errors, `2> /dev/null` discards them.\n- `> file 2>&1` puts both streams in one file; redirections are processed **left to right**.\n- `|` connects stdout to the next command's stdin; stderr does not go through the pipe.\n- `tee file` saves a copy of the stream and passes it on; place it exactly where the data has the form you want saved."}]},{"id":"d3-expansions","title":"Shell expansions","notebook":"bash/expansions.ipynb","priority":"high","examNote":"Know the **order** of the seven expansions and which happen inside double quotes. Quiz 1 used command substitution (`perm=$(stat -c %a \"$src\")`) and arithmetic expansion (`n=$(( ${#s} / 2 ))`) inside scripts. \"What does this print?\" questions on brace expansion and word splitting are easy marks.","blocks":[{"type":"md","text":"### What is an expansion?\n\nThe shell splits each command line into **tokens** (words and operators). Before running the command, it performs **expansions**: it replaces some tokens with new strings. For example, in `echo $((1 + 1))`, the shell replaces `$((1 + 1))` with `2` and then runs `echo 2`. The command never sees the original text.\n\nThere are **seven** kinds of expansion, performed **in this order** (memorize it):\n\n1. **brace expansion**: `{a,b}`, `{1..5}`\n2. **tilde expansion**: `~`\n3. **parameter expansion**: `$name`, `${name}`\n4. **command substitution**: `$(command)`\n5. **arithmetic expansion**: `$(( expression ))`\n6. **word splitting**\n7. **filename expansion** (globbing): `*`, `?`, `[...]`\n\nCommand substitution and arithmetic expansion have the **same precedence**: if a line has several of them, they are done left to right.\n\nA memory aid: **B**rave **T**urtles **P**addle **C**alm **A**rctic **W**ater **F**ast (Brace, Tilde, Parameter, Command, Arithmetic, Word splitting, Filename)."},{"type":"check","q":"List the seven expansions in order.","a":"Brace, tilde, parameter, command substitution, arithmetic (same level as command substitution), word splitting, filename expansion."},{"type":"md","text":"### Brace expansion\n\nBrace expansion **generates strings that follow a pattern**. Its form is *preamble*`{`*expression*`}`*postscript*. The optional preamble is glued to the front of every generated string and the optional postscript to the back. The *expression* is either:\n\n- two or more **comma-separated** strings: `{a,b,c}`, or\n- a **sequence expression** `{x..y}` or `{x..y..incr}` where `x` and `y` are integers or single characters and `incr` is an optional step size.\n\nBrace expansion is pure text generation. Unlike `*`, it does **not** look at which files exist."},{"type":"code","code":"$ echo {a,b,c}\na b c\n$ echo before_{and,\\&,also}_after\nbefore_and_after before_&_after before_also_after\n$ echo {9..0}\n9 8 7 6 5 4 3 2 1 0\n$ echo {10..20..2}\n10 12 14 16 18 20\n$ echo {a..z..2}\na c e g i k m o q s u w y\n$ echo file{1..3}.txt\nfile1.txt file2.txt file3.txt\n$ echo /usr/{ucb/{ex,edit},lib/{a,how_ex}}\n/usr/ucb/ex /usr/ucb/edit /usr/lib/a /usr/lib/how_ex","caption":"The last one is a nested brace expansion from the Bash manual."},{"type":"md","text":"Leading zeros are kept: `{01..12}` gives `01 02 ... 12`. Two brace expansions next to each other give every combination, which is handy for creating many files or directories at once:\n\n```bash\nmkdir {2019..2022}-{01..12}     # 48 directories 2019-01 ... 2022-12\ntouch file{00..30}.txt          # file00.txt ... file30.txt\n```"},{"type":"code","code":"$ echo {a,b}{1,2}\na1 a2 b1 b2"},{"type":"check","q":"What does `echo x{1..3}y` print?","a":"`x1y x2y x3y`"},{"type":"pitfall","text":"Brace expansion happens **first**, before variables are expanded. So `n=3; echo {1..$n}` prints `{1..3}` literally: when brace expansion ran, the text was `{1..$n}`, which is not a valid sequence, so it was left alone."},{"type":"md","text":"### Tilde expansion\n\nA `~` at the start of a word expands to the absolute path of **your home directory** (the value of `HOME`). `~username` expands to the home directory of *username*.\n\n```bash\n$ echo ~            # if your home directory is /home/user1\n/home/user1\n$ echo ~/notes\n/home/user1/notes\n```\n\n### Parameter expansion\n\n**Parameter expansion** happens when you access the value of a variable or parameter by writing `$name` (or `${name}`). You create a variable with `name=value` (**no spaces around `=`**). Inside a script, `$1` is the **first command line argument**, `$2` the second, and so on; that is also parameter expansion. (Variables and arguments are covered fully on Day 4.)"},{"type":"code","code":"$ course=CISC220\n$ echo \"I am taking $course\"\nI am taking CISC220"},{"type":"md","text":"### Command substitution: `$( )`\n\n`$(command)` runs *command* (in a subshell) and **replaces itself with the command's standard output**. Trailing newlines are removed. This is how you store the output of a command in a variable, or use it inside a string:\n\n```bash\necho \"Today is $(date +%A), it's $(date +%H:%M)\"\nmoo=$(cowsay \"Mooooo!\")     # prints nothing: the output is stored in moo\necho \"$moo\"                 # now print it\n```"},{"type":"code","code":"$ echo \"classlist has $(wc -l < classlist) lines\"\nclasslist has 4 lines\n$ n=$(cut -f3 classlist | sort | head -n1)\n$ echo \"smallest student number: $n\"\nsmallest student number: 1990000","caption":"Using the 4-line classlist from the Streams lesson."},{"type":"check","q":"What is the difference between `x=$(date)` and `x=date`?","a":"`x=$(date)` runs `date` and stores its output; `x=date` stores the four-letter string `date`."},{"type":"md","text":"### Arithmetic expansion: `$(( ))`\n\n`$(( expression ))` evaluates an **integer** arithmetic expression and substitutes the result. Division throws away the remainder (`7 / 2` is `3`); `%` gives the remainder. Arithmetic is rare at the command line but common in scripts (see the Arithmetic notebook later).\n\n```bash\n$ echo $(( 1 + 1 ))\n2\n$ mkdir dir$((2 * 5))       # creates dir10\n```"},{"type":"check","q":"What does `echo $(( 17 / 5 )) $(( 17 % 5 ))` print?","a":"`3 2` (integer division, then remainder)."},{"type":"md","text":"### Word splitting\n\nAfter the earlier expansions, **anything not inside double quotes** undergoes **word splitting**: the result is split into separate words (fields) wherever there are field separator characters. By default the separators are **space, tab and newline**, stored in the variable `IFS` (*internal field separator*). Several separators in a row count as **one** separator.\n\nThis is why spaces in file names cause trouble. `unzip CISC220 Assignment solutions.zip` gives `unzip` three arguments (`CISC220`, `Assignment`, `solutions.zip`). Quoting or escaping prevents the split."},{"type":"code","code":"$ str=\"field1    field2       field3\n\n\nfield4\"\n$ echo $str\nfield1 field2 field3 field4\n$ echo \"$str\"\nfield1    field2       field3\n\n\nfield4","caption":"Unquoted: the runs of spaces and newlines became single word breaks, and echo joins its arguments with one space. Quoted: one argument, printed exactly."},{"type":"md","text":"You can change `IFS` temporarily to split on something else, such as commas. Save the old value and restore it afterwards:\n\n```bash\nstr=\"123456,Ester,Polly\"\nOLDIFS=$IFS\nIFS=\",\"\nfor field in $str; do\n    echo $field\ndone\nIFS=$OLDIFS\n```\n\nprints `123456`, `Ester` and `Polly` on separate lines."},{"type":"why","q":"Why does `echo $(cut -f3 classlist)` print all the student numbers on one line?","a":"The command substitution is unquoted, so its output is word split on the newlines. `echo` receives four separate arguments and prints them separated by single spaces."},{"type":"md","text":"### Filename expansion\n\nThe **last** expansion is filename expansion: words containing `*`, `?` or `[...]` are replaced with the matching file names (Day 2). Because it comes after word splitting, a variable that holds `*` expands to file names when used unquoted.\n\n### What happens inside quotes?\n\n| | brace | tilde | parameter `$x` | command `$( )` | arithmetic `$(( ))` | word splitting | filename `*` |\n|---|---|---|---|---|---|---|---|\n| unquoted | yes | yes | yes | yes | yes | yes | yes |\n| `\"double\"` | no | no | **yes** | **yes** | **yes** | no | no |\n| `'single'` | no | no | no | no | no | no | no |\n\nDouble quotes keep `$` working (parameter, command and arithmetic expansion) but **prevent word splitting and filename expansion** (and brace and tilde expansion). That is exactly why the course writes `\"$var\"`: the value is used as **one** word, exactly as stored, even if it contains spaces or `*`."},{"type":"code","code":"$ echo \"{a,b}\" \"~\" '$HOME' \"$((2+3))\"\n{a,b} ~ $HOME 5\n$ v='f*'\n$ echo \"$v\"\nf*\n$ echo $v\nf1 f2","caption":"The directory contains files f1 and f2."},{"type":"check","q":"Which expansions still happen inside double quotes?","a":"Parameter expansion, command substitution and arithmetic expansion (the ones that start with `$`)."},{"type":"md","text":"### Key points\n\n- Order: **brace, tilde, parameter, command substitution / arithmetic, word splitting, filename**.\n- Brace expansion generates text (`{a,b}`, `{1..10..2}`, `{01..12}`) and does not care what files exist; it runs before variables are expanded.\n- `$(cmd)` is replaced by cmd's stdout; `$((expr))` by an integer result.\n- Unquoted results are word split on space, tab and newline (`IFS`), then globbed.\n- Double quotes allow only the `$` expansions; single quotes allow none."}]},{"id":"d3-tr","title":"The tr command","notebook":"bash/tr.ipynb","priority":"medium","examNote":"Assignment 3 Q5 (`tr220.sh`) re-implements `tr` and rejects exactly the cases this notebook calls undefined or non-portable (seq1 longer than seq2, duplicated characters in seq1). Expect a one-line `tr` in a pipeline or a \"what does this print?\" question.","blocks":[{"type":"md","text":"### What `tr` does\n\n`tr` **translates, squeezes and/or deletes characters**. It reads **standard input only** (it does not take a file name argument) and writes standard output. Think of it as a character-by-character search and replace.\n\n```bash\ntr [option]... seq1 [seq2]\n```\n\nWith two sequences, each character of `seq1` is replaced by the character **at the same position** in `seq2`. Characters not in `seq1` pass through unchanged.\n\nBecause `tr` reads stdin, you feed it with a pipe or `<`:\n\n```bash\ntr a-z A-Z < words.txt           # a file\necho \"$x\" | tr a-z A-Z           # a variable\nprintf %s \"$x\" | tr 'p' 't'      # printf %s prints x exactly, with no newline added\n```"},{"type":"code","code":"$ x=\"sparring with a purple porpoise\"\n$ printf %s \"$x\" | tr 'p' 't'\nstarring with a turtle tortoise\n$ echo \"ca.queensu.cs.cisc124\" | tr '.' '/'\nca/queensu/cs/cisc124\n$ echo hello | tr el ip\nhippo","caption":"In the last one e becomes i and l becomes p (position 1 maps to position 1, position 2 to position 2)."},{"type":"check","q":"What does `echo mutate | tr emu opo` print?","a":"`potato` (e->o, m->p, u->o)."},{"type":"pitfall","text":"`tr a-z A-Z words.txt` is an error: `tr` does not accept a file name. Use `tr a-z A-Z < words.txt` or `cat words.txt | tr a-z A-Z`."},{"type":"md","text":"### Three ways to write a sequence\n\n1. a plain **string** of characters: `ABCDEFGHIJKLMNOPQRSTUVWXYZ`\n2. a **range**: `A-Z`, `a-z`, `0-9` (not portable, but works in GNU tr)\n3. a **POSIX character class**: `[:upper:]`, `[:lower:]`, `[:digit:]`, `[:alpha:]`, `[:space:]`, `[:punct:]`\n\nSpecial characters can be written with backslash escapes: `'\\n'` is newline, `'\\t'` is tab. Quote the sequences (single quotes are safest) so the shell does not treat `[`, `*` or `\\` specially."},{"type":"code","code":"$ echo cisc220 | tr 'a-z' 'A-Z'\nCISC220\n$ echo \"Hi There\" | tr '[:upper:]' '[:lower:]'\nhi there\n$ echo \"one two\" | tr ' ' '\\n'\none\ntwo"},{"type":"md","text":"### When the sequences have different lengths\n\n- **`seq1` shorter than `seq2`**: the extra characters of `seq2` are ignored. `tr 'a-z' 'A-Z0-9'` behaves like `tr 'a-z' 'A-Z'`.\n- **`seq1` longer than `seq2`**: GNU `tr` **extends `seq2` by repeating its last character** until it is as long as `seq1`. POSIX says the result is **undefined**, so this is not portable.\n- The portable way to repeat a character *c* is `[c*]`, which repeats *c* as many times as needed to match `seq1`."},{"type":"code","code":"$ echo cisc220 | tr 'a-z' 'A-Z0-9'\nCISC220\n$ echo cisc220 | tr '0-9' 'X'\nciscXXX\n$ echo cisc220 | tr '[:digit:]' '[X*]'\nciscXXX\n$ echo abc | tr abc xy\nxyy","caption":"GNU tr: in tr abc xy, seq2 is extended to xyy."},{"type":"md","text":"### Duplicated characters in `seq1`: undefined\n\nIf `seq1` contains the **same character twice**, the result is **undefined** (the standard does not say which translation wins). With GNU `tr`, the **last** occurrence wins:\n\n```bash\n$ echo cisc220 | tr 'cisc' 'CIS'\nSISS220\n```\n\nHere `seq2` is extended to `CISS`, so `c` is mapped first to `C` and then to `S`; the later mapping wins, giving `SISS220`. Assignment 3's `tr220.sh` refuses this case: it checks `seq1` for duplicated characters (with `hasdups`) and also rejects a `seq1` that is longer than `seq2`, the two undefined/non-portable cases above."},{"type":"check","q":"Name the two `tr` situations that the course calls undefined or non-portable.","a":"`seq1` longer than `seq2` (GNU repeats the last character of seq2; POSIX says undefined), and `seq1` containing a duplicated character (undefined)."},{"type":"md","text":"### Deleting and squeezing\n\n- `tr -d seq1` **deletes** every character that is in `seq1`. Give only one sequence.\n- `tr -s seq1` **squeezes**: each run of a repeated character from `seq1` is replaced by a single copy.\n- `tr -ds seq1 seq2` does both: first **delete** the characters in `seq1`, then **squeeze** repeats of characters in `seq2`."},{"type":"code","code":"$ echo \"2022-10-21\" | tr -d '-'\n20221021\n$ echo \"a     bcd  ef g\" | tr -s ' '\na bcd ef g\n$ echo bookkeeper | tr -s 'a-z'\nbokeper\n$ echo \"aaabbb--ccc\" | tr -ds '-' 'a-z'\nabc","caption":"Squeezing only merges repeats that are next to each other: bookkeeper becomes bokeper."},{"type":"why","q":"Why is `tr -s ' '` useful before `cut -d' '`?","a":"`cut` treats every single delimiter as a field boundary, so two spaces in a row create an empty field. Squeezing runs of spaces to one space first makes the fields line up."},{"type":"check","q":"Write a command that prints the contents of `code.txt` with all digits removed.","a":"`tr -d '0-9' < code.txt` (or `tr -d '[:digit:]' < code.txt`)."},{"type":"md","text":"### Key points\n\n- `tr` reads **stdin only**; feed it with `<`, a pipe, or `echo \"$x\" |`.\n- Position *i* of `seq1` maps to position *i* of `seq2`; other characters pass through.\n- Sequences: strings, ranges `a-z`, classes `[:digit:]`; `[c*]` repeats *c*.\n- seq1 longer than seq2: GNU repeats the last char (non-portable); duplicates in seq1: undefined (GNU: last wins).\n- `-d` deletes, `-s` squeezes, `-ds` deletes seq1 then squeezes seq2."}]}],"flashcards":[{"id":"d3-fc-01","topic":"d3-streams","front":"File descriptor numbers of stdin, stdout, stderr?","back":"0 = standard input, 1 = standard output, 2 = standard error."},{"id":"d3-fc-02","topic":"d3-streams","front":"Where are stdin, stdout and stderr connected by default?","back":"stdin: the keyboard. stdout and stderr: the terminal."},{"id":"d3-fc-03","topic":"d3-streams","front":"What is a file descriptor?","back":"A small integer that identifies an open stream of a process (0, 1, 2 for the standard streams)."},{"id":"d3-fc-04","topic":"d3-streams","front":"How do you end keyboard input to a command like `sort`?","back":"Press Ctrl-d (end of input)."},{"id":"d3-fc-05","topic":"d3-streams","front":"Command to overwrite `myfile` with the string OOPS (Quiz 1)","back":"`echo OOPS > myfile`"},{"id":"d3-fc-06","topic":"d3-streams","front":"`>` vs `>>`","back":"`>` creates or **overwrites** the file; `>>` creates or **appends** to it."},{"id":"d3-fc-07","topic":"d3-streams","front":"Is the `1` in `1> file` required?","back":"No. `> file` means `1> file`. The `2` in `2> file` **is** required."},{"id":"d3-fc-08","topic":"d3-streams","front":"Redirect only the error messages of `cmd` to `err.txt`","back":"`cmd 2> err.txt`"},{"id":"d3-fc-09","topic":"d3-streams","front":"Send stdout of `cmd` to out.txt and stderr to err.txt","back":"`cmd > out.txt 2> err.txt`"},{"id":"d3-fc-10","topic":"d3-streams","front":"Send both stdout and stderr of `cmd` to `all.txt`","back":"`cmd > all.txt 2>&1` (bash shorthand: `cmd &> all.txt`)."},{"id":"d3-fc-11","topic":"d3-streams","front":"What does `2>&1` mean?","back":"Make fd 2 (stderr) a copy of fd 1 (stdout): send errors to wherever stdout points **at that moment**."},{"id":"d3-fc-12","topic":"d3-streams","front":"In what order does the shell process redirections?","back":"Left to right. So `> f 2>&1` sends both to f, but `2>&1 > f` leaves errors on the terminal."},{"id":"d3-fc-13","topic":"d3-streams","front":"What is `/dev/null`?","back":"The null device: a file that discards everything written to it (and reports success)."},{"id":"d3-fc-14","topic":"d3-streams","front":"Run `cmd` but throw away its error messages","back":"`cmd 2> /dev/null`"},{"id":"d3-fc-15","topic":"d3-streams","front":"How does a script print an error message on stderr?","back":"`echo \"message\" >&2` (stdout of echo is redirected to fd 2)."},{"id":"d3-fc-16","topic":"d3-streams","front":"Redirect stdin of `sort` to read `unsorted.txt`","back":"`sort < unsorted.txt` (same as `sort 0< unsorted.txt`)."},{"id":"d3-fc-17","topic":"d3-streams","front":"Print only the number of lines in `classlist` (no file name)","back":"`wc -l < classlist`"},{"id":"d3-fc-18","topic":"d3-streams","front":"What does a pipe `|` connect?","back":"The **stdout** of the left command to the **stdin** of the right command. stderr is not piped."},{"id":"d3-fc-19","topic":"d3-streams","front":"What does `tee file` do?","back":"Copies its stdin to stdout **and** to the file(s) named, so a pipeline can save an intermediate result and keep going."},{"id":"d3-fc-20","topic":"d3-streams","front":"Why is `sort data > data` a bug?","back":"The shell truncates `data` before sort runs, so sort reads an empty file and data ends up empty."},{"id":"d3-fc-21","topic":"d3-streams","front":"`sort -n` vs `sort`","back":"`-n` sorts numerically (9 before 10); plain sort compares as text (10, 100, 9)."},{"id":"d3-fc-22","topic":"d3-streams","front":"Sort numbers largest first","back":"`sort -n -r` (or `sort -nr`)."},{"id":"d3-fc-23","topic":"d3-streams","front":"What does `uniq` remove? What does `uniq -d` print?","back":"`uniq` removes **adjacent** duplicate lines (sort first). `uniq -d` prints one copy of each duplicated line only."},{"id":"d3-fc-24","topic":"d3-streams","front":"Print the first 3 / last 3 lines","back":"`head -n3` / `tail -n3` (also `head -n 3`)."},{"id":"d3-fc-25","topic":"d3-streams","front":"Default field delimiter of `cut`","back":"The TAB character. Use `-d` to choose another, e.g. `cut -d\" \" -f1` or `cut -d: -f1`."},{"id":"d3-fc-26","topic":"d3-streams","front":"Pipeline: student numbers (field 3) of classlist, sorted, all saved to snum, print first three","back":"`cut -f3 classlist | sort | tee snum | head -n3`"},{"id":"d3-fc-27","topic":"d3-streams","front":"Count the distinct lines of words.txt","back":"`sort words.txt | uniq | wc -l`"},{"id":"d3-fc-28","topic":"d3-expansions","front":"The seven expansions in order","back":"1 brace, 2 tilde, 3 parameter, 4 command substitution, 5 arithmetic (4 and 5 same precedence, left to right), 6 word splitting, 7 filename expansion."},{"id":"d3-fc-29","topic":"d3-expansions","front":"Form of brace expansion","back":"preamble`{`expression`}`postscript, where expression is comma-separated strings or a sequence `x..y..incr`."},{"id":"d3-fc-30","topic":"d3-expansions","front":"`echo {10..20..2}`","back":"`10 12 14 16 18 20`"},{"id":"d3-fc-31","topic":"d3-expansions","front":"`echo {a,b}{1,2}`","back":"`a1 a2 b1 b2`"},{"id":"d3-fc-32","topic":"d3-expansions","front":"Create directories week01 ... week12 in one command","back":"`mkdir week{01..12}` (leading zeros are kept)."},{"id":"d3-fc-33","topic":"d3-expansions","front":"`n=3; echo {1..$n}` prints?","back":"`{1..3}`: brace expansion runs before parameter expansion, so `{1..$n}` is not a valid sequence."},{"id":"d3-fc-34","topic":"d3-expansions","front":"What does `~` expand to? `~bob`?","back":"Your home directory (`$HOME`). `~bob` is bob's home directory."},{"id":"d3-fc-35","topic":"d3-expansions","front":"What is command substitution?","back":"`$(command)`: runs the command in a subshell and replaces itself with the command's stdout (trailing newlines removed)."},{"id":"d3-fc-36","topic":"d3-expansions","front":"Store the output of `date` in variable `now`","back":"`now=$(date)`"},{"id":"d3-fc-37","topic":"d3-expansions","front":"What is arithmetic expansion? `echo $((7 / 2))`?","back":"`$(( expr ))` evaluates integer arithmetic and substitutes the result. Prints `3` (integer division)."},{"id":"d3-fc-38","topic":"d3-expansions","front":"What is word splitting?","back":"Unquoted results of expansions are split into separate words at IFS characters (space, tab, newline by default); runs of separators count as one."},{"id":"d3-fc-39","topic":"d3-expansions","front":"What is `IFS`?","back":"The internal field separator variable: the characters word splitting splits on (default space, tab, newline)."},{"id":"d3-fc-40","topic":"d3-expansions","front":"Which expansions happen inside double quotes?","back":"Only parameter `$x`, command substitution `$( )` and arithmetic `$(( ))`. No brace, tilde, word splitting or filename expansion."},{"id":"d3-fc-41","topic":"d3-expansions","front":"Which expansions happen inside single quotes?","back":"None. Every character is literal."},{"id":"d3-fc-42","topic":"d3-expansions","front":"Why does the course always write `\"$var\"`?","back":"Double quotes stop word splitting and filename expansion, so the value is passed as one argument exactly as stored (spaces, `*` and all)."},{"id":"d3-fc-43","topic":"d3-tr","front":"Where does `tr` get its input?","back":"Standard input only (no file argument): `tr a-z A-Z < file` or `echo \"$x\" | tr a-z A-Z`."},{"id":"d3-fc-44","topic":"d3-tr","front":"Three ways to specify a tr sequence","back":"A string (`ABC`), a range (`A-Z`, not portable), a POSIX class (`[:upper:]`)."},{"id":"d3-fc-45","topic":"d3-tr","front":"`tr` when seq1 is longer than seq2","back":"GNU tr repeats the last char of seq2 to fill it (`tr 0-9 X` maps all digits to X). POSIX: undefined, so not portable."},{"id":"d3-fc-46","topic":"d3-tr","front":"Portable way to map every digit to X","back":"`tr '[:digit:]' '[X*]'` (`[c*]` repeats c as needed)."},{"id":"d3-fc-47","topic":"d3-tr","front":"`tr` when seq1 has a duplicated character","back":"Undefined. GNU: the last mapping wins (`tr cisc CIS` turns cisc220 into SISS220)."},{"id":"d3-fc-48","topic":"d3-tr","front":"`tr -d` / `tr -s`","back":"`-d` deletes the characters in seq1; `-s` squeezes runs of a repeated seq1 character into one."},{"id":"d3-fc-49","topic":"d3-tr","front":"`tr -ds seq1 seq2`","back":"First deletes the characters in seq1, then squeezes repeats of characters in seq2."},{"id":"d3-fc-50","topic":"d3-tr","front":"Replace every TAB with a comma in classlist, saving to classlist.csv","back":"`tr '\\t' ',' < classlist > classlist.csv`"}],"quiz":[{"topic":"d3-streams","type":"mcq","q":"Which file descriptor number refers to standard error?","options":["0","1","2","3"],"answer":2,"explain":"0 is stdin, 1 is stdout, 2 is stderr. There is no fourth standard stream.","id":"d3-q-01"},{"topic":"d3-streams","type":"short","q":"What single command overwrites the contents of a file named `report` with the string `EMPTY`? Use a redirection.","answer":"`echo EMPTY > report`","explain":"`>` truncates the file and writes echo's output. `>>` would append instead (wrong). `printf 'EMPTY\\n' > report` is also fine.","id":"d3-q-02"},{"topic":"d3-streams","type":"output","q":"Starting in an empty directory, what does this print?","code":"echo one > f\necho two >> f\necho three > f\necho four >> f\ncat f","answer":"three\nfour","explain":"The third command overwrites f (losing one and two); the fourth appends.","id":"d3-q-03"},{"topic":"d3-streams","type":"mcq","q":"The directory contains a file `a` and no file `zzz`. After `ls a zzz 2>&1 > out.txt`, what is on the terminal?","options":["Nothing; both lines are in out.txt","The error message about zzz","The line `a`","Both the line `a` and the error message"],"answer":1,"explain":"Redirections go left to right. `2>&1` copies fd 1 while it is still the terminal, so stderr stays on the terminal. Then `> out.txt` moves only stdout (the line `a`) into the file. To capture both, write `> out.txt 2>&1`.","id":"d3-q-04"},{"topic":"d3-streams","type":"output","q":"The directory contains a file `a` and no file `zzz`. What does this print?","code":"ls a zzz 2> /dev/null\necho \"status $?\"","answer":"a\nstatus 2","explain":"The error message is discarded by `2> /dev/null`, but `ls` still lists `a`. Because one argument failed, `ls` exits with status 2 (nonzero = an error happened).","id":"d3-q-05"},{"topic":"d3-streams","type":"output","q":"What does this print? (Only stdout goes through a pipe.)","code":"echo hello >&2 | tr a-z A-Z","answer":"hello","explain":"`>&2` sends echo's output to stderr, which goes straight to the terminal. Nothing reaches `tr` through the pipe, so the output is not uppercased.","id":"d3-q-06"},{"topic":"d3-streams","type":"output","q":"What does this print?","code":"printf '10\\n9\\n100\\n' | sort","answer":"10\n100\n9","explain":"Without `-n`, sort compares the lines as text, character by character: `1` < `9`, and `10` is a prefix of `100`. Use `sort -n` to get 9, 10, 100.","id":"d3-q-07"},{"topic":"d3-streams","type":"output","q":"What does this print?","code":"printf '10\\n9\\n100\\n42\\n' | sort -n -r | head -n2","answer":"100\n42","explain":"Numeric, reversed: 100 42 10 9; head keeps the first two.","id":"d3-q-08"},{"topic":"d3-streams","type":"output","q":"What does this print?","code":"printf 'b\\na\\nb\\nb\\na\\n' | uniq","answer":"b\na\nb\na","explain":"uniq only removes duplicates that are **adjacent**: the two consecutive `b` lines become one; the rest are not next to an identical line.","id":"d3-q-09"},{"topic":"d3-streams","type":"output","q":"What does this print?","code":"printf 'b\\na\\nb\\nb\\na\\nc\\n' | sort | uniq -d","answer":"a\nb","explain":"After sorting: a a b b b c. `uniq -d` prints one copy of each line that is repeated; c appears once, so it is not printed.","id":"d3-q-10"},{"topic":"d3-streams","type":"output","q":"`classlist` contains these 4 lines, fields separated by single TABs:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWhat does this print?","code":"cut -f2 classlist | tail -n2","answer":"Andy\nSue","explain":"Field 2 is the first name; tail keeps the last two lines.","id":"d3-q-11"},{"topic":"d3-streams","type":"output","q":"`classlist` contains these 4 lines, fields separated by single TABs:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWhat does this print?","code":"cut -f3 classlist | sort | tee snum | head -n2\nwc -l < snum","answer":"1990000\n2999999\n4","explain":"tee saves **all** four sorted numbers to snum before head keeps only two.","id":"d3-q-12"},{"topic":"d3-streams","type":"mcq","q":"Which pipeline extracts the student numbers from `classlist`, sorts them, saves **all** of them to `snum`, and prints the first three?","options":["`cut -f3 classlist | sort | head -n3 | tee snum`","`cut -f3 classlist | tee snum | sort | head -n3`","`cut -f3 classlist | sort | tee snum | head -n3`","`cut -f3 classlist | sort > snum | head -n3`"],"answer":2,"explain":"tee must come after sort (so the file is sorted) and before head (so the file has all numbers). Option A saves only three; B saves them unsorted; D redirects stdout to the file, so nothing flows into head and nothing is printed.","id":"d3-q-13"},{"topic":"d3-streams","type":"short","q":"`words.txt` has one word per line. Write a pipeline that prints how many **different** words it contains.","answer":"`sort words.txt | uniq | wc -l`","explain":"Sort first so duplicates are adjacent, uniq removes them, wc -l counts. `cat words.txt | sort | uniq | wc -l` is equally correct.","id":"d3-q-14"},{"topic":"d3-expansions","type":"mcq","q":"Which list gives the shell expansions in the order they are performed?","options":["tilde, brace, parameter, arithmetic, command, filename, word splitting","brace, tilde, parameter, command substitution/arithmetic, word splitting, filename","filename, word splitting, brace, tilde, parameter, command substitution/arithmetic","parameter, brace, tilde, command substitution/arithmetic, filename, word splitting"],"answer":1,"explain":"Brace expansion is first and filename expansion is last; word splitting comes just before filename expansion.","id":"d3-q-15"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"echo {a,b}{1,2}","answer":"a1 a2 b1 b2","explain":"Two adjacent brace expansions produce every combination, the left one varying slowest.","id":"d3-q-16"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"echo lab{1..9..3}.sh","answer":"lab1.sh lab4.sh lab7.sh","explain":"Sequence 1 to 9 in steps of 3: 1 4 7 (10 would be past 9). Preamble `lab`, postscript `.sh`.","id":"d3-q-17"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"n=3\necho {1..$n}","answer":"{1..3}","explain":"Brace expansion happens **before** parameter expansion. When braces were expanded the text was `{1..$n}`, not a valid sequence, so it was left alone; then `$n` became 3.","id":"d3-q-18"},{"topic":"d3-expansions","type":"output","q":"What does this print? Assume the current directory is empty.","code":"echo a{1,2}.txt *.zzz","answer":"a1.txt a2.txt *.zzz","explain":"Brace expansion generates names whether or not the files exist. The glob `*.zzz` matches nothing, so bash leaves it unchanged.","id":"d3-q-19"},{"topic":"d3-expansions","type":"output","q":"Assume `HOME` is `/home/user1`. What does this print?","code":"echo ~ \"~\" '$HOME' \"$HOME\"","answer":"/home/user1 ~ $HOME /home/user1","explain":"Tilde expansion does not happen inside quotes. Single quotes stop parameter expansion; double quotes allow it.","id":"d3-q-20"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"echo \"{x,y}\" \"$(( 6 * 7 ))\" '$(( 6 * 7 ))'","answer":"{x,y} 42 $(( 6 * 7 ))","explain":"Double quotes stop brace expansion but allow arithmetic expansion. Single quotes stop everything.","id":"d3-q-21"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"echo $(( 17 / 5 )) $(( 17 % 5 )) $(( 2 + 3 * 4 ))","answer":"3 2 14","explain":"Integer division drops the remainder; % is the remainder; * binds tighter than +.","id":"d3-q-22"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"x=\"a    b\nc\"\necho $x\necho \"$x\"","answer":"a b c\na    b\nc","explain":"Unquoted, `$x` is word split on spaces and the newline into three words, which echo joins with single spaces. Quoted, the value is one argument printed exactly.","id":"d3-q-23"},{"topic":"d3-expansions","type":"output","q":"`classlist` contains these 4 lines, fields separated by single TABs:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWhat does this print?","code":"echo $(cut -f1 classlist)\necho \"There are $(wc -l < classlist) students\"","answer":"Cade Day Friese Yu\nThere are 4 students","explain":"The first command substitution is unquoted, so its four lines are word split into four arguments. In the second, the substitution is inside double quotes, which is fine: command substitution still happens there.","id":"d3-q-24"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"str=\"123456,Ester,Polly\"\nOLDIFS=$IFS\nIFS=\",\"\nfor field in $str; do\n    echo \"<$field>\"\ndone\nIFS=$OLDIFS","answer":"<123456>\n<Ester>\n<Polly>","explain":"With IFS set to a comma, word splitting of the unquoted `$str` produces three fields.","id":"d3-q-25"},{"topic":"d3-expansions","type":"output","q":"The current directory contains exactly the files `f1` and `f2`. What does this print?","code":"v='f*'\necho \"$v\"\necho $v","answer":"f*\nf1 f2","explain":"Quoted: no filename expansion, so the literal `f*` is printed. Unquoted: filename expansion (the last expansion) replaces `f*` with the matching names.","id":"d3-q-26"},{"topic":"d3-tr","type":"output","q":"What does this print?","code":"echo hello | tr el ip","answer":"hippo","explain":"e->i and l->p; h and o are not in seq1, so they pass through unchanged.","id":"d3-q-27"},{"topic":"d3-tr","type":"output","q":"What does this print? (GNU tr)","code":"echo cisc220 | tr '0-9' 'X'","answer":"ciscXXX","explain":"seq1 (10 digits) is longer than seq2 (1 char). GNU tr repeats the last character of seq2, so every digit becomes X. POSIX says this is undefined; the portable form is `tr '[:digit:]' '[X*]'`.","id":"d3-q-28"},{"topic":"d3-tr","type":"output","q":"What does this print? (GNU tr)","code":"echo cisc220 | tr 'cisc' 'CIS'","answer":"SISS220","explain":"seq2 is extended to CISS. `c` appears twice in seq1 (undefined behaviour); in GNU tr the last mapping, c->S, wins. So c->S, i->I, s->S.","id":"d3-q-29"},{"topic":"d3-tr","type":"output","q":"What does this print?","code":"echo 'a  b    c' | tr -s ' '\necho '2022-10-21' | tr -d '-'\necho bookkeeper | tr -s 'a-z'","answer":"a b c\n20221021\nbokeper","explain":"-s squeezes runs of the same character; -d deletes. In bookkeeper the oo, kk and ee runs each become one letter.","id":"d3-q-30"},{"topic":"d3-tr","type":"output","q":"What does this print?","code":"echo 'Hello World' | tr '[:upper:]' '[:lower:]' | tr ' ' '\\n'","answer":"hello\nworld","explain":"First lowercase everything, then turn the space into a newline.","id":"d3-q-31"},{"topic":"d3-tr","type":"mcq","q":"Which command is an **error** (or does not do what is intended)?","options":["`tr a-z A-Z < notes.txt`","`cat notes.txt | tr a-z A-Z`","`tr a-z A-Z notes.txt`","`tr '[:lower:]' '[:upper:]' < notes.txt`"],"answer":2,"explain":"tr reads only standard input; it does not accept a file name. With GNU tr, option C fails with `extra operand`.","id":"d3-q-32"},{"topic":"d3-tr","type":"short","q":"Assignment 3's `tr220.sh` exits with an error in two situations involving seq1 and seq2. What are they, and why does the course treat them as errors?","answer":"(1) seq1 is longer than seq2; (2) seq1 contains a duplicated character. Both are cases where the result of `tr` is undefined or non-portable (GNU repeats the last char of seq2; with duplicates, which mapping wins is not specified).","explain":"Wording can vary; the key words are *longer* and *duplicated/repeated characters* and *undefined*.","id":"d3-q-33"}],"write":[{"id":"d3-w-01","topic":"d3-streams","stage":"worked","marks":2,"prompt":"The file `scores` has one line per student: name, section and score, separated by TAB characters. For example:\n\n```\nAhmed\t002\t88\nBlake\t001\t9\nChen\t001\t100\n```\n\nWrite a **single pipeline** that extracts the scores, sorts them from **highest to lowest** (numerically), saves **all** of the sorted scores in a file named `ranked`, and prints only the **top five** scores.","starter":"","solution":"cut -f3 scores | sort -n -r | tee ranked | head -n5","explain":"Translate each phrase, in order:\n\n1. *extracts the scores*: the score is field 3 and the delimiter is TAB, which is `cut`'s default: `cut -f3 scores`.\n2. *highest to lowest, numerically*: `sort -n -r`. Without `-n`, 9 would sort above 88 because text comparison sees `9` > `8`.\n3. *saves all of the sorted scores*: `tee ranked`. It must come **after** sort (the file must be sorted) and **before** head (the file must contain every score).\n4. *prints only the top five*: `head -n5`.\n\n`sort -nr` and `head -n 5` are equally correct.","rubric":[{"marks":1,"item":"`cut -f3` then `sort -n -r` (numeric and reversed)"},{"marks":1,"item":"`tee ranked` placed between sort and head, then `head -n5`"}],"pitfalls":["Putting `tee` after `head` (saves only five scores).","Forgetting `-n` (text sort puts 9 above 88).","Using `> ranked` in the middle of a pipeline: it sends the output to the file and nothing reaches head."]},{"id":"d3-w-02","topic":"d3-streams","stage":"faded","marks":3,"prompt":"A program `./build.sh` prints normal messages to standard output and error messages to standard error. Fill in the blanks so that each command does what its comment says.","starter":"# (a) normal output to out.txt, errors to err.txt\n./build.sh ____ out.txt ____ err.txt\n\n# (b) both normal output and errors into log.txt\n./build.sh > log.txt ____\n\n# (c) normal output on the terminal, errors thrown away\n./build.sh ____","solution":"# (a) normal output to out.txt, errors to err.txt\n./build.sh > out.txt 2> err.txt\n\n# (b) both normal output and errors into log.txt\n./build.sh > log.txt 2>&1\n\n# (c) normal output on the terminal, errors thrown away\n./build.sh 2> /dev/null","explain":"(a) `>` (or `1>`) redirects fd 1 and `2>` redirects fd 2. (b) After stdout points at log.txt, `2>&1` makes stderr a copy of it; the order matters. (c) `/dev/null` discards whatever is written to it.","rubric":[{"marks":1,"item":"(a) `>` and `2>`"},{"marks":1,"item":"(b) `2>&1` after the stdout redirection"},{"marks":1,"item":"(c) `2> /dev/null`"}],"pitfalls":["Writing `2>&1` before `> log.txt`.","Writing `> /dev/null` in (c), which throws away the normal output instead."]},{"id":"d3-w-03","topic":"d3-streams","stage":"faded","marks":2,"prompt":"`classlist` has lines of the form last name TAB first name TAB student number. Complete the pipeline so that it prints the **number of different first names** in the file.","starter":"cut ____ classlist | ____ | ____ | wc ____","solution":"cut -f2 classlist | sort | uniq | wc -l","explain":"Field 2 is the first name. `uniq` only removes adjacent duplicates, so `sort` must come before it. `wc -l` counts the remaining lines.","rubric":[{"marks":1,"item":"`cut -f2` and `wc -l`"},{"marks":1,"item":"`sort` before `uniq`"}],"pitfalls":["`uniq` without `sort` counts some names twice.","`wc` without `-l` prints lines, words and bytes."]},{"id":"d3-w-04","topic":"d3-expansions","stage":"faded","marks":3,"prompt":"Fill in the blanks using **expansions**.\n\n(a) Create the directories `A1`, `A2`, ..., `A6` with one mkdir command.\n\n(b) Print `There are N files here` where N is the number of names that `ls` prints in the current directory.\n\n(c) Print the number of minutes in a week (let the shell compute it).","starter":"mkdir A____\necho \"There are ____ files here\"\necho ____","solution":"mkdir A{1..6}\necho \"There are $(ls | wc -l) files here\"\necho $(( 7 * 24 * 60 ))","explain":"(a) A sequence brace expansion with the preamble `A`. (b) Command substitution runs the pipeline and inserts its output; it still works inside double quotes. (c) Arithmetic expansion computes 10080.","rubric":[{"marks":1,"item":"`A{1..6}` (or `A{1,2,3,4,5,6}`)"},{"marks":1,"item":"`$(ls | wc -l)`"},{"marks":1,"item":"`$(( 7 * 24 * 60 ))`"}],"pitfalls":["Writing `$(7 * 24 * 60)`: single parentheses are command substitution and try to run a command named 7.","Single-quoting the sentence in (b) stops the substitution."]},{"id":"d3-w-05","topic":"d3-tr","stage":"blank","marks":4,"prompt":"Write a script `lastnames.sh` that takes one command line argument: the name of a classlist file (last name TAB first name TAB student number on each line). The script prints the **last names** converted to **uppercase**, sorted in **reverse** alphabetical order, one per line. The file name might contain spaces.\n\n(Inside a script, `$1` is the first command line argument.)","starter":"","solution":"#!/bin/bash\n\ncut -f1 \"$1\" | tr a-z A-Z | sort -r","explain":"`cut -f1` extracts the last names, `tr a-z A-Z` (or `tr '[:lower:]' '[:upper:]'`) uppercases them, `sort -r` reverses the order. Quoting `\"$1\"` keeps a file name with spaces as one argument.","rubric":[{"marks":1,"item":"`#!/bin/bash` and `\"$1\"` quoted"},{"marks":1,"item":"`cut -f1`"},{"marks":1,"item":"`tr` from lowercase to uppercase, fed by the pipe"},{"marks":1,"item":"`sort -r`"}],"pitfalls":["`tr a-z A-Z \"$1\"`: tr does not take a file name.","Unquoted `$1` breaks on file names with spaces."]},{"id":"d3-w-06","topic":"d3-streams","stage":"blank","marks":4,"prompt":"Write a script `snumsave.sh` that takes two command line arguments: `$1` is the name of a classlist file (last name TAB first name TAB student number) and `$2` is the name of an output file. The script\n\n1. writes the student numbers, sorted in ascending order, into the file named by `$2` (overwriting it), and\n2. prints the message `saved N student numbers` where N is the number of lines in that output file.","starter":"","solution":"#!/bin/bash\n\ncut -f3 \"$1\" | sort > \"$2\"\necho \"saved $(wc -l < \"$2\") student numbers\"","explain":"The first line is a pipeline whose final stdout is redirected into the output file. The second line uses command substitution; `wc -l < file` prints only the number (no file name). Nested double quotes inside `$( )` are fine.","rubric":[{"marks":1,"item":"`cut -f3 \"$1\" | sort`"},{"marks":1,"item":"`> \"$2\"` at the end of the pipeline"},{"marks":1,"item":"Command substitution with `wc -l` that yields only the number (`< \"$2\"` or `cut -f3 \"$1\" | wc -l`)"},{"marks":1,"item":"Exact message text; variables quoted"}],"pitfalls":["`wc -l \"$2\"` inside the message prints `saved 4 out.txt student numbers`.","`sort > \"$2\" \"$1\"` style mix-ups: keep the redirection at the end of the pipeline."]},{"id":"d3-w-07","topic":"d3-tr","stage":"blank","marks":2,"prompt":"A variable `path` holds a colon-separated list of directories, for example `/usr/bin:/bin:/home/user1/bin`. Write **one** command that prints each directory on its own line.","starter":"","solution":"echo \"$path\" | tr ':' '\\n'","explain":"tr reads stdin, so feed it the value with echo (or `printf '%s\\n' \"$path\"`). Each `:` is translated into a newline.","rubric":[{"marks":1,"item":"Feeds `\"$path\"` to tr through a pipe"},{"marks":1,"item":"`tr ':' '\\n'`"}],"pitfalls":["`tr ':' '\\n' \"$path\"`: tr takes no file/string argument.","Using `cut -d:`: it selects fields but does not put them on separate lines."]}]},{"day":4,"title":"Writing scripts: arguments, variables, strings, arithmetic","goal":"Write complete exam-style Bash scripts that use command line arguments, variables, command substitution, string expansions like ${p%/*}, and integer arithmetic.","topics":[{"id":"d4-scripts","title":"Your first scripts: shebang, running, comments, arguments","notebook":"bash/introduction_to_bash_scripting.ipynb","priority":"high","examNote":"Every long question on Quiz 1 was a script: Q4 (copy permissions, 4 marks) and Q5 (`trash.sh`, 10 marks). Q2E asked how a script prints its number of arguments (`echo $#`). Assignment 3 scripts all had to print usage messages to standard error and exit with a given status.","blocks":[{"type":"md","text":"A **Bash script** is a plain-text file that holds a list of commands. When you run the script, Bash reads the file and runs the commands one after another, exactly as if you had typed them at the prompt. So **anything you can type in the terminal can go in a script**, and everything you learned on Days 1 to 3 (paths, globs, quoting, redirection, pipes) works inside scripts too.\n\nThe course naming conventions for script files:\n\n- end with `.sh` (for example `hello.sh`)\n- start with a lowercase letter\n- use only letters, digits and `_` (for example `make_backup.sh`)\n\nHere is the course's first script, `hello.sh`:"},{"type":"code","code":"#!/bin/bash\n\necho 'Hello, world!'","caption":"hello.sh"},{"type":"md","text":"### The shebang line\n\nThe first line, `#!/bin/bash`, is called the **shebang** (or *hash-bang*, from the two characters `#` and `!`). It must be the very first line. It tells the operating system which program should interpret the rest of the file: here `/bin/bash`, the Bash shell. On the exam, **start every script with `#!/bin/bash`**.\n\n### Running a script\n\nTo run a script you write it with an editor, save it, make it executable, and call it by its path:"},{"type":"code","code":"$ chmod u+x hello.sh\n$ ./hello.sh\nHello, world!\n$ bash hello.sh\nHello, world!"},{"type":"md","text":"- `chmod u+x hello.sh` gives the owner (`u`) execute permission (Day 2). The file must be **readable and executable** to run it as `./hello.sh`.\n- `./hello.sh` means \"the file `hello.sh` in the current directory `.`\". You need the `./` because the shell only looks for bare command names (like `ls`) in the directories listed in your *path*, and the current directory is normally not one of them.\n- `bash hello.sh` starts a new Bash and hands it the file as an argument. This works **even without execute permission**, because `bash` only needs to *read* the file."},{"type":"check","q":"You saved `hello.sh` in the current directory. Give the two commands that make it executable for you and then run it.","a":"`chmod u+x hello.sh` then `./hello.sh`. (Without execute permission you could still run it with `bash hello.sh`.)"},{"type":"why","q":"Why does typing just `hello.sh` usually give `command not found`, while `./hello.sh` works?","a":"A bare name is searched for only in the directories on the path, and the current directory is normally not on it. `./hello.sh` is a pathname, so the shell does not search: it runs exactly that file."},{"type":"md","text":"### Comments\n\n`#` starts a **comment**: the shell ignores the `#` and everything after it to the end of the line. Comments can be on their own line or after a command:\n\n```bash\n#!/bin/bash\n\n# makesh.sh: create a skeleton script named tmp.sh\n\necho '#!/bin/bash' > tmp.sh    # write the shebang into tmp.sh\nchmod u+x tmp.sh\n```\n\nTwo details:\n\n- A **quoted or escaped** `#` is not a comment. `echo '# This is not a comment'` prints `# This is not a comment`. (The `'#!/bin/bash'` above is quoted too, so it is written into `tmp.sh`.)\n- A comment always runs **to the end of the line**, so you cannot put one in the middle of a command. `ls #list_all_.txt_files .txt` is just `ls`.\n\nEvery command sets an **exit status** (Day 1): `0` for success, `1` to `255` for failure, stored in `$?`. A script's exit status is the status of the **last command it ran**, unless it stops early with `exit N`:"},{"type":"code","code":"$ ./comment.sh          # contains only comments\n$ echo $?\n0"},{"type":"check","q":"What does the script line `ls *.txt # list text files` run?","a":"`ls *.txt`. Everything from `#` onward is a comment, so it is ignored."},{"type":"md","text":"### Command line arguments: positional parameters\n\nScripts take command line arguments like any other command. Bash stores them in **positional parameters** and a few **special parameters**:\n\n| Parameter | Meaning |\n|---|---|\n| `$0` | the pathname used to run the script, e.g. `./viewargs.sh` |\n| `$1`, `$2`, ... `$9` | the first, second, ... ninth argument |\n| `${10}`, `${11}`, ... | the tenth argument and later: **braces required** |\n| `$#` | the **number** of arguments (not counting `$0`) |\n| `\"$@\"` | all the arguments, each kept as a separate word |\n\nYou cannot assign to these with `=`; the shell sets them. Asking for an argument that was not given is **not an error**: `$3` just expands to the empty string.\n\nSuppose `args.sh` contains:\n\n```bash\n#!/bin/bash\n\necho \"$# arguments: first=$1 second=$2\"\necho \"called as $0\"\n```"},{"type":"code","code":"$ ./args.sh \"a b\" c\n2 arguments: first=a b second=c\ncalled as ./args.sh\n$ ./args.sh\n0 arguments: first= second=\ncalled as ./args.sh"},{"type":"md","text":"Notice that `\"a b\"` is **one** argument: the quotes on the command line kept the space inside it (Day 2). The quotes themselves are not part of `$1`."},{"type":"pitfall","text":"`$10` is **not** the tenth argument. Bash reads it as `$1` followed by the character `0`. With arguments `a b c d e f g h i j`, `echo \"$10 ${10}\"` prints `a0 j`. Always write `${10}`, `${11}`, ..."},{"type":"check","q":"A script is run as `./s.sh one \"two three\" four`. What are `$#`, `$2` and `$0`?","a":"`$#` is `3`, `$2` is `two three`, and `$0` is `./s.sh`."},{"type":"md","text":"### All the arguments: `\"$@\"` (and `$*`)\n\n`\"$@\"` (**with** the double quotes) expands to all the arguments as separate words, exactly as given: `\"$1\" \"$2\" \"$3\" ...`. It is the safe way to pass every argument on to another command. You will use it most with `for` loops (the loops day: `for arg in \"$@\"; do ... done`, Quiz 2 Q1F)."},{"type":"code","code":"#!/bin/bash\n\n# longlist.sh: long listing of every file named on the command line\n\nls -l \"$@\"","caption":"longlist.sh: ./longlist.sh \"my file\" notes.txt runs ls -l \"my file\" notes.txt"},{"type":"md","text":"Without the quotes, `$@` is word split, so the argument `my file` becomes the two words `my` and `file`. `\"$*\"` joins all the arguments into **one** string separated by spaces; you will rarely want that.\n\n### Errors and exit statuses\n\nA well-behaved script writes **error messages to standard error** (stream 2) and **exits with a non-zero status**. Recall from Day 3 that `>&2` redirects standard output into standard error:\n\n```bash\necho \"Usage: greet.sh name\" >&2    # message goes to stderr, not stdout\nexit 1                             # stop the script now, exit status 1\n```\n\n`exit N` stops the script immediately and makes its exit status `N`. The arithmetic notebook uses this pattern to check the number of arguments at the top of a script (the `if (( ... ))` test is explained in the arithmetic topic today, and `if` in full on the next day):\n\n```bash\n#!/bin/bash\n\nif (( $# != 1 )); then\n    echo \"Script requires 1 argument\" >&2\n    exit 1\nfi\n```"},{"type":"why","q":"Why send error messages to standard error instead of standard output?","a":"So they still reach the user's screen when standard output is redirected to a file or piped into another command, and so they do not get mixed into the script's real output."},{"type":"check","q":"Write the two lines that print `bad input` to standard error and stop the script with exit status 2.","a":"`echo \"bad input\" >&2` then `exit 2`."},{"type":"md","text":"### Putting it together\n\nThe notebook improves `makesh.sh` so the user chooses the filename with `$1`. With the quoting the course requires:\n\n```bash\n#!/bin/bash\n\n# namedsh.sh: create an executable skeleton script named $1\n\necho '#!/bin/bash' > \"$1\"\nchmod u+x \"$1\"\n```\n\nRunning `./namedsh.sh myscript.sh` creates `myscript.sh` containing the shebang, with execute permission for the owner.\n\n### Key points\n\n- Start every script with `#!/bin/bash`; make it executable with `chmod u+x f.sh`; run it with `./f.sh` (or `bash f.sh`).\n- `#` starts a comment that runs to the end of the line, unless it is quoted.\n- `$1`...`$9`, then `${10}`; `$#` is the number of arguments; `$0` is how the script was called; `\"$@\"` is all arguments, separately.\n- Errors: `echo \"message\" >&2` then `exit 1` (any status from 1 to 255).\n- A script's exit status is that of its last command unless `exit N` is used."}]},{"id":"d4-variables","title":"Variables, quoting and command substitution","notebook":"bash/variables.ipynb","priority":"high","examNote":"Quiz 1 Q2F: concatenate `str1` and `str2` into `str3` (`str3=$str1$str2`). Quiz 1 Q4 was built on `perm=$(stat -c %a \"$src\")`, and the posted solution marks the quotes around `\"$src\"` and `\"$dest\"` as **required**. The notebook's `bad_backup.sh` (`$in_.bak`) is a classic short-answer trap.","blocks":[{"type":"md","text":"A **variable** is a name that refers to a stored value. In Bash a variable name is made of letters, digits and underscores and starts with a letter or underscore. The course convention is **lowercase names**, with `_` between words (`trash_dir`, `perm`).\n\n### Assignment: no spaces around `=`\n\nTo store a value, write the name, `=`, and the value, with **no spaces anywhere around the `=`**:"},{"type":"code","code":"a=2                # assign the string 2 to a\nb=\"some string\"    # quotes keep the space inside the value\nc=$a$b             # concatenation: c is 2some string\necho \"$c\"","caption":"Prints: 2some string"},{"type":"md","text":"Spaces break assignment because the shell splits a line into words at spaces (Day 1), and the first word is the command:"},{"type":"code","code":"$ x = 5\nbash: x: command not found\n$ x= 5\nbash: 5: command not found"},{"type":"md","text":"`x = 5` runs a command named `x` with arguments `=` and `5`. `x= 5` sets `x` to empty just for a command named `5`, which does not exist.\n\n### Getting the value: parameter expansion\n\nWrite `$` in front of the name to get the value: `$var` or `${var}`. Replacing `${var}` with its value is called **parameter expansion** (or variable expansion). Without the `$`, a name is just text: `echo a` prints `a`, while `echo $a` prints `2`.\n\nBash variables are **untyped**: every value is a string. A value made only of digits can be used as a number in arithmetic (later today). There are **no floating-point numbers** in Bash.\n\n**Concatenation** is just writing expansions next to each other, so Quiz 1 Q2F's answer is:\n\n```bash\nstr3=$str1$str2\n```"},{"type":"check","q":"Write the assignment that stores `CISC` followed by `220` in `course`, given `dept=CISC` and `num=220`.","a":"`course=$dept$num` (or `course=\"$dept$num\"`, or `course=${dept}${num}`)."},{"type":"md","text":"### Unset variables are empty, and why `${var}` matters\n\nUsing a variable that was never assigned is **not an error**: it expands to the empty string. The command `unset var` removes a variable, so it becomes unset again.\n\nThat friendly behaviour causes a classic bug. The notebook's `bad_backup.sh` tries to copy file `abc` to `abc_.bak`:\n\n```bash\n#!/bin/bash\n\n# bad_backup.sh\nin=\"$1\"\nout=\"$in_.bak\"\ncp \"$in\" \"$out\"\n```"},{"type":"code","code":"$ ls -A\n'my file'\n$ ../bad_backup.sh \"my file\"\n$ ls -A\n.bak  'my file'","caption":"The script is in the parent directory. (ls puts quotes around names with spaces when it prints to a terminal.)"},{"type":"md","text":"`in_` is a valid variable name, so `$in_.bak` means \"the value of `in_`, then `.bak`\". `in_` was never set, so `out` becomes just `.bak`. The fix is braces, which mark exactly where the name ends:\n\n```bash\n#!/bin/bash\n\n# backup.sh\nin=\"$1\"\nout=\"${in}_.bak\"\ncp \"$in\" \"$out\"\n```\n\nNow `./backup.sh \"my file\"` creates `my file_.bak`. **Rule:** when a variable is directly followed by a letter, digit or `_`, write `${name}`."},{"type":"why","q":"Why did `bad_backup.sh` produce a file named `.bak` instead of an error?","a":"Bash treats `in_` as the variable name. Unset variables expand to the empty string without any error, so `\"$in_.bak\"` became `.bak`."},{"type":"md","text":"### Always quote your variables\n\nWhen a variable expansion is **not** inside double quotes, Bash splits its value into words at spaces and expands any glob characters in it. Filenames with spaces then break:"},{"type":"code","code":"$ f=\"my file\"\n$ cat $f\ncat: my: No such file or directory\ncat: file: No such file or directory\n$ cat \"$f\"\nhello","caption":"The file my file contains the line hello."},{"type":"md","text":"Inside double quotes, the `$` expansion still happens but the result stays **one word**. That is why the course requires `cp \"$in\" \"$out\"`, `chmod \"$perm\" \"$dest\"`, `mv \"$pathname\" \"$trashdir\"`. Single quotes turn expansion off completely: `echo '$f'` prints `$f`.\n\nQuoting on the right side of a plain assignment is optional (`in=$1` and `in=\"$1\"` both store the whole argument, spaces included), but quoting it never hurts."},{"type":"pitfall","text":"Unquoted variables are the most common way to lose marks on script questions. Quote every `$var` that is used as a command argument: `chmod \"$perm\" \"$dest\"`, not `chmod $perm $dest`."},{"type":"check","q":"`f=\"lab 1.txt\"`. What goes wrong with `rm $f`?","a":"The value is split into two words, so `rm` tries to delete files named `lab` and `1.txt`. Write `rm \"$f\"`."},{"type":"md","text":"### What is expanded in an assignment\n\nOn the right of `=`, Bash performs **tilde expansion, parameter expansion, command substitution and arithmetic expansion**, but **not** brace expansion or filename (glob) expansion:"},{"type":"code","code":"$ yrs={2020..2029..3}\n$ echo \"$yrs\"\n{2020..2029..3}\n$ sum=$(( 5 + 3 ))\n$ echo \"$sum\"\n8"},{"type":"md","text":"### Command substitution into a variable\n\n`$(command)` runs the command and is replaced by its output, with trailing newlines removed (Day 3). Storing that output in a variable is how a script captures information from other commands. For example, `stat -c %a file` prints a file's permissions as three octal digits (from Assignment 2):\n\n```bash\nperm=$(stat -c %a \"$src\")    # e.g. perm is 640\nchmod \"$perm\" \"$dest\"        # give dest the same permissions\n```\n\nThese two lines are the heart of Quiz 1 Q4 (see the worked example in the Write section)."},{"type":"check","q":"Store the number of lines in `classlist` in a variable `n`.","a":"`n=$(wc -l < classlist)` (the `<` makes `wc` print only the number, without the filename)."},{"type":"md","text":"### Key points\n\n- Assign with `name=value`: **no spaces** around `=`. Use `$name` or `${name}` to get the value.\n- Concatenate by writing values side by side: `str3=$str1$str2`.\n- Unset variables expand to the empty string, silently. Use `${name}` when the next character could be part of a name (`\"${in}_.bak\"`).\n- Quote expansions used as arguments: `\"$var\"`. Unquoted values are split at spaces.\n- `var=$(command)` stores a command's output; brace and glob expansion do not happen in assignments."}]},{"id":"d4-strings","title":"String operations with parameter expansion","notebook":"bash/strings.ipynb","priority":"high","examNote":"Quiz 1 Q3A (2 marks): print the first half of `s` with `${s:offset:len}` and `${#s}`. Quiz 1 Q5 (10 marks) needed `dir=${pathname%/*}`. Assignment 3 used `${#seq1}` and `${seq2:i:1}`; renaming extensions (`chext.sh`) uses `${f%.*}`.","blocks":[{"type":"md","text":"Bash has no string functions like Java's `substring`. Instead, string operations are special forms of **parameter expansion**, written inside `${ }`. None of them change the variable: they produce a new string.\n\n### Length: `${#s}`"},{"type":"code","code":"$ str=\"cisc220\"\n$ echo \"${#str}\"\n7"},{"type":"md","text":"### Substrings: `${s:offset}` and `${s:offset:length}`\n\nCharacters are numbered from **0**. `${s:offset}` is everything from index `offset` to the end; `${s:offset:length}` is `length` characters starting at `offset`."},{"type":"code","code":"$ s=\"abcdefghij\"\n$ echo \"${s:2}\"\ncdefghij\n$ echo \"${s:3:4}\"\ndefg\n$ echo \"${s:1:0}\"\n\n$ echo \"${s: -3}\"\nhij\n$ echo \"${s:1:-2}\"\nbcdefgh"},{"type":"md","text":"- A **negative offset** counts from the end, but needs a **space** before the minus: `${s: -3}`. Without it, `${s:-3}` is a different expansion (a default value, below) and gives the whole string.\n- A **negative length** means \"stop before this many characters from the end\": `${s:1:-2}` goes from index 1 up to but not including the second-last character.\n- The offset and length are arithmetic, so they can be variables or expressions: `${s:n}` and `${s:0:n}` work with or without `$` on `n`.\n\nQuiz 1 Q3A: print the first half of `s` (even length):\n\n```bash\nn=$(( ${#s} / 2 ))\necho \"${s:0:n}\"\n```\n\nand `echo \"${s:n}\"` would print the second half."},{"type":"check","q":"`s=\"hello\"`. What do `${s:1:3}` and `${s: -2}` give?","a":"`ell` (3 characters starting at index 1) and `lo` (the last 2 characters)."},{"type":"md","text":"### Removing a prefix or suffix: `#`, `##`, `%`, `%%`\n\nThese remove part of the string that matches a **pattern**. Patterns are the glob patterns from Day 2: `*` matches any characters, `?` one character, `[...]` one character from a set.\n\n| Expansion | Removes |\n|---|---|\n| `${s#pattern}` | the **shortest** matching part from the **front** |\n| `${s##pattern}` | the **longest** matching part from the **front** |\n| `${s%pattern}` | the **shortest** matching part from the **end** |\n| `${s%%pattern}` | the **longest** matching part from the **end** |\n\nMemory aid: on the keyboard `#` (Shift-3) is to the **left** of `%` (Shift-5), so `#` cuts from the left (front) and `%` from the right (end). Doubling the symbol makes it greedy (longest match)."},{"type":"code","code":"$ f=\"file.txt.zip\"\n$ echo \"${f#*.}\"      # shortest front part matching *.  is \"file.\"\ntxt.zip\n$ echo \"${f##*.}\"     # longest front part matching *.  is \"file.txt.\"\nzip\n$ echo \"${f%.*}\"      # shortest end part matching .*  is \".zip\"\nfile.txt\n$ echo \"${f%%.*}\"     # longest end part matching .*  is \".txt.zip\"\nfile"},{"type":"md","text":"The same idea splits a **pathname** into its directory and its filename, because the pieces are separated by `/`:"},{"type":"code","code":"$ p=\"/home/user1/somedir/myfile\"\n$ echo \"${p%/*}\"      # remove the last /name: the directory\n/home/user1/somedir\n$ echo \"${p##*/}\"     # remove everything up to the last /: the filename\nmyfile"},{"type":"md","text":"This is exactly Step 1 of Quiz 1 Q5: `dir=${pathname%/*}`. The notebook's `scriptname.sh` uses `script=${0##*/}` to get the script's own name without its directory: run as `./scripts/strings/scriptname.sh`, it prints `script name : scriptname.sh`.\n\nCommon recipes:\n\n| Want | Expansion | `f=dir/report.final.txt` gives |\n|---|---|---|\n| filename only | `${f##*/}` | `report.final.txt` |\n| directory only | `${f%/*}` | `dir` |\n| drop last extension | `${f%.*}` | `dir/report.final` |\n| last extension | `${f##*.}` | `txt` |"},{"type":"pitfall","text":"If the pattern does not match, nothing is removed. With `p=myfile` (no `/`), `${p%/*}` is still `myfile`, not `.`. That is why Quiz 1 Q5 promised the pathname always includes the directory (`./myfile`, where `${p%/*}` is `.`)."},{"type":"check","q":"`p=/home/user1/a.b.c`. Give the expansions that produce `/home/user1` and `a.b`.","a":"`${p%/*}` gives `/home/user1`. For `a.b`, take the filename and drop the last extension: `name=${p##*/}` then `${name%.*}`."},{"type":"md","text":"### Replacing: `${s/pattern/repl}` and `${s//pattern/repl}`\n\nOne slash replaces the **first** match; two slashes replace **all** matches. An empty replacement deletes."},{"type":"code","code":"$ s=\"sparring with a purple porpoise\"\n$ echo \"${s/p/t}\"\nstarring with a purple porpoise\n$ echo \"${s//p/t}\"\nstarring with a turtle tortoise\n$ echo \"${s//p/}\"\nsarring with a urle oroise\n$ f=\"lab 1.txt\"\n$ echo \"${f// /_}\"\nlab_1.txt"},{"type":"check","q":"`f=\"my big file.txt\"`. Which expansion gives `my_big_file.txt`?","a":"`${f// /_}` (two slashes: replace every space with `_`)."},{"type":"md","text":"### Case conversion (less likely on the test)\n\n`${s^}` uppercases the first character, `${s^^}` all characters; `${s,}` lowercases the first character, `${s,,}` all. An optional pattern limits which characters convert (`${s,,[A-C]}`)."},{"type":"code","code":"$ s=\"xyz\"\n$ echo \"${s^}\" \"${s^^}\"\nXyz XYZ\n$ t=\"ABCXYZ\"\n$ echo \"${t,,}\"\nabcxyz"},{"type":"md","text":"### Default values for unset or empty variables\n\nFour pairs of expansions deal with variables that are **unset** (never assigned, or `unset`) or **empty** (`var=\"\"`). The forms **with a colon** treat empty the same as unset.\n\n| Expansion | `str` unset | `str` empty | `str` non-empty |\n|---|---|---|---|\n| `${str-word}` | `word` | empty | `$str` |\n| `${str:-word}` | `word` | `word` | `$str` |\n| `${str=word}` | `word`, and assigns it to `str` | empty | `$str` |\n| `${str:=word}` | `word`, and assigns it | `word`, and assigns it | `$str` |\n| `${str+word}` | empty | `word` | `word` |\n| `${str:+word}` | empty | empty | `word` |\n| `${str?word}` | prints `word` to stderr, script exits | empty | `$str` |\n| `${str:?word}` | prints `word` to stderr, script exits | prints `word`, exits | `$str` |\n\nThe one to know well is `:-`, a **default value**:\n\n```bash\nname=${1:-world}     # world if no (or an empty) first argument\necho \"Hello, $name!\"\n```\n\nYou cannot use `=` or `:=` on positional parameters (`${1:=x}` is an error); use `:-` with an ordinary variable instead."},{"type":"code","code":"$ unset v\n$ echo \"[${v-none}] [${v:-none}]\"\n[none] [none]\n$ v=\"\"\n$ echo \"[${v-none}] [${v:-none}]\"\n[] [none]","caption":"The colon makes the empty string count as missing."},{"type":"check","q":"Write an assignment that sets `dir` to the first argument, or to `.` if no first argument (or an empty one) was given.","a":"`dir=${1:-.}`"},{"type":"md","text":"### Key points\n\n- `${#s}` is the length; `${s:off:len}` a substring (index from 0); `${s: -n}` the last `n` characters (space needed).\n- `#`/`##` remove from the front, `%`/`%%` from the end; single = shortest, double = longest match.\n- Directory of a path: `${p%/*}`; filename: `${p##*/}`; drop extension: `${f%.*}`; extension: `${f##*.}`.\n- `${s/pat/rep}` replaces the first match, `${s//pat/rep}` every match.\n- `${var:-default}` gives a default when `var` is unset or empty."}]},{"id":"d4-arithmetic","title":"Integer arithmetic: (( )) and $(( ))","notebook":"bash/arithmetic.ipynb","priority":"high","examNote":"Quiz 1 Q3A needed `$(( ${#s} / 2 ))`. Quiz 2's Bash question used `(( ))` loops and comparisons, and every Assignment 3 script checked `$#` with `(( ))`. Expect output questions on integer division and `%`.","blocks":[{"type":"md","text":"Bash does **signed integer arithmetic** only (typically 64-bit). There are no decimals: `7 / 2` is `3`. The operators are like Java's, plus `**` for powers:\n\n| Operator | Meaning | Example | Result |\n|---|---|---|---|\n| `+ - *` | add, subtract, multiply | `2 + 3 * 4` | `14` |\n| `/` | integer division (drops the fraction) | `17 / 5` | `3` |\n| `%` | remainder | `17 % 5` | `2` |\n| `**` | power | `2 ** 10` | `1024` |\n| `( )` | grouping | `(2 + 3) * 4` | `20` |\n| `== != < <= > >=` | comparisons: 1 if true, 0 if false | `3 > 2` | `1` |\n\nDivision truncates toward zero, so `-7 / 2` is `-3` and `-7 % 2` is `-1`. Dividing by zero is an error.\n\n### The `(( ))` command\n\n`(( expression ))` evaluates an arithmetic expression. Inside it you can assign, and you **do not need `$`** in front of variable names; spaces are allowed and make it readable:"},{"type":"code","code":"$ (( x = 1 + 2 ))\n$ echo \"$x\"\n3\n$ y=5\n$ (( z = x * y ))\n$ echo \"$z\"\n15\n$ (( z++ ))\n$ (( z += 10 ))\n$ echo \"$z\"\n26"},{"type":"md","text":"Inside `(( ))`, a name whose value is not a number, an empty variable, or an unset variable all count as **0**:\n\n```bash\nx=abc; y=5\n(( z = x + y ))    # z is 5\n```"},{"type":"check","q":"After `a=17; b=5; (( q = a / b )); (( r = a % b ))`, what are `q` and `r`?","a":"`q` is `3` and `r` is `2`."},{"type":"md","text":"### Arithmetic expansion `$(( ))`\n\n`$(( expression ))` (with a `$`) is replaced by the **value** of the expression, just like `$( )` is replaced by a command's output. Use it anywhere you need the number as text:"},{"type":"code","code":"$ x=7\n$ echo $(( x / 2 )) $(( x % 2 )) $(( x ** 2 ))\n3 1 49\n$ half=$(( x / 2 ))\n$ echo \"$half\"\n3\n$ n=$(( $(wc -l < classlist) * 3 ))"},{"type":"pitfall","text":"A plain assignment does no arithmetic. `x=5; x=$x+1; echo $x` prints `5+1`, because the value is just the string `5+1`. Write `x=$(( x + 1 ))` or `(( x++ ))`."},{"type":"why","q":"Why is `$((` needed in `half=$(( x / 2 ))` but not in `(( half = x / 2 ))`?","a":"`(( ))` is a command: it does the arithmetic and the assignment itself, producing no text. `$(( ))` is an expansion that produces text (the value), which the plain `half=` assignment then stores."},{"type":"md","text":"### `(( ))` as a condition\n\n`(( ))` is a command, so it has an exit status:\n\n- if the expression's value is **not 0**, the exit status is **0** (success, \"true\");\n- if the value **is 0**, the exit status is **1** (failure, \"false\")."},{"type":"code","code":"$ (( 0 + 0 ))\n$ echo $?\n1\n$ (( 2 > 1 ))\n$ echo $?\n0"},{"type":"md","text":"That is why `(( ))` works as the condition of an `if` (covered fully tomorrow). The arithmetic notebook's argument checks:\n\n```bash\nif (( $# != 1 )); then\n    echo \"Script requires 1 argument\" >&2\n    exit 1\nfi\n```\n\nand its `iseven.sh`, which **exits 0 for an even number and 1 for an odd one** (no argument, or a non-number, counts as 0, which is even):\n\n```bash\n#!/bin/bash\n\n# iseven.sh\n\nif (( $# != 0 )); then\n    val=$1\n    if (( val % 2 != 0 )); then\n        exit 1\n    fi\nfi\n```"},{"type":"code","code":"$ ./iseven.sh 2\n$ echo $?\n0\n$ ./iseven.sh 3\n$ echo $?\n1"},{"type":"check","q":"What exit status does `(( 5 - 5 ))` give, and why?","a":"`1`, because the expression's value is 0, and a zero value means \"false\"."},{"type":"md","text":"### Random numbers: `$RANDOM`\n\nEach time you use `$RANDOM` it expands to a random integer from 0 to 32767. Use `%` to bring it into a range: `$(( RANDOM % n ))` is from `0` to `n-1`, and `$(( RANDOM % (hi - lo) + lo ))` is from `lo` to `hi-1`. The notebook's `rand.sh`:\n\n```bash\n#!/bin/bash\n\n# rand.sh\n\nif (( $# > 2 )); then\n    echo \"rand.sh: Wrong number of arguments\" >&2\n    exit 1\nfi\nif (( $# == 0 )); then\n    echo $RANDOM\nelif (( $# == 1 )); then\n    n=$(( $RANDOM % $1 ))\n    echo $n\nelse\n    n=$(( $RANDOM % ($2 - $1) + $1 ))\n    echo $n\nfi\n```\n\n`./rand.sh 10` prints a number from 0 to 9; `./rand.sh 30 40` prints one from 30 to 39."},{"type":"check","q":"Write an expression that gives a random die roll from 1 to 6.","a":"`$(( RANDOM % 6 + 1 ))`"},{"type":"md","text":"### Key points\n\n- Integers only: `/` drops the fraction, `%` is the remainder, `**` is power.\n- `(( x = expr ))` does arithmetic and assignment; no `$` needed on names inside.\n- `$(( expr ))` produces the value as text: `echo $(( a + b ))`, `n=$(( ${#s} / 2 ))`.\n- `(( expr ))` succeeds (status 0) when `expr` is non-zero, so `if (( $# != 2 )); then ...` works.\n- `$RANDOM % n` gives 0 to n-1."}]}],"flashcards":[{"id":"d4-fc-01","topic":"d4-scripts","front":"What must the first line of a Bash script be, and what is it called?","back":"`#!/bin/bash`, the **shebang** (hash-bang). It names the program that interprets the script."},{"id":"d4-fc-02","topic":"d4-scripts","front":"How do you make `go.sh` executable for yourself and run it from its directory?","back":"`chmod u+x go.sh` then `./go.sh`"},{"id":"d4-fc-03","topic":"d4-scripts","front":"How can you run `go.sh` without execute permission?","back":"`bash go.sh` (Bash only needs to read the file)."},{"id":"d4-fc-04","topic":"d4-scripts","front":"Why `./go.sh` and not just `go.sh`?","back":"Bare names are looked up only in the directories on the path, which normally does not include the current directory. `./go.sh` is a pathname to the file."},{"id":"d4-fc-05","topic":"d4-scripts","front":"What character starts a comment, and where does the comment end?","back":"`#`; it runs to the end of the line. A quoted or escaped `#` is not a comment."},{"id":"d4-fc-06","topic":"d4-scripts","front":"`$0`","back":"The pathname used to run the script, e.g. `./trash.sh`."},{"id":"d4-fc-07","topic":"d4-scripts","front":"`$1`, `$2`, ..., `$9`","back":"The first, second, ..., ninth command line argument (empty if not given)."},{"id":"d4-fc-08","topic":"d4-scripts","front":"How do you get the tenth argument? What does `$10` mean?","back":"`${10}`. `$10` is `$1` followed by the character `0`."},{"id":"d4-fc-09","topic":"d4-scripts","front":"`$#`","back":"The number of command line arguments (not counting `$0`). Quiz 1: print it with `echo $#`."},{"id":"d4-fc-10","topic":"d4-scripts","front":"`\"$@\"`","back":"All the command line arguments, each as a separate word, exactly as given: `\"$1\" \"$2\" ...`"},{"id":"d4-fc-11","topic":"d4-scripts","front":"`\"$*\"` vs `\"$@\"`","back":"`\"$*\"` joins all arguments into one string separated by spaces; `\"$@\"` keeps them as separate words."},{"id":"d4-fc-12","topic":"d4-scripts","front":"`$?`","back":"The exit status of the most recently completed command (0 = success, 1-255 = failure)."},{"id":"d4-fc-13","topic":"d4-scripts","front":"How does a script print a message to standard error?","back":"`echo \"message\" >&2`"},{"id":"d4-fc-14","topic":"d4-scripts","front":"What does `exit 3` do in a script?","back":"Stops the script immediately with exit status 3."},{"id":"d4-fc-15","topic":"d4-scripts","front":"What is a script's exit status if it never calls `exit`?","back":"The exit status of the last command it ran."},{"id":"d4-fc-16","topic":"d4-scripts","front":"Is using an argument that was not given (e.g. `$3` with 2 arguments) an error?","back":"No. It expands to the empty string."},{"id":"d4-fc-17","topic":"d4-variables","front":"Assign the string `hello world` to variable `msg`.","back":"`msg=\"hello world\"` (no spaces around `=`; quotes keep the space)."},{"id":"d4-fc-18","topic":"d4-variables","front":"What does `x = 5` do?","back":"Runs a command named `x` with arguments `=` and `5` (usually `x: command not found`)."},{"id":"d4-fc-19","topic":"d4-variables","front":"Concatenate `str1` and `str2` into `str3` (Quiz 1).","back":"`str3=$str1$str2`"},{"id":"d4-fc-20","topic":"d4-variables","front":"When must you write `${var}` instead of `$var`?","back":"When the next character could be part of a name (letter, digit, `_`), e.g. `\"${in}_.bak\"`; and for positional parameters 10 and up."},{"id":"d4-fc-21","topic":"d4-variables","front":"Why does `out=\"$in_.bak\"` give `.bak`?","back":"Bash reads the variable name `in_`, which is unset, so it expands to empty."},{"id":"d4-fc-22","topic":"d4-variables","front":"What does an unset variable expand to?","back":"The empty string (no error)."},{"id":"d4-fc-23","topic":"d4-variables","front":"How do you remove a variable?","back":"`unset var`"},{"id":"d4-fc-24","topic":"d4-variables","front":"Why write `cp \"$in\" \"$out\"` rather than `cp $in $out`?","back":"Unquoted expansions are split at spaces (and globbed), so a filename like `my file` becomes two arguments."},{"id":"d4-fc-25","topic":"d4-variables","front":"Store the octal permissions of the file named in `src` in `perm`.","back":"`perm=$(stat -c %a \"$src\")`"},{"id":"d4-fc-26","topic":"d4-variables","front":"Which expansions happen on the right of an assignment, and which do not?","back":"Tilde, parameter, command substitution and arithmetic do; brace and filename (glob) expansion do not."},{"id":"d4-fc-27","topic":"d4-variables","front":"Does Bash have floating-point arithmetic?","back":"No. Values are strings; digit strings can be used as integers."},{"id":"d4-fc-28","topic":"d4-strings","front":"`${#s}`","back":"The length of the string in `s`."},{"id":"d4-fc-29","topic":"d4-strings","front":"`${s:offset}`","back":"The substring of `s` from index `offset` (0-based) to the end."},{"id":"d4-fc-30","topic":"d4-strings","front":"`${s:offset:length}`","back":"`length` characters of `s` starting at index `offset`."},{"id":"d4-fc-31","topic":"d4-strings","front":"Last 3 characters of `s`?","back":"`${s: -3}` (the space before `-` is required)."},{"id":"d4-fc-32","topic":"d4-strings","front":"Print the first half of `s` (even length) (Quiz 1).","back":"`n=$(( ${#s} / 2 ))` then `echo \"${s:0:n}\"`"},{"id":"d4-fc-33","topic":"d4-strings","front":"`${s#pattern}`","back":"Remove the **shortest** front part of `s` matching `pattern`."},{"id":"d4-fc-34","topic":"d4-strings","front":"`${s##pattern}`","back":"Remove the **longest** front part of `s` matching `pattern`."},{"id":"d4-fc-35","topic":"d4-strings","front":"`${s%pattern}`","back":"Remove the **shortest** end part of `s` matching `pattern`."},{"id":"d4-fc-36","topic":"d4-strings","front":"`${s%%pattern}`","back":"Remove the **longest** end part of `s` matching `pattern`."},{"id":"d4-fc-37","topic":"d4-strings","front":"Directory part of pathname `p` (Quiz 1 Q5)?","back":"`${p%/*}`"},{"id":"d4-fc-38","topic":"d4-strings","front":"Filename part of pathname `p` (also the script name from `$0`)?","back":"`${p##*/}`, e.g. `${0##*/}`"},{"id":"d4-fc-39","topic":"d4-strings","front":"Filename `f` without its last extension? Just the extension?","back":"`${f%.*}`; `${f##*.}`"},{"id":"d4-fc-40","topic":"d4-strings","front":"`${s/pat/rep}` vs `${s//pat/rep}`","back":"One slash replaces the first match; two slashes replace every match. Empty `rep` deletes."},{"id":"d4-fc-41","topic":"d4-strings","front":"`${s^^}` and `${s,,}`","back":"`s` in all uppercase; `s` in all lowercase. (`${s^}` / `${s,}` change only the first character.)"},{"id":"d4-fc-42","topic":"d4-strings","front":"`${var:-word}`","back":"`word` if `var` is unset or empty, otherwise the value of `var` (`var` is not changed)."},{"id":"d4-fc-43","topic":"d4-strings","front":"`${var-word}` (no colon)","back":"`word` only if `var` is unset; an empty `var` stays empty."},{"id":"d4-fc-44","topic":"d4-strings","front":"`${var:=word}`","back":"Like `:-`, but also assigns `word` to `var`. Not allowed on positional parameters."},{"id":"d4-fc-45","topic":"d4-strings","front":"`${var:+word}`","back":"`word` if `var` is set and non-empty, otherwise nothing."},{"id":"d4-fc-46","topic":"d4-strings","front":"`${var:?word}`","back":"If `var` is unset or empty, print `word` to stderr and exit the script; otherwise the value."},{"id":"d4-fc-47","topic":"d4-arithmetic","front":"`(( x = a + b ))` vs `x=$(( a + b ))`","back":"Both set `x` to the sum. `(( ))` is a command that does the assignment; `$(( ))` is an expansion that produces the value as text."},{"id":"d4-fc-48","topic":"d4-arithmetic","front":"`$(( 17 / 5 ))`, `$(( 17 % 5 ))`, `$(( 2 ** 5 ))`","back":"`3`, `2`, `32`"},{"id":"d4-fc-49","topic":"d4-arithmetic","front":"
