llest element from START to the end\nminidx() {\n    local i\n    idx=$1\n    for (( i = $1 + 1; i < n; i++ )); do\n        if (( arr[i] < arr[idx] )); then\n            idx=$i\n        fi\n    done\n}\n\nfor (( j = 0; j < n; j++ )); do\n    minidx \"$j\"\n    echo \"minidx($j) = $idx\"\ndone","caption":"Inside (( )) arr[i] needs no $ or braces."},{"type":"code","code":"minidx(0) = 0\nminidx(1) = 2\nminidx(2) = 2\nminidx(3) = 4\nminidx(4) = 4","caption":"Output"},{"type":"md","text":"`sort` is then a C-style loop over `j` that calls `minidx \"$j\"` and swaps `arr[j]` with `arr[idx]` using the three-line swap from Day 5 (`tmp=${arr[j]}; arr[j]=${arr[idx]}; arr[idx]=$tmp`). The full answer is the first worked exercise in **Write**."},{"type":"check","q":"Why must `minidx` set a global variable (or `echo` the index) instead of using `return $idx`?","a":"`return` only sets an exit status: it is limited to 0-255 and any non-zero value means \"failure\" to `if`. An index is a value, so hand it back through a global variable or by printing it and capturing it with `$( )`."},{"type":"why","q":"Why does `minidx` declare its loop counter `local i`?","a":"Variables are global by default. If `sort` (the caller) also used a variable `i`, `minidx` would overwrite it, like the `some_function` bug above. `local i` gives `minidx` its own `i`."},{"type":"md","text":"### Key points\n\n- Define with `name() { ... }` before calling; space after `{`, `}` on its own line (or after `;`).\n- Call like a command: `name arg1 \"arg 2\"`. Inside, `$1`, `$#`, `$@` are the function's arguments; pass the script's with `name \"$@\"`.\n- `return n` sets the exit status (0-255, 0 = success); `exit` ends the whole script.\n- Results: `echo` it and capture with `var=$(name ...)`, or assign a global variable.\n- Variables are global and dynamically scoped; use `local` for helpers.\n- `source ./file.sh` loads a file of functions into the current shell.\n- Functions can share a global array: Quiz 2 Q4's `minidx` hands back its index in the global `idx`."}]}],"flashcards":[{"id":"d4-fc-47","topic":"d4-arithmetic","front":"`(( x = a + b ))` vs `x=$(( a + b ))`","back":"Both set `x` to the sum. `(( ))` is a command that does the assignment; `$(( ))` is an expansion that produces the value as text."},{"id":"d4-fc-48","topic":"d4-arithmetic","front":"`$(( 17 / 5 ))`, `$(( 17 % 5 ))`, `$(( 2 ** 5 ))`","back":"`3`, `2`, `32`"},{"id":"d4-fc-50","topic":"d4-arithmetic","front":"Exit status of `(( expr ))`?","back":"0 if `expr` is non-zero (true); 1 if `expr` is 0 (false)."},{"id":"d4-fc-51","topic":"d4-arithmetic","front":"Check that a script got exactly 2 arguments.","back":"`if (( $# != 2 )); then echo \"Usage: s.sh a b\" >&2; exit 1; fi`"},{"id":"d6-fc-01","topic":"d6-arrays","front":"Create an array `arr` holding 1, 2 and 3.","back":"`arr=(1 2 3)` (spaces between elements, no commas, no spaces around `=`)"},{"id":"d6-fc-02","topic":"d6-arrays","front":"Copy all command line arguments into an array `arr`.","back":"`arr=(\"$@\")`"},{"id":"d6-fc-03","topic":"d6-arrays","front":"Get the element of `arr` at index `i`.","back":"`${arr[i]}` (braces required; `$i` also works inside the brackets)"},{"id":"d6-fc-05","topic":"d6-arrays","front":"Number of elements in array `arr`?","back":"`${#arr[@]}` (or `${#arr[*]}`)"},{"id":"d6-fc-10","topic":"d6-arrays","front":"`\"${arr[@]}\"` vs `\"${arr[*]}\"`?","back":"`\"${arr[@]}\"`: one word per element (spaces kept). `\"${arr[*]}\"`: one single word, all elements joined by spaces."},{"id":"d6-fc-12","topic":"d6-arrays","front":"Print all elements of `arr` on one line.","back":"`echo \"${arr[@]}\"`"},{"id":"d6-fc-13","topic":"d6-arrays","front":"Append the value of `x` to the end of `arr`.","back":"`arr+=(\"$x\")` (the parentheses are required)"},{"id":"d6-fc-18","topic":"d6-arrays","front":"Read each line of `file` into array `lines`.","back":"`mapfile -t lines < file` (`-t` strips the newlines; `readarray` is the same command)"},{"id":"d6-fc-20","topic":"d6-arrays","front":"Swap `arr[i]` and `arr[j]`.","back":"`tmp=${arr[i]}; arr[i]=${arr[j]}; arr[j]=$tmp`"},{"id":"d5-fc-28","topic":"d5-operators","front":"When is the right side of `&&` not evaluated? Of `||`?","back":"`&&`: when the left side is false. `||`: when the left side is true (short-circuit evaluation)."},{"id":"d5-fc-29","topic":"d5-operators","front":"Test: file in `f` is a regular file AND readable","back":"`[[ -f $f && -r $f ]]`"},{"id":"d5-fc-01","topic":"d5-if","front":"Write the full form of an `if` statement with `elif` and `else` (then on the same line).","back":"```bash\nif test-commands; then\n    commands\nelif test-commands; then\n    commands\nelse\n    commands\nfi\n```"},{"id":"d5-fc-03","topic":"d5-if","front":"How does `if` decide whether its condition is true?","back":"It runs the condition **command** and checks its exit status: `0` means true, non-zero means false."},{"id":"d5-fc-08","topic":"d5-if","front":"Why must you write spaces in `[[ $x == 5 ]]`?","back":"`[[` and `]]` must be separate words. `[[$x` becomes one word, e.g. `[[5: command not found`."},{"id":"d5-fc-ft","topic":"d5-if","front":"File tests inside `[[ ]]`: `-e`, `-f`, `-d`, `-r`, `-w`, `-x`, `-s`","back":"True if the file:\n- `-e` exists (any kind)\n- `-f` is a regular file\n- `-d` is a directory\n- `-r` / `-w` / `-x` is readable / writable / executable by you\n- `-s` has size greater than zero\n\nExample: `if [[ -d $f ]]; then echo \"directory\"; fi` (Midterm 2024 Q2D)"},{"id":"d5-fc-16","topic":"d5-if","front":"`-z str` vs `-n str`","back":"`-z`: true if the string is empty (length zero). `-n`: true if its length is greater than zero."},{"id":"d5-fc-20","topic":"d5-if","front":"What makes the right side of `==` a glob pattern?","back":"Not quoting it. `[[ $s == a* ]]` = starts with a; `[[ $s == \"a*\" ]]` = exactly the string `a*`."},{"id":"d5-fc-21","topic":"d5-if","front":"Integer test operators inside `[[ ]]`","back":"`-eq -ne -lt -le -gt -ge` (equal, not equal, less than, less or equal, greater than, greater or equal)."},{"id":"d5-fc-25","topic":"d5-if","front":"Standard usage-message check for a script that needs exactly one argument","back":"```bash\nif (( $# != 1 )); then\n    echo \"Usage: script.sh arg\" >&2\n    exit 1\nfi\n```"},{"id":"d5-fc-26","topic":"d5-if","front":"Quiz 2 Q1E: print `not readable` if the file named in `f` is not readable","back":"`if [[ ! -r $f ]]; then echo \"not readable\"; fi`"},{"id":"d6-fc-24","topic":"d6-loops","front":"Syntax of a C-style for loop counting i from 0 to n-1.","back":"`for (( i = 0; i < n; i++ )); do ... done`"},{"id":"d6-fc-25","topic":"d6-loops","front":"Loop over each command line argument.","back":"`for arg in \"$@\"; do ... done`"},{"id":"d6-fc-26","topic":"d6-loops","front":"Why must `$@` be quoted in `for arg in \"$@\"`?","back":"Unquoted, each argument is word-split, so `\"a b\"` becomes two iterations (see `bad_for_each_arg.sh`)."},{"id":"d6-fc-28","topic":"d6-loops","front":"Process arguments with `while` and `shift`.","back":"`while (( $# > 0 )); do echo \"$1\"; shift; done`"},{"id":"d6-fc-30","topic":"d6-loops","front":"Guard a glob loop against the no-match case.","back":"First line of the body: `[[ -e $f ]] || continue` (or `shopt -s nullglob` before the loop)."},{"id":"d6-fc-31","topic":"d6-loops","front":"Loop over the subdirectories of the current directory.","back":"`for d in */; do ... done` (each `d` ends with `/`, e.g. `stu1/`)"},{"id":"d6-fc-32","topic":"d6-loops","front":"Loop over the characters of string `s`.","back":"`for (( i = 0; i < ${#s}; i++ )); do c=${s:i:1}; ... done`"},{"id":"d6-fc-34","topic":"d6-loops","front":"Read the file named in `$file` one line at a time.","back":"`while read -r line; do ...; done < \"$file\"`"},{"id":"d6-fc-64","topic":"d6-loops","front":"Loop over each element of array `arr` (elements may contain spaces).","back":"`for x in \"${arr[@]}\"; do ... done`"},{"id":"d6-fc-38","topic":"d6-functions","front":"Course syntax to define a function `greet`.","back":"`greet() {` newline, commands, newline `}`"},{"id":"d6-fc-41","topic":"d6-functions","front":"Inside a function, what are `$1` and `$#`?","back":"The function's own first argument and its number of arguments (the script's are hidden until it returns)."},{"id":"d6-fc-42","topic":"d6-functions","front":"Call function `f` with all of the script's arguments.","back":"`f \"$@\"`"},{"id":"d6-fc-45","topic":"d6-functions","front":"`return` vs `exit` inside a function?","back":"`return` ends the function; `exit` ends the whole script."},{"id":"d6-fc-46","topic":"d6-functions","front":"Two ways to get a value out of a Bash function.","back":"1. `echo` it and capture with `var=$(f args)`. 2. Assign a non-local (global) variable that the caller reads."},{"id":"d6-fc-48","topic":"d6-functions","front":"What does `local x=5` do?","back":"Creates `x` only for this function call (and functions it calls), leaving any caller's `x` untouched."},{"id":"d6-fc-49","topic":"d6-functions","front":"Load the functions in `funcs.sh` into the current shell.","back":"`source ./funcs.sh` (or `. ./funcs.sh`)"},{"id":"d6-fc-50","topic":"d6-functions","front":"Use function `is_int` as a condition.","back":"`if is_int \"$1\"; then ... fi` (true when it returns 0)"}],"quiz":[{"id":"d4-q-26","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=7; y=2\necho $(( x / y )) $(( x % y )) $(( x ** y ))","answer":"3 1 49","explain":"Integer division drops the fraction; `%` is the remainder; `**` is power."},{"id":"d4-q-27","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=5\nx=$x+1\necho $x\nx=5\nx=$(( x + 1 ))\necho $x","answer":"5+1\n6","explain":"A plain assignment just builds a string. Only `$(( ))` (or `(( ))`) does arithmetic."},{"id":"d4-q-28","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=abc; y=5\n(( z = x + y ))\necho $z\n(( z++ ))\n(( z *= 2 ))\necho $z","answer":"5\n12","explain":"A non-numeric value counts as 0, so `z` is 5; then 6; then 12."},{"id":"d4-q-29","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"(( 0 + 0 ))\necho $?\n(( 2 - 1 ))\necho $?","answer":"1\n0","explain":"`(( ))` succeeds (status 0) when the value is non-zero and fails (status 1) when it is 0."},{"id":"d4-q-30","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"echo $(( 2 + 3 * 4 )) $(( (2 + 3) * 4 ))\necho $(( 10 / 3 * 3 )) $(( 10 * 3 / 3 ))","answer":"14 20\n9 10","explain":"Normal precedence (`*` before `+`). `10 / 3` is 3, so `10 / 3 * 3` is 9: the fraction is lost before multiplying."},{"id":"d4-q-31","topic":"d4-arithmetic","type":"mcq","q":"Which line prints a random integer from 1 to 10 inclusive?","options":["`echo $(( RANDOM % 10 ))`","`echo $(( RANDOM % 10 + 1 ))`","`echo $(( RANDOM % 11 ))`","`echo $RANDOM % 10 + 1`"],"answer":1,"explain":"`RANDOM % 10` is 0 to 9, plus 1 gives 1 to 10. `% 11` gives 0 to 10. The last has no arithmetic expansion, so it prints a number followed by the literal text `% 10 + 1`."},{"id":"d4-q-32","topic":"d4-arithmetic","type":"short","q":"Write the start of a script that requires **at least** 2 arguments: if fewer are given it prints `need 2 args` to standard error and exits with status 1.","answer":"```bash\n#!/bin/bash\n\nif (( $# < 2 )); then\n    echo \"need 2 args\" >&2\n    exit 1\nfi\n```","explain":"Also correct: `[[ $# -lt 2 ]]` (from the conditional statements topic). `(( $# < 2 ))` compares numbers."},{"id":"d6-q-01","topic":"d6-arrays","type":"mcq","q":"Which line creates an array `arr` holding the three values 1, 2 and 3?","options":["`arr=(1 2 3)`","`arr=(1, 2, 3)`","`arr=[1 2 3]`","`arr = (1 2 3)`"],"answer":0,"explain":"Elements go in parentheses separated by spaces. Commas would become part of the elements (`1,`), square brackets do not make an array, and spaces around `=` make Bash run `arr` as a command."},{"id":"d6-q-02","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=(10 20 30)\necho \"${#arr[@]}\"\necho \"${arr[1]}\"","answer":"3\n20","explain":"`${#arr[@]}` is the number of elements (3). Indexes start at 0, so index 1 is the second element, 20."},{"id":"d6-q-03","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=(red green blue)\necho $arr\necho $arr[2]","answer":"red\nred[2]","explain":"`$arr` alone means element 0. In `$arr[2]` only `$arr` is expanded; `[2]` is plain text. You need `${arr[2]}` to get `blue`."},{"id":"d6-q-04","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=([3]=c [7]=g)\narr+=(h)\necho \"${!arr[@]}\"\necho \"${#arr[@]}\"","answer":"3 7 8\n3","explain":"The array is sparse: indexes 3 and 7. Appending puts `h` after the largest index, at 8. There are 3 elements, even though the largest index is 8."},{"id":"d5-q-61","topic":"d6-arrays","type":"output","q":"What does this print?","code":"pets=(\"a dog\" \"a cat\")\na=(\"${pets[@]}\")\nb=(\"${pets[*]}\")\nc=(${pets[@]})\necho \"${#a[@]} ${#b[@]} ${#c[@]}\"\necho \"${b[0]}\"","answer":"2 1 4\na dog a cat","explain":"Each word an expansion produces becomes one element of the new array. Quoted `@`: one word per element (2). Quoted `*`: one single word (1), which is `a dog a cat`. Unquoted: word splitting gives 4 words."},{"id":"d5-q-62","topic":"d6-arrays","type":"mcq","q":"The array `files` holds filenames, some containing spaces. Which command removes exactly those files, passing each filename to `rm` as one argument?","options":["`rm ${files[@]}`","`rm \"${files[*]}\"`","`rm \"${files[@]}\"`","`rm \"$files\"`"],"answer":2,"explain":"`\"${files[@]}\"` expands to one quoted word per element. Unquoted `@` splits names at spaces; quoted `*` gives one big word (one name that does not exist); `\"$files\"` is only element 0."},{"id":"d6-q-07","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=(a b)\narr+=c\narr+=(d)\necho \"${arr[@]}\"\necho \"${#arr[@]}\"","answer":"ac b d\n3","explain":"`arr+=c` without parentheses appends the text `c` to element 0, making `ac`. `arr+=(d)` adds a new element. So 3 elements: `ac`, `b`, `d`."},{"id":"d6-q-08","topic":"d6-arrays","type":"output","q":"The script `count.sh` is run as `./count.sh one \"two three\" four`. What does it print?","code":"#!/bin/bash\narr=(\"$@\")\necho \"${#arr[@]}\"\necho \"${arr[1]}\"\necho \"${arr[2]}\"","answer":"3\ntwo three\nfour","explain":"`arr=(\"$@\")` makes one element per argument, keeping `two three` whole. So there are 3 elements; index 1 is `two three` and index 2 is `four`."},{"id":"d6-q-09","topic":"d6-arrays","type":"output","q":"The file `colors.txt` contains three lines: `red`, `light green`, `blue`. What does this print?","code":"mapfile -t c < colors.txt\necho \"${#c[@]}\"\necho \"${c[1]}\"","answer":"3\nlight green","explain":"`mapfile -t` stores one line per element (spaces inside a line are kept) and strips the newlines. 3 lines give 3 elements; index 1 is the second line."},{"id":"d6-q-10","topic":"d6-arrays","type":"short","q":"Write the Bash lines that swap the elements at indexes `i` and `j` of the array `arr`.","answer":"```bash\ntmp=${arr[i]}\narr[i]=${arr[j]}\narr[j]=$tmp\n```","explain":"You need a temporary variable, otherwise the first assignment overwrites a value you still need. `${arr[$i]}` is equally fine."},{"id":"d5-q-14","topic":"d5-operators","type":"output","q":"What does this print?","code":"yr=1900\nif (( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) )); then\n    echo \"$yr is a leap year\"\nelse\n    echo \"$yr is not a leap year\"\nfi","answer":"1900 is not a leap year","explain":"1900 % 400 is 300, so the left side is false. 1900 is divisible by 4 but also by 100, so the parenthesised part is false too."},{"id":"d5-q-15","topic":"d5-operators","type":"mcq","q":"The file `nosuch` does not exist. In `[[ -e nosuch && -r nosuch ]]`, what happens?","options":["Both tests run and the result is false","Only `-e` runs; the result is false (short-circuit)","Bash prints an error because the file is missing","Only `-r` runs because `&&` is evaluated right to left"],"answer":1,"explain":"`&&` stops as soon as the left side is false: the whole expression must be false, so `-r` is never evaluated. No error is printed; file tests on missing files are simply false."},{"id":"d5-q-16","topic":"d5-operators","type":"output","q":"What does this print?","code":"s=\"\"\nif [[ ! -z $s || -n $s ]]; then echo yes; else echo no; fi","answer":"no","explain":"`s` is empty, so `-z $s` is true and `! -z $s` is false; `-n $s` is false. false || false is false."},{"id":"d5-q-17","topic":"d5-operators","type":"mcq","q":"Which condition is true exactly when the integer `x` is between 3 and 10 (exclusive)?","options":["`[[ $x > 3 && $x < 10 ]]`","`(( x > 3 || x < 10 ))`","`[[ $x -gt 3 && $x -lt 10 ]]`","`[[ $x -gt 3 ]] || [[ $x -lt 10 ]]`"],"answer":2,"explain":"Both comparisons must hold, so `&&`, with integer operators. Option A compares strings (`\"5\" < \"10\"` is false). Options B and D use `||`, true for every integer."},{"id":"d5-q-01","topic":"d5-if","type":"output","q":"What does this print?","code":"if true; then echo \"true\"; fi\nif false; then echo \"false\"; fi\necho done","answer":"true\ndone","explain":"The condition is a command. `true` exits with 0 (true) so its `echo` runs. `false` exits with 1, the condition fails, and there is no `else`, so nothing is printed."},{"id":"d5-q-02","topic":"d5-if","type":"mcq","q":"What is wrong with `if [[$x == 5]]; then echo hi; fi`?","options":["Nothing; it prints hi if x is 5","`==` must be `-eq` for numbers","There must be a space after `[[` and before `]]`","`$x` must be double quoted"],"answer":2,"explain":"`[[` and `]]` must be separate words. With x=5 Bash tries to run a command named `[[5` (`[[5: command not found`). `==` compares strings, which works for `5`; quoting is optional inside `[[ ]]`."},{"id":"d5-q-03","topic":"d5-if","type":"output","q":"What does this print?","code":"if [[ 100 < 2 ]]; then echo \"100 comes first\"; else echo \"2 comes first\"; fi","answer":"100 comes first","explain":"Inside `[[ ]]`, `<` compares strings lexicographically: `1` comes before `2`, so \"100\" < \"2\" is true. Use `-lt` or `(( ))` for numbers."},{"id":"d5-q-04","topic":"d5-if","type":"output","q":"What does this print?","code":"x=hello\nif [[ $x -eq 0 ]]; then echo zero; else echo \"not zero\"; fi","answer":"zero","explain":"In an integer test, a non-integer word like `hello` is treated as 0 (no error), so `0 -eq 0` is true."},{"id":"d5-q-05","topic":"d5-if","type":"output","q":"What does this print?","code":"str=\"avocado\"\nif [[ $str == a* ]]; then echo \"pattern match\"; else echo \"no pattern match\"; fi\nif [[ $str == \"a*\" ]]; then echo \"equal to a*\"; else echo \"not equal to a*\"; fi","answer":"pattern match\nnot equal to a*","explain":"Unquoted `a*` on the right of `==` is a glob pattern (starts with a). Quoted `\"a*\"` is the literal two-character string, which `avocado` is not."},{"id":"d5-q-06","topic":"d5-if","type":"output","q":"What does this print?","code":"str=\"K7L 3N6\"\nif [[ $str == [A-Z][0-9][A-Z][0-9][A-Z][0-9] ]]; then\n    echo \"might be a postal code\"\nelse\n    echo \"not a postal code\"\nfi","answer":"not a postal code","explain":"The pattern describes exactly six characters. The space makes the string seven characters, and the 4th character is a space, not a digit."},{"id":"d5-q-07","topic":"d5-if","type":"output","q":"What does this print?","code":"x=7\nif (( x > 10 )); then\n    echo big\nelif (( x > 5 )); then\n    echo medium\nelse\n    echo small\nfi","answer":"medium","explain":"`7 > 10` is false, so Bash tries the `elif`: `7 > 5` is true, so it prints `medium` and skips the `else`. Inside `(( ))`, `>` is a numeric comparison."},{"id":"d5-q-08","topic":"d5-if","type":"mcq","q":"`notes` is a directory and `empty.txt` is an empty regular file. Which test is **false**?","options":["`[[ -e notes ]]`","`[[ -d notes ]]`","`[[ -e empty.txt ]]`","`[[ -s empty.txt ]]`"],"answer":3,"explain":"`-s` needs size greater than zero, and `empty.txt` is empty. `-e` is true for any existing file (including directories); `-d` is true for the directory."},{"id":"d5-q-09","topic":"d5-if","type":"short","q":"Suppose the variable `f` stores the name of a file. Write an `if` statement that prints `not writable` to standard output if the file is not writable.","answer":"`if [[ ! -w $f ]]; then echo \"not writable\"; fi`","explain":"Same shape as Quiz 2 Q1E with `-w` instead of `-r`. Also accepted: the multi-line form, or `[[ ! -w \"$f\" ]]`. Common mistakes: no spaces inside `[[ ]]`, no `;` before `then`, forgetting `fi`."},{"id":"d5-q-11","topic":"d5-if","type":"mcq","q":"Which `if` statement correctly tests whether the variable `x` has been assigned a value?","options":["`if [[ -v $x ]]; then`","`if [[ -v x ]]; then`","`if [[ -z x ]]; then`","`if [[ $x ]]; then`"],"answer":1,"explain":"`-v` takes the variable's **name**. `-v $x` would test a variable named by x's value. `-z x` tests the literal string \"x\" (never empty). `[[ $x ]]` is false for a variable assigned the empty string."},{"id":"d5-q-12","topic":"d5-if","type":"short","q":"Write the lines at the start of a script that print `Usage: count.sh file` to standard error and exit with status 1 when the number of command line arguments is not exactly 1.","answer":"```bash\nif (( $# != 1 )); then\n    echo \"Usage: count.sh file\" >&2\n    exit 1\nfi\n```","explain":"`[[ $# -ne 1 ]]` is equally good. Both `>&2` (stderr) and `exit 1` are needed; without `exit` the script would carry on."},{"id":"d5-q-13","topic":"d5-if","type":"output","q":"`compstr.sh` is the course script below. What does `./compstr.sh tiger poodle` print?","code":"#!/bin/bash\n\ns1=$1\ns2=$2\nif [[ $s1 == $s2 ]]; then\n    echo 0\nelif [[ $s1 < $s2 ]]; then\n    echo -1\nelse\n    echo 1\nfi","answer":"1","explain":"The strings are not equal, and `tiger` does not come before `poodle` (`t` comes after `p`), so the `else` branch prints `1`."},{"id":"d5-q-63","topic":"d5-if","type":"output","q":"What does this print?","code":"pw=\"abc 123\"\nstatus=0\nif [[ $pw =~ [[:space:]] ]]; then echo \"no spaces allowed\"; status=2; fi\nif [[ ! $pw =~ [[:digit:]] ]]; then echo \"needs a digit\"; status=2; fi\nif [[ ! $pw =~ [[:punct:]] ]]; then echo \"needs a symbol\"; status=2; fi\necho \"status $status\"","answer":"no spaces allowed\nneeds a symbol\nstatus 2","explain":"Each rule is its own `if`, so every rule is checked. `abc 123` contains a space (first message), contains a digit (so `! ... [[:digit:]]` is false, no message), and has no symbol (third message). Any failure sets `status` to 2."},{"id":"d6-q-11","topic":"d6-loops","type":"output","q":"What does this print?","code":"count=3\nwhile (( count > 0 )); do\n    echo $count\n    (( count-- ))\ndone\necho done","answer":"3\n2\n1\ndone","explain":"The body runs while `count > 0`: for 3, 2 and 1. When count reaches 0 the test fails and the loop ends."},{"id":"d6-q-12","topic":"d6-loops","type":"output","q":"What does this print?","code":"n=1\nuntil (( n > 20 )); do\n    n=$(( n * 3 ))\ndone\necho $n","answer":"27","explain":"`until` repeats while the test is false: n goes 1 -> 3 -> 9 -> 27. Now `27 > 20` is true, so the loop stops."},{"id":"d6-q-13","topic":"d6-loops","type":"output","q":"What does this print?","code":"s=hello\nr=\"\"\nfor (( i = ${#s} - 1; i >= 0; i-- )); do\n    r=$r${s:i:1}\ndone\necho $r","answer":"olleh","explain":"i runs from 4 down to 0, and `${s:i:1}` is the character at index i, so the characters are appended in reverse order."},{"id":"d6-q-14","topic":"d6-loops","type":"output","q":"The script `n.sh` is run as `./n.sh \"a b\" c`. What does it print?","code":"#!/bin/bash\nn=0\nfor arg in $@; do (( n++ )); done\nm=0\nfor arg in \"$@\"; do (( m++ )); done\necho \"$n $m\"","answer":"3 2","explain":"Unquoted `$@` is word-split into `a`, `b`, `c` (3 passes). Quoted `\"$@\"` keeps the 2 arguments whole (2 passes)."},{"id":"d6-q-15","topic":"d6-loops","type":"output","q":"The current directory contains only `notes.txt` and `todo.txt`. What does this print?","code":"for f in *.pdf; do\n    echo \"found $f\"\ndone\nfor f in *.txt; do\n    echo \"found $f\"\ndone","answer":"found *.pdf\nfound notes.txt\nfound todo.txt","explain":"No name matches `*.pdf`, so the glob stays as the literal text `*.pdf` and the first loop runs once with it. The second glob expands to the two `.txt` files in sorted order."},{"id":"d6-q-16","topic":"d6-loops","type":"mcq","q":"In `chext.sh`, why does the loop `for f in *.\"$1\"; do` start its body with `[[ -e $f ]] || continue`?","options":["To skip directories","Because when no file matches, `f` is the literal pattern, which does not exist","To skip files with spaces in their names","To make the loop run in sorted order"],"answer":1,"explain":"A glob with no match is left unchanged, so the body would run once with `f` equal to e.g. `*.txt`, and `mv` would fail. `-e` tests whether the name exists; if not, `continue` skips it. It has nothing to do with directories, spaces or sorting."},{"id":"d6-q-17","topic":"d6-loops","type":"output","q":"The script `s.sh` is run as `./s.sh a b c`. What does it print?","code":"#!/bin/bash\nwhile (( $# > 0 )); do\n    echo \"$#: $1\"\n    shift\ndone","answer":"3: a\n2: b\n1: c","explain":"Each `shift` removes the first argument and lowers `$#` by 1. The loop stops when `$#` reaches 0."},{"id":"d6-q-18","topic":"d6-loops","type":"output","q":"What does this print?","code":"for i in 1 2 3 4 5 6; do\n    if (( i % 2 == 0 )); then\n        continue\n    fi\n    if (( i > 4 )); then\n        break\n    fi\n    echo $i\ndone","answer":"1\n3","explain":"Even numbers are skipped by `continue`. 1 and 3 are printed. At 5, `i > 4` is true, so `break` ends the loop before 6."},{"id":"d6-q-19","topic":"d6-loops","type":"output","q":"The file `pairs.txt` contains the two lines `x,1` and `y,2`. What does this print?","code":"while IFS=\",\" read -r name num; do\n    echo \"$num-$name\"\ndone < pairs.txt","answer":"1-x\n2-y","explain":"`IFS=\",\"` makes `read` split each line at the comma: the first field goes in `name`, the rest in `num`. The loop reads one line per pass from the file redirected after `done`."},{"id":"d6-q-20","topic":"d6-loops","type":"short","q":"Write the first line of a `for` loop that visits each immediate subdirectory of the current directory.","answer":"`for d in */; do`","explain":"The glob `*/` matches only directories; each name ends with `/` (e.g. `stu1/`). Remember the no-match case: if there are no subdirectories, `d` is the literal `*/`, so guard with `[[ -d $d ]] || continue`."},{"id":"d6-q-60","topic":"d6-loops","type":"output","q":"What does this print?","code":"arr=(\"red apple\" kiwi)\nfor x in \"${arr[@]}\"; do\n    echo \"<$x>\"\ndone\nfor x in ${arr[@]}; do\n    echo \"<$x>\"\ndone","answer":"<red apple>\n<kiwi>\n<red>\n<apple>\n<kiwi>","explain":"Quoted, `\"${arr[@]}\"` gives one word per element (2 passes). Unquoted, the elements are word split, so `red apple` becomes two words (3 passes)."},{"id":"d6-q-61","topic":"d6-loops","type":"output","q":"What does this print?","code":"arr=(a b c)\narr[6]=g\nfor i in \"${!arr[@]}\"; do\n    echo \"$i:${arr[i]}\"\ndone\necho \"count: ${#arr[@]}\"","answer":"0:a\n1:b\n2:c\n6:g\ncount: 4","explain":"`\"${!arr[@]}\"` lists only the indexes in use (0, 1, 2 and 6), so the sparse array is handled correctly. `${#arr[@]}` counts elements (4), not the largest index; a C-style loop `i < 4` would have missed `g`."},{"id":"d6-q-62","topic":"d6-loops","type":"output","q":"The script `r.sh` is run as `./r.sh x \"y z\" w`. What does it print?","code":"#!/bin/bash\narr=(\"$@\")\nfor (( i = ${#arr[@]} - 1; i >= 0; i-- )); do\n    echo \"${arr[i]}\"\ndone","answer":"w\ny z\nx","explain":"`arr=(\"$@\")` copies the 3 arguments into elements 0-2 (`y z` stays one element). The loop starts at index 3 - 1 = 2 and counts down to 0."},{"id":"d6-q-63","topic":"d6-loops","type":"output","q":"What does this print?","code":"for i in 1 2 3; do\n    for j in 1 2 3; do\n        if (( j > i )); then\n            continue 2\n        fi\n        echo \"$i$j\"\n    done\ndone","answer":"11\n21\n22\n31\n32\n33","explain":"`continue 2` skips the rest of the **outer** loop's pass, so for each `i` the inner loop stops as soon as `j > i`. That prints `j` = 1 to `i` for each `i`."},{"id":"d6-q-21","topic":"d6-functions","type":"mcq","q":"Which function definition is a **syntax error**?","options":["`f() { echo hi; }`","`f() {echo hi; }`","`f() {` then `echo hi` and `}` on separate lines","`function f {` then `echo hi` and `}` on separate lines"],"answer":1,"explain":"`{` must be followed by a space or newline; in `{echo` Bash sees one word. The `function f` form is legal (though the course uses `f()`), and the one-line form works because of the `;` before `}`."},{"id":"d6-q-22","topic":"d6-functions","type":"output","q":"What does this print?","code":"show() {\n    echo \"$#:$1\"\n}\nshow a \"b c\"\nshow\nshow \"x y\"","answer":"2:a\n0:\n1:x y","explain":"Inside a function `$#` and `$1` refer to the function's own arguments. With no arguments `$1` is empty."},{"id":"d6-q-23","topic":"d6-functions","type":"output","q":"The script `p.sh` is run as `./p.sh X`. What does it print?","code":"#!/bin/bash\nf() {\n    echo \"in f: $1\"\n}\nf Y\necho \"in script: $1\"","answer":"in f: Y\nin script: X","explain":"While `f` runs, `$1` is `f`'s argument (`Y`). After it returns, the script's own `$1` (`X`) is back."},{"id":"d6-q-24","topic":"d6-functions","type":"output","q":"What does this print?","code":"f() {\n    return 300\n}\nf\necho $?","answer":"44","explain":"An exit status is only 8 bits (0-255). 300 - 256 = 44."},{"id":"d6-q-25","topic":"d6-functions","type":"output","q":"What does this print?","code":"double() {\n    echo $(( $1 * 2 ))\n}\nx=$(double 21)\necho \"x=$x\"","answer":"x=42","explain":"The function prints its result; `$( )` captures that output into `x`."},{"id":"d6-q-26","topic":"d6-functions","type":"output","q":"What does this print?","code":"g() {\n    echo \"g sees $v\"\n    v=changed\n}\nf() {\n    local v=inner\n    g\n    echo \"f has $v\"\n}\nv=outer\nf\necho \"main has $v\"","answer":"g sees inner\nf has changed\nmain has outer","explain":"Dynamic scoping: `g` is called by `f`, so it sees `f`'s local `v` (`inner`) and its assignment changes that local `v`. The main script's `v` was never touched, so it is still `outer`."},{"id":"d6-q-27","topic":"d6-functions","type":"output","q":"What does this print?","code":"f() {\n    i=100\n}\nfor (( i = 0; i < 3; i++ )); do\n    echo $i\n    f\ndone\necho \"after: $i\"","answer":"0\nafter: 101","explain":"`f` has no `local`, so it changes the loop's `i` to 100. Then `i++` makes it 101, `101 < 3` is false, and the loop ends after one pass."},{"id":"d6-q-28","topic":"d6-functions","type":"mcq","q":"A function `check` runs `exit 1` when it finds a problem. What happens when a script calls `check` and the problem is found?","options":["The function stops and `$?` is 1","The whole script stops with exit status 1","Nothing: `exit` is not allowed in a function","The function stops and `$?` is 0"],"answer":1,"explain":"`exit` always ends the whole script (the current shell). To stop only the function and set its status, use `return 1`."},{"id":"d6-q-29","topic":"d6-functions","type":"short","q":"Inside a script, show how to call the function `process` so that it receives all of the script's command line arguments.","answer":"`process \"$@\"`","explain":"Inside `process`, `$1`, `$2`, ... are then the script's arguments. Quote `$@` so arguments with spaces stay whole."},{"id":"d6-q-30","topic":"d6-functions","type":"output","q":"The file `lib.sh` contains\n\n```bash\nok() {\n    echo \"checking $1\"\n    [[ $1 == yes ]]\n}\n```\n\nWhat does this print?","code":"source ./lib.sh\nok yes; echo $?\nok no; echo $?","answer":"checking yes\n0\nchecking no\n1","explain":"`source` defines `ok` in the current shell. With no `return`, the function's status is the status of its last command, the `[[ ]]` test: 0 for `yes`, 1 otherwise."},{"id":"d6-q-64","topic":"d6-functions","type":"output","q":"What does this print?","code":"hasdups() {\n    local s=$1 i j\n    for (( i = 0; i < ${#s}; i++ )); do\n        for (( j = i + 1; j < ${#s}; j++ )); do\n            if [[ ${s:i:1} == \"${s:j:1}\" ]]; then\n                echo \"${s:i:1}:$i = ${s:j:1}:$j\"\n                return 0\n            fi\n        done\n    done\n    return 1\n}\nhasdups banana; echo $?\nhasdups abc; echo $?","answer":"a:1 = a:3\n0\n1","explain":"For `banana`, i=0 (`b`) matches nothing later. i=1 (`a`) first matches at j=3, so it prints `a:1 = a:3` and returns 0 at once (the `a` at 5 and the `n`s are never reported). `abc` has no repeat: the loops finish and it returns 1, printing nothing."},{"id":"d6-q-65","topic":"d6-functions","type":"output","q":"What does this print?","code":"minidx() {\n    local i\n    idx=$1\n    for (( i = $1 + 1; i < ${#arr[@]}; i++ )); do\n        if (( arr[i] < arr[idx] )); then\n            idx=$i\n        fi\n    done\n}\narr=(5 2 8 2 9)\nminidx 0; echo \"$idx\"\nminidx 2; echo \"$idx\"\nminidx 4; echo \"$idx\"","answer":"1\n3\n4","explain":"From index 0 the smallest value is 2, first at index 1; the second 2 at index 3 is not **smaller** (`<`), so `idx` stays 1. From index 2 the values are 8, 2, 9: the 2 is at index 3. From index 4 there is only one element, so `idx` is 4. `idx` is global, so the caller can read it."},{"id":"d6-q-66","topic":"d6-functions","type":"output","q":"This selection sort prints the array after each pass. What does it print?","code":"arr=(4 1 3 2)\nn=${#arr[@]}\nminidx() {\n    local i\n    idx=$1\n    for (( i = $1 + 1; i < n; i++ )); do\n        if (( arr[i] < arr[idx] )); then idx=$i; fi\n    done\n}\nsort() {\n    local j tmp\n    for (( j = 0; j < n; j++ )); do\n        minidx \"$j\"\n        tmp=${arr[j]}\n        arr[j]=${arr[idx]}\n        arr[idx]=$tmp\n        echo \"j=$j: ${arr[*]}\"\n    done\n}\nsort","answer":"j=0: 1 4 3 2\nj=1: 1 2 3 4\nj=2: 1 2 3 4\nj=3: 1 2 3 4","explain":"j=0: the smallest (1, index 1) swaps with 4. j=1: the smallest of 4 3 2 is 2 (index 3), swapped with 4. j=2: 3 is already the smallest of 3 4, so it swaps with itself. j=3: one element left."},{"id":"d6-q-67","topic":"d6-functions","type":"output","q":"What does this print?","code":"f() {\n    y=5\n    echo hi\n}\nx=$(f)\necho \"x=$x y=$y\"\nf > /dev/null\necho \"y=$y\"","answer":"x=hi y=\ny=5","explain":"`$( )` runs `f` in a subshell: its output (`hi`) is captured, but its assignment `y=5` happens in the copy and is lost. Calling `f` normally (output thrown away into `/dev/null`) runs it in the current shell, so `y` is set."},{"id":"d6-q-68","topic":"d6-functions","type":"output","q":"What does this print?","code":"indexof() {\n    local i\n    for (( i = 0; i < ${#2}; i++ )); do\n        if [[ ${2:i:1} == \"$1\" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}\ni=$(indexof z abc); echo \"$? $i\"\ni=$(indexof c abcabc); echo \"$? $i\"","answer":"1 -1\n0 2","explain":"The status of `i=$( ... )` is the function's status, so `$?` is 1 when the character is missing (and `i` is the printed `-1`) and 0 when it is found. `indexof` returns at the **first** `c`, index 2."},{"id":"d6-q-69","topic":"d6-functions","type":"output","q":"What does this print?","code":"is_even() {\n    (( $1 % 2 == 0 ))\n}\nfor n in 3 4 7 10; do\n    if is_even \"$n\"; then\n        echo \"$n even\"\n    else\n        echo \"$n odd\"\n    fi\ndone","answer":"3 odd\n4 even\n7 odd\n10 even","explain":"`is_even` has no `return`, so its status is that of its last command, the `(( ))` test: 0 (true) when the remainder is 0. `if` uses that status directly."},{"id":"d6-q-70","topic":"d6-functions","type":"output","q":"The script `c.sh` is run as `./c.sh \"a b\" c`. What does it print?","code":"#!/bin/bash\ncount() {\n    echo \"$#\"\n}\ncount \"$@\"\ncount $@\ncount \"$*\"\ncount","answer":"2\n3\n1\n0","explain":"`\"$@\"` passes the 2 arguments unchanged. Unquoted `$@` is word split into `a`, `b`, `c` (3). `\"$*\"` joins them into one word, `a b c` (1). With no arguments, `$#` inside the function is 0, even though the script has 2."},{"id":"d6-q-71","topic":"d6-functions","type":"mcq","q":"`minidx` ends with `echo \"$idx\"` (it prints the index). Which line in `sort` correctly stores that index in `idx`?","options":["`idx=minidx $j`","`idx=$(minidx \"$j\")`","`minidx \"$j\"; idx=$?`","`idx=${minidx $j}`"],"answer":1,"explain":"Command substitution `$( )` captures what a function prints. Option A tries to run `$j` as a command with `idx=minidx` set for it; option C reads the exit status, not the output; option D is not valid parameter expansion (`${ }` holds a variable name, not a command)."}],"write":[{"id":"d4-w-08","topic":"d4-arithmetic","stage":"blank","marks":5,"prompt":"Write `hms.sh SECONDS` that converts a number of seconds into hours, minutes and seconds and prints them in the form `1h 2m 5s` (for `./hms.sh 3725`). If it does not get exactly one argument it prints `Usage: hms.sh seconds` to standard error and exits with status 1. Use integer arithmetic only.","starter":"","solution":"#!/bin/bash\n\n# hms.sh: convert a number of seconds to hours, minutes and seconds\n\nif (( $# != 1 )); then\n    echo \"Usage: hms.sh seconds\" >&2\n    exit 1\nfi\n\ntotal=$1\nh=$(( total / 3600 ))\nm=$(( total % 3600 / 60 ))\ns=$(( total % 60 ))\necho \"${h}h ${m}m ${s}s\"","explain":"`3725 / 3600` is 1 hour. The leftover `3725 % 3600` is 125 seconds, and `125 / 60` is 2 minutes. `3725 % 60` is 5 seconds. The braces in `${h}h` are **required**: `$hh` would be the unset variable `hh`.","rubric":[{"marks":1,"item":"Argument count check, usage to stderr, `exit 1`"},{"marks":1,"item":"Hours with `/ 3600`"},{"marks":1,"item":"Minutes with `% 3600 / 60` (or equivalent)"},{"marks":1,"item":"Seconds with `% 60`"},{"marks":1,"item":"Output in the exact format, using `${h}h` style braces"}],"pitfalls":["`echo \"$hh $mm $ss\"` prints three empty values: braces are needed before the letters.","`total / 60` alone gives total minutes (62), not the minutes part (2)."],"core":true},{"id":"d5-w-61","topic":"d6-arrays","stage":"faded","marks":5,"prompt":"Write `swapends.sh`, which copies its command line arguments into an array, swaps the **first** and the **last** element, and prints all the elements on one line. If it gets fewer than 2 arguments it prints `Usage: swapends.sh arg1 arg2 ...` to standard error and exits with status 1. Example: `./swapends.sh a \"b c\" d e` prints `e b c d a`. Fill in the blanks (no loop is needed).","starter":"#!/bin/bash\n\n# swapends.sh: print the arguments with the first and last swapped\n\nif (( ____ )); then\n    echo \"Usage: swapends.sh arg1 arg2 ...\" >&2\n    exit 1\nfi\n\narr=____\nlast=$(( ____ ))\ntmp=${arr[0]}\narr[0]=____\narr[last]=____\necho ____","solution":"#!/bin/bash\n\n# swapends.sh: print the arguments with the first and last swapped\n\nif (( $# < 2 )); then\n    echo \"Usage: swapends.sh arg1 arg2 ...\" >&2\n    exit 1\nfi\n\narr=(\"$@\")\nlast=$(( ${#arr[@]} - 1 ))\ntmp=${arr[0]}\narr[0]=${arr[last]}\narr[last]=$tmp\necho \"${arr[@]}\"","explain":"Blanks in order: `$# < 2`; `(\"$@\")`; `${#arr[@]} - 1`; `${arr[last]}`; `$tmp`; `\"${arr[@]}\"`.\n\n`arr=(\"$@\")` keeps `b c` as one element. The array is not sparse, so its last index is the number of elements minus 1. The swap needs `tmp`: after `arr[0]=${arr[last]}` the old first element would otherwise be lost. This is the swap step of the selection sort in Quiz 2 Q4.","rubric":[{"marks":1,"item":"Usage check `(( $# < 2 ))` (message to stderr and `exit 1` given)"},{"marks":1,"item":"`arr=(\"$@\")` with the quotes"},{"marks":1,"item":"Last index `${#arr[@]} - 1`"},{"marks":1,"item":"Swap through `tmp`: `arr[0]=${arr[last]}` then `arr[last]=$tmp`"},{"marks":1,"item":"Prints with `echo \"${arr[@]}\"`"}],"pitfalls":["`last=${#arr[@]}` is one past the end: `${arr[last]}` is empty.","`arr=($@)` unquoted splits `b c` into two elements.","Swapping without `tmp` (`arr[0]=${arr[last]}; arr[last]=${arr[0]}`) copies the same value into both places."],"core":true},{"id":"d5-w-03","topic":"d5-if","stage":"worked","marks":6,"prompt":"Write a script `safecreate.sh` that creates a new script file. It requires exactly one command line argument, the name of the file to create.\n\n- If the number of arguments is not exactly 1, print `safecreate.sh: filename required` to standard error and exit with status 2.\n- If a file with that name already exists, print `safecreate.sh: NAME already exists` to standard error (NAME is the argument) and exit with status 1, without changing the file.\n- Otherwise create the file containing the single line `#!/bin/bash` and give its owner execute permission.","starter":"","solution":"#!/bin/bash\n\n# safecreate.sh: create a new executable script, never overwrite\n\nif [[ $# -ne 1 ]]; then\n    echo \"safecreate.sh: filename required\" >&2\n    exit 2\nfi\n\nif [[ -e $1 ]]; then\n    echo \"safecreate.sh: $1 already exists\" >&2\n    exit 1\nfi\n\necho '#!/bin/bash' > \"$1\"\nchmod u+x \"$1\"","explain":"This is the course's `namedsh.sh`. Each error check is a **guard clause**: test for the problem, print to stderr, `exit`. Because `exit` stops the script, no `else` is needed and the creation code at the bottom only runs when both checks pass.\n\n1. `[[ $# -ne 1 ]]` (or `(( $# != 1 ))`) catches zero arguments and too many.\n2. `[[ -e $1 ]]` is true for *any* existing file, including a directory; `-f` would let the script try to overwrite a directory name.\n3. `echo '#!/bin/bash' > \"$1\"`: single quotes (as in the course's `namedsh.sh`) so nothing inside is special; `>` creates the file.\n4. `chmod u+x \"$1\"` adds execute for the owner only. Quote `\"$1\"` so names with spaces work.","rubric":[{"marks":1,"item":"Checks `$#` is exactly 1"},{"marks":1,"item":"Usage message to stderr and `exit 2`"},{"marks":1,"item":"Tests existence with `[[ -e $1 ]]`"},{"marks":1,"item":"Exists message (including the name) to stderr and `exit 1`"},{"marks":1,"item":"Creates the file with `#!/bin/bash` using `>` and quoted `\"$1\"`"},{"marks":1,"item":"`chmod u+x \"$1\"`"}],"pitfalls":["Forgetting `exit` after an error message, so the script carries on","Using `-f` instead of `-e` (a directory with that name would not be detected)","Unquoted `$1` in the `echo >` and `chmod` lines"],"core":true},{"id":"d5-w-62","topic":"d5-if","stage":"blank","marks":6,"prompt":"Write `checkcode.sh`, which checks whether its first command line argument is a valid course code such as `CISC220`. Extra arguments are ignored. With no arguments it prints `Usage: checkcode.sh code` to standard error and exits with status 1.\n\nA valid code: (1) contains no whitespace, (2) is exactly 7 characters long, (3) starts with 4 uppercase letters, (4) ends with 3 digits. Check the rules in this order; for **every** rule that fails, print its message to standard error:\n\n- `code cannot contain whitespace`\n- `code must be 7 characters long`\n- `code must start with 4 uppercase letters`\n- `code must end with 3 digits`\n\nIf any rule failed, exit with status 2. If all pass, print `CODE is valid` (CODE is the argument) to standard output and exit with status 0. Example: `./checkcode.sh cisc22` prints the last three messages and exits 2.","starter":"","solution":"#!/bin/bash\n\n# checkcode.sh: is the argument a valid course code like CISC220?\n\nif (( $# == 0 )); then\n    echo \"Usage: checkcode.sh code\" >&2\n    exit 1\nfi\n\ncode=$1\nstatus=0\n\nif [[ $code =~ [[:space:]] ]]; then\n    echo \"code cannot contain whitespace\" >&2\n    status=2\nfi\n\nif (( ${#code} != 7 )); then\n    echo \"code must be 7 characters long\" >&2\n    status=2\nfi\n\nif [[ ! $code =~ ^[[:upper:]]{4} ]]; then\n    echo \"code must start with 4 uppercase letters\" >&2\n    status=2\nfi\n\nif [[ ! $code =~ [[:digit:]]{3}$ ]]; then\n    echo \"code must end with 3 digits\" >&2\n    status=2\nfi\n\nif (( status == 0 )); then\n    echo \"$code is valid\"\nfi\nexit $status","explain":"The `testpw.sh` skeleton: usage check, `status=0`, one `if` per rule, then `exit $status`. Rule 3 needs the `^` anchor and rule 4 the `$` anchor; without them `xCISC220` or `CISC2201` would pass that rule. `[[:upper:]]{4}` means exactly four uppercase letters in a row. The length is arithmetic on `${#code}`. Only when `status` is still 0 does the script print the valid message.","rubric":[{"marks":1,"item":"Usage check `(( $# == 0 ))`: message to stderr, `exit 1`"},{"marks":1,"item":"Whitespace rule with `=~ [[:space:]]`"},{"marks":1,"item":"Length rule `(( ${#code} != 7 ))`"},{"marks":1,"item":"Start rule `! ... =~ ^[[:upper:]]{4}` (anchored, regex unquoted)"},{"marks":1,"item":"End rule `! ... =~ [[:digit:]]{3}$` (anchored)"},{"marks":1,"item":"Separate `if`s with messages to stderr, `status=2`, valid message only when all pass, `exit $status`"}],"pitfalls":["Using `elif` or `exit 2` inside a rule: only the first failure would be reported.","Quoting the regex (`=~ \"^[[:upper:]]{4}\"`) makes it a plain string.","Forgetting an anchor: without `$`, `[[:digit:]]{3}` is also true for `CISC220x`."],"core":true},{"id":"d6-w-20","topic":"d6-loops","stage":"worked","marks":4,"prompt":"Write `rev.sh`, which prints its command line arguments in **reverse order**, one per line. An argument that contains spaces must print as one line. With no arguments it prints nothing and exits with status 0. Store the arguments in an array and loop over it.\n\nExample: `./rev.sh a \"b c\" d` prints\n\n```\nd\nb c\na\n```","starter":"","solution":"#!/bin/bash\n\n# rev.sh ARG...   prints the arguments in reverse order, one per line\n\narr=(\"$@\")\nfor (( i = ${#arr[@]} - 1; i >= 0; i-- )); do\n    echo \"${arr[i]}\"\ndone","explain":"**Store.** `arr=(\"$@\")` (Day 5) copies the arguments into the array, one element per argument; the quotes keep `b c` as one element. The array is not sparse: its indexes are 0 to n-1, where n is `${#arr[@]}`.\n\n**Loop backwards.** A C-style loop starts at the last index, `${#arr[@]} - 1`, and counts down while `i >= 0`. Each pass prints one element with `echo \"${arr[i]}\"` (braces required; quotes keep the spaces exactly).\n\n**No arguments.** n is 0, so `i` starts at -1, `i >= 0` is false at once, and the body never runs. The script's status is that of the last command run, the loop, which is 0.\n\nTrace for `./rev.sh a \"b c\" d`: n = 3, so i = 2, 1, 0 prints `d`, `b c`, `a`.","rubric":[{"marks":1,"item":"Arguments stored with `arr=(\"$@\")` (quoted)"},{"marks":2,"item":"Loop from index `${#arr[@]} - 1` down to 0"},{"marks":1,"item":"Prints `\"${arr[i]}\"` (braces and quotes) one per line"}],"pitfalls":["Starting at `${#arr[@]}`: that index does not exist, so the first line printed is empty.","`arr=($@)` unquoted: `b c` becomes two elements.","`echo $arr[i]`: prints element 0 followed by the text `[i]`."],"core":true},{"id":"d6-w-05","topic":"d6-loops","stage":"blank","marks":8,"prompt":"*(Assignment 3 Q3.)* Write `checksubs.sh`. Its command line arguments are the names of files that every student directory should contain. For each immediate subdirectory of the current directory, if **any** of the expected files is missing from it or is not a regular file, print the subdirectory's name followed by `/` (for example `stu 3/`) to **standard error**, once per subdirectory. The script exits with status 1 if any subdirectory was reported, otherwise 0. With no arguments it prints nothing and exits with 0. Subdirectory names may contain spaces.\n\nExample: with subdirectories `stu1` (has `A1.sh`, `README`), `stu2` (has only `A1.sh`) and `stu 3` (has `README`, and `A1.sh` is a directory), `./checksubs.sh A1.sh README` prints `stu 3/` and `stu2/` to standard error and exits with 1.","starter":"","solution":"#!/bin/bash\n\n# checksubs.sh FILE...\n# prints (to stderr) the name of each subdirectory of the cwd that is missing\n# one of the FILEs as a regular file; exit status 1 if any were missing, else 0\n\nstatus=0\nfor d in */; do\n    [[ -d $d ]] || continue          # no subdirectories: */ did not match\n    for f in \"$@\"; do\n        if [[ ! -f $d$f ]]; then\n            echo \"$d\" >&2\n            status=1\n            break                    # report each directory only once\n        fi\n    done\ndone\nexit \"$status\"","explain":"The outer loop `for d in */` visits each subdirectory; the names already end with `/`, which is exactly what must be printed, and `$d$f` is the path of the expected file. The guard `[[ -d $d ]] || continue` handles a directory with no subdirectories (the literal `*/`). The inner loop `for f in \"$@\"` visits each expected file; with no arguments it runs zero times, so nothing is printed and the status stays 0. `-f` is true only for regular files, so a directory named `A1.sh` counts as missing. `break` stops checking that directory after its first problem so it is printed once. `>&2` sends the name to standard error. The variable `status` remembers whether anything was reported.","rubric":[{"marks":2,"item":"Outer loop over immediate subdirectories (`for d in */`)"},{"marks":1,"item":"Inner loop over `\"$@\"` (quoted)"},{"marks":1,"item":"Tests `-f` on `\"$d$f\"` (or `$d/$f`) correctly"},{"marks":1,"item":"Prints the directory name to standard error (`>&2`)"},{"marks":1,"item":"Prints each directory at most once (`break` or a flag)"},{"marks":2,"item":"Exit status 1 if any directory was reported, else 0 (including no arguments)"}],"pitfalls":["Testing `-e` instead of `-f` (a directory named like the file would pass).","Printing to standard output instead of standard error.","`for f in $@` unquoted, or unquoted `$d` in other commands: breaks on `stu 3`.","Calling `exit 1` at the first missing file, so later directories are never checked."],"core":true},{"id":"d6-w-01","topic":"d6-functions","stage":"worked","marks":10,"prompt":"*(Quiz 2, 2023, Q4, 10 marks.)* The **selection sort** algorithm sorts an array `arr` of `n` integers:\n\n```\nfor j = 0, 1, 2, ..., n-1\n    idx = minidx(j)\n    swap arr[j] and arr[idx]\n```\n\n`minidx(j)` finds the index of the minimum element of `arr` from index `j` to the end. For `arr` = `[0, 3, 1, 4, 2]`: `minidx(0)` is 0, `minidx(1)` is 2, `minidx(2)` is 2, `minidx(3)` is 4, `minidx(4)` is 4.\n\nComplete the script so that it sorts its command line arguments (always integers) with selection sort, using functions `sort` and `minidx`, and prints the sorted elements on a single line. The script already contains:\n\n```bash\narr=(\"$@\")\nsort\n```\n\nYou choose how to call `minidx` and how it returns its value. No error checking is required. (The quiz wrote `function sort {`; `sort() {` is the course style and equally correct.)","starter":"","solution":"#!/bin/bash\n\n# minidx START\n# sets the global variable idx to the index of the smallest\n# element of arr from index START to the end of arr\nminidx() {\n    local i\n    idx=$1\n    for (( i = $1 + 1; i < n; i++ )); do\n        if (( arr[i] < arr[idx] )); then\n            idx=$i\n        fi\n    done\n}\n\n# sort: selection sort of the global array arr\nsort() {\n    local j tmp\n    n=${#arr[@]}\n    for (( j = 0; j < n; j++ )); do\n        minidx \"$j\"\n        tmp=${arr[j]}\n        arr[j]=${arr[idx]}\n        arr[idx]=$tmp\n    done\n}\n\n# places the command line arguments into arr and calls sort\narr=(\"$@\")\nsort\n\n# print the sorted elements of arr on a single line\necho \"${arr[@]}\"","explain":"**Plan.** Two functions share the global array `arr` (dynamic scoping: every function sees the script's variables).\n\n**`sort`.** First compute `n=${#arr[@]}`, the number of elements; `minidx` will see `n` too because it is not `local`. The C-style loop runs `j` from 0 to n-1. Each pass calls `minidx \"$j\"` and then swaps `arr[j]` with `arr[idx]` using a temporary variable `tmp`. Without `tmp`, the first assignment would destroy a value we still need.\n\n**`minidx`.** Its argument `$1` is the start index. It assumes the smallest is at the start (`idx=$1`), then the loop checks every later index `i`; when `arr[i]` is smaller than the current best `arr[idx]`, it remembers `i`. Inside `(( ))` array elements can be written `arr[i]` without `$` or braces.\n\n**Returning the index.** `return` cannot be used: it only gives an exit status (0-255, and 0 means success). Instead `minidx` sets the **global variable `idx`**, like `max2` in `remax.sh`. The other correct way: `minidx` ends with `echo \"$idx\"` and `sort` writes `idx=$(minidx \"$j\")`.\n\n**`local`.** `i`, `j` and `tmp` are local so the two loops cannot overwrite each other's counters (the `some_function` bug from the notebook). If both functions used a global `i`, `minidx` would change `sort`'s loop variable.\n\n**Printing.** `echo \"${arr[@]}\"` prints all elements separated by single spaces on one line.\n\nTrace for `./sort.sh 0 3 1 4 2`: j=0 leaves 0 in place; j=1 swaps 3 with the 1 at index 2; j=2 swaps 3 with the 2 at index 4; j=3 and j=4 change nothing. Output `0 1 2 3 4`.","rubric":[{"marks":1,"item":"`n` is set to `${#arr[@]}` before it is used"},{"marks":2,"item":"`sort` loops `j` from 0 to n-1 (C-style `for (( ))` or equivalent)"},{"marks":1,"item":"`sort` calls `minidx` with `j` and obtains the index (global variable or `$( )`)"},{"marks":2,"item":"Correct swap of `arr[j]` and `arr[idx]` using a temporary variable"},{"marks":2,"item":"`minidx` starts at its argument and loops to the end comparing `arr[i]` with the current minimum"},{"marks":1,"item":"`minidx` makes the minimum index available to the caller (sets a global or echoes it; not `return`)"},{"marks":1,"item":"Prints the sorted array on one line with `echo \"${arr[@]}\"`"}],"pitfalls":["Using `return $idx` to hand back the index: it is an exit status, limited to 0-255, and a non-zero status means failure.","Using the same global loop variable `i` in both functions, so `minidx` breaks `sort`'s loop. Declare loop variables `local`.","Writing `$arr[i]` instead of `${arr[i]}` outside `(( ))`.","Swapping without a temporary variable (`arr[j]=${arr[idx]}; arr[idx]=${arr[j]}` copies the same value twice)."],"core":true},{"id":"d4-w-05","topic":"d4-arithmetic","stage":"faded","marks":5,"prompt":"Write `avg.sh A B` for two integers. If the script does not get **exactly** two arguments, it prints `Usage: avg.sh a b` to **standard error** and exits with status 1. Otherwise it prints one line, `average: Q remainder: R`, where `Q` and `R` are the quotient and remainder of `(A + B)` divided by 2. Example: `./avg.sh 7 4` prints `average: 5 remainder: 1`. Fill in the blanks.","starter":"#!/bin/bash\n\n# avg.sh: integer average of two numbers\n\nif (( ____ )); then\n    echo \"Usage: avg.sh a b\" ____\n    exit ____\nfi\n\nsum=____\necho \"average: ____ remainder: ____\"","solution":"#!/bin/bash\n\n# avg.sh: integer average of two numbers\n\nif (( $# != 2 )); then\n    echo \"Usage: avg.sh a b\" >&2\n    exit 1\nfi\n\nsum=$(( $1 + $2 ))\necho \"average: $(( sum / 2 )) remainder: $(( sum % 2 ))\"","explain":"`$#` is the number of arguments, and `(( $# != 2 ))` is true when it is not 2. `>&2` sends the usage message to standard error and `exit 1` stops the script. Arithmetic expansions can go straight inside the double-quoted message.","rubric":[{"marks":1,"item":"Tests `$#` against 2 with `(( $# != 2 ))` (or equivalent)"},{"marks":1,"item":"Usage message to standard error with `>&2`"},{"marks":1,"item":"`exit 1` on error"},{"marks":1,"item":"Sum computed with arithmetic expansion"},{"marks":1,"item":"Quotient with `/` and remainder with `%` printed in the exact format"}],"pitfalls":["`echo \"Usage...\"` without `>&2` goes to standard output.","`(( $# < 2 ))` lets 3 arguments through; the question says exactly two."]},{"id":"d5-w-04","topic":"d5-operators","stage":"faded","marks":6,"prompt":"Complete `grade.sh MARK`. If the number of arguments is not 1, print `Usage: grade.sh mark` to standard error and exit 1. If MARK is not made only of digits, or is greater than 100, print `grade.sh: mark must be an integer from 0 to 100` to standard error and exit 2. Otherwise print the letter grade: `A` for 80-100, `B` for 70-79, `C` for 60-69, `D` for 50-59, `F` below 50.","starter":"#!/bin/bash\n\n# grade.sh: convert a mark to a letter grade\n\nif (( ____ )); then\n    echo \"Usage: grade.sh mark\" >&2\n    exit 1\nfi\n\nmark=$1\nif [[ ! $mark =~ ____ ]] ____ (( mark > 100 )); then\n    echo \"grade.sh: mark must be an integer from 0 to 100\" >&2\n    exit 2\nfi\n\nif (( mark >= 80 )); then\n    echo A\n____ (( ____ )); then\n    echo B\nelif (( mark >= 60 )); then\n    echo C\nelif (( mark >= 50 )); then\n    echo D\n____\n    echo F\n____","solution":"#!/bin/bash\n\n# grade.sh: convert a mark to a letter grade\n\nif (( $# != 1 )); then\n    echo \"Usage: grade.sh mark\" >&2\n    exit 1\nfi\n\nmark=$1\nif [[ ! $mark =~ ^[0-9]+$ ]] || (( mark > 100 )); then\n    echo \"grade.sh: mark must be an integer from 0 to 100\" >&2\n    exit 2\nfi\n\nif (( mark >= 80 )); then\n    echo A\nelif (( mark >= 70 )); then\n    echo B\nelif (( mark >= 60 )); then\n    echo C\nelif (( mark >= 50 )); then\n    echo D\nelse\n    echo F\nfi","explain":"Blanks in order: `$# != 1`; `^[0-9]+$` (digits only, whole string); `||` (either problem is an error); `elif`; `mark >= 70`; `else`; `fi`.\n\nWhy `||` and not `&&`? The input is bad if it is not a number **or** it is too big. Short-circuiting also helps: when the regex test already fails, `(( mark > 100 ))` is not evaluated. Because the regex only allows digits, negative marks like `-5` are rejected too. The `elif` chain works top-down: by the time we test `mark >= 70`, we already know the mark is below 80.","rubric":[{"marks":1,"item":"`$# != 1` usage check (stderr, exit 1 already given)"},{"marks":1,"item":"Regex `^[0-9]+$` with `=~`, unquoted"},{"marks":1,"item":"`||` combining the two error conditions"},{"marks":2,"item":"`elif (( mark >= 70 )); then` correctly written"},{"marks":1,"item":"`else` and closing `fi`"}],"pitfalls":["Using `[[ $mark > 100 ]]`, a string comparison (\"99\" > \"100\" is true!)","Forgetting the anchors: `[0-9]+` alone accepts `7a`","Writing `else if` instead of `elif` (that needs its own `fi`)"]},{"id":"d5-w-08","topic":"d5-operators","stage":"blank","marks":5,"prompt":"Write a script `leap.sh` that takes one command line argument, a year. If the number of arguments is not 1, print `Usage: leap.sh year` to standard error and exit with status 1. If the argument is not made only of digits, print `leap.sh: YEAR is not a year` to standard error (YEAR is the argument) and exit with status 2. Otherwise print `YEAR is a leap year` or `YEAR is not a leap year`. A year is a leap year if it is divisible by 400, or if it is divisible by 4 and not divisible by 100.","starter":"","solution":"#!/bin/bash\n\n# leap.sh: is a year a leap year?\n\nif (( $# != 1 )); then\n    echo \"Usage: leap.sh year\" >&2\n    exit 1\nfi\n\nyr=$1\nif [[ ! $yr =~ ^[0-9]+$ ]]; then\n    echo \"leap.sh: $yr is not a year\" >&2\n    exit 2\nfi\n\nif (( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) )); then\n    echo \"$yr is a leap year\"\nelse\n    echo \"$yr is not a leap year\"\nfi","explain":"Two guard clauses, then the course's leap-year condition. `2000`: leap. `1900`: not leap. `2024`: leap.","rubric":[{"marks":1,"item":"Argument-count check with usage message to stderr, exit 1"},{"marks":1,"item":"Digits-only check `[[ ! $yr =~ ^[0-9]+$ ]]` with message to stderr, exit 2"},{"marks":2,"item":"Correct leap-year condition using `%`, `||`, `&&` (and parentheses)"},{"marks":1,"item":"Both output messages with the year, using if/else"}],"pitfalls":["Writing `yr % 4 == 0 || yr % 100 != 0 && ...` in the wrong grouping","Forgetting `exit` after an error message, so the script goes on to print a leap-year message too"]},{"id":"d5-w-01","topic":"d5-if","stage":"worked","marks":2,"prompt":"Suppose that the variable `d` stores the name of a file. Write a Bash `if` statement that prints the message `not a directory` **to standard error** if the file whose name is stored in `d` is not a directory.","starter":"","solution":"if [[ ! -d $d ]]; then echo \"not a directory\" >&2; fi","explain":"Read the question as three pieces. *If the file is not a directory*: the test is `-d`, negated with `!`, inside `[[ ]]` with spaces: `[[ ! -d $d ]]`. *Prints the message*: `echo \"not a directory\"`. *To standard error*: add `>&2`. On one line you need `;` before `then` and before `fi`. Inside `[[ ]]` no quotes are needed around `$d` (no word splitting there), but `[[ ! -d \"$d\" ]]` is also correct. Now cover the solution and write it again from memory, then do it for \"not executable\" (`-x`) and \"does not exist\" (`-e`).","rubric":[{"marks":1,"item":"Correct test `[[ ! -d $d ]]` (negation, -d, spaces inside the brackets)"},{"marks":1,"item":"Correct if syntax (`; then ... fi`) and `echo \"not a directory\" >&2`"}],"pitfalls":["Writing `[[! -d $d]]` without spaces","Forgetting `>&2` when the question says standard error","Testing `-f` (regular file) instead of `-d`"]},{"id":"d6-w-02","topic":"d6-loops","stage":"faded","marks":6,"prompt":"*(Assignment 3 Q2.)* Write `chext.sh`.\n\n- `./chext.sh EXT` renames every file in the current directory whose name ends in `.EXT` so that the `.EXT` is removed (`report.txt` becomes `report`).\n- `./chext.sh SRC DST` changes the extension `.SRC` to `.DST` (`report.txt` becomes `report.md` for `./chext.sh txt md`).\n\nUse `mv` to rename. If no file has the extension, the script must print nothing and exit with status 0. Filenames may contain spaces. Fill in the blanks.","starter":"#!/bin/bash\n\nfor f in ____; do\n    # skip the literal pattern when nothing matches\n    [[ ____ ]] || continue\n    base=____\n    if (( ____ == 1 )); then\n        mv ____\n    else\n        mv \"$f\" ____\n    fi\ndone\nexit 0","solution":"#!/bin/bash\n\n# chext.sh EXT        removes the extension .EXT from every file in the cwd ending in .EXT\n# chext.sh SRC DST    changes the extension .SRC to .DST\n\nfor f in *.\"$1\"; do\n    # if nothing matches, the glob stays as the literal text *.EXT: skip it\n    [[ -e $f ]] || continue\n    base=${f%.*}\n    if (( $# == 1 )); then\n        mv \"$f\" \"$base\"\n    else\n        mv \"$f\" \"$base.$2\"\n    fi\ndone\nexit 0","explain":"`*.\"$1\"` is a glob for names ending in `.` plus the first argument (quoting `$1` keeps any special characters literal; the `*` stays unquoted so it still matches). If nothing matches, `f` is the literal pattern, which does not exist, so `[[ -e $f ]] || continue` skips it and the script ends with status 0 without an error from `mv`. `${f%.*}` removes the shortest trailing `.something` (Day 4), giving the name without its extension; `${f%.\"$1\"}` also works. `$#` tells us whether a second argument was given. Every `$f` and `$base` is quoted because filenames can contain spaces.","rubric":[{"marks":1,"item":"`for f in *.\"$1\"` (glob built from the argument)"},{"marks":1,"item":"Handles the no-match case (`[[ -e $f ]] || continue` or `shopt -s nullglob`)"},{"marks":1,"item":"Removes the extension with `${f%.*}` or `${f%.\"$1\"}`"},{"marks":1,"item":"Chooses the behaviour with `$#` (or tests whether `$2` is empty)"},{"marks":1,"item":"Correct `mv` for both cases (`\"$base\"` and `\"$base.$2\"`)"},{"marks":1,"item":"All filenames quoted (works with spaces)"}],"pitfalls":["Forgetting the no-match case: `mv: cannot stat '*.pdf'` and a non-zero exit status.","`mv $f $base` unquoted: breaks on `my notes.txt`.","Using `${f%%.*}`, which removes everything after the **first** dot (`a.b.txt` would become `a`)."]},{"id":"d6-w-04","topic":"d6-loops","stage":"faded","marks":5,"prompt":"Write `average.sh FILE`. Each line of `FILE` has the form `name,mark` (the mark is an integer), except comment lines that start with `#`. The script prints `average: N` where N is the integer average of the marks (use integer division). If the file has no marks, print `no marks`. The filename may contain spaces. Example: for the file\n\n```\n# name,mark\nAda,90\nBob,75\nCy,81\n```\n\nit prints `average: 82`. Fill in the blanks.","starter":"#!/bin/bash\n\ntotal=0\ncount=0\nwhile IFS=____ read -r ____; do\n    if [[ $name =~ ____ ]]; then\n        ____\n    fi\n    (( total += mark ))\n    (( count++ ))\ndone < ____\nif (( count == 0 )); then\n    echo \"no marks\"\nelse\n    echo \"average: ____\"\nfi","solution":"#!/bin/bash\n\n# average.sh FILE\ntotal=0\ncount=0\nwhile IFS=\",\" read -r name mark; do\n    if [[ $name =~ ^# ]]; then\n        continue\n    fi\n    (( total += mark ))\n    (( count++ ))\ndone < \"$1\"\nif (( count == 0 )); then\n    echo \"no marks\"\nelse\n    echo \"average: $(( total / count ))\"\nfi","explain":"`while IFS=\",\" read -r name mark` reads one line per pass and splits it at the comma into `name` and `mark`. Comment lines are recognized with the regex `^#` and skipped with `continue`. The redirection `< \"$1\"` after `done` feeds the file to the loop (quoted, because the name may contain spaces). `$(( total / count ))` is integer division: 246 / 3 = 82. Checking `count == 0` first avoids a division by zero.","rubric":[{"marks":1,"item":"`while IFS=\",\" read -r name mark` (or equivalent splitting)"},{"marks":1,"item":"Skips lines starting with `#` (`=~ ^#` and `continue`)"},{"marks":1,"item":"Accumulates the total and the count with arithmetic"},{"marks":1,"item":"Redirects the quoted filename into the loop: `done < \"$1\"`"},{"marks":1,"item":"Prints `average: N` with integer division, or `no marks`"}],"pitfalls":["`done < $1` unquoted: fails for `my marks.txt`.","Putting `< \"$1\"` after `read` instead of after `done` (reads the first line forever).","Dividing before checking for zero marks."]},{"id":"d6-w-08","topic":"d6-loops","stage":"blank","marks":6,"prompt":"Write `extcount.sh EXT...`. For each command line argument `EXT`, in order, the script prints a line `EXT: N` where N is the number of names in the current directory that end in `.EXT`. Print `EXT: 0` when nothing matches. With no arguments the script prints nothing.\n\nExample: in a directory containing `a.txt`, `my notes.txt` and `b.md`, `./extcount.sh txt md pdf` prints\n\n```\ntxt: 2\nmd: 1\npdf: 0\n```","starter":"","solution":"#!/bin/bash\n\n# extcount.sh EXT...   for each EXT prints \"EXT: N\", N = number of names in the cwd ending in .EXT\n\nfor ext in \"$@\"; do\n    count=0\n    for f in *.\"$ext\"; do\n        if [[ -e $f ]]; then\n            (( count++ ))\n        fi\n    done\n    echo \"$ext: $count\"\ndone","explain":"The outer loop visits each argument with `\"$@\"`. For each one the counter is reset to 0, then the inner loop goes over the glob `*.\"$ext\"`. A glob that matches nothing stays as the literal pattern, so the body checks `[[ -e $f ]]` before counting; otherwise `pdf` would be counted as 1. `(( count++ ))` adds one. `my notes.txt` is counted once because glob results are never word-split.","rubric":[{"marks":1,"item":"Outer loop `for ext in \"$@\"`"},{"marks":1,"item":"Counter reset to 0 for each extension"},{"marks":1,"item":"Inner loop over the glob `*.\"$ext\"`"},{"marks":2,"item":"No-match case gives 0 (existence test or `nullglob`)"},{"marks":1,"item":"Prints `EXT: N` in the exact format"}],"pitfalls":["Forgetting to reset the counter, so counts accumulate across extensions.","Counting the literal pattern when nothing matches (prints `pdf: 1`).","Using `ls *.$ext | wc -l`: prints an error to standard error when nothing matches."]},{"id":"d6-w-03","topic":"d6-functions","stage":"faded","marks":8,"prompt":"*(Assignment 3 Q4.)* Write a file `funcs.sh` (no shebang; it is used with `source ./funcs.sh`) containing two functions.\n\n**`hasdups STR`**: find the first index `i` whose character appears again later in `STR`, and the first such later index `j`. Print `c:i = c:j` (where `c` is the character) and return 0. If no character repeats, print nothing and return 1. Examples: `hasdups abca` prints `a:0 = a:3`; `hasdups \"1 2 3\"` prints ` :1 =  :3` (the space repeats).\n\n**`indexof CH STR`**: print the index of the first `CH` in `STR` and return 0; if `CH` does not occur, print `-1` and return 1. Example: `indexof c abcabc` prints `2`.\n\nFill in the blanks.","starter":"hasdups() {\n    local s=$1\n    local n=____\n    local i j\n    for (( i = 0; i < n; i++ )); do\n        for (( j = ____; j < n; j++ )); do\n            if [[ ${s:i:1} == ____ ]]; then\n                echo \"____\"\n                return ____\n            fi\n        done\n    done\n    return ____\n}\n\nindexof() {\n    local ch=$1\n    local str=$2\n    local i\n    for (( i = 0; ____; i++ )); do\n        if [[ ____ == \"$ch\" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}","solution":"# funcs.sh -- a file of functions; use it with:  source ./funcs.sh\n\n# hasdups STR\n# prints \"c:i = c:j\" for the first character of STR that is repeated\n# (i is its first index, j the index of its next copy) and returns 0;\n# prints nothing and returns 1 if STR has no repeated characters\nhasdups() {\n    local s=$1\n    local n=${#s}\n    local i j\n    for (( i = 0; i < n; i++ )); do\n        for (( j = i + 1; j < n; j++ )); do\n            if [[ ${s:i:1} == \"${s:j:1}\" ]]; then\n                echo \"${s:i:1}:$i = ${s:j:1}:$j\"\n                return 0\n            fi\n        done\n    done\n    return 1\n}\n\n# indexof CH STR\n# prints the index of the first CH in STR and returns 0;\n# prints -1 and returns 1 if CH is not in STR\nindexof() {\n    local ch=$1\n    local str=$2\n    local i\n    for (( i = 0; i < ${#str}; i++ )); do\n        if [[ ${str:i:1} == \"$ch\" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}","explain":"`${#s}` is the string length and `${s:i:1}` is the single character at index `i`. For `hasdups`, the inner loop starts at `j = i + 1`, so each character is compared only with the characters **after** it; the first match found is exactly the required (first `i`, then first `j`). `return 0` inside the loops stops the function immediately (so only the first duplicate is printed); if the loops finish, there was no duplicate and the function returns 1.\n\nThe right-hand side of `==` inside `[[ ]]` is **quoted**: unquoted, it is a glob pattern, so a `*` character in the string would match anything. Quoted, it is compared literally.\n\nThe functions both **print** a result and **set** an exit status, so a caller can write `if hasdups \"$seq\"; then ...` or `i=$(indexof \"$c\" \"$seq\")`. All variables are `local` so the functions do not disturb the caller.","rubric":[{"marks":1,"item":"hasdups: outer loop over every index of the string using `${#s}`"},{"marks":1,"item":"hasdups: inner loop from `i + 1` to the end"},{"marks":1,"item":"Characters compared with `${s:i:1}` and `${s:j:1}` (right side quoted)"},{"marks":1,"item":"Prints `c:i = c:j` in the exact format"},{"marks":1,"item":"Returns 0 at the first duplicate, 1 when there is none"},{"marks":1,"item":"indexof: loop over the characters of `STR` comparing with `CH`"},{"marks":1,"item":"indexof: prints the index and returns 0 when found"},{"marks":1,"item":"indexof: prints -1 and returns 1 when not found; helper variables are local"}],"pitfalls":["Starting the inner loop at 0 (every character then matches itself).","Unquoted `${s:j:1}` on the right of `==`: a `*` in the string matches everything.","Using `exit` instead of `return`: the sourcing shell (or script) would end.","Printing every duplicate pair instead of returning after the first."]},{"id":"d6-w-06","topic":"d6-functions","stage":"blank","marks":6,"prompt":"Write `largest.sh INT...`, which prints `largest: N` where N is the largest of its (integer) command line arguments. The script must define a function `max` that **prints** the largest of the arguments it is given; the main script calls `max` with all of the script's arguments, captures its output with command substitution, and prints the message. With no arguments, print `Usage: largest.sh int...` to standard error and exit with status 1. No other error checking is needed.\n\nExample: `./largest.sh 3 9 -2 7` prints `largest: 9`.","starter":"","solution":"#!/bin/bash\n\n# largest.sh INT...   prints the largest integer argument\n\n# max INT... : prints the largest of its arguments\nmax() {\n    local hi=$1\n    local x\n    for x in \"$@\"; do\n        if (( x > hi )); then\n            hi=$x\n        fi\n    done\n    echo \"$hi\"\n}\n\nif (( $# == 0 )); then\n    echo \"Usage: largest.sh int...\" >&2\n    exit 1\nfi\nresult=$(max \"$@\")\necho \"largest: $result\"","explain":"`max` keeps the largest value seen so far in a local variable `hi`, starting with its first argument, and loops over all its arguments with `for x in \"$@\"`, comparing numerically with `(( ))`. It **prints** the result; the caller captures it with `result=$(max \"$@\")`. Passing `\"$@\"` is necessary: inside `max`, `$1`, `$@` are `max`'s own arguments, not the script's. The usage check comes first, using `$#` and `>&2`.","rubric":[{"marks":1,"item":"Usage message to standard error and `exit 1` when `$# == 0`"},{"marks":1,"item":"Function `max` defined with correct syntax before it is called"},{"marks":2,"item":"`max` loops over its arguments and keeps the largest (numeric comparison with `(( ))`)"},{"marks":1,"item":"`max` prints the result"},{"marks":1,"item":"Main script calls `max \"$@\"` with command substitution and prints `largest: N`"}],"pitfalls":["Calling `max` with no arguments and expecting it to see the script's `$1`.","Comparing with `[[ $x > $hi ]]`, which compares strings, not numbers (`9 > 10` would be true).","`return $hi` instead of `echo`: statuses are limited to 0-255 and negative numbers fail."]},{"id":"d6-w-21","topic":"d6-functions","stage":"blank","marks":10,"prompt":"*(Assignment 3 Q5.)* Write `tr220.sh SEQ1 SEQ2 STR`, a small version of `tr`. The file `funcs.sh` from the exercise above (Assignment 3 calls it `Q4.sh`) is in the current directory; your script must `source` it and use its functions `hasdups` and `indexof`.\n\n1. If the number of arguments is not 3, print `Usage: tr220.sh seq1 seq2 str` to standard error and exit with status 1.\n2. If SEQ1 is longer than SEQ2, print `tr220.sh: seq1 length > seq2 length` to standard error and exit with status 2.\n3. If SEQ1 has a repeated character, print `tr220.sh: seq1 has duplicated characters` to standard error and exit with status 3 (print nothing else).\n4. Otherwise print STR with each character that occurs in SEQ1 at index *i* replaced by the character of SEQ2 at index *i*; other characters are unchanged.\n\nExamples: `./tr220.sh emu opo mutate` prints `potato`; `./tr220.sh CIS cis CISC220` prints `cisc220`.","starter":"","solution":"#!/bin/bash\n\n# tr220.sh SEQ1 SEQ2 STR   translates the characters of STR that are in SEQ1\n# into the characters at the same index in SEQ2\n\nsource ./funcs.sh            # defines hasdups and indexof\n\nif (( $# != 3 )); then\n    echo \"Usage: tr220.sh seq1 seq2 str\" >&2\n    exit 1\nfi\nseq1=$1\nseq2=$2\nstr=$3\nif (( ${#seq1} > ${#seq2} )); then\n    echo \"tr220.sh: seq1 length > seq2 length\" >&2\n    exit 2\nfi\nif hasdups \"$seq1\" > /dev/null; then\n    echo \"tr220.sh: seq1 has duplicated characters\" >&2\n    exit 3\nfi\n\nresult=\"\"\nfor (( k = 0; k < ${#str}; k++ )); do\n    c=${str:k:1}\n    if i=$(indexof \"$c\" \"$seq1\"); then\n        result=$result${seq2:i:1}\n    else\n        result=$result$c\n    fi\ndone\necho \"$result\"","explain":"`source ./funcs.sh` defines the two functions in the script's own shell. The checks come in the required order, each printing to standard error with `>&2` and exiting with its own status. `hasdups` prints the duplicate it finds, so its output goes to `/dev/null`; only its exit status (0 = has a duplicate) matters to `if`. The loop visits each character of `str` with `${str:k:1}`. `i=$(indexof \"$c\" \"$seq1\")` captures the printed index, and the assignment's status is `indexof`'s status, so the `if` knows whether `c` was found. Strings are built by writing values side by side (Day 4). Another correct way: `i=$(indexof \"$c\" \"$seq1\")` then `if (( i >= 0 ))`.","rubric":[{"marks":1,"item":"Sources `./funcs.sh`"},{"marks":1,"item":"Usage message to standard error and exit 1 when `$# != 3`"},{"marks":1,"item":"Length check with `${#seq1}` and `${#seq2}`, message to standard error, exit 2"},{"marks":2,"item":"Uses `hasdups \"$seq1\"` as a condition (its output hidden), message to standard error, exit 3"},{"marks":2,"item":"Loops over every character of STR with `${str:k:1}`"},{"marks":2,"item":"Uses `indexof` to find the character and `${seq2:i:1}` to translate it; others unchanged"},{"marks":1,"item":"Prints the translated string once, on one line"}],"pitfalls":["Using `i` as the loop counter and also for `indexof`'s result.","Letting `hasdups` print its `c:i = c:j` line to standard output.","Testing `(( $# < 3 ))`: four arguments must also print the usage message.","Running `./funcs.sh` instead of `source ./funcs.sh`: the functions are not defined in the script."]}]}],"mocks":{"exams":[{"id":"mockA","title":"Mock midterm A","minutes":50,"instructions":"This mock is **50 minutes** long. There are **5 questions** worth a total of **30 marks**. No aids are allowed. Write every answer by hand on paper first, then mark it with the rubric.\n\n- Short answers should be very brief (usually one command).\n- In scripts, double quote your variable expansions (`\"$var\"`): markers take marks off for missing quotes.\n- Error checking is required only where the question asks for it.\n- Afterwards, type your answers into the Day 7 drills (`./drill.sh start 7`) to test them.","questions":[{"id":"mockA-1","title":"Question 1","marks":6,"prompt":"**1 mark each, 6 marks total.** Consider a filesystem with the directory structure shown below (`trip` is a directory; `.draft` is a hidden file). Your answer to each part should be very brief.\n\n```text\n/\n└── home\n    └── user1\n        ├── grades.csv\n        ├── notes\n        │   ├── .draft\n        │   ├── lec01.txt\n        │   ├── lec02.txt\n        │   └── todo.md\n        ├── photos\n        │   ├── img1.jpg\n        │   ├── img2.JPG\n        │   ├── logo.png\n        │   └── trip\n        └── scripts\n            ├── backup.sh\n            ├── run.sh\n            └── tidy.sh\n```","parts":[{"id":"mockA-1a","label":"A","marks":1,"prompt":"What is the absolute pathname of the file `backup.sh`?","solution":"`/home/user1/scripts/backup.sh`","rubric":[{"marks":1,"item":"Starts at the root `/` and names every directory in order; no `.` or `..`"}],"topics":["paths"]},{"id":"mockA-1b","label":"B","marks":1,"prompt":"Suppose that the current working directory is `photos`. What is the relative pathname of the file `lec02.txt`?","solution":"`../notes/lec02.txt`","rubric":[{"marks":1,"item":"Goes up with `..` to `user1` and then down into `notes`; must not start with `/`"}],"topics":["paths"]},{"id":"mockA-1c","label":"C","marks":1,"prompt":"Suppose that the current working directory is `trip`. What single command would you use to change the current working directory to `notes` using a **relative** pathname?","solution":"```bash\ncd ../../notes\n```\n\n`trip` → `..` is `photos` → `../..` is `user1` → then into `notes`.","rubric":[{"marks":1,"item
