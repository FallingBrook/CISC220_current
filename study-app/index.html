ass by class: user goes from `r--` to `rw-` (add w), group and other go from `---` to `r--` (add r). So `u+w,go+r`, with a comma and no spaces. The two globs pick up both spellings of the extension; `*.[pP][dD][fF]` also works, as does `u=rw,go=r` (Assignment 1 Q15).\n\n**(c)** `u=rwx` sets the owner to exactly rwx, and `go=` with nothing after the `=` clears group and other. `chmod 700 private` is the octal equivalent (Quiz 1 Q5 step 3).\n\n**(d)** `stat -c %a` prints the octal mode. After part (a) it prints `750`.","rubric":[{"marks":1,"item":"(a) `chmod 750 hello.sh`"},{"marks":1,"item":"(b) symbolic mode adding w for user and r for group/other, applied to both `.pdf` and `.PDF`"},{"marks":1,"item":"(c) `chmod u=rwx,go= private` or `chmod 700 private`"},{"marks":1,"item":"(d) `stat -c %a hello.sh`"}],"pitfalls":["`chmod u=rwx private` alone leaves the group and other permissions as `r-x`.","No spaces inside a symbolic mode: `u+w, go+r` is an error.","Using only `*.pdf` misses `SLIDES.PDF`."]},{"id":"d2-w-03","topic":"d2-files","stage":"faded","marks":5,"prompt":"The current directory is `CISC220_A1`:\n\n```\nCISC220_A1/\n├── A2.PDF\n├── a1.pdf\n├── classlist\n├── lectures/\n│   ├── intro.txt\n│   └── week1/\n│       └── globs.txt\n└── tmp.sh\n```\n\nFill in the blanks so that each line is a single command that:\n\n(a) copies the directory `lectures` and all its contents to a new directory `lectures_copy`;\n\n(b) creates three directories named `notes`, `images` and `scripts`;\n\n(c) moves all the PDF files (`.pdf` or `.PDF`) into `notes`;\n\n(d) removes the file `tmp.sh`;\n\n(e) creates the directory `archive/2026/fall` (none of these directories exist yet).","starter":"# (a)\ncp ____ lectures lectures_copy\n# (b)\nmkdir ____\n# (c)\nmv ____ notes\n# (d)\n____ tmp.sh\n# (e)\nmkdir ____ archive/2026/fall","solution":"# (a)\ncp -r lectures lectures_copy\n# (b)\nmkdir notes images scripts\n# (c)\nmv *.pdf *.PDF notes\n# (d)\nrm tmp.sh\n# (e)\nmkdir -p archive/2026/fall","explain":"(a) needs `-r` because `lectures` is a directory. (b) `mkdir` accepts several names. (c) when `mv` gets several files, the last argument is the destination directory; `*.[pP][dD][fF]` also works. (e) `-p` creates the missing parents `archive` and `archive/2026`.","rubric":[{"marks":1,"item":"(a) `-r`"},{"marks":1,"item":"(b) all three names"},{"marks":1,"item":"(c) both `.pdf` and `.PDF` files moved"},{"marks":1,"item":"(d) `rm`"},{"marks":1,"item":"(e) `-p`"}],"pitfalls":["`rmdir tmp.sh` does not work on a file.","Part (c) must run after part (b), or `notes` does not exist and `mv` would fail (or rename a single file)."]},{"id":"d2-w-04","topic":"d2-quoting","stage":"faded","marks":4,"prompt":"The current directory is `photos`:\n\n```\nphotos/\n├── .index\n├── .thumbs/\n├── Beach Day.jpg\n├── IMG_001.JPG\n├── IMG_002.jpg\n├── img_3.png\n└── read me.txt\n```\n\nFill in the blanks so that each line is a single command that:\n\n(a) prints the contents of `read me.txt`;\n\n(b) renames `Beach Day.jpg` to `beach_day.jpg`;\n\n(c) lists every file ending in `.jpg` in any mix of upper and lower case;\n\n(d) lists the names of the hidden entries only (not `.` and `..`), without listing the contents of the hidden directory.","starter":"# (a)\ncat ____\n# (b)\nmv ____ beach_day.jpg\n# (c)\nls *.____\n# (d)\nls -d .____","solution":"# (a)\ncat \"read me.txt\"\n# (b)\nmv \"Beach Day.jpg\" beach_day.jpg\n# (c)\nls *.[jJ][pP][gG]\n# (d)\nls -d .[!.]*","explain":"(a) and (b): the names contain a space, so they must be quoted (or the space escaped with `\\`). (c) each bracket set matches one character in either case. (d) the pattern starts with a literal `.`, so it can match hidden names; `[!.]` keeps out `.` and `..`; `-d` stops `ls` from listing what is inside `.thumbs`. The result is `.index  .thumbs`.","rubric":[{"marks":1,"item":"(a) name quoted or escaped"},{"marks":1,"item":"(b) old name quoted or escaped"},{"marks":1,"item":"(c) `[jJ][pP][gG]`"},{"marks":1,"item":"(d) `[!.]*` (or an equivalent such as `??*`)"}],"pitfalls":["Quoting the glob (`ls \"*.jpg\"`) stops it from expanding.","`ls -a` would also list `.`, `..` and every non-hidden file."]},{"id":"d2-w-05","topic":"d2-globs","stage":"blank","marks":6,"prompt":"The current directory is `course`:\n\n```\ncourse/\n├── handouts/\n│   ├── .draft.pdf\n│   ├── L01.pdf\n│   └── L02.PDF\n├── students/\n│   ├── Ann Lee/\n│   │   ├── .submitted\n│   │   └── lab1.c\n│   ├── Cy_Young/\n│   │   ├── .submitted\n│   │   ├── lab1.c\n│   │   └── lab2.c\n│   └── bob_ray/\n│       └── lab1.c\n└── todo.txt\n```\n\nWrite a **single command** for each part. Unless stated otherwise, the current directory is `course`. Do not use `cd`.\n\n(a) List all the files in `handouts`, including hidden files.\n\n(b) List every `.submitted` file in the student directories.\n\n(c) List every file in the student directories whose name is `lab`, then one digit, then `.c`.\n\n(d) Copy all the non-hidden PDF files in `handouts` (`.pdf` or `.PDF`) into the existing directory `students`.\n\n(e) The current directory is `students`. Rename the directory `Ann Lee` to `ann_lee`.\n\n(f) Remove the file `todo.txt` and the directory `handouts` with everything in it.","starter":"","solution":"# (a)\nls -a handouts\n# (b)\nls students/*/.submitted\n# (c)\nls students/*/lab[0-9].c\n# (d)\ncp handouts/*.[pP][dD][fF] students\n# (e)  (current directory: students)\nmv \"Ann Lee\" ann_lee\n# (f)\nrm -r todo.txt handouts","explain":"","rubric":[{"marks":1,"item":"(a) `ls -a handouts`"},{"marks":1,"item":"(b) `students/*/.submitted` with the dot written literally"},{"marks":1,"item":"(c) `[0-9]` for exactly one digit"},{"marks":1,"item":"(d) both cases of the extension, destination last"},{"marks":1,"item":"(e) the old name quoted or escaped"},{"marks":1,"item":"(f) `-r` for the directory (one command; `rm todo.txt; rm -r handouts` on one line is also accepted)"}],"pitfalls":["`students/*/*.submitted` is wrong: `*` cannot match the leading dot of a hidden name.","`lab?.c` would also match a name like `labX.c`; the question asks for a digit."]},{"id":"d2-w-06","topic":"d2-permissions","stage":"blank","marks":5,"prompt":"The current directory contains:\n\n```\n$ ls -l\n-rwxr-xr-x 1 user1 cisc220  210 Sep 15 10:00 build.sh\n-rw-rw-r-- 1 user1 cisc220 1830 Sep 15 10:00 data.csv\n-rw-r--r-- 1 user1 cisc220  512 Sep 15 10:00 notes.txt\ndrwxr-x--- 2 user1 cisc220 4096 Sep 15 10:00 shared\n-rw-r--r-- 1 user1 cisc220  640 Sep 15 10:00 todo.txt\n```\n\n(a) What are the octal permissions of `build.sh` and of `data.csv`?\n\n(b) Can a member of the group `cisc220` (who is not `user1`) create a new file inside `shared`? Explain in one sentence.\n\n(c) Write a single command, using a **symbolic** mode, that removes write permission for the group and others from `data.csv` and leaves every other permission unchanged.\n\n(d) Write a single command, using an **octal** mode, that sets every file ending in `.txt` to `rw-r-----`.\n\n(e) Write a single command that prints the permissions of `data.csv` as an octal number.","starter":"","solution":"# (a)\n# build.sh: 755    data.csv: 664\n# (b)\n# No: the group permissions on shared are r-x, and creating a file needs w on the directory.\n# (c)\nchmod go-w data.csv\n# (d)\nchmod 640 *.txt\n# (e)\nstat -c %a data.csv","explain":"","rubric":[{"marks":1,"item":"(a) 755 and 664"},{"marks":1,"item":"(b) no, because the group lacks `w` on the directory"},{"marks":1,"item":"(c) `chmod go-w data.csv` (`chmod g-w,o-w data.csv` also fine)"},{"marks":1,"item":"(d) `chmod 640 *.txt`"},{"marks":1,"item":"(e) `stat -c %a data.csv`"}],"pitfalls":["`chmod go=r data.csv` would be wrong if other permissions existed; here it happens to give the same result, but `-` is what the question asks for.","Read the permission string in groups of three: `rw-rw-r--` is 6, 6, 4."]}]},{"day":3,"title":"Crash day 1: streams, scripts, variables, strings and regex","goal":"Redirect and pipe output, write and run scripts that use $1, $# and \"$@\", take strings apart with parameter expansion, and write regular expressions.","topics":[{"id":"d3-streams","title":"Streams, redirection, pipelines and tees","notebook":"bash/streams.ipynb","priority":"high","examNote":"Quiz 1 Q2D: *overwrite myfile with OOPS using a redirection* (`echo OOPS > myfile`). Quiz 1 Q3B (2 marks): a single pipeline with `cut`, `sort`, `tee` and `head` built from an English description. Expect fd numbers, `2>&1` order and `/dev/null` as short answers. Assignment 3 requires error messages on **standard error** (`>&2`, introduced here); you will write those messages in scripts on Day 5.","blocks":[{"type":"md","text":"### Everything is a stream of bytes\n\nA **byte stream** is an ordered sequence of bytes (characters). Programs read data from streams and write data to streams. Every command you run starts with **three standard streams** already connected for it:\n\n| Stream | Short name | File descriptor | Connected by default to |\n|---|---|---|---|\n| standard input | stdin | `0` | the keyboard |\n| standard output | stdout | `1` | the terminal |\n| standard error | stderr | `2` | the terminal |\n\nA **file descriptor** is just a small integer that names an open stream. Memorize the three numbers: **0 = stdin, 1 = stdout, 2 = stderr**. You will use them in redirections.\n\nNormal results go to **stdout**. Error and diagnostic messages go to **stderr**. Because both stdout and stderr are connected to the terminal by default, they *look* the same on screen, but they are two separate streams that you can send to different places."},{"type":"code","code":"$ ls classlist zzz\nls: cannot access 'zzz': No such file or directory\nclasslist","caption":"The error line was written to stderr (fd 2); the line classlist was written to stdout (fd 1). Both appear on the terminal."},{"type":"md","text":"Some commands read **standard input** when you do not give them a file name. If you type `sort` and press Enter, `sort` waits for you to type lines on the keyboard. You signal the end of input by pressing **Ctrl + D** at the start of a line; then `sort` prints the lines in sorted order. (Ctrl + C would instead stop `sort` without printing anything.)"},{"type":"try","text":"Type `sort` and press Enter. Type `zebra`, `elephant`, `anteater` and `dog`, pressing Enter after each. Then press **Ctrl + D**. The four words come back in alphabetical order."},{"type":"check","q":"What are the file descriptor numbers of stdin, stdout and stderr?","a":"stdin is 0, stdout is 1, stderr is 2."},{"type":"md","text":"### Redirecting standard output: `>` and `>>`\n\n**Redirection** changes where a command reads its input from or sends its output to. To send standard output to a file, write `1> filename` (or just `> filename`; the `1` is optional) anywhere in the command:\n\n- `>` **creates** the file if it does not exist, and **overwrites** (truncates) it if it does.\n- `>>` **appends** to the end of the file instead of overwriting it (it also creates the file if needed).\n\nThe command itself does not know about the file. The shell opens the file and connects it to fd 1 *before* the command runs. Anything the command would have printed on stdout goes into the file instead, so nothing appears on the terminal."},{"type":"code","code":"$ echo OOPS > myfile\n$ cat myfile\nOOPS\n$ echo again >> myfile\n$ cat myfile\nOOPS\nagain\n$ echo new > myfile\n$ cat myfile\nnew","caption":"Quiz 1 asked: what command overwrites myfile with the string OOPS? Answer: echo OOPS > myfile"},{"type":"try","text":"In your practice folder, run `echo OOPS > myfile`, then `cat myfile`. Run `echo again >> myfile` and `cat myfile` again: two lines. Now run `echo new > myfile` and `cat myfile`: only `new` is left."},{"type":"code","code":"$ ls -A 1> files.txt\n$ ls -A > files.txt","caption":"These two commands do the same thing: for stdout the 1 is optional."},{"type":"check","q":"What is the difference between `echo hi > f` and `echo hi >> f` when `f` already contains one line?","a":"`>` overwrites: afterwards `f` contains only `hi`. `>>` appends: afterwards `f` contains its old line followed by `hi`."},{"type":"pitfall","text":"`sort data > data` does **not** sort the file in place. The shell truncates `data` to empty *before* `sort` starts, so `sort` reads an empty file and `data` ends up empty. Write to a different file instead: `sort data > sorted`."},{"type":"md","text":"### Redirecting standard error: `2>`\n\nTo redirect standard error you **must** write the file descriptor `2`: `2> filename`. Then only the error messages go to the file; normal output still goes to the terminal.\n\nYou can redirect both streams of one command to **separate** files:"},{"type":"code","code":"$ ls -A zzz file?? > files.txt 2> error.txt\n$ cat files.txt\nfile00\nfile01\n$ cat error.txt\nls: cannot access 'zzz': No such file or directory","caption":"Directory contains file00 and file01. Many commands keep going after an error, so ls still lists the files it can."},{"type":"md","text":"**`/dev/null`** is the *null device*: a special file that discards everything written to it (and reports that the write succeeded). Use it to throw output away, most often error messages:\n\n```bash\nls classlist zzz 2> /dev/null      # error message discarded, classlist still printed\n```"},{"type":"check","q":"Write a command that runs `ls zzz` and stores the error message in a file named `err.txt`.","a":"`ls zzz 2> err.txt`"},{"type":"md","text":"### Both streams to one file: `> file 2>&1`\n\nTo send **all** output (stdout and stderr) to the same file, redirect stdout to the file and then add `2>&1`:\n\n```bash\nls -A zzz file?? > all.txt 2>&1\n```\n\n`2>&1` means: *make file descriptor 2 a duplicate (copy) of file descriptor 1*, that is, send stderr to wherever stdout points **right now**.\n\nThe shell processes redirections **from left to right**, so order matters:\n\n1. `> all.txt 2>&1`: first fd 1 points to `all.txt`; then fd 2 is copied from fd 1, so it also points to `all.txt`. Everything goes to the file.\n2. `2>&1 > all.txt`: first fd 2 is copied from fd 1, which is still the **terminal**; then fd 1 is changed to `all.txt`. Errors still appear on the terminal and only normal output goes to the file.\n\nBash also has the shorthand `&> file`, which means the same as `> file 2>&1`. The course notebooks use the `> file 2>&1` form, so make sure you can write that one."},{"type":"code","code":"$ ls -A zzz file?? 2>&1 > all.txt\nls: cannot access 'zzz': No such file or directory\n$ cat all.txt\nfile00\nfile01","caption":"Wrong order: the error still reaches the terminal."},{"type":"why","q":"Why does `2>&1 > all.txt` not send errors into all.txt?","a":"Redirections are done left to right. When `2>&1` runs, fd 1 still points at the terminal, so fd 2 becomes a copy of *the terminal*. Changing fd 1 afterwards does not change fd 2; the copy was already made."},{"type":"check","q":"Write a command that sends both the output and the errors of `ls a b` into `log.txt`.","a":"`ls a b > log.txt 2>&1` (or `ls a b &> log.txt`)."},{"type":"md","text":"### The other direction: `>&2`\n\n`2>&1` sends standard error to wherever standard output goes. The reverse, `1>&2`, is usually written **`>&2`** (the `1` is optional, as always for stdout). It makes standard output a copy of standard error, so whatever the command prints goes to **stderr** instead of stdout:\n\n```bash\necho \"Something went wrong\" >&2\n```\n\nOn the screen this looks exactly like a normal `echo`. The difference shows when stdout is redirected or piped: the message still reaches the terminal, because it was never on stdout. Scripts use this to print their **error messages** (you will write such messages in scripts on Day 5)."},{"type":"code","code":"$ echo hello >&2 > out.txt\n$ cat out.txt\nhello","caption":"Left to right again: >&2 sends stdout to the terminal's stderr, then > out.txt changes stdout to the file. The later redirection wins, so hello goes into out.txt."},{"type":"md","text":"### Redirecting standard input: `<`\n\n`0< filename` (or just `< filename`) makes the command read **standard input from the file** instead of the keyboard.\n\nThe examples from here on use a file named `classlist`: four students, one per line (it is shown in full a little further down). They also use **`wc -l`**: `wc` means *word count*, and with `-l` it counts **lines**. `wc -l FILE` prints the number of lines followed by the file name.\n\nMost filter commands also accept a file name argument, so `sort unsorted.txt` and `sort < unsorted.txt` print the same thing. The difference shows up with commands that print the file name: `wc -l classlist` prints `4 classlist`, but `wc -l < classlist` prints just `4`, because `wc` reads stdin and never sees a file name.\n\nYou can combine input and output redirection: `sort < unsorted.txt > sorted.txt`."},{"type":"code","code":"$ sort < unsorted.txt > sorted.txt\n$ cat sorted.txt\nanteater\ndog\nelephant\nzebra\n$ wc -l classlist\n4 classlist\n$ wc -l < classlist\n4","caption":"unsorted.txt contains zebra, elephant, anteater, dog (one per line); classlist has 4 lines."},{"type":"check","q":"Why does `wc -l < classlist` print only a number while `wc -l classlist` also prints the name?","a":"With `<` the shell opens the file and connects it to stdin; `wc` only sees an anonymous stream, so it has no file name to print."},{"type":"md","text":"### Pipelines: `|`\n\nA **pipe** `|` connects the **standard output** of the command on its left to the **standard input** of the command on its right. A **pipeline** is a chain of commands joined by pipes. Think of each command as a segment of pipe: data flows in one end, gets changed, and flows out the other end.\n\n```bash\nls /bin /usr/bin | sort | uniq | wc -l\n```\n\nOnly **stdout** goes through a pipe. Error messages on stderr still go to the terminal (unless you redirect them).\n\nThe commands that sit in the middle of pipelines are called **filters**: they read stdin (or files named as arguments), transform the lines, and write stdout. These are the ones you need:\n\n| Command | What it does |\n|---|---|\n| `sort` | sorts lines (alphabetically by default) |\n| `sort -n` | sorts numerically (so `9` comes before `10`) |\n| `sort -r` | reverse order; `sort -n -r` (or `-nr`) is largest number first |\n| `uniq` | removes **adjacent** duplicate lines (so `sort` first!) |\n| `uniq -d` | prints only lines that are duplicated (one copy each) |\n| `wc -l` | counts lines |\n| `head -n 3` | first 3 lines (`head -n3` also works) |\n| `tail -n 3` | last 3 lines |\n| `cut -f 3` | 3rd field of each line; fields are separated by **TAB** by default |\n| `cut -d\" \" -f 1` | 1st field, using a space as the delimiter (`-d` = `--delimiter`, `-f` = `--fields`) |\n\n`cut -f1,3` selects several fields, and `cut -f2 -d:` uses `:` as the delimiter (options can come in either order)."},{"type":"code","code":"$ cat classlist\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n$ cut -f3 classlist\n3100025\n2999999\n3001111\n1990000\n$ cut -f3 classlist | sort\n1990000\n2999999\n3001111\n3100025\n$ cut -f3 classlist | sort -r | head -n1\n3100025","caption":"classlist fields are separated by single TAB characters."},{"type":"check","q":"Why must you usually `sort` before `uniq`?","a":"`uniq` only removes duplicates that are **next to each other**. Sorting puts identical lines together so `uniq` can find them all."},{"type":"md","text":"The next examples need a few lines of numbers. **`printf`** is a printing command like `echo`, but it does not add a newline by itself: you write `\\n` wherever you want a line break. So `printf '10\\n9\\n100\\n'` prints the three lines `10`, `9` and `100`. It is a handy way to feed test lines into a pipeline."},{"type":"code","code":"$ printf '10\\n9\\n100\\n' | sort\n10\n100\n9\n$ printf '10\\n9\\n100\\n' | sort -n\n9\n10\n100","caption":"Plain sort compares character by character (1 < 9), so 100 comes before 9. Use -n for numbers."},{"type":"pitfall","text":"`sort` without `-n` sorts numbers as text: `100` comes before `9`. Student numbers that all have the same number of digits sort correctly either way, but marks like 9, 72, 100 need `sort -n`."},{"type":"md","text":"### Tees: save *and* pass along\n\nRedirection sends output to a file; a pipe sends it to another command. To do **both**, use `tee`. The `tee` command reads standard input and copies it to **standard output and to one or more files**. Like the letter T in plumbing, the data continues down the pipeline while a copy is saved.\n\nBecause `tee` is an ordinary command, you can put it anywhere in a pipeline to save an intermediate result:\n\n```bash\ndate | tee fulldate.txt | cut -d\" \" -f1\nfortune | tee fortune.txt | cowsay | tee cow.txt | cowsay -n\n```\n\n### Building a pipeline from an English description\n\nQuiz 1 asked: *extract the student numbers from `classlist`, sort them ascending, save all of them to a file `snum` (in sorted order), and print the first three.* Translate each phrase into one command, in order:\n\n1. extract the student numbers: `cut -f3 classlist`\n2. sort ascending: `sort`\n3. save all of them (sorted) and keep going: `tee snum`\n4. print only the first three: `head -n3`"},{"type":"code","code":"$ cut -f3 classlist | sort | tee snum | head -n3\n1990000\n2999999\n3001111\n$ cat snum\n1990000\n2999999\n3001111\n3100025","caption":"The tee must come AFTER sort (the file must be sorted) and BEFORE head (the file must contain all the numbers)."},{"type":"try","text":"Make the class list yourself: `printf 'Cade\\tBarry\\t3100025\\nDay\\tHolly\\t2999999\\nFriese\\tAndy\\t3001111\\nYu\\tSue\\t1990000\\n' > classlist` (`\\t` is a TAB). Then run `cut -f3 classlist | sort | tee snum | head -n3` and `cat snum`."},{"type":"why","q":"Why would `cut -f3 classlist | sort | head -n3 | tee snum` lose marks?","a":"`tee` would only see the three lines that `head` let through, so `snum` would contain three numbers instead of all of them."},{"type":"check","q":"Write a pipeline that prints how many lines in `words.txt` are different (count of distinct lines).","a":"`sort words.txt | uniq | wc -l`"},{"type":"md","text":"### Key points\n\n- fd **0** = stdin, **1** = stdout, **2** = stderr.\n- `>` overwrites, `>>` appends, `<` reads stdin from a file, `2>` redirects errors, `2> /dev/null` discards them.\n- `> file 2>&1` puts both streams in one file; redirections are processed **left to right**. `>&2` sends stdout to stderr.\n- `|` connects stdout to the next command's stdin; stderr does not go through the pipe.\n- `tee file` saves a copy of the stream and passes it on; place it exactly where the data has the form you want saved."}]},{"id":"d3-expansions","title":"Shell expansions","notebook":"bash/expansions.ipynb","priority":"high","examNote":"Know the **order** of the seven expansions and which happen inside double quotes. Quiz 1 used command substitution (`perm=$(stat -c %a \"$src\")`, Q4) and arithmetic expansion (`$(( ... / 2 ))`, Q3A) inside scripts; you will write those once variables (Day 4) are covered. \"What does this print?\" questions on brace expansion and word splitting are easy marks.","blocks":[{"type":"md","text":"### What is an expansion?\n\nThe shell splits each command line into **tokens** (words and operators). Before running the command, it performs **expansions**: it replaces some tokens with new strings. For example, in `echo $((1 + 1))`, the shell replaces `$((1 + 1))` with `2` and then runs `echo 2`. The command never sees the original text.\n\nThere are **seven** kinds of expansion, performed **in this order** (memorize it):\n\n1. **brace expansion**: `{a,b}`, `{1..5}`\n2. **tilde expansion**: `~`\n3. **parameter expansion**: `$name`, `${name}`\n4. **command substitution**: `$(command)`\n5. **arithmetic expansion**: `$(( expression ))`\n6. **word splitting**\n7. **filename expansion** (globbing): `*`, `?`, `[...]`\n\nCommand substitution and arithmetic expansion have the **same precedence**: if a line has several of them, they are done left to right.\n\nA memory aid: **B**rave **T**urtles **P**addle **C**alm **A**rctic **W**ater **F**ast (Brace, Tilde, Parameter, Command, Arithmetic, Word splitting, Filename)."},{"type":"check","q":"List the seven expansions in order.","a":"Brace, tilde, parameter, command substitution, arithmetic (same level as command substitution), word splitting, filename expansion."},{"type":"try","text":"Run `echo {a,b,c}`, `echo {9..0}` and `echo file{1..3}.txt`. Then, in your practice folder, run `mkdir week{01..03}` and `ls`."},{"type":"md","text":"### Brace expansion\n\nBrace expansion **generates strings that follow a pattern**. Its form is *preamble*`{`*expression*`}`*postscript*. The optional preamble is glued to the front of every generated string and the optional postscript to the back. The *expression* is either:\n\n- two or more **comma-separated** strings: `{a,b,c}`, or\n- a **sequence expression** `{x..y}` or `{x..y..incr}` where `x` and `y` are integers or single characters and `incr` is an optional step size.\n\nBrace expansion is pure text generation. Unlike `*`, it does **not** look at which files exist."},{"type":"code","code":"$ echo {a,b,c}\na b c\n$ echo before_{and,\\&,also}_after\nbefore_and_after before_&_after before_also_after\n$ echo {9..0}\n9 8 7 6 5 4 3 2 1 0\n$ echo {10..20..2}\n10 12 14 16 18 20\n$ echo {a..z..2}\na c e g i k m o q s u w y\n$ echo file{1..3}.txt\nfile1.txt file2.txt file3.txt\n$ echo /usr/{ucb/{ex,edit},lib/{a,how_ex}}\n/usr/ucb/ex /usr/ucb/edit /usr/lib/a /usr/lib/how_ex","caption":"The last one is a nested brace expansion from the Bash manual."},{"type":"md","text":"Leading zeros are kept: `{01..12}` gives `01 02 ... 12`. Two brace expansions next to each other give every combination, which is handy for creating many files or directories at once:\n\n```bash\nmkdir {2019..2022}-{01..12}     # 48 directories 2019-01 ... 2022-12\ntouch file{00..30}.txt          # file00.txt ... file30.txt\n```"},{"type":"code","code":"$ echo {a,b}{1,2}\na1 a2 b1 b2"},{"type":"check","q":"What does `echo x{1..3}y` print?","a":"`x1y x2y x3y`"},{"type":"md","text":"### Tilde expansion\n\nA `~` at the start of a word expands to the absolute path of **your home directory** (the value of `HOME`). `~username` expands to the home directory of *username*.\n\n```bash\n$ echo ~            # if your home directory is /home/user1\n/home/user1\n$ echo ~/notes\n/home/user1/notes\n```\n\n### Parameter expansion\n\n**Parameter expansion** happens when you get the value of a variable or parameter by writing `$name` (or `${name}`). You have already used one: `$?`, the exit status (Day 1).\n\nA **variable** is a name that holds a string. Just enough to follow today's examples:\n\n- `name=value` stores *value* in the variable *name*. There must be **no spaces around `=`**.\n- `$name` is replaced by the stored value. A name that was never given a value expands to nothing.\n\nDay 4 covers variables properly. Later today, `$1`, `$2`, ... in a script (the command line arguments) are parameter expansions too."},{"type":"code","code":"$ course=CISC220\n$ echo \"I am taking $course\"\nI am taking CISC220"},{"type":"check","q":"What does `x=5; echo x $x` print?","a":"`x 5`. The first `x` is just a word; `$x` is replaced by the value `5`."},{"type":"pitfall","text":"Brace expansion happens **first**, before variables are expanded. So `n=3; echo {1..$n}` prints `{1..3}` literally: when brace expansion ran, the text was `{1..$n}`, which is not a valid sequence, so it was left alone."},{"type":"md","text":"### Command substitution: `$( )`\n\n`$(command)` runs *command* (in a subshell) and **replaces itself with the command's standard output**. Trailing newlines are removed. This is how you use a command's output inside a string, or store it in a variable:\n\n```bash\necho \"Today is $(date +%A), it's $(date +%H:%M)\"   # date +%A prints the weekday, +%H:%M the time\nmoo=$(cowsay \"Mooooo!\")     # prints nothing: the output is stored in moo\necho \"$moo\"                 # now print it\n```"},{"type":"code","code":"$ echo \"classlist has $(wc -l < classlist) lines\"\nclasslist has 4 lines\n$ n=$(cut -f3 classlist | sort | head -n1)\n$ echo \"smallest student number: $n\"\nsmallest student number: 1990000","caption":"Using the 4-line classlist from the Streams lesson."},{"type":"check","q":"What is the difference between `x=$(date)` and `x=date`?","a":"`x=$(date)` runs `date` and stores its output; `x=date` stores the four-letter string `date`."},{"type":"md","text":"### Arithmetic expansion: `$(( ))`\n\n`$(( expression ))` evaluates an **integer** arithmetic expression and substitutes the result. Division throws away the remainder (`7 / 2` is `3`); `%` gives the remainder. Arithmetic is rare at the command line but common in scripts (Day 5 covers arithmetic in full).\n\n```bash\n$ echo $(( 1 + 1 ))\n2\n$ mkdir dir$((2 * 5))       # creates dir10\n```"},{"type":"check","q":"What does `echo $(( 17 / 5 )) $(( 17 % 5 ))` print?","a":"`3 2` (integer division, then remainder)."},{"type":"md","text":"### Word splitting\n\nAfter the earlier expansions, **anything not inside double quotes** undergoes **word splitting**: the result is split into separate words (fields) wherever there are field separator characters. By default the separators are **space, tab and newline**, stored in the variable `IFS` (*internal field separator*). Several separators in a row count as **one** separator.\n\nThis is why spaces in file names cause trouble. `unzip CISC220 Assignment solutions.zip` gives `unzip` three arguments (`CISC220`, `Assignment`, `solutions.zip`). Quoting or escaping prevents the split."},{"type":"code","code":"$ str=\"field1    field2       field3\n\n\nfield4\"\n$ echo $str\nfield1 field2 field3 field4\n$ echo \"$str\"\nfield1    field2       field3\n\n\nfield4","caption":"Unquoted: the runs of spaces and newlines became single word breaks, and echo joins its arguments with one space. Quoted: one argument, printed exactly."},{"type":"md","text":"You can change `IFS` temporarily to split on something else, such as commas. Save the old value in another variable and put it back afterwards:\n\n```bash\nstr=\"123456,Ester,Polly\"\nOLDIFS=$IFS      # save the normal separators\nIFS=\",\"         # split on commas only\necho $str        # prints: 123456 Ester Polly\nIFS=$OLDIFS      # restore normal word splitting\n```\n\nUnquoted, `$str` is split at the commas into three words, and `echo` prints them separated by spaces. (The notebook also feeds the three words to a `for` loop; loops are Day 6.)"},{"type":"why","q":"Why does `echo $(cut -f3 classlist)` print all the student numbers on one line?","a":"The command substitution is unquoted, so its output is word split on the newlines. `echo` receives four separate arguments and prints them separated by single spaces."},{"type":"md","text":"### Filename expansion\n\nThe **last** expansion is filename expansion: words containing `*`, `?` or `[...]` are replaced with the matching file names (Day 2). Because it comes after word splitting, a variable that holds `*` expands to file names when used unquoted.\n\n### What happens inside quotes?\n\n| | brace | tilde | parameter `$x` | command `$( )` | arithmetic `$(( ))` | word splitting | filename `*` |\n|---|---|---|---|---|---|---|---|\n| unquoted | yes | yes | yes | yes | yes | yes | yes |\n| `\"double\"` | no | no | **yes** | **yes** | **yes** | no | no |\n| `'single'` | no | no | no | no | no | no | no |\n\nDouble quotes keep `$` working (parameter, command and arithmetic expansion) but **prevent word splitting and filename expansion** (and brace and tilde expansion). That is exactly why the course writes `\"$var\"`: the value is used as **one** word, exactly as stored, even if it contains spaces or `*`."},{"type":"code","code":"$ echo \"{a,b}\" \"~\" '$HOME' \"$((2+3))\"\n{a,b} ~ $HOME 5\n$ v='f*'\n$ echo \"$v\"\nf*\n$ echo $v\nf1 f2","caption":"The directory contains files f1 and f2."},{"type":"check","q":"Which expansions still happen inside double quotes?","a":"Parameter expansion, command substitution and arithmetic expansion (the ones that start with `$`)."},{"type":"md","text":"### Key points\n\n- Order: **brace, tilde, parameter, command substitution / arithmetic, word splitting, filename**.\n- Brace expansion generates text (`{a,b}`, `{1..10..2}`, `{01..12}`) and does not care what files exist; it runs before variables are expanded.\n- `$(cmd)` is replaced by cmd's stdout; `$((expr))` by an integer result.\n- Unquoted results are word split on space, tab and newline (`IFS`), then globbed.\n- Double quotes allow only the `$` expansions; single quotes allow none."}]},{"id":"d4-scripts","title":"Your first scripts: shebang, running, comments, arguments","notebook":"bash/introduction_to_bash_scripting.ipynb","priority":"high","examNote":"Quiz 1 Q2E: *from inside a script, how can you print the number of command line arguments?* (`echo $#`). Every long question on Quiz 1 was a script (Q4 copy permissions, 4 marks; Q5 `trash.sh`, 10 marks) built on today's basics: the shebang, `$1`, `$2` and quoting. Those two also need variables (Day 4). On the paper exam you write scripts by hand, so practise typing them out from memory.","blocks":[{"type":"md","text":"A **Bash script** is a plain-text file that holds a list of commands. When you run the script, Bash reads the file and runs the commands one after another, exactly as if you had typed them at the prompt. So **anything you can type in the terminal can go in a script**: paths, globs, quoting, redirections, pipes and expansions all work inside scripts too.\n\nThe course naming conventions for script files:\n\n- end with `.sh` (for example `hello.sh`)\n- start with a lowercase letter\n- use only letters, digits and `_`, with `_` between words (for example `make_backup.sh`)"},{"type":"md","text":"### Your first script, step by step\n\n**Step 1: open a new file in nano.** nano is the editor from Day 1. Make a folder for your scripts, go into it, and open a new file named `hello.sh`:"},{"type":"code","code":"$ mkdir -p ~/scripts\n$ cd ~/scripts\n$ nano hello.sh","caption":"nano opens inside the terminal, exactly as on Day 1."},{"type":"md","text":"**Step 2: type the script.** Type these three lines exactly (the middle line is empty):"},{"type":"code","code":"#!/bin/bash\n\necho 'Hello, world!'","caption":"hello.sh"},{"type":"md","text":"The first line, `#!/bin/bash`, is called the **shebang** (or *hash-bang*, from the two characters `#` and `!`). It must be the **very first line**, with `#!` as the first two characters (no blank line or space before it). It tells the operating system which program should run the rest of the file: here `/bin/bash`, the Bash shell. On the exam, **start every script with `#!/bin/bash`**.\n\n**Step 3: save.** In nano press **Ctrl + O**, then **Enter**, then **Ctrl + X** to exit. Back in the terminal, check what you saved:"},{"type":"code","code":"$ cat hello.sh\n#!/bin/bash\n\necho 'Hello, world!'\n$ ls -l hello.sh\n-rw-r--r-- 1 user1 user1 34 Sep 15 10:00 hello.sh","caption":"A new file has no x (execute) permission yet."},{"type":"md","text":"**Step 4: make it executable.** A script file must be **readable and executable** for you to run it by name. If you try too early, the shell refuses:"},{"type":"code","code":"$ ./hello.sh\nbash: ./hello.sh: Permission denied\n$ chmod u+x hello.sh\n$ ls -l hello.sh\n-rwxr--r-- 1 user1 user1 34 Sep 15 10:00 hello.sh","caption":"chmod u+x (Day 2) adds execute permission for the owner, you. chmod +x hello.sh also works: it adds x for everyone."},{"type":"md","text":"You only need to `chmod` a script **once**. Editing and saving it again later keeps its permissions.\n\n**Step 5: run it from its folder.** Type `./` followed by the file name:"},{"type":"code","code":"$ ./hello.sh\nHello, world!"},{"type":"md","text":"`./hello.sh` means \"the file `hello.sh` in the current directory `.`\". You need the `./` because, for a bare command name like `ls`, the shell only searches the directories listed in your *path*, and the current directory is normally not one of them. `./hello.sh` is a relative pathname, so the shell does not search: it runs exactly that file. Any other pathname works too, for example `~/scripts/hello.sh` from any folder.\n\nYou can also run a script with `bash hello.sh`. That starts a new Bash and hands it the file as an argument, so it works **even without execute permission** (Bash only needs to *read* the file)."},{"type":"try","text":"Do steps 1 to 5 now: create `~/scripts/hello.sh`, try `./hello.sh` before `chmod` and read the error, then `chmod u+x hello.sh` and run it again. Finally run `cd ~` and try `./hello.sh` from there: read that error too."},{"type":"check","q":"You saved `hello.sh` in the current directory. Give the two commands that make it executable for you and then run it.","a":"`chmod u+x hello.sh` then `./hello.sh`. (Without execute permission you could still run it with `bash hello.sh`.)"},{"type":"md","text":"### When it doesn't run: reading the error message\n\n| You see | What it means | Fix |\n|---|---|---|\n| `bash: ./hello.sh: Permission denied` | The file exists but has **no execute permission**. | `chmod u+x hello.sh` (or run `bash hello.sh`). |\n| `bash: ./hello.sh: No such file or directory` | There is **no file with that name in the current directory**: you are in the wrong folder, or the name is misspelled. | Run `pwd` and `ls`; `cd` to the script's folder, or type its full pathname. |\n| `hello.sh: command not found` | You left out the `./`, so the shell searched the path and did not look in the current directory. | Type `./hello.sh`. |\n| `cannot execute: required file not found` (older Bash: `bad interpreter: No such file or directory`) | The **shebang line is wrong**, for example `#!/bin/bsh`: the program it names does not exist. | Fix the first line to read exactly `#!/bin/bash`. |"},{"type":"why","q":"Why does typing just `hello.sh` usually give `command not found`, while `./hello.sh` works?","a":"A bare name is searched for only in the directories on the path, and the current directory is normally not on it. `./hello.sh` is a pathname, so the shell does not search: it runs exactly that file."},{"type":"check","q":"Your script is `~/scripts/count.sh` and your terminal is in `~`. You type `./count.sh` and get `No such file or directory`. Give two ways to run it.","a":"`cd ~/scripts` and then `./count.sh`, or type its pathname from where you are: `scripts/count.sh` (or `~/scripts/count.sh`). `./count.sh` looked for the file in `~`, where it is not."},{"type":"md","text":"### Any command can go in a script\n\nThe notebook's `fortunecow.sh` is a one-line pipeline (`fortune | cowsay -f moose`). Its `makesh.sh` does something useful: it creates a skeleton script named `tmp.sh`:\n\n```bash\n#!/bin/bash\n\necho '#!/bin/bash' > tmp.sh\nchmod u+x tmp.sh\n```\n\nRunning it prints nothing (the Unix *rule of silence*: quiet on success), but `ls` afterwards shows the new, executable `tmp.sh`. The `'#!/bin/bash'` is in single quotes, so it is just text that `echo` writes into the file."},{"type":"md","text":"### Comments\n\n`#` starts a **comment**: the shell ignores the `#` and everything after it to the end of the line. Use comments to say what the script does. They can be on their own line or after a command:\n\n```bash\n#!/bin/bash\n\n# makesh.sh: create a skeleton script named tmp.sh\n\necho '#!/bin/bash' > tmp.sh    # write the shebang into tmp.sh\nchmod u+x tmp.sh\n```\n\nTwo details:\n\n- A **quoted or escaped** `#` is not a comment. `echo '# This is not a comment'` prints `# This is not a comment`.\n- A comment always runs **to the end of the line**, so you cannot put one in the middle of a command. `ls #list_all_.txt_files .txt` is just `ls`.\n\n(The shebang starts with `#` too: to Bash it is a comment, but the operating system reads it first.)\n\nEvery command sets an **exit status** (Day 1): `0` for success, `1` to `255` for failure, read with `$?`. A script sets one too: the status of the **last command it ran**. The notebook's `comment.sh` contains only comments, so it runs nothing and succeeds. (How a script chooses its own exit status comes on Day 5.)"},{"type":"code","code":"$ ./comment.sh\n$ echo $?\n0","caption":"comment.sh contains only the shebang and comments."},{"type":"check","q":"What does the script line `ls *.txt # list text files` run?","a":"`ls *.txt`. Everything from `#` onward is a comment, so it is ignored."},{"type":"md","text":"### Command line arguments: positional parameters\n\nScripts take command line arguments like any other command (`./greet.sh Sam`). Bash stores them in **positional parameters** and a few **special parameters**, and you get their values with `$`, just like `$?`:\n\n| Parameter | Meaning |\n|---|---|\n| `$0` | the pathname used to run the script, e.g. `./args.sh` |\n| `$1`, `$2`, ... `$9` | the first, second, ... ninth argument |\n| `${10}`, `${11}`, ... | the tenth argument and later: **braces required** |\n| `$#` | the **number** of arguments (not counting `$0`) |\n| `\"$@\"` | all the arguments, each kept as a separate word |\n\nYou cannot assign to these with `=`; the shell sets them when the script starts. Asking for an argument that was not given is **not an error**: `$3` just expands to the empty string.\n\nSuppose `args.sh` contains:\n\n```bash\n#!/bin/bash\n\n# args.sh: show the arguments\n\necho \"$# arguments: first=$1 second=$2\"\necho \"called as $0\"\n```"},{"type":"code","code":"$ ./args.sh \"a b\" c\n2 arguments: first=a b second=c\ncalled as ./args.sh\n$ ./args.sh\n0 arguments: first= second=\ncalled as ./args.sh"},{"type":"md","text":"Notice that `\"a b\"` is **one** argument: the quotes on the command line kept the space inside it (Day 2). The quotes themselves are not part of `$1`. The parameters are inside double quotes in the script, and double quotes still allow `$` expansions."},{"type":"try","text":"Create `args.sh` in `~/scripts` with the editor, `chmod u+x args.sh`, and run it as `./args.sh`, `./args.sh one two three` and `./args.sh \"one two\" three`. Predict `$#` each time before you press Enter."},{"type":"pitfall","text":"`$10` is **not** the tenth argument. Bash reads it as `$1` followed by the character `0`. With arguments `a b c d e f g h i j`, `echo \"$10 ${10}\"` prints `a0 j`. Always write `${10}`, `${11}`, ..."},{"type":"check","q":"A script is run as `./s.sh one \"two three\" four`. What are `$#`, `$2` and `$0`?","a":"`$#` is `3`, `$2` is `two three`, and `$0` is `./s.sh`."},{"type":"md","text":"Quiz 1 Q2E asked: *from inside a script, how can you print the number of command line arguments?* Answer: `echo $#`.\n\nThe notebook's `hellou.sh` greets whoever is named in the first argument. Braces are always allowed around a parameter name: `${1}` is the same as `$1`.\n\n```bash\n#!/bin/bash\n\n# hellou.sh\n\necho \"Hello, ${1}!\"\n```\n\n`./hellou.sh Sam` prints `Hello, Sam!`; with no argument it prints `Hello, !`."},{"type":"md","text":"### Arguments in a pipeline\n\nArguments make a pipeline reusable: the user chooses the file. This script prints the three smallest student numbers of any class list named by `$1`:\n\n```bash\n#!/bin/bash\n\n# lowest3.sh: the three smallest student numbers in class list file $1\n\ncut -f3 \"$1\" | sort | head -n3\n```\n\nAlways write `\"$1\"` **with double quotes** where a file name goes. Unquoted, a name with a space such as `class list 2` would be word split into the three arguments `class`, `list` and `2` (Day 2's quoting lesson and today's word splitting)."},{"type":"code","code":"$ ./lowest3.sh classlist\n1990000\n2999999\n3001111","caption":"classlist is the 4-line file from the Streams lesson."},{"type":"check","q":"Write the one command line (after the shebang) of a script that prints the number of lines in the file named by its first argument, and nothing else.","a":"`wc -l < \"$1\"` (with `<`, `wc` prints only the number). `wc -l \"$1\"` would also print the file name."},{"type":"md","text":"### All the arguments: `\"$@\"` (and `$*`)\n\n`\"$@\"` (**with** the double quotes) expands to all the arguments as separate words, exactly as given: `\"$1\" \"$2\" \"$3\" ...`. It is the safe way to pass every argument on to another command:\n\n```bash\n#!/bin/bash\n\n# countlines.sh: count the lines of every file named on the command line\n\nwc -l \"$@\"\n```"},{"type":"code","code":"$ ./countlines.sh classlist \"my notes.txt\"\n 4 classlist\n 2 my notes.txt\n 6 total","caption":"my notes.txt has 2 lines. Each argument reached wc as one word, space and all."},{"type":"md","text":"Without the quotes, `$@` is word split, so the argument `my notes.txt` becomes the two words `my` and `notes.txt`, and `wc` complains that neither exists. `\"$*\"` joins all the arguments into **one** string separated by spaces; you will rarely want that. You will use `\"$@\"` most with `for` loops on Day 6."},{"type":"check","q":"A script runs `ls -l \"$@\"`. It is called as `./l.sh \"a b\" c`. What arguments does `ls` receive?","a":"Two: `a b` and `c`. With `ls -l $@` (unquoted) it would receive three: `a`, `b` and `c`."},{"type":"md","text":"### Putting it together\n\nThe notebook improves `makesh.sh` so the user chooses the file name with `$1`. With the quoting the course requires:\n\n```bash\n#!/bin/bash\n\n# namedsh.sh: create an executable skeleton script named $1\n\necho '#!/bin/bash' > \"$1\"\nchmod u+x \"$1\"\n```\n\nRunning `./namedsh.sh myscript.sh` creates `myscript.sh` containing the shebang, with execute permission for the owner."},{"type":"md","text":"### Script tasks in the drills\n\nFrom today the drills (`./drill.sh start 3`) include **script tasks**. Their header says where to save the file, for example `(script: write /home/you/cisc220_drills/scripts/day3/greet.sh)`: that is `~/cisc220_drills/scripts/day3/greet.sh`, in your home folder.\n\n1. Open that exact file in nano: `nano ~/cisc220_drills/scripts/day3/greet.sh` (the folder was made by `./drill.sh start 3`).\n2. Write the script, starting with `#!/bin/bash`, and save it.\n3. Run `./drill.sh check 3`. You do **not** need `chmod` for this: the checker **copies** your script into a fresh sandbox folder (the one named in the task, usually `home/user1`, where files like `classlist` are), **makes it executable**, and runs test commands there such as `./greet.sh Sam`. It runs the reference solution the same way and compares standard output, standard error, the exit status and the files left behind.\n\nTo try your script by hand first, copy it into your practice sandbox and run it there:\n\n```bash\ncd ~/cisc220_drills/play/day3/home/user1\ncp ~/cisc220_drills/scripts/day3/greet.sh .\nchmod u+x greet.sh\n./greet.sh Sam\n```"},{"type":"try","text":"Run `./drill.sh start 3` in the `drills` folder, read the first script task, write the script in `~/cisc220_drills/scripts/day3/`, and run `./drill.sh check 3`."},{"type":"md","text":"### Key points\n\n- Write the script in an editor, first line `#!/bin/bash`, save; `chmod u+x f.sh` once; run it from its folder with `./f.sh` (or `bash f.sh`).\n- `Permission denied` = no execute permission; `No such file or directory` = no such file in the current folder (or a wrong shebang).\n- `#` starts a comment that runs to the end of the line, unless it is quoted.\n- `$1`...`$9`, then `${10}`; `$#` is the number of arguments (`echo $#`); `$0` is how the script was called; `\"$@\"` is all arguments, separately.\n- Quote arguments where file names go: `cut -f3 \"$1\"`. A script's exit status is that of its last command."}]},{"id":"d4-variables","title":"Variables, quoting and command substitution","notebook":"bash/variables.ipynb","priority":"high","examNote":"Quiz 1 Q2F: concatenate `str1` and `str2` into `str3` (`str3=$str1$str2`). Quiz 1 Q4 was built on `perm=$(stat -c %a \"$src\")`, and the posted solution marks the quotes around `\"$src\"` and `\"$dest\"` as **required**. The notebook's `bad_backup.sh` (`$in_.bak`) is a classic short-answer trap.","blocks":[{"type":"md","text":"A **variable** is a name that refers to a stored value. In Bash a variable name is made of letters, digits and underscores and starts with a letter or underscore. The course convention is **lowercase names**, with `_` between words (`trash_dir`, `perm`).\n\n### Assignment: no spaces around `=`\n\nTo store a value, write the name, `=`, and the value, with **no spaces anywhere around the `=`**:"},{"type":"code","code":"a=2                # assign the string 2 to a\nb=\"some string\"    # quotes keep the space inside the value\nc=$a$b             # concatenation: c is 2some string\necho \"$c\"","caption":"Prints: 2some string"},{"type":"try","text":"In your practice folder (`cd ~/practice`), type the four lines above one at a time. Then run `echo a` and `echo $a` and compare. Finally type `x = 5` to see the error for yourself."},{"type":"md","text":"Spaces break assignment because the shell splits a line into words at spaces (Day 1), and the first word is the command:"},{"type":"code","code":"$ x = 5\nbash: x: command not found\n$ x= 5\nbash: 5: command not found"},{"type":"md","text":"`x = 5` runs a command named `x` with arguments `=` and `5`. `x= 5` sets `x` to empty just for a command named `5`, which does not exist.\n\n### Getting the value: parameter expansion\n\nWrite `$` in front of the name to get the value: `$var` or `${var}`. Replacing `${var}` with its value is called **parameter expansion** (or variable expansion). Without the `$`, a name is just text: `echo a` prints `a`, while `echo $a` prints `2`.\n\nBash variables are **untyped**: every value is a string. A value made only of digits can be used as a number in arithmetic expansion `$(( ))` (Day 3). There are **no floating-point numbers** in Bash.\n\n**Concatenation** is just writing expansions next to each other, so Quiz 1 Q2F's answer is:\n\n```bash\nstr3=$str1$str2\n```"},{"type":"check","q":"Write the assignment that stores `CISC` followed by `220` in `course`, given `dept=CISC` and `num=220`.","a":"`course=$dept$num` (or `course=\"$dept$num\"`, or `course=${dept}${num}`)."},{"type":"md","text":"### Unset variables are empty, and why `${var}` matters\n\nUsing a variable that was never assigned is **not an error**: it expands to the empty string. The command `unset var` removes a variable, so it becomes unset again.\n\nThat friendly behaviour causes a classic bug. The notebook's `bad_backup.sh` tries to copy file `abc` to `abc_.bak`:\n\n```bash\n#!/bin/bash\n\n# bad_backup.sh\nin=\"$1\"\nout=\"$in_.bak\"\ncp \"$in\" \"$out\"\n```"},{"type":"code","code":"$ ls -A\n'my file'\n$ ../bad_backup.sh \"my file\"\n$ ls -A\n.bak  'my file'","caption":"The script is in the parent directory. (ls puts quotes around names with spaces when it prints to a terminal.)"},{"type":"md","text":"`in_` is a valid variable name, so `$in_.bak` means \"the value of `in_`, then `.bak`\". `in_` was never set, so `out` becomes just `.bak`. The fix is braces, which mark exactly where the name ends:\n\n```bash\n#!/bin/bash\n\n# backup.sh\nin=\"$1\"\nout=\"${in}_.bak\"\ncp \"$in\" \"$out\"\n```\n\nNow `./backup.sh \"my file\"` creates `my file_.bak`. **Rule:** when a variable is directly followed by a letter, digit or `_`, write `${name}`."},{"type":"try","text":"In `~/practice`, create `bad_backup.sh` and `backup.sh` with nano (`nano bad_backup.sh`; copy the two scripts above) and run `chmod u+x bad_backup.sh backup.sh`. Then run `touch \"my file\"`, `./bad_backup.sh \"my file\"`, `ls -A`, `./backup.sh \"my file\"`, `ls -A`. You should see `.bak` appear first, then `my file_.bak`."},{"type":"why","q":"Why did `bad_backup.sh` produce a file named `.bak` instead of an error?","a":"Bash treats `in_` as the variable name. Unset variables expand to the empty string without any error, so `\"$in_.bak\"` became `.bak`."},{"type":"md","text":"### Always quote your variables\n\nWhen a variable expansion is **not** inside double quotes, Bash splits its value into words at spaces and expands any glob characters in it. Filenames with spaces then break:"},{"type":"code","code":"$ f=\"my file\"\n$ cat $f\ncat: my: No such file or directory\ncat: file: No such file or directory\n$ cat \"$f\"\nhello","caption":"The file my file contains the line hello."},{"type":"md","text":"Inside double quotes, the `$` expansion still happens but the result stays **one word**. That is why the course requires `cp \"$in\" \"$out\"`, `chmod \"$perm\" \"$dest\"`, `mv \"$pathname\" \"$trashdir\"`. Single quotes turn expansion off completely: `echo '$f'` prints `$f`.\n\nQuoting on the right side of a plain assignment is optional (`in=$1` and `in=\"$1\"` both store the whole argument, spaces included), but quoting it never hurts."},{"type":"pitfall","text":"Unquoted variables are the most common way to lose marks on script questions. Quote every `$var` that is used as a command argument: `chmod \"$perm\" \"$dest\"`, not `chmod $perm $dest`."},{"type":"check","q":"`f=\"lab 1.txt\"`. What goes wrong with `rm $f`?","a":"The value is split into two words, so `rm` tries to delete files named `lab` and `1.txt`. Write `rm \"$f\"`."},{"type":"md","text":"### What is expanded in an assignment\n\nOn the right of `=`, Bash performs **tilde expansion, parameter expansion, command substitution and arithmetic expansion**, but **not** brace expansion or filename (glob) expansion. (Arithmetic expansion `$(( ))` is the Day 3 one: it is replaced by the integer result.)"},{"type":"code","code":"$ yrs={2020..2029..3}\n$ echo \"$yrs\"\n{2020..2029..3}\n$ sum=$(( 5 + 3 ))\n$ echo \"$sum\"\n8"},{"type":"md","text":"### Command substitution into a variable\n\n`$(command)` runs the command and is replaced by its output, with trailing newlines removed (Day 3). Storing that output in a variable is how a script captures information from other commands. For example, `stat -c %a file` prints a file's permissions as three octal digits (from Assignment 2):\n\n```bash\nperm=$(stat -c %a \"$src\")    # e.g. perm is 640\nchmod \"$perm\" \"$dest\"        # give dest the same permissions\n```\n\nThese two lines are the heart of Quiz 1 Q4 (see the worked example in the Write section)."},{"type":"check","q":"Store the number of lines in `classlist` in a variable `n`.","a":"`n=$(wc -l < classlist)` (the `<` makes `wc` print only the number, without the filename)."},{"type":"md","text":"### Key points\n\n- Assign with `name=value`: **no spaces** around `=`. Use `$name` or `${name}` to get the value.\n- Concatenate by writing values side by side: `str3=$str1$str2`.\n- Unset variables expand to the empty string, silently. Use `${name}` when the next character could be part of a name (`\"${in}_.bak\"`).\n- Quote expansions used as arguments: `\"$var\"`. Unquoted values are split at spaces.\n- `var=$(command)` stores a command's output; brace and glob expansion do not happen in assignments."}]},{"id":"d4-strings","title":"String operations with parameter expansion","notebook":"bash/strings.ipynb","priority":"high","examNote":"Quiz 1 Q3A (2 marks): print the first half of `s` with `${s:offset:len}` and `${#s}`. Quiz 1 Q5 (10 marks) needed `dir=${pathname%/*}`. Assignment 3 used `${#seq1}` and `${seq2:i:1}`; renaming extensions (`chext.sh`) uses `${f%.*}`.","blocks":[{"type":"md","text":"Bash has no string functions like Java's `substring`. Instead, string operations are special forms of **parameter expansion**, written inside `${ }`. None of them change the variable: they produce a new string.\n\n### Length: `${#s}`"},{"type":"code","code":"$ str=\"cisc220\"\n$ echo \"${#str}\"\n7"},{"type":"md","text":"### Substrings: `${s:offset}` and `${s:offset:length}`\n\nCharacters are numbered from **0**. `${s:offset}` is everything from index `offset` to the end; `${s:offset:length}` is `length` characters starting at `offset`."},{"type":"code","code":"$ s=\"abcdefghij\"\n$ echo \"${s:2}\"\ncdefghij\n$ echo \"${s:3:4}\"\ndefg\n$ echo \"${s:1:0}\"\n\n$ echo \"${s: -3}\"\nhij\n$ echo \"${s:1:-2}\"\nbcdefgh"},{"type":"md","text":"- A **negative offset** counts from the end, but needs a **space** before the minus: `${s: -3}`. Without it, `${s:-3}` is a different expansion (a default value, below) and gives the whole string.\n- A **negative length** means \"stop before this many characters from the end\": `${s:1:-2}` goes from index 1 up to but not including the second-last character.\n- The offset and length are arithmetic, so they can be variables or expressions: `${s:n}` and `${s:0:n}` work with or without `$` on `n`.\n\nQuiz 1 Q3A: print the first half of `s` (even length):\n\n```bash\nn=$(( ${#s} / 2 ))\necho \"${s:0:n}\"\n```\n\n`$(( ))` is arithmetic expansion (Day 3): `${#s}` is expanded first, then divided by 2. Integer division drops any remainder, so for a length of 7 `n` would be 3. `echo \"${s:n}\"` would print the second half. (The posted answer writes `${s:0:$n}`; the `$` is optional there.)"},{"type":"check","q":"`s=\"hello\"`. What do `${s:1:3}` and `${s: -2}` give?","a":"`ell` (3 characters starting at index 1) and `lo` (the last 2 characters)."},{"type":"try","text":"At the prompt, set `s=abcdefghij` and run `echo \"${s:3:4}\"`, `echo \"${s: -3}\"` and `echo \"${s:-3}\"`. Predict each answer before you press Enter. Then run `n=$(( ${#s} / 2 ))` and `echo \"${s:0:n}\"`."},{"type":"md","text":"### Removing a prefix or suffix: `#`, `##`, `%`, `%%`\n\nThese remove part of the string that matches a **pattern**. Patterns are the glob patterns from Day 2: `*` matches any characters, `?` one character, `[...]` one character from a set.\n\n| Expansion | Removes |\n|---|---|\n| `${s#pattern}` | the **shortest** matching part from the **front** |\n| `${s##pattern}` | the **longest** matching part from the **front** |\n| `${s%pattern}` | the **shortest** matching part from the **end** |\n| `${s%%pattern}` | the **longest** matching part from the **end** |\n\nMemory aid: on the keyboard `#` (Shift-3) is to the **left** of `%` (Shift-5), so `#` cuts from the left (front) and `%` from the right (end). Doubling the symbol makes it greedy (longest match)."},{"type":"code","code":"$ f=\"file.txt.zip\"\n$ echo \"${f#*.}\"      # shortest front part matching *.  is \"file.\"\ntxt.zip\n$ echo \"${f##*.}\"     # longest front part matching *.  is \"file.txt.\"\nzip\n$ echo \"${f%.*}\"      # shortest end part matching .*  is \".zip\"\nfile.txt\n$ echo \"${f%%.*}\"     # longest end part matching .*  is \".txt.zip\"\nfile"},{"type":"md","text":"The same idea splits a **pathname** into its directory and its filename, because the pieces are separated by `/`:"},{"type":"code","code":"$ p=\"/home/user1/somedir/myfile\"\n$ echo \"${p%/*}\"      # remove the last /name: the directory\n/home/user1/somedir\n$ echo \"${p##*/}\"     # remove everything up to the last /: the filename\nmyfile"},{"type":"md","text":"This is exactly Step 1 of Quiz 1 Q5: `dir=${pathname%/*}`. The notebook's `scriptname.sh` uses `script=${0##*/}` to get the script's own name without its directory: run as `./scripts/strings/scriptname.sh`, it prints `script name : scriptname.sh`.\n\nCommon recipes:\n\n| Want | Expansion | `f=dir/report.final.txt` gives |\n|---|---|---|\n| filename only | `${f##*/}` | `report.final.txt` |\n| directory only | `${f%/*}` | `dir` |\n| drop last extension | `${f%.*}` | `dir/report.final` |\n| last extension | `${f##*.}` | `txt` |"},{"type":"pitfall","text":"If the pattern does not match, nothing is removed. With `p=myfile` (no `/`), `${p%/*}` is still `myfile`, not `.`. That is why Quiz 1 Q5 promised the pathname always includes the directory (`./myfile`, where `${p%/*}` is `.`)."},{"type":"try","text":"Set `p=/home/user1/somedir/myfile` and try all four: `echo \"${p#*/}\"`, `echo \"${p##*/}\"`, `echo \"${p%/*}\"`, `echo \"${p%%/*}\"`. Which one gives the directory and which gives the filename? (`${p%%/*}` prints an empty line: the longest end part matching `/*` is the whole string.)"},{"type":"check","q":"`p=/home/user1/a.b.c`. Give the expansions that produce `/home/user1` and `a.b`.","a":"`${p%/*}` gives `/home/user1`. For `a.b`, take the filename and drop the last extension: `name=${p##*/}` then `${name%.*}`."},{"type":"md","text":"### Replacing: `${s/pattern/repl}` and `${s//pattern/repl}`\n\nOne slash replaces the **first** match; two slashes replace **all** matches. An empty replacement deletes."},{"type":"code","code":"$ s=\"sparring with a purple porpoise\"\n$ echo \"${s/p/t}\"\nstarring with a purple porpoise\n$ echo \"${s//p/t}\"\nstarring with a turtle tortoise\n$ echo \"${s//p/}\"\nsarring with a urle oroise\n$ f=\"lab 1.txt\"\n$ echo \"${f// /_}\"\nlab_1.txt"},{"type":"check","q":"`f=\"my big file.txt\"`. Which expansion gives `my_big_file.txt`?","a":"`${f// /_}` (two slashes: replace every space with `_`)."},{"type":"md","text":"### Case conversion (less likely on the test)\n\n`${s^}` uppercases the first character, `${s^^}` all characters; `${s,}` lowercases the first character, `${s,,}` all. An optional pattern limits which characters convert (`${s,,[A-C]}`)."},{"type":"code","code":"$ s=\"xyz\"\n$ echo \"${s^}\" \"${s^^}\"\nXyz XYZ\n$ t=\"ABCXYZ\"\n$ echo \"${t,,}\"\nabcxyz"},{"type":"md","text":"### Default values for unset or empty variables\n\nFour pairs of expansions deal with variables that are **unset** (never assigned, or `unset`) or **empty** (`var=\"\"`). The forms **with a colon** treat empty the same as unset.\n\n| Expansion | `str` unset | `str` empty | `str` non-empty |\n|---|---|---|---|\n| `${str-word}` | `word` | empty | `$str` |\n| `${str:-word}` | `word` | `word` | `$str` |\n| `${str=word}` | `word`, and assigns it to `str` | empty | `$str` |\n| `${str:=word}` | `word`, and assigns it | `word`, and assigns it | `$str` |\n| `${str+word}` | empty | `word` | `word` |\n| `${str:+word}` | empty | empty | `word` |\n| `${str?word}` | prints `word` to stderr, script exits | empty | `$str` |\n| `${str:?word}` | prints `word` to stderr, script exits | prints `word`, exits | `$str` |\n\nThe one to know well is `:-`, a **default value**:\n\n```bash\nname=${1:-world}     # world if no (or an empty) first argument\necho \"Hello, $name!\"\n```\n\nYou cannot use `=` or `:=` on positional parameters (`${1:=x}` is an error); use `:-` with an ordinary variable instead."},{"type":"code","code":"$ unset v\n$ echo \"[${v-none}] [${v:-none}]\"\n[none] [none]\n$ v=\"\"\n$ echo \"[${v-none}] [${v:-none}]\"\n[] [none]","caption":"The colon makes the empty string count as missing."},{"type":"check","q":"Write an assignment that sets `dir` to the first argument, or to `.` if no first argument (or an empty one) was given.","a":"`dir=${1:-.}`"},{"type":"md","text":"### Key points\n\n- `${#s}` is the length; `${s:off:len}` a substring (index from 0); `${s: -n}` the last `n` characters (space needed).\n- `#`/`##` remove from the front, `%`/`%%` from the end; single = shortest, double = longest match.\n- Directory of a path: `${p%/*}`; filename: `${p##*/}`; drop extension: `${f%.*}`; extension: `${f##*.}`.\n- `${s/pat/rep}` replaces the first match, `${s//pat/rep}` every match.\n- `${var:-default}` gives a default when `var` is unset or empty."}]},{"id":"d3-tr","title":"The tr command","notebook":"bash/tr.ipynb","priority":"medium","examNote":"Assignment 3 Q5 (`tr220.sh`) re-implements `tr` and rejects exactly the cases this notebook calls undefined or non-portable (seq1 longer than seq2, duplicated characters in seq1). Expect a one-line `tr` in a pipeline or a \"what does this print?\" question.","blocks":[{"type":"md","text":"### What `tr` does\n\n`tr` **translates, squeezes and/or deletes characters**. It reads **standard input only** (it does not take a file name argument) and writes standard output. Think of it as a character-by-character search and replace.\n\n```bash\ntr [option]... seq1 [seq2]\n```\n\nWith two sequences, each character of `seq1` is replaced by the character **at the same position** in `seq2`. Characters not in `seq1` pass through unchanged.\n\nBecause `tr` reads stdin, you feed it with a pipe or `<`:\n\n```bash\ntr a-z A-Z < words.txt           # a file\necho \"$x\" | tr a-z A-Z           # a variable\nprintf %s \"$x\" | tr 'p' 't'      # printf %s prints x exactly, with no newline added\n```"},{"type":"code","code":"$ x=\"sparring with a purple porpoise\"\n$ y=$(printf %s \"$x\" | tr 'p' 't')\n$ echo \"$y\"\nstarring with a turtle tortoise\n$ echo \"ca.queensu.cs.cisc124\" | tr '.' '/'\nca/queensu/cs/cisc124\n$ echo hello | tr el ip\nhippo","caption":"The first two lines are the notebook's way to change a variable's text with tr. In the last one e becomes i and l becomes p (position 1 maps to position 1, position 2 to position 2)."},{"type":"check","q":"What does `echo mutate | tr emu opo` print?","a":"`potato` (e->o, m->p, u->o)."},{"type":"pitfall","text":"`tr a-z A-Z words.txt` is an error: `tr` does not accept a file name. Use `tr a-z A-Z < words.txt` or `cat words.txt | tr a-z A-Z`."},{"type":"try","text":"In `~/practice`, run `echo hello | tr el ip`, then `tr a-z A-Z < animals.txt` (the file from Day 1), then `tr a-z A-Z animals.txt` to see the error message for a file name argument."},{"type":"md","text":"### Three ways to write a sequence\n\n1. a plain **string** of characters: `ABCDEFGHIJKLMNOPQRSTUVWXYZ`\n2. a **range**: `A-Z`, `a-z`, `0-9` (not portable, but works in GNU tr)\n3. a **POSIX character class**: `[:upper:]`, `[:lower:]`, `[:digit:]`, `[:alpha:]`, `[:space:]`, `[:punct:]`\n\nSpecial characters can be written with backslash escapes: `'\\n'` is newline, `'\\t'` is tab. Quote the sequences (single quotes are safest) so the shell does not treat `[`, `*` or `\\` specially."},{"type":"code","code":"$ echo cisc220 | tr 'a-z' 'A-Z'\nCISC220\n$ echo \"Hi There\" | tr '[:upper:]' '[:lower:]'\nhi there\n$ echo \"one two\" | tr ' ' '\\n'\none\ntwo"},{"type":"md","text":"### When the sequences have different lengths\n\n- **`seq1` shorter than `seq2`**: the extra characters of `seq2` are ignored. `tr 'a-z' 'A-Z0-9'` behaves like `tr 'a-z' 'A-Z'`.\n- **`seq1` longer than `seq2`**: GNU `tr` **extends `seq2` by repeating its last character** until it is as long as `seq1`. POSIX says the result is **undefined**, so this is not portable.\n- The portable way to repeat a character *c* is `[c*]`, which repeats *c* as many times as needed to match `seq1`."},{"type":"code","code":"$ echo cisc220 | tr 'a-z' 'A-Z0-9'\nCISC220\n$ echo cisc220 | tr '0-9' 'X'\nciscXXX\n$ echo cisc220 | tr '[:digit:]' '[X*]'\nciscXXX\n$ echo abc | tr abc xy\nxyy","caption":"GNU tr: in tr abc xy, seq2 is extended to xyy."},{"type":"md","text":"### Duplicated characters in `seq1`: undefined\n\nIf `seq1` contains the **same character twice**, the result is **undefined** (the standard does not say which translation wins). With GNU `tr`, the **last** occurrence wins:\n\n```bash\n$ echo cisc220 | tr 'cisc' 'CIS'\nSISS220\n```\n\nHere `seq2` is extended to `CISS`, so `c` is mapped first to `C` and then to `S`; the later mapping wins, giving `SISS220`. Assignment 3's `tr220.sh` refuses this case: it checks `seq1` for duplicated characters and also rejects a `seq1` that is longer than `seq2`, the two undefined/non-portable cases above."},{"type":"check","q":"Name the two `tr` situations that the course calls undefined or non-portable.","a":"`seq1` longer than `seq2` (GNU repeats the last character of seq2; POSIX says undefined), and `seq1` containing a duplicated character (undefined)."},{"type":"md","text":"### Deleting and squeezing\n\n- `tr -d seq1` **deletes** every character that is in `seq1`. Give only one sequence.\n- `tr -s seq1` **squeezes**: each run of a repeated character from `seq1` is replaced by a single copy.\n- `tr -ds seq1 seq2` does both: first **delete** the characters in `seq1`, then **squeeze** repeats of characters in `seq2`."},{"type":"code","code":"$ echo \"2022-10-21\" | tr -d '-'\n20221021\n$ echo \"a     bcd  ef g\" | tr -s ' '\na bcd ef g\n$ echo bookkeeper | tr -s 'a-z'\nbokeper\n$ echo \"aaabbb--ccc\" | tr -ds '-' 'a-z'\nabc","caption":"Squeezing only merges repeats that are next to each other: bookkeeper becomes bokeper."},{"type":"try","text":"Run `echo \"a     bcd  ef g\" | tr -s ' '` and `echo 2022-10-21 | tr -d '-'`. Then predict, and check, what `echo bookkeeper | tr -s 'a-z'` prints."},{"type":"why","q":"Why is `tr -s ' '` useful before `cut -d' '`?","a":"`cut` treats every single delimiter as a field boundary, so two spaces in a row create an empty field. Squeezing runs of spaces to one space first makes the fields line up."},{"type":"check","q":"Write a command that prints the contents of `code.txt` with all digits removed.","a":"`tr -d '0-9' < code.txt` (or `tr -d '[:digit:]' < code.txt`)."},{"type":"md","text":"### Key points\n\n- `tr` reads **stdin only**; feed it with `<`, a pipe, or `echo \"$x\" |`.\n- Position *i* of `seq1` maps to position *i* of `seq2`; other characters pass through.\n- Sequences: strings, ranges `a-z`, classes `[:digit:]`; `[c*]` repeats *c*.\n- seq1 longer than seq2: GNU repeats the last char (non-portable); duplicates in seq1: undefined (GNU: last wins).\n- `-d` deletes, `-s` squeezes, `-ds` deletes seq1 then squeezes seq2."}]},{"id":"d5-regex","title":"Regular expressions, =~ and grep","notebook":"bash/regex.ipynb","priority":"high","examNote":"Quiz 2 Q1A: *what does `?` mean in a regex?* (zero or one instances of the preceding atom). Quiz 2 Q1B: *a regex matching strings that start and end with a lowercase letter*. Assignment 3 Q1 (`testpw.sh`) checks a password with `=~` and `[:space:]`, `[:alpha:]`, `[:digit:]`, `[:punct:]`, the model for a long written question. Today you write its regex tests; its usage check and exit status need `if` (Day 5).","blocks":[{"type":"md","text":"A **regular expression** (regex) is a string that describes a search **pattern** for text. You use one when you need to ask \"does this text look like X?\": an integer, a phone number, a password with at least one digit.\n\nBash uses the **POSIX extended regular expression** syntax. Warning: regexes use some of the same symbols as Bash's glob patterns (`*`, `?`, `[ ]`) but with **different meanings**. Keep them apart:\n\n| Symbol | Glob pattern (Day 2 globs, and `${s%pattern}` today) | Regular expression |\n|---|---|---|\n| `*` | any sequence of characters | **zero or more of the preceding atom** |\n| `?` | exactly one character | **zero or one of the preceding atom** |\n| `.` | a literal dot | **any single character** |"},{"type":"md","text":"### The `=~` operator inside `[[ ]]`\n\nTo test a string against a regex, Bash uses the `=~` operator inside **`[[ ]]`**:\n\n```bash\n[[ $str =~ $re ]]\n```\n\n`[[ ... ]]` is a **command** that tests something. Like every command it sets an **exit status** (Day 1): **0** (success, \"true\") when the test passes and **1** (\"false\") when it fails. It prints nothing. You see the result with `echo $?`, or you act on it with `&&` (run the next command only on success) and `||` (run it only on failure), exactly as on Day 1. Two rules:\n\n- Put a **space** after `[[`, before `]]` and around `=~`: they are separate words.\n- `=~` is true if **any part** of `$str` matches the regex. The match does not have to cover the whole string unless you use anchors (below).\n\n`[[ ]]` can test many other things (files, equal strings, numbers), and the notebook writes its regex tests inside **`if` statements**. Both come on Day 5. Today you only need `[[ $str =~ $re ]]` together with `$?`, `&&` and `||`."},{"type":"code","code":"$ [[ walrus =~ a ]]\n$ echo $?\n0\n$ [[ hello =~ a ]]\n$ echo $?\n1\n$ [[ sandman =~ and ]] && echo match\nmatch\n$ [[ hello =~ a ]] || echo \"no match\"\nno match","caption":"walrus contains an a and hello does not; sandman contains and."},{"type":"check","q":"What does `[[ cat =~ at ]]; echo $?` print, and why?","a":"`0`. The test succeeds because `cat` contains `at` somewhere."},{"type":"md","text":"The notebook's `test_regex.sh` is handy for experimenting. The notebook's version uses `if` (Day 5); here is the same script written with what you know today. Both lines run the same test: `&&` prints the first message only when the string matched, and `||` prints the second message only when it did not."},{"type":"code","code":"#!/bin/bash\n\n# test_regex.sh: does the string $1 match the regex $2?\n\nstr=$1\nre=$2\n[[ $str =~ $re ]] && echo \"The string $str is matched by the regex $re\"\n[[ $str =~ $re ]] || echo \"The string $str is not matched by the regex $re\""},{"type":"try","text":"In `~/practice`, create `test_regex.sh` with nano (`nano test_regex.sh`; copy the script above) and run `chmod u+x test_regex.sh`. Then run `./test_regex.sh hello a` and `./test_regex.sh walrus a`. Keep the script: use it to test every regex in the rest of this lesson. Put the regex in single quotes (`./test_regex.sh color '^colou?r$'`) so the shell passes it on unchanged."},{"type":"md","text":"Ordinary characters match themselves:"},{"type":"code","code":"$ ./test_regex.sh hello a\nThe string hello is not matched by the regex a\n$ ./test_regex.sh walrus a\nThe string walrus is matched by the regex a\n$ ./test_regex.sh sandman and\nThe string sandman is matched by the regex and"},{"type":"pitfall","text":"**Do not quote the regex** on the right of `=~`. `[[ $str =~ \"$re\" ]]` matches `$re` as a plain string, character for character, not as a regex. Quoting only part (`^a\".\"c$`) makes that part literal. Store tricky regexes in a variable (`re='...'`) and write `[[ $str =~ $re ]]`."},{"type":"code","code":"$ re=\"a.c\"\n$ [[ abc =~ $re ]]; echo $?\n0\n$ [[ abc =~ \"$re\" ]]; echo $?\n1","caption":"Unquoted, the . in the regex means any character, so abc matches. Quoted, Bash looks for the literal text a.c."},{"type":"check","q":"Does `[[ sandman =~ and ]]` succeed? Why?","a":"Yes. Without anchors, `=~` succeeds if the pattern appears **anywhere** in the string, and `sandman` contains `and`."},{"type":"md","text":"### Metacharacters\n\nA regex is made of ordinary characters, which match themselves, and **metacharacters**, which have special meaning. Learn this table exactly as the course states it:\n\n| Metacharacter | Meaning |\n|---|---|\n| `^` | **anchor**: matches the beginning of the line (when first in the expression) |\n| `$` | **anchor**: matches the end of the line (when last in the expression) |\n| `.` | matches **any single character** |\n| `[ ]` | **bracket expression**: matches any single character inside the brackets |\n| `[^ ]` | matches any single character **not** inside the brackets |\n| `( )` | a **subexpression** (group) |\n| `*` | the preceding element **zero or more** times |\n| `?` | the preceding element **zero or one** time |\n| `+` | the preceding element **one or more** times |\n| `{m,n}` | the preceding element at least m and at most n times |\n| vertical bar (see below) | **choice**: matches the expression before or after it |\n\nMetacharacters **lose their special meaning inside square brackets**, so `[.]` matches a literal dot and `[(]` a literal parenthesis."},{"type":"md","text":"Examples (all from the notebook):\n\n| Regex | Matches |\n|---|---|\n| `hello` | any string containing the substring `hello` |\n| `^hello$` | exactly `hello` |\n| `^.ello$` | `1ello`, `Aello`, `jello`, ... (any one character, then `ello`) |\n| `^h..lo$` | `h11lo`, `hAylo`, `h@Mlo`, ... |\n| `^s[aei]t$` | `sat`, `set`, `sit` |\n| `^s[a-z]t$` | `sat`, `sbt`, ..., `szt` |\n| `^s[-a-z]t$` | `s-t`, `sat`, ..., `szt` (a `-` first in brackets is literal) |\n| `^file[0-9]$` | `file0`, ..., `file9` |\n| `^a[.]c$` | only `a.c` |\n\nAnchors matter: `hello` matches `Say hello`, but `^hello$` matches only the exact string `hello`. When a question says \"strings that **are** ...\" you almost always need both `^` and `$`."},{"type":"check","q":"Which strings does `^s[aei]t$` match? Does it match `seat`?","a":"Exactly `sat`, `set`, `sit`. Not `seat`: a bracket expression matches **one** character, and `^...$` forces the whole string to be three characters."},{"type":"md","text":"### Atoms and quantifiers\n\nAn **atom** is a single (ordinary) character, a bracket expression, or a subexpression `( )`. A **quantifier** (`*`, `?`, `+`, `{m,n}`) says how many times **the atom just before it** must match. That is the exam answer for Quiz 2 Q1A: *`?` means zero or one instances of the preceding atom.*\n\n| Regex | Matches |\n|---|---|\n| `^.*$` | all strings, including the empty string |\n| `^.+$` | all non-empty strings |\n| `^.?$` | the empty string and all strings of length one |\n| `[0-9]` | any string containing at least one digit |\n| `^[0-9]+$` | any unsigned integer (only digits, at least one) |\n| `^-[0-9]+$` | any negative integer |\n| `^[-+]?[0-9]+$` | any signed or unsigned integer |\n| `^[-+]?[[:digit:]]+$` | the same, using a POSIX class |\n| `^xa{1}$` | `xa` |\n| `^xa{1,}$` | `x` followed by one or more `a`s |\n| `^xa{1,3}$` | `xa`, `xaa`, or `xaaa` |\n| `^(abc)+$` | `abc`, `abcabc`, `abcabcabc`, ... |"},{"type":"code","code":"$ ./test_regex.sh color '^colou?r$'\nThe string color is matched by the regex ^colou?r$\n$ ./test_regex.sh colouur '^colou?r$'\nThe string colouur is not matched by the regex ^colou?r$","caption":"u? means: zero or one u. Single quotes stop Bash from touching $ and ? before the script sees them."},{"type":"pitfall","text":"A quantifier applies only to the **one atom** right before it. `^ab+$` matches `ab`, `abb`, `abbb` (more b's), not `abab`. To repeat several characters, group them: `^(ab)+$`."},{"type":"check","q":"What does the metacharacter `?` mean in a regular expression? (Quiz 2 Q1A)","a":"Zero or one instances (occurrences) of the preceding atom."},{"type":"md","text":"### POSIX character classes\n\nInside a bracket expression you can name a whole **class** of characters. Note the **double** brackets: the outer `[ ]` is the bracket expression, the inner `[: :]` is the class name.\n\n| Class | Matches one ... |\n|---|---|\n| `[[:digit:]]` | digit, same as `[0-9]` |\n| `[[:alpha:]]` | letter |\n| `[[:upper:]]` / `[[:lower:]]` | uppercase / lowercase letter |\n| `[[:alnum:]]` | letter or digit |\n| `[[:space:]]` | whitespace character (space, tab, newline, ...) |\n| `[[:blank:]]` | space or tab |\n| `[[:punct:]]` | punctuation/symbol character, such as `! @ # . , -` |\n\nThese are what Assignment 3's `testpw.sh` uses: `[[ $pw =~ [[:digit:]] ]]` is true if the password contains a digit anywhere.\n\nA note on ranges like `[a-z]`: in some locales (language settings) ranges can behave unexpectedly. The course examples (and this app) assume the standard `C` locale, where `[a-z]` is exactly the 26 lowercase letters. `[[:lower:]]` always means lowercase letters."},{"type":"check","q":"Write a test that is true if the string in `pw` contains at least one whitespace character.","a":"`[[ $pw =~ [[:space:]] ]]` (no anchors, so it matches anywhere in the string)."},{"type":"md","text":"### Choice `|` and subexpressions `( )`\n\nThe vertical bar `|` is the **choice** operator: `a|b` matches anything matching `a` **or** `b`. It has the **lowest** precedence: it splits the *whole* regex into two alternatives unless parentheses limit it.\n\n- `a|b` (alternatives `a` and `b`): any string containing an `a` or a `b`\n- `^b|cat$` (alternatives `^b` and `cat$`): any string starting with `b` **or** ending with `cat`\n- `^b|(^c)at$` (alternatives `^b` and `(^c)at$`): any string starting with `b`, or the string `cat`\n- `(^b|^c)at$` (alternatives `^b` and `^c`, inside the group): exactly `bat` or `cat`\n\nSo `^(19|20)[0-9][0-9]$` matche
