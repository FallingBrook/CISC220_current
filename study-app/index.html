 number of arguments\" >&2\n    exit 1\nfi\nif (( $# == 0 )); then\n    echo $RANDOM\nelif (( $# == 1 )); then\n    n=$(( $RANDOM % $1 ))\n    echo $n\nelse\n    n=$(( $RANDOM % ($2 - $1) + $1 ))\n    echo $n\nfi\n```\n\n`./rand.sh 10` prints a number from 0 to 9; `./rand.sh 30 40` prints one from 30 to 39."},{"type":"check","q":"Write an expression that gives a random die roll from 1 to 6.","a":"`$(( RANDOM % 6 + 1 ))`"},{"type":"md","text":"### Key points\n\n- Integers only: `/` drops the fraction, `%` is the remainder, `**` is power.\n- `(( x = expr ))` does arithmetic and assignment; no `$` needed on names inside.\n- `$(( expr ))` produces the value as text: `echo $(( a + b ))`, `n=$(( ${#s} / 2 ))`.\n- `(( expr ))` succeeds (status 0) when `expr` is non-zero, so `if (( $# != 2 )); then ...` works.\n- `$RANDOM % n` gives 0 to n-1."}]}],"flashcards":[{"id":"d4-fc-01","topic":"d4-scripts","front":"What must the first line of a Bash script be, and what is it called?","back":"`#!/bin/bash`, the **shebang** (hash-bang). It names the program that interprets the script."},{"id":"d4-fc-02","topic":"d4-scripts","front":"How do you make `go.sh` executable for yourself and run it from its directory?","back":"`chmod u+x go.sh` then `./go.sh`"},{"id":"d4-fc-03","topic":"d4-scripts","front":"How can you run `go.sh` without execute permission?","back":"`bash go.sh` (Bash only needs to read the file)."},{"id":"d4-fc-04","topic":"d4-scripts","front":"Why `./go.sh` and not just `go.sh`?","back":"Bare names are looked up only in the directories on the path, which normally does not include the current directory. `./go.sh` is a pathname to the file."},{"id":"d4-fc-05","topic":"d4-scripts","front":"What character starts a comment, and where does the comment end?","back":"`#`; it runs to the end of the line. A quoted or escaped `#` is not a comment."},{"id":"d4-fc-06","topic":"d4-scripts","front":"`$0`","back":"The pathname used to run the script, e.g. `./trash.sh`."},{"id":"d4-fc-07","topic":"d4-scripts","front":"`$1`, `$2`, ..., `$9`","back":"The first, second, ..., ninth command line argument (empty if not given)."},{"id":"d4-fc-08","topic":"d4-scripts","front":"How do you get the tenth argument? What does `$10` mean?","back":"`${10}`. `$10` is `$1` followed by the character `0`."},{"id":"d4-fc-09","topic":"d4-scripts","front":"`$#`","back":"The number of command line arguments (not counting `$0`). Quiz 1: print it with `echo $#`."},{"id":"d4-fc-10","topic":"d4-scripts","front":"`\"$@\"`","back":"All the command line arguments, each as a separate word, exactly as given: `\"$1\" \"$2\" ...`"},{"id":"d4-fc-11","topic":"d4-scripts","front":"`\"$*\"` vs `\"$@\"`","back":"`\"$*\"` joins all arguments into one string separated by spaces; `\"$@\"` keeps them as separate words."},{"id":"d4-fc-12","topic":"d4-scripts","front":"`$?`","back":"The exit status of the most recently completed command (0 = success, 1-255 = failure)."},{"id":"d4-fc-13","topic":"d4-scripts","front":"How does a script print a message to standard error?","back":"`echo \"message\" >&2`"},{"id":"d4-fc-14","topic":"d4-scripts","front":"What does `exit 3` do in a script?","back":"Stops the script immediately with exit status 3."},{"id":"d4-fc-15","topic":"d4-scripts","front":"What is a script's exit status if it never calls `exit`?","back":"The exit status of the last command it ran."},{"id":"d4-fc-16","topic":"d4-scripts","front":"Is using an argument that was not given (e.g. `$3` with 2 arguments) an error?","back":"No. It expands to the empty string."},{"id":"d4-fc-17","topic":"d4-variables","front":"Assign the string `hello world` to variable `msg`.","back":"`msg=\"hello world\"` (no spaces around `=`; quotes keep the space)."},{"id":"d4-fc-18","topic":"d4-variables","front":"What does `x = 5` do?","back":"Runs a command named `x` with arguments `=` and `5` (usually `x: command not found`)."},{"id":"d4-fc-19","topic":"d4-variables","front":"Concatenate `str1` and `str2` into `str3` (Quiz 1).","back":"`str3=$str1$str2`"},{"id":"d4-fc-20","topic":"d4-variables","front":"When must you write `${var}` instead of `$var`?","back":"When the next character could be part of a name (letter, digit, `_`), e.g. `\"${in}_.bak\"`; and for positional parameters 10 and up."},{"id":"d4-fc-21","topic":"d4-variables","front":"Why does `out=\"$in_.bak\"` give `.bak`?","back":"Bash reads the variable name `in_`, which is unset, so it expands to empty."},{"id":"d4-fc-22","topic":"d4-variables","front":"What does an unset variable expand to?","back":"The empty string (no error)."},{"id":"d4-fc-23","topic":"d4-variables","front":"How do you remove a variable?","back":"`unset var`"},{"id":"d4-fc-24","topic":"d4-variables","front":"Why write `cp \"$in\" \"$out\"` rather than `cp $in $out`?","back":"Unquoted expansions are split at spaces (and globbed), so a filename like `my file` becomes two arguments."},{"id":"d4-fc-25","topic":"d4-variables","front":"Store the octal permissions of the file named in `src` in `perm`.","back":"`perm=$(stat -c %a \"$src\")`"},{"id":"d4-fc-26","topic":"d4-variables","front":"Which expansions happen on the right of an assignment, and which do not?","back":"Tilde, parameter, command substitution and arithmetic do; brace and filename (glob) expansion do not."},{"id":"d4-fc-27","topic":"d4-variables","front":"Does Bash have floating-point arithmetic?","back":"No. Values are strings; digit strings can be used as integers."},{"id":"d4-fc-28","topic":"d4-strings","front":"`${#s}`","back":"The length of the string in `s`."},{"id":"d4-fc-29","topic":"d4-strings","front":"`${s:offset}`","back":"The substring of `s` from index `offset` (0-based) to the end."},{"id":"d4-fc-30","topic":"d4-strings","front":"`${s:offset:length}`","back":"`length` characters of `s` starting at index `offset`."},{"id":"d4-fc-31","topic":"d4-strings","front":"Last 3 characters of `s`?","back":"`${s: -3}` (the space before `-` is required)."},{"id":"d4-fc-32","topic":"d4-strings","front":"Print the first half of `s` (even length) (Quiz 1).","back":"`n=$(( ${#s} / 2 ))` then `echo \"${s:0:n}\"`"},{"id":"d4-fc-33","topic":"d4-strings","front":"`${s#pattern}`","back":"Remove the **shortest** front part of `s` matching `pattern`."},{"id":"d4-fc-34","topic":"d4-strings","front":"`${s##pattern}`","back":"Remove the **longest** front part of `s` matching `pattern`."},{"id":"d4-fc-35","topic":"d4-strings","front":"`${s%pattern}`","back":"Remove the **shortest** end part of `s` matching `pattern`."},{"id":"d4-fc-36","topic":"d4-strings","front":"`${s%%pattern}`","back":"Remove the **longest** end part of `s` matching `pattern`."},{"id":"d4-fc-37","topic":"d4-strings","front":"Directory part of pathname `p` (Quiz 1 Q5)?","back":"`${p%/*}`"},{"id":"d4-fc-38","topic":"d4-strings","front":"Filename part of pathname `p` (also the script name from `$0`)?","back":"`${p##*/}`, e.g. `${0##*/}`"},{"id":"d4-fc-39","topic":"d4-strings","front":"Filename `f` without its last extension? Just the extension?","back":"`${f%.*}`; `${f##*.}`"},{"id":"d4-fc-40","topic":"d4-strings","front":"`${s/pat/rep}` vs `${s//pat/rep}`","back":"One slash replaces the first match; two slashes replace every match. Empty `rep` deletes."},{"id":"d4-fc-41","topic":"d4-strings","front":"`${s^^}` and `${s,,}`","back":"`s` in all uppercase; `s` in all lowercase. (`${s^}` / `${s,}` change only the first character.)"},{"id":"d4-fc-42","topic":"d4-strings","front":"`${var:-word}`","back":"`word` if `var` is unset or empty, otherwise the value of `var` (`var` is not changed)."},{"id":"d4-fc-43","topic":"d4-strings","front":"`${var-word}` (no colon)","back":"`word` only if `var` is unset; an empty `var` stays empty."},{"id":"d4-fc-44","topic":"d4-strings","front":"`${var:=word}`","back":"Like `:-`, but also assigns `word` to `var`. Not allowed on positional parameters."},{"id":"d4-fc-45","topic":"d4-strings","front":"`${var:+word}`","back":"`word` if `var` is set and non-empty, otherwise nothing."},{"id":"d4-fc-46","topic":"d4-strings","front":"`${var:?word}`","back":"If `var` is unset or empty, print `word` to stderr and exit the script; otherwise the value."},{"id":"d4-fc-47","topic":"d4-arithmetic","front":"`(( x = a + b ))` vs `x=$(( a + b ))`","back":"Both set `x` to the sum. `(( ))` is a command that does the assignment; `$(( ))` is an expansion that produces the value as text."},{"id":"d4-fc-48","topic":"d4-arithmetic","front":"`$(( 17 / 5 ))`, `$(( 17 % 5 ))`, `$(( 2 ** 5 ))`","back":"`3`, `2`, `32`"},{"id":"d4-fc-49","topic":"d4-arithmetic","front":"Value of an unset, empty, or non-numeric variable inside `(( ))`?","back":"0"},{"id":"d4-fc-50","topic":"d4-arithmetic","front":"Exit status of `(( expr ))`?","back":"0 if `expr` is non-zero (true); 1 if `expr` is 0 (false)."},{"id":"d4-fc-51","topic":"d4-arithmetic","front":"Check that a script got exactly 2 arguments.","back":"`if (( $# != 2 )); then echo \"Usage: s.sh a b\" >&2; exit 1; fi`"},{"id":"d4-fc-52","topic":"d4-arithmetic","front":"`$RANDOM`","back":"A random integer 0 to 32767 each time it is used. `$(( RANDOM % n ))` is 0 to n-1."},{"id":"d4-fc-53","topic":"d4-arithmetic","front":"What does `x=5; x=$x+1; echo $x` print?","back":"`5+1`. Assignment does no arithmetic; use `x=$(( x + 1 ))` or `(( x++ ))`."}],"quiz":[{"id":"d4-q-01","topic":"d4-scripts","type":"mcq","q":"You just saved `hello.sh` (permissions `rw-r--r--`) in the current directory. Which command runs it **without** changing its permissions?","options":["`./hello.sh`","`hello.sh`","`bash hello.sh`","`run hello.sh`"],"answer":2,"explain":"`bash hello.sh` only needs read permission. `./hello.sh` fails with `Permission denied` until you `chmod u+x hello.sh`. Plain `hello.sh` is searched for on the path (not the current directory). `run` is not a command."},{"id":"d4-q-02","topic":"d4-scripts","type":"output","q":"`args.sh` contains:\n\n```bash\n#!/bin/bash\necho \"$#: $1 | $2\"\n```\n\nWhat does `./args.sh \"a b\" c` print?","code":"./args.sh \"a b\" c","answer":"2: a b | c","explain":"The quotes make `a b` a single argument, so there are 2 arguments, `$1` is `a b`, and `$2` is `c`."},{"id":"d4-q-03","topic":"d4-scripts","type":"output","q":"`ten.sh` contains:\n\n```bash\n#!/bin/bash\necho \"$10 ${10}\"\n```\n\nWhat does this print?","code":"./ten.sh a b c d e f g h i j","answer":"a0 j","explain":"`$10` is `$1` (`a`) followed by the character `0`. Only `${10}` gives the tenth argument, `j`."},{"id":"d4-q-04","topic":"d4-strings","type":"output","q":"`hi.sh` is in the directory `scripts` and contains:\n\n```bash\n#!/bin/bash\necho \"$0\"\necho \"${0##*/}\"\n```\n\nWhat is printed?","code":"./scripts/hi.sh","answer":"./scripts/hi.sh\nhi.sh","explain":"`$0` is exactly the path used to run the script. `${0##*/}` removes the longest front part ending in `/`, leaving the script name."},{"id":"d4-q-05","topic":"d4-scripts","type":"mcq","q":"Which line in a script prints `error` to **standard error**?","options":["`echo error 2>&1`","`echo error >&2`","`echo error > 2`","`echo >&2 error > /dev/null`"],"answer":1,"explain":"`>&2` sends stdout into stderr. `2>&1` does the opposite (stderr into stdout). `> 2` writes to a file named `2`. The last one redirects stdout again to `/dev/null` after `>&2`, so the message is lost (the later redirection wins)."},{"id":"d4-q-06","topic":"d4-scripts","type":"short","q":"From inside a script, how do you print the number of command line arguments? (Quiz 1)","answer":"`echo $#`","explain":"Accept `echo \"$#\"` or `echo ${#}`."},{"id":"d4-q-07","topic":"d4-scripts","type":"short","q":"Write the two lines a script uses to print `Usage: go.sh file` to standard error and stop with exit status 1.","answer":"```bash\necho \"Usage: go.sh file\" >&2\nexit 1\n```","explain":"The `>&2` can also come first: `>&2 echo ...`. Any non-zero status signals failure, but use the one the question asks for."},{"id":"d4-q-08","topic":"d4-variables","type":"mcq","q":"Which line stores the value 5 in variable `x`?","options":["`x = 5`","`x=5`","`$x=5`","`x =5`"],"answer":1,"explain":"No spaces around `=`, and no `$` on the left. `x = 5` and `x =5` run a command named `x`; `$x=5` expands `x` first and tries to run the result as a command."},{"id":"d4-q-09","topic":"d4-variables","type":"output","q":"What does this print?","code":"a=2\nb=\"some string\"\nc=$a$b\necho \"$c\"","answer":"2some string","explain":"Writing two expansions side by side concatenates them."},{"id":"d4-q-10","topic":"d4-variables","type":"output","q":"What does this print? (The variable `in_` has never been assigned.)","code":"in=\"my file\"\nout=\"$in_.bak\"\necho \"[$out]\"\nout=\"${in}_.bak\"\necho \"[$out]\"","answer":"[.bak]\n[my file_.bak]","explain":"`$in_` is the unset variable `in_`, which expands to empty. Braces end the name: `${in}_.bak`. This is the notebook's `bad_backup.sh` bug."},{"id":"d4-q-11","topic":"d4-variables","type":"output","q":"What does this print?","code":"yrs={2020..2029..3}\necho \"$yrs\"\nsum=$(( 5 + 3 ))\necho \"$sum\"","answer":"{2020..2029..3}\n8","explain":"Brace expansion does not happen in an assignment, so `yrs` holds the literal text. Arithmetic expansion does happen."},{"id":"d4-q-12","topic":"d4-variables","type":"output","q":"What does this print?","code":"name=Sam\necho \"Hello, ${name}!\"\necho 'Hello, ${name}!'","answer":"Hello, Sam!\nHello, ${name}!","explain":"Double quotes allow parameter expansion; single quotes turn all expansion off."},{"id":"d4-q-13","topic":"d4-variables","type":"mcq","q":"A script runs `cp $1 $2` and is called as `./c.sh \"my notes\" backup`. What happens?","options":["It copies `my notes` to `backup`","`cp` receives three arguments `my`, `notes`, `backup`, so it tries to copy two files named `my` and `notes` into a directory `backup`","Bash reports a syntax error","It copies `my notes` to a file named `$2`"],"answer":1,"explain":"Unquoted `$1` is split at the space. Write `cp \"$1\" \"$2\"`."},{"id":"d4-q-14","topic":"d4-variables","type":"short","q":"How can you concatenate two strings stored in `str1` and `str2` and store the result in `str3`? (Quiz 1)","answer":"`str3=$str1$str2`","explain":"Also correct: `str3=\"$str1$str2\"` or `str3=${str1}${str2}`."},{"id":"d4-q-15","topic":"d4-variables","type":"short","q":"Write one line that stores the octal permissions of the file whose name is in `src` in a variable `perm` (use `stat -c %a`).","answer":"`perm=$(stat -c %a \"$src\")`","explain":"Command substitution `$( )` captures the output. The quotes around `$src` are required in case the name has spaces."},{"id":"d4-q-16","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=\"abcdefghij\"\necho \"${s:2:3}\"\necho \"${s: -3}\"\necho \"${s:1:-2}\"","answer":"cde\nhij\nbcdefgh","explain":"Indexes start at 0. `${s:2:3}` is 3 characters from index 2. `${s: -3}` is the last 3. A negative length stops that many characters before the end."},{"id":"d4-q-17","topic":"d4-strings","type":"output","q":"What does this print? (Notice there is no space after the colon.)","code":"s=\"abcdefghij\"\necho \"${s:-3}\"","answer":"abcdefghij","explain":"`:-` is the default-value expansion: `s` is set and non-empty, so its value is used. For the last 3 characters you need `${s: -3}`."},{"id":"d4-q-18","topic":"d4-strings","type":"output","q":"What does this print?","code":"f=\"file.txt.zip\"\necho \"${f#*.}\"\necho \"${f##*.}\"\necho \"${f%.*}\"\necho \"${f%%.*}\"","answer":"txt.zip\nzip\nfile.txt\nfile","explain":"`#` removes from the front, `%` from the end; one symbol = shortest match, two = longest."},{"id":"d4-q-19","topic":"d4-strings","type":"output","q":"What does this print?","code":"p=\"/home/user1/somedir/myfile\"\necho \"${p%/*}\"\necho \"${p##*/}\"","answer":"/home/user1/somedir\nmyfile","explain":"`${p%/*}` removes the shortest end part matching `/*` (`/myfile`). `${p##*/}` removes the longest front part matching `*/`."},{"id":"d4-q-20","topic":"d4-strings","type":"output","q":"What does this print?","code":"p=\"./myfile\"\ndir=${p%/*}\necho \"$dir/.trash\"\np=\"myfile\"\necho \"${p%/*}\"","answer":"./.trash\nmyfile","explain":"With `./myfile`, the directory is `.`. With no `/` at all, the pattern does not match and nothing is removed."},{"id":"d4-q-21","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=\"sparring with a purple porpoise\"\necho \"${s/p/t}\"\necho \"${s//p/}\"\necho \"$s\"","answer":"starring with a purple porpoise\nsarring with a urle oroise\nsparring with a purple porpoise","explain":"One slash replaces the first `p`; two slashes with an empty replacement delete every `p`. The variable itself is never changed."},{"id":"d4-q-22","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=abcdef\nn=$(( ${#s} / 2 ))\necho \"${s:0:n}\" \"${s:n}\"","answer":"abc def","explain":"`${#s}` is 6, so `n` is 3. `${s:0:n}` is the first 3 characters and `${s:n}` the rest. (Quiz 1 Q3A.)"},{"id":"d4-q-23","topic":"d4-strings","type":"output","q":"What does this print?","code":"unset v\necho \"[${v-none}] [${v:-none}]\"\nv=\"\"\necho \"[${v-none}] [${v:-none}]\"","answer":"[none] [none]\n[] [none]","explain":"Without a colon only *unset* triggers the default; with a colon, *empty* does too."},{"id":"d4-q-24","topic":"d4-strings","type":"output","q":"What does this print?","code":"unset v\necho \"${v:=hello}\"\necho \"$v\"\nw=abc\necho \"[${w:+set}]\"","answer":"hello\nhello\n[set]","explain":"`:=` substitutes and also assigns the default, so `v` keeps `hello`. `:+` gives the alternate word because `w` is non-empty."},{"id":"d4-q-25","topic":"d4-strings","type":"mcq","q":"`f=\"photo.backup.jpg\"`. Which expansion gives `photo.backup.png`?","options":["`${f%%.*}.png`","`${f%.*}.png`","`${f#*.}.png`","`${f/jpg/.png}`"],"answer":1,"explain":"`${f%.*}` removes only the last extension (`photo.backup`). `%%` removes `.backup.jpg` (gives `photo.png`). `#*.` removes the front (`backup.jpg.png`). The last gives `photo.backup..png`."},{"id":"d4-q-26","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=7; y=2\necho $(( x / y )) $(( x % y )) $(( x ** y ))","answer":"3 1 49","explain":"Integer division drops the fraction; `%` is the remainder; `**` is power."},{"id":"d4-q-27","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=5\nx=$x+1\necho $x\nx=5\nx=$(( x + 1 ))\necho $x","answer":"5+1\n6","explain":"A plain assignment just builds a string. Only `$(( ))` (or `(( ))`) does arithmetic."},{"id":"d4-q-28","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"x=abc; y=5\n(( z = x + y ))\necho $z\n(( z++ ))\n(( z *= 2 ))\necho $z","answer":"5\n12","explain":"A non-numeric value counts as 0, so `z` is 5; then 6; then 12."},{"id":"d4-q-29","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"(( 0 + 0 ))\necho $?\n(( 2 - 1 ))\necho $?","answer":"1\n0","explain":"`(( ))` succeeds (status 0) when the value is non-zero and fails (status 1) when it is 0."},{"id":"d4-q-30","topic":"d4-arithmetic","type":"output","q":"What does this print?","code":"echo $(( 2 + 3 * 4 )) $(( (2 + 3) * 4 ))\necho $(( 10 / 3 * 3 )) $(( 10 * 3 / 3 ))","answer":"14 20\n9 10","explain":"Normal precedence (`*` before `+`). `10 / 3` is 3, so `10 / 3 * 3` is 9: the fraction is lost before multiplying."},{"id":"d4-q-31","topic":"d4-arithmetic","type":"mcq","q":"Which line prints a random integer from 1 to 10 inclusive?","options":["`echo $(( RANDOM % 10 ))`","`echo $(( RANDOM % 10 + 1 ))`","`echo $(( RANDOM % 11 ))`","`echo $RANDOM % 10 + 1`"],"answer":1,"explain":"`RANDOM % 10` is 0 to 9, plus 1 gives 1 to 10. `% 11` gives 0 to 10. The last has no arithmetic expansion, so it prints a number followed by the literal text `% 10 + 1`."},{"id":"d4-q-32","topic":"d4-arithmetic","type":"short","q":"Write the start of a script that requires **at least** 2 arguments: if fewer are given it prints `need 2 args` to standard error and exits with status 1.","answer":"```bash\n#!/bin/bash\n\nif (( $# < 2 )); then\n    echo \"need 2 args\" >&2\n    exit 1\nfi\n```","explain":"Also correct: `[[ $# -lt 2 ]]` (conditionals, next day). `(( $# < 2 ))` compares numbers."}],"write":[{"id":"d4-w-01","topic":"d4-variables","stage":"worked","marks":4,"prompt":"**Quiz 1, Question 4 (4 marks).** Write a script that accepts two command line arguments that are both file names. The first argument is the name of the source file, and the second is the name of the destination file.\n\nThe script sets the permissions of the destination file to be equal to the permissions of the source file (it copies the permissions from the source to the destination).\n\nNo error checking is required: two arguments are always given and both files exist. Recall that `stat -c %a filename` prints the three-digit octal permissions of `filename`.","starter":"","solution":"#!/bin/bash\n\n# copyperm.sh: copy the permissions of file $1 to file $2\n\nsrc=$1\ndest=$2\n\n# permissions of src, e.g. 640\nperm=$(stat -c %a \"$src\")\n\nchmod \"$perm\" \"$dest\"","explain":"1. `#!/bin/bash` makes it a Bash script.\n2. `src=$1` and `dest=$2` give the arguments readable names. (Quoting the right side of a plain assignment is optional.)\n3. `$(stat -c %a \"$src\")` runs `stat` and is replaced by its output, e.g. `640`. Storing it in `perm` is **command substitution into a variable**.\n4. `chmod` accepts an octal mode (Day 2), so `chmod \"$perm\" \"$dest\"` sets exactly the same permissions.\n\nThe posted solution marks the quotes around `\"$src\"` and `\"$dest\"` as **required**: without them a filename such as `my notes.txt` is split into two arguments. Quoting `\"$perm\"` is harmless and a good habit.\n\nA one-line version is also correct: `chmod \"$(stat -c %a \"$1\")\" \"$2\"`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and using `$1` / `$2` for source and destination"},{"marks":1,"item":"Gets the source permissions with command substitution `$(stat -c %a ...)`"},{"marks":1,"item":"Applies them with `chmod PERM dest`"},{"marks":1,"item":"Filename expansions quoted: `\"$src\"` and `\"$dest\"`"}],"pitfalls":["Forgetting `$( )`: `perm=stat -c %a $src` is not command substitution.","Unquoted `$src` / `$dest` break on filenames with spaces.","Using `ls -l` and trying to parse the output instead of `stat -c %a`."]},{"id":"d4-w-02","topic":"d4-strings","stage":"worked","marks":10,"prompt":"**Quiz 1, Question 5 (10 marks).** Create a script `trash.sh` that moves a single file into a hidden trashcan directory by performing these steps:\n\n1. finds the name of the directory `dir` that the file is located in\n2. creates a directory named `.trash` in `dir`\n3. changes the permissions of `.trash` so that the owner has all permissions and all other users have none\n4. prints the message `moving filename to the trashcan` where `filename` is the first command line argument\n5. moves the file into the `.trash` directory created in Step 2\n\nNo error checking is required: one argument is always given, it is the pathname of a file you own, and the pathname always includes the directory (for example `./myfile` or `/home/user1/somedir/myfile`). Ignore the error from Step 2 if `.trash` already exists.\n\nHint: `${str%pattern}` removes the shortest trailing part of `str` that matches `pattern`.","starter":"","solution":"#!/bin/bash\n\n# trash.sh: move a file into a hidden .trash directory next to it\n\npathname=$1\n\n# Step 1: the directory part of the pathname\ndir=${pathname%/*}\n\n# Step 2\ntrashdir=$dir/.trash\nmkdir \"$trashdir\"\n\n# Step 3\nchmod 700 \"$trashdir\"        # or: chmod u=rwx,go= \"$trashdir\"\n\n# Step 4\necho \"moving $pathname to the trashcan\"\n\n# Step 5\nmv \"$pathname\" \"$trashdir\"","explain":"- **Step 1.** `${pathname%/*}` removes the shortest end part matching `/*`, that is, the last `/` and the filename. `./myfile` gives `.` and `/home/user1/somedir/myfile` gives `/home/user1/somedir`. This is why the question guarantees the pathname contains a `/`.\n- **Step 2.** Building `trashdir=$dir/.trash` once avoids typing it three times. `mkdir \"$trashdir\"` creates it.\n- **Step 3.** Owner `rwx`, group and others nothing is `700` in octal, or symbolically `u=rwx,go=`.\n- **Step 4.** Double quotes let `$pathname` expand inside the message.\n- **Step 5.** `mv FILE DIR` moves the file into the directory.\n\n**Watch out for the typo in the posted solution:** it ends with `mv \"$pathname $trashdir\"`. Those quotes make the two expansions **one** argument (`./myfile ./.trash`), so `mv` complains about a missing destination. The correct line quotes each expansion separately: `mv \"$pathname\" \"$trashdir\"`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and uses `$1` as the pathname"},{"marks":2,"item":"Step 1: `dir=${pathname%/*}` (or equivalent)"},{"marks":1,"item":"Step 2: `mkdir \"$dir/.trash\"`"},{"marks":2,"item":"Step 3: `chmod 700` or `chmod u=rwx,go=` on `.trash`"},{"marks":1,"item":"Step 4: `echo \"moving $pathname to the trashcan\"` with the exact message"},{"marks":2,"item":"Step 5: `mv \"$pathname\" \"$dir/.trash\"`"},{"marks":1,"item":"All pathnames quoted as separate arguments"}],"pitfalls":["`mv \"$pathname $trashdir\"` (one quoted string) is wrong: quote each argument on its own.","`${pathname#*/}` or `${pathname%%/*}` remove the wrong part. Test your expansion on `/home/user1/somedir/myfile`.","`chmod 600` is not \"all permissions\" for the owner: a directory needs `x` to be entered.","Single quotes around the message would print `$pathname` literally."]},{"id":"d4-w-03","topic":"d4-strings","stage":"faded","marks":4,"prompt":"Write `newext.sh FILE EXT` that renames `FILE` so that its **last** extension is replaced by `EXT`. For example `./newext.sh report.txt md` renames `report.txt` to `report.md`, and `./newext.sh archive.tar.gz zip` renames `archive.tar.gz` to `archive.tar.zip`. Filenames may contain spaces. No error checking is required. Fill in the blanks.","starter":"#!/bin/bash\n\n# newext.sh: replace the last extension of $1 with $2\n\nf=____\next=____\n\nbase=${f____}\nmv ____ ____","solution":"#!/bin/bash\n\n# newext.sh: replace the last extension of $1 with $2\n\nf=$1\next=$2\n\nbase=${f%.*}\nmv \"$f\" \"$base.$ext\"","explain":"`${f%.*}` removes the **shortest** end part matching `.*`, which is only the last extension. `${f%%.*}` would remove `.tar.gz` and give `archive.zip`. In the `mv` destination, `\"$base.$ext\"` is safe without braces because `.` cannot be part of a variable name.","rubric":[{"marks":1,"item":"Arguments stored from `$1` and `$2`"},{"marks":1,"item":"`${f%.*}` (shortest match from the end)"},{"marks":1,"item":"New name built as base, `.`, extension"},{"marks":1,"item":"`mv` with both names quoted"}],"pitfalls":["Using `%%` removes every extension, not just the last.","Forgetting the `.` between base and extension gives `reportmd`."]},{"id":"d4-w-04","topic":"d4-strings","stage":"faded","marks":3,"prompt":"Write `swap.sh STRING` that prints the second half of `STRING` followed immediately by the first half, on one line. The first half has `${#s} / 2` characters (integer division). Examples: `./swap.sh abcdef` prints `defabc`; `./swap.sh abcde` prints `cdeab`. Fill in the blanks.","starter":"#!/bin/bash\n\n# swap.sh: print the second half of $1 then the first half\n\ns=$1\nn=____\nfirst=${s:____}\nsecond=${s:____}\necho \"____\"","solution":"#!/bin/bash\n\n# swap.sh: print the second half of $1 then the first half\n\ns=$1\nn=$(( ${#s} / 2 ))\nfirst=${s:0:n}\nsecond=${s:n}\necho \"$second$first\"","explain":"Same idea as Quiz 1 Q3A. `${s:0:n}` is the first `n` characters, `${s:n}` is everything from index `n` to the end. Concatenation is just writing `$second$first` side by side.","rubric":[{"marks":1,"item":"`n=$(( ${#s} / 2 ))`"},{"marks":1,"item":"`${s:0:n}` and `${s:n}` for the two halves"},{"marks":1,"item":"Prints them concatenated in the right order, quoted"}],"pitfalls":["`n=${#s} / 2` is not arithmetic; you need `$(( ))`.","`${s:n:n}` drops the last character when the length is odd."]},{"id":"d4-w-05","topic":"d4-arithmetic","stage":"faded","marks":5,"prompt":"Write `avg.sh A B` for two integers. If the script does not get **exactly** two arguments, it prints `Usage: avg.sh a b` to **standard error** and exits with status 1. Otherwise it prints one line, `average: Q remainder: R`, where `Q` and `R` are the quotient and remainder of `(A + B)` divided by 2. Example: `./avg.sh 7 4` prints `average: 5 remainder: 1`. Fill in the blanks.","starter":"#!/bin/bash\n\n# avg.sh: integer average of two numbers\n\nif (( ____ )); then\n    echo \"Usage: avg.sh a b\" ____\n    exit ____\nfi\n\nsum=____\necho \"average: ____ remainder: ____\"","solution":"#!/bin/bash\n\n# avg.sh: integer average of two numbers\n\nif (( $# != 2 )); then\n    echo \"Usage: avg.sh a b\" >&2\n    exit 1\nfi\n\nsum=$(( $1 + $2 ))\necho \"average: $(( sum / 2 )) remainder: $(( sum % 2 ))\"","explain":"`$#` is the number of arguments, and `(( $# != 2 ))` is true when it is not 2. `>&2` sends the usage message to standard error and `exit 1` stops the script. Arithmetic expansions can go straight inside the double-quoted message.","rubric":[{"marks":1,"item":"Tests `$#` against 2 with `(( $# != 2 ))` (or equivalent)"},{"marks":1,"item":"Usage message to standard error with `>&2`"},{"marks":1,"item":"`exit 1` on error"},{"marks":1,"item":"Sum computed with arithmetic expansion"},{"marks":1,"item":"Quotient with `/` and remainder with `%` printed in the exact format"}],"pitfalls":["`echo \"Usage...\"` without `>&2` goes to standard output.","`(( $# < 2 ))` lets 3 arguments through; the question says exactly two."]},{"id":"d4-w-06","topic":"d4-strings","stage":"blank","marks":8,"prompt":"Write a script `mkbackup.sh` that takes one command line argument, the pathname of a file. The pathname always includes the directory the file is in (for example `./notes.txt` or `/home/user1/docs/my notes.txt`).\n\n1. If the script does not get exactly one argument, print `Usage: mkbackup.sh pathname` to standard error and exit with status 1.\n2. Find the directory `dir` that the file is in, and the file's name `name` (without the directory).\n3. Create a directory named `backup` inside `dir`.\n4. Copy the file into `backup`, naming the copy `name.bak` (so `my notes.txt` is copied to `my notes.txt.bak`).\n5. Make the copy read-only for the owner and give no permissions to anyone else.\n6. Print `backed up NAME to DIR/backup` where `NAME` is the file's name and `DIR` is the directory.\n\nIgnore the error if `backup` already exists.","starter":"","solution":"#!/bin/bash\n\n# mkbackup.sh: copy a file into a backup directory next to it\n\nif (( $# != 1 )); then\n    echo \"Usage: mkbackup.sh pathname\" >&2\n    exit 1\nfi\n\npathname=$1\ndir=${pathname%/*}\nname=${pathname##*/}\n\nbackupdir=$dir/backup\nmkdir \"$backupdir\"\ncp \"$pathname\" \"$backupdir/$name.bak\"\nchmod 400 \"$backupdir/$name.bak\"\necho \"backed up $name to $backupdir\"","explain":"Running `./mkbackup.sh \"pics/old stuff/cat 1.jpg\"` prints `backed up cat 1.jpg to pics/old stuff/backup` and creates `pics/old stuff/backup/cat 1.jpg.bak` with permissions `r--------`.","rubric":[{"marks":1,"item":"Checks `$#` is exactly 1"},{"marks":1,"item":"Usage message to stderr and `exit 1`"},{"marks":1,"item":"`dir=${pathname%/*}`"},{"marks":1,"item":"`name=${pathname##*/}`"},{"marks":1,"item":"`mkdir` of `dir/backup`"},{"marks":1,"item":"`cp` to `backup/name.bak`"},{"marks":1,"item":"`chmod 400` (or `u=r,go=`) on the copy"},{"marks":1,"item":"Correct message, and all pathnames quoted"}],"pitfalls":["Swapping `%` and `##`: test them on `/home/user1/docs/a.txt` before you hand in.","Forgetting the quotes: the example name has spaces in both the directory and the file.","`chmod 400` must be applied to the copy, not the original or the directory."]},{"id":"d4-w-07","topic":"d4-strings","stage":"blank","marks":5,"prompt":"Write `userid.sh FIRST LAST` that prints a user id made of the **first letter of FIRST** followed by **at most the first 7 characters of LAST**, all in lowercase. If it does not get exactly 2 arguments, it prints `Usage: userid.sh first last` to standard error and exits with status 1.\n\nExamples: `./userid.sh Barry Cade` prints `bcade`; `./userid.sh Holly Fitzgerald` prints `hfitzger`.","starter":"","solution":"#!/bin/bash\n\n# userid.sh: make a user id from a first and last name\n\nif (( $# != 2 )); then\n    echo \"Usage: userid.sh first last\" >&2\n    exit 1\nfi\n\nfirst=$1\nlast=$2\nid=${first:0:1}${last:0:7}\necho \"${id,,}\"","explain":"`${last:0:7}` is safe for short names: asking for more characters than exist just gives the whole string (`Cade`). `${id,,}` converts every character to lowercase.","rubric":[{"marks":1,"item":"Argument count check with `$#`"},{"marks":1,"item":"Usage to stderr and `exit 1`"},{"marks":1,"item":"`${first:0:1}` for the first letter"},{"marks":1,"item":"`${last:0:7}` for at most 7 characters"},{"marks":1,"item":"Concatenates and lowercases with `${id,,}`"}],"pitfalls":["`${last:1:7}` starts at the second character: indexes start at 0.","`${id^^}` is uppercase; lowercase is `,,`."]},{"id":"d4-w-08","topic":"d4-arithmetic","stage":"blank","marks":5,"prompt":"Write `hms.sh SECONDS` that converts a number of seconds into hours, minutes and seconds and prints them in the form `1h 2m 5s` (for `./hms.sh 3725`). If it does not get exactly one argument it prints `Usage: hms.sh seconds` to standard error and exits with status 1. Use integer arithmetic only.","starter":"","solution":"#!/bin/bash\n\n# hms.sh: convert a number of seconds to hours, minutes and seconds\n\nif (( $# != 1 )); then\n    echo \"Usage: hms.sh seconds\" >&2\n    exit 1\nfi\n\ntotal=$1\nh=$(( total / 3600 ))\nm=$(( total % 3600 / 60 ))\ns=$(( total % 60 ))\necho \"${h}h ${m}m ${s}s\"","explain":"`3725 / 3600` is 1 hour. The leftover `3725 % 3600` is 125 seconds, and `125 / 60` is 2 minutes. `3725 % 60` is 5 seconds. The braces in `${h}h` are **required**: `$hh` would be the unset variable `hh`.","rubric":[{"marks":1,"item":"Argument count check, usage to stderr, `exit 1`"},{"marks":1,"item":"Hours with `/ 3600`"},{"marks":1,"item":"Minutes with `% 3600 / 60` (or equivalent)"},{"marks":1,"item":"Seconds with `% 60`"},{"marks":1,"item":"Output in the exact format, using `${h}h` style braces"}],"pitfalls":["`echo \"$hh $mm $ss\"` prints three empty values: braces are needed before the letters.","`total / 60` alone gives total minutes (62), not the minutes part (2)."]}]}],"mocks":{"exams":[{"id":"mockA","title":"Mock midterm A","minutes":50,"instructions":"This mock is **50 minutes** long. There are **5 questions** worth a total of **30 marks**. No aids are allowed. Write every answer by hand on paper first, then mark it with the rubric.\n\n- Short answers should be very brief (usually one command).\n- In scripts, double quote your variable expansions (`\"$var\"`): markers take marks off for missing quotes.\n- Error checking is required only where the question asks for it.\n- Afterwards, type your answers into the Day 7 drills (`./drill.sh start 7`) to test them.","questions":[{"id":"mockA-1","title":"Question 1","marks":6,"prompt":"**1 mark each, 6 marks total.** Consider a filesystem with the directory structure shown below (`trip` is a directory; `.draft` is a hidden file). Your answer to each part should be very brief.\n\n```text\n/\n└── home\n    └── user1\n        ├── grades.csv\n        ├── notes\n        │   ├── .draft\n        │   ├── lec01.txt\n        │   ├── lec02.txt\n        │   └── todo.md\n        ├── photos\n        │   ├── img1.jpg\n        │   ├── img2.JPG\n        │   ├── logo.png\n        │   └── trip\n        └── scripts\n            ├── backup.sh\n            ├── run.sh\n            └── tidy.sh\n```","parts":[{"id":"mockA-1a","label":"A","marks":1,"prompt":"What is the absolute pathname of the file `backup.sh`?","solution":"`/home/user1/scripts/backup.sh`","rubric":[{"marks":1,"item":"Starts at the root `/` and names every directory in order; no `.` or `..`"}],"topics":["paths"]},{"id":"mockA-1b","label":"B","marks":1,"prompt":"Suppose that the current working directory is `photos`. What is the relative pathname of the file `lec02.txt`?","solution":"`../notes/lec02.txt`","rubric":[{"marks":1,"item":"Goes up with `..` to `user1` and then down into `notes`; must not start with `/`"}],"topics":["paths"]},{"id":"mockA-1c","label":"C","marks":1,"prompt":"Suppose that the current working directory is `trip`. What single command would you use to change the current working directory to `notes` using a **relative** pathname?","solution":"```bash\ncd ../../notes\n```\n\n`trip` → `..` is `photos` → `../..` is `user1` → then into `notes`.","rubric":[{"marks":1,"item":"`cd ../../notes` (a trailing `/` is fine; an absolute path earns 0 because the question asks for relative)"}],"topics":["paths"]},{"id":"mockA-1d","label":"D","marks":1,"prompt":"Suppose that the current working directory is `user1`. What single command would you use to copy all of the files in `notes` whose names end in `.txt` into the `scripts` directory?","solution":"```bash\ncp notes/*.txt scripts\n```\n\nThe glob expands to `notes/lec01.txt notes/lec02.txt`; with several sources, the last argument of `cp` must be a directory.","rubric":[{"marks":1,"item":"`cp` with the glob `notes/*.txt` and destination `scripts` (`notes/*` is wrong: it would also copy `todo.md`)"}],"topics":["files","globs"]},{"id":"mockA-1e","label":"E","marks":1,"prompt":"Suppose that the current working directory is `photos`. What single command would you use to list all of the files whose names end in `.jpg`, where each of the letters `j`, `p`, `g` may be uppercase or lowercase?","solution":"```bash\nls *.[jJ][pP][gG]\n```\n\nAlso accepted for this tree: `ls *.jpg *.JPG` (but it would miss a name like `x.Jpg`).","rubric":[{"marks":1,"item":"Uses bracket expressions (or an equivalent list of globs) that match both `img1.jpg` and `img2.JPG` but not `logo.png`"}],"topics":["globs","commands"]},{"id":"mockA-1f","label":"F","marks":1,"prompt":"Suppose that the current working directory is `user1`. What single command would you use to remove the directory `photos` and everything inside it?","solution":"```bash\nrm -r photos\n```\n\n`rmdir photos` fails because the directory is not empty.","rubric":[{"marks":1,"item":"`rm -r photos` (`-rf` also fine); `rmdir` earns 0"}],"topics":["files"]}]},{"id":"mockA-2","title":"Question 2","marks":6,"prompt":"**1 mark each, 6 marks total.** Parts B and C use the `scripts` directory from Question 1. Your answer to each part should be very brief.","parts":[{"id":"mockA-2a","label":"A","marks":1,"prompt":"The long listing of a regular file shows `2` in the hard-link column. What does this tell you about the file?","solution":"Two filenames (directory entries) map to the same inode, i.e. the same file data has two names. Removing one name leaves the data reachable through the other.","rubric":[{"marks":1,"item":"Two names / directory entries refer to the same inode (file)"}],"topics":["files"]},{"id":"mockA-2b","label":"B","marks":1,"prompt":"The current working directory is `scripts`. Using an **octal** value, what command sets the permissions of `backup.sh` to `rwxr-x--x`?","solution":"```bash\nchmod 751 backup.sh\n```\n\n`rwx` = 4+2+1 = 7, `r-x` = 4+1 = 5, `--x` = 1.","rubric":[{"marks":1,"item":"`chmod 751 backup.sh` (all three digits correct)"}],"topics":["permissions"]},{"id":"mockA-2c","label":"C","marks":1,"prompt":"The current working directory is `scripts`. Using **symbolic** permissions in a single `chmod` command, remove write permission for the group and others and add execute permission for the owner on every file whose name ends in `.sh`, leaving all other permissions unchanged.","solution":"```bash\nchmod u+x,go-w *.sh\n```\n\nUse `+`/`-` (not `=`) so the other permissions are left as they were. An octal value cannot do this because the files start with different permissions.","rubric":[{"marks":1,"item":"`u+x,go-w` (comma, no spaces) applied to `*.sh`; `=` or an octal value earns 0"}],"topics":["permissions","globs"]},{"id":"mockA-2d","label":"D","marks":1,"prompt":"The current working directory is `user1`. Show how to run `ls notes missing` so that its normal output is saved in `out.txt` and its error messages are saved in `err.txt`.","solution":"```bash\nls notes missing > out.txt 2> err.txt\n```","rubric":[{"marks":1,"item":"`>` (or `1>`) for standard output **and** `2>` for standard error, each to the right file"}],"topics":["streams"]},{"id":"mockA-2e","label":"E","marks":1,"prompt":"What exactly does the following command print?\n\n```bash\necho '$HOME is \"home\"'\n```","solution":"```text\n$HOME is \"home\"\n```\n\nInside single quotes every character is literal: no parameter expansion, and the double quotes are printed.","rubric":[{"marks":1,"item":"Exactly `$HOME is \"home\"` (not the home directory path, and the double quotes are kept)"}],"topics":["quoting"]},{"id":"mockA-2f","label":"F","marks":1,"prompt":"Using a brace expansion, write one short command that creates the 12 directories `week01`, `week02`, ..., `week12` in the current directory.","solution":"```bash\nmkdir week{01..12}\n```\n\nThe leading zero in `01` makes Bash pad every number to two digits.","rubric":[{"marks":1,"item":"`mkdir` with the sequence expression `{01..12}` (`{1..12}` gives `week1`..., earns 0)"}],"topics":["expansions","files"]}]},{"id":"mockA-3","title":"Question 3","marks":4,"prompt":"**2 marks each, 4 marks total.**","parts":[{"id":"mockA-3a","label":"A","marks":2,"prompt":"Recall that `${s##pattern}` removes the **longest** leading match of `pattern` from the value of `s`, and `${s%pattern}` removes the **shortest** trailing match.\n\nA variable `path` holds a pathname that contains at least one `/`, for example `/home/user1/notes/lec01.txt`. Using parameter expansions (no other commands except `echo`), print the filename part (`lec01.txt`) on one line and the directory part (`/home/user1/notes`) on the next line.","solution":"```bash\necho \"${path##*/}\"     # lec01.txt\necho \"${path%/*}\"      # /home/user1/notes\n```","rubric":[{"marks":1,"item":"`${path##*/}` for the filename (`#` alone removes only up to the first `/`: 0)"},{"marks":1,"item":"`${path%/*}` for the directory (`%%` would remove everything after the first `/`: 0)"}],"topics":["strings"]},{"id":"mockA-3b","label":"B","marks":2,"prompt":"The file `grades.csv` contains one line per student: student number, last name, and grade separated by commas, for example:\n\n```text\n3100025,Cade,78\n2999999,day,85\n3001111,Friese,91\n```\n\nWrite a **single pipeline** that extracts the last names, converts them to uppercase using `tr`, sorts them alphabetically, saves the sorted names in a file named `names.txt`, and prints the first 5 sorted names.","solution":"```bash\ncut -d, -f2 grades.csv | tr 'a-z' 'A-Z' | sort | tee names.txt | head -n 5\n```\n\n`tr '[:lower:]' '[:upper:]'` and `head -5` are also fine. `tee` must come after `sort` so the file holds the sorted names.","rubric":[{"marks":1,"item":"`cut -d, -f2` (comma delimiter, field 2) then `tr` lower→upper then `sort`, in that order"},{"marks":1,"item":"`tee names.txt` after `sort` and `head -n 5` at the end"}],"topics":["streams","tr"]}]},{"id":"mockA-4","title":"Question 4","marks":4,"prompt":"**4 marks.**","parts":[{"id":"mockA-4","label":"A","marks":4,"prompt":"Write a script named `mkscript.sh` that creates a new, empty Bash script. The script takes one command line argument *NAME*.\n\n1. If the number of command line arguments is not exactly 1, print `Usage: mkscript.sh name` to standard error and exit with status 1.\n2. If a file named *NAME*`.sh` already exists, print `mkscript.sh: `*NAME*`.sh already exists` to standard error and exit with status 2.\n3. Otherwise, create the file *NAME*`.sh` whose only line is `#!/bin/bash`, and set its permissions so that the owner can read, write and execute it and no one else has any permission.\n\nExample: `./mkscript.sh hello` creates `hello.sh` with permissions `rwx------`.","solution":"```bash\n#!/bin/bash\n\n# mkscript.sh: create an empty, executable Bash script named NAME.sh\n\nif (( $# != 1 )); then\n    echo \"Usage: mkscript.sh name\" >&2\n    exit 1\nfi\n\nfile=\"$1.sh\"\nif [[ -e $file ]]; then\n    echo \"mkscript.sh: $file already exists\" >&2\n    exit 2\nfi\n\necho '#!/bin/bash' > \"$file\"\nchmod 700 \"$file\"\n```\n\n`chmod u=rwx,go= \"$file\"` is equivalent to `chmod 700`. Single quotes around `#!/bin/bash` keep the `!` literal.","rubric":[{"marks":1,"item":"Argument count test (`(( $# != 1 ))` or `[[ $# -ne 1 ]]`) with the message sent to standard error (`>&2`) and `exit 1`"},{"marks":1,"item":"Existence test `[[ -e ... ]]` (or `-f`) on *NAME*`.sh` with the message to standard error and `exit 2`"},{"marks":1,"item":"Writes `#!/bin/bash` into `\"$1.sh\"` with `>`; the filename expansion is quoted"},{"marks":1,"item":"`chmod 700` (or `u=rwx,go=`) on the quoted filename"}],"topics":["scripts","conditionals","permissions","streams","quoting"]}]},{"id":"mockA-5","title":"Question 5","marks":10,"prompt":"**10 marks.**","parts":[{"id":"mockA-5","label":"A","marks":10,"prompt":"Instead of deleting files, we want a command that tidies files away into a hidden stash directory sorted by extension. Write a script named `stash.sh` that accepts one or more pathnames of files as command line arguments and, **for each argument**:\n\n1. If the argument is not the name of a regular file, prints `stash.sh: `*PATH*` is not a regular file` to standard error (where *PATH* is the argument) and goes on to the next argument.\n2. Finds the name of the directory *DIR* that the file is in. If the pathname contains no `/`, *DIR* is `.`.\n3. Finds the extension *EXT* of the filename: the part after the **last** `.` in the filename. If the filename contains no `.`, *EXT* is `other`.\n4. Creates the directory *DIR*`/.stash/`*EXT* (including `.stash` if needed); no error may be printed if it already exists.\n5. Sets the permissions of *DIR*`/.stash` so that the owner has all permissions and everyone else has none.\n6. Prints `stashing `*PATH*` in `*DIR*`/.stash/`*EXT*.\n7. Moves the file into *DIR*`/.stash/`*EXT*.\n\nIf no arguments are given, print `Usage: stash.sh file...` to standard error and exit with status 1. The script exits with status 2 if any argument was not a regular file, and 0 otherwise. Arguments may contain spaces.\n\nExamples:\n\n```text\n$ ./stash.sh notes/lec01.txt data.tar.gz\nstashing notes/lec01.txt in notes/.stash/txt\nstashing data.tar.gz in ./.stash/gz\n$ ./stash.sh /home/user1/Makefile\nstashing /home/user1/Makefile in /home/user1/.stash/other\n```\n\nHint: `${str%pattern}` removes the shortest trailing match of `pattern`; `${str##pattern}` removes the longest leading match.","solution":"```bash\n#!/bin/bash\n\n# stash.sh: move each file into DIR/.stash/EXT where DIR is the directory\n# containing the file and EXT is the file's extension\n\nif (( $# == 0 )); then\n    echo \"Usage: stash.sh file...\" >&2\n    exit 1\nfi\n\nstatus=0\nfor path in \"$@\"; do\n    # skip anything that is not a regular file\n    if [[ ! -f $path ]]; then\n        echo \"stash.sh: $path is not a regular file\" >&2\n        status=2\n        continue\n    fi\n\n    # directory that the file is in\n    if [[ $path == */* ]]; then\n        dir=${path%/*}\n    else\n        dir=.\n    fi\n\n    # extension of the filename (other if there is no .)\n    name=${path##*/}\n    if [[ $name == *.* ]]; then\n        ext=${name##*.}\n    else\n        ext=other\n    fi\n\n    mkdir -p \"$dir/.stash/$ext\"\n    chmod 700 \"$dir/.stash\"\n    echo \"stashing $path in $dir/.stash/$ext\"\n    mv \"$path\" \"$dir/.stash/$ext\"\ndone\nexit \"$status\"\n```\n\nWhy `##*.` and not `#*.`: for `data.tar.gz`, `${name#*.}` is `tar.gz` but the extension is the part after the **last** dot, `gz`. `[[ $path == */* ]]` is a pattern test (is there a `/` anywhere?). Without it, `${path%/*}` on `data.tar.gz` would return the whole name.","rubric":[{"marks":1,"item":"No-argument check: usage message to standard error and `exit 1`"},{"marks":1,"item":"`for path in \"$@\"` (quoted) over all arguments"},{"marks":1,"item":"`[[ ! -f $path ]]` test, message to standard error, and `continue`"},{"marks":1,"item":"Remembers that an error happened and exits with 2, otherwise 0"},{"marks":1,"item":"Directory part with `${path%/*}`"},{"marks":1,"item":"Uses `.` when the pathname has no `/` (e.g. `[[ $path == */* ]]`)"},{"marks":1,"item":"Extension with `${name##*.}` on the filename, and `other` when there is no `.`"},{"marks":1,"item":"`mkdir -p \"$dir/.stash/$ext\"` (the `-p` avoids the error and creates `.stash` too)"},{"marks":1,"item":"`chmod 700` (or `u=rwx,go=`) on `\"$dir/.stash\"`"},{"marks":1,"item":"Prints the message and runs `mv \"$path\" \"$dir/.stash/$ext\"`; every expansion is double quoted"}],"topics":["scripts","strings","loops","conditionals","files","permissions","quoting"]}]}]},{"id":"mockB","title":"Mock midterm B","minutes":50,"instructions":"This mock is **50 minutes** long. There are **4 questions** worth a total of **30 marks**. No aids are allowed. It follows the format of Quiz 2 (Bash parts only).\n\n- Short answers should be very brief.\n- Write functions as `name() { ... }`, use `[[ ]]` for tests and `(( ))` for arithmetic, and double quote your expansions.\n- Afterwards, type your answers into the Day 8 drills (`./drill.sh start 8`) to test them.","questions":[{"id":"mockB-1","title":"Question 1","marks":12,"prompt":"**1 mark each, 12 marks total.** Your answer to each part should be very brief.","parts":[{"id":"mockB-1a","label":"A","marks":1,"prompt":"What does the metacharacter `+` mean in a regular expression?","solution":"The preceding atom (character, bracket expression or subexpression) must appear **one or more** times.","rubric":[{"marks":1,"item":"One or more of the preceding element (atom)"}],"topics":["regex"]},{"id":"mockB-1b","label":"B","marks":1,"prompt":"Provide a regular expression that matches exactly the strings made of four uppercase English letters followed by exactly three digits (for example `CISC220`, but not `CISC1240` or `cisc220`).","solution":"```bash\n^[A-Z]{4}[0-9]{3}$\n```\n\n`^[[:upper:]]{4}[[:digit:]]{3}$` is also correct.","rubric":[{"marks":1,"item":"Both anchors `^` and `$`, `[A-Z]{4}` and `[0-9]{3}` (writing the classes out four and three times is fine)"}],"topics":["regex"]},{"id":"mockB-1c","label":"C","marks":1,"prompt":"Show how to create a Bash array `fruits` that contains the three values `red apple`, `green pear`, and `plum`.","solution":"```bash\nfruits=(\"red apple\" \"green pear\" \"plum\")\n```","rubric":[{"marks":1,"item":"Parentheses, no spaces around `=`, and the two values with spaces quoted"}],"topics":["arrays","quoting"]},{"id":"mockB-1d","label":"D","marks":1,"prompt":"Show how to append the value `kiwi` to the end of the array `fruits`.","solution":"```bash\nfruits+=(\"kiwi\")\n```\n\n`fruits[${#fruits[@]}]=kiwi` also works when the indexes are 0, 1, 2, ... with no gaps.","rubric":[{"marks":1,"item":"`fruits+=(kiwi)` (quotes optional here); `fruits+=kiwi` earns 0 because it appends to the string in element 0"}],"topics":["arrays"]},{"id":"mockB-1e","label":"E","marks":1,"prompt":"What is the difference between `\"${arr[@]}\"` and `\"${arr[*]}\"`?","solution":"`\"${arr[@]}\"` expands to each element as a **separate word** (`\"${arr[0]}\" \"${arr[1]}\" ...`). `\"${arr[*]}\"` expands to **one single string** with all the elements joined by spaces.","rubric":[{"marks":1,"item":"`@` gives one word per element; `*` gives one combined word"}],"topics":["arrays","quoting"]},{"id":"mockB-1f","label":"F","marks":1,"prompt":"A variable `f` stores the name of a file. Write a Bash `if` statement that prints the message `missing` to **standard error** if the file whose name is stored in `f` does not exist.","solution":"```bash\nif [[ ! -e $f ]]; then echo \"missing\" >&2; fi\n```","rubric":[{"marks":1,"item":"`[[ ! -e $f ]]` (spaces inside the brackets), `then`/`fi`, and `>&2` (or `1>&2`)"}],"topics":["conditionals","streams"]},{"id":"mockB-1g","label":"G","marks":1,"prompt":"What is the exit status of the command `(( 5 - 5 ))`?","solution":"`1`. The expression's value is 0, and `(( ))` sets exit status 1 when the expression equals 0 (false).","rubric":[{"marks":1,"item":"1"}],"topics":["arithmetic"]},{"id":"mockB-1h","label":"H","marks":1,"prompt":"Write a C-style `for` loop that prints the even numbers 0, 2, 4, ..., 10, one per line.","solution":"```bash\nfor (( i = 0; i <= 10; i += 2 )); do\n    echo \"$i\"\ndone\n```","rubric":[{"marks":1,"item":"`for (( init; condition; update ))` with `<= 10` and step 2, plus `do ... done`"}],"topics":["loops","arithmetic"]},{"id":"mockB-1i","label":"I","marks":1,"prompt":"What does writing `local x=5` inside a Bash function do?","solution":"It creates a variable `x` that exists only while the function runs (it is visible in that function and any function it calls). The caller's variable `x`, if any, is not changed.","rubric":[{"marks":1,"item":"The variable is limited to the function (and functions it calls) so the caller's variable is not changed"}],"topics":["functions"]},{"id":"mockB-1j","label":"J","marks":1,"prompt":"A Bash function can only `return` an exit status between 0 and 255. How can a function give a string result to its caller?","solution":"Print the string to standard output in the function and capture it with command substitution, e.g. `result=$(myfunc arg)`. (Assigning the result to a non-local variable that the caller reads also works, because of dynamic scoping.)","rubric":[{"marks":1,"item":"`echo` the result and use `$( )` command substitution (or set a global variable)"}],"topics":["functions","expansions"]},{"id":"mockB-1k","label":"K","marks":1,"prompt":"Using `tr`, print the value of the variable `s` with every digit deleted.","solution":"```bash\nprintf %s \"$s\" | tr -d '0-9'\n```\n\n`echo \"$s\" | tr -d '[:digit:]'` is also fine.","rubric":[{"marks":1,"item":"Sends `$s` to `tr` through a pipe and uses `tr -d` with the digits"}],"topics":["tr","streams"]},{"id":"mockB-1l","label":"L","marks":1,"prompt":"What does the following print?\n\n```bash\ns=banana.tar.gz\necho \"${s%%.*} ${s#*.}\"\n```","solution":"```text\nbanana tar.gz\n```\n\n`%%.*` removes the longest trailing part that starts with a dot (`.tar.gz`); `#*.` removes the shortest leading part that ends with a dot (`banana.`).","rubric":[{"marks":1,"item":"Exactly `banana tar.gz`"}],"topics":["strings"]}]},{"id":"mockB-2","title":"Question 2","marks":4,"prompt":"**2 marks each, 4 marks total.**","parts":[{"id":"mockB-2a","label":"A","marks":2,"prompt":"A variable `s` holds a string. Write an `if` statement that prints `S is a number` to standard output if `s` is made up only of digits (at least one), and otherwise prints `S is not a number` to standard error, where *S* is the value of `s`. Use a regular expression.","solution":"```bash\nif [[ $s =~ ^[0-9]+$ ]]; then\n    echo \"$s is a number\"\nelse\n    echo \"$s is not a number\" >&2\nfi\n```","rubric":[{"marks":1,"item":"`[[ $s =~ ^[0-9]+$ ]]` with both anchors and the regex **not** quoted"},{"marks":1,"item":"Correct `if/else/fi` with the second message sent to standard error"}],"topics":["regex","conditionals","streams"]},{"id":"mockB-2b","label":"B","marks":2,"prompt":"Inside a script, use a `for` loop over the command line arguments to compute the sum of all of the arguments (assume they are integers) and print it. With no arguments the script prints `0`.","solution":"```bash\nsum=0\nfor n in \"$@\"; do\n    (( sum += n ))\ndone\necho \"$sum\"\n```","rubric":[{"marks":1,"item":"`for n in \"$@\"` and `sum` initialised to 0"},{"marks":1,"item":"Arithmetic update (`(( sum += n ))` or `sum=$(( sum + n ))`) and prints the sum after the loop"}],"topics":["loops","arithmetic","variables"]}]},{"id":"mockB-3","title":"Question 3","marks":4,"prompt":"**4 marks.**","parts":[{"id":"mockB-3","label":"A","marks":4,"prompt":"Write a Bash function `count_char` that is called as `count_char` *CH* *STR*. It prints the number of times the single character *CH* appears in the string *STR*, and it **returns** exit status 0 if *CH* appears at least once and 1 otherwise. The function must not change any variables of its caller.\n\n```text\n$ count_char a banana; echo $?\n3\n0\n$ count_char z banana; echo $?\n0\n1\n```","solution":"```bash\n# countchar.sh: defines the function count_char (sourced, no shebang needed)\n\n# count_char ch str\n# prints the number of times the character ch appears in str;\n# returns 0 if ch appears at least once, 1 otherwise\ncount_char() {\n    local ch=$1\n    local str=$2\n    local count=0\n    local i\n    for (( i = 0; i < ${#str}; i++ )); do\n        if [[ ${str:i:1} == \"$ch\" ]]; then\n            (( count++ ))\n        fi\n    done\n    echo \"$count\"\n    if (( count > 0 )); then\n        return 0\n    else\n        return 1\n    fi\n}\n```\n\nThe right-hand side of `==` is quoted so that a character such as `*` is compared literally instead of being used as a pattern.","rubric":[{"marks":1,"item":"Loop over the indexes 0 to `${#str}`-1 (C-style `for` with `${#str}`)"},{"marks":1,"item":"Extracts one character with `${str:i:1}` and compares it to *CH* (right side quoted)"},{"marks":1,"item":"Counts matches and prints the count; variables declared `local`"},{"marks":1,"item":"`return 0` if the count is positive, `return 1` otherwise"}],"topics":["functions","strings","loops","arithmetic"]}]},{"id":"mockB-4","title":"Question 4","marks":10,"prompt":"**10 marks.**","parts":[{"id":"mockB-4","label":"A","marks":10,"prompt":"Complete the script `uniqrev.sh` below. It prints its command line arguments on a single line in **reverse order** with **repeated values removed** (keep the first occurrence of each value, counting from the left of the original arguments). Arguments may contain spaces or wildcard characters such as `*`.\n\n```text\n$ ./uniqrev.sh 3 1 3 2 1\n2 1 3\n$ ./uniqrev.sh \"a b\" c \"a b\"\nc a b\n$ ./uniqrev.sh\nUsage: uniqrev.sh value...        (on standard error, exit status 1)\n```\n\n```bash\n#!/bin/bash\n\n# returns 0 if $1 is an element of the array out, 1 otherwise\ncontains() {\n}\n\n# copies the elements of arr into the array out, skipping values already in out\ndedup() {\n}\n\n# reverses the order of the elements of out (swap elements; do not use another array)\nreverse() {\n}\n\n# if there are no command line arguments print the usage message and exit\n\narr=(\"$@\")\ndedup\nreverse\n\n# print the elements of out on a single line\n```\n\nImplement the three functions, the argument check, and the final print. No other error checking is required.","solution":"```bash\n#!/bin/bash\n\n# uniqrev.sh: prints the command line arguments in reverse order\n# with duplicates removed\n\n# returns 0 if $1 is an element of the array out, 1 otherwise\ncontains() {\n    local elem\n    for elem in \"${out[@]}\"; do\n        if [[ $elem == \"$1\" ]]; then\n            return 0\n        fi\n    done\n    return 1\n}\n\n# copies the elements of arr into out, skipping repeated values\ndedup() {\n    out=()\n    local elem\n    for elem in \"${arr[@]}\"; do\n        if ! contains \"$elem\"; then\n            out+=(\"$elem\")\n        fi\n    done\n}\n\n# reverses the order of the elements of out\nreverse() {\n    local n=${#out[@]}\n    local i tmp\n    for (( i = 0; i < n / 2; i++ )); do\n        tmp=${out[i]}\n        out[i]=${out[n - 1 - i]}\n        out[n - 1 - i]=$tmp\n    done\n}\n\nif (( $# == 0 )); then\n    echo \"Usage: uniqrev.sh value...\" >&2\n    exit 1\nfi\n\narr=(\"$@\")\ndedup\nreverse\necho \"${out[@]}\"\n```\n\nWhy the quotes matter: `for elem in ${out[@]}` (unquoted) splits `a b` into two words, so the duplicate `a b` is never found. `[[ $elem == $1 ]]` without quotes treats `$1` as a pattern, so `a*` would wrongly match `ab`.","rubric":[{"marks":1,"item":"`contains`: loops over `\"${out[@]}\"` (quoted)"},{"marks":1,"item":"`contains`: compares each element with `\"$1\"` (right side quoted) and `return 0` when found"},{"marks":1,"item":"`contains`: `return 1` after the loop"},{"marks":1,"item":"`dedup`: starts `out` empty (`out=()`) and loops over `\"${arr[@]}\"`"},{"marks":1,"item":"`dedup`: calls `contains` as an `if` condition (with `!`) and appends with `out+=(\"$elem\")`"},{"marks":1,"item":"`reverse`: gets the size with `${#out[@]}`"},{"marks":1,"item":"`reverse`: loop runs for `i < n / 2` only (looping to `n` reverses twice)"},{"marks":1,"item":"`reverse`: correct swap of `out[i]` and `out[n - 1 - i]` using a temporary variable"},{"marks":1,"item":"No-argument check `(( $# == 0 ))` with message to standard error and `exit 1`"},{"marks":1,"item":"Prints with `echo \"${out[@]}\"`; loop variables declared `local`"}],"topics":["arrays","functions","loops","conditionals","quoting","arithmetic"]}]}]}]},"sheet":{"sections":[{"title":"1. Filesystem, paths and commands","md":"- **Inode**: stores a file's metadata (type, owner, size, times, where the data is) but **not its name**.\n- **Directory**: a file whose contents map **filenames to inode numbers**. A regular file is an ordinary data file; directories are not regular files.\n- **Hard link**: a directory entry (name → inode). Every file has at least one. The number after the permissions in `ls -l` is the hard-link count.\n- Root directory: `/`. **Absolute** path starts at `/` (`/home/user1/notes`); **relative** path starts at the current working directory (`notes`, `../user2`).\n\n| Symbol | Meaning |\n|---|---|\n| `.` | current directory |\n| `..` | parent directory |\n| `~` | your home directory (`~user2` = user2's home) |\n| `cd` | (no argument) go home |\n| `cd -` | go back to the previous directory (prints it) |\n| `pwd` | print the absolute path of the working directory |\n\n**Command form**: `command -options arguments`. Options combine: `ls -s -h` = `ls -sh`. Long form: `--all`.\n\n| `ls` option | Meaning |\n|---|---|\n| `-a` | all files, including hidden (`.name`) and `.` `..` |\n| `-A` | like `-a` but not `.` and `..` |\n| `-d` | list a directory itself, not its contents |\n| `-l` | long listing |\n| `-1` | one name per line |\n| `-r` | reverse order |\n| `-t` | sort by modification time (newest first) |\n| `-S` | sort by size (largest first) |\n| `-s` / `-h` | size in blocks / human readable |\n| `-F` | add a symbol showing the file type |\n\nKinds of commands: built-in (`cd`, `pwd`), executable program (`ls`), alias, shell function. `type cmd` says which; `which cmd` gives the program's path. Help: `man ls`, `ls --help`, `help cd` (built-ins).\n\n**Lists of commands**: `a; b` runs both in order. `a && b` runs `b` only if `a` succeeds (exit status 0). `a || b` runs `b` only if `a` fails. `cmd &` runs in the background."},{"title":"2. Filename expansion (globs)","md":"An **unquoted** word containing `*`, `?` or `[` is replaced by the **alphabetically sorted** list of matching filenames. Globs do not match hidden files (leading `.`) unless the pattern starts with `.`.\n\n| Wildcard | Matches |\n|---|---|\n| `*` | any string, including the empty string |\n| `?` | exactly one character |\n| `[abc]` | one character from the set |\n| `[a-z]` `[0-9]` | one character in the range |\n| `[!abc]` | one character **not** in the set |\n| `[[:upper:]]` | one character in a POSIX class |\n\nPOSIX classes (only inside `[ ]`): `[:alpha:]` `[:digit:]` `[:alnum:]` `[:upper:]` `[:lower:]` `[:space:]` `[:blank:]` `[:punct:]`.\n\n```bash\nls *.txt                 # names ending in .txt\nls ???                   # names exactly 3 characters long\nls *.[pP][dD][fF]        # .pdf in any mix of case\nls */A1answers.txt       # that file in every subdirectory\nls -d */                 # just the subdirectories\ncp * ../backup           # every (non-hidden) file here\n```\n\nIf nothing matches, the pattern is left **as is** (e.g. `*.pdf` stays the literal string `*.pdf`). In a `for` loop guard with `[[ -e $f ]] || continue`."},{"title":"3. Quoting","md":"| Form | Effect |\n|---|---|\n| `\\c` | escape: the next character is literal (`file\\ name`) |\n| `'...'` | everything literal; no expansions at all; cannot contain `'` |\n| `\"...\"` | literal **except** `$` (parameter, `$( )`, `$(( ))`), backquote and `\\` |\n\nDouble quotes stop **word splitting**, **filename expansion**, tilde and brace expansion, but still allow `$var`, `$(cmd)`, `$((expr))`.\n\n```bash\nx=\"a   b\"\necho $x          # a b        (split into 2 words, joined by one space)\necho \"$x\"        # a   b\necho '$x'        # $x\necho \"*\"         # *          (no globbing)\n```\n\n**Always write `\"$var\"`, `\"$1\"`, `\"$@\"`, `\"${arr[@]}\"`** in scripts: a filename with a space otherwise becomes several arguments. Inside `[[ ]]` the left side does not need quotes (no word splitting there), but quote the right side of `==`/`!=` to compare literally."},{"title":"4. Files: create, move, copy, remove, link","md":"Any character except `/` and the null character can be in a filename. Names are case sensitive; a leading `.` means hidden. Avoid spaces and a leading `-`.\n\n| Command | Effect |\n|---|---|\n| `touch f1 f2` | create empty files (or update the timestamp) |\n| `mkdir d1 d2` | create directories |\n| `mkdir -p a/b/c` | create missing parents too; no error if it exists |\n| `mv old new` | rename (overwrites `new` if it exists) |\n| `mv f1 f2 dir` | move files into an existing directory |\n| `cp src dst` | copy a file |\n| `cp f1 f2 dir` | copy several files into a directory |\n| `cp -r dir1 dir2` | copy a directory and its contents |\n| `rm f1 f2` | remove files (permanent!) |\n| `rm -r dir` | remove a directory and everything inside |\n| `rmdir dir` | remove an **empty** directory |\n| `ln target name` | hard link: a second name for the same inode |\n| `ln -s target name` | symbolic link: a file that points to a name |\n| `cat f` | print a file's contents |\n\n`-i` (`mv -i`, `rm -i`, `cp -i`) asks before overwriting/removing. Removing one hard link only decreases the link count; the data is gone when the count reaches 0. A symbolic link breaks (dangles) if its target is renamed or removed."},{"title":"5. Permissions","md":"`ls -l` shows: type+permissions, hard links, owner, group, size, time, name.\n\n`-rwxr-x---` = type `-` (regular file; `d` directory, `l` symbolic link) then **user** `rwx`, **group** `r-x`, **other** `---`.\n\n| | Regular file | Directory |\n|---|---|---|\n| `r` | read contents | list names (with `x`) |\n| `w` | change contents | create/delete/rename files in it (with `x`) |\n| `x` | run as a program | enter it (`cd`) |\n\n**Octal**: r=4, w=2, x=1, one digit each for user, group, other.\n\n| Octal | Meaning | Octal | Meaning |\n|---|---|---|---|\n| 7 | `rwx` | 3 | `-wx` |\n| 6 | `rw-` | 2 | `-w-` |\n| 5 | `r-x` | 1 | `--x` |\n| 4 | `r--` | 0 | `---` |\n\n```bash\nchmod 750 hello.sh        # rwxr-x---\nchmod 644 notes.txt       # rw-r--r--\nchmod 700 .trash          # rwx------\n```\n\n**Symbolic**: who `u g o a` + operator `+` add, `-` remove, `=` set exactly + perms `r w x`. Separate with commas, no spaces.\n\n```bash\nchmod u+x script.sh       # add execute for the owner\nchmod go-w *.txt          # remove write for group and other\nchmod u=rw,go=r f         # rw-r--r--\nchmod u=rwx,go= dir       # rwx------  (empty = none)\nstat -c %a f              # prints the octal permissions, e.g. 644\n```"},{"title":"6. Streams, redirection, pipes and tee","md":"File descriptors: **0** standard input, **1** standard output, **2** standard error.\n\n| Syntax | Effect |\n|---|---|\n| `cmd > f` | stdout to `f` (create/overwrite); same as `1>` |\n| `cmd >> f` | append stdout to `f` |\n| `cmd 2> f` | stderr to `f` |\n| `cmd > out 2> err` | stdout and stderr to separate files |\n| `cmd > f 2>&1` | both to `f` (order matters: left to right) |\n| `cmd 2> /dev/null` | throw error messages away |\n| `echo \"msg\" >&2` | print a message **to standard error** |\n| `cmd < f` | stdin from file `f` |\n\n**Pipe** `a | b` sends the stdout of `a` to the stdin of `b`. **`tee f`** copies its input to the file `f` and to stdout, so it can sit in the middle of a pipeline.\n\n| Tool | Use |\n|---|---|\n| `sort` | sort lines (`-n` numeric, `-r` reverse) |\n| `uniq` | remove **adjacent** duplicate lines (`-d` only duplicates); sort first |\n| `wc -l` | count lines |\n| `cut -d, -f2` | field 2 using `,` as the delimiter (default delimiter is tab) |\n| `head -n 3` | first 3 lines |\n| `grep -E 're' f` | lines matching an extended regex (`-n` line numbers, `-i` ignore case) |\n\n```bash\ncut -f3 classlist | sort | tee snum | head -n 3\nls /bin /usr/bin | sort | uniq -d | wc -l\n```"},{"title":"7. tr: translate, delete, squeeze characters","md":"`tr` reads **standard input only** and writes standard output. To use it on a variable, pipe the value in.\n\n```bash\ny=$(printf %s \"$x\" | tr 'a-z' 'A-Z')     # to uppercase\necho \"$x\" | tr '[:lower:]' '[:upper:]'   # same with POSIX classes\necho \"$x\" | tr '.' '/'                   # every . becomes /\necho \"$x\" | tr -d '0-9'                  # delete all digits\necho \"$x\" | tr -s ' '                    # squeeze runs of spaces into one\necho \"$x\" | tr '[:digit:]' '[X*]'        # every digit becomes X\n```\n\n- Character *i* of `seq1` is replaced by character *i* of `seq2`; other characters pass through.\n- If `seq2` is shorter, GNU `tr` repeats its last character (`[c*]` is the portable way).\n- Duplicated characters in `seq1` give undefined results."},{"title":"8. Expansions","md":"Order the shell performs them: **1** brace, **2** tilde, **3** parameter, **4** command substitution and **5** arithmetic (left to right), **6** word splitting, **7** filename expansion.\n\n| Expansion | Example | Result |\n|---|---|---|\n| brace list | `echo f{a,b,c}.txt` | `fa.txt fb.txt fc.txt` |\n| brace sequence | `echo {1..5}` | `1 2 3 4 5` |\n| with step | `echo {10..20..5}` | `10 15 20` |\n| zero padded | `echo {08..10}` | `08 09 10` |\n| letters | `echo {a..e}` | `a b c d e` |\n| tilde | `echo ~` | `/home/user1` |\n| parameter | `echo \"$x\"` / `\"${x}\"` | value of `x` |\n| command substitution | `d=$(pwd)` | output of the command (trailing newlines removed) |\n| arithmetic | `echo $(( 2 * 5 ))` | `10` |\n\n- `mkdir {2023..2024}-{01..12}` makes 24 directories.\n- **Word splitting** happens on unquoted results, at the characters in `IFS` (default space, tab, newline). Several separators in a row count as one.\n- Change `IFS` temporarily to split on something else: `IFS=\",\"` then `for f in $str`, then restore it.\n- In an **assignment** `v=...` there is **no** brace expansion, **no** filename expansion and no word splitting; tilde, parameter, command and arithmetic expansion do happen. `x=*.txt` stores the literal `*.txt`."},{"title":"9. Scripts, variables and command line arguments","md":"```bash\n#!/bin/bash\n# a comment (from # to end of line; a quoted # is not a comment)\necho \"Hello, $1!\"\n```\n\nRun it: `chmod u+x hello.sh` then `./hello.sh Sam` (or `bash hello.sh Sam` without execute permission).\n\n| Parameter | Meaning |\n|---|---|\n| `$#` | number of command line arguments |\n| `$0` | pathname used to run the script |\n| `$1` ... `$9`, `${10}` | the arguments (braces needed from 10 on) |\n| `\"$@\"` | all arguments, each as a separate word (use this to loop) |\n| `\"$*\"` | all arguments as one string |\n| `$?` | exit status of the last command (0 = success, 1-255 = failure) |\n\n- `exit n` ends the script with status *n*; without it the status is that of the last command.\n- `shift` drops `$1` and moves `$2` to `$1` and so on (`$#` decreases).\n- **Assignment**: `name=value` with **no spaces** around `=`. Use the value with `$name` or `${name}`.\n- Values are strings; unset variables expand to the empty string (no error).\n- Concatenate by writing values next to each other: `str3=$str1$str2`, `out=\"${in}_.bak\"` (braces needed because `$in_` would be the variable `in_`).\n- Command output into a variable: `perm=$(stat -c %a \"$src\")`.\n- Usage check pattern:\n\n```bash\nif (( $# != 1 )); then\n    echo \"Usage: script.sh name\" >&2\n    exit 1\nfi\n```"},{"title":"10. Strings: parameter expansion","md":"Example values: `s=abcdefghij`, `f=dir/file.txt.zip`.\n\n| Expansion | Meaning | Example → result |\n|---|---|---|\n| `${#s}` | length | `10` |\n| `${s:2}` | from index 2 to the end | `cdefghij` |\n| `${s:3:4}` | 4 characters from index 3 | `defg` |\n| `${s: -3}` | last 3 (space before `-`) | `hij` |\n| `${s:1:-2}` | from 1 up to (not incl.) 2nd last | `bcdefgh` |\n| `${f#*.}` | remove **shortest** leading match | `txt.zip` |\n| `${f##*.}` | remove **longest** leading match | `zip` (extension) |\n| `${f##*/}` | ... up to the last `/` | `file.txt.zip` (filename) |\n| `${f%.*}` | remove **shortest** trailing match | `dir/file.txt` |\n| `${f%%.*}` | remove **longest** trailing match | `dir/file` |\n| `${f%/*}` | ... from the last `/` | `dir` (directory) |\n| `${s/b/X}` | replace first match | `aXcdefghij` |\n| `${s//[aeiou]/}` | replace all matches (here: delete vowels) | `bcdfghj` |\n| `${s^}` / `${s^^}` | uppercase first / all characters | `Abcdefghij` / `ABCDEFGHIJ` |\n| `${s,}` / `${s,,}` | lowercase first / all | |\n\nMemory aid: `#` is on the left of `$` on the keyboard (removes from the **front**), `%` is on the right (removes from the **back**). Doubling the symbol makes the match **longest**. The variable itself is not changed.\n\nCharacter at index *i*: `${s:i:1}`. Loop over characters: `for (( i = 0; i < ${#s}; i++ ))`.\n\n| Expansion | `str` unset | `str` empty | `str` set |\n|---|---|---|---|\n| `${str:-word}` | `word` | `word` | `$str` |\n| `${str:=word}` | `word`, assigns it | `word`, assigns it | `$str` |\n| `${str:+word}` | nothing | nothing | `word` |\n| `${str:?word}` | error, exit | error, exit | `$str` |\n\nWithout the `:` (e.g. `${str-word}`) only *unset* is tested, not empty."},{"title":"11. Arithmetic","md":"Integers only (no floating point). Operators as in Java/C: `+ - * / %`, `**` (power), `++ --`, `+= -= *= /=`, comparisons `< <= > >= == !=`, logic `&& || !`. Division truncates: `$(( 7 / 2 ))` is `3`.\n\n| Form | Use |\n|---|---|\n| `(( expr ))` | command: do arithmetic or test; `$` optional on variable names |\n| `$(( expr ))` | expansion: substitutes the value |\n\n```bash\n(( x = 1 + 2 ))           # x is 3\n(( count++ ))\nn=$(( ${#s} / 2 ))\necho \"$(( 2 ** 10 ))\"     # 1024\nif (( val % 2 == 0 )); then echo even; fi\n```\n\n- **Exit status of `(( ))`**: 0 (true) if the value is **non-zero**, 1 (false) if the value is **0**. So `(( 5 - 5 ))` has status 1.\n- Non-numeric, empty or unset variables count as 0 inside `(( ))`.\n- `$RANDOM`: a random integer 0 to 32767; `$(( RANDOM % n ))` gives 0 to n-1."},{"title":"12. Regular expressions","md":"Bash uses POSIX **extended** regexes with `=~` inside `[[ ]]`. The match succeeds if the pattern matches **any part** of the string, so anchor with `^...$` to match the whole string. **Do not quote the regex** (quoted parts are matched literally); storing it in a variable `re='...'` then `[[ $s =~ $re ]]` is safe.\n\n| Metacharacter | Meaning |\n|---|---|\n| `^` / `$` | start / end of the string (line) |\n| `.` | any single character |\n| `[abc]` `[a-z]` `[[:digit:]]` | one character from the set |\n| `[^abc]` | one character **not** in the set |\n| `( )` | subexpression (group) |\n| `*` | preceding atom **0 or more** times |\n| `+` | preceding atom **1 or more** times |\n| `?` | preceding atom **0 or 1** time |\n| `{m,n}` `{m}` `{m,}` | between m and n / exactly m / at least m times |\n\n- **Choice** `a|b` matches either side: `^(cat|dog)$` matches `cat` or `dog`.\n- An **atom** is one character, a bracket expression or a subexpression.\n- Metacharacters are literal inside `[ ]`: `^a[.]c$` matches `a.c`.\n- `^(19|20)[0-9][0-9]$` matches the years 1900 to 2099.\n\n| Regex | Matches |\n|---|---|\n| `^[0-9]+$` | unsigned integer |\n| `^[-+]?[0-9]+$` | signed or unsigned integer |\n| `^[a-z]+$` | one or more lowercase letters only |\n| `^[A-Z]{4}[0-9]{3}$` | `CISC220` |\n| `[[:space:]]` | contains whitespace |\n\n```bash\nif [[ $pw =~ [[:digit:]] ]]; then echo \"has a digit\"; fi\ngrep -E '^zip' file      # grep -E uses the same syntax on each line\n```\n\nDo not confuse with globs: in a regex `*` means \"repeat the previous atom\", in a glob `*` means \"any string\"."},{"title":"13. Conditions: [[ ]], if and logical operators","md":"```bash\nif [[ -f $file ]]; then\n    echo \"regular file\"\nelif [[ -d $file ]]; then\n    echo \"directory\"\nelse\n    echo \"something else\" >&2\nfi\n```\n\nSpaces are required inside `[[ ` and ` ]]`. `if` runs any command and tests its **exit status** (0 = true): `if cd \"$dir\" 2> /dev/null; then ...`. One line: `if [[ ! -r $f ]]; then echo \"not readable\"; fi`.\n\n| File test | True if |\n|---|---|\n| `-e f` | exists (any kind) |\n| `-f f` | is a regular file |\n| `-d f` | is a directory |\n| `-r f` / `-w f` / `-x f` | readable / writable / executable |\n| `-s f` | exists and size > 0 |\n| `f1 -nt f2` / `-ot` | newer / older than |\n\n| String test | True if |\n|---|---|\n| `-z $s` | empty |\n| `-n $s` or just `$s` | not empty |\n| `$a == $b` (or `=`) | equal; **unquoted** right side is a glob pattern (`$s == a*`) |\n| `$a != $b` | not equal |\n| `$a < $b` / `$a > $b` | before / after in dictionary order (strings, not numbers!) |\n| `$s =~ regex` | regex match |\n| `-v name` | variable `name` is set (no `$`) |\n\n| Integer test (in `[[ ]]`) | Same with `(( ))` |\n|---|---|\n| `-eq` `-ne` | `==` `!=` |\n| `-lt` `-le` | `<` `<=` |\n| `-gt` `-ge` | `>` `>=` |\n\n**Combine** (highest precedence first): `( expr )`, `! expr`, `expr1 && expr2`, `expr1 || expr2`. Examples: `[[ -f $f && -r $f ]]`, `(( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) ))`.\n\nPitfall: `[[ 100 < 2 ]]` is **true** (string comparison). Use `(( 100 < 2 ))` or `-lt` for numbers."},{"title":"14. Loops","md":"```bash\nfor arg in \"$@\"; do              # each command line argument\n    echo \"$arg\"\ndone\n\nfor f in *.txt; do               # each matching file\n    [[ -e $f ]] || continue      # skip if the glob matched nothing\n    mv \"$f\" \"${f%.txt}.md\"\ndone\n\nfor i in {1..5}; do echo \"$i\"; done\n\nfor (( i = 0; i < n; i++ )); do  # C-style\n    echo \"$i\"\ndone\n\nwhile (( $# > 0 )); do           # process arguments with shift\n    echo \"$1\"\n    shift\ndone\n\ncount=10\nuntil (( count < 0 )); do        # runs until the test succeeds\n    echo \"$count\"\n    (( count-- ))\ndone\n\nwhile read -r line; do           # read a file line by line\n    echo \"$line\"\ndone < \"$file\"\n\nwhile IFS=\",\" read -r num last first; do   # split each line on commas\n    echo \"$first $last\"\ndone < students.txt\n```\n\n- `while` repeats while the test command succeeds (status 0); `until` repeats while it fails.\n- `break` leaves the loop; `continue` skips to the next iteration.\n- `for x in $str` (unquoted) loops over the words of `str`.\n- Unquoted `$@` splits arguments that contain spaces: always write `\"$@\"`."},{"title":"15. Arrays","md":"| Syntax | Meaning |\n|---|---|\n| `arr=(1 2 3)` | create (elements separated by spaces) |\n| `arr=(\"a b\" c)` | quote elements that contain spaces |\n| `arr=(\"$@\")` | array of the command line arguments |\n| `arr[5]=x` | set element 5 (indexes may have gaps) |\n| `${arr[i]}` | element *i* (braces required; `i` needs no `$`) |\n| `$arr` | element 0 only (common mistake) |\n|
