rks":1,"item":"All messages exact, in order, sent to stderr"}],"pitfalls":["`.sh$` with an unescaped dot (matches `abcsh`)","Quoting the regex","Using `.{20}` for rule 4: a 20-character name is allowed","Mixing up `&&` and `||`"]}]},{"day":4,"title":"Crash day 2: arithmetic, arrays, if, loops and functions","goal":"Calculate with (( )), store lists in arrays, make decisions with [[ ]] and if, loop over arguments, files and strings, and write functions: the material behind both 10-mark questions.","topics":[{"id":"d4-arithmetic","title":"Integer arithmetic: (( )) and $(( ))","notebook":"bash/arithmetic.ipynb","priority":"high","examNote":"Quiz 1 Q3A needed `$(( ${#s} / 2 ))`. Quiz 2's Bash question used `(( ))` loops and comparisons, and every Assignment 3 script checked `$#` with `(( ))`. Expect output questions on integer division and `%`.","blocks":[{"type":"md","text":"Bash does **signed integer arithmetic** only (typically 64-bit). There are no decimals: `7 / 2` is `3`. The operators are like Java's, plus `**` for powers:\n\n| Operator | Meaning | Example | Result |\n|---|---|---|---|\n| `+ - *` | add, subtract, multiply | `2 + 3 * 4` | `14` |\n| `/` | integer division (drops the fraction) | `17 / 5` | `3` |\n| `%` | remainder | `17 % 5` | `2` |\n| `**` | power | `2 ** 10` | `1024` |\n| `( )` | grouping | `(2 + 3) * 4` | `20` |\n| `== != < <= > >=` | comparisons: 1 if true, 0 if false | `3 > 2` | `1` |\n\nDivision truncates toward zero, so `-7 / 2` is `-3` and `-7 % 2` is `-1`. Dividing by zero is an error.\n\n### The `(( ))` command\n\n`(( expression ))` evaluates an arithmetic expression. Inside it you can assign, and you **do not need `$`** in front of variable names; spaces are allowed and make it readable:"},{"type":"code","code":"$ (( x = 1 + 2 ))\n$ echo \"$x\"\n3\n$ y=5\n$ (( z = x * y ))\n$ echo \"$z\"\n15\n$ (( z++ ))\n$ (( z += 10 ))\n$ echo \"$z\"\n26"},{"type":"md","text":"Inside `(( ))`, a name whose value is not a number, an empty variable, or an unset variable all count as **0**:\n\n```bash\nx=abc; y=5\n(( z = x + y ))    # z is 5\n```"},{"type":"check","q":"After `a=17; b=5; (( q = a / b )); (( r = a % b ))`, what are `q` and `r`?","a":"`q` is `3` and `r` is `2`."},{"type":"md","text":"### Arithmetic expansion `$(( ))`\n\n`$(( expression ))` (with a `$`) is replaced by the **value** of the expression, just like `$( )` is replaced by a command's output. Use it anywhere you need the number as text:"},{"type":"code","code":"$ x=7\n$ echo $(( x / 2 )) $(( x % 2 )) $(( x ** 2 ))\n3 1 49\n$ half=$(( x / 2 ))\n$ echo \"$half\"\n3\n$ n=$(( $(wc -l < classlist) * 3 ))"},{"type":"pitfall","text":"A plain assignment does no arithmetic. `x=5; x=$x+1; echo $x` prints `5+1`, because the value is just the string `5+1`. Write `x=$(( x + 1 ))` or `(( x++ ))`."},{"type":"why","q":"Why is `$((` needed in `half=$(( x / 2 ))` but not in `(( half = x / 2 ))`?","a":"`(( ))` is a command: it does the arithmetic and the assignment itself, producing no text. `$(( ))` is an expansion that produces text (the value), which the plain `half=` assignment then stores."},{"type":"md","text":"### `(( ))` as a condition\n\n`(( ))` is a command, so it has an exit status:\n\n- if the expression's value is **not 0**, the exit status is **0** (success, \"true\");\n- if the value **is 0**, the exit status is **1** (failure, \"false\")."},{"type":"code","code":"$ (( 0 + 0 ))\n$ echo $?\n1\n$ (( 2 > 1 ))\n$ echo $?\n0"},{"type":"try","text":"Type `(( 7 % 2 )); echo $?` and then `(( 8 % 2 )); echo $?`. The odd number gives status `0` because `7 % 2` is `1` (non-zero, \"true\"); the even one gives `1` because `8 % 2` is `0`. Then type `if (( 3 < 5 )); then echo yes; fi` and `if (( 3 > 5 )); then echo yes; fi`: only the first prints."},{"type":"md","text":"### A first look at `if`\n\nBecause `(( ))` is a command with an exit status, it can decide whether other commands run. The tool for that is the `if` statement. The last topic today covers it fully; for now you only need this shape:\n\n```bash\nif (( $# != 1 )); then\n    echo \"Script requires 1 argument\" >&2\n    exit 1\nfi\n```\n\n- Bash runs the **condition**, the command between `if` and `;` (here `(( $# != 1 ))`).\n- If the condition's exit status is `0` (\"true\"), Bash runs the commands between `then` and `fi`. Otherwise it skips them.\n- `fi` (`if` backwards) ends the statement. The `;` is needed because `then` is on the same line as the condition.\n- An optional `else` part holds commands to run when the condition fails, and `elif` (\"else if\") tries another condition. `rand.sh` below uses both.\n\nSo these lines say: *if the number of arguments is not 1, print a message to standard error and stop the script with status 1* (`>&2` and `exit` are from Day 3). This is the arithmetic notebook's argument check, and nearly every exam script starts with one like it. A script that needs **at least** three arguments tests `(( $# < 3 ))` instead.\n\nOne `if` can sit inside another. The notebook's `iseven.sh` **exits 0 for an even number and 1 for an odd one** (no argument, or a non-number, counts as 0, which is even):\n\n```bash\n#!/bin/bash\n\n# iseven.sh\n\nif (( $# != 0 )); then\n    val=$1\n    if (( val % 2 != 0 )); then\n        exit 1\n    fi\nfi\n```"},{"type":"code","code":"$ ./iseven.sh 2\n$ echo $?\n0\n$ ./iseven.sh 3\n$ echo $?\n1"},{"type":"check","q":"In a script, what do these lines do when it is run with no arguments, and when it is run with 4?\n\n```bash\nif (( $# < 3 )); then\n    echo \"need 3 arguments\" >&2\n    exit 1\nfi\n```","a":"No arguments: `0 < 3` is true, so it prints `need 3 arguments` to standard error and exits with status 1. With 4 arguments `4 < 3` is false, so the commands between `then` and `fi` are skipped and the script carries on."},{"type":"check","q":"What exit status does `(( 5 - 5 ))` give, and why?","a":"`1`, because the expression's value is 0, and a zero value means \"false\"."},{"type":"md","text":"### Random numbers: `$RANDOM`\n\nEach time you use `$RANDOM` it expands to a random integer from 0 to 32767. Use `%` to bring it into a range: `$(( RANDOM % n ))` is from `0` to `n-1`, and `$(( RANDOM % (hi - lo) + lo ))` is from `lo` to `hi-1`. The notebook's `rand.sh`:\n\n```bash\n#!/bin/bash\n\n# rand.sh\n\nif (( $# > 2 )); then\n    echo \"rand.sh: Wrong number of arguments\" >&2\n    exit 1\nfi\nif (( $# == 0 )); then\n    echo $RANDOM\nelif (( $# == 1 )); then\n    n=$(( $RANDOM % $1 ))\n    echo $n\nelse\n    n=$(( $RANDOM % ($2 - $1) + $1 ))\n    echo $n\nfi\n```\n\n`./rand.sh 10` prints a number from 0 to 9; `./rand.sh 30 40` prints one from 30 to 39."},{"type":"check","q":"Write an expression that gives a random die roll from 1 to 6.","a":"`$(( RANDOM % 6 + 1 ))`"},{"type":"md","text":"### Key points\n\n- Integers only: `/` drops the fraction, `%` is the remainder, `**` is power.\n- `(( x = expr ))` does arithmetic and assignment; no `$` needed on names inside.\n- `$(( expr ))` produces the value as text: `echo $(( a + b ))`, `n=$(( ${#s} / 2 ))`.\n- `(( expr ))` succeeds (status 0) when `expr` is non-zero, so `if (( $# != 2 )); then ...` works.\n- `$RANDOM % n` gives 0 to n-1."}]},{"id":"d6-arrays","title":"Arrays","notebook":"bash/arrays.ipynb","priority":"high","examNote":"Quiz 2 (2023) Q1C asked how to create an array holding 1, 2, 3 (`arr=(1 2 3)`) and Q1D how to get the number of elements (`${#arr[@]}`). Q4 (10 marks) started with `arr=(\"$@\")` and needed `${arr[i]}`, element swaps, `${#arr[@]}` and `echo \"${arr[@]}\"` (its loops and functions are Day 6).","blocks":[{"type":"md","text":"An ordinary variable holds one value. An **array** is a single variable that holds many values. Each value is called an **element**, and each element has an **index**: a whole number that says where the element is stored.\n\nBash arrays are **zero-based**: 0 is the smallest legal index. But Bash is looser than Java or Python:\n\n- you do not have to start filling the array at index 0, and\n- the indexes do not have to be next to each other (an array with elements only at indexes 3 and 100 is fine).\n\nAn array with gaps in its indexes is called a **sparse** array.\n\nLike other Bash variables, an array is created automatically the first time you assign to it.\n\n### Creating an array\n\nThe most common way is to list the elements inside parentheses, separated by **spaces**:"},{"type":"code","code":"arr=(1 2 3)\necho \"${arr[0]}\"\necho \"${arr[2]}\"","caption":"Create an array with three elements and print the elements at indexes 0 and 2 (Quiz 2 Q1C)."},{"type":"code","code":"1\n3","caption":"Output"},{"type":"md","text":"Elements that contain spaces must be quoted, just like arguments to a command:\n\n```bash\nanimals=(\"a dog\" \"a cat\" \"a fish\")    # 3 elements\n```\n\nThe notebook shows three more ways to create arrays:\n\n```bash\narr[0]=hello                          # assign one element; creates arr if needed\ndeclare -a y=(10 20 30)               # declare -a also creates an array\narr4=([100]=weird [0]=weirder [1]=weirdest)   # [index]=value sets specific indexes\n```\n\nTo delete a whole array variable, use `unset arr`."},{"type":"pitfall","text":"There are **no commas** between elements and **no spaces around `=`**. `arr=(1, 2, 3)` makes the elements `1,` `2,` and `3`. `arr = (1 2 3)` is a syntax error, because the shell reads `arr` as a command name."},{"type":"code","code":"$ arr=(1, 2, 3)\n$ echo \"${arr[0]}\"\n1,","caption":"The comma becomes part of the element."},{"type":"check","q":"Show how to create a Bash array `arr` that contains the values 1, 2, and 3.","a":"`arr=(1 2 3)`  (spaces between elements, no commas, no spaces around `=`)"},{"type":"try","text":"Type `colors=(red \"light green\" blue)`. Then run `echo \"${colors[1]}\"`, `echo \"${#colors[@]}\"` and `echo $colors[1]`. Before each one, say what you expect: `light green`, `3`, and `red[1]` (the last one is the braces mistake explained just below)."},{"type":"md","text":"### Reading and changing one element\n\nTo get the element at index *i*, write `${arr[i]}`. The braces are **required**.\n\nTo change (or create) one element, write `arr[i]=value` (no `$`, no braces, because you are naming the variable, not expanding it).\n\nThe index is evaluated as an **arithmetic expression**, so you can use a variable or a calculation without a `$`: `${arr[i]}`, `${arr[i+1]}`, and `${arr[$i]}` all work."},{"type":"code","code":"months=(Jan Feb Mar Apr)\ni=2\necho \"${months[i]}\"\necho \"${months[i+1]}\"\nmonths[0]=January\necho \"${months[0]}\""},{"type":"code","code":"Mar\nApr\nJanuary","caption":"Output"},{"type":"md","text":"Forgetting the braces is an easy mistake. `$arr` on its own expands to the element at index **0**. So `$arr[2]` expands `$arr` (the element at index 0) and then glues on the plain text `[2]`:"},{"type":"code","code":"arr=(red green blue)\necho $arr\necho $arr[2]\necho ${arr[2]}"},{"type":"code","code":"red\nred[2]\nblue","caption":"Output"},{"type":"check","q":"`arr=(red green blue)`. What does `echo $arr[1]` print, and why?","a":"`red[1]`. `$arr` means element 0 (`red`), and `[1]` is just text after it. Write `${arr[1]}` to get `green`."},{"type":"md","text":"### Number of elements: `${#arr[@]}`\n\nThe number of elements in `arr` is written `${#arr[@]}` (or `${#arr[*]}`). Compare with `${#str}`, the length of a string, from Day 4: the `#` means \"count\"."},{"type":"code","code":"arr1=(hello)\narr2=(0 1 2 3 4)\narr3=([1]=goodbye)\narr4=([100]=weird [0]=weirder [1]=weirdest)\necho \"# elems in arr1 : ${#arr1[@]}\"\necho \"# elems in arr2 : ${#arr2[@]}\"\necho \"# elems in arr3 : ${#arr3[@]}\"\necho \"# elems in arr4 : ${#arr4[@]}\"","caption":"From the arrays notebook. arr4 has 3 elements even though its largest index is 100."},{"type":"code","code":"# elems in arr1 : 1\n# elems in arr2 : 5\n# elems in arr3 : 1\n# elems in arr4 : 3","caption":"Output"},{"type":"pitfall","text":"`${#arr}` (no `[@]`) is the length of the **string** in element 0, not the number of elements. With `arr=(apple kiwi)`, `${#arr}` is `5` but `${#arr[@]}` is `2`."},{"type":"check","q":"Given a Bash array `arr`, show how to get the number of elements in `arr`.","a":"`${#arr[@]}` (or `${#arr[*]}`). This was Quiz 2 Q1D."},{"type":"md","text":"In an array that is **not** sparse, the indexes run from `0` to `${#arr[@]} - 1`. So the last element is `${arr[${#arr[@]} - 1]}`: the index inside `[ ]` is arithmetic, so the subtraction just works."},{"type":"code","code":"arr=(10 20 30 40)\necho \"${arr[${#arr[@]} - 1]}\"\nlast=$(( ${#arr[@]} - 1 ))\necho \"$last ${arr[last]}\""},{"type":"code","code":"40\n3 40","caption":"Output"},{"type":"check","q":"`arr=(5 8 2 9)`. Write the expansion that gives its last element, without typing the number 3.","a":"`${arr[${#arr[@]} - 1]}`, which is `9`. There are 4 elements, so the last index is `4 - 1 = 3`."},{"type":"md","text":"### The indexes in use: `${!arr[@]}`\n\n`${!arr[@]}` expands to the list of indexes that actually hold elements. This matters for sparse arrays, where the indexes are not simply 0, 1, 2, ..."},{"type":"code","code":"arr1=(hello)\narr2=(Jan Feb Mar Apr)\narr3=([1]=goodbye)\narr4=([100]=weird [0]=weirder [1]=weirdest)\necho ${!arr1[@]}\necho ${!arr2[@]}\necho ${!arr3[@]}\necho ${!arr4[@]}","caption":"Indexes are listed in increasing order."},{"type":"code","code":"0\n0 1 2 3\n1\n0 1 100","caption":"Output"},{"type":"md","text":"### A tiny loop, just for looking at arrays\n\nThe arrays notebook uses a `for` loop to show the elements one at a time. Loops are taught properly on Day 6. For now you only need to **read** this one shape:\n\n```bash\nfor x in one two three; do echo \"$x\"; done\n```\n\nBash takes the words after `in` one at a time, stores the current word in the variable `x`, and runs the commands between `do` and `done` once for each word. (The commands may also go on their own lines between `do` and `done`, as in the example below.) So this prints `one`, `two` and `three` on three lines: **one line per word in the list**. That makes it a handy way to see how many words an array expansion produced.\n\nThe notebook loops over the indexes to print each index with its element:"},{"type":"code","code":"months=(Jan Feb Mar Apr May)\nfor i in \"${!months[@]}\"; do\n    elem=${months[i]}\n    echo \"months[$i] = $elem\"\ndone"},{"type":"code","code":"months[0] = Jan\nmonths[1] = Feb\nmonths[2] = Mar\nmonths[3] = Apr\nmonths[4] = May","caption":"Output"},{"type":"try","text":"Type `for x in one two three; do echo \"$x\"; done` and check that you get three lines. Then try `for x in \"one two\" three; do echo \"$x\"; done`: the quotes make `one two` a single word, so you get two lines."},{"type":"check","q":"`arr=([3]=c [7]=g)`. What do `${#arr[@]}` and `${!arr[@]}` expand to?","a":"`${#arr[@]}` is `2` (two elements). `${!arr[@]}` is `3 7` (the indexes in use)."},{"type":"md","text":"### All the elements: `@` versus `*`, quoted versus unquoted\n\nThere are four ways to expand every element. They differ only when elements contain spaces:\n\n| Expansion | What you get | Use it? |\n|---|---|---|\n| `${arr[@]}` | all elements, then **word splitting** | only if no element has spaces |\n| `${arr[*]}` | same as above | only if no element has spaces |\n| `\"${arr[@]}\"` | each element as **its own word**: `\"${arr[0]}\" \"${arr[1]}\" ...` | **almost always this one** |\n| `\"${arr[*]}\"` | **one single word**: all elements joined by spaces | when you want one string |\n\nHere are the four cases from the notebook. Watch how many times each loop body runs:"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in ${animals[*]}; do echo $i; done","caption":"Unquoted *: the elements are split into 6 words."},{"type":"code","code":"a\ndog\na\ncat\na\nfish","caption":"Output"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in ${animals[@]}; do echo $i; done","caption":"Unquoted @: also 6 words."},{"type":"code","code":"a\ndog\na\ncat\na\nfish","caption":"Output"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in \"${animals[@]}\"; do echo $i; done","caption":"Quoted @: one word per element (3 iterations). This is what you want."},{"type":"code","code":"a dog\na cat\na fish","caption":"Output"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in \"${animals[*]}\"; do echo $i; done","caption":"Quoted *: one single word (1 iteration)."},{"type":"code","code":"a dog a cat a fish","caption":"Output"},{"type":"md","text":"You can also see the difference **without a loop**: copy the expansion into a new array and count the new array's elements. Each word the expansion produces becomes one element:"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\na=(${animals[*]}); b=(${animals[@]}); c=(\"${animals[@]}\"); d=(\"${animals[*]}\")\necho \"${#a[@]} ${#b[@]} ${#c[@]} ${#d[@]}\"\necho \"${d[0]}\""},{"type":"code","code":"6 6 3 1\na dog a cat a fish","caption":"Output: unquoted gives 6 words, quoted @ gives 3, quoted * gives 1."},{"type":"why","q":"Why is `\"${arr[@]}\"` almost always the right choice?","a":"Quoting stops word splitting, so an element like `a dog` stays one word, and `@` (unlike `*`) keeps the elements as **separate** words. You get exactly one word per element, no more and no less. This is the same rule as `\"$@\"` for command line arguments."},{"type":"md","text":"To **print** the whole array on one line, `echo \"${arr[@]}\"` is the usual answer (echo prints its arguments separated by single spaces)."},{"type":"check","q":"`animals=(\"a dog\" \"a cat\")`. After `b=(\"${animals[*]}\")`, what are `${#b[@]}` and `${b[0]}`?","a":"`1` and `a dog a cat`. Quoted `*` joins all the elements into one single word, so `b` gets one element."},{"type":"md","text":"### Appending and concatenating\n\n`arr+=(\"$elem\")` appends one element to the end of `arr`. `arr1+=(\"${arr2[@]}\")` appends every element of `arr2` to `arr1`. The parentheses are essential."},{"type":"code","code":"months=(Jan Feb Mar Apr)\nmonths+=(\"May\")\necho \"${months[@]}\"\necho \"${#months[@]}\""},{"type":"code","code":"Jan Feb Mar Apr May\n5","caption":"Output"},{"type":"md","text":"New elements go **after the largest index in use**, not into the gaps:"},{"type":"code","code":"a[100]=0\nb=(5 6 7)\na+=(\"${b[@]}\")\necho \"${a[@]}\"\necho \"${!a[@]}\"","caption":"From the notebook: appending to a sparse array."},{"type":"code","code":"0 5 6 7\n100 101 102 103","caption":"Output"},{"type":"pitfall","text":"`arr+=x` without parentheses does **not** append an element. It appends the text `x` to the string in element 0:"},{"type":"code","code":"arr=(a b)\narr+=c\necho \"${arr[@]}\"\narr+=(d)\necho \"${arr[@]}\""},{"type":"code","code":"ac b\nac b d","caption":"Output"},{"type":"check","q":"Show how to append the value stored in `x` as a new element at the end of array `nums`.","a":"`nums+=(\"$x\")`"},{"type":"md","text":"### Filling an array from arguments, the keyboard, or a file\n\n**From the command line arguments.** `arr=(\"$@\")` copies every argument into `arr`, one element per argument, keeping arguments with spaces whole. Quiz 2 Q4 started this way."},{"type":"code","code":"$ cat args.sh\n#!/bin/bash\narr=(\"$@\")\necho \"count: ${#arr[@]}\"\necho \"second: ${arr[1]}\"\n$ ./args.sh one \"two three\" four\ncount: 3\nsecond: two three"},{"type":"md","text":"**From the keyboard.** `read -a arr` reads one line from standard input, splits it into words, and stores the words in `arr`. `read -p \"Enter a list: \" -a arr` prints a prompt first. Quotes typed by the user do **not** keep words together here.\n\n**From a file.** `mapfile -t arr < file` (also called `readarray`) reads **every line** of standard input into `arr`, one line per element. The `-t` option removes the newline at the end of each line."},{"type":"code","code":"mapfile -t students < students.txt\necho \"${#students[@]} lines\"\nfor elem in \"${students[@]}\"; do\n    echo \"$elem\"\ndone","caption":"students.txt is the notebook's file (a comment line plus 3 students)."},{"type":"code","code":"4 lines\n# student number, last name, first name\n12345,Parr,Jack-Jack\n23456,Wazowski,Mike\n98765,Best,Lucius","caption":"Output"},{"type":"try","text":"Type `read -p \"Enter some words: \" -a words`, press Enter, type `red green blue` and press Enter again. Then run `echo \"${#words[@]}\"` (3) and `echo \"${words[0]}\"` (red)."},{"type":"check","q":"Which command reads each line of the file `data.txt` into its own element of the array `lines`, without the newlines?","a":"`mapfile -t lines < data.txt` (`readarray -t lines < data.txt` is the same command)."},{"type":"md","text":"### Swapping two elements\n\nSorting algorithms (like the selection sort in Quiz 2 Q4) swap two elements. You need a temporary variable, as in Java:"},{"type":"code","code":"arr=(30 10 20)\ni=0; j=1\ntmp=${arr[i]}\narr[i]=${arr[j]}\narr[j]=$tmp\necho \"${arr[@]}\""},{"type":"code","code":"10 30 20","caption":"Output"},{"type":"md","text":"### Key points\n\n- Create: `arr=(1 2 3)`, `arr=(\"$@\")`, `arr[i]=val`, `mapfile -t arr < file`. Spaces between elements, no commas.\n- One element: `${arr[i]}` (braces required; `$arr` alone is element 0).\n- Count: `${#arr[@]}`. Indexes in use: `${!arr[@]}`. Last element (not sparse): `${arr[${#arr[@]} - 1]}`.\n- All elements: `\"${arr[@]}\"` (one word per element). `\"${arr[*]}\"` is one single word.\n- Append: `arr+=(\"$x\")`. Arrays may be sparse; appends go after the largest index."}]},{"id":"d5-operators","title":"Conditional operators: ! && ||","notebook":"bash/conditional_operators.ipynb","priority":"medium","examNote":"Not asked on its own in past tests, but `!` appears in Quiz 2 Q1E (`[[ ! -r $f ]]`) and you need `&&`/`||` to combine tests in written scripts (e.g. a mark that must be a number *and* at most 100).","blocks":[{"type":"md","text":"Conditions can be **negated**, **combined** and **grouped** with these operators, listed from highest to lowest precedence (precedence = which operator is applied first, like `*` before `+` in math):\n\n1. `( expr )`: the value of *expr* (grouping)\n2. `! expr`: true if *expr* is false, false if *expr* is true\n3. `expr1 && expr2`: true if **both** are true; *expr2* is **not evaluated** if *expr1* is false\n4. `expr1 || expr2`: true if **either** is true; *expr2* is **not evaluated** if *expr1* is true\n\nThey work inside `[[ ]]` and, with the same meaning, inside `(( ))`."},{"type":"md","text":"### The two test commands used here\n\nThe examples put conditions inside an `if` (from the arithmetic topic: the commands after `then` run only when the condition command exits with status `0`). They use two kinds of test command:\n\n- `(( expr ))` for **numbers**, which you know from the arithmetic topic;\n- `[[ expr ]]` for **files and strings**. The next topic covers it fully. For now you need five tests: `[[ -e $f ]]` is true if the file named in `f` exists, `[[ -f $f ]]` if it is a regular file, `[[ -r $f ]]` if you can read it, and `[[ -z $s ]]` / `[[ -n $s ]]` if the string in `s` is empty / not empty. The spaces after `[[` and before `]]` are required."},{"type":"md","text":"### `!` (not)\n\nThe course example creates a file only if it does not already exist:"},{"type":"code","code":"file=./newfile\n\nif [[ ! -e $file ]]; then\n    echo \"Creating $file ...\"\n    touch \"$file\"\nelse\n    echo \"$file already exists\"\nfi"},{"type":"code","code":"$ ./create.sh\nCreating ./newfile ...\n$ ./create.sh\n./newfile already exists","caption":"Running the code above (saved as create.sh) twice."},{"type":"check","q":"Write a condition that is true when the file named in `f` is NOT a directory.","a":"`[[ ! -d $f ]]`"},{"type":"md","text":"### `&&` (and)\n\n\"Is the file a regular file **and** readable?\"\n\n```bash\nif [[ -f $file && -r $file ]]; then\n    echo \"$file is a regular file and readable by $USER\"\nelse\n    echo \"$file is not a regular file and/or not readable by $USER\"\nfi\n```\n\n(`$USER` is a variable the shell sets to your user name.)\n\n**Short-circuit evaluation**: if the left side of `&&` is false, the whole thing is already false, so Bash does not even evaluate the right side. Likewise, if the left side of `||` is true, the right side is skipped."},{"type":"code","code":"$ f=nosuch\n$ if [[ -e $f && -r $f ]]; then echo \"ok\"; else echo \"not ok\"; fi\nnot ok","caption":"-e fails, so -r is never tested."},{"type":"md","text":"### `||` (or) and grouping with `( )`\n\nThe course's leap-year example: a year is a leap year if it is divisible by 400, **or** if it is divisible by 4 **and not** divisible by 100. This is arithmetic, so it goes in `(( ))`, where `%` is the remainder:"},{"type":"code","code":"yr=2000\nif (( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) )); then\n    echo \"$yr is a leap year\"\nelse\n    echo \"$yr is not a leap year\"\nfi"},{"type":"code","code":"2000 is a leap year","caption":"With yr=1900 it prints 1900 is not a leap year (divisible by 100 but not 400); with yr=2024, 2024 is a leap year."},{"type":"md","text":"The parentheses make the meaning clear. Because `&&` has higher precedence than `||`, they happen to be optional here, but writing them is clearer and costs nothing on an exam.\n\nInside `[[ ]]` the same operators combine tests:"},{"type":"code","code":"$ s=\"\"\n$ if [[ ! -z $s || -n $s ]]; then echo yes; else echo no; fi\nno","caption":"! -z \"\" is false, -n \"\" is false; false || false is false."},{"type":"try","text":"Type the leap-year `if` above with `yr=2000`. Then press the Up arrow, change the year to `1900`, and run it again; then `2024` and `2023`. Work out each answer by hand first: is the year divisible by 400? by 4? by 100?"},{"type":"check","q":"What does `x=15; if (( x > 3 && x < 10 )); then echo in; else echo out; fi` print?","a":"`out`. 15 > 3 is true but 15 < 10 is false, and `&&` needs both."},{"type":"why","q":"Why is `[[ -e $f && -r $f ]]` safe even when `f` names a file that does not exist?","a":"Short-circuiting: when `-e $f` is false, `&&` already knows the answer is false and never evaluates `-r $f`. (Here `-r` would also just be false, but in general short-circuiting lets the left test protect the right one.)"},{"type":"pitfall","text":"`&&` and `||` work in two places, with the same meaning: **inside** one `[[ ]]` or `(( ))`, as in `[[ -f $f && -r $f ]]`, or **between two whole commands**, as in `[[ -f $f ]] && [[ -r $f ]]` (the command lists from Day 1). Do not mix the two: in `[[ -f $f ]] && -r $f`, the `-r $f` part is outside the brackets, so Bash tries to run a command named `-r`."},{"type":"md","text":"### Key points\n\n- `!` negates, `&&` needs both, `||` needs either; `( )` groups. Precedence: `( )`, then `!`, then `&&`, then `||`.\n- Short-circuit: `&&` skips the right side if the left is false; `||` skips it if the left is true.\n- Use them inside `[[ ]]` for file/string tests and inside `(( ))` for arithmetic, e.g. the leap-year test.\n- Add parentheses when mixing `&&` and `||`: clearer for you and the marker."}]},{"id":"d5-if","title":"Conditional statements: if, [[ ]] and tests","notebook":"bash/conditional_statements.ipynb","priority":"high","examNote":"Quiz 2 Q1E: *write an `if` statement that prints `not readable` if the file named in `f` is not readable* (`if [[ ! -r $f ]]; then echo \"not readable\"; fi`). Every long exam script starts with an argument check that prints a usage message to stderr and exits with a non-zero status (Assignment 3: `testpw.sh`, `tr220.sh`).","blocks":[{"type":"md","text":"You have already used `if` with `(( ))` and `[[ ]]` conditions earlier today. This topic explains exactly how it works and which tests `[[ ]]` can do, so your scripts can **make decisions**: do one thing if a file exists, something else if it does not; print a usage message if the user forgot an argument; reject input that does not match a regular expression.\n\n### The shape of an `if` statement\n\n```bash\nif test-commands; then\n    commands\nelif test-commands; then\n    commands\nelse\n    commands\nfi\n```\n\n- `if`, `then`, `elif`, `else` and `fi` are **keywords**. `fi` is `if` backwards and ends the statement.\n- `elif` (\"else if\") and `else` are optional. You can have many `elif` parts.\n- The `;` before `then` is required **when `then` is on the same line** as the condition. The `;` separates commands, just like a new line does. So this is the same statement:\n\n```bash\nif test-commands\nthen\n    commands\nfi\n```"},{"type":"pitfall","text":"Forgetting `fi`, or writing `if ... then` with no `;` on one line (`if [[ -e $f ]] then`), is a syntax error. On paper, write `if ...; then` and immediately write the matching `fi` underneath before filling in the middle."},{"type":"check","q":"Write a one-line `if` statement that prints `hi` if the condition `true` succeeds. Where does the `;` go?","a":"`if true; then echo \"hi\"; fi`. A `;` goes before `then` (because it is on the same line) and before `fi` (to end the `echo` command)."},{"type":"md","text":"### The condition is a command: its exit status decides\n\nThis is the unusual part of Bash. The condition of an `if` is not a \"boolean expression\" like in Java. It is **a command**. Bash runs it and looks at its **exit status** (Day 1):\n\n- exit status `0` (success) means **true**, so the `then` part runs;\n- any non-zero exit status (failure) means **false**, so the `elif`/`else` part runs.\n\nThe command `true` does nothing and exits with `0`; `false` does nothing and exits with `1`:"},{"type":"code","code":"$ if true; then echo \"true\"; fi\ntrue\n$ if false; then echo \"false\"; fi\n$","caption":"if false prints nothing: the condition failed and there is no else."},{"type":"md","text":"Any command works as a condition. The course script `cdls2.sh` tries to `cd` into a directory, and uses the exit status of `cd` to decide what to do:"},{"type":"code","code":"#!/bin/bash\n\n# cdls2.sh\n\nif cd \"$1\" 2> /dev/null      # discard standard error output of cd command\nthen\n    # cd successful\n    ls\nelse\n    # cd unsuccessful\n    echo \"error changing to directory $1\" >&2\n    exit 1\nfi"},{"type":"code","code":"$ ./cdls2.sh /bad_dirname\nerror changing to directory /bad_dirname\n$ echo $?\n1"},{"type":"md","text":"Two details:\n\n- `2> /dev/null` throws away `cd`'s own error message. `/dev/null` is the **null device**: a file that discards everything written to it. We only want `cd`'s exit status, not its complaint.\n- `echo \"...\" >&2` sends **our** error message to standard error (Day 3), and `exit 1` ends the script with a failure status. This \"message to stderr, then exit non-zero\" pattern appears in almost every exam script."},{"type":"check","q":"In `if cd \"$1\" 2> /dev/null`, what decides whether the `then` part runs, and what does `2> /dev/null` do?","a":"The exit status of `cd`: 0 (it worked) runs `then`, non-zero runs `else`. `2> /dev/null` discards `cd`'s error message (standard error) so the user only sees the script's own message."},{"type":"why","q":"Why can `if` use `grep` or `cd` as a condition, but `if 5 > 3` does not compare numbers?","a":"Because `if` only ever runs a command and checks its exit status. `if 5 > 3` runs a command named `5` with its output redirected into a file named `3`. To evaluate a comparison you need a command whose job is to evaluate it and set the exit status: `[[ ]]` or `(( ))`."},{"type":"md","text":"### `[[ ]]`: a command that evaluates a logical expression\n\nTo test things like \"does this file exist?\" or \"are these strings equal?\" we need a command that evaluates the expression and sets its exit status to `0` (true) or `1` (false).\n\n- The standard UNIX command for this is `test`, usually written with single brackets: `[ expr ]`. Learn it only if you need scripts that run on many kinds of UNIX shells.\n- Bash (and zsh) also provide **double brackets** `[[ expr ]]`. It has fewer surprises and is what this course uses.\n\n`[[ expr ]]` has exit status `0` if *expr* is true and `1` if it is false."},{"type":"code","code":"$ [[ 5 -lt 7 ]]\n$ echo $?\n0\n$ [[ 5 -gt 7 ]]\n$ echo $?\n1"},{"type":"md","text":"**Spaces are required** after `[[` and before `]]`. `[[` is a word to Bash, like a command name. Without the space, `[[$x` is read as one strange word:"},{"type":"code","code":"$ x=5\n$ if [[$x == 5]]; then echo hi; fi\nbash: [[5: command not found"},{"type":"md","text":"**No word splitting or filename expansion happens inside `[[ ]]`.** So inside `[[ ]]` you usually do not need to double quote variable expansions: `[[ -e $file ]]` works even if `$file` contains spaces. (The course still wants `\"$var\"` everywhere else: in `echo`, `cp`, `mv`, `cd` and so on.) The single-bracket `[ ]` *does* split words, which is one of its surprises:"},{"type":"code","code":"$ s=\"hello world\"\n$ if [ $s == \"hello world\" ]; then echo eq; fi\nbash: [: too many arguments\n$ if [[ $s == \"hello world\" ]]; then echo eq; fi\neq"},{"type":"check","q":"What is wrong with `if [[$name == bob]]; then echo hi; fi`?","a":"There must be a space after `[[` and before `]]`: `if [[ $name == bob ]]; then echo hi; fi`."},{"type":"try","text":"Make a practice folder and test some files:\n\n```bash\nmkdir -p ~/day5 && cd ~/day5\ntouch empty.txt\necho hi > hi.txt\nmkdir sub\n[[ -d sub ]]; echo $?\n[[ -f sub ]]; echo $?\n[[ -s empty.txt ]]; echo $?\n[[ -s hi.txt ]]; echo $?\n```\n\nYou should see `0 1 1 0` (one per line). Then try `if [[ -e nosuch ]]; then echo yes; else echo no; fi`."},{"type":"md","text":"### File tests\n\nFiles are central in UNIX, so there are many tests for them. The ones to memorise:\n\n| Expression | True if ... |\n|---|---|\n| `-e file` | file **e**xists (any kind of file) |\n| `-f file` | file exists and is a regular **f**ile |\n| `-d file` | file exists and is a **d**irectory |\n| `-r file` | file exists and is **r**eadable |\n| `-w file` | file exists and is **w**ritable |\n| `-x file` | file exists and is e**x**ecutable |\n| `-s file` | file exists and has **s**ize greater than zero |\n| `f1 -nt f2` | f1 is newer (modification time) than f2 |\n| `f1 -ot f2` | f1 is older than f2 |\n\nThe course script `test_file.sh` uses several of them (it is a nice model of **nested** `if` statements):"},{"type":"code","code":"#!/bin/bash\n#\n# test_file.sh: Evaluate the status of a file\n\nfile=$1\nif [[ -e $file ]]; then                # no need to double quote $file\n                                       # because word splitting is suppressed\n  if [[ -f $file ]]; then\n    echo \"$file is a regular file\"\n  fi\n  if [[ -d $file ]]; then\n    echo \"$file is a directory\"\n  fi\n  if [[ -r $file ]]; then\n    echo \"$file is readable\"\n  fi\n  if [[ -w $file ]]; then\n    echo \"$file is writable\"\n  fi\n  if [[ -x $file ]]; then\n    echo \"$file is executable\"\n  fi\nelse\n  echo \"$file does not exist\"\n  exit 1\nfi"},{"type":"code","code":"$ ./test_file.sh scripts\nscripts is a directory\nscripts is readable\nscripts is writable\nscripts is executable\n$ ./test_file.sh notes.txt\nnotes.txt is a regular file\nnotes.txt is readable\nnotes.txt is writable\n$ ./test_file.sh no_such_file\nno_such_file does not exist","caption":"scripts is a directory and notes.txt is a file with rw-r--r-- permissions. A directory with x permission counts as \"executable\" (you can cd into it)."},{"type":"md","text":"To test the **opposite**, put `!` in front (the `!` operator from the previous topic). This is exactly Quiz 2 Q1E:\n\n```bash\nif [[ ! -r $f ]]; then echo \"not readable\"; fi\n```"},{"type":"check","q":"Write an `if` statement that prints `not readable` if the file whose name is stored in `f` is not readable.","a":"`if [[ ! -r $f ]]; then echo \"not readable\"; fi`"},{"type":"check","q":"`notes` is a directory. Which of `[[ -e notes ]]`, `[[ -f notes ]]`, `[[ -d notes ]]` are true?","a":"`-e` (it exists) and `-d` (it is a directory). `-f` is false: a directory is not a regular file."},{"type":"md","text":"### String tests\n\n| Expression | True if ... |\n|---|---|\n| `string` | the string is not empty |\n| `-n string` | the length of string is greater than zero |\n| `-z string` | the length of string is zero (empty) |\n| `s1 == s2` (or `s1 = s2`) | the strings are equal |\n| `s1 != s2` | the strings are not equal |\n| `s1 < s2` | s1 comes before s2 lexicographically (dictionary order) |\n| `s1 > s2` | s1 comes after s2 lexicographically |\n| `s1 =~ regex` | s1 matches the regular expression (Day 4) |\n\nThe course script `compstr.sh` does a Java-like `compareTo` of two strings using `if`/`elif`/`else`:"},{"type":"code","code":"#!/bin/bash\n\n# compstr.sh : Java-like compareTo comparison of strings\n\ns1=$1\ns2=$2\nif [[ $s1 == $s2 ]]; then\n    echo 0\nelif [[ $s1 < $s2 ]]; then\n    echo -1\nelse\n    echo 1\nfi"},{"type":"code","code":"$ ./compstr.sh cat cat\n0\n$ ./compstr.sh antelope zebra\n-1\n$ ./compstr.sh tiger poodle\n1\n$ ./compstr.sh 100 2\n-1"},{"type":"pitfall","text":"Inside `[[ ]]`, `==`, `<` and `>` compare **strings**, character by character, even if they look like numbers. `[[ 100 < 2 ]]` is **true** because the character `1` comes before `2`. To compare numbers use `-lt`, `-gt`, ... or `(( ))`."},{"type":"check","q":"What does `[[ 100 < 2 ]]; echo $?` print, and why?","a":"`0` (true). `<` inside `[[ ]]` compares strings lexicographically, and \"100\" comes before \"2\" because `1` comes before `2`."},{"type":"md","text":"#### Pattern matching with `==` and `!=`\n\nIf the right side of `==` or `!=` is **not quoted**, it is treated as a **pattern** (the same glob patterns as filename expansion on Day 2): `*` matches any sequence of characters (even none), `?` matches exactly one character, `[ ]` matches one character from a set."},{"type":"code","code":"$ str=\"avocado\"\n$ if [[ $str == a* ]]; then echo \"starts with a\"; else echo \"does not start with a\"; fi\nstarts with a\n$ if [[ $str == \"a*\" ]]; then echo \"equal\"; else echo \"not equal\"; fi\nnot equal\n$ str=\"K7L3N6\"\n$ if [[ $str == [A-Z][0-9][A-Z][0-9][A-Z][0-9] ]]; then echo \"might be a postal code\"; fi\nmight be a postal code","caption":"Quoting the right side turns the pattern into a plain string: \"a*\" only equals the two characters a and *."},{"type":"md","text":"A pattern like `a?a` matches any three-character string that starts and ends with `a` (`ada`, `aaa`, `a7a`). (The notebook's text writes `a*a` here, but `*` would also match `aa`, `abba`, ... ; `?` is the one-character wildcard.)\n\n`-z` and `-n` test for empty strings:"},{"type":"code","code":"$ s=\"\"\n$ if [[ -z $s ]]; then echo \"empty\"; else echo \"not empty\"; fi\nempty\n$ if [[ $s ]]; then echo \"not empty\"; else echo \"empty\"; fi\nempty"},{"type":"md","text":"#### `-v`: has a variable been assigned?\n\n`[[ -v varname ]]` is true if the variable has been assigned a value (even the empty string). Write the variable's **name**, not `$name`:"},{"type":"code","code":"$ unset x\n$ if [[ -v x ]]; then echo \"x assigned\"; else echo \"x not assigned\"; fi\nx not assigned\n$ x=\n$ if [[ -v x ]]; then echo \"x assigned\"; else echo \"x not assigned\"; fi\nx assigned"},{"type":"check","q":"What is the difference between `[[ $s == a* ]]` and `[[ $s == \"a*\" ]]`?","a":"Unquoted `a*` is a pattern: true for any string starting with `a`. Quoted `\"a*\"` is a plain string: true only if `s` is exactly the two characters `a*`."},{"type":"md","text":"### Integer tests\n\nTo compare integers inside `[[ ]]`, use these operators (think of the letters: **eq**ual, **n**ot **e**qual, **l**ess **t**han, ...):\n\n| Expression | True if ... |\n|---|---|\n| `a -eq b` | a == b |\n| `a -ne b` | a != b |\n| `a -lt b` | a < b |\n| `a -le b` | a <= b |\n| `a -gt b` | a > b |\n| `a -ge b` | a >= b |\n\nOr use **arithmetic** `(( ))` from the first topic today, where `<`, `>`, `==`, `!=`, `<=`, `>=` *do* mean numeric comparison. `(( expr ))` has exit status `0` when *expr* is non-zero (true) and `1` when it is `0` (false), so it works as an `if` condition. Both styles are fine on the exam:"},{"type":"code","code":"$ if [[ 10 -lt 9 ]]; then echo \"less\"; else echo \"not less\"; fi\nnot less\n$ if (( 10 < 9 )); then echo \"less\"; else echo \"not less\"; fi\nnot less\n$ if [[ 10 < 9 ]]; then echo \"less\"; else echo \"not less\"; fi\nless","caption":"The last one is the string trap again: \"10\" < \"9\" as strings."},{"type":"md","text":"The course script `compint.sh` compares integers with a nested `if`:"},{"type":"code","code":"#!/bin/bash\n\n# compint.sh : Java-like compareTo comparison of integers\n\ni1=$1\ni2=$2\nif [[ $i1 -ne $i2 ]]; then           # not equal\n    if [[ $i1 -lt $i2 ]]; then           # less than\n        echo -1\n    else\n        echo 1\n    fi\nelse\n    echo 0\nfi"},{"type":"code","code":"$ ./compint.sh 5 5\n0\n$ ./compint.sh -3 12\n-1\n$ ./compint.sh 22 21\n1\n$ ./compint.sh hello goodbye\n0\n$ ./compint.sh abc 3\n-1\n$ ./compint.sh 2#101 1\n1"},{"type":"md","text":"Surprise: a non-integer such as `hello` used in an integer test is usually **treated as 0**, with no error (so `hello` and `goodbye` are \"equal\"). And `2#101` means 101 in base 2, which is 5. That is why real scripts check the input with a regular expression (Day 4) first: `[[ $1 =~ ^-?[0-9]+$ ]]` is true only for an optional minus sign followed by one or more digits."},{"type":"check","q":"Write a condition that is true when the integer in `n` is at least 10, in two ways.","a":"`[[ $n -ge 10 ]]` or `(( n >= 10 ))`."},{"type":"md","text":"### Checking the command line arguments (the usage message)\n\nBash does not complain if a script uses `$1` and the user gave no arguments: `$1` is just empty. So a script that needs arguments must check `$#` itself, print a **usage message to standard error**, and **exit with a non-zero status**. This is the first thing in almost every exam script:"},{"type":"code","code":"#!/bin/bash\n\n# namedsh.sh\n\nif [[ $# -ne 1 ]]; then\n    # oops, no filename specified\n    echo \"namedsh.sh: output filename required\" >&2\n    exit 2\nfi\n\nif [[ -e $1 ]]; then\n    # oops, specified file already exists\n    echo \"namedsh.sh: $1 already exists\" >&2\n    exit 1\nfi\n\n# specified does not exist, go ahead and create it\necho '#!/bin/bash' > \"$1\"\nchmod u+x \"$1\"","caption":"The course's namedsh.sh (with \"$1\" quoted, as the course requires in commands)."},{"type":"md","text":"The same check written with `(( ))`, as in the Arithmetic notebook and the course's `test_regex.sh`:\n\n```bash\nif (( $# != 1 )); then\n    echo \"Usage: myscript.sh filename\" >&2\n    exit 1\nfi\n```\n\nBecause `exit` ends the script, no `else` is needed: the rest of the script only runs when the arguments are fine. This \"guard clause\" style keeps scripts flat and readable."},{"type":"why","q":"Why does the usage message go to standard error (`>&2`) and why exit with a non-zero status?","a":"Standard error is for messages about problems, so they are not mixed into the script's real output (which may be piped or redirected to a file). A non-zero exit status tells whoever ran the script (a person, `if`, or a grading script) that it failed."},{"type":"md","text":"### Putting it together: a validator with `=~` (Assignment 3 Q1)\n\nOn Day 4 you wrote regular expressions and tested them with `[[ $str =~ $re ]]`. With `if`, `(( ))` and usage messages you can now write the most common long exam script: one that checks its argument against several rules and reports **every** rule that fails. Assignment 3 Q1, `testpw.sh`, has this shape. A strong password (1) has no whitespace, (2) is at least 8 characters long, and contains at least one (3) letter, (4) digit and (5) symbol:"},{"type":"code","code":"#!/bin/bash\n\n# testpw.sh: is a password strong?\n\nif (( $# == 0 )); then\n    echo \"Usage: testpw.sh password\" >&2\n    exit 1\nfi\n\npw=$1\nstatus=0\n\nif [[ $pw =~ [[:space:]] ]]; then\n    echo \"password cannot contain whitespace\" >&2\n    status=2\nfi\n\nif (( ${#pw} < 8 )); then\n    echo \"password length less than 8\" >&2\n    status=2\nfi\n\nif [[ ! $pw =~ [[:alpha:]] ]]; then\n    echo \"password must contain at least one letter\" >&2\n    status=2\nfi\n\nif [[ ! $pw =~ [[:digit:]] ]]; then\n    echo \"password must contain at least one digit\" >&2\n    status=2\nfi\n\nif [[ ! $pw =~ [[:punct:]] ]]; then\n    echo \"password must contain at least one symbol\" >&2\n    status=2\nfi\n\nexit $status"},{"type":"code","code":"$ ./testpw.sh abc\npassword length less than 8\npassword must contain at least one digit\npassword must contain at least one symbol\n$ echo $?\n2\n$ ./testpw.sh 'abc123!@'\n$ echo $?\n0","caption":"abc fails three rules, so three messages; a strong password prints nothing and exits 0."},{"type":"md","text":"How it works:\n\n- The usage check is `(( $# == 0 ))`, not `!= 1`, because the assignment says extra arguments are ignored.\n- **One separate `if` per rule**, not an `elif` chain: `elif` stops at the first true condition, but every failed rule must be reported.\n- The variable `status` starts at `0` and is set to `2` by any failed rule; `exit $status` at the end reports the result. (This is different from the usage check, which must stop the script at once.)\n- \"Must contain\" is a regex with **no anchors** (`[[:digit:]]` matches anywhere), negated with `!` to detect the failure. The length test is arithmetic on `${#pw}` (Day 4).\n- Every message goes to standard error with `>&2`."},{"type":"why","q":"Why can't `testpw.sh` use `exit 2` inside each rule's `if`, the way the usage check uses `exit 1`?","a":"`exit` ends the script immediately, so only the first failed rule would be reported. The assignment wants a message for **every** failed rule, so each rule only records the failure (`status=2`) and the script exits once, at the end, with `exit $status`."},{"type":"try","text":"Save `testpw.sh` in `~/day5`, run `chmod u+x testpw.sh`, and test it with `./testpw.sh`, `./testpw.sh abc`, `./testpw.sh 'pass word 1!'` and `./testpw.sh 'abc123!@'`. After each one type `echo $?` and check you get `1`, `2`, `2` and `0`."},{"type":"md","text":"### Also seen in Bash: `case` (not in the course notebooks)\n\nYou may meet `case` elsewhere. It compares one word against several glob patterns:\n\n```bash\ncase $answer in\n    y|yes) echo \"OK\" ;;\n    n|no)  echo \"cancelled\" ;;\n    *)     echo \"please answer yes or no\" ;;\nesac\n```\n\nThe course notebooks never use it, so you do not need it for the midterm; an `if`/`elif` chain with `[[ $answer == ... ]]` does the same job."},{"type":"md","text":"### Key points\n\n- `if cmd; then ...; elif cmd; then ...; else ...; fi`: the condition is a **command**; exit status `0` means true.\n- `[[ expr ]]` evaluates file, string and integer tests. Spaces after `[[` and before `]]` are required.\n- File tests: `-e -f -d -r -w -x -s`. Strings: `== != < > -z -n`. Integers: `-eq -ne -lt -le -gt -ge` or `(( ))`.\n- Inside `[[ ]]`, `<` and `>` compare **strings**; an unquoted right side of `==`/`!=` is a **glob pattern**.\n- Usage check: `if (( $# != 1 )); then echo \"Usage: ...\" >&2; exit 1; fi`.\n- Validator: `status=0`, one `if` per rule that prints to stderr and sets `status=2`, then `exit $status`."}]},{"id":"d6-loops","title":"Loops","notebook":"bash/loops.ipynb","priority":"high","examNote":"Quiz 2 (2023) Q1F: fill in `for arg in \"$@\"; do`. Quiz 2 Q4 (10 marks) used C-style loops over array indexes inside functions. Assignment 3 used `for f in *.\"$1\"` with the no-match case (Q2, `chext.sh`), nested loops over `*/` and `\"$@\"` (Q3, `checksubs.sh`), and nested loops over the characters of a string (Q4, `hasdups` and `indexof`; Q5, `tr220.sh`).","blocks":[{"type":"md","text":"A **loop** runs the same commands again and again. Bash has four kinds:\n\n1. `while` loops: repeat **while** a test command succeeds (exit status 0)\n2. `until` loops: repeat **until** a test command succeeds (they run while it fails)\n3. `for name in list` loops: run once for each word in a list\n4. C-style `for (( ...; ...; ... ))` loops: counting with arithmetic\n\n### `while` and `until`\n\nToday's two notebooks, `loops` and then `functions`, build on everything from Days 1-5: tests (`[[ ]]`, `(( ))`), arguments (`$1`, `$#`, `\"$@\"`), string expansions and arrays.\n\nRecall from Day 5 that `if` runs its body when the **test command** has exit status 0 (\"true\"). Loops use the same idea:\n\n```bash\nwhile test-command; do\n    commands\ndone\n```\n\nThe test command is usually `(( ))` for numbers or `[[ ]]` for strings and files. Both of these loops count down from 10 to 0:"},{"type":"code","code":"count=10\nuntil (( count < 0 )); do\n    echo $count\n    count=$(( count - 1 ))\ndone | head -n 3","caption":"until: keep going until count < 0 becomes true (output cut to 3 lines with head)."},{"type":"code","code":"10\n9\n8","caption":"Output"},{"type":"code","code":"count=3\nwhile (( count > -1 )); do\n    echo $count\n    (( count-- ))\ndone","caption":"while: keep going while count > -1 is true. (( count-- )) subtracts 1 from count, the opposite of (( count++ )) from Day 5."},{"type":"code","code":"3\n2\n1\n0","caption":"Output"},{"type":"md","text":"Inside `(( ))` you can write variable names without `$` (Day 5). The commands `true` (always exit status 0) and `false` (always 1) from Day 5 give infinite loops: `while true; do ... done` and `until false; do ... done`. You stop such a loop with `break` (later today).\n\nThe notebook's `collatz.sh` uses a `while` loop to print the Collatz sequence: halve *n* if it is even, otherwise replace it with 3*n*+1, until *n* is 1. Everything before the loop is the Day 5 argument checking:"},{"type":"code","code":"#!/bin/bash\n\n# collatz.sh\n\nif (( $# == 0 )); then\n    echo \"collatz.sh: missing positive integer argument\" >&2\n    exit 1\nelse\n    val=$1\nfi\nif [[ ! $val =~ ^[-+]?[0-9]+$ ]]; then\n    echo \"collatz.sh: argument is not an integer\" >&2\n    exit 1\nfi\nif (( val < 1 )); then\n    echo \"collatz.sh: argument is not positive\" >&2\n    exit 2\nfi\necho $val\nwhile (( val != 1 )); do\n    if (( val % 2 == 0 )); then\n        val=$(( val / 2 ))\n    else\n        val=$(( 3 * val + 1 ))\n    fi\n    echo $val\ndone","caption":"scripts/loops/collatz.sh"},{"type":"code","code":"$ ./collatz.sh 6\n6\n3\n10\n5\n16\n8\n4\n2\n1"},{"type":"pitfall","text":"Forgetting to change the loop variable inside the body gives an **infinite loop**: the test never changes. Every `while`/`until` body must move toward the stopping condition, as `(( count-- ))` does here. (Later today you will meet two other ways a loop moves forward: `shift` and reading the next line of a file.) If you start an infinite loop by accident, press **Ctrl + C** (Day 1)."},{"type":"check","q":"What is the difference between `while` and `until`?","a":"`while` repeats as long as the test command **succeeds** (exit status 0); `until` repeats as long as it **fails**, stopping as soon as it succeeds."},{"type":"try","text":"Make a folder for today and go there: `mkdir -p ~/practice/day6 && cd ~/practice/day6`. Type the `while` loop above one line at a time. After the first line Bash shows a `>` prompt: it is waiting for the rest of the loop, and runs it when you type `done`. The loop left `count` at -1, so type `count=3` again. Then press the Up arrow twice to get the loop back (Bash shows it on one line, with `;` between the commands), change `-1` to `0`, and predict the output before you press Enter."},{"type":"md","text":"### `for name in list`\n\n```bash\nfor name in list; do\n    commands\ndone\n```\n\nIn Bash a **list** is just a sequence of words (strings separated by whitespace). The body runs once per word, with the variable *name* set to the current word. The list can come from many places:"},{"type":"code","code":"for i in 3 2 1; do echo $i; done","caption":"Words typed directly."},{"type":"code","code":"3\n2\n1","caption":"Output"},{"type":"code","code":"str=\"this is   a string\"\nfor s in $str; do\n    echo $s\ndone","caption":"An unquoted variable: word splitting breaks it into words (on purpose here)."},{"type":"code","code":"this\nis\na\nstring","caption":"Output"},{"type":"code","code":"for i in {3..0}; do echo $i; done","caption":"Brace expansion (Day 3)."},{"type":"code","code":"3\n2\n1\n0","caption":"Output"},{"type":"code","code":"for word in $(echo one two); do echo \"[$word]\"; done","caption":"Command substitution (Day 3): the output of the command, word split, becomes the list."},{"type":"code","code":"[one]\n[two]","caption":"Output"},{"type":"md","text":"The notebook also counts with `for i in $(seq 10 -1 0)`. `seq FIRST STEP LAST` is a program that prints the numbers from FIRST to LAST, one per line. The notebook warns **not** to count this way: the shell must start a separate process just to run `seq`, for a job the shell can do itself with a C-style loop (below)."},{"type":"md","text":"**Filename expansion (globs).** A glob in the list becomes the matching filenames, sorted. Each filename is one word, **even if it contains spaces**, because word splitting is not applied to glob results. Still quote `\"$f\"` inside the body, where word splitting *would* apply."},{"type":"code","code":"for f in *.txt; do\n    echo \"file: $f\"\ndone","caption":"Directory contains a.txt, 'my notes.txt' and b.md."},{"type":"code","code":"file: a.txt\nfile: my notes.txt","caption":"Output"},{"type":"md","text":"**The no-match case.** If a glob matches **nothing**, Bash leaves the pattern as plain text, so the loop runs **once** with the variable equal to the pattern itself:"},{"type":"code","code":"for f in *.pdf; do\n    echo \"file: $f\"\ndone","caption":"No .pdf files here, yet the body runs once."},{"type":"code","code":"file: *.pdf","caption":"Output"},{"type":"md","text":"A script that then runs `mv \"$f\" ...` would fail with `mv: cannot stat '*.pdf'`. The standard fix (used in Assignment 3's `chext.sh`) is to skip any name that does not exist. Two pieces you need:\n\n- `continue` means \"skip the rest of the body for this word and go on to the next one\" (there is more about it below).\n- `test || command` runs *command* only when *test* fails (the `||` list operator from Day 1).\n\n```bash\nfor f in *.pdf; do\n    [[ -e $f ]] || continue     # no match: skip the literal *.pdf\n    echo \"file: $f\"\ndone\n```\n\nNow the body does nothing when there are no `.pdf` files. (Another fix, mentioned on Day 2, is to run `shopt -s nullglob` first, which makes a non-matching glob expand to nothing.)\n\n**Directories only.** The glob `*/` matches only directories (Day 2), and each name ends with `/`, e.g. `stu1/` and `stu 3/`. Assignment 3's `checksubs.sh` loops with `for d in */; do`."},{"type":"check","q":"A directory has no `.pdf` files. How many times does the body of `for f in *.pdf; do echo \"$f\"; done` run, and what does it print?","a":"Once. It prints `*.pdf`, because a glob that matches nothing is left unchanged."},{"type":"try","text":"In `~/practice/day6`, make three files: `touch a.txt 'my notes.txt' b.md`. Run the `*.txt` loop and check that `my notes.txt` prints as **one** name. Then run the `*.pdf` loop twice: first without the `[[ -e $f ]] || continue` line (it prints `file: *.pdf`), then with it (it prints nothing)."},{"type":"md","text":"### C-style `for`\n\n```bash\nfor (( expr1; expr2; expr3 )); do\n    commands\ndone\n```\n\n*expr1* runs once at the start (set up the counter). *expr2* is checked before each pass; the body runs while it is non-zero (true). *expr3* runs after each pass (update the counter). All three are arithmetic, so no `$` is needed on variables."},{"type":"code","code":"for (( i=10; i >= 0; i -= 5 )); do\n    echo $i\ndone"},{"type":"code","code":"10\n5\n0","caption":"Output"},{"type":"md","text":"**Looping over the characters of a string.** Combine a C-style loop with `${#s}` (length) and `${s:i:1}` (the 1 character at offset *i*), both from Day 4. Inside `(( ))`, `${#s}` still needs its `$`, because it is an expansion, not a plain variable name. Assignment 3 Q4 (`hasdups`, `indexof`) is built on this pattern:"},{"type":"code","code":"s=\"cisc\"\nfor (( i = 0; i < ${#s}; i++ )); do\n    echo \"$i: ${s:i:1}\"\ndone"},{"type":"code","code":"0: c\n1: i\n2: s\n3: c","caption":"Output"},{"type":"md","text":"The same counting loop can visit the elements of an array by index; that is in *Looping over an array* below."},{"type":"check","q":"Write the header of a C-style loop that visits every index `i` of the string `s`.","a":"`for (( i = 0; i < ${#s}; i++ )); do`"},{"type":"md","text":"### Looping over the command line arguments: `\"$@\"`\n\n`\"$@\"` expands to `\"$1\" \"$2\" \"$3\" ...`: one word per argument, spaces kept. So `for arg in \"$@\"` visits each argument exactly once (Quiz 2 Q1F asked for exactly this)."},{"type":"code","code":"#!/bin/bash\n\n# for_each_arg.sh\n\ni=1\nfor arg in \"$@\"; do\n    echo \"\\$${i} : $arg\"\n    (( i++ ))\ndone","caption":"scripts/loops/for_each_arg.sh"},{"type":"code","code":"$ ./for_each_arg.sh arg1 \"arg2 has some spaces\" \"arg3 has some spaces, too\"\n$1 : arg1\n$2 : arg2 has some spaces\n$3 : arg3 has some spaces, too"},{"type":"md","text":"`bad_for_each_arg.sh` is identical except that it says `for arg in $@` (no quotes). Unquoted, `$@` becomes `$1 $2 $3`, and word splitting breaks every argument at its spaces:"},{"type":"code","code":"$ ./bad_for_each_arg.sh arg1 \"arg2 has some spaces\" \"arg3 has some spaces, too\"\n$1 : arg1\n$2 : arg2\n$3 : has\n$4 : some\n$5 : spaces\n$6 : arg3\n$7 : has\n$8 : some\n$9 : spaces,\n$10 : too"},{"type":"why","q":"Why do the quotes in `\"$@\"` matter even though `$@` already means \"all the arguments\"?","a":"Without quotes, the shell performs word splitting on the expanded arguments, so one argument with spaces turns into several words. With quotes, each argument is kept as exactly one word. That is why the bad script reports 10 arguments instead of 3."},{"type":"md","text":"**`shift`.** Another common pattern is a `while` loop with `shift`. `shift` moves every argument one place left (`$2` becomes `$1`, ...), drops the old `$1`, and lowers `$#` by one. `shift n` shifts by *n*."},{"type":"code","code":"#!/bin/bash\n\n# shift_arg.sh\n\nwhile (( $# > 0 )); do\n    # do something with first positional parameter\n    # e.g., print its value\n    echo \"$1\"\n\n    # now shift positional parameters\n    shift\ndone","caption":"scripts/loops/shift_arg.sh"},{"type":"code","code":"$ ./shift_arg.sh arg1 \"arg2 has some spaces\"\narg1\narg2 has some spaces"},{"type":"check","q":"Fill in the blank so the loop processes each command line argument: `for arg in ____; do`","a":"`\"$@\"` (with the double quotes)."},{"type":"md","text":"### Looping over an array\n\nOn Day 5 you stored values in arrays. You visit them in the same ways you visit the arguments:\n\n| Loop header | Visits |\n|---|---|\n| `for x in \"${arr[@]}\"; do` | each **element**, one word per element (like `\"$@\"`) |\n| `for i in \"${!arr[@]}\"; do` | each **index** in use, even in a sparse array |\n| `for (( i = 0; i < ${#arr[@]}; i++ )); do` | indexes 0 to n-1 (only for an array that is not sparse, such as `arr=(\"$@\")`) |"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor a in \"${animals[@]}\"; do\n    echo \"[$a]\"\ndone","caption":"Quoted \"${arr[@]}\": one pass per element, spaces kept."},{"type":"code","code":"[a dog]\n[a cat]\n[a fish]","caption":"Output"},{"type":"code","code":"arr=([1]=x [4]=y)\nfor i in \"${!arr[@]}\"; do\n    echo \"index $i holds ${arr[i]}\"\ndone","caption":"A sparse array: only indexes 1 and 4 are in use."},{"type":"code","code":"index 1 holds x\nindex 4 holds y","caption":"Output"},{"type":"md","text":"To go **backwards**, start at the last index, `${#arr[@]} - 1`, and count down with `i--`. Inside `(( ))` an element can be written `arr[i]` with no `$` or braces, so adding up an array is `(( total += arr[i] ))`. Outside `(( ))` you need the full `${arr[i]}`."},{"type":"code","code":"nums=(4 8 15)\nfor (( i = ${#nums[@]} - 1; i >= 0; i-- )); do\n    echo \"${nums[i]}\"\ndone\ntotal=0\nfor (( i = 0; i < ${#nums[@]}; i++ )); do\n    (( total += nums[i] ))\ndone\necho \"total: $total\""},{"type":"code","code":"15\n8\n4\ntotal: 27","caption":"Output"},{"type":"pitfall","text":"`for x in ${arr[@]}` (no quotes) word-splits the elements, so `\"a dog\"` gives two passes, `a` and `dog`. `for x in \"${arr[*]}\"` runs only **once**, because `\"${arr[*]}\"` is one word with all the elements joined by spaces (Day 5)."},{"type":"check","q":"Array `files` holds filenames, some with spaces. Write the loop header that visits each filename exactly once.","a":"`for f in \"${files[@]}\"; do` (quoted, just like `\"$@\"`)."},{"type":"md","text":"### `break` and `continue`\n\n- `break` leaves the loop immediately.\n- `continue` skips the rest of this pass and starts the next one.\n\nIn nested loops, `break 2` / `continue 2` act on the loop one level further out."},{"type":"code","code":"for i in 1 2 3 4 5 6; do\n    if (( i == 2 )); then\n        continue\n    fi\n    if (( i == 5 )); then\n        break\n    fi\n    echo $i\ndone"},{"type":"code","code":"1\n3\n4","caption":"Output"},{"type":"check","q":"In the loop above, why is 6 never printed?","a":"When `i` is 5, `break` ends the whole loop, so the pass for 6 never happens."},{"type":"md","text":"### Reading a file one line at a time\n\n```bash\nwhile read -r line; do\n    echo \"$line\"\ndone < \"$file\"\n```\n\n`read` is a built-in command that reads **one line** from standard input and stores it in a variable (here `line`). The redirection `< \"$file\"` after `done` feeds the file to the whole loop. Each time `read` runs, it reads the next line into `line`. `read` succeeds (status 0) while there is a line to read, and fails at the end of the file, which ends the loop. `-r` makes `read` treat backslashes as ordinary characters.\n\nThe file `students.txt` below starts with a comment line. Skip it with a regex test (Day 4) and `continue`:"},{"type":"code","code":"$ cat students.txt\n# student number, last name, first name\n12345,Parr,Jack-Jack\n23456,Wazowski,Mike\n98765,Best,Lucius","caption":"The notebook's file scripts/loops/students.txt, used in the next examples."},{"type":"code","code":"file=\"students.txt\"\nwhile read -r line; do\n    if [[ $line =~ ^# ]]; then\n        continue\n    fi\n    echo \"$line\"\ndone < \"$file\""},{"type":"code","code":"12345,Parr,Jack-Jack\n23456,Wazowski,Mike\n98765,Best,Lucius","caption":"Output"},{"type":"md","text":"`read` can also **split** each line into several variables, using the characters in `IFS` (the word-splitting characters from Day 3). Writing `IFS=\",\"` just before `read` sets it only for that one command. The first field goes in the first variable, the second in the second, and the **rest of the line** in the last one:"},{"type":"code","code":"while IFS=\",\" read -r number last first; do\n    if [[ $number =~ ^# ]]; then\n        continue\n    fi\n    echo \"$first $last\"\ndone < students.txt"},{"type":"code","code":"Jack-Jack Parr\nMike Wazowski\nLucius Best","caption":"Output"},{"type":"pitfall","text":"The last line of a file is skipped by `while read` if it does **not** end with a newline (`read` fails on it). Also put the redirection after `done`. Writing `while read -r line < \"$file\"; do` re-opens the file on every pass, so it reads the first line forever."},{"type":"check","q":"Where does `< \"$file\"` go in a `while read` loop?","a":"After `done`: `done < \"$file\"`. That way the whole loop reads from the file, one line per pass."},{"type":"try","text":"In `~/practice/day6`, open `students.txt` with `nano students.txt`, type the four lines shown above, and save (Ctrl + O, Enter, Ctrl + X). Run both loops. Then delete the `if ... fi` lines from the first loop and run it again: the comment line now prints too."},{"type":"md","text":"### Nested loops\n\nA loop inside a loop runs its whole inner loop once per pass of the outer loop:"},{"type":"code","code":"for i in 1 2; do\n    for c in a b c; do\n        echo \"$i$c\"\n    done\ndone","caption":"The inner loop runs all 3 of its passes for each of the 2 outer passes: 6 lines."},{"type":"code","code":"1a\n1b\n1c\n2a\n2b\n2c","caption":"Output"},{"type":"md","text":"Assignment 3's `checksubs.sh` loops over directories (outer) and over the expected files (inner):\n\n```bash\nfor d in */; do\n    for f in \"$@\"; do\n        if [[ ! -f $d$f ]]; then\n            echo \"$d\" >&2\n            break            # one message per directory is enough\n        fi\n    done\ndone\n```\n\nNote `$d$f`: `d` already ends with `/`, so `stu1/` + `README` is `stu1/README`.\n\n`break` leaves only the **inner** loop, so the outer loop goes on to the next directory. Assignment 3 Q4's `hasdups` also nests two loops, both C-style over the same string; its inner loop starts at `j = i + 1`, so each character is compared only with the characters after it."},{"type":"check","q":"In `checksubs.sh`, why is the path written `$d$f` and not `$d/$f`?","a":"Names produced by the glob `*/` already end with `/` (e.g. `stu1/`), so `$d$f` gives `stu1/README`. (`$d/$f` gives `stu1//README`, which also works, because repeated slashes act like one.)"},{"type":"md","text":"### Key points\n\n- `while`/`until` loop on a test command's exit status; use `(( ))` or `[[ ]]`.\n- `for x in list`: lists come from words, unquoted variables, globs, `{a..b}`, `$( )`.\n- A glob that matches nothing stays literal: guard with `[[ -e $f ]] || continue`.\n- `for (( i = 0; i < n; i++ ))` for counting; `${s:i:1}` for the characters of a string.\n- Arrays: `for x in \"${arr[@]}\"` (elements), `for i in \"${!arr[@]}\"` (indexes), or a C-style loop up to `${#arr[@]}`.\n- `for arg in \"$@\"` (quoted!) or `while (( $# > 0 )); do ...; shift; done` for arguments.\n- `while read -r line; do ...; done < \"$file\"` reads a file line by line; nested loops run the inner loop fully for each outer pass."}]},{"id":"d6-functions","title":"Functions","notebook":"bash/functions.ipynb","priority":"high","examNote":"Quiz 2 (2023) Q4 (10 marks, a third of the quiz): write `sort` and `minidx` functions that sort an array; you choose how `minidx` returns its answer (global variable or `echo` + `$( )`). Assignment 3 Q4 wrote functions in a sourced file that print a result **and** set a return status (`hasdups`, `indexof`).","blocks":[{"type":"md","text":"A **function** is a named group of commands. Once defined, you run (call) it by typing its name, exactly like a command.\n\n### Declaring a function\n\nThe course writes functions like this:\n\n```bash\nfname() {\n    commands\n}\n```\n\nBash also accepts `function fname { commands }`. It is legal but less portable; you may see it on old tests (Quiz 2 Q4 used it), but write `fname() { ... }` yourself.\n\n**Brace rules.** The `{` must be followed by a space or newline, and the `}` must start a new command: put it on its own line (course style), or after a `;` if you write the function on one line. Otherwise Bash cannot tell that the brace is a delimiter and you get a syntax error:"},{"type":"code","code":"$ cat bad.sh\n#!/bin/bash\nfname() {echo \"inside function\"\n}\n$ ./bad.sh\n./bad.sh: line 2: syntax error near unexpected token `{echo'\n./bad.sh: line 2: `fname() {echo \"inside function\"'","caption":"No space after {."},{"type":"code","code":"$ cat missing_newline.sh\n#!/bin/bash\nfname() {\n    echo \"inside function\" }\n$ ./missing_newline.sh\n./missing_newline.sh: line 4: syntax error: unexpected end of file","caption":"The } is on the same line as echo, so Bash treats it as one more argument to echo and the function body never ends."},{"type":"code","code":"greet() { echo \"Hello\"; }\ngreet","caption":"One-line form: note the space after { and the ; before }."},{"type":"code","code":"Hello","caption":"Output"},{"type":"try","text":"Type `greet() { echo \"Hello\"; }` and press Enter: nothing prints, because defining a function does not run it. Now type `greet`. Then run `type greet` (Day 1): it reports that `greet` is a function and shows its body. Last, try `say() {echo hi; }` and read the error."},{"type":"md","text":"A function must be **defined before the line that calls it runs**. Bash reads a script top to bottom; calling a function earlier gives `command not found`. That is why scripts put their functions at the top."},{"type":"code","code":"$ cat early.sh\n#!/bin/bash\ngreet\ngreet() {\n    echo \"Hello\"\n}\ngreet\n$ ./early.sh\n./early.sh: line 2: greet: command not found\nHello"},{"type":"check","q":"Why is `say() {echo hi; }` a syntax error?","a":"There is no space or newline after `{`, so Bash reads `{echo` as one word instead of seeing the brace that opens the body."},{"type":"md","text":"### Arguments: `$1`, `$#`, `$@` inside a function\n\nFunction parameters have **no names**. While a function runs, the positional parameters `$1`, `$2`, ..., `$#` and `$@` are **temporarily replaced** by the function's own arguments. When the function returns, the script's arguments are back. Calling a function with the wrong number of arguments is not an error (missing ones are just empty), exactly like a script. The notebook's `func_params.sh` shows this; here is a shorter version:"},{"type":"code","code":"$ cat params.sh\n#!/bin/bash\nshow() {\n    echo \"$# arguments: 1=[$1] 2=[$2]\"\n}\nshow\nshow a\nshow a \"b c\" d\necho \"script has $# arguments, \\$1 is $1\"\n$ ./params.sh X Y Z\n0 arguments: 1=[] 2=[]\n1 arguments: 1=[a] 2=[]\n3 arguments: 1=[a] 2=[b c]\nscript has 3 arguments, $1 is X"},{"type":"md","text":"Inside a function you **cannot see the script's `$1`**. If the function needs the script's arguments, pass them in: `fname \"$@\"` (quoted, so arguments with spaces stay whole)."},{"type":"check","q":"Inside a function, what does `$1` mean?","a":"The first argument passed **to the function** (not the script's first argument). `$#` is the number of arguments passed to the function."},{"type":"md","text":"### Exit status and `return`\n\nA function sets an **exit status**, just like a command:\n\n- by default, the exit status of the **last command** it ran, or\n- explicitly with `return n`, which stops the function immediately.\n\nThe status is always 0-255: `return n` keeps only the lowest 8 bits of *n* (so `return 256` gives 0 and `return 300` gives 44). Read it with `$?` (Day 1) right after the call, or use the call directly as the test of an `if` or `while`:"},{"type":"code","code":"is_int() {\n    if [[ $1 =~ ^[-+]?[0-9]+$ ]]; then\n        return 0\n    else\n        return 1\n    fi\n}\nis_int 42; echo \"42 -> $?\"\nis_int 4x; echo \"4x -> $?\"\nif is_int -7; then echo \"-7 is an int\"; fi","caption":"is_int is from max.sh. 0 means true (success)."},{"type":"code","code":"42 -> 0\n4x -> 1\n-7 is an int","caption":"Output"},{"type":"code","code":"f() { return 300; }\nf; echo $?","caption":"300 does not fit in 8 bits: 300 - 256 = 44."},{"type":"code","code":"44","caption":"Output"},{"type":"pitfall","text":"`return` is **not** a way to hand back a result like 1000 or a string. Use it only for success/failure. Also don't confuse `return` with `exit`: `exit` inside a function ends the **whole script**."},{"type":"code","code":"$ cat quit.sh\n#!/bin/bash\nstop() {\n    exit 3\n}\necho before\nstop\necho after\n$ ./quit.sh; echo \"status $?\"\nbefore\nstatus 3","caption":"'after' never prints."},{"type":"check","q":"A function's last command is `return 257`. What is `$?` after the call?","a":"`1` (257 - 256). Only the lowest 8 bits are kept."},{"type":"md","text":"### Getting a value out of a function\n\nThere are two techniques.\n\n**1. Print it, and capture it with command substitution.** The function `echo`es the result; the caller writes `var=$(fname args)`. This is how `max.sh` works:"},{"type":"code","code":"#!/bin/bash\n\n# max.sh\n\n# prints the maximum of two integer arguments\n# prints the first integer if both values are equal\nmax2() {\n    if (( $1 >= $2 )); then\n        echo $1\n    else\n        echo $2\n    fi\n}\n\n# exits with 0 if argument is an integer, 1 otherwise\nis_int() {\n    if [[ $1 =~ ^[-+]?[0-9]+$ ]]; then \n        return 0\n    else\n        return 1\n    fi\n}\n\n\nif (( $# == 0 )); then \n    exit 1\nfi\nif is_int \"$1\"; then \n    hi=$1\nelse \n    exit 2\nfi\nwhile (( $# > 0 )); do\n    if is_int \"$1\"; then \n        hi=$(max2 $hi $1)\n    else\n        exit 2\n    fi\n    shift\ndone\necho $hi","caption":"scripts/functions/max.sh (it uses the while + shift loop from the loops lesson)"},{"type":"code","code":"$ ./max.sh 1 5 7 4\n7\n$ ./max.sh; echo $?\n1\n$ ./max.sh 3 x; echo $?\n2"},{"type":"md","text":"The downside: `$( )` runs the function in a **subshell** (a copy of the shell), which is slow, and any variables the function sets are lost when the subshell ends.\n\n**2. Set a variable the caller can see.** Because of dynamic scoping (next section), a function can assign to an ordinary (non-local) variable and the caller reads it afterwards. `remax.sh` is `max.sh` rewritten so that `max2` stores its answer in `hi`:\n\n```bash\nmax2() {\n    if (( $1 >= $2 )); then\n        hi=$1\n    else\n        hi=$2\n    fi\n}\n...\n        max2 $hi $1        # instead of hi=$(max2 $hi $1)\n```"},{"type":"code","code":"$ ./remax.sh 5 10 1\n10"},{"type":"md","text":"Quiz 2 Q4's `minidx` used this second technique: it set a global variable `idx` that `sort` then used (see the last section of this lesson)."},{"type":"why","q":"Why can't you get a result out of a function with `x=$(f)` if `f` returns its answer by setting a global variable?","a":"`$( )` runs `f` in a subshell. The variable is set in that copy of the shell and disappears when the subshell ends; also `$( )` captures only what `f` **prints**. Pick one technique: print + `$( )`, or set a variable + call `f` normally."},{"type":"check","q":"Function `double` prints twice its argument. Store `double 21`'s result in `x`.","a":"`x=$(double 21)`"},{"type":"md","text":"**Both at once.** A function can print a result **and** set a status. Assignment 3 Q4's `indexof` prints the index (or `-1`) and returns 0 (found) or 1 (not found). The exit status of `var=$( ... )` is the status of the command inside, so the caller gets both:"},{"type":"code","code":"indexof() {\n    for (( i = 0; i < ${#2}; i++ )); do\n        if [[ ${2:i:1} == \"$1\" ]]; then\n            echo \"$i\"\n            return 0\n        fi\n    done\n    echo -1\n    return 1\n}\ni=$(indexof c abcabc); echo \"status $? index $i\"\ni=$(indexof z abc); echo \"status $? index $i\"\nif i=$(indexof b abc); then echo \"found b at $i\"; fi","caption":"indexof CH STR. ${#2} is the length of $2; ${2:i:1} is its character at index i."},{"type":"code","code":"status 0 index 2\nstatus 1 index -1\nfound b at 1","caption":"Output"},{"type":"md","text":"### Dynamic scoping\n\nBash uses **dynamic scoping**: the variables a function can see depend on **who called it**, not on where it is written. By default every variable is global: a function sees the caller's variables, and anything it assigns stays visible to the caller after it returns."},{"type":"code","code":"#!/bin/bash\n\n# dynamic_scope.sh\n\nf() {\n    echo \"  a at beginning of f()   = $a\"\n    a=\"f: hello\"\n    g\n    echo \"  a at end of f()         = $a\"\n    echo \"  b at end of f()         = $b\"\n}\n\ng() {\n    echo \"    a at beginning of g() = $a\"\n    b=\"g: goodbye\"\n    echo \"    a at end of g()       = $a\"\n}\n\na=\"hello\"\necho \"a before calling f()      = $a\"\nf\necho \"a after calling f()       = $a\"\necho \"b after calling f()       = $b\"","caption":"scripts/functions/dynamic_scope.sh"},{"type":"code","code":"$ ./dynamic_scope.sh\na before calling f()      = hello\n  a at beginning of f()   = hello\n    a at beginning of g() = f: hello\n    a at end of g()       = f: hello\n  a at end of f()         = f: hello\n  b at end of f()         = g: goodbye\na after calling f()       = f: hello\nb after calling f()       = g: goodbye"},{"type":"md","text":"Trace: the script sets `a`; `f` sees it and changes it; `g` (called by `f`) sees the changed `a` and **creates** `b`; `b` is then visible in `f` and in the main script.\n\n### `local` variables\n\nThis sharing can cause bugs. Here a function accidentally changes the loop counter `i`:"},{"type":"code","code":"some_function() {\n    i=100\n}\nfor (( i = 0; i < 10; i++ )); do\n    echo $i\n    some_function\ndone","caption":"Only one pass: some_function sets i to 100, then i++ makes 101, and 101 < 10 is false."},{"type":"code","code":"0","caption":"Output"},{"type":"md","text":"`local i=100` creates a **new** `i` that exists only while `some_function` runs, so the script's `i` is untouched:"},{"type":"code","code":"some_function() {\n    local i=100\n}\nfor (( i = 0; i < 3; i++ )); do\n    echo $i\n    some_function\ndone"},{"type":"code","code":"0\n1\n2","caption":"Output"},{"type":"md","text":"A `local` variable is still visible to any function that the declaring function **calls** (dynamic scoping again):"},{"type":"code","code":"some_function() {\n    local i=100\n    some_other_function\n}\nsome_other_function() {\n    echo \"some_other_function i = $i\"\n}\nfor (( i = 0; i < 2; i++ )); do\n    echo $i\n    some_function\ndone"},{"type":"code","code":"0\nsome_other_function i = 100\n1\nsome_other_function i = 100","caption":"Output"},{"type":"md","text":"Good habit: declare every helper variable in a function `local` (`local i j`, `local s=$1`) unless you deliberately use it to return a value."},{"type":"check","q":"What does `local` do?","a":"It creates a variable that belongs to the current function call (and is visible to functions it calls) and disappears when the function returns, so it cannot overwrite a variable of the same name in the caller."},{"type":"md","text":"### A file of functions and `source`\n\nA file can hold only function definitions (Assignment 3's `Q4.sh` had no shebang). `source ./funcs.sh` (or `. ./funcs.sh`) runs that file **in the current shell**, so its functions become defined there and you can call them, or use them from another script:"},{"type":"code","code":"$ cat funcs.sh\n# funcs.sh -- source me\nshout() {\n    echo \"$1!\"\n    return 5\n}\n$ source ./funcs.sh\n$ shout hello there\nhello!\n$ echo $?\n5"},{"type":"md","text":"Running `./funcs.sh` instead would define the functions in a **separate** process that ends immediately, so nothing would be defined in your shell."},{"type":"check","q":"Why must a file of functions be loaded with `source ./funcs.sh` rather than run with `./funcs.sh`?","a":"`source` runs the file in the **current** shell, so the functions stay defined there. `./funcs.sh` runs in a separate process; the definitions vanish when it ends."},{"type":"try","text":"In `~/practice/day6`, use nano to save the `shout` function above (from the `# funcs.sh` comment to the `}`) as `funcs.sh`. Run `bash funcs.sh` and then `shout hi`: you get `command not found`. Now run `source ./funcs.sh` and `shout hi` again: it works."},{"type":"md","text":"### Putting it together: functions that share an array (Quiz 2 Q4)\n\nQuiz 2's 10-mark question was **selection sort**: for each index `j`, find the index of the smallest element from `j` to the end (`minidx`), then swap that element into position `j`. Because variables are global, the functions do not need to receive the array: they all see `arr` and `n`. `minidx` hands back its answer by setting the global variable `idx`:"},{"type":"code","code":"arr=(0 3 1 4 2)\nn=${#arr[@]}\n\n# minidx START: sets idx to the index of the sma
