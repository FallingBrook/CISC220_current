s years 1900 to 2099, and `^(0[1-9]|1[0-2])$` matches months `01` to `12`."},{"type":"code","code":"$ ./test_regex.sh java \"a|b\"\nThe string java is matched by the regex a|b"},{"type":"check","q":"Does `^b|cat$` match `bobcat`? Does `(^b|^c)at$` match it?","a":"`^b|cat$`: yes (it starts with `b`; it also ends with `cat`). `(^b|^c)at$`: no, that only matches exactly `bat` or `cat`."},{"type":"md","text":"### Writing a regex: start and end with a lowercase letter (Quiz 2 Q1B)\n\n*Provide a regular expression that matches all strings that start and end with a lowercase English letter.* Build it piece by piece:\n\n1. Start with a lowercase letter: `^[a-z]`\n2. End with a lowercase letter: `[a-z]$`\n3. Anything in between: `.*`\n\nThat gives `^[a-z].*[a-z]$`. But it needs **at least two** characters, so the one-letter string `a` (which starts and ends with a lowercase letter) is not matched. Fix: make \"anything, then a final letter\" optional with `( )?`:\n\n```\n^[a-z](.*[a-z])?$\n```\n\nCheck it against test strings (assume the C locale):\n\n| String | `^[a-z]+$` | `^[a-z].*[a-z]$` | `^[a-z](.*[a-z])?$` |\n|---|---|---|---|\n| `a` | match | **no** | match |\n| `abc` | match | match | match |\n| `x-ray` | **no** | match | match |\n| `a1b` | **no** | match | match |\n| `aB` | no | no | no |\n| `Ab` | no | no | no |\n\nThe posted answer key accepted `^[a-z]+$` and `^[a-z]*[a-z]$` (these are the same pattern) as correct and `^[a-z].*[a-z]$` as sufficient. Notice that `^[a-z]+$` really means \"**only** lowercase letters\", so it rejects `x-ray`. Write `^[a-z](.*[a-z])?$` (or `^[a-z]$|^[a-z].*[a-z]$`): it is correct under any reading of the question."},{"type":"why","q":"Why does `^[a-z].*[a-z]$` fail to match the string `a`?","a":"It contains two separate `[a-z]` atoms, each of which must match one character, so the string needs at least two characters. With one character, the first `[a-z]` uses the `a` and nothing is left for the last `[a-z]`."},{"type":"md","text":"### `grep`: search files for lines that match a regex\n\n`grep` (\"global regular expression print\") prints the **lines** of files (or of standard input) that match a regex. Use `-E` for the extended syntax described above (without it, `grep` uses an older \"basic\" syntax in which `+ ? | { } ( )` are not special):\n\n```\ngrep -E [options] regex [file...]\n```\n\nUseful options taught in the course: `-n` (print line numbers), `-i` (ignore upper/lower case). If no file is given, `grep` reads standard input, so it works at the end of a pipe. Quote the regex (single quotes are safest) so the shell does not expand `*`, `?`, `$`, `|`, `[ ]` first."},{"type":"code","code":"$ cat bin.txt\nzip\ngzip\nzipinfo\nbunzip2\nfunzip\nunzip\n$ grep -E zip bin.txt\nzip\ngzip\nzipinfo\nbunzip2\nfunzip\nunzip\n$ grep -E '^zip' bin.txt\nzip\nzipinfo\n$ grep -E 'zip$' bin.txt\nzip\ngzip\nfunzip\nunzip","caption":"In the notebook the input is ls /usr/bin | grep -E zip; here a small file stands in for /usr/bin."},{"type":"code","code":"$ cat pets.txt\ncat\ndog\ncatalog\nCat\nbobcat\n$ grep -En 'o' pets.txt\n2:dog\n3:catalog\n5:bobcat\n$ grep -Ei 'cat$' pets.txt\ncat\nCat\nbobcat"},{"type":"try","text":"In `~/practice`, make `pets.txt` with the five lines above (`printf '%s\\n' cat dog catalog Cat bobcat > pets.txt` writes them in one go). Run the two `grep` commands, then `grep -E 'cat' pets.txt` and `grep -E '^cat$' pets.txt`, and explain the differences."},{"type":"md","text":"The notebook also finds `for` loops in a Java file with `grep -En \"for[[:blank:]]*[(]\" AllWordsLookup.java`: `for`, then zero or more blanks, then a literal `(` (the `(` is a metacharacter, so it is put inside `[ ]`). And a crossword helper: `grep -Ei \"^.ak.s$\" /usr/share/dict/words` finds five-letter words like `makes` and `takes`.\n\n`grep` also sets its exit status: `0` if some line matched, `1` if none did. So you can act on it with `&&` and `||`, throwing its output away with `> /dev/null` (Day 3):\n\n```bash\ngrep -E '^dog$' pets.txt > /dev/null && echo \"found\"\n```\n\n(On Day 5 you will also see `grep` used as the condition of an `if`.)"},{"type":"check","q":"Write a command that prints, with line numbers, the lines of `log.txt` that start with `ERROR`.","a":"`grep -En '^ERROR' log.txt`"},{"type":"md","text":"### Putting it together: a password checker (Assignment 3 Q1 style)\n\nAssignment 3 Q1 (`testpw.sh`) checks that a password is strong and prints a message for **every** rule it breaks. The heart of it is five regex tests, one line per rule:\n\n- A rule that is broken when the regex **matches** (whitespace is not allowed) uses `&&`: print the message when the test succeeds.\n- A rule that is broken when the regex does **not** match (must contain a digit) uses `||`: print the message when the test fails.\n\nThe length rule needs no arithmetic: `.{8}` means \"any 8 characters in a row\", so `[[ $pw =~ .{8} ]]` is true exactly when the password has at least 8 characters. The messages are errors, so they go to standard error with `>&2` (Day 3). Because no line uses `exit`, every rule is checked and every failing rule is reported."},{"type":"code","code":"#!/bin/bash\n\n# testpw.sh: report every rule that the password $1 breaks\n\npw=$1\n\n[[ $pw =~ [[:space:]] ]] && echo \"password cannot contain whitespace\" >&2\n[[ $pw =~ .{8} ]] || echo \"password length less than 8\" >&2\n[[ $pw =~ [[:alpha:]] ]] || echo \"password must contain at least one letter\" >&2\n[[ $pw =~ [[:digit:]] ]] || echo \"password must contain at least one digit\" >&2\n[[ $pw =~ [[:punct:]] ]] || echo \"password must contain at least one symbol\" >&2"},{"type":"code","code":"$ ./testpw.sh abc\npassword length less than 8\npassword must contain at least one digit\npassword must contain at least one symbol\n$ ./testpw.sh 'abc123!@'\n$ ./testpw.sh 'my pass 1'\npassword cannot contain whitespace\npassword must contain at least one symbol","caption":"A strong password prints nothing. Single quotes keep the ! and the spaces inside one argument."},{"type":"why","q":"Why does the digit rule use `||` but the whitespace rule use `&&`?","a":"`[[ $pw =~ [[:digit:]] ]]` succeeds when there IS a digit, which is good, so the message must print when the test fails: `||`. `[[ $pw =~ [[:space:]] ]]` succeeds when there IS whitespace, which is bad, so the message prints when the test succeeds: `&&`."},{"type":"md","text":"The full assignment also checks the number of arguments (printing a usage message) and exits with status 2 if any rule failed. Those parts need `if`, which you learn on Day 5. The regex tests stay exactly the same."},{"type":"check","q":"Write the line that prints `password must contain at least one letter` to standard error when `pw` has no letter.","a":"`[[ $pw =~ [[:alpha:]] ]] || echo \"password must contain at least one letter\" >&2`"},{"type":"md","text":"### Key points\n\n- `[[ $str =~ $re ]]` is a test command: exit status 0 if **any part** of `str` matches, 1 if not. Use `^` and `$` to match the whole string. Never quote the regex.\n- Act on the result with `echo $?`, `&&` and `||` (Day 1); `if` comes on Day 5.\n- `.` any char, `[ ]` one char from a set, `[^ ]` one char not in the set, `*` 0+, `+` 1+, `?` 0 or 1, `{m,n}` m to n, `|` or, `( )` group.\n- A quantifier applies to the preceding **atom** (character, bracket expression, or group).\n- POSIX classes go inside brackets: `[[:digit:]]`, `[[:alpha:]]`, `[[:space:]]`, `[[:punct:]]`.\n- `grep -E regex file` prints matching lines; `-n` line numbers, `-i` ignore case."}]}],"flashcards":[{"id":"d3-fc-01","topic":"d3-streams","front":"File descriptor numbers of stdin, stdout, stderr?","back":"0 = standard input, 1 = standard output, 2 = standard error."},{"id":"d3-fc-04","topic":"d3-streams","front":"How do you end keyboard input to a command like `sort`?","back":"Press Ctrl-d (end of input)."},{"id":"d3-fc-05","topic":"d3-streams","front":"Command to overwrite `myfile` with the string OOPS (Quiz 1)","back":"`echo OOPS > myfile`"},{"id":"d3-fc-06","topic":"d3-streams","front":"`>` vs `>>`","back":"`>` creates or **overwrites** the file; `>>` creates or **appends** to it."},{"id":"d3-fc-07","topic":"d3-streams","front":"Is the `1` in `1> file` required?","back":"No. `> file` means `1> file`. The `2` in `2> file` **is** required."},{"id":"d3-fc-08","topic":"d3-streams","front":"Redirect only the error messages of `cmd` to `err.txt`","back":"`cmd 2> err.txt`"},{"id":"d3-fc-09","topic":"d3-streams","front":"Send stdout of `cmd` to out.txt and stderr to err.txt","back":"`cmd > out.txt 2> err.txt`"},{"id":"d3-fc-10","topic":"d3-streams","front":"Send both stdout and stderr of `cmd` to `all.txt`","back":"`cmd > all.txt 2>&1` (bash shorthand: `cmd &> all.txt`)."},{"id":"d3-fc-11","topic":"d3-streams","front":"What does `2>&1` mean?","back":"Make fd 2 (stderr) a copy of fd 1 (stdout): send errors to wherever stdout points **at that moment**."},{"id":"d3-fc-12","topic":"d3-streams","front":"In what order does the shell process redirections?","back":"Left to right. So `> f 2>&1` sends both to f, but `2>&1 > f` leaves errors on the terminal."},{"id":"d3-fc-13","topic":"d3-streams","front":"What is `/dev/null`?","back":"The null device: a file that discards everything written to it (and reports success)."},{"id":"d3-fc-14","topic":"d3-streams","front":"Run `cmd` but throw away its error messages","back":"`cmd 2> /dev/null`"},{"id":"d3-fc-15","topic":"d3-streams","front":"How does a script print an error message on stderr?","back":"`echo \"message\" >&2`: `>&2` (short for `1>&2`) sends echo's stdout to fd 2."},{"id":"d3-fc-17","topic":"d3-streams","front":"Print only the number of lines in `classlist` (no file name)","back":"`wc -l < classlist`"},{"id":"d3-fc-18","topic":"d3-streams","front":"What does a pipe `|` connect?","back":"The **stdout** of the left command to the **stdin** of the right command. stderr is not piped."},{"id":"d3-fc-19","topic":"d3-streams","front":"What does `tee file` do?","back":"Copies its stdin to stdout **and** to the file(s) named, so a pipeline can save an intermediate result and keep going."},{"id":"d3-fc-20","topic":"d3-streams","front":"Why is `sort data > data` a bug?","back":"The shell truncates `data` before sort runs, so sort reads an empty file and data ends up empty."},{"id":"d3-fc-21","topic":"d3-streams","front":"`sort -n` vs `sort`","back":"`-n` sorts numerically (9 before 10); plain sort compares as text (10, 100, 9)."},{"id":"d3-fc-23","topic":"d3-streams","front":"What does `uniq` remove? What does `uniq -d` print?","back":"`uniq` removes **adjacent** duplicate lines (sort first). `uniq -d` prints one copy of each duplicated line only."},{"id":"d3-fc-25","topic":"d3-streams","front":"Default field delimiter of `cut`","back":"The TAB character. Use `-d` to choose another, e.g. `cut -d\" \" -f1` or `cut -d: -f1`."},{"id":"d3-fc-26","topic":"d3-streams","front":"Pipeline: student numbers (field 3) of classlist, sorted, all saved to snum, print first three","back":"`cut -f3 classlist | sort | tee snum | head -n3`"},{"id":"d3-fc-27","topic":"d3-streams","front":"Count the distinct lines of words.txt","back":"`sort words.txt | uniq | wc -l`"},{"id":"d3-fc-28","topic":"d3-expansions","front":"The seven expansions in order","back":"1 brace, 2 tilde, 3 parameter, 4 command substitution, 5 arithmetic (4 and 5 same precedence, left to right), 6 word splitting, 7 filename expansion."},{"id":"d3-fc-31","topic":"d3-expansions","front":"`echo {a,b}{1,2}`","back":"`a1 a2 b1 b2`"},{"id":"d3-fc-32","topic":"d3-expansions","front":"Create directories week01 ... week12 in one command","back":"`mkdir week{01..12}` (leading zeros are kept)."},{"id":"d3-fc-33","topic":"d3-expansions","front":"`n=3; echo {1..$n}` prints?","back":"`{1..3}`: brace expansion runs before parameter expansion, so `{1..$n}` is not a valid sequence."},{"id":"d3-fc-34","topic":"d3-expansions","front":"What does `~` expand to? `~bob`?","back":"Your home directory (`$HOME`). `~bob` is bob's home directory."},{"id":"d3-fc-35","topic":"d3-expansions","front":"What is command substitution?","back":"`$(command)`: runs the command in a subshell and replaces itself with the command's stdout (trailing newlines removed)."},{"id":"d3-fc-36","topic":"d3-expansions","front":"Store the output of `date` in variable `now`","back":"`now=$(date)`"},{"id":"d3-fc-37","topic":"d3-expansions","front":"What is arithmetic expansion? `echo $((7 / 2))`?","back":"`$(( expr ))` evaluates integer arithmetic and substitutes the result. Prints `3` (integer division)."},{"id":"d3-fc-38","topic":"d3-expansions","front":"What is word splitting?","back":"Unquoted results of expansions are split into separate words at IFS characters (space, tab, newline by default); runs of separators count as one."},{"id":"d3-fc-40","topic":"d3-expansions","front":"Which expansions happen inside double quotes?","back":"Only parameter `$x`, command substitution `$( )` and arithmetic `$(( ))`. No brace, tilde, word splitting or filename expansion."},{"id":"d3-fc-41","topic":"d3-expansions","front":"Which expansions happen inside single quotes?","back":"None. Every character is literal."},{"id":"d3-fc-42","topic":"d3-expansions","front":"Why does the course always write `\"$var\"`?","back":"Double quotes stop word splitting and filename expansion, so the value is passed as one argument exactly as stored (spaces, `*` and all)."},{"id":"d3-fc-51","topic":"d3-expansions","front":"How do you store a value in a variable and use it (just enough for today)?","back":"`name=value` with **no spaces** around `=`, then `$name` for the value. `n=3; echo $n` prints `3`."},{"id":"d4-fc-01","topic":"d4-scripts","front":"What must the first line of a Bash script be, and what is it called?","back":"`#!/bin/bash`, the **shebang** (hash-bang). It names the program that interprets the script."},{"id":"d4-fc-02","topic":"d4-scripts","front":"How do you make `go.sh` executable for yourself and run it from its directory?","back":"`chmod u+x go.sh` (once), then `./go.sh`"},{"id":"d4-fc-03","topic":"d4-scripts","front":"How can you run `go.sh` without execute permission?","back":"`bash go.sh` (Bash only needs to read the file)."},{"id":"d4-fc-04","topic":"d4-scripts","front":"Why `./go.sh` and not just `go.sh`?","back":"Bare names are looked up only in the directories on the path, which normally does not include the current directory. `./go.sh` is a pathname to the file."},{"id":"d4-fc-05","topic":"d4-scripts","front":"What character starts a comment, and where does the comment end?","back":"`#`; it runs to the end of the line. A quoted or escaped `#` is not a comment."},{"id":"d3-fc-52","topic":"d4-scripts","front":"The steps to create and run your first script `hello.sh`","back":"1. `nano hello.sh` 2. first line `#!/bin/bash`, then the commands 3. save (Ctrl + O, Enter) and exit (Ctrl + X) 4. `chmod u+x hello.sh` 5. `./hello.sh` from the same folder."},{"id":"d3-fc-53","topic":"d4-scripts","front":"`./go.sh` prints `Permission denied`. What is wrong?","back":"go.sh has no execute permission. Fix: `chmod u+x go.sh` (or run it with `bash go.sh`)."},{"id":"d3-fc-54","topic":"d4-scripts","front":"`./go.sh` prints `No such file or directory`. What is wrong?","back":"There is no `go.sh` in the current directory: wrong folder or misspelled name. Check with `pwd` and `ls`, then `cd` to its folder or type its full pathname. (If the shebang names a program that doesn't exist, you get a similar \"not found\" error.)"},{"id":"d4-fc-06","topic":"d4-scripts","front":"`$0`","back":"The pathname used to run the script, e.g. `./trash.sh`."},{"id":"d4-fc-07","topic":"d4-scripts","front":"`$1`, `$2`, ..., `$9`","back":"The first, second, ..., ninth command line argument (empty if not given)."},{"id":"d4-fc-08","topic":"d4-scripts","front":"How do you get the tenth argument? What does `$10` mean?","back":"`${10}`. `$10` is `$1` followed by the character `0`."},{"id":"d4-fc-09","topic":"d4-scripts","front":"`$#`","back":"The number of command line arguments (not counting `$0`). Quiz 1: print it with `echo $#`."},{"id":"d4-fc-10","topic":"d4-scripts","front":"`\"$@\"`","back":"All the command line arguments, each as a separate word, exactly as given: `\"$1\" \"$2\" ...`"},{"id":"d4-fc-11","topic":"d4-scripts","front":"`\"$*\"` vs `\"$@\"`","back":"`\"$*\"` joins all arguments into one string separated by spaces; `\"$@\"` keeps them as separate words."},{"id":"d4-fc-12","topic":"d4-scripts","front":"`$?`","back":"The exit status of the most recently completed command (0 = success, 1-255 = failure)."},{"id":"d4-fc-15","topic":"d4-scripts","front":"What is a script's exit status when it simply runs to the end?","back":"The exit status of the last command it ran (check it with `echo $?` right after)."},{"id":"d4-fc-16","topic":"d4-scripts","front":"Is using an argument that was not given (e.g. `$3` with 2 arguments) an error?","back":"No. It expands to the empty string."},{"id":"d3-fc-55","topic":"d4-scripts","front":"Why write `cut -f3 \"$1\"` rather than `cut -f3 $1` in a script?","back":"The double quotes stop word splitting, so a file name with spaces (e.g. `class list 2`) stays one argument."},{"id":"d3-fc-56","topic":"d4-scripts","front":"Drill script tasks: where do you save the script, and do you need `chmod`?","back":"In `~/cisc220_drills/scripts/day3/NAME.sh`. No `chmod`: the checker copies it into the task's sandbox folder, makes it executable and runs the tests there."},{"id":"d4-fc-17","topic":"d4-variables","front":"Assign the string `hello world` to variable `msg`.","back":"`msg=\"hello world\"` (no spaces around `=`; quotes keep the space)."},{"id":"d4-fc-18","topic":"d4-variables","front":"What does `x = 5` do?","back":"Runs a command named `x` with arguments `=` and `5` (usually `x: command not found`)."},{"id":"d4-fc-19","topic":"d4-variables","front":"Concatenate `str1` and `str2` into `str3` (Quiz 1).","back":"`str3=$str1$str2`"},{"id":"d4-fc-20","topic":"d4-variables","front":"When must you write `${var}` instead of `$var`?","back":"When the next character could be part of a name (letter, digit, `_`), e.g. `\"${in}_.bak\"`; and for positional parameters 10 and up."},{"id":"d4-fc-21","topic":"d4-variables","front":"Why does `out=\"$in_.bak\"` give `.bak`?","back":"Bash reads the variable name `in_`, which is unset, so it expands to empty."},{"id":"d4-fc-22","topic":"d4-variables","front":"What does an unset variable expand to?","back":"The empty string (no error)."},{"id":"d4-fc-24","topic":"d4-variables","front":"Why write `cp \"$in\" \"$out\"` rather than `cp $in $out`?","back":"Unquoted expansions are split at spaces (and globbed), so a filename like `my file` becomes two arguments."},{"id":"d4-fc-25","topic":"d4-variables","front":"Store the octal permissions of the file named in `src` in `perm`.","back":"`perm=$(stat -c %a \"$src\")`"},{"id":"d4-fc-26","topic":"d4-variables","front":"Which expansions happen on the right of an assignment, and which do not?","back":"Tilde, parameter, command substitution and arithmetic do; brace and filename (glob) expansion do not."},{"id":"d4-fc-28","topic":"d4-strings","front":"`${#s}`","back":"The length of the string in `s`."},{"id":"d4-fc-29","topic":"d4-strings","front":"`${s:offset}`","back":"The substring of `s` from index `offset` (0-based) to the end."},{"id":"d4-fc-30","topic":"d4-strings","front":"`${s:offset:length}`","back":"`length` characters of `s` starting at index `offset`."},{"id":"d4-fc-31","topic":"d4-strings","front":"Last 3 characters of `s`?","back":"`${s: -3}` (the space before `-` is required)."},{"id":"d4-fc-32","topic":"d4-strings","front":"Print the first half of `s` (even length) (Quiz 1).","back":"`n=$(( ${#s} / 2 ))` then `echo \"${s:0:n}\"`"},{"id":"d4-fc-33","topic":"d4-strings","front":"`${s#pattern}`","back":"Remove the **shortest** front part of `s` matching `pattern`."},{"id":"d4-fc-34","topic":"d4-strings","front":"`${s##pattern}`","back":"Remove the **longest** front part of `s` matching `pattern`."},{"id":"d4-fc-35","topic":"d4-strings","front":"`${s%pattern}`","back":"Remove the **shortest** end part of `s` matching `pattern`."},{"id":"d4-fc-36","topic":"d4-strings","front":"`${s%%pattern}`","back":"Remove the **longest** end part of `s` matching `pattern`."},{"id":"d4-fc-37","topic":"d4-strings","front":"Directory part of pathname `p` (Quiz 1 Q5)?","back":"`${p%/*}`"},{"id":"d4-fc-38","topic":"d4-strings","front":"Filename part of pathname `p` (also the script name from `$0`)?","back":"`${p##*/}`, e.g. `${0##*/}`"},{"id":"d4-fc-39","topic":"d4-strings","front":"Filename `f` without its last extension? Just the extension?","back":"`${f%.*}`; `${f##*.}`"},{"id":"d4-fc-40","topic":"d4-strings","front":"`${s/pat/rep}` vs `${s//pat/rep}`","back":"One slash replaces the first match; two slashes replace every match. Empty `rep` deletes."},{"id":"d4-fc-41","topic":"d4-strings","front":"`${s^^}` and `${s,,}`","back":"`s` in all uppercase; `s` in all lowercase. (`${s^}` / `${s,}` change only the first character.)"},{"id":"d4-fc-42","topic":"d4-strings","front":"`${var:-word}`","back":"`word` if `var` is unset or empty, otherwise the value of `var` (`var` is not changed)."},{"id":"d4-fc-43","topic":"d4-strings","front":"`${var-word}` (no colon)","back":"`word` only if `var` is unset; an empty `var` stays empty."},{"id":"d4-fc-44","topic":"d4-strings","front":"`${var:=word}`","back":"Like `:-`, but also assigns `word` to `var`. Not allowed on positional parameters."},{"id":"d4-fc-46","topic":"d4-strings","front":"`${var:?word}`","back":"If `var` is unset or empty, print `word` to stderr and exit the script; otherwise the value."},{"id":"d3-fc-43","topic":"d3-tr","front":"Where does `tr` get its input?","back":"Standard input only (no file argument): `tr a-z A-Z < file` or `echo \"$x\" | tr a-z A-Z`."},{"id":"d3-fc-44","topic":"d3-tr","front":"Three ways to specify a tr sequence","back":"A string (`ABC`), a range (`A-Z`, not portable), a POSIX class (`[:upper:]`)."},{"id":"d3-fc-45","topic":"d3-tr","front":"`tr` when seq1 is longer than seq2","back":"GNU tr repeats the last char of seq2 to fill it (`tr 0-9 X` maps all digits to X). POSIX: undefined, so not portable."},{"id":"d3-fc-46","topic":"d3-tr","front":"Portable way to map every digit to X","back":"`tr '[:digit:]' '[X*]'` (`[c*]` repeats c as needed)."},{"id":"d3-fc-47","topic":"d3-tr","front":"`tr` when seq1 has a duplicated character","back":"Undefined. GNU: the last mapping wins (`tr cisc CIS` turns cisc220 into SISS220)."},{"id":"d3-fc-48","topic":"d3-tr","front":"`tr -d` / `tr -s`","back":"`-d` deletes the characters in seq1; `-s` squeezes runs of a repeated seq1 character into one."},{"id":"d3-fc-49","topic":"d3-tr","front":"`tr -ds seq1 seq2`","back":"First deletes the characters in seq1, then squeezes repeats of characters in seq2."},{"id":"d3-fc-50","topic":"d3-tr","front":"Replace every TAB with a comma in classlist, saving to classlist.csv","back":"`tr '\\t' ',' < classlist > classlist.csv`"},{"id":"d5-fc-32","topic":"d5-regex","front":"When is `[[ $str =~ $re ]]` true?","back":"When **any part** of `str` matches the regex `re`: its exit status is then 0 (use `^`/`$` to match the whole string)."},{"id":"d5-fc-33","topic":"d5-regex","front":"What happens if you quote the regex: `[[ $s =~ \"$re\" ]]`?","back":"The regex is matched as a plain string (no metacharacters). Quoting part of a regex makes that part literal."},{"id":"d4-fc-70","topic":"d5-regex","front":"What does `[[ $s =~ $re ]]` print, and how do you see its result?","back":"Nothing. It sets the exit status: 0 if it matched, 1 if not. See it with `echo $?`, or act on it with `&&` / `||`. Spaces after `[[` and before `]]` are required."},{"id":"d4-fc-71","topic":"d5-regex","front":"Print `has a digit` if `s` contains a digit (one line, no `if`).","back":"`[[ $s =~ [[:digit:]] ]] && echo \"has a digit\"`"},{"id":"d4-fc-72","topic":"d5-regex","front":"Regex test: is `pw` at least 8 characters long?","back":"`[[ $pw =~ .{8} ]]` (8 characters in a row somewhere; same as `[[ $pw =~ ^.{8,}$ ]]`)."},{"id":"d5-fc-34","topic":"d5-regex","front":"`^` and `$` in a regex","back":"Anchors: `^` matches the beginning of the line (when first), `$` the end of the line (when last)."},{"id":"d5-fc-35","topic":"d5-regex","front":"`.` in a regex","back":"Matches any single character."},{"id":"d5-fc-36","topic":"d5-regex","front":"`[ ]` and `[^ ]` in a regex","back":"`[abc]`: any one character inside the brackets. `[^abc]`: any one character NOT inside."},{"id":"d5-fc-37","topic":"d5-regex","front":"`*`, `+`, `?` in a regex","back":"Preceding element zero or more times / one or more times / zero or one time."},{"id":"d5-fc-38","topic":"d5-regex","front":"`{m,n}`, `{m,}`, `{m}`","back":"Preceding element at least m and at most n times / m or more times / exactly m times."},{"id":"d5-fc-39","topic":"d5-regex","front":"`|` and `( )` in a regex","back":"`|` is the choice operator (before OR after). `( )` is a subexpression (group), e.g. `^(abc)+$`."},{"id":"d5-fc-40","topic":"d5-regex","front":"What is an atom?","back":"A single ordinary character, a bracket expression, or a subexpression `( )`. Quantifiers apply to the preceding atom."},{"id":"d5-fc-41","topic":"d5-regex","front":"How do you match a literal `.` or `(`?","back":"Put it in square brackets: `[.]`, `[(]`. Metacharacters lose their meaning inside brackets."},{"id":"d5-fc-42","topic":"d5-regex","front":"Regex for any signed or unsigned integer","back":"`^[-+]?[0-9]+$` (or `^[-+]?[[:digit:]]+$`)"},{"id":"d5-fc-43","topic":"d5-regex","front":"Regex: strings that start and end with a lowercase letter (including one-letter strings)","back":"`^[a-z](.*[a-z])?$`. (`^[a-z].*[a-z]$` misses `a`; `^[a-z]+$` only allows letters.)"},{"id":"d5-fc-44","topic":"d5-regex","front":"POSIX classes for digit, letter, whitespace, punctuation","back":"`[[:digit:]]`, `[[:alpha:]]`, `[[:space:]]`, `[[:punct:]]` (also `[[:upper:]]`, `[[:lower:]]`, `[[:alnum:]]`, `[[:blank:]]`)."},{"id":"d5-fc-45","topic":"d5-regex","front":"Regex meaning of `*` vs glob meaning of `*`","back":"Regex: zero or more of the preceding atom. Glob: any sequence of characters. (Regex `.*` = glob `*`.)"},{"id":"d5-fc-46","topic":"d5-regex","front":"`grep -E`, `-n`, `-i`","back":"`-E`: use extended regexes. `-n`: print line numbers. `-i`: ignore case."},{"id":"d5-fc-47","topic":"d5-regex","front":"Exit status of `grep`","back":"`0` if at least one line matched, `1` if none matched; so `grep -E 're' file > /dev/null && echo found` works."},{"id":"d5-fc-48","topic":"d5-regex","front":"Which years does `^(19|20)[0-9][0-9]$` match?","back":"1900 to 2099 (four-digit strings starting 19 or 20)."}],"quiz":[{"topic":"d3-streams","type":"short","q":"What single command overwrites the contents of a file named `report` with the string `EMPTY`? Use a redirection.","answer":"`echo EMPTY > report`","explain":"`>` truncates the file and writes echo's output. `>>` would append instead (wrong). `printf 'EMPTY\\n' > report` is also fine.","id":"d3-q-02"},{"topic":"d3-streams","type":"output","q":"Starting in an empty directory, what does this print?","code":"echo one > f\necho two >> f\necho three > f\necho four >> f\ncat f","answer":"three\nfour","explain":"The third command overwrites f (losing one and two); the fourth appends.","id":"d3-q-03"},{"topic":"d3-streams","type":"mcq","q":"The directory contains a file `a` and no file `zzz`. After `ls a zzz 2>&1 > out.txt`, what is on the terminal?","options":["Nothing; both lines are in out.txt","The error message about zzz","The line `a`","Both the line `a` and the error message"],"answer":1,"explain":"Redirections go left to right. `2>&1` copies fd 1 while it is still the terminal, so stderr stays on the terminal. Then `> out.txt` moves only stdout (the line `a`) into the file. To capture both, write `> out.txt 2>&1`.","id":"d3-q-04"},{"topic":"d3-streams","type":"output","q":"The directory contains a file `a` and no file `zzz`. What does this print?","code":"ls a zzz 2> /dev/null\necho \"status $?\"","answer":"a\nstatus 2","explain":"The error message is discarded by `2> /dev/null`, but `ls` still lists `a`. Because one argument failed, `ls` exits with status 2 (nonzero = an error happened).","id":"d3-q-05"},{"id":"d4-q-05","topic":"d3-streams","type":"mcq","q":"Which line in a script prints `error` to **standard error**?","options":["`echo error 2>&1`","`echo error >&2`","`echo error > 2`","`echo >&2 error > /dev/null`"],"answer":1,"explain":"`>&2` sends stdout into stderr. `2>&1` does the opposite (stderr into stdout). `> 2` writes to a file named `2`. The last one redirects stdout again to `/dev/null` after `>&2`, so the message is lost (the later redirection wins)."},{"id":"d3-q-34","topic":"d3-streams","type":"output","q":"The directory contains a file `a` and no file `zzz`. What appears on the terminal? (Only stdout goes through a pipe.)","code":"ls a zzz | wc -l","answer":"ls: cannot access 'zzz': No such file or directory\n1","explain":"The error message is on stderr, which is not piped, so it goes straight to the terminal. Only the line `a` goes through the pipe, so `wc -l` counts 1 line."},{"topic":"d3-streams","type":"output","q":"What does this print?","code":"printf '10\\n9\\n100\\n' | sort","answer":"10\n100\n9","explain":"Without `-n`, sort compares the lines as text, character by character: `1` < `9`, and `10` is a prefix of `100`. Use `sort -n` to get 9, 10, 100.","id":"d3-q-07"},{"topic":"d3-streams","type":"output","q":"What does this print?","code":"printf 'b\\na\\nb\\nb\\na\\nc\\n' | sort | uniq -d","answer":"a\nb","explain":"After sorting: a a b b b c. `uniq -d` prints one copy of each line that is repeated; c appears once, so it is not printed.","id":"d3-q-10"},{"topic":"d3-streams","type":"output","q":"`classlist` contains these 4 lines, fields separated by single TABs:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWhat does this print?","code":"cut -f2 classlist | tail -n2","answer":"Andy\nSue","explain":"Field 2 is the first name; tail keeps the last two lines.","id":"d3-q-11"},{"topic":"d3-streams","type":"output","q":"`classlist` contains these 4 lines, fields separated by single TABs:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWhat does this print?","code":"cut -f3 classlist | sort | tee snum | head -n2\nwc -l < snum","answer":"1990000\n2999999\n4","explain":"tee saves **all** four sorted numbers to snum before head keeps only two.","id":"d3-q-12"},{"topic":"d3-streams","type":"mcq","q":"Which pipeline extracts the student numbers from `classlist`, sorts them, saves **all** of them to `snum`, and prints the first three?","options":["`cut -f3 classlist | sort | head -n3 | tee snum`","`cut -f3 classlist | tee snum | sort | head -n3`","`cut -f3 classlist | sort | tee snum | head -n3`","`cut -f3 classlist | sort > snum | head -n3`"],"answer":2,"explain":"tee must come after sort (so the file is sorted) and before head (so the file has all numbers). Option A saves only three; B saves them unsorted; D redirects stdout to the file, so nothing flows into head and nothing is printed.","id":"d3-q-13"},{"topic":"d3-streams","type":"short","q":"`words.txt` has one word per line. Write a pipeline that prints how many **different** words it contains.","answer":"`sort words.txt | uniq | wc -l`","explain":"Sort first so duplicates are adjacent, uniq removes them, wc -l counts. `cat words.txt | sort | uniq | wc -l` is equally correct.","id":"d3-q-14"},{"topic":"d3-expansions","type":"mcq","q":"Which list gives the shell expansions in the order they are performed?","options":["tilde, brace, parameter, arithmetic, command, filename, word splitting","brace, tilde, parameter, command substitution/arithmetic, word splitting, filename","filename, word splitting, brace, tilde, parameter, command substitution/arithmetic","parameter, brace, tilde, command substitution/arithmetic, filename, word splitting"],"answer":1,"explain":"Brace expansion is first and filename expansion is last; word splitting comes just before filename expansion.","id":"d3-q-15"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"echo {a,b}{1,2}","answer":"a1 a2 b1 b2","explain":"Two adjacent brace expansions produce every combination, the left one varying slowest.","id":"d3-q-16"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"echo lab{1..9..3}.sh","answer":"lab1.sh lab4.sh lab7.sh","explain":"Sequence 1 to 9 in steps of 3: 1 4 7 (10 would be past 9). Preamble `lab`, postscript `.sh`.","id":"d3-q-17"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"n=3\necho {1..$n}","answer":"{1..3}","explain":"Brace expansion happens **before** parameter expansion. When braces were expanded the text was `{1..$n}`, not a valid sequence, so it was left alone; then `$n` became 3.","id":"d3-q-18"},{"topic":"d3-expansions","type":"output","q":"What does this print? Assume the current directory is empty.","code":"echo a{1,2}.txt *.zzz","answer":"a1.txt a2.txt *.zzz","explain":"Brace expansion generates names whether or not the files exist. The glob `*.zzz` matches nothing, so bash leaves it unchanged.","id":"d3-q-19"},{"topic":"d3-expansions","type":"output","q":"Assume `HOME` is `/home/user1`. What does this print?","code":"echo ~ \"~\" '$HOME' \"$HOME\"","answer":"/home/user1 ~ $HOME /home/user1","explain":"Tilde expansion does not happen inside quotes. Single quotes stop parameter expansion; double quotes allow it.","id":"d3-q-20"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"echo $(( 17 / 5 )) $(( 17 % 5 )) $(( 2 + 3 * 4 ))","answer":"3 2 14","explain":"Integer division drops the remainder; % is the remainder; * binds tighter than +.","id":"d3-q-22"},{"topic":"d3-expansions","type":"output","q":"What does this print?","code":"x=\"a    b\nc\"\necho $x\necho \"$x\"","answer":"a b c\na    b\nc","explain":"Unquoted, `$x` is word split on spaces and the newline into three words, which echo joins with single spaces. Quoted, the value is one argument printed exactly.","id":"d3-q-23"},{"topic":"d3-expansions","type":"output","q":"`classlist` contains these 4 lines, fields separated by single TABs:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\nWhat does this print?","code":"echo $(cut -f1 classlist)\necho \"There are $(wc -l < classlist) students\"","answer":"Cade Day Friese Yu\nThere are 4 students","explain":"The first command substitution is unquoted, so its four lines are word split into four arguments. In the second, the substitution is inside double quotes, which is fine: command substitution still happens there.","id":"d3-q-24"},{"topic":"d3-expansions","type":"output","q":"The current directory contains exactly the files `f1` and `f2`. What does this print?","code":"v='f*'\necho \"$v\"\necho $v","answer":"f*\nf1 f2","explain":"Quoted: no filename expansion, so the literal `f*` is printed. Unquoted: filename expansion (the last expansion) replaces `f*` with the matching names.","id":"d3-q-26"},{"id":"d3-q-35","topic":"d3-expansions","type":"output","q":"What does this print?","code":"str=\"123456,Ester,Polly\"\nOLDIFS=$IFS\nIFS=\",\"\necho $str\necho \"$str\"\nIFS=$OLDIFS","answer":"123456 Ester Polly\n123456,Ester,Polly","explain":"With `IFS` set to a comma, the unquoted `$str` is word split at the commas into three words, which echo joins with spaces. Quoted, there is no word splitting, so the commas stay."},{"id":"d4-q-01","topic":"d4-scripts","type":"mcq","q":"You just saved `hello.sh` (permissions `rw-r--r--`) in the current directory. Which command runs it **without** changing its permissions?","options":["`./hello.sh`","`hello.sh`","`bash hello.sh`","`run hello.sh`"],"answer":2,"explain":"`bash hello.sh` only needs read permission. `./hello.sh` fails with `Permission denied` until you `chmod u+x hello.sh`. Plain `hello.sh` is searched for on the path (not the current directory). `run` is not a command."},{"id":"d3-q-36","topic":"d4-scripts","type":"mcq","q":"You wrote `count.sh` and saved it. Running `./count.sh` prints `bash: ./count.sh: Permission denied`. What fixes it?","options":["`chmod u+x count.sh`, then `./count.sh` again","`chmod u+r count.sh`, then `./count.sh` again","Type `count.sh` without the `./`","Add a second `#!/bin/bash` line"],"answer":0,"explain":"Permission denied means the file has no execute permission. A file you just created is already readable by you, so `u+r` changes nothing. Without `./` the shell searches the path and reports `command not found`. The shebang is not the problem."},{"id":"d3-q-37","topic":"d4-scripts","type":"mcq","q":"`hello.sh` is in `~/scripts` and is executable. Your terminal is in `~`. You type `./hello.sh` and get `No such file or directory`. Why?","options":["The script has no execute permission","There is no `hello.sh` in the current directory `~`","The script's last command failed","Scripts can only be run with `bash hello.sh`"],"answer":1,"explain":"`./hello.sh` means *the file hello.sh in the current directory*. Run `cd ~/scripts` first, or type `scripts/hello.sh`. A missing execute permission gives `Permission denied` instead."},{"id":"d4-q-02","topic":"d4-scripts","type":"output","q":"`args.sh` contains:\n\n```bash\n#!/bin/bash\necho \"$#: $1 | $2\"\n```\n\nWhat does `./args.sh \"a b\" c` print?","code":"./args.sh \"a b\" c","answer":"2: a b | c","explain":"The quotes make `a b` a single argument, so there are 2 arguments, `$1` is `a b`, and `$2` is `c`."},{"id":"d3-q-38","topic":"d4-scripts","type":"output","q":"`count.sh` contains:\n\n```bash\n#!/bin/bash\necho $#\n```\n\nWhat does this print?","code":"./count.sh a \"b c\" '' d","answer":"4","explain":"`$#` counts the arguments: `a`, `b c` (one argument, thanks to the quotes), the empty string `''` (still an argument) and `d`."},{"id":"d4-q-03","topic":"d4-scripts","type":"output","q":"`ten.sh` contains:\n\n```bash\n#!/bin/bash\necho \"$10 ${10}\"\n```\n\nWhat does this print?","code":"./ten.sh a b c d e f g h i j","answer":"a0 j","explain":"`$10` is `$1` (`a`) followed by the character `0`. Only `${10}` gives the tenth argument, `j`."},{"id":"d4-q-06","topic":"d4-scripts","type":"short","q":"From inside a script, how do you print the number of command line arguments? (Quiz 1)","answer":"`echo $#`","explain":"Accept `echo \"$#\"` or `echo ${#}`."},{"id":"d3-q-39","topic":"d4-scripts","type":"output","q":"`classlist` contains these 4 lines, fields separated by single TABs:\n\n```\nCade\tBarry\t3100025\nDay\tHolly\t2999999\nFriese\tAndy\t3001111\nYu\tSue\t1990000\n```\n\n`first.sh` contains:\n\n```bash\n#!/bin/bash\ncut -f2 \"$1\" | sort | head -n \"$2\"\n```\n\nWhat does this print?","code":"./first.sh classlist 2","answer":"Andy\nBarry","explain":"`$1` is `classlist` and `$2` is `2`. Field 2 is the first names; sorted they are Andy, Barry, Holly, Sue; `head -n 2` keeps two."},{"id":"d3-q-40","topic":"d4-scripts","type":"output","q":"`show.sh` contains:\n\n```bash\n#!/bin/bash\n\n# show.sh\necho \"$0 was given $# arguments\"   # count them\necho \"$@\"\n```\n\nWhat does this print?","code":"./show.sh one   \"two  three\"","answer":"./show.sh was given 2 arguments\none two  three","explain":"`$0` is the pathname used to run the script. The extra spaces between arguments on the command line just separate words, so there are 2 arguments. `\"$@\"` passes them to echo separately; echo joins them with one space, and the two spaces inside `two  three` are kept because they are part of that argument. The comment prints nothing."},{"id":"d4-q-08","topic":"d4-variables","type":"mcq","q":"Which line stores the value 5 in variable `x`?","options":["`x = 5`","`x=5`","`$x=5`","`x =5`"],"answer":1,"explain":"No spaces around `=`, and no `$` on the left. `x = 5` and `x =5` run a command named `x`; `$x=5` expands `x` first and tries to run the result as a command."},{"id":"d4-q-10","topic":"d4-variables","type":"output","q":"What does this print? (The variable `in_` has never been assigned.)","code":"in=\"my file\"\nout=\"$in_.bak\"\necho \"[$out]\"\nout=\"${in}_.bak\"\necho \"[$out]\"","answer":"[.bak]\n[my file_.bak]","explain":"`$in_` is the unset variable `in_`, which expands to empty. Braces end the name: `${in}_.bak`. This is the notebook's `bad_backup.sh` bug."},{"id":"d4-q-11","topic":"d4-variables","type":"output","q":"What does this print?","code":"yrs={2020..2029..3}\necho \"$yrs\"\nsum=$(( 5 + 3 ))\necho \"$sum\"","answer":"{2020..2029..3}\n8","explain":"Brace expansion does not happen in an assignment, so `yrs` holds the literal text. Arithmetic expansion does happen."},{"id":"d4-q-13","topic":"d4-variables","type":"mcq","q":"A script runs `cp $1 $2` and is called as `./c.sh \"my notes\" backup`. What happens?","options":["It copies `my notes` to `backup`","`cp` receives three arguments `my`, `notes`, `backup`, so it tries to copy two files named `my` and `notes` into a directory `backup`","Bash reports a syntax error","It copies `my notes` to a file named `$2`"],"answer":1,"explain":"Unquoted `$1` is split at the space. Write `cp \"$1\" \"$2\"`."},{"id":"d4-q-14","topic":"d4-variables","type":"short","q":"How can you concatenate two strings stored in `str1` and `str2` and store the result in `str3`? (Quiz 1)","answer":"`str3=$str1$str2`","explain":"Also correct: `str3=\"$str1$str2\"` or `str3=${str1}${str2}`."},{"id":"d4-q-15","topic":"d4-variables","type":"short","q":"Write one line that stores the octal permissions of the file whose name is in `src` in a variable `perm` (use `stat -c %a`).","answer":"`perm=$(stat -c %a \"$src\")`","explain":"Command substitution `$( )` captures the output. The quotes around `$src` are required in case the name has spaces."},{"id":"d4-q-04","topic":"d4-strings","type":"output","q":"`hi.sh` is in the directory `scripts` and contains:\n\n```bash\n#!/bin/bash\necho \"$0\"\necho \"${0##*/}\"\n```\n\nWhat is printed?","code":"./scripts/hi.sh","answer":"./scripts/hi.sh\nhi.sh","explain":"`$0` is exactly the path used to run the script. `${0##*/}` removes the longest front part ending in `/`, leaving the script name."},{"id":"d4-q-16","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=\"abcdefghij\"\necho \"${s:2:3}\"\necho \"${s: -3}\"\necho \"${s:1:-2}\"","answer":"cde\nhij\nbcdefgh","explain":"Indexes start at 0. `${s:2:3}` is 3 characters from index 2. `${s: -3}` is the last 3. A negative length stops that many characters before the end."},{"id":"d4-q-17","topic":"d4-strings","type":"output","q":"What does this print? (Notice there is no space after the colon.)","code":"s=\"abcdefghij\"\necho \"${s:-3}\"","answer":"abcdefghij","explain":"`:-` is the default-value expansion: `s` is set and non-empty, so its value is used. For the last 3 characters you need `${s: -3}`."},{"id":"d4-q-18","topic":"d4-strings","type":"output","q":"What does this print?","code":"f=\"file.txt.zip\"\necho \"${f#*.}\"\necho \"${f##*.}\"\necho \"${f%.*}\"\necho \"${f%%.*}\"","answer":"txt.zip\nzip\nfile.txt\nfile","explain":"`#` removes from the front, `%` from the end; one symbol = shortest match, two = longest."},{"id":"d4-q-19","topic":"d4-strings","type":"output","q":"What does this print?","code":"p=\"/home/user1/somedir/myfile\"\necho \"${p%/*}\"\necho \"${p##*/}\"","answer":"/home/user1/somedir\nmyfile","explain":"`${p%/*}` removes the shortest end part matching `/*` (`/myfile`). `${p##*/}` removes the longest front part matching `*/`."},{"id":"d4-q-20","topic":"d4-strings","type":"output","q":"What does this print?","code":"p=\"./myfile\"\ndir=${p%/*}\necho \"$dir/.trash\"\np=\"myfile\"\necho \"${p%/*}\"","answer":"./.trash\nmyfile","explain":"With `./myfile`, the directory is `.`. With no `/` at all, the pattern does not match and nothing is removed."},{"id":"d4-q-21","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=\"sparring with a purple porpoise\"\necho \"${s/p/t}\"\necho \"${s//p/}\"\necho \"$s\"","answer":"starring with a purple porpoise\nsarring with a urle oroise\nsparring with a purple porpoise","explain":"One slash replaces the first `p`; two slashes with an empty replacement delete every `p`. The variable itself is never changed."},{"id":"d4-q-22","topic":"d4-strings","type":"output","q":"What does this print?","code":"s=abcdef\nn=$(( ${#s} / 2 ))\necho \"${s:0:n}\" \"${s:n}\"","answer":"abc def","explain":"`${#s}` is 6, so `n` is 3. `${s:0:n}` is the first 3 characters and `${s:n}` the rest. (Quiz 1 Q3A.)"},{"id":"d4-q-23","topic":"d4-strings","type":"output","q":"What does this print?","code":"unset v\necho \"[${v-none}] [${v:-none}]\"\nv=\"\"\necho \"[${v-none}] [${v:-none}]\"","answer":"[none] [none]\n[] [none]","explain":"Without a colon only *unset* triggers the default; with a colon, *empty* does too."},{"id":"d4-q-25","topic":"d4-strings","type":"mcq","q":"`f=\"photo.backup.jpg\"`. Which expansion gives `photo.backup.png`?","options":["`${f%%.*}.png`","`${f%.*}.png`","`${f#*.}.png`","`${f/jpg/.png}`"],"answer":1,"explain":"`${f%.*}` removes only the last extension (`photo.backup`). `%%` removes `.backup.jpg` (gives `photo.png`). `#*.` removes the front (`backup.jpg.png`). The last gives `photo.backup..png`."},{"topic":"d3-tr","type":"output","q":"What does this print?","code":"echo hello | tr el ip","answer":"hippo","explain":"e->i and l->p; h and o are not in seq1, so they pass through unchanged.","id":"d3-q-27"},{"topic":"d3-tr","type":"output","q":"What does this print? (GNU tr)","code":"echo cisc220 | tr '0-9' 'X'","answer":"ciscXXX","explain":"seq1 (10 digits) is longer than seq2 (1 char). GNU tr repeats the last character of seq2, so every digit becomes X. POSIX says this is undefined; the portable form is `tr '[:digit:]' '[X*]'`.","id":"d3-q-28"},{"topic":"d3-tr","type":"output","q":"What does this print? (GNU tr)","code":"echo cisc220 | tr 'cisc' 'CIS'","answer":"SISS220","explain":"seq2 is extended to CISS. `c` appears twice in seq1 (undefined behaviour); in GNU tr the last mapping, c->S, wins. So c->S, i->I, s->S.","id":"d3-q-29"},{"topic":"d3-tr","type":"output","q":"What does this print?","code":"echo 'a  b    c' | tr -s ' '\necho '2022-10-21' | tr -d '-'\necho bookkeeper | tr -s 'a-z'","answer":"a b c\n20221021\nbokeper","explain":"-s squeezes runs of the same character; -d deletes. In bookkeeper the oo, kk and ee runs each become one letter.","id":"d3-q-30"},{"topic":"d3-tr","type":"mcq","q":"Which command is an **error** (or does not do what is intended)?","options":["`tr a-z A-Z < notes.txt`","`cat notes.txt | tr a-z A-Z`","`tr a-z A-Z notes.txt`","`tr '[:lower:]' '[:upper:]' < notes.txt`"],"answer":2,"explain":"tr reads only standard input; it does not accept a file name. With GNU tr, option C fails with `extra operand`.","id":"d3-q-32"},{"topic":"d3-tr","type":"short","q":"Assignment 3's `tr220.sh` exits with an error in two situations involving seq1 and seq2. What are they, and why does the course treat them as errors?","answer":"(1) seq1 is longer than seq2; (2) seq1 contains a duplicated character. Both are cases where the result of `tr` is undefined or non-portable (GNU repeats the last char of seq2; with duplicates, which mapping wins is not specified).","explain":"Wording can vary; the key words are *longer* and *duplicated/repeated characters* and *undefined*.","id":"d3-q-33"},{"id":"d5-q-18","topic":"d5-regex","type":"mcq","q":"What does the metacharacter `?` mean in a regular expression?","options":["Any single character","Zero or one instances of the preceding atom","One or more instances of the preceding atom","Exactly one character, as in a glob pattern"],"answer":1,"explain":"Quiz 2 Q1A. `.` is any single character, `+` is one or more. Option D is the glob (filename expansion) meaning of `?`, a common mix-up."},{"id":"d5-q-19","topic":"d5-regex","type":"mcq","q":"Which regex matches **all and only** strings that start and end with a lowercase letter, including one-letter strings like `a` (assume the C locale)?","options":["`^[a-z]+$`","`^[a-z].*[a-z]$`","`^[a-z](.*[a-z])?$`","`[a-z].*[a-z]`"],"answer":2,"explain":"`^[a-z]+$` rejects `x-ray` (it allows only letters). `^[a-z].*[a-z]$` rejects `a` (it needs two characters). `[a-z].*[a-z]` has no anchors, so it matches `1ab2`. `^[a-z](.*[a-z])?$` handles all cases. (The Quiz 2 key also accepted A and B.)"},{"id":"d5-q-21","topic":"d5-regex","type":"mcq","q":"Which string is matched by `^xa{1,3}$`?","options":["`x`","`xaaaa`","`xaa`","`axa`"],"answer":2,"explain":"`a{1,3}` means one to three `a`s after the `x`, and nothing else. `x` has zero `a`s, `xaaaa` has four, `axa` does not start with `x`."},{"id":"d5-q-22","topic":"d5-regex","type":"mcq","q":"Which of these strings is matched by `^b|cat$`?","options":["`at`","`abc`","`scat`","`cab`"],"answer":2,"explain":"`|` splits the whole regex: \"starts with b\" OR \"ends with cat\". `scat` ends with `cat`. `abc` and `cab` neither start with b nor end with cat."},{"id":"d4-q-50","topic":"d5-regex","type":"output","q":"What does this print?","code":"s=\"cisc220\"\n[[ $s =~ [0-9] ]]; echo $?\n[[ $s =~ ^[0-9] ]]; echo $?\n[[ $s =~ ^[a-z]+[0-9]+$ ]] && echo \"course code\"","answer":"0\n1\ncourse code","explain":"`[[ ]]` prints nothing; `echo $?` shows its exit status. `cisc220` contains a digit (status 0) but does not start with one (status 1). It is letters followed by digits and nothing else, so the last test succeeds and `&&` runs the `echo`."},{"id":"d5-q-23","topic":"d5-regex","type":"output","q":"What does this print?","code":"re=\"a.c\"\n[[ abc =~ $re ]]; echo $?\n[[ abc =~ \"$re\" ]]; echo $?","answer":"0\n1","explain":"Unquoted, `.` is a metacharacter (any character), so `abc` matches and the status is 0. Quoted, the regex is matched as the literal string `a.c`, which `abc` does not contain, so the status is 1."},{"id":"d5-q-24","topic":"d5-regex","type":"output","q":"What does this print?","code":"re=\"^(19|20)[0-9][0-9]$\"\n[[ 1999 =~ $re ]] && echo \"1999 yes\"\n[[ 1899 =~ $re ]] && echo \"1899 yes\"\n[[ 20245 =~ $re ]] && echo \"20245 yes\"","answer":"1999 yes","explain":"`&&` runs `echo` only when the test succeeds. The regex matches exactly four characters: `19` or `20`, then two digits. `1899` starts with 18; `20245` has five characters, and `$` forbids the extra one."},{"id":"d5-q-25","topic":"d5-regex","type":"output","q":"What does this print?","code":"s=hello\n[[ $s =~ ^h.*o$ ]] && echo A\n[[ $s =~ l{2} ]] && echo B\n[[ $s =~ ^l ]] && echo C","answer":"A\nB","explain":"`^h.*o$`: starts with h, anything, ends with o: yes. `l{2}`: two l's in a row somewhere: yes (`ll`). `^l`: does not start with l."},{"id":"d5-q-27","topic":"d5-regex","type":"output","q":"Same `pets.txt` (`cat`, `dog`, `catalog`, `Cat`, `bobcat`). What does this print?","code":"grep -En 'o' pets.txt","answer":"2:dog\n3:catalog\n5:bobcat","explain":"`-n` puts the line number and `:` before each matching line. Lines 2, 3 and 5 contain an `o`."},{"id":"d5-q-28","topic":"d5-regex","type":"short","q":"Write a regex that matches any signed or unsigned integer (an optional `+` or `-`, then one or more digits, and nothing else).","answer":"`^[-+]?[0-9]+$`","explain":"Also correct: `^[-+]?[[:digit:]]+$`, `^(-|\\+)?[0-9]+$`. The `-` is first inside the brackets so it is literal. Without `^` and `$`, strings like `12a` would match."},{"id":"d5-q-29","topic":"d5-regex","type":"short","q":"Write a single `grep` command that prints the lines of `words.txt` that are exactly five characters long.","answer":"`grep -E '^.....$' words.txt`","explain":"Also correct: `grep -E '^.{5}$' words.txt`. The anchors are essential: without them every line of five or more characters would match."},{"id":"d5-q-30","topic":"d5-regex","type":"mcq","q":"Which regex matches only the string `a.c`?","options":["`^a.c$`","`^a[.]c$`","`a[.]c`","`^a?c$`"],"answer":1,"explain":"Inside brackets `.` loses its meaning, so `[.]` is a literal dot. `^a.c$` also matches `abc`; `a[.]c` (no anchors) matches `xa.cx`; `^a?c$` matches `c` and `ac`."}],"write":[{"id":"d3-w-01","topic":"d3-streams","stage":"worked","marks":2,"prompt":"The file `scores` has one line per student: name, section and score, separated by TAB characters. For example:\n\n```\nAhmed\t002\t88\nBlake\t001\t9\nChen\t001\t100\n```\n\nWrite a **single pipeline** that extracts the scores, sorts them from **highest to lowest** (numerically), saves **all** of the sorted scores in a file named `ranked`, and prints only the **top five** scores.","starter":"","solution":"cut -f3 scores | sort -n -r | tee ranked | head -n5","explain":"Translate each phrase, in order:\n\n1. *extracts the scores*: the score is field 3 and the delimiter is TAB, which is `cut`'s default: `cut -f3 scores`.\n2. *highest to lowest, numerically*: `sort -n -r`. Without `-n`, 9 would sort above 88 because text comparison sees `9` > `8`.\n3. *saves all of the sorted scores*: `tee ranked`. It must come **after** sort (the file must be sorted) and **before** head (the file must contain every score).\n4. *prints only the top five*: `head -n5`.\n\n`sort -nr` and `head -n 5` are equally correct.","rubric":[{"marks":1,"item":"`cut -f3` then `sort -n -r` (numeric and reversed)"},{"marks":1,"item":"`tee ranked` placed between sort and head, then `head -n5`"}],"pitfalls":["Putting `tee` after `head` (saves only five scores).","Forgetting `-n` (text sort puts 9 above 88).","Using `> ranked` in the middle of a pipeline: it sends the output to the file and nothing reaches head."],"core":true},{"id":"d3-w-10","topic":"d4-scripts","stage":"worked","marks":4,"prompt":"Write a script `firstn.sh` that is run as `./firstn.sh FILE N`. It prints one line `FILE has L lines` (where L is the number of lines in FILE), and then the first N lines of FILE in **sorted** order. File names may contain spaces.\n\nExample: `./firstn.sh classlist 2` prints\n\n```\nclasslist has 4 lines\nCade\tBarry\t3100025\nDay\tHolly\t2999999\n```","starter":"","solution":"#!/bin/bash\n\n# firstn.sh: show how long FILE is, then its first N lines in sorted order\n\necho \"$1 has $(wc -l < \"$1\") lines\"\nsort \"$1\" | head -n \"$2\"","explain":"1. `#!/bin/bash` first, always.\n2. `$1` is FILE and `$2` is N: the shell sets them from the command line.\n3. The message is one `echo` with a command substitution inside double quotes. `wc -l < \"$1\"` prints only the number; `wc -l \"$1\"` would add the file name. The double quotes inside `$( )` are fine: they belong to the inner command.\n4. *First N lines in sorted order* means sort first, then cut it down: `sort \"$1\" | head -n \"$2\"`. Doing `head` first would sort only the first N lines of the file.\n5. Every `$1` and `$2` is quoted, so a file name like `class list 2` stays one argument.","rubric":[{"marks":1,"item":"Shebang `#!/bin/bash` on the first line"},{"marks":1,"item":"`echo` with `$1` and a command substitution giving only the line count (`wc -l < \"$1\"`)"},{"marks":1,"item":"`sort \"$1\" | head -n \"$2\"` (sort before head)"},{"marks":1,"item":"Arguments quoted everywhere"}],"pitfalls":["`head -n \"$2\" \"$1\" | sort` sorts only the first N lines of the file, not the whole file.","`$(wc -l \"$1\")` puts the file name into the message twice.","Writing `$(wc -l < $1)`: unquoted, a file name with a space breaks."],"core":true},{"id":"d3-w-06","topic":"d4-scripts","stage":"blank","marks":4,"prompt":"Write a script `snumsave.sh` that takes two command line arguments: `$1` is the name of a classlist file (last name TAB first name TAB student number) and `$2` is the name of an output file. The script\n\n1. writes the student numbers, sorted in ascending order, into the file named by `$2` (overwriting it), and\n2. prints the message `saved N student numbers` where N is the number of lines in that output file.","starter":"","solution":"#!/bin/bash\n\ncut -f3 \"$1\" | sort > \"$2\"\necho \"saved $(wc -l < \"$2\") student numbers\"","explain":"The first line is a pipeline whose final stdout is redirected into the output file. The second line uses command substitution; `wc -l < file` prints only the number (no file name). Nested double quotes inside `$( )` are fine.","rubric":[{"marks":1,"item":"`cut -f3 \"$1\" | sort`"},{"marks":1,"item":"`> \"$2\"` at the end of the pipeline"},{"marks":1,"item":"Command substitution with `wc -l` that yields only the number (`< \"$2\"` or `cut -f3 \"$1\" | wc -l`)"},{"marks":1,"item":"Exact message text; variables quoted"}],"pitfalls":["`wc -l \"$2\"` inside the message prints `saved 4 out.txt student numbers`.","`sort > \"$2\" \"$1\"` style mix-ups: keep the redirection at the end of the pipeline."],"core":true},{"id":"d4-w-01","topic":"d4-variables","stage":"worked","marks":4,"prompt":"**Quiz 1, Question 4 (4 marks).** Write a script that accepts two command line arguments that are both file names. The first argument is the name of the source file, and the second is the name of the destination file.\n\nThe script sets the permissions of the destination file to be equal to the permissions of the source file (it copies the permissions from the source to the destination).\n\nNo error checking is required: two arguments are always given and both files exist. Recall that `stat -c %a filename` prints the three-digit octal permissions of `filename`.","starter":"","solution":"#!/bin/bash\n\n# copyperm.sh: copy the permissions of file $1 to file $2\n\nsrc=$1\ndest=$2\n\n# permissions of src, e.g. 640\nperm=$(stat -c %a \"$src\")\n\nchmod \"$perm\" \"$dest\"","explain":"1. `#!/bin/bash` makes it a Bash script.\n2. `src=$1` and `dest=$2` give the arguments readable names. (Quoting the right side of a plain assignment is optional.)\n3. `$(stat -c %a \"$src\")` runs `stat` and is replaced by its output, e.g. `640`. Storing it in `perm` is **command substitution into a variable**.\n4. `chmod` accepts an octal mode (Day 2), so `chmod \"$perm\" \"$dest\"` sets exactly the same permissions.\n\nThe posted solution marks the quotes around `\"$src\"` and `\"$dest\"` as **required**: without them a filename such as `my notes.txt` is split into two arguments. Quoting `\"$perm\"` is harmless and a good habit.\n\nA one-line version is also correct: `chmod \"$(stat -c %a \"$1\")\" \"$2\"`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and using `$1` / `$2` for source and destination"},{"marks":1,"item":"Gets the source permissions with command substitution `$(stat -c %a ...)`"},{"marks":1,"item":"Applies them with `chmod PERM dest`"},{"marks":1,"item":"Filename expansions quoted: `\"$src\"` and `\"$dest\"`"}],"pitfalls":["Forgetting `$( )`: `perm=stat -c %a $src` is not command substitution.","Unquoted `$src` / `$dest` break on filenames with spaces.","Using `ls -l` and trying to parse the output instead of `stat -c %a`."],"core":true},{"id":"d4-w-02","topic":"d4-strings","stage":"worked","marks":10,"prompt":"**Quiz 1, Question 5 (10 marks).** Create a script `trash.sh` that moves a single file into a hidden trashcan directory by performing these steps:\n\n1. finds the name of the directory `dir` that the file is located in\n2. creates a directory named `.trash` in `dir`\n3. changes the permissions of `.trash` so that the owner has all permissions and all other users have none\n4. prints the message `moving filename to the trashcan` where `filename` is the first command line argument\n5. moves the file into the `.trash` directory created in Step 2\n\nNo error checking is required: one argument is always given, it is the pathname of a file you own, and the pathname always includes the directory (for example `./myfile` or `/home/user1/somedir/myfile`). Ignore the error from Step 2 if `.trash` already exists.\n\nHint: `${str%pattern}` removes the shortest trailing part of `str` that matches `pattern`.","starter":"","solution":"#!/bin/bash\n\n# trash.sh: move a file into a hidden .trash directory next to it\n\npathname=$1\n\n# Step 1: the directory part of the pathname\ndir=${pathname%/*}\n\n# Step 2\ntrashdir=$dir/.trash\nmkdir \"$trashdir\"\n\n# Step 3\nchmod 700 \"$trashdir\"        # or: chmod u=rwx,go= \"$trashdir\"\n\n# Step 4\necho \"moving $pathname to the trashcan\"\n\n# Step 5\nmv \"$pathname\" \"$trashdir\"","explain":"- **Step 1.** `${pathname%/*}` removes the shortest end part matching `/*`, that is, the last `/` and the filename. `./myfile` gives `.` and `/home/user1/somedir/myfile` gives `/home/user1/somedir`. This is why the question guarantees the pathname contains a `/`.\n- **Step 2.** Building `trashdir=$dir/.trash` once avoids typing it three times. `mkdir \"$trashdir\"` creates it.\n- **Step 3.** Owner `rwx`, group and others nothing is `700` in octal, or symbolically `u=rwx,go=`.\n- **Step 4.** Double quotes let `$pathname` expand inside the message.\n- **Step 5.** `mv FILE DIR` moves the file into the directory.\n\n**Watch out for the typo in the posted solution:** it ends with `mv \"$pathname $trashdir\"`. Those quotes make the two expansions **one** argument (`./myfile ./.trash`), so `mv` complains about a missing destination. The correct line quotes each expansion separately: `mv \"$pathname\" \"$trashdir\"`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and uses `$1` as the pathname"},{"marks":2,"item":"Step 1: `dir=${pathname%/*}` (or equivalent)"},{"marks":1,"item":"Step 2: `mkdir \"$dir/.trash\"`"},{"marks":2,"item":"Step 3: `chmod 700` or `chmod u=rwx,go=` on `.trash`"},{"marks":1,"item":"Step 4: `echo \"moving $pathname to the trashcan\"` with the exact message"},{"marks":2,"item":"Step 5: `mv \"$pathname\" \"$dir/.trash\"`"},{"marks":1,"item":"All pathnames quoted as separate arguments"}],"pitfalls":["`mv \"$pathname $trashdir\"` (one quoted string) is wrong: quote each argument on its own.","`${pathname#*/}` or `${pathname%%/*}` remove the wrong part. Test your expansion on `/home/user1/somedir/myfile`.","`chmod 600` is not \"all permissions\" for the owner: a directory needs `x` to be entered.","Single quotes around the message would print `$pathname` literally."],"core":true},{"id":"d4-w-21","topic":"d4-strings","stage":"blank","marks":7,"prompt":"Write a script `mkbackup.sh` that takes one command line argument, the pathname of a file. The pathname always includes the directory the file is in (for example `./notes.txt` or `/home/user1/docs/my notes.txt`).\n\n1. Find the directory `dir` that the file is in, and the file's name `name` (without the directory).\n2. Create a directory named `backup` inside `dir`.\n3. Copy the file into `backup`, naming the copy `name.bak` (so `my notes.txt` is copied to `my notes.txt.bak`).\n4. Make the copy read-only for the owner and give no permissions to anyone else.\n5. Print `backed up NAME to DIR/backup` where `NAME` is the file's name and `DIR` is the directory.\n\nNo error checking is required: one argument is always given and the file exists. Ignore the error if `backup` already exists.","starter":"","solution":"#!/bin/bash\n\n# mkbackup.sh: copy a file into a backup directory next to it\n\npathname=$1\ndir=${pathname%/*}\nname=${pathname##*/}\n\nbackupdir=$dir/backup\nmkdir \"$backupdir\"\ncp \"$pathname\" \"$backupdir/$name.bak\"\nchmod 400 \"$backupdir/$name.bak\"\necho \"backed up $name to $backupdir\"","explain":"Running `./mkbackup.sh \"pics/old stuff/cat 1.jpg\"` prints `backed up cat 1.jpg to pics/old stuff/backup` and creates `pics/old stuff/backup/cat 1.jpg.bak` with permissions `r--------`. The structure is the same as `trash.sh`: split the pathname with `%/*` and `##*/`, build the new directory name once, then quote every pathname.","rubric":[{"marks":1,"item":"`#!/bin/bash` and `dir=${pathname%/*}` (or `${1%/*}`)"},{"marks":1,"item":"`name=${pathname##*/}`"},{"marks":1,"item":"`mkdir` of `dir/backup`"},{"marks":1,"item":"`cp` to `backup/name.bak`"},{"marks":1,"item":"`chmod 400` (or `u=r,go=`) on the copy"},{"marks":1,"item":"Correct message with `echo` in double quotes"},{"marks":1,"item":"All pathnames quoted"}],"pitfalls":["Swapping `%` and `##`: test them on `/home/user1/docs/a.txt` before you hand in.","Forgetting the quotes: the example name has spaces in both the directory and the file.","`chmod 400` must be applied to the copy, not the original or the directory."],"core":true},{"id":"d4-w-20","topic":"d5-regex","stage":"worked","marks":6,"prompt":"**Assignment 3 Q1, regex part.** Write `testpw.sh` that checks whether its first command line argument is a strong password. A strong password: (1) contains no whitespace, (2) has length at least 8, (3) contains at least one letter, (4) at least one digit, (5) at least one punctuation/symbol character. For **every** requirement that fails, print its message to standard error, in this order:\n\n- `password cannot contain whitespace`\n- `password length less than 8`\n- `password must contain at least one letter`\n- `password must contain at least one digit`\n- `password must contain at least one symbol`\n\nA strong password prints nothing. Assume exactly one argument is always given. (The real assignment also prints a usage message and exits with status 2; those parts need `if`, which you add on Day 5.)","starter":"","solution":"#!/bin/bash\n\n# testpw.sh: report every rule that the password $1 breaks\n\npw=$1\n\n[[ $pw =~ [[:space:]] ]] && echo \"password cannot contain whitespace\" >&2\n[[ $pw =~ .{8} ]] || echo \"password length less than 8\" >&2\n[[ $pw =~ [[:alpha:]] ]] || echo \"password must contain at least one letter\" >&2\n[[ $pw =~ [[:digit:]] ]] || echo \"password must contain at least one digit\" >&2\n[[ $pw =~ [[:punct:]] ]] || echo \"password must contain at least one symbol\" >&2","explain":"1. `pw=$1` gives the argument a readable name.\n2. **One line per rule, in the required order.** No line exits, so every rule is checked and every failing rule is reported.\n3. **`&&` or `||`?** `[[ $pw =~ [[:space:]] ]]` succeeds when there is whitespace, which breaks the rule, so the message follows `&&`. The other four tests succeed when the password is fine, so their messages follow `||` (print only when the test fails).\n4. **No anchors** in the class tests, because \"contains\" means *anywhere*. `[[:space:]]` needs both pairs of brackets.\n5. **Length:** `.{8}` is any 8 characters in a row, which exists only if the password has at least 8 characters. (On Day 5 you could also write `(( ${#pw} < 8 ))`.)\n6. Every message is an error, so it goes to stderr with `>&2`.\n\nTry it: `./testpw.sh abc` prints three messages (length, digit, symbol); `./testpw.sh 'abc123!@'` prints nothing.","rubric":[{"marks":1,"item":"Whitespace rule: `[[ $pw =~ [[:space:]] ]] &&` message (regex not quoted)"},{"marks":1,"item":"Length rule: `[[ $pw =~ .{8} ]] ||` message (or an equivalent regex such as `^.{8,}$`)"},{"marks":1,"item":"Letter rule with `[[:alpha:]]` and `||`"},{"marks":1,"item":"Digit rule with `[[:digit:]]` and `||`"},{"marks":1,"item":"Symbol rule with `[[:punct:]]` and `||`"},{"marks":1,"item":"All five messages exact, in order, sent to stderr with `>&2`"}],"pitfalls":["Quoting the regex: `=~ \"[[:digit:]]\"` looks for the literal text `[[:digit:]]`.","Writing `[:digit:]` without the outer brackets (that is a bracket expression of the characters `: d i g t`).","Swapping `&&` and `||`: the message would print exactly when the password is fine.","Using `exit` after a message: the later rules would never be checked."],"core":true},{"id":"d3-w-02","topic":"d3-streams","stage":"faded","marks":3,"prompt":"A program `./build.sh` prints normal messages to standard output and error messages to standard error. Fill in the blanks so that each command does what its comment says.","starter":"# (a) normal output to out.txt, errors to err.txt\n./build.sh ____ out.txt ____ err.txt\n\n# (b) both normal output and errors into log.txt\n./build.sh > log.txt ____\n\n# (c) normal output on the terminal, errors thrown away\n./build.sh ____","solution":"# (a) normal output to out.txt, errors to err.txt\n./build.sh > out.txt 2> err.txt\n\n# (b) both normal output and errors into log.txt\n./build.sh > log.txt 2>&1\n\n# (c) normal output on the terminal, errors thrown away\n./build.sh 2> /dev/null","explain":"(a) `>` (or `1>`) redirects fd 1 and `2>` redirects fd 2. (b) After stdout points at log.txt, `2>&1` makes stderr a copy of it; the order matters. (c) `/dev/null` discards whatever is written to it.","rubric":[{"marks":1,"item":"(a) `>` and `2>`"},{"marks":1,"item":"(b) `2>&1` after the stdout redirection"},{"marks":1,"item":"(c) `2> /dev/null`"}],"pitfalls":["Writing `2>&1` before `> log.txt`.","Writing `> /dev/null` in (c), which throws away the normal output instead."]},{"id":"d3-w-04","topic":"d3-expansions","stage":"faded","marks":3,"prompt":"Fill in the blanks using **expansions**.\n\n(a) Create the directories `A1`, `A2`, ..., `A6` with one mkdir command.\n\n(b) Print `There are N files here` where N is the number of names that `ls` prints in the current directory.\n\n(c) Print the number of minutes in a week (let the shell compute it).","starter":"mkdir A____\necho \"There are ____ files here\"\necho ____","solution":"mkdir A{1..6}\necho \"There are $(ls | wc -l) files here\"\necho $(( 7 * 24 * 60 ))","explain":"(a) A sequence brace expansion with the preamble `A`. (b) Command substitution runs the pipeline and inserts its output; it still works inside double quotes. (c) Arithmetic expansion computes 10080.","rubric":[{"marks":1,"item":"`A{1..6}` (or `A{1,2,3,4,5,6}`)"},{"marks":1,"item":"`$(ls | wc -l)`"},{"marks":1,"item":"`$(( 7 * 24 * 60 ))`"}],"pitfalls":["Writing `$(7 * 24 * 60)`: single parentheses are command substitution and try to run a command named 7.","Single-quoting the sentence in (b) stops the substitution."]},{"id":"d3-w-08","topic":"d4-scripts","stage":"faded","marks":4,"prompt":"Fill in the blanks of `info.sh` so that each line prints what its comment says. For example, `./info.sh red \"light blue\"` should print\n\n```\nscript: ./info.sh\ncount: 2\nfirst: red\n```\n\nand then a long listing (`ls -ld`) of the files named by **all** the arguments, each argument kept whole.","starter":"#!/bin/bash\n\n# info.sh: describe how the script was called\n\necho \"script: ____\"    # the pathname used to run the script\necho \"count: ____\"     # the number of arguments\necho \"first: ____\"     # the first argument\nls -ld ____            # every argument, each as one word","solution":"#!/bin/bash\n\n# info.sh: describe how the script was called\n\necho \"script: $0\"    # the pathname used to run the script\necho \"count: $#\"     # the number of arguments\necho \"first: $1\"     # the first argument\nls -ld \"$@\"            # every argument, each as one word","explain":"`$0` is the pathname used to run the script, `$#` the number of arguments (Quiz 1 Q2E: `echo $#`), `$1` the first argument. `\"$@\"` (with the quotes) passes every argument as a separate word, so `light blue` reaches `ls` as one name.","rubric":[{"marks":1,"item":"`$0`"},{"marks":1,"item":"`$#`"},{"marks":1,"item":"`$1`"},{"marks":1,"item":"`\"$@\"` with the double quotes"}],"pitfalls":["Writing `$@` without quotes: `light blue` is split into `light` and `blue`.","Confusing `$0` (the script's pathname) with `$1` (the first argument)."]},{"id":"d3-w-09","topic":"d4-scripts","stage":"blank","marks":4,"prompt":"Write a script `mkweeks.sh` that is run as `./mkweeks.sh COURSE`. Assume the directory COURSE does not exist yet. The script\n\n1. creates the directory COURSE containing the twelve directories `week01`, `week02`, ..., `week12`, using **one** `mkdir` command, and\n2. prints the line `COURSE: N folders` where N is counted by the script itself with `ls` and `wc` (it should be 12).\n\nThe name COURSE may contain spaces.\n\nExample: `./mkweeks.sh CISC220` creates `CISC220/week01` ... `CISC220/week12` and prints `CISC220: 12 folders`.","starter":"","solution":"#!/bin/bash\n\n# mkweeks.sh: make COURSE/week01 ... COURSE/week12\n\nmkdir -p \"$1\"/week{01..12}\necho \"$1: $(ls \"$1\" | wc -l) folders\"","explain":"`-p` creates COURSE as well as the week directories inside it. The brace expansion is outside the quotes (braces do not expand inside quotes), while `\"$1\"` is quoted; written side by side they make one word per week, such as `CISC220/week01`. `ls \"$1\" | wc -l` counts the names inside COURSE. `mkdir \"$1\" \"$1\"/week{01..12}` is equally correct.","rubric":[{"marks":1,"item":"Shebang on the first line"},{"marks":1,"item":"One `mkdir` that also creates COURSE (`-p`, or `\"$1\"` listed first)"},{"marks":1,"item":"`week{01..12}` brace expansion (leading zeros) after `\"$1\"/`, with `$1` quoted"},{"marks":1,"item":"`echo` with `$1` and `$(ls \"$1\" | wc -l)`"}],"pitfalls":["`\"$1/week{01..12}\"`: inside quotes the braces are not expanded, so one directory named `week{01..12}` is made.","`week{1..12}` gives `week1`, not `week01`.","Forgetting `-p`: mkdir cannot create `CISC220/week01` before `CISC220` exists."]},{"id":"d4-w-03","topic":"d4-strings","stage":"faded","marks":4,"prompt":"Write `newext.sh FILE EXT` that renames `FILE` so that its **last** extension is replaced by `EXT`. For example `./newext.sh report.txt md` renames `report.txt` to `report.md`, and `./newext.sh archive.tar.gz zip` renames `archive.tar.gz` to `archive.tar.zip`. Filenames may contain spaces. No error checking is required. Fill in the blanks.","starter":"#!/bin/bash\n\n# newext.sh: replace the last extension of $1 with $2\n\nf=____\next=____\n\nbase=${f____}\nmv ____ ____","solution":"#!/bin/bash\n\n# newext.sh: replace the last extension of $1 with $2\n\nf=$1\next=$2\n\nbase=${f%.*}\nmv \"$f\" \"$base.$ext\"","explain":"`${f%.*}` removes the **shortest** end part matching `.*`, which is only the last extension. `${f%%.*}` would remove `.tar.gz` and give `archive.zip`. In the `mv` destination, `\"$base.$ext\"` is safe without braces because `.` cannot be part of a variable name.","rubric":[{"marks":1,"item":"Arguments stored from `$1` and `$2`"},{"marks":1,"item":"`${f%.*}` (shortest match from the end)"},{"marks":1,"item":"New name built as base, `.`, extension"},{"marks":1,"item":"`mv` with both names quoted"}],"pitfalls":["Using `%%` removes every extension, not just the last.","Forgetting the `.` between base and extension gives `reportmd`."]},{"id":"d4-w-04","topic":"d4-strings","stage":"faded","marks":3,"prompt":"Write `swap.sh STRING` that prints the second half of `STRING` followed immediately by the first half, on one line. The first half has `${#s} / 2` characters (integer division). Examples: `./swap.sh abcdef` prints `defabc`; `./swap.sh abcde` prints `cdeab`. Fill in the blanks.","starter":"#!/bin/bash\n\n# swap.sh: print the second half of $1 then the first half\n\ns=$1\nn=____\nfirst=${s:____}\nsecond=${s:____}\necho \"____\"","solution":"#!/bin/bash\n\n# swap.sh: print the second half of $1 then the first half\n\ns=$1\nn=$(( ${#s} / 2 ))\nfirst=${s:0:n}\nsecond=${s:n}\necho \"$second$first\"","explain":"Same idea as Quiz 1 Q3A. `$(( ))` is arithmetic expansion (Day 3), and `/` is integer division, so for `abcde` `n` is 2. `${s:0:n}` is the first `n` characters, `${s:n}` is everything from index `n` to the end. Concatenation is just writing `$second$first` side by side.","rubric":[{"marks":1,"item":"`n=$(( ${#s} / 2 ))`"},{"marks":1,"item":"`${s:0:n}` and `${s:n}` for the two halves"},{"marks":1,"item":"Prints them concatenated in the right order, quoted"}],"pitfalls":["`n=${#s} / 2` is not arithmetic; you need `$(( ))`.","`${s:n:n}` drops the last character when the length is odd."]},{"id":"d3-w-05","topic":"d3-tr","stage":"blank","marks":4,"prompt":"Write a script `lastnames.sh` that takes one command line argument: the name of a classlist file (last name TAB first name TAB student number on each line). The script prints the **last names** converted to **uppercase**, sorted in **reverse** alphabetical order, one per line. The file name might contain spaces.\n\n(Inside a script, `$1` is the first command line argument.)","starter":"","solution":"#!/bin/bash\n\ncut -f1 \"$1\" | tr a-z A-Z | sort -r","explain":"`cut -f1` extracts the last names, `tr a-z A-Z` (or `tr '[:lower:]' '[:upper:]'`) uppercases them, `sort -r` reverses the order. Quoting `\"$1\"` keeps a file name with spaces as one argument.","rubric":[{"marks":1,"item":"`#!/bin/bash` and `\"$1\"` quoted"},{"marks":1,"item":"`cut -f1`"},{"marks":1,"item":"`tr` from lowercase to uppercase, fed by the pipe"},{"marks":1,"item":"`sort -r`"}],"pitfalls":["`tr a-z A-Z \"$1\"`: tr does not take a file name.","Unquoted `$1` breaks on file names with spaces."]},{"id":"d5-w-02","topic":"d5-regex","stage":"faded","marks":2,"prompt":"Provide a regular expression that matches all strings that start with an uppercase English letter and end with a digit (anything may be in between). Fill in the blanks.","starter":"^____.*____$","solution":"^[A-Z].*[0-9]$","explain":"Start: `^` then one uppercase letter `[A-Z]`. Middle: `.*` (any characters, possibly none). End: one digit `[0-9]` then `$`. Unlike the lowercase-letter question, no string of length one can both start with a letter and end with a digit, so `.*` (zero or more) is enough: `A1` matches with an empty middle. `[[:upper:]].*[[:digit:]]` with the anchors is also correct.","rubric":[{"marks":1,"item":"`^[A-Z]` (or `^[[:upper:]]`) anchored at the start"},{"marks":1,"item":"`.*[0-9]$` (or `[[:digit:]]`) anchored at the end"}],"pitfalls":["Leaving out `^` or `$`: then the pattern can match in the middle of the string","Writing `*` alone instead of `.*` (in a regex `*` repeats the previous atom; it is not a wildcard)"]},{"id":"d4-w-22","topic":"d5-regex","stage":"blank","marks":7,"prompt":"Write a script `checkname.sh` that checks whether its first command line argument is a good name for a Bash script file. Assume exactly one argument is always given. Check these rules in this order, and for **every** rule that fails print its message to standard error:\n\n1. `filename cannot contain whitespace`\n2. `filename must start with a letter`\n3. `filename must end with .sh`\n4. `filename longer than 20 characters` (fails when the length is more than 20)\n\nA good name prints nothing. The exit status is not marked. Use regular expressions with `[[ =~ ]]` and `&&` / `||` (no `if`).\n\nExamples: `checkname.sh backup.sh` prints nothing; `checkname.sh notes.txt` prints the rule 3 message; `checkname.sh \"9 lives\"` prints the rule 1, 2 and 3 messages.","starter":"","solution":"#!/bin/bash\n\n# checkname.sh: check that $1 is a good name for a script file\n\nname=$1\n\n[[ $name =~ [[:space:]] ]] && echo \"filename cannot contain whitespace\" >&2\n[[ $name =~ ^[[:alpha:]] ]] || echo \"filename must start with a letter\" >&2\n[[ $name =~ [.]sh$ ]] || echo \"filename must end with .sh\" >&2\n[[ $name =~ .{21} ]] && echo \"filename longer than 20 characters\" >&2","explain":"Same skeleton as `testpw.sh`. Rule 3 is the trap: `.sh$` is wrong because `.` means *any character*, so `abcsh` would pass. Write the dot as `[.]` so it is literal: `[.]sh$`. Rule 2 needs the anchor `^` (or `^[a-zA-Z]`). Rule 4 is broken when the name is **too long**, so the test is \"21 characters in a row exist\" and the message follows `&&`.","rubric":[{"marks":1,"item":"`#!/bin/bash` and the argument in a variable (or `$1` used directly)"},{"marks":1,"item":"Whitespace rule with `[[:space:]]` and `&&`"},{"marks":1,"item":"Start rule `^[[:alpha:]]` (anchored) with `||`"},{"marks":2,"item":"End rule with a literal dot `[.]sh$` (anchored) with `||`"},{"marks":1,"item":"Length rule `.{21}` (or `^.{21,}$`) with `&&`"},{"ma
