plain":"`^h.*o$`: starts with h, anything, ends with o: yes. `l{2}`: two l's in a row somewhere: yes (`ll`). `^l`: does not start with l."},{"id":"d5-q-26","topic":"d5-regex","type":"output","q":"The file `pets.txt` contains these five lines: `cat`, `dog`, `catalog`, `Cat`, `bobcat`. What does this print?","code":"grep -Ei 'cat$' pets.txt","answer":"cat\nCat\nbobcat","explain":"Lines ending with `cat`, ignoring case (`-i`). `catalog` contains cat but does not end with it; `dog` has no cat."},{"id":"d5-q-27","topic":"d5-regex","type":"output","q":"Same `pets.txt` (`cat`, `dog`, `catalog`, `Cat`, `bobcat`). What does this print?","code":"grep -En 'o' pets.txt","answer":"2:dog\n3:catalog\n5:bobcat","explain":"`-n` puts the line number and `:` before each matching line. Lines 2, 3 and 5 contain an `o`."},{"id":"d5-q-28","topic":"d5-regex","type":"short","q":"Write a regex that matches any signed or unsigned integer (an optional `+` or `-`, then one or more digits, and nothing else).","answer":"`^[-+]?[0-9]+$`","explain":"Also correct: `^[-+]?[[:digit:]]+$`, `^(-|\\+)?[0-9]+$`. The `-` is first inside the brackets so it is literal. Without `^` and `$`, strings like `12a` would match."},{"id":"d5-q-29","topic":"d5-regex","type":"short","q":"Write a single `grep` command that prints the lines of `words.txt` that are exactly five characters long.","answer":"`grep -E '^.....$' words.txt`","explain":"Also correct: `grep -E '^.{5}$' words.txt`. The anchors are essential: without them every line of five or more characters would match."},{"id":"d5-q-30","topic":"d5-regex","type":"mcq","q":"Which regex matches only the string `a.c`?","options":["`^a.c$`","`^a[.]c$`","`a[.]c`","`^a?c$`"],"answer":1,"explain":"Inside brackets `.` loses its meaning, so `[.]` is a literal dot. `^a.c$` also matches `abc`; `a[.]c` (no anchors) matches `xa.cx`; `^a?c$` matches `c` and `ac`."}],"write":[{"id":"d5-w-01","topic":"d5-if","stage":"worked","marks":2,"prompt":"Suppose that the variable `d` stores the name of a file. Write a Bash `if` statement that prints the message `not a directory` **to standard error** if the file whose name is stored in `d` is not a directory.","starter":"","solution":"if [[ ! -d $d ]]; then echo \"not a directory\" >&2; fi","explain":"Read the question as three pieces. *If the file is not a directory*: the test is `-d`, negated with `!`, inside `[[ ]]` with spaces: `[[ ! -d $d ]]`. *Prints the message*: `echo \"not a directory\"`. *To standard error*: add `>&2`. On one line you need `;` before `then` and before `fi`. Inside `[[ ]]` no quotes are needed around `$d` (no word splitting there), but `[[ ! -d \"$d\" ]]` is also correct. Now cover the solution and write it again from memory, then do it for \"not executable\" (`-x`) and \"does not exist\" (`-e`).","rubric":[{"marks":1,"item":"Correct test `[[ ! -d $d ]]` (negation, -d, spaces inside the brackets)"},{"marks":1,"item":"Correct if syntax (`; then ... fi`) and `echo \"not a directory\" >&2`"}],"pitfalls":["Writing `[[! -d $d]]` without spaces","Forgetting `>&2` when the question says standard error","Testing `-f` (regular file) instead of `-d`"]},{"id":"d5-w-02","topic":"d5-regex","stage":"faded","marks":2,"prompt":"Provide a regular expression that matches all strings that start with an uppercase English letter and end with a digit (anything may be in between). Fill in the blanks.","starter":"^____.*____$","solution":"^[A-Z].*[0-9]$","explain":"Start: `^` then one uppercase letter `[A-Z]`. Middle: `.*` (any characters, possibly none). End: one digit `[0-9]` then `$`. Unlike the lowercase-letter question, no string of length one can both start with a letter and end with a digit, so `.*` (zero or more) is enough: `A1` matches with an empty middle. `[[:upper:]].*[[:digit:]]` with the anchors is also correct.","rubric":[{"marks":1,"item":"`^[A-Z]` (or `^[[:upper:]]`) anchored at the start"},{"marks":1,"item":"`.*[0-9]$` (or `[[:digit:]]`) anchored at the end"}],"pitfalls":["Leaving out `^` or `$`: then the pattern can match in the middle of the string","Writing `*` alone instead of `.*` (in a regex `*` repeats the previous atom; it is not a wildcard)"]},{"id":"d5-w-03","topic":"d5-if","stage":"worked","marks":6,"prompt":"Write a script `safecreate.sh` that creates a new script file. It requires exactly one command line argument, the name of the file to create.\n\n- If the number of arguments is not exactly 1, print `safecreate.sh: filename required` to standard error and exit with status 2.\n- If a file with that name already exists, print `safecreate.sh: NAME already exists` to standard error (NAME is the argument) and exit with status 1, without changing the file.\n- Otherwise create the file containing the single line `#!/bin/bash` and give its owner execute permission.","starter":"","solution":"#!/bin/bash\n\n# safecreate.sh: create a new executable script, never overwrite\n\nif [[ $# -ne 1 ]]; then\n    echo \"safecreate.sh: filename required\" >&2\n    exit 2\nfi\n\nif [[ -e $1 ]]; then\n    echo \"safecreate.sh: $1 already exists\" >&2\n    exit 1\nfi\n\necho '#!/bin/bash' > \"$1\"\nchmod u+x \"$1\"","explain":"This is the course's `namedsh.sh`. Each error check is a **guard clause**: test for the problem, print to stderr, `exit`. Because `exit` stops the script, no `else` is needed and the creation code at the bottom only runs when both checks pass.\n\n1. `[[ $# -ne 1 ]]` (or `(( $# != 1 ))`) catches zero arguments and too many.\n2. `[[ -e $1 ]]` is true for *any* existing file, including a directory; `-f` would let the script try to overwrite a directory name.\n3. `echo '#!/bin/bash' > \"$1\"`: single quotes (as in the course's `namedsh.sh`) so nothing inside is special; `>` creates the file.\n4. `chmod u+x \"$1\"` adds execute for the owner only. Quote `\"$1\"` so names with spaces work.","rubric":[{"marks":1,"item":"Checks `$#` is exactly 1"},{"marks":1,"item":"Usage message to stderr and `exit 2`"},{"marks":1,"item":"Tests existence with `[[ -e $1 ]]`"},{"marks":1,"item":"Exists message (including the name) to stderr and `exit 1`"},{"marks":1,"item":"Creates the file with `#!/bin/bash` using `>` and quoted `\"$1\"`"},{"marks":1,"item":"`chmod u+x \"$1\"`"}],"pitfalls":["Forgetting `exit` after an error message, so the script carries on","Using `-f` instead of `-e` (a directory with that name would not be detected)","Unquoted `$1` in the `echo >` and `chmod` lines"]},{"id":"d5-w-04","topic":"d5-operators","stage":"faded","marks":6,"prompt":"Complete `grade.sh MARK`. If the number of arguments is not 1, print `Usage: grade.sh mark` to standard error and exit 1. If MARK is not made only of digits, or is greater than 100, print `grade.sh: mark must be an integer from 0 to 100` to standard error and exit 2. Otherwise print the letter grade: `A` for 80-100, `B` for 70-79, `C` for 60-69, `D` for 50-59, `F` below 50.","starter":"#!/bin/bash\n\n# grade.sh: convert a mark to a letter grade\n\nif (( ____ )); then\n    echo \"Usage: grade.sh mark\" >&2\n    exit 1\nfi\n\nmark=$1\nif [[ ! $mark =~ ____ ]] ____ (( mark > 100 )); then\n    echo \"grade.sh: mark must be an integer from 0 to 100\" >&2\n    exit 2\nfi\n\nif (( mark >= 80 )); then\n    echo A\n____ (( ____ )); then\n    echo B\nelif (( mark >= 60 )); then\n    echo C\nelif (( mark >= 50 )); then\n    echo D\n____\n    echo F\n____","solution":"#!/bin/bash\n\n# grade.sh: convert a mark to a letter grade\n\nif (( $# != 1 )); then\n    echo \"Usage: grade.sh mark\" >&2\n    exit 1\nfi\n\nmark=$1\nif [[ ! $mark =~ ^[0-9]+$ ]] || (( mark > 100 )); then\n    echo \"grade.sh: mark must be an integer from 0 to 100\" >&2\n    exit 2\nfi\n\nif (( mark >= 80 )); then\n    echo A\nelif (( mark >= 70 )); then\n    echo B\nelif (( mark >= 60 )); then\n    echo C\nelif (( mark >= 50 )); then\n    echo D\nelse\n    echo F\nfi","explain":"Blanks in order: `$# != 1`; `^[0-9]+$` (digits only, whole string); `||` (either problem is an error); `elif`; `mark >= 70`; `else`; `fi`.\n\nWhy `||` and not `&&`? The input is bad if it is not a number **or** it is too big. Short-circuiting also helps: when the regex test already fails, `(( mark > 100 ))` is not evaluated. Because the regex only allows digits, negative marks like `-5` are rejected too. The `elif` chain works top-down: by the time we test `mark >= 70`, we already know the mark is below 80.","rubric":[{"marks":1,"item":"`$# != 1` usage check (stderr, exit 1 already given)"},{"marks":1,"item":"Regex `^[0-9]+$` with `=~`, unquoted"},{"marks":1,"item":"`||` combining the two error conditions"},{"marks":2,"item":"`elif (( mark >= 70 )); then` correctly written"},{"marks":1,"item":"`else` and closing `fi`"}],"pitfalls":["Using `[[ $mark > 100 ]]`, a string comparison (\"99\" > \"100\" is true!)","Forgetting the anchors: `[0-9]+` alone accepts `7a`","Writing `else if` instead of `elif` (that needs its own `fi`)"]},{"id":"d5-w-05","topic":"d5-regex","stage":"worked","marks":10,"prompt":"(Assignment 3 Q1) Write `testpw.sh` that tests whether its first command line argument is a strong password. Extra arguments are ignored. If there are no arguments, print `Usage: testpw.sh password` to standard error and exit with status 1.\n\nA strong password: (1) contains no whitespace, (2) has length at least 8, (3) contains at least one letter, (4) at least one digit, (5) at least one punctuation/symbol character. For **every** requirement that fails, print its message to standard error, in this order:\n\n- `password cannot contain whitespace`\n- `password length less than 8`\n- `password must contain at least one letter`\n- `password must contain at least one digit`\n- `password must contain at least one symbol`\n\nExit with status 2 if any requirement failed, otherwise exit with status 0 (printing nothing).","starter":"","solution":"#!/bin/bash\n\n# testpw.sh: is a password strong?\n\nif (( $# == 0 )); then\n    echo \"Usage: testpw.sh password\" >&2\n    exit 1\nfi\n\npw=$1\nstatus=0\n\nif [[ $pw =~ [[:space:]] ]]; then\n    echo \"password cannot contain whitespace\" >&2\n    status=2\nfi\n\nif (( ${#pw} < 8 )); then\n    echo \"password length less than 8\" >&2\n    status=2\nfi\n\nif [[ ! $pw =~ [[:alpha:]] ]]; then\n    echo \"password must contain at least one letter\" >&2\n    status=2\nfi\n\nif [[ ! $pw =~ [[:digit:]] ]]; then\n    echo \"password must contain at least one digit\" >&2\n    status=2\nfi\n\nif [[ ! $pw =~ [[:punct:]] ]]; then\n    echo \"password must contain at least one symbol\" >&2\n    status=2\nfi\n\nexit $status","explain":"Structure first, details second:\n\n1. **Usage check** with `(( $# == 0 ))`: only *zero* arguments is an error, because extra arguments are ignored.\n2. **A status variable.** The script must report *every* failing rule, so it cannot `exit` at the first failure. `status=0` at the start; each failing check sets `status=2`; the last line is `exit $status`.\n3. **One independent `if` per rule**, in the required order (not `elif`: an `elif` chain would stop after the first failure).\n4. **The tests**: no anchors are needed, because \"contains\" means *anywhere*. `[[ $pw =~ [[:space:]] ]]` is true if there is whitespace (bad). For \"must contain\", negate: `[[ ! $pw =~ [[:digit:]] ]]`. Length uses `${#pw}` from Day 4.\n5. Every message goes to stderr with `>&2`.\n\nTry it: `./testpw.sh abc` prints three messages (length, digit, symbol) and exits 2; `./testpw.sh 'abc123!@'` prints nothing and exits 0.","rubric":[{"marks":1,"item":"Usage message to stderr and exit 1 when `$# == 0`"},{"marks":1,"item":"Whitespace check with `=~ [[:space:]]` (regex not quoted)"},{"marks":1,"item":"Length check `(( ${#pw} < 8 ))`"},{"marks":2,"item":"Letter and digit checks with `!` and `[[:alpha:]]` / `[[:digit:]]`"},{"marks":1,"item":"Symbol check with `[[:punct:]]`"},{"marks":1,"item":"All five messages exact, in order, to stderr"},{"marks":2,"item":"Status variable: all failing rules reported (independent ifs), `exit 2` if any failed"},{"marks":1,"item":"Exit 0 and no output for a strong password"}],"pitfalls":["Quoting the regex: `=~ \"[[:digit:]]\"` looks for the literal text `[[:digit:]]`","Writing `[:digit:]` without the outer brackets (that is a bracket expression of the characters `: d i g t`)","Using `exit 2` inside each check, which stops after the first failure","Using `elif`, which also stops after the first failure"]},{"id":"d5-w-06","topic":"d5-regex","stage":"faded","marks":10,"prompt":"Complete `checkuser.sh` that checks a username given as the first command line argument (extra arguments are ignored). With no arguments, print `Usage: checkuser.sh username` to standard error and exit 1. Check these rules in order and print the message to standard error for **every** rule that fails:\n\n1. `username cannot contain whitespace`\n2. `username length must be from 3 to 12`\n3. `username must start with a lowercase letter`\n4. `username cannot contain uppercase letters`\n5. `username must contain at least one digit`\n\nExit 2 if any rule failed; otherwise print nothing and exit 0.","starter":"#!/bin/bash\n\n# checkuser.sh: check that a username follows the rules\n\nif (( ____ )); then\n    echo \"Usage: checkuser.sh username\" ____\n    exit 1\nfi\n\nuser=$1\nstatus=0\n\nif [[ $user =~ ____ ]]; then\n    echo \"username cannot contain whitespace\" >&2\n    status=2\nfi\n\nif (( ____ )); then\n    echo \"username length must be from 3 to 12\" >&2\n    status=2\nfi\n\nif [[ ____ ]]; then\n    echo \"username must start with a lowercase letter\" >&2\n    status=2\nfi\n\nif [[ $user =~ ____ ]]; then\n    echo \"username cannot contain uppercase letters\" >&2\n    status=2\nfi\n\nif [[ ____ ]]; then\n    echo \"username must contain at least one digit\" >&2\n    status=2\nfi\n\nexit ____","solution":"#!/bin/bash\n\n# checkuser.sh: check that a username follows the rules\n\nif (( $# == 0 )); then\n    echo \"Usage: checkuser.sh username\" >&2\n    exit 1\nfi\n\nuser=$1\nstatus=0\n\nif [[ $user =~ [[:space:]] ]]; then\n    echo \"username cannot contain whitespace\" >&2\n    status=2\nfi\n\nif (( ${#user} < 3 || ${#user} > 12 )); then\n    echo \"username length must be from 3 to 12\" >&2\n    status=2\nfi\n\nif [[ ! $user =~ ^[a-z] ]]; then\n    echo \"username must start with a lowercase letter\" >&2\n    status=2\nfi\n\nif [[ $user =~ [[:upper:]] ]]; then\n    echo \"username cannot contain uppercase letters\" >&2\n    status=2\nfi\n\nif [[ ! $user =~ [[:digit:]] ]]; then\n    echo \"username must contain at least one digit\" >&2\n    status=2\nfi\n\nexit $status","explain":"Blanks in order: `$# == 0`; `>&2`; `[[:space:]]`; `${#user} < 3 || ${#user} > 12`; `! $user =~ ^[a-z]`; `[[:upper:]]`; `! $user =~ [[:digit:]]`; `$status`.\n\nCompare with `testpw.sh`: the same skeleton (usage check, `status` variable, one `if` per rule, `exit $status`). The new idea is rule 3, the only rule about a *position*: `^[a-z]` anchors the letter at the start. Rule 2 combines two comparisons with `||` inside `(( ))`. For `Ab` the script prints rules 2, 3, 4 and 5.","rubric":[{"marks":1,"item":"`$# == 0` usage check, message to stderr (`>&2`)"},{"marks":1,"item":"`[[:space:]]` whitespace test"},{"marks":2,"item":"Length test with `${#user}` and `||` covering both bounds"},{"marks":2,"item":"Start test `! $user =~ ^[a-z]` (anchored, negated)"},{"marks":1,"item":"`[[:upper:]]` test"},{"marks":2,"item":"Digit test negated with `!`"},{"marks":1,"item":"`exit $status`"}],"pitfalls":["Writing `^[a-z]+$` for rule 3: that would also reject `jsmith42`","Using `&&` in the length test: a length cannot be both below 3 and above 12","Forgetting `!` in the \"must start with\" and \"must contain\" rules"]},{"id":"d5-w-07","topic":"d5-regex","stage":"blank","marks":10,"prompt":"Write a script `checkname.sh` that checks whether its first command line argument is a good name for a Bash script file. Extra arguments are ignored. With no arguments, print `Usage: checkname.sh filename` to standard error and exit with status 1.\n\nCheck these rules in this order, and for **every** rule that fails print its message to standard error:\n\n1. `filename cannot contain whitespace`\n2. `filename must start with a letter`\n3. `filename must end with .sh`\n4. `filename longer than 20 characters` (fails when the length is more than 20)\n\nExit with status 2 if any rule failed; otherwise print nothing and exit with status 0.\n\nExamples: `checkname.sh backup.sh` exits 0; `checkname.sh notes.txt` prints the rule 3 message; `checkname.sh \"9 lives\"` prints the rule 1, 2 and 3 messages.","starter":"","solution":"#!/bin/bash\n\n# checkname.sh: check that a script filename follows the rules\n\nif (( $# == 0 )); then\n    echo \"Usage: checkname.sh filename\" >&2\n    exit 1\nfi\n\nname=$1\nstatus=0\n\nif [[ $name =~ [[:space:]] ]]; then\n    echo \"filename cannot contain whitespace\" >&2\n    status=2\nfi\n\nif [[ ! $name =~ ^[[:alpha:]] ]]; then\n    echo \"filename must start with a letter\" >&2\n    status=2\nfi\n\nif [[ ! $name =~ [.]sh$ ]]; then\n    echo \"filename must end with .sh\" >&2\n    status=2\nfi\n\nif (( ${#name} > 20 )); then\n    echo \"filename longer than 20 characters\" >&2\n    status=2\nfi\n\nexit $status","explain":"Same skeleton as `testpw.sh`. Rule 3 is the trap: `.sh$` is wrong because `.` means *any character*, so `abcsh` would pass. Write the dot as `[.]` so it is literal: `[.]sh$`. Rule 2 uses `^[[:alpha:]]` (or `^[a-zA-Z]`).","rubric":[{"marks":1,"item":"Usage message to stderr and exit 1 when there are no arguments"},{"marks":1,"item":"`status` variable initialised to 0 and `exit $status` at the end"},{"marks":1,"item":"Whitespace rule with `[[:space:]]`"},{"marks":2,"item":"Start rule `! $name =~ ^[[:alpha:]]` (anchored, negated)"},{"marks":2,"item":"End rule with a literal dot `[.]sh$` (anchored, negated)"},{"marks":1,"item":"Length rule `(( ${#name} > 20 ))`"},{"marks":1,"item":"Independent `if`s so every failing rule is reported, in order"},{"marks":1,"item":"All messages exact and sent to stderr"}],"pitfalls":["`.sh$` with an unescaped dot (matches `abcsh`)","Quoting the regex","Reporting only the first failing rule"]},{"id":"d5-w-08","topic":"d5-operators","stage":"blank","marks":5,"prompt":"Write a script `leap.sh` that takes one command line argument, a year. If the number of arguments is not 1, print `Usage: leap.sh year` to standard error and exit with status 1. If the argument is not made only of digits, print `leap.sh: YEAR is not a year` to standard error (YEAR is the argument) and exit with status 2. Otherwise print `YEAR is a leap year` or `YEAR is not a leap year`. A year is a leap year if it is divisible by 400, or if it is divisible by 4 and not divisible by 100.","starter":"","solution":"#!/bin/bash\n\n# leap.sh: is a year a leap year?\n\nif (( $# != 1 )); then\n    echo \"Usage: leap.sh year\" >&2\n    exit 1\nfi\n\nyr=$1\nif [[ ! $yr =~ ^[0-9]+$ ]]; then\n    echo \"leap.sh: $yr is not a year\" >&2\n    exit 2\nfi\n\nif (( yr % 400 == 0 || (yr % 4 == 0 && yr % 100 != 0) )); then\n    echo \"$yr is a leap year\"\nelse\n    echo \"$yr is not a leap year\"\nfi","explain":"Two guard clauses, then the course's leap-year condition. `2000`: leap. `1900`: not leap. `2024`: leap.","rubric":[{"marks":1,"item":"Argument-count check with usage message to stderr, exit 1"},{"marks":1,"item":"Digits-only check `[[ ! $yr =~ ^[0-9]+$ ]]` with message to stderr, exit 2"},{"marks":2,"item":"Correct leap-year condition using `%`, `||`, `&&` (and parentheses)"},{"marks":1,"item":"Both output messages with the year, using if/else"}],"pitfalls":["Writing `yr % 4 == 0 || yr % 100 != 0 && ...` in the wrong grouping","Forgetting `exit` after an error message, so the script goes on to print a leap-year message too"]}]},{"day":6,"title":"Arrays, loops, and functions","goal":"Store data in arrays, repeat work with while/until/for loops (over numbers, words, arguments, files, characters and lines), and organize scripts into functions that take arguments, set exit statuses and hand back results.","topics":[{"id":"d6-arrays","title":"Arrays","notebook":"bash/arrays.ipynb","priority":"high","examNote":"Quiz 2 (2023) Q1C asked how to create an array holding 1, 2, 3 (`arr=(1 2 3)`) and Q1D how to get the number of elements (`${#arr[@]}`). Q4 (10 marks) started with `arr=(\"$@\")` and needed `${arr[i]}`, element swaps, `${#arr[@]}` and `echo \"${arr[@]}\"`.","blocks":[{"type":"md","text":"An ordinary variable holds one value. An **array** is a single variable that holds many values. Each value is called an **element**, and each element has an **index**: a whole number that says where the element is stored.\n\nBash arrays are **zero-based**: 0 is the smallest legal index. But Bash is looser than Java or Python:\n\n- you do not have to start filling the array at index 0, and\n- the indexes do not have to be next to each other (an array with elements only at indexes 3 and 100 is fine).\n\nAn array with gaps in its indexes is called a **sparse** array.\n\nLike other Bash variables, an array is created automatically the first time you assign to it.\n\n### Creating an array\n\nThe most common way is to list the elements inside parentheses, separated by **spaces**:"},{"type":"code","code":"arr=(1 2 3)\necho \"${arr[0]}\"\necho \"${arr[2]}\"","caption":"Create an array with three elements and print the elements at indexes 0 and 2 (Quiz 2 Q1C)."},{"type":"code","code":"1\n3","caption":"Output"},{"type":"md","text":"Elements that contain spaces must be quoted, just like arguments to a command:\n\n```bash\nanimals=(\"a dog\" \"a cat\" \"a fish\")    # 3 elements\n```\n\nThe notebook shows three more ways to create arrays:\n\n```bash\narr[0]=hello                          # assign one element; creates arr if needed\ndeclare -a y=(10 20 30)               # declare -a also creates an array\narr4=([100]=weird [0]=weirder [1]=weirdest)   # [index]=value sets specific indexes\n```\n\nTo delete a whole array variable, use `unset arr`."},{"type":"pitfall","text":"There are **no commas** between elements and **no spaces around `=`**. `arr=(1, 2, 3)` makes the elements `1,` `2,` and `3`. `arr = (1 2 3)` is a syntax error, because the shell reads `arr` as a command name."},{"type":"code","code":"$ arr=(1, 2, 3)\n$ echo \"${arr[0]}\"\n1,","caption":"The comma becomes part of the element."},{"type":"check","q":"Show how to create a Bash array `arr` that contains the values 1, 2, and 3.","a":"`arr=(1 2 3)`  (spaces between elements, no commas, no spaces around `=`)"},{"type":"md","text":"### Reading and changing one element\n\nTo get the element at index *i*, write `${arr[i]}`. The braces are **required**.\n\nTo change (or create) one element, write `arr[i]=value` (no `$`, no braces, because you are naming the variable, not expanding it).\n\nThe index is evaluated as an **arithmetic expression**, so you can use a variable or a calculation without a `$`: `${arr[i]}`, `${arr[i+1]}`, and `${arr[$i]}` all work."},{"type":"code","code":"months=(Jan Feb Mar Apr)\ni=2\necho \"${months[i]}\"\necho \"${months[i+1]}\"\nmonths[0]=January\necho \"${months[0]}\""},{"type":"code","code":"Mar\nApr\nJanuary","caption":"Output"},{"type":"md","text":"Forgetting the braces is an easy mistake. `$arr` on its own expands to the element at index **0**. So `$arr[2]` expands `$arr` (the element at index 0) and then glues on the plain text `[2]`:"},{"type":"code","code":"arr=(red green blue)\necho $arr\necho $arr[2]\necho ${arr[2]}"},{"type":"code","code":"red\nred[2]\nblue","caption":"Output"},{"type":"check","q":"`arr=(red green blue)`. What does `echo $arr[1]` print, and why?","a":"`red[1]`. `$arr` means element 0 (`red`), and `[1]` is just text after it. Write `${arr[1]}` to get `green`."},{"type":"md","text":"### Number of elements: `${#arr[@]}`\n\nThe number of elements in `arr` is written `${#arr[@]}` (or `${#arr[*]}`). Compare with `${#str}`, the length of a string, from Day 4: the `#` means \"count\"."},{"type":"code","code":"arr1=(hello)\narr2=(0 1 2 3 4)\narr3=([1]=goodbye)\narr4=([100]=weird [0]=weirder [1]=weirdest)\necho \"# elems in arr1 : ${#arr1[@]}\"\necho \"# elems in arr2 : ${#arr2[@]}\"\necho \"# elems in arr3 : ${#arr3[@]}\"\necho \"# elems in arr4 : ${#arr4[@]}\"","caption":"From the arrays notebook. arr4 has 3 elements even though its largest index is 100."},{"type":"code","code":"# elems in arr1 : 1\n# elems in arr2 : 5\n# elems in arr3 : 1\n# elems in arr4 : 3","caption":"Output"},{"type":"pitfall","text":"`${#arr}` (no `[@]`) is the length of the **string** in element 0, not the number of elements. With `arr=(apple kiwi)`, `${#arr}` is `5` but `${#arr[@]}` is `2`."},{"type":"check","q":"Given a Bash array `arr`, show how to get the number of elements in `arr`.","a":"`${#arr[@]}` (or `${#arr[*]}`). This was Quiz 2 Q1D."},{"type":"md","text":"### The indexes in use: `${!arr[@]}`\n\n`${!arr[@]}` expands to the list of indexes that actually hold elements. This matters for sparse arrays, where the indexes are not simply 0, 1, 2, ..."},{"type":"code","code":"arr1=(hello)\narr2=(Jan Feb Mar Apr)\narr3=([1]=goodbye)\narr4=([100]=weird [0]=weirder [1]=weirdest)\necho ${!arr1[@]}\necho ${!arr2[@]}\necho ${!arr3[@]}\necho ${!arr4[@]}","caption":"Indexes are listed in increasing order."},{"type":"code","code":"0\n0 1 2 3\n1\n0 1 100","caption":"Output"},{"type":"md","text":"Looping over the indexes lets you print each index together with its element:"},{"type":"code","code":"months=(Jan Feb Mar Apr May)\nfor i in \"${!months[@]}\"; do\n    elem=${months[i]}\n    echo \"months[$i] = $elem\"\ndone"},{"type":"code","code":"months[0] = Jan\nmonths[1] = Feb\nmonths[2] = Mar\nmonths[3] = Apr\nmonths[4] = May","caption":"Output"},{"type":"check","q":"`arr=([3]=c [7]=g)`. What do `${#arr[@]}` and `${!arr[@]}` expand to?","a":"`${#arr[@]}` is `2` (two elements). `${!arr[@]}` is `3 7` (the indexes in use)."},{"type":"md","text":"### All the elements: `@` versus `*`, quoted versus unquoted\n\nThere are four ways to expand every element. They differ only when elements contain spaces:\n\n| Expansion | What you get | Use it? |\n|---|---|---|\n| `${arr[@]}` | all elements, then **word splitting** | only if no element has spaces |\n| `${arr[*]}` | same as above | only if no element has spaces |\n| `\"${arr[@]}\"` | each element as **its own word**: `\"${arr[0]}\" \"${arr[1]}\" ...` | **almost always this one** |\n| `\"${arr[*]}\"` | **one single word**: all elements joined by spaces | when you want one string |\n\nHere are the four cases from the notebook. Watch how many times each loop body runs:"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in ${animals[*]}; do echo $i; done","caption":"Unquoted *: the elements are split into 6 words."},{"type":"code","code":"a\ndog\na\ncat\na\nfish","caption":"Output"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in ${animals[@]}; do echo $i; done","caption":"Unquoted @: also 6 words."},{"type":"code","code":"a\ndog\na\ncat\na\nfish","caption":"Output"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in \"${animals[@]}\"; do echo $i; done","caption":"Quoted @: one word per element (3 iterations). This is what you want."},{"type":"code","code":"a dog\na cat\na fish","caption":"Output"},{"type":"code","code":"animals=(\"a dog\" \"a cat\" \"a fish\")\nfor i in \"${animals[*]}\"; do echo $i; done","caption":"Quoted *: one single word (1 iteration)."},{"type":"code","code":"a dog a cat a fish","caption":"Output"},{"type":"why","q":"Why is `\"${arr[@]}\"` almost always the right choice?","a":"Quoting stops word splitting, so an element like `a dog` stays one word, and `@` (unlike `*`) keeps the elements as **separate** words. You get exactly one word per element, no more and no less. This is the same rule as `\"$@\"` for command line arguments."},{"type":"md","text":"To **print** the whole array on one line, `echo \"${arr[@]}\"` is the usual answer (echo prints its arguments separated by single spaces)."},{"type":"check","q":"`animals=(\"a dog\" \"a cat\")`. How many lines does `for x in \"${animals[*]}\"; do echo \"$x\"; done` print?","a":"One line, `a dog a cat`. Quoted `*` joins all elements into a single word."},{"type":"md","text":"### Appending and concatenating\n\n`arr+=(\"$elem\")` appends one element to the end of `arr`. `arr1+=(\"${arr2[@]}\")` appends every element of `arr2` to `arr1`. The parentheses are essential."},{"type":"code","code":"months=(Jan Feb Mar Apr)\nmonths+=(\"May\")\necho \"${months[@]}\"\necho \"${#months[@]}\""},{"type":"code","code":"Jan Feb Mar Apr May\n5","caption":"Output"},{"type":"md","text":"New elements go **after the largest index in use**, not into the gaps:"},{"type":"code","code":"a[100]=0\nb=(5 6 7)\na+=(\"${b[@]}\")\necho \"${a[@]}\"\necho \"${!a[@]}\"","caption":"From the notebook: appending to a sparse array."},{"type":"code","code":"0 5 6 7\n100 101 102 103","caption":"Output"},{"type":"pitfall","text":"`arr+=x` without parentheses does **not** append an element. It appends the text `x` to the string in element 0:"},{"type":"code","code":"arr=(a b)\narr+=c\necho \"${arr[@]}\"\narr+=(d)\necho \"${arr[@]}\""},{"type":"code","code":"ac b\nac b d","caption":"Output"},{"type":"check","q":"Show how to append the value stored in `x` as a new element at the end of array `nums`.","a":"`nums+=(\"$x\")`"},{"type":"md","text":"### Filling an array from arguments, the keyboard, or a file\n\n**From the command line arguments.** `arr=(\"$@\")` copies every argument into `arr`, one element per argument, keeping arguments with spaces whole. Quiz 2 Q4 started this way."},{"type":"code","code":"$ cat args.sh\n#!/bin/bash\narr=(\"$@\")\necho \"count: ${#arr[@]}\"\necho \"second: ${arr[1]}\"\n$ ./args.sh one \"two three\" four\ncount: 3\nsecond: two three"},{"type":"md","text":"**From the keyboard.** `read -a arr` reads one line from standard input, splits it into words, and stores the words in `arr`. `read -p \"Enter a list: \" -a arr` prints a prompt first. Quotes typed by the user do **not** keep words together here.\n\n**From a file.** `mapfile -t arr < file` (also called `readarray`) reads **every line** of standard input into `arr`, one line per element. The `-t` option removes the newline at the end of each line."},{"type":"code","code":"mapfile -t students < students.txt\necho \"${#students[@]} lines\"\nfor elem in \"${students[@]}\"; do\n    echo \"$elem\"\ndone","caption":"students.txt is the notebook's file (a comment line plus 3 students)."},{"type":"code","code":"4 lines\n# student number, last name, first name\n12345,Parr,Jack-Jack\n23456,Wazowski,Mike\n98765,Best,Lucius","caption":"Output"},{"type":"check","q":"Which command reads each line of the file `data.txt` into its own element of the array `lines`, without the newlines?","a":"`mapfile -t lines < data.txt` (`readarray -t lines < data.txt` is the same command)."},{"type":"md","text":"### Swapping two elements\n\nSorting algorithms (like the selection sort in Quiz 2 Q4) swap two elements. You need a temporary variable, as in Java:"},{"type":"code","code":"arr=(30 10 20)\ni=0; j=1\ntmp=${arr[i]}\narr[i]=${arr[j]}\narr[j]=$tmp\necho \"${arr[@]}\""},{"type":"code","code":"10 30 20","caption":"Output"},{"type":"md","text":"### Key points\n\n- Create: `arr=(1 2 3)`, `arr=(\"$@\")`, `arr[i]=val`, `mapfile -t arr < file`. Spaces between elements, no commas.\n- One element: `${arr[i]}` (braces required; `$arr` alone is element 0).\n- Count: `${#arr[@]}`. Indexes in use: `${!arr[@]}`.\n- All elements: `\"${arr[@]}\"` (one word per element). `\"${arr[*]}\"` is one single word.\n- Append: `arr+=(\"$x\")`. Arrays may be sparse; appends go after the largest index."}]},{"id":"d6-loops","title":"Loops","notebook":"bash/loops.ipynb","priority":"high","examNote":"Quiz 2 (2023) Q1F: fill in `for arg in \"$@\"; do`. Quiz 2 Q4 used C-style loops over array indexes. Assignment 3 used `for f in *.\"$1\"` with the no-match case (Q2), nested loops over `*/` and `\"$@\"` (Q3), and nested loops over the characters of a string (Q4).","blocks":[{"type":"md","text":"A **loop** runs the same commands again and again. Bash has four kinds:\n\n1. `while` loops: repeat **while** a test command succeeds (exit status 0)\n2. `until` loops: repeat **until** a test command succeeds (they run while it fails)\n3. `for name in list` loops: run once for each word in a list\n4. C-style `for (( ...; ...; ... ))` loops: counting with arithmetic\n\n### `while` and `until`\n\nRecall from Day 5 that `if` runs its body when the **test command** has exit status 0 (\"true\"). Loops use the same idea:\n\n```bash\nwhile test-command; do\n    commands\ndone\n```\n\nThe test command is usually `(( ))` for numbers or `[[ ]]` for strings and files. Both of these loops count down from 10 to 0:"},{"type":"code","code":"count=10\nuntil (( count < 0 )); do\n    echo $count\n    count=$(( count - 1 ))\ndone | head -n 3","caption":"until: keep going until count < 0 becomes true (output cut to 3 lines with head)."},{"type":"code","code":"10\n9\n8","caption":"Output"},{"type":"code","code":"count=3\nwhile (( count > -1 )); do\n    echo $count\n    (( count-- ))\ndone","caption":"while: keep going while count > -1 is true. (( count-- )) subtracts 1."},{"type":"code","code":"3\n2\n1\n0","caption":"Output"},{"type":"md","text":"Inside `(( ))` you can write variable names without `$`. `while true; do ... done` and `until false; do ... done` are infinite loops (you stop them with `break`, below).\n\nThe notebook's `collatz.sh` uses a `while` loop to print the Collatz sequence: halve *n* if it is even, otherwise replace it with 3*n*+1, until *n* is 1:"},{"type":"code","code":"#!/bin/bash\n\n# collatz.sh\n\nif (( $# == 0 )); then\n    echo \"collatz.sh: missing positive integer argument\" >&2\n    exit 1\nelse\n    val=$1\nfi\nif [[ ! $val =~ ^[-+]?[0-9]+$ ]]; then\n    echo \"collatz.sh: argument is not an integer\" >&2\n    exit 1\nfi\nif (( val < 1 )); then\n    echo \"collatz.sh: argument is not positive\" >&2\n    exit 2\nfi\necho $val\nwhile (( val != 1 )); do\n    if (( val % 2 == 0 )); then\n        val=$(( val / 2 ))\n    else\n        val=$(( 3 * val + 1 ))\n    fi\n    echo $val\ndone","caption":"scripts/loops/collatz.sh"},{"type":"code","code":"$ ./collatz.sh 6\n6\n3\n10\n5\n16\n8\n4\n2\n1"},{"type":"pitfall","text":"Forgetting to change the loop variable inside the body gives an **infinite loop**: the test never changes. Every `while`/`until` body must move toward the stopping condition (`(( count-- ))`, `shift`, reading the next line, ...)."},{"type":"check","q":"What is the difference between `while` and `until`?","a":"`while` repeats as long as the test command **succeeds** (exit status 0); `until` repeats as long as it **fails**, stopping as soon as it succeeds."},{"type":"md","text":"### `for name in list`\n\n```bash\nfor name in list; do\n    commands\ndone\n```\n\nIn Bash a **list** is just a sequence of words (strings separated by whitespace). The body runs once per word, with the variable *name* set to the current word. The list can come from many places:"},{"type":"code","code":"for i in 3 2 1; do echo $i; done","caption":"Words typed directly."},{"type":"code","code":"3\n2\n1","caption":"Output"},{"type":"code","code":"str=\"this is   a string\"\nfor s in $str; do\n    echo $s\ndone","caption":"An unquoted variable: word splitting breaks it into words (on purpose here)."},{"type":"code","code":"this\nis\na\nstring","caption":"Output"},{"type":"code","code":"for i in {3..0}; do echo $i; done","caption":"Brace expansion (Day 3)."},{"type":"code","code":"3\n2\n1\n0","caption":"Output"},{"type":"code","code":"for word in $(echo one two); do echo \"[$word]\"; done","caption":"Command substitution. (The notebook warns: don't use $(seq ...) to count; use a C-style loop.)"},{"type":"code","code":"[one]\n[two]","caption":"Output"},{"type":"md","text":"**Filename expansion (globs).** A glob in the list becomes the matching filenames, sorted. Each filename is one word, **even if it contains spaces**, because word splitting is not applied to glob results. Still quote `\"$f\"` inside the body, where word splitting *would* apply."},{"type":"code","code":"for f in *.txt; do\n    echo \"file: $f\"\ndone","caption":"Directory contains a.txt, 'my notes.txt' and b.md."},{"type":"code","code":"file: a.txt\nfile: my notes.txt","caption":"Output"},{"type":"md","text":"**The no-match case.** If a glob matches **nothing**, Bash leaves the pattern as plain text, so the loop runs **once** with the variable equal to the pattern itself:"},{"type":"code","code":"for f in *.pdf; do\n    echo \"file: $f\"\ndone","caption":"No .pdf files here, yet the body runs once."},{"type":"code","code":"file: *.pdf","caption":"Output"},{"type":"md","text":"A script that then runs `mv \"$f\" ...` would fail with `mv: cannot stat '*.pdf'`. The standard fix (used in Assignment 3's `chext.sh`) is to skip anything that does not exist:\n\n```bash\nfor f in *.pdf; do\n    [[ -e $f ]] || continue     # no match: skip the literal *.pdf\n    echo \"file: $f\"\ndone\n```\n\n(Another fix is to run `shopt -s nullglob` first, which makes a non-matching glob expand to nothing.)\n\n**Directories only.** The glob `*/` matches only directories, and each name ends with `/`, e.g. `stu1/` and `stu 3/`. Assignment 3's `checksubs.sh` loops with `for d in */; do`."},{"type":"check","q":"A directory has no `.pdf` files. How many times does the body of `for f in *.pdf; do echo \"$f\"; done` run, and what does it print?","a":"Once. It prints `*.pdf`, because a glob that matches nothing is left unchanged."},{"type":"md","text":"### C-style `for`\n\n```bash\nfor (( expr1; expr2; expr3 )); do\n    commands\ndone\n```\n\n*expr1* runs once at the start (set up the counter). *expr2* is checked before each pass; the body runs while it is non-zero (true). *expr3* runs after each pass (update the counter). All three are arithmetic, so no `$` is needed on variables."},{"type":"code","code":"for (( i=10; i >= 0; i -= 5 )); do\n    echo $i\ndone"},{"type":"code","code":"10\n5\n0","caption":"Output"},{"type":"md","text":"**Looping over the characters of a string.** Combine a C-style loop with `${#s}` (length) and `${s:i:1}` (the 1 character at offset *i*, Day 4). Assignment 3 Q4 (`hasdups`, `indexof`) is built on this pattern:"},{"type":"code","code":"s=\"cisc\"\nfor (( i = 0; i < ${#s}; i++ )); do\n    echo \"$i: ${s:i:1}\"\ndone"},{"type":"code","code":"0: c\n1: i\n2: s\n3: c","caption":"Output"},{"type":"md","text":"**Looping over an array by index** works the same way when the array is not sparse: `for (( i = 0; i < ${#arr[@]}; i++ )); do echo \"${arr[i]}\"; done`. To go backwards, start at `${#arr[@]} - 1` and use `i--`."},{"type":"check","q":"Write the header of a C-style loop that visits every index `i` of the string `s`.","a":"`for (( i = 0; i < ${#s}; i++ )); do`"},{"type":"md","text":"### Looping over the command line arguments: `\"$@\"`\n\n`\"$@\"` expands to `\"$1\" \"$2\" \"$3\" ...`: one word per argument, spaces kept. So `for arg in \"$@\"` visits each argument exactly once (Quiz 2 Q1F asked for exactly this)."},{"type":"code","code":"#!/bin/bash\n\n# for_each_arg.sh\n\ni=1\nfor arg in \"$@\"; do\n    echo \"\\$${i} : $arg\"\n    (( i++ ))\ndone","caption":"scripts/loops/for_each_arg.sh"},{"type":"code","code":"$ ./for_each_arg.sh arg1 \"arg2 has some spaces\" \"arg3 has some spaces, too\"\n$1 : arg1\n$2 : arg2 has some spaces\n$3 : arg3 has some spaces, too"},{"type":"md","text":"`bad_for_each_arg.sh` is identical except that it says `for arg in $@` (no quotes). Unquoted, `$@` becomes `$1 $2 $3`, and word splitting breaks every argument at its spaces:"},{"type":"code","code":"$ ./bad_for_each_arg.sh arg1 \"arg2 has some spaces\" \"arg3 has some spaces, too\"\n$1 : arg1\n$2 : arg2\n$3 : has\n$4 : some\n$5 : spaces\n$6 : arg3\n$7 : has\n$8 : some\n$9 : spaces,\n$10 : too"},{"type":"why","q":"Why do the quotes in `\"$@\"` matter even though `$@` already means \"all the arguments\"?","a":"Without quotes, the shell performs word splitting on the expanded arguments, so one argument with spaces turns into several words. With quotes, each argument is kept as exactly one word. That is why the bad script reports 10 arguments instead of 3."},{"type":"md","text":"**`shift`.** Another common pattern is a `while` loop with `shift`. `shift` moves every argument one place left (`$2` becomes `$1`, ...), drops the old `$1`, and lowers `$#` by one. `shift n` shifts by *n*."},{"type":"code","code":"#!/bin/bash\n\n# shift_arg.sh\n\nwhile (( $# > 0 )); do\n    # do something with first positional parameter\n    # e.g., print its value\n    echo \"$1\"\n\n    # now shift positional parameters\n    shift\ndone","caption":"scripts/loops/shift_arg.sh"},{"type":"code","code":"$ ./shift_arg.sh arg1 \"arg2 has some spaces\"\narg1\narg2 has some spaces"},{"type":"check","q":"Fill in the blank so the loop processes each command line argument: `for arg in ____; do`","a":"`\"$@\"` (with the double quotes)."},{"type":"md","text":"### `break` and `continue`\n\n- `break` leaves the loop immediately.\n- `continue` skips the rest of this pass and starts the next one.\n\nIn nested loops, `break 2` / `continue 2` act on the loop one level further out."},{"type":"code","code":"for i in 1 2 3 4 5 6; do\n    if (( i == 2 )); then\n        continue\n    fi\n    if (( i == 5 )); then\n        break\n    fi\n    echo $i\ndone"},{"type":"code","code":"1\n3\n4","caption":"Output"},{"type":"check","q":"In the loop above, why is 6 never printed?","a":"When `i` is 5, `break` ends the whole loop, so the pass for 6 never happens."},{"type":"md","text":"### Reading a file one line at a time\n\n```bash\nwhile read -r line; do\n    echo \"$line\"\ndone < \"$file\"\n```\n\nThe redirection `< \"$file\"` after `done` feeds the file to the whole loop. Each time `read` runs, it reads the next line into `line`. `read` succeeds (status 0) while there is a line to read, and fails at the end of the file, which ends the loop. `-r` makes `read` treat backslashes as ordinary characters.\n\nSkip comment lines with a regex test and `continue`:"},{"type":"code","code":"file=\"students.txt\"\nwhile read -r line; do\n    if [[ $line =~ ^# ]]; then\n        continue\n    fi\n    echo \"$line\"\ndone < \"$file\""},{"type":"code","code":"12345,Parr,Jack-Jack\n23456,Wazowski,Mike\n98765,Best,Lucius","caption":"Output"},{"type":"md","text":"`read` can also **split** each line into several variables using the characters in `IFS`. Writing `IFS=\",\"` just before `read` sets it only for that command:"},{"type":"code","code":"while IFS=\",\" read -r number last first; do\n    if [[ $number =~ ^# ]]; then\n        continue\n    fi\n    echo \"$first $last\"\ndone < students.txt"},{"type":"code","code":"Jack-Jack Parr\nMike Wazowski\nLucius Best","caption":"Output"},{"type":"pitfall","text":"The last line of a file is skipped by `while read` if it does **not** end with a newline (`read` fails on it). Also put the redirection after `done`. Writing `while read -r line < \"$file\"; do` re-opens the file on every pass, so it reads the first line forever."},{"type":"check","q":"Where does `< \"$file\"` go in a `while read` loop?","a":"After `done`: `done < \"$file\"`. That way the whole loop reads from the file, one line per pass."},{"type":"md","text":"### Nested loops\n\nA loop inside a loop runs its whole inner loop once per pass of the outer loop. Assignment 3's `checksubs.sh` loops over directories (outer) and over the expected files (inner):\n\n```bash\nfor d in */; do\n    for f in \"$@\"; do\n        if [[ ! -f $d$f ]]; then\n            echo \"$d\" >&2\n            break            # one message per directory is enough\n        fi\n    done\ndone\n```\n\nNote `$d$f`: `d` already ends with `/`, so `stu1/` + `README` is `stu1/README`."},{"type":"check","q":"In `checksubs.sh`, why is the path written `$d$f` and not `$d/$f`?","a":"Names produced by the glob `*/` already end with `/` (e.g. `stu1/`), so `$d$f` gives `stu1/README`. (`$d/$f` gives `stu1//README`, which also works, because repeated slashes act like one.)"},{"type":"md","text":"### Key points\n\n- `while`/`until` loop on a test command's exit status; use `(( ))` or `[[ ]]`.\n- `for x in list`: lists come from words, unquoted variables, globs, `{a..b}`, `$( )`.\n- A glob that matches nothing stays literal: guard with `[[ -e $f ]] || continue`.\n- `for (( i = 0; i < n; i++ ))` for counting; `${s:i:1}` for the characters of a string.\n- `for arg in \"$@\"` (quoted!) or `while (( $# > 0 )); do ...; shift; done` for arguments.\n- `while read -r line; do ...; done < \"$file\"` reads a file line by line."}]},{"id":"d6-functions","title":"Functions","notebook":"bash/functions.ipynb","priority":"high","examNote":"Quiz 2 (2023) Q4 (10 marks, a third of the quiz): write `sort` and `minidx` functions that sort an array; you choose how `minidx` returns its answer (global variable or `echo` + `$( )`). Assignment 3 Q4 wrote functions in a sourced file that print a result **and** set a return status (`hasdups`, `indexof`).","blocks":[{"type":"md","text":"A **function** is a named group of commands. Once defined, you run (call) it by typing its name, exactly like a command.\n\n### Declaring a function\n\nThe course writes functions like this:\n\n```bash\nfname() {\n    commands\n}\n```\n\nBash also accepts `function fname { commands }`. It is legal but less portable; you may see it on old tests (Quiz 2 Q4 used it), but write `fname() { ... }` yourself.\n\n**Brace rules.** The `{` must be followed by a space or newline, and the `}` must start a new command: put it on its own line (course style), or after a `;` if you write the function on one line. Otherwise Bash cannot tell that the brace is a delimiter and you get a syntax error:"},{"type":"code","code":"$ cat bad.sh\n#!/bin/bash\nfname() {echo \"inside function\"\n}\n$ ./bad.sh\n./bad.sh: line 2: syntax error near unexpected token `{echo'\n./bad.sh: line 2: `fname() {echo \"inside function\"'","caption":"No space after {."},{"type":"code","code":"$ cat missing_newline.sh\n#!/bin/bash\nfname() {\n    echo \"inside function\" }\n$ ./missing_newline.sh\n./missing_newline.sh: line 4: syntax error: unexpected end of file","caption":"The } is on the same line as echo, so Bash treats it as one more argument to echo and the function body never ends."},{"type":"code","code":"greet() { echo \"Hello\"; }\ngreet","caption":"One-line form: note the space after { and the ; before }."},{"type":"code","code":"Hello","caption":"Output"},{"type":"md","text":"A function must be **defined before the line that calls it runs**. Bash reads a script top to bottom; calling a function earlier gives `command not found`. That is why scripts put their functions at the top."},{"type":"code","code":"$ cat early.sh\n#!/bin/bash\ngreet\ngreet() {\n    echo \"Hello\"\n}\ngreet\n$ ./early.sh\n./early.sh: line 2: greet: command not found\nHello"},{"type":"check","q":"Why is `say() {echo hi; }` a syntax error?","a":"There is no space or newline after `{`, so Bash reads `{echo` as one word instead of seeing the brace that opens the body."},{"type":"md","text":"### Arguments: `$1`, `$#`, `$@` inside a function\n\nFunction parameters have **no names**. While a function runs, the positional parameters `$1`, `$2`, ..., `$#` and `$@` are **temporarily replaced** by the function's own arguments. When the function returns, the script's arguments are back. Calling a function with the wrong number of arguments is not an error (missing ones are just empty), exactly like a script."},{"type":"code","code":"$ cat params.sh\n#!/bin/bash\nshow() {\n    echo \"$# arguments: 1=[$1] 2=[$2]\"\n}\nshow\nshow a\nshow a \"b c\" d\necho \"script has $# arguments, \\$1 is $1\"\n$ ./params.sh X Y Z\n0 arguments: 1=[] 2=[]\n1 arguments: 1=[a] 2=[]\n3 arguments: 1=[a] 2=[b c]\nscript has 3 arguments, $1 is X"},{"type":"md","text":"Inside a function you **cannot see the script's `$1`**. If the function needs the script's arguments, pass them in: `fname \"$@\"` (quoted, so arguments with spaces stay whole)."},{"type":"check","q":"Inside a function, what does `$1` mean?","a":"The first argument passed **to the function** (not the script's first argument). `$#` is the number of arguments passed to the function."},{"type":"md","text":"### Exit status and `return`\n\nA function sets an **exit status**, just like a command:\n\n- by default, the exit status of the **last command** it ran, or\n- explicitly with `return n`, which stops the function immediately.\n\nThe status is always 0-255: `return n` keeps only the lowest 8 bits of *n* (so `return 256` gives 0 and `return 300` gives 44). Read it with `$?` right after the call, or use the call directly as the test of an `if` or `while`:"},{"type":"code","code":"is_int() {\n    if [[ $1 =~ ^[-+]?[0-9]+$ ]]; then\n        return 0\n    else\n        return 1\n    fi\n}\nis_int 42; echo \"42 -> $?\"\nis_int 4x; echo \"4x -> $?\"\nif is_int -7; then echo \"-7 is an int\"; fi","caption":"is_int is from max.sh. 0 means true (success)."},{"type":"code","code":"42 -> 0\n4x -> 1\n-7 is an int","caption":"Output"},{"type":"code","code":"f() { return 300; }\nf; echo $?","caption":"300 does not fit in 8 bits: 300 - 256 = 44."},{"type":"code","code":"44","caption":"Output"},{"type":"pitfall","text":"`return` is **not** a way to hand back a result like 1000 or a string. Use it only for success/failure. Also don't confuse `return` with `exit`: `exit` inside a function ends the **whole script**."},{"type":"code","code":"$ cat quit.sh\n#!/bin/bash\nstop() {\n    exit 3\n}\necho before\nstop\necho after\n$ ./quit.sh; echo \"status $?\"\nbefore\nstatus 3","caption":"'after' never prints."},{"type":"check","q":"A function's last command is `return 257`. What is `$?` after the call?","a":"`1` (257 - 256). Only the lowest 8 bits are kept."},{"type":"md","text":"### Getting a value out of a function\n\nThere are two techniques.\n\n**1. Print it, and capture it with command substitution.** The function `echo`es the result; the caller writes `var=$(fname args)`. This is how `max.sh` works:"},{"type":"code","code":"#!/bin/bash\n\n# max.sh\n\n# prints the maximum of two integer arguments\n# prints the first integer if both values are equal\nmax2() {\n    if (( $1 >= $2 )); then\n        echo $1\n    else\n        echo $2\n    fi\n}\n\n# exits with 0 if argument is an integer, 1 otherwise\nis_int() {\n    if [[ $1 =~ ^[-+]?[0-9]+$ ]]; then \n        return 0\n    else\n        return 1\n    fi\n}\n\n\nif (( $# == 0 )); then \n    exit 1\nfi\nif is_int \"$1\"; then \n    hi=$1\nelse \n    exit 2\nfi\nwhile (( $# > 0 )); do\n    if is_int \"$1\"; then \n        hi=$(max2 $hi $1)\n    else\n        exit 2\n    fi\n    shift\ndone\necho $hi","caption":"scripts/functions/max.sh"},{"type":"code","code":"$ ./max.sh 1 5 7 4\n7\n$ ./max.sh; echo $?\n1\n$ ./max.sh 3 x; echo $?\n2"},{"type":"md","text":"The downside: `$( )` runs the function in a **subshell** (a copy of the shell), which is slow, and any variables the function sets are lost when the subshell ends.\n\n**2. Set a variable the caller can see.** Because of dynamic scoping (next section), a function can assign to an ordinary (non-local) variable and the caller reads it afterwards. `remax.sh` is `max.sh` rewritten so that `max2` stores its answer in `hi`:\n\n```bash\nmax2() {\n    if (( $1 >= $2 )); then\n        hi=$1\n    else\n        hi=$2\n    fi\n}\n...\n        max2 $hi $1        # instead of hi=$(max2 $hi $1)\n```"},{"type":"code","code":"$ ./remax.sh 5 10 1\n10"},{"type":"md","text":"Quiz 2 Q4's `minidx` used this second technique: it set a global variable `idx` that `sort` then used."},{"type":"why","q":"Why can't you get a result out of a function with `x=$(f)` if `f` returns its answer by setting a global variable?","a":"`$( )` runs `f` in a subshell. The variable is set in that copy of the shell and disappears when the subshell ends; also `$( )` captures only what `f` **prints**. Pick one technique: print + `$( )`, or set a variable + call `f` normally."},{"type":"check","q":"Function `double` prints twice its argument. Store `double 21`'s result in `x`.","a":"`x=$(double 21)`"},{"type":"md","text":"### Dynamic scoping\n\nBash uses **dynamic scoping**: the variables a function can see depend on **who called it**, not on where it is written. By default every variable is global: a function sees the caller's variables, and anything it assigns stays visible to the caller after it returns."},{"type":"code","code":"#!/bin/bash\n\n# dynamic_scope.sh\n\nf() {\n    echo \"  a at beginning of f()   = $a\"\n    a=\"f: hello\"\n    g\n    echo \"  a at end of f()         = $a\"\n    echo \"  b at end of f()         = $b\"\n}\n\ng() {\n    echo \"    a at beginning of g() = $a\"\n    b=\"g: goodbye\"\n    echo \"    a at end of g()       = $a\"\n}\n\na=\"hello\"\necho \"a before calling f()      = $a\"\nf\necho \"a after calling f()       = $a\"\necho \"b after calling f()       = $b\"","caption":"scripts/functions/dynamic_scope.sh"},{"type":"code","code":"$ ./dynamic_scope.sh\na before calling f()      = hello\n  a at beginning of f()   = hello\n    a at beginning of g() = f: hello\n    a at end of g()       = f: hello\n  a at end of f()         = f: hello\n  b at end of f()         = g: goodbye\na after calling f()       = f: hello\nb after calling f()       = g: goodbye"},{"type":"md","text":"Trace: the script sets `a`; `f` sees it and changes it; `g` (called by `f`) sees the changed `a` and **creates** `b`; `b` is then visible in `f` and in the main script.\n\n### `local` variables\n\nThis sharing can cause bugs. Here a function accidentally changes the loop counter `i`:"},{"type":"code","code":"some_function() {\n    i=100\n}\nfor (( i = 0; i < 10; i++ )); do\n    echo $i\n    some_function\ndone","caption":"Only one pass: some_function sets i to 100, then i++ makes 101, and 101 < 10 is false."},{"type":"code","code":"0","caption":"Output"},{"type":"md","text":"`local i=100` creates a **new** `i` that exists only while `some_function` runs, so the script's `i` is untouched:"},{"type":"code","code":"some_function() {\n    local i=100\n}\nfor (( i = 0; i < 3; i++ )); do\n    echo $i\n    some_function\ndone"},{"type":"code","code":"0\n1\n2","caption":"Output"},{"type":"md","text":"A `local` variable is still visible to any function that the declaring function **calls** (dynamic scoping again):"},{"type":"code","code":"some_function() {\n    local i=100\n    some_other_function\n}\nsome_other_function() {\n    echo \"some_other_function i = $i\"\n}\nfor (( i = 0; i < 2; i++ )); do\n    echo $i\n    some_function\ndone"},{"type":"code","code":"0\nsome_other_function i = 100\n1\nsome_other_function i = 100","caption":"Output"},{"type":"md","text":"Good habit: declare every helper variable in a function `local` (`local i j`, `local s=$1`) unless you deliberately use it to return a value."},{"type":"check","q":"What does `local` do?","a":"It creates a variable that belongs to the current function call (and is visible to functions it calls) and disappears when the function returns, so it cannot overwrite a variable of the same name in the caller."},{"type":"md","text":"### A file of functions and `source`\n\nA file can hold only function definitions (Assignment 3's `Q4.sh` had no shebang). `source ./funcs.sh` (or `. ./funcs.sh`) runs that file **in the current shell**, so its functions become defined there and you can call them, or use them from another script:"},{"type":"code","code":"$ cat funcs.sh\n# funcs.sh -- source me\nshout() {\n    echo \"$1!\"\n    return 5\n}\n$ source ./funcs.sh\n$ shout hello there\nhello!\n$ echo $?\n5"},{"type":"md","text":"Running `./funcs.sh` instead would define the functions in a **separate** process that ends immediately, so nothing would be defined in your shell."},{"type":"check","q":"Why must a file of functions be loaded with `source ./funcs.sh` rather than run with `./funcs.sh`?","a":"`source` runs the file in the **current** shell, so the functions stay defined there. `./funcs.sh` runs in a separate process; the definitions vanish when it ends."},{"type":"md","text":"### Key points\n\n- Define with `name() { ... }` before calling; space after `{`, `}` on its own line (or after `;`).\n- Call like a command: `name arg1 \"arg 2\"`. Inside, `$1`, `$#`, `$@` are the function's arguments; pass the script's with `name \"$@\"`.\n- `return n` sets the exit status (0-255, 0 = success); `exit` ends the whole script.\n- Results: `echo` it and capture with `var=$(name ...)`, or assign a global variable.\n- Variables are global and dynamically scoped; use `local` for helpers.\n- `source ./file.sh` loads a file of functions into the current shell."}]}],"flashcards":[{"id":"d6-fc-01","topic":"d6-arrays","front":"Create an array `arr` holding 1, 2 and 3.","back":"`arr=(1 2 3)` (spaces between elements, no commas, no spaces around `=`)"},{"id":"d6-fc-02","topic":"d6-arrays","front":"Copy all command line arguments into an array `arr`.","back":"`arr=(\"$@\")`"},{"id":"d6-fc-03","topic":"d6-arrays","front":"Get the element of `arr` at index `i`.","back":"`${arr[i]}` (braces required; `$i` also works inside the brackets)"},{"id":"d6-fc-04","topic":"d6-arrays","front":"Set the element of `arr` at index 3 to `x`.","back":"`arr[3]=x`"},{"id":"d6-fc-05","topic":"d6-arrays","front":"Number of elements in array `arr`?","back":"`${#arr[@]}` (or `${#arr[*]}`)"},{"id":"d6-fc-06","topic":"d6-arrays","front":"What does `${#arr}` (no `[@]`) give?","back":"The length of the **string** stored in `arr[0]`, not the number of elements."},{"id":"d6-fc-07","topic":"d6-arrays","front":"What does `$arr` (no index) expand to?","back":"The element at index 0, `${arr[0]}`."},{"id":"d6-fc-08","topic":"d6-arrays","front":"`arr=(red green)`: what does `echo $arr[1]` print?","back":"`red[1]`: `$arr` is element 0 and `[1]` is plain text. Use `${arr[1]}`."},{"id":"d6-fc-09","topic":"d6-arrays","front":"List the indexes used by `arr`.","back":"`${!arr[@]}`"},{"id":"d6-fc-10","topic":"d6-arrays","front":"`\"${arr[@]}\"` vs `\"${arr[*]}\"`?","back":"`\"${arr[@]}\"`: one word per element (spaces kept). `\"${arr[*]}\"`: one single word, all elements joined by spaces."},{"id":"d6-fc-11","topic":"d6-arrays","front":"What do unquoted `${arr[@]}` and `${arr[*]}` do to an element like `a dog`?","back":"Word splitting breaks it into two words, `a` and `dog`."},{"id":"d6-fc-12","topic":"d6-arrays","front":"Print all elements of `arr` on one line.","back":"`echo \"${arr[@]}\"`"},{"id":"d6-fc-13","topic":"d6-arrays","front":"Append the value of `x` to the end of `arr`.","back":"`arr+=(\"$x\")` (the parentheses are required)"},{"id":"d6-fc-14","topic":"d6-arrays","front":"What does `arr+=c` (no parentheses) do?","back":"Appends the text `c` to the string in `arr[0]`; it does not add an element."},{"id":"d6-fc-15","topic":"d6-arrays","front":"Append all of `b`'s elements to `a`.","back":"`a+=(\"${b[@]}\")`"},{"id":"d6-fc-16","topic":"d6-arrays","front":"What is a sparse array?","back":"An array whose indexes have gaps, e.g. `arr=([1]=x [100]=y)`: 2 elements, indexes 1 and 100."},{"id":"d6-fc-17","topic":"d6-arrays","front":"Where does `arr+=(v)` put `v` in a sparse array?","back":"At (largest index in use) + 1, not in a gap."},{"id":"d6-fc-18","topic":"d6-arrays","front":"Read each line of `file` into array `lines`.","back":"`mapfile -t lines < file` (`-t` strips the newlines; `readarray` is the same command)"},{"id":"d6-fc-19","topic":"d6-arrays","front":"Read the words of one line typed by the user into array `arr`.","back":"`read -a arr` (or `read -p \"prompt\" -a arr`)"},{"id":"d6-fc-20","topic":"d6-arrays","front":"Swap `arr[i]` and `arr[j]`.","back":"`tmp=${arr[i]}; arr[i]=${arr[j]}; arr[j]=$tmp`"},{"id":"d6-fc-21","topic":"d6-arrays","front":"Delete the whole array variable `arr`.","back":"`unset arr`"},{"id":"d6-fc-22","topic":"d6-loops","front":"`while` vs `until`?","back":"`while` loops while the test command succeeds (status 0); `until` loops while it fails (stops when it succeeds)."},{"id":"d6-fc-23","topic":"d6-loops","front":"Write a while loop that prints 1 to 5.","back":"`i=1; while (( i <= 5 )); do echo $i; (( i++ )); done`"},{"id":"d6-fc-24","topic":"d6-loops","front":"Syntax of a C-style for loop counting i from 0 to n-1.","back":"`for (( i = 0; i < n; i++ )); do ... done`"},{"id":"d6-fc-25","topic":"d6-loops","front":"Loop over each command line argument.","back":"`for arg in \"$@\"; do ... done`"},{"id":"d6-fc-26","topic":"d6-loops","front":"Why must `$@` be quoted in `for arg in \"$@\"`?","back":"Unquoted, each argument is word-split, so `\"a b\"` becomes two iterations (see `bad_for_each_arg.sh`)."},{"id":"d6-fc-27","topic":"d6-loops","front":"What does `shift` do?","back":"Moves the positional parameters left by one (`$2` becomes `$1`, ...), drops the old `$1`, and decreases `$#` by 1."},{"id":"d6-fc-28","topic":"d6-loops","front":"Process arguments with `while` and `shift`.","back":"`while (( $# > 0 )); do echo \"$1\"; shift; done`"},{"id":"d6-fc-29","topic":"d6-loops","front":"`for f in *.pdf` when no `.pdf` files exist?","back":"The body runs once with `f` set to the literal text `*.pdf`."},{"id":"d6-fc-30","topic":"d6-loops","front":"Guard a glob loop against the no-match case.","back":"First line of the body: `[[ -e $f ]] || continue` (or `shopt -s nullglob` before the loop)."},{"id":"d6-fc-31","topic":"d6-loops","front":"Loop over the subdirectories of the current directory.","back":"`for d in */; do ... done` (each `d` ends with `/`, e.g. `stu1/`)"},{"id":"d6-fc-32","topic":"d6-loops","front":"Loop over the characters of string `s`.","back":"`for (( i = 0; i < ${#s}; i++ )); do c=${s:i:1}; ... done`"},{"id":"d6-fc-33","topic":"d6-loops","front":"`break` vs `continue`?","back":"`break` exits the loop; `continue` skips to the next iteration. `break 2` / `continue 2` act on an outer loop."},{"id":"d6-fc-34","topic":"d6-loops","front":"Read the file named in `$file` one line at a time.","back":"`while read -r line; do ...; done < \"$file\"`"},{"id":"d6-fc-35","topic":"d6-loops","front":"Why `-r` in `read -r`?","back":"So backslashes in the input are kept as ordinary characters."},{"id":"d6-fc-36","topic":"d6-loops","front":"Split comma-separated lines into fields while reading.","back":"`while IFS=\",\" read -r a b c; do ...; done < \"$file\"`"},{"id":"d6-fc-37","topic":"d6-loops","front":"Why is `for i in $(seq 1 10)` discouraged in the course?","back":"It starts a separate process (`seq`) just to count; a C-style `for (( ))` loop does it in the shell."},{"id":"d6-fc-38","topic":"d6-functions","front":"Course syntax to define a function `greet`.","back":"`greet() {` newline, commands, newline `}`"},{"id":"d6-fc-39","topic":"d6-functions","front":"What are the brace rules for a function body?","back":"A space or newline after `{`; the `}` must start a new command (its own line, or after `;`)."},{"id":"d6-fc-40","topic":"d6-functions","front":"What happens if you call a function before its definition in a script?","back":"`command not found`: the definition has not run yet."},{"id":"d6-fc-41","topic":"d6-functions","front":"Inside a function, what are `$1` and `$#`?","back":"The function's own first argument and its number of arguments (the script's are hidden until it returns)."},{"id":"d6-fc-42","topic":"d6-functions","front":"Call function `f` with all of the script's arguments.","back":"`f \"$@\"`"},{"id":"d6-fc-43","topic":"d6-functions","front":"What is a function's exit status if it has no `return`?","back":"The exit status of the last command it ran."},{"id":"d6-fc-44","topic":"d6-functions","front":"What range can `return n` produce?","back":"0-255 (lowest 8 bits of n); `return 256` gives 0."},{"id":"d6-fc-45","topic":"d6-functions","front":"`return` vs `exit` inside a function?","back":"`return` ends the function; `exit` ends the whole script."},{"id":"d6-fc-46","topic":"d6-functions","front":"Two ways to get a value out of a Bash function.","back":"1. `echo` it and capture with `var=$(f args)`. 2. Assign a non-local (global) variable that the caller reads."},{"id":"d6-fc-47","topic":"d6-functions","front":"What is dynamic scoping?","back":"A function sees the variables of whoever called it (and their callers); variables it sets are visible to the caller afterwards unless `local`."},{"id":"d6-fc-48","topic":"d6-functions","front":"What does `local x=5` do?","back":"Creates `x` only for this function call (and functions it calls), leaving any caller's `x` untouched."},{"id":"d6-fc-49","topic":"d6-functions","front":"Load the functions in `funcs.sh` into the current shell.","back":"`source ./funcs.sh` (or `. ./funcs.sh`)"},{"id":"d6-fc-50","topic":"d6-functions","front":"Use function `is_int` as a condition.","back":"`if is_int \"$1\"; then ... fi` (true when it returns 0)"}],"quiz":[{"id":"d6-q-01","topic":"d6-arrays","type":"mcq","q":"Which line creates an array `arr` holding the three values 1, 2 and 3?","options":["`arr=(1 2 3)`","`arr=(1, 2, 3)`","`arr=[1 2 3]`","`arr = (1 2 3)`"],"answer":0,"explain":"Elements go in parentheses separated by spaces. Commas would become part of the elements (`1,`), square brackets do not make an array, and spaces around `=` make Bash run `arr` as a command."},{"id":"d6-q-02","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=(10 20 30)\necho \"${#arr[@]}\"\necho \"${arr[1]}\"","answer":"3\n20","explain":"`${#arr[@]}` is the number of elements (3). Indexes start at 0, so index 1 is the second element, 20."},{"id":"d6-q-03","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=(red green blue)\necho $arr\necho $arr[2]","answer":"red\nred[2]","explain":"`$arr` alone means element 0. In `$arr[2]` only `$arr` is expanded; `[2]` is plain text. You need `${arr[2]}` to get `blue`."},{"id":"d6-q-04","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=([3]=c [7]=g)\narr+=(h)\necho \"${!arr[@]}\"\necho \"${#arr[@]}\"","answer":"3 7 8\n3","explain":"The array is sparse: indexes 3 and 7. Appending puts `h` after the largest index, at 8. There are 3 elements, even though the largest index is 8."},{"id":"d6-q-05","topic":"d6-arrays","type":"output","q":"What does this print?","code":"pets=(\"a dog\" \"a cat\")\nfor x in \"${pets[@]}\"; do echo \"<$x>\"; done\nfor x in \"${pets[*]}\"; do echo \"<$x>\"; done\nfor x in ${pets[@]}; do echo \"<$x>\"; done","answer":"<a dog>\n<a cat>\n<a dog a cat>\n<a>\n<dog>\n<a>\n<cat>","explain":"Quoted `@`: one word per element (2 passes). Quoted `*`: one single word (1 pass). Unquoted: word splitting gives 4 words (4 passes)."},{"id":"d6-q-06","topic":"d6-arrays","type":"mcq","q":"Array `files` holds filenames, some containing spaces. Which loop visits each filename exactly once?","options":["`for f in ${files[@]}; do`","`for f in \"${files[*]}\"; do`","`for f in \"${files[@]}\"; do`","`for f in \"$files\"; do`"],"answer":2,"explain":"`\"${files[@]}\"` expands to one quoted word per element. Unquoted `@` splits names at spaces; quoted `*` gives one big word; `\"$files\"` is only element 0."},{"id":"d6-q-07","topic":"d6-arrays","type":"output","q":"What does this print?","code":"arr=(a b)\narr+=c\narr+=(d)\necho \"${arr[@]}\"\necho \"${#arr[@]}\"","answer":"ac b d\n3","explain":"`arr+=c` without parentheses appends the text `c` to element 0, making `ac`. `arr+=(d)` adds a new element. So 3 elements: `ac`, `b`, `d`."},{"id":"d6-q-08","topic":"d6-arrays","type":"output","q":"The script `count.sh` is run as `./count.sh one \"two three\" four`. What does it print?","code":"#!/bin/bash\narr=(\"$@\")\necho \"${#arr[@]}\"\necho \"${arr[1]}\"\necho \"${arr[2]}\"","answer":"3\ntwo three\nfour","explain":"`arr=(\"$@\")` makes one element per argument, keeping `two three` whole. So there are 3 elements; index 1 is `two three` and index 2 is `four`."},{"id":"d6-q-09","topic":"d6-arrays","type":"output","q":"The file `colors.txt` contains three lines: `red`, `light green`, `blue`. What does this print?","code":"mapfile -t c < colors.txt\necho \"${#c[@]}\"\necho \"${c[1]}\"","answer":"3\nlight green","explain":"`mapfile -t` stores one line per element (spaces inside a line are kept) and strips the newlines. 3 lines give 3 elements; index 1 is the second line."},{"id":"d6-q-10","topic":"d6-arrays","type":"short","q":"Write the Bash lines that swap the elements at indexes `i` and `j` of the array `arr`.","answer":"```bash\ntmp=${arr[i]}\narr[i]=${arr[j]}\narr[j]=$tmp\n```","explain":"You need a temporary variable, otherwise the first assignment overwrites a value you still need. `${arr[$i]}` is equally fine."},{"id":"d6-q-11","topic":"d6-loops","type":"output","q":"What does this print?","code":"count=3\nwhile (( count > 0 )); do\n    echo $count\n    (( count-- ))\ndone\necho done","answer":"3\n2\n1\ndone","explain":"The body runs while `count > 0`: for 3, 2 and 1. When count reaches 0 the test fails and the loop ends."},{"id":"d6-q-12","topic":"d6-loops","type":"output","q":"What does this print?","code":"n=1\nuntil (( n > 20 )); do\n    n=$(( n * 3 ))\ndone\necho $n","answer":"27","explain":"`until` repeats while the test is false: n goes 1 -> 3 -> 9 -> 27. Now `27 > 20` is true, so the loop stops."},{"id":"d6-q-13","topic":"d6-loops","type":"output","q":"What does this print?","code":"s=hello\nr=\"\"\nfor (( i = ${#s} - 1; i >= 0; i-- )); do\n    r=$r${s:i:1}\ndone\necho $r","answer":"olleh","explain":"i runs from 4 down to 0, and `${s:i:1}` is the character at index i, so the characters are appended in reverse order."},{"id":"d6-q-14","topic":"d6-loops","type":"output","q":"The script `n.sh` is run as `./n.sh \"a b\" c`. What does it print?","code":"#!/bin/bash\nn=0\nfor arg in $@; do (( n++ )); done\nm=0\nfor arg in \"$@\"; do (( m++ )); done\necho \"$n $m\"","answer":"3 2","explain":"Unquoted `$@` is word-split into `a`, `b`, `c` (3 passes). Quoted `\"$@\"` keeps the 2 arguments whole (2 passes)."},{"id":"d6-q-15","topic":"d6-loops","type":"output","q":"The current directory contains only `notes.txt` and `todo.txt`. What does this print?","code":"for f in *.pdf; do\n    echo \"found $f\"\ndone\nfor f in *.txt; do\n    echo \"found $f\"\ndone","answer":"found *.pdf\nfound notes.txt\nfound todo.txt","explain":"No name matches `*.pdf`, so the glob stays as the literal text `*.pdf` and the first loop runs once with it. The second glob expands to the two `.txt` files in sorted order."},{"id":"d6-q-16","topic":"d6-loops","type":"mcq","q":"In `chext.sh`, why does the loop `for f in *.\"$1\"; do` start its body with `[[ -e $f ]] || continue`?","options":["To skip directories","Because when no file matches, `f` is the literal pattern, which does not exist","To skip files with spaces in their names","To make the loop run in sorted order"],"answer":1,"explain":"A glob with no match is left unchanged, so the body would run once with `f` equal to e.g. `*.txt`, and `mv` would fail. `-e` tests whether the name exists; if not, `continue` skips it. It has nothing to do with directories, spaces or sorting."},{"id":"d6-q-17","topic":"d6-loops","type":"output","q":"The script `s.sh` is run as `./s.sh a b c`. What does it print?","code":"#!/bin/bash\nwhile (( $# > 0 )); do\n    echo \"$#: $1\"\n    shift\ndone","answer":"3: a\n2: b\n1: c","explain":"Each `shift` removes the first argument and lowers `$#` by 1. The loop stops when `$#` reaches 0."},{"id":"d6-q-18","topic":"d6-loops","type":"output","q":"What does this print?","code":"for i in 1 2 3 4 5 6; do\n    if (( i % 2 == 0 )); then\n        continue\n    fi\n    if (( i > 4 )); then\n        break\n    fi\n    echo $i\ndone","answer":"1\n3","explain":"Even numbers are skipped by `continue`. 1 and 3 are printed. At 5, `i > 4` is true, so `break` ends the loop before 6."},{"id":"d6-q-19","topic":"d6-loops","type":"output","q":"The file `pairs.txt` contains the two lines `x,1` and `y,2`. What does this print?","code":"while IFS=\",\" read -r name num; do\n    echo \"$num-$name\"\ndone < pairs.txt","answer":"1-x\n2-y","explain":"`IFS=\",\"` makes `read` split each line at the comma: the first field goes in `name`, the rest in `num`. The loop reads one line per pass from the file redirected after `done`."},{"id":"d6-q-20","topic":"d6-loops","type":"short","q":"Write the first line of a `for` loop that visits each immediate subdirectory of the current directory.","answer":"`for d in */; do`","explain":"The glob `*/` matches only directories; each name ends with `/` (e.g. `stu1/`). Remember the no-match case: if there are no subdirectories, `d` is the literal `*/`, so guard with `[[ -d $d ]] || continue`."},{"id":"d6-q-21","topic":"d6-functions","type":"mcq","q":"Which function definition is a **syntax error**?","options":["`f() { echo hi; }`","`f() {echo hi; }`","`f() {` then `echo hi` and `}` on separate lines","`function f {` then `echo hi` and `}` on separate lines"],"answer":1,"explain":"`{` must be followed by a space or newline; in `{echo` Bash sees one word. The `function f` form is legal (though the course uses `f()`), and the one-line form works because of the `;` before `}`."},{"id":"d6-q-22","topic":"d6-functions","type":"output","q":"What does this print?","code":"show() {\n    echo \"$#:$1\"\n}\nshow a \"b c\"\nshow\nshow \"x y\"","answer":"2:a\n0:\n1:x y","explain":"Inside a function `$#` and `$1` refer to the function's own arguments. With no arguments `$1` is empty."},{"id":"d6-q-23","topic":"d6-functions","type":"output","q":"The script `p.sh` is run as `./p.sh X`. What does it print?","code":"#!/bin/bash\nf() {\n    echo \"in f: $1\"\n}\nf Y\necho \"in script: $1\"","answer":"in f: Y\nin script: X","explain":"While `f` runs, `$1` is `f`'s argument (`Y`). After it returns, the script's own `$1` (`X`) is back."},{"id":"d6-q-24","topic":"d6-functions","type":"output","q":"What does this print?","code":"f() {\n    return 300\n}\nf\necho $?","answer":"44","explain":"An exit status is only 8 bits (0-255). 300 - 256 = 44."},{"id":"d6-q-25","topic":"d6-functions","type":"output","q":"What does this print?","code":"double() {\n    echo $(( $1 * 2 ))\n}\nx=$(double 21)\necho \"x=$x\"","answer":"x=42","explain":"The function prints its result; `$( )` captures that output into `x`."},{"id":"d6-q-26","topic":"d6-functions","type":"output","q":"What does this print?","code":"g() {\n    echo \"g sees $v\"\n    v=changed\n}\nf() {\n    local v=inner\n    g\n    echo \"f has $v\"\n}\nv=outer\nf\necho \"main has $v\"","answer":"g sees inner\nf has changed\nmain has outer","explain":"Dynamic scoping: `g` is called by `f`, so it sees `f`'s local `v` (`inner`) and its assignment changes that local `v`. The main script's `v` was never touched, so it is still `outer`."},{"id":"d6-q-27","topic":"d6-functions","type":"output","q":"What does this print?","code":"f() {\n    i=100\n}\nfor (( i = 0; i < 3; i++ )); do\n    echo $i\n    f\ndone\necho \"after: $i\"","answer":"0\nafter: 101","explain":"`f` has no `local`, so it changes the loop's `i` to 100. Then `i++` makes it 101, `101 < 3` is false, and the loop ends after one pass."},{"id":"d6-q-28","topic":"d6-functions","type":"mcq","q":"A function `check` runs `exit 1` when it finds a problem. What happens when a script calls `check` and the problem is found?","options":["The function stops and `$?` is 1","The whole script stops with exit status 1","Nothing: `exit` is not allowed in a function","The function stops and `$?` is 0"],"answer":1,"explain":"`exit` always ends the whole script (the current shell). To stop only the function and set its status, use `return 1`."},{"id":"d6-q-29","topic":"d6-functions","type":"short","q":"Inside a script, show how to call the function `process` so that it receives all of the script's command line arguments.","answer":"`process \"$@\"`","explain":"Inside `process`, `$1`, `$2`, ... are then the script's arguments. Quote `$@` so arguments with spaces stay whole."},{"id":"d6-q-30","topic":"d6-functions","type":"output","q":"The file `lib.sh` contains\n\n```bash\nok() {\n    echo \"checking $1\"\n    [[ $1 == yes ]]\n}\n```\n\nWhat does this print?","code":"source ./lib.sh\nok yes; echo $?\nok no; echo $?","answer":"checking yes\n0\nchecking no\n1","explain":"`source` defines `ok` in the current shell. With no `return`, the function's status is the status of its last command, the `[[ ]]` test: 0 for `yes`, 1 otherwise."}],"write":[{"id":"d6-w-01","topic":"d6-functions","stage":"worked","marks":10,"prompt":"*(Quiz 2, 2023, Q4, 10 marks.)* The **selection sort** algorithm sorts an array `arr` of `n` integers:\n\n```\nfor j = 0, 1, 2, ..., n-1\n    idx = minidx(j)\n    swap arr[j] and arr[idx]\n```\n\n`minidx(j)` finds the index of the minimum element of `arr` from index `j` to the end. For `arr` = `[0, 3, 1, 4, 2]`: `minidx(0)` is 0, `minidx(1)` is 2, `minidx(2)` is 2, `minidx(3)` is 4, `minidx(4)` is 4.\n\nComplete the script so that it sorts its command line arguments (always integers) with selection sort, using functions `sort` and `minidx`, and prints the sorted elements on a single line. The script already contains:\n\n```bash\narr=(\"$@\")\nsort\n```\n\nYou choose how to call `minidx` and how it returns its value. No error checking is required. (The quiz wrote `function sort {`; `sort() {` is the course style and equally correct.)","starter":"","solution":"#!/bin/bash\n\n# minidx START\n# sets the global variable idx to the index of the smallest\n# element of arr from index START to the end of arr\nminidx() {\n    local i\n    idx=$1\n    for (( i = $1 + 1; i < n; i++ )); do\n        if (( arr[i] < arr[idx] )); then\n            idx=$i\n        fi\n    done\n}\n\n# sort: selection sort of the global array arr\nsort() {\n    local j tmp\n    n=${#arr[@]}\n    for (( j = 0; j < n; j++ )); do\n        minidx \"$j\"\n        tmp=${arr[j]}\n        arr[j]=${arr[idx]}\n        arr[idx]=$tmp\n    done\n}\n\n# places the command line arguments into arr and calls sort\narr=(\"$@\")\nsort\n\n# print the sorted elements of arr on a single line\necho \"${arr[@]}\"","explain":"**Plan.** Two functions share the global array `arr` (dynamic scoping: every function sees the script's variables).\n\n**`sort`.** First compute `n=${#arr[@]}`, the number of elements; `minidx` will see `n` too because it is not `local`. The C-style loop runs `j` from 0 to n-1. Each pass calls `minidx \"$j\"` and then swaps `arr[j]` with `arr[idx]` using a temporary variable `tmp`. Without `tmp`, the first assignment would destroy a value we still need.\n\n**`minidx`.** Its argument `$1` is the start index. It assumes the smallest is at the start (`idx=$1`), then the loop checks every later index `i`; when `arr[i]` is smaller than the current best `arr[idx]`, it remembers `i`. Inside `(( ))` array elements can be written `arr[i]` without `$` or braces.\n\n**Returning the index.** `return` cannot be used: it only gives an exit status (0-255, and 0 means success). Instead `minidx` sets the **global variable `idx`**, like `max2` in `remax.sh`. The other correct way: `minidx` ends with `echo \"$idx\"` and `sort` writes `idx=$(minidx \"$j\")`.\n\n**`local`.** `i`, `j` and `tmp` are local so the two loops cannot overwrite each other's counters (the `some_function` bug from the notebook). If both functions used a global `i`, `minidx` would change `sort`'s loop variable.\n\n**Printing.** `echo \"${arr[@]}\"` prints all elements separated by single spaces on one line.\n\nTrace for `./sort.sh 0 3 1 4 2`: j=0 leaves 0 in place; j=1 swaps 3 with the 1 at index 2; j=2 swaps 3 with the 2 at index 4
